    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: incident-cost
    missingEvidence: >-
      Verified affected-device scope, Ledger-funded remediation, customer compensation, returns, insurance recoveries,
      channel audits, and post-incident demand impact.
    whyItMatters: >-
      An unverified loss estimate is not a Ledger expense, but the event could affect support cost, channel economics,
      conversion, and trust.
    diligencePath: >-
      Review the incident report, retailer audit, insurance notices, remediation ledger, return cohorts, and
