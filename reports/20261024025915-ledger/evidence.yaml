    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, runway, debt and covenants, working-capital requirements, planned use of funds, and
      next-round trigger.
    whyItMatters: Funding raised and possible IPO proceeds are not cash available and cannot establish financing dependency.
    diligencePath: >-
      Request a current cash ledger, debt schedule, thirteen-week cash forecast, twelve-month operating forecast, and
