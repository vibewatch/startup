    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cost-structure
    missingEvidence: >-
      Bill of materials, manufacturing and freight cost, inventory reserves, returns, warranty, security engineering,
