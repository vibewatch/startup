evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership
    missingEvidence: A complete current founder, executive, and board roster with roles, backgrounds, and ownership.
    whyItMatters: >-
      Key-person dependence and governance quality cannot be assessed from one CEO reference and an incomplete
      assigned-pool enumeration.
    diligencePath: Request the current organization chart, board materials, executive biographies, and founder ownership schedule.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: Audited 2025 revenue, 2026 run-rate, gross margin, recurring revenue, debt, and cash position.
    whyItMatters: >-
      Triple-digit-million revenue and a possible IPO valuation do not establish profitability, cash availability, or
      valuation support.
    diligencePath: >-
      Obtain audited financial statements, management accounts, segment KPIs, debt schedules, and IPO-registration
      materials if filed.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: A reconciled definition and date for customers, devices sold, active users, and employee count.
    whyItMatters: The assigned figures use different denominators and may describe different periods or legal-entity scopes.
    diligencePath: Request KPI definitions, period-end reconciliations, and legal-entity scope for each operating metric.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: incidents
    missingEvidence: >-
      Incident-response records and quantified customer, churn, conversion, and remediation impact for the 2020, 2023,
      and 2026 events.
    whyItMatters: The absence of a publicly confirmed remote key extraction does not quantify ecosystem trust or commercial damage.
    diligencePath: >-
      Request post-incident reports, affected-user counts, control changes, claims history, and retention or conversion
      analyses.
    relatedQuestionRefs:
      - QO007
      - QO010
  - type: stale
    severity: minor
    topic: IPO
    missingEvidence: Current status, mandate, timing, venue, dilution, and pricing of any Ledger IPO or financing.
    whyItMatters: A reported possible listing is not a completed financing and may change with crypto-market or macro conditions.
    diligencePath: Check current exchange, regulator, and company disclosures before using the reported valuation as a live metric.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: company-sizing-gap
    missingEvidence: >-
      Ledger revenue by hardware, wallet services, recovery, and enterprise; active-device cohorts; average selling
      prices; conversion; retention; and weighted enterprise pipeline.
    whyItMatters: >-
      Without company-level mix and conversion evidence, a market forecast cannot be translated into a defensible Ledger
      SAM, SOM, or recurring-revenue multiple.
    diligencePath: >-
      Request audited segment revenue, shipment and activation cohorts, service attachment and churn, regional mix,
      channel sell-through, and enterprise pipeline data.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: A second independent hardware-wallet market estimate with transparent methodology, units, and historical actuals.
    whyItMatters: >-
      The retained market-size series comes from one commercial publisher and cannot establish estimate dispersion or
      forecast reliability.
    diligencePath: >-
      Obtain the full market-study methodology and triangulate it against manufacturer shipments, customs data, channel
      sell-through, and public competitor disclosures.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Ledger-specific procurement evidence identifying budget owner, sales cycle, win rate, and deployment size by
      retail, treasury, custodian, and market-infrastructure segment.
    whyItMatters: Role-based buyer mapping does not reveal which segment can support durable revenue or how quickly demand converts.
    diligencePath: >-
      Review customer contracts, pipeline stage data, enterprise references, procurement records, and channel partner
      sell-through by segment.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable current list and realized pricing for Trezor, BitBox02, Coldcard, SafePal and ELLIPAL.
    whyItMatters: Without competitor prices, Ledger's tiering cannot be tested for value or price pressure.
    diligencePath: >-
      Collect dated official checkout pages for each named competitor and separate list price from bundles, taxes and
      services.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: scale
    missingEvidence: Comparable competitor shipments, active users, revenue or market-share measures.
    whyItMatters: Tracxn rankings and product reviews do not establish relative commercial scale.
    diligencePath: Obtain competitor filings, audited disclosures, channel checks or procurement references.
    relatedQuestionRefs:
      - QP002
      - QP008
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: material
    topic: trust
    missingEvidence: Independent incident scope, affected-device count and verified loss data for reported Ledger supply-chain events.
    whyItMatters: >-
      The assigned incident report explicitly says Ledger has not confirmed how many devices were compromised or whether
      thefts occurred outside CryptoBilis.
    diligencePath: >-
      Review Ledger incident notices, retailer disclosures, law-enforcement or forensic reports and affected-user
      evidence.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: minor
    topic: switching
    missingEvidence: Observed migration, multi-homing and retention behavior by custody workflow.
    whyItMatters: Workflow-based switching-cost analysis is currently inferred from product design rather than customer behavior.
    diligencePath: Interview buyers and channels and request cohort-level retention or device replacement data.
    relatedQuestionRefs:
      - QP005
  - type: private-evidence-only
    severity: material
    topic: segment-financials
    missingEvidence: >-
      Audited 2024-2026 revenue by hardware, wallet services, Recover, and enterprise, including recognition policies
      and gross margin.
    whyItMatters: Broad revenue bands cannot establish recurring mix, revenue quality, profitability, or cash conversion.
    diligencePath: >-
      Request audited statements and a segment bridge from billings to recognized revenue, gross profit, operating
      profit, and cash flow.
