    whyItMatters: User-facing charges and product descriptions do not reveal Ledger's net revenue or contribution margin.
    diligencePath: >-
      Obtain price books, channel agreements, provider contracts, subscriber cohorts, ACV schedules, and
      gross-versus-net accounting memos.
