company:
  name: Ledger
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Ledger's public product surface spans consumer hardware signers, the Ledger Wallet
    software ecosystem, optional recovery, developer APIs, and an enterprise custody
    platform. The core device-signing model is well described, but current reliability,
    independent certification, roadmap, and supply-chain evidence remain insufficient
    for a high-confidence technical underwriting conclusion.
sections:
  - id: product-surface
    title: Product surface and customer jobs
    body: >-
      Ledger addresses two related workflows: individuals keep private keys off a
      general-purpose computer while approving transactions on a dedicated device, and
      institutions apply similar self-custody principles through an enterprise platform.
      Public reporting and market profiles identify Nano devices, Stax, Flex, Ledger
      Wallet or its earlier Ledger Live name, Recover, and enterprise custody products,
      but the evidence vintages differ and should not be read as a current SKU catalog.
      A January 2026 AllUnity announcement is concrete customer-issued evidence that
      Ledger Enterprise was selected for EURAU custody. It proves a named deployment
      decision, not production uptime, transaction volume, service levels, or independent
      security performance.
    claimRefs: [CE001, CE002, CE005, CE006]
    tableRefs: [TE001, TE002]
  - id: architecture-and-developer-surface
    title: Architecture and developer surface
    body: >-
      The documented architecture separates transaction preparation from signing.
      A host computer or phone prepares the action, while a secure element stores key
      material and the device screen and controls provide a separate approval surface.
      This design raises the cost of direct key extraction, but it does not eliminate
      malicious integrations, user approval errors, firmware trust, or physical
      distribution risk. Ledger's GitHub organization adds tangible developer signal:
      it describes a JavaScript monorepo, a Wallet API ecosystem, and chain-specific
      applications. The assigned snapshot does not expose activity metrics, however,
      so it cannot establish current maintenance velocity, contributor breadth, package
      adoption, or release discipline.
    claimRefs: [CE002, CE003, CE004, CE014, CE016]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-differentiation
    title: Maturity, differentiation, and roadmap signals
    body: >-
      Differentiation rests on the combined hardware and software control plane rather
      than on the secure element alone. Third-party material reports a CSPN certificate
      for Nano Gen5, while an independent company-data page reproduces registrations for
      Ledger OS, Nano, Flex, Stax, Recover, Ledger AI, and Ledger Atom marks. Neither
      source substitutes for the primary certificate, release notes, supported-device
      matrix, or shipment evidence. The broad Wealth Mosaic result is useful only as
      category context and supplies no Ledger-specific architecture or benchmark.
      Current roadmap sequencing, product availability, integration compatibility, and
      end-of-support policy therefore remain diligence items rather than established
      facts.
    claimRefs: [CE006, CE007, CE013, CE015]
  - id: trust-boundary
    title: Trust, recovery, and operational risk
    body: >-
      Ledger's trust boundary extends beyond the signer. Recover adds encrypted,
      identity-linked recovery material held across three providers; that can reduce
      loss-of-seed risk while adding third-party, privacy, and legal dependencies.
      Independent reviews also describe the 2023 Connect Kit compromise and 2026
      customer-order data exposure, while October 2026 reporting raised a separate
      physical-distribution concern involving tampered devices at multiple retailers.
      Those events should not be collapsed into a claim that device private keys were
      remotely extracted, but they show that software packages, commerce partners,
      resellers, and user verification are part of product security. The assigned
      evidence does not quantify incident rates, affected-device denominators, recovery
      success, support response, or enterprise availability.
    claimRefs: [CE008, CE009, CE010, CE011, CE012, CE013, CE014]
