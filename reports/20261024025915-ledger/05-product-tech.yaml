      - [Ledger Recover, User prioritizing recoverability, "Optional paid service described by two security reviews", "Encrypted three-provider recovery with identity verification", "Independent audit, recovery success, jurisdiction, and subpoena handling"]
      - [Ledger Enterprise, Institutional treasury or custody operator, "Named AllUnity selection announced in January 2026", "Governed self-custody workflow for institutional assets", "Production volume, SLA, audit scope, customer concentration, and incident history"]
      - [Wallet API and application repositories, Wallet and blockchain developer, "Company GitHub describes a Wallet API ecosystem and chain applications", "Public integration surface around Ledger Wallet", "Stars, contributors, releases, package downloads, and deprecation policy"]
    notes: >-
      Product status is compiled from sources of different vintages; a trademark,
      profile listing, repository description, or customer announcement does not by
      itself prove current general availability, production scale, or performance.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE008, CE016]
  - id: TE002
    title: Workflow and use-case assessment
    columns:
      - User job
      - Current workflow
      - Ledger solution
      - Supported benefit
      - Limitation
    rows:
      - [Create and hold keys, "Generate seed and keys on dedicated hardware", "Signer secure element", "Key material is separated from the host device", "Recovery phrase handling remains a user-controlled failure point"]
      - [Approve a transaction, "Host prepares; signer displays and signs after physical approval", "Device screen and controls", "Separates signing from a potentially compromised computer or phone", "Users can still approve malicious or misunderstood transactions"]
      - [Manage assets and integrations, "Use Ledger Wallet and third-party services", "Ledger Wallet plus Wallet API", "Consolidates portfolio and transaction functions", "Integration breadth increases software and dependency attack surface"]
      - [Recover after loss, "Re-enter an offline phrase or subscribe to Recover", "Ledger Recover", "Adds an identity-verified recovery path", "Introduces custodians, online transfer, privacy, and legal dependencies"]
      - [Operate institutional custody, "Apply policy-controlled self-custody to organizational assets", "Ledger Enterprise", "Named EURAU customer selection supports workflow relevance", "No assigned SLA, throughput, audit, or realized outcome evidence"]
      - [Acquire a trusted device, "Buy directly or through a reseller and verify setup", "Commerce and reseller channel", "Broader distribution can improve access", "October 2026 tampering reports leave affected scope and control effectiveness unresolved"]
    notes: >-
      Benefits describe the mechanism supported by assigned sources, not measured
      outcomes; unavailable reliability, adoption, and incident denominators are explicit
      limitations rather than zero values.
    claimRefs: [CE002, CE004, CE005, CE008, CE009, CE011, CE014]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Role
      - Dependency
      - Principal risk
    rows:
      - [Secure element, "Generate or hold keys and sign within an isolated chip", "Chip implementation and signed firmware", "Physical attack, firmware trust, or implementation defect"]
      - [Device OS and chain applications, "Isolate applications and interpret transactions", "BOLOS and maintained chain-specific applications", "Closed components and incomplete external auditability"]
      - [Trusted display and controls, "Show transaction details and capture physical approval", "User attention and accurate transaction decoding", "Blind signing, social engineering, or display limitations"]
      - [Ledger Wallet and Wallet API, "Prepare transactions and connect services or applications", "Host OS, package supply chain, integrations, and Ledger services", "Malicious dependency, compatibility break, outage, or privacy exposure"]
      - [Recover orchestration, "Create and restore encrypted recovery shares", "Ledger, Coincover, another provider, and identity verification", "Custodian, privacy, legal-process, or service-continuity failure"]
      - [Enterprise policy layer, "Apply organizational governance to custody workflows", "Enterprise software, customer controls, and operational support", "Unpublished SLA, throughput, audit coverage, and human-control failure"]
      - [Commerce and distribution, "Deliver devices and handle customer order data", "E-commerce providers, logistics, and resellers", "Tampering, metadata exposure, phishing, or weak chain of custody"]
    notes: >-
      This is an evidence-bounded operating model assembled from public descriptions;
      it is not a bill of materials, penetration test, certification scope, or complete
      data-flow diagram.
    claimRefs: [CE002, CE003, CE004, CE008, CE010, CE011, CE012, CE013, CE014]
figures:
  - id: FE001
    title: Product security and operating stack
    type: stack
    summary: >-
      Ledger's product value and risk accumulate across user intent, host software,
      device controls, recovery services, enterprise operations, and distribution.
    data:
      layers:
        - label: User intent and verification
          detail: The user selects an action and checks the destination, amount, and policy.
          items: [Transaction review, Physical approval]
        - label: Wallet and integration surface
          detail: Ledger Wallet, Wallet API, and external applications prepare and route actions.
          items: [Ledger Wallet, Wallet API and integrations]
        - label: Device application layer
          detail: Device OS and chain applications interpret requests before signing.
          items: [BOLOS, Chain applications]
        - label: Hardware trust anchor
          detail: Secure element and trusted display isolate keys and expose approval details.
          items: [Secure element, Device display and controls]
        - label: Recovery and enterprise services
          detail: Optional recovery providers and enterprise policy systems extend the workflow.
          items: [Ledger Recover providers, Ledger Enterprise policy]
        - label: Commerce and supply chain
          detail: E-commerce, logistics, and resellers affect privacy and physical authenticity.
          items: [Order-data processors, Distribution and resellers]
    approximationNotes: >-
      The stack is a qualitative dependency map; layer order does not represent measured
      security strength, latency, ownership, or value contribution.
    claimRefs: [CE002, CE003, CE005, CE008, CE010, CE011, CE012, CE016]
callouts:
  - calloutType: risk
    title: Device security is not ecosystem security
    body: >-
      The secure-element model can protect keys while package compromise, customer-data
      exposure, reseller tampering, or mistaken approvals still create loss and trust risk.
    claimRefs: [CE010, CE011, CE012, CE014]
