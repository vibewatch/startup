company:
  name: Ledger
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The clearest measurable core is the global hardware-wallet market, which one retained
    market study sizes at USD 0.72 billion in 2026 and forecasts at USD 2.25 billion in
    2031. Ledger also addresses institutional signing and digital-asset workflows, but
    transaction value, assets secured, and broad custody-software estimates are demand
    signals rather than additive revenue TAM, and the retained evidence cannot support a
    Ledger-specific SAM or SOM.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Ledger's measurable core market is hardware used to keep private keys offline and
      authorize transactions, spanning individual buyers and institutional or enterprise
      users. The adjacent software and services layer includes the companion wallet,
      recovery, transaction, staking, swap, and governance workflows attached to a device,
      but generic exchange, brokerage, and custody revenue should not be counted unless
      Ledger participates economically. Institutional tokenization is a relevant demand
      adjacency because it raises the need for wallet custody, governance, and signing
      controls; the value of tokenized transactions or assets under management is not
      Ledger revenue. Substitutes include exchange custody, software wallets, competing
      hardware devices, managed custodians, and internal multi-signature workflows. This
      boundary avoids converting broad crypto activity into a hardware-wallet TAM.
    claimRefs: [CM006, CM010, CM013, CM014, CM015]
    tableRefs: [TM001]
  - id: evidence-constrained-sizing
    title: Evidence-constrained sizing
    body: >-
      Research and Markets estimates the hardware-wallet market at USD 0.54 billion in
      2025, USD 0.72 billion in 2026, and USD 2.25 billion in 2031, with a stated 25.6%
      CAGR over 2026-2031. It also reports cold wallets at 63.19% of 2025 sales and North
      America at 38.95% of 2025 revenue. These are publisher estimates with methodology
      largely outside the fetched summary, so they are useful as a directional sizing
      lens rather than an audited market ledger. A separate report's claim that hardware
      wallet penetration remains below 15% lacks a visible denominator and methodology.
      Institutional DLT volumes show a larger adjacent need for secure authorization, but
      cannot be added to device-market revenue. No retained evidence isolates Ledger's
      serviceable share, product mix, average selling price, or obtainable revenue.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM013, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, budget owners, and adoption path
    body: >-
      Retail users buy devices directly and bear the cost themselves, with adoption
      typically triggered by concern about exchange or online-wallet exposure. PYMNTS
      reported roughly USD 2.2 billion of crypto stolen in the first half of 2025, already
      above all of 2024, while Ledger's chief executive linked a demand increase to more
      aggressive hacking. Institutional buyers instead require security, compliance,
      auditability, integration, and policy controls; budget ownership can sit with
      security, treasury, custody, or digital-asset operations. Trade-association evidence
      indicates that institutional DLT has moved from pilots toward live use cases, but
      adoption still depends on interoperability, custody standards, and integration with
      existing controls. Ledger's own claim of more than eight million devices shipped is
      evidence of reach, not a count of active users or recurring customers.
    claimRefs: [CM006, CM007, CM008, CM009, CM013, CM014]
    tableRefs: [TM003]
  - id: constraints-and-diligence
    title: Constraints and valuation relevance
    body: >-
      Security incidents can both stimulate category demand and damage vendor trust.
      Independent and competitor-issued reviews distinguish device-key security from
      phishing, software-integration, commerce, and supply-chain exposure; this means a
      secure element does not eliminate the broader customer journey's attack surface.
      Consumer friction also remains material: seed-phrase backup, firmware maintenance,
      address verification, incompatible recovery standards, and counterfeit-device risk
      can delay mainstream adoption. Ledger's shift from "hardware wallet" to "signer"
      seeks to make the use case broader and easier to understand, but it is a company
      positioning claim rather than independent proof of category expansion. Valuation
      should therefore be anchored to verified revenue mix, recurring-service attachment,
      active-device cohorts, enterprise pipeline, and gross margin, none of which the
      retained market evidence discloses.
    claimRefs: [CM010, CM011, CM012, CM014, CM016]
