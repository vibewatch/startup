callouts:
  - calloutType: recommendation
    title: Underwrite revenue evidence, not crypto value secured
    body: >-
      Treat hardware-market revenue as the measurable base and institutional DLT activity
      as a demand adjacency. Require Ledger segment revenue, active-device cohorts,
      recurring-service attachment, enterprise pipeline, and gross margin before assigning
      a company-specific SAM, SOM, or software-like multiple.
    claimRefs: [CM001, CM013, CM014, CM016]
