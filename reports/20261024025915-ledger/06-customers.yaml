      - ["Stablecoin yield integration", "5% to 9.9% yields described", "Publication date not displayed in fetched text", "Partner/industry report; yield is not Ledger revenue", "Adds a self-custody expansion surface", "Actual user uptake, realized yield, risk losses, and attachment"]
    notes: >-
