      - [Chorus One, Institutional, "Ledger Enterprise staking for ETH, SOL, DOT, and XTZ with validator operations", "Collaboration described; customer deployments not enumerated", "Combines governance and hardware-backed custody with staking infrastructure", "No assets, account count, or renewal disclosed"]
      - [Kiln, Consumer, "Stablecoin yield access through Ledger Live and DeFi protocols", "Integration described; adoption not quantified", "Extends wallet utility into self-custody yield generation", "Quoted yields are product-level rates, not realized customer returns"]
      - [Legacy Trust, Institutional, "Ledger Vault custody for Bitcoin and ERC-20 tokens", "AInvest describes a deployed custody solution; current production scale is not disclosed", "Provides named institutional use of Ledger custody infrastructure", "No account count, assets secured, revenue, or renewal disclosed"]
    enumerationScope:
      coverage: partial
      basis: >-
        Named counterparties and deployments visible in the assigned successful fetched sources for
        the 2026-10-24 customer chapter; private and undisclosed customers are outside the boundary.
    notes: >-
      This is a partial public enumeration, not a complete customer list. Partner announcements and
      syndicated reports do not prove production deployment, customer payment, or retention.
    claimRefs: [CU005, CU006, CU007, CU008]
