company:
  name: Ledger
chapter:
  number: 1
  title: Company Overview
  summary: Ledger is a crypto-security company founded in 2014 and headquartered in Paris whose hardware signers and software ecosystem target self-custody for retail and institutional users. The assigned evidence supports substantial historical funding, millions of devices or customers, and a possible US IPO, but public operating disclosure remains incomplete and its third-party and supply-chain incident history is material.
sections:
  - id: identity-and-business
    title: Identity and business model
    body: >-
      Ledger was founded in 2014 and is described in the assigned sources as a blockchain hardware-wallet company offering products such as Nano devices and a multi-authorization vault. Tracxn records Paris, France as its headquarters and classifies the company as Series C, while TheStreet describes Ledger as a French crypto hardware-wallet provider. The operating model visible in this evidence combines one-time or device-led hardware sales with Ledger Live and institutional custody or vault services; the evidence does not provide audited segment revenue, recurring-revenue mix, or a complete current product catalogue. Ledger's 2025 “signers” positioning and BIP32 path-isolation discussion indicate that security and transaction signing, rather than generic asset storage, are central to the value proposition. These facts establish a useful identity baseline, but later underwriting should distinguish company statements, third-party estimates, and independently verified financials.
    claimRefs: [CO001, CO002, CO003, CO004, CO016]
    tableRefs: [TO001]
  - id: scale-funding-and-stakeholders
    title: Scale, funding, and stakeholder structure
    body: >-
      The assigned evidence indicates meaningful scale but not a single reconciled operating KPI. CoinLaw reports more than 7 million devices sold and 7–8 million customers across 160-plus countries, while Tracxn reports $575 million of total funding across seven rounds and identifies a March 2023 $109 million round. These figures have different definitions and publication contexts, so they should not be combined into a customer-to-device conversion rate or treated as audited company data. TheStreet and Crypto Briefing report that Ledger generated triple-digit millions of revenue in 2025, but neither assigned source supplies audited statements, a period-end denominator, or a segment split. The funding and investor table therefore preserves the reported rounds and named investors while flagging the need for cap-table, preference, debt, and proceeds verification. Leadership evidence is thinner than financing evidence: Pascal Gauthier is identified as CEO, but the assigned pool does not establish a complete founder, board, or executive roster.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: milestones-and-risk-posture
    title: Milestones and material risk signals
    body: >-
      Ledger's trajectory includes the 2014 founding, major 2021 funding and unicorn milestone reported by Tracxn, a 2023 financing event, and a 2025–2026 push toward broader institutional and public-market relevance. At the same time, the evidence documents a recurring distinction between device-level key security and ecosystem risk. CNC Intel says there is no publicly confirmed remote extraction of private keys from Ledger devices, while also describing the 2020 customer-data leak, the 2023 Connect Kit compromise, and a reported January 2026 Global-e exposure. Freemindtronic presents a more adverse interpretation, grouping hardware, software, customer-data, and third-party incidents into a systemic supply-chain risk. The result is not proof that private keys were compromised, but a material diligence issue around customer targeting, software dependencies, incident response, and trust retention. A potential US IPO is also not a completed financing or valuation: the assigned reporting describes a possible listing above $4 billion, subject to change and market conditions.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
  - id: diligence-implications
    title: Ground truth for downstream diligence
    body: >-
      The strongest reusable ground truth is qualitative: Ledger has a recognized hardware-security position, a broad self-custody footprint, substantial historical venture backing, and a business exposed to both crypto-cycle demand and security-trust events. The most decision-relevant unknowns are audited 2025 revenue and 2026 run-rate, gross margin and recurring revenue by product line, current headcount, customer concentration and retention, the complete leadership and board map, and the terms or timing of any IPO or new financing. A future diligence pass should obtain primary corporate disclosures, current investor or filing materials, and incident-response documentation before converting the reported scale and valuation figures into cover metrics.
    claimRefs: [CO004, CO007, CO009, CO014, CO015]
