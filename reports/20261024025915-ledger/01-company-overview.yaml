  - calloutType: strength
    title: Security-led positioning
    body: "Ledger's central differentiation is a hardware-based self-custody and signing proposition, supported by a broad device footprint and institutional-security narrative."
    claimRefs: [CO002, CO003, CO005]
  - calloutType: risk
    title: Ecosystem risk remains material
    body: "The assigned evidence separates the absence of a publicly confirmed remote device-key extraction from recurring customer-data, software-supply-chain, and third-party exposure."
    claimRefs: [CO010, CO011, CO012, CO013]
  - calloutType: assumption
    title: Public-market claims are provisional
    body: "Reported triple-digit-million revenue and a possible valuation above $4B are not audited or completed transaction facts in the assigned evidence."
    claimRefs: [CO007, CO014, CO015]
