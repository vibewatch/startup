callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: Any independently verified recurrence of tampered devices, a material customer-data compromise, or a critical partner-control failure without timely remediation should break the current underwriting thesis until scope, losses, and controls are independently evidenced.
    claimRefs: [CR001, CR002, CR012]
  - calloutType: assumption
    title: Evidence boundary
    body: Reported loss estimates, risk ratings, and unverified financial disclosures are not treated as audited facts; the chapter preserves uncertainty and carries the exact diligence paths needed to close it.
    claimRefs: [CR002, CR011]
