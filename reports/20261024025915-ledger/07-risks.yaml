  evidenceGaps:
    - type: missing-source
      severity: material
      topic: "TR001 incident-scope"
      missingEvidence: A Ledger-authenticated post-incident report quantifying affected devices, retailers, loss attribution, and remediation status.
      whyItMatters: The current evidence contains reported tampering and investigator estimates but not a verified denominator or complete root-cause record.
      diligencePath: Obtain Ledger's incident report, retailer notices, device serial-number controls, and independent forensic validation.
      relatedQuestionRefs: [QR001, QR003]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: financial-model
      missingEvidence: Audited current revenue, burn, runway, gross margin by business line, and customer concentration.
      whyItMatters: Risk capacity and funding dependence cannot be assessed from funding or valuation commentary alone.
      diligencePath: Request audited statements, cash-flow bridge, covenant/debt schedule, segment margin detail, and top-customer concentration.
      relatedQuestionRefs: [QR006]
      relatedTableRefs: [TR003]
    - type: missing-source
      severity: material
      topic: resilience
      missingEvidence: Independent evidence of current uptime, recovery-time objectives, partner assurance, and tested incident runbooks.
      whyItMatters: The platform's risk surface includes software, logistics, custody workflows, and service dependencies.
      diligencePath: Review SOC reports, penetration-test remediation, SLA/RTO/RPO commitments, tabletop results, and key-partner oversight.
      relatedQuestionRefs: [QR004, QR005, QR008]
      relatedTableRefs: [TR003]
