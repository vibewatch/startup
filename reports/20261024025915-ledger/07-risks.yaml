chapter:
  number: 7
  title: Risks
  summary: Ledger's principal exposure is not a demonstrated extraction of keys from properly secured devices, but a wider trust and operational perimeter spanning closed firmware, software and logistics partners, customer-data exposure, supply-chain integrity, and expanding regulated or leveraged use cases. Public evidence supports a high-risk posture until Ledger discloses clearer incident scope, partner controls, and measurable resilience outcomes.
sections:
  - id: risk-ranking
    title: Risk ranking and thesis implications
    body: >-
      The risk register is led by trust-boundary expansion and distribution integrity rather than
      by a confirmed remote extraction of private keys. A 2026 report says compromised Ledger devices
      were reported at four retailers in three countries, while Ledger had not confirmed the number of
      compromised devices or whether thefts occurred outside the original retailer. That distinction
      matters: the reported losses are estimates, not Ledger-verified losses, but the event directly
      tests the chain between manufacture, authorized resale, customer setup, and recovery-phrase
      protection. Ledger's own product surface is also broadening into perpetual trading, where
      clear-signing can improve transaction visibility but cannot remove leverage or jurisdictional
      risk. The investment implication is a high residual operational and reputational exposure despite
      meaningful device-level security controls.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Regulatory and legal perimeter
    body: >-
      MiCA creates a material compliance perimeter for crypto-asset issuance, trading, transparency,
      authorisation, supervision, and complaints handling. ESMA states that the framework covers
      crypto-assets outside existing financial-services legislation and that its implementing
      measures include technical requirements for white papers and order-book records kept by
      crypto-asset service providers. Ledger's move into embedded perpetual trading therefore adds
      a regulatory dependency beyond the security of its signing device: product availability,
      provider arrangements, disclosures, and jurisdictional restrictions must remain aligned with
      the applicable national and EU regime. The public pool does not establish Ledger's own
      authorisation status or the completeness of its controls, so this remains a material diligence
      gap rather than a finding of non-compliance.
    claimRefs: [CR005, CR006, CR007]
    tableRefs: [TR002]
  - id: operational-dependencies
    title: Operational, partner, and financial-model risks
    body: >-
      Ledger's operating model depends on more than its secure element. The evidence describes
      partner-operated logistics and software components, optional recovery services, third-party
      integrations, and a hardware-plus-services commercial model. A security review identifies
      undefined ownership across treasury, security, and compliance, insufficient recovery-runbook
      testing, and the need to validate uptime, incident procedures, and support obligations in
      production. These are control-design questions, not proof of failure. The public evidence also
      does not disclose audited current revenue, burn, runway, gross margin by product line, or
      quantified customer concentration, so financial-model risk cannot be scored precisely. The
      monitorable response is to require incident metrics, partner assurance, recovery tests, and
      product-level economics before underwriting a higher-risk growth or IPO case.
    claimRefs: [CR008, CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
