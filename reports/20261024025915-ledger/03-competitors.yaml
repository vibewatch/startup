    claimRefs: [CP010, CP011, CP012]
figures:
  - id: FP001
    title: Competitive positioning by workflow emphasis
    type: quadrant
    summary: "An ordinal evidence-backed map separates ecosystem breadth from isolation or transparency emphasis; positions are analytical approximations, not market-share measurements."
    data:
      xAxis: "Workflow breadth and ecosystem integration (ordinal)"
      yAxis: "Isolation and transparency emphasis (ordinal)"
      points:
        - {label: Ledger, x: 4, y: 2, note: "Broad multi-chain, mobile and DApp ecosystem; proprietary-firmware tradeoff noted"}
        - {label: Trezor, x: 3, y: 4, note: "Open-source-focused with WalletConnect and Trezor Suite"}
        - {label: BitBox02, x: 3, y: 4, note: "Open-source firmware, dual-chip design and Ethereum DApp connectivity"}
        - {label: Coldcard, x: 1, y: 5, note: "Bitcoin-only, reproducible firmware and air-gap workflow"}
        - {label: MetaMask, x: 4, y: 1, note: "Broad software interface, without the same dedicated hardware isolation"}
        - {label: ELLIPAL, x: 2, y: 5, note: "Comparative review positions it as fully air-gapped touchscreen custody"}
    approximationNotes: "Coordinates are ordinal analyst placements derived from the assigned product and comparative texts; they are not measured market data, security scores or rankings."
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
callouts:
  - calloutType: insight
    title: Ledger wins the integrated middle
    body: Ledger is best positioned where buyers want multi-chain breadth, mobile access and a mature app layer, but specialist rivals can win when transparency, air-gapping, Bitcoin-only scope or recovery design dominates the brief.
    claimRefs: [CP005, CP006, CP007, CP008]
  - calloutType: assumption
    title: Evidence boundary
    body: The assigned pool does not provide audited competitor revenue, comparable market shares, realized pricing, customer retention or independently verified security-test results; those remain diligence gaps rather than implied parity.
    claimRefs: [CP002, CP010, CP013]
