      - [Trezor, null, null, "WalletConnect, Trezor Suite and open-source positioning", "Comparable price not present in assigned fetched text", "Price comparison unresolved"]
      - [BitBox02, null, null, "Open-source firmware, microSD backup and BitBoxApp", "Comparable price not present in assigned fetched text", "Price comparison unresolved"]
