schemaVersion: "report-v2"
artifact: valuation
slug: ledger
runDate: 2026-10-24
company:
  name: Ledger
chapter:
  number: 8
  title: Valuation
  summary: Ledger has credible scale and financing history, but the public record does not support underwriting a premium 2026 entry price with confidence. A track / research-more posture is appropriate until audited operating metrics, cap-table terms, and any IPO or secondary pricing are disclosed.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: "Ledger's thesis is that a scaled hardware-security franchise can compound into software, enterprise custody, and institutional infrastructure. Tracxn describes a blockchain hardware-wallet business with $575 million raised across seven rounds, while its latest listed round was $109 million in March 2023. The counter-thesis is that hardware demand is cyclical, public metrics are thin, and trust incidents can impose costs outside the device itself. A 2026 review says there is no publicly confirmed remote extraction of private keys from properly secured devices, but also identifies a Global-e order-data exposure and service complaints. That distinction matters for valuation: core cryptographic resilience can coexist with brand, privacy, support, and channel liabilities. The available evidence therefore supports strategic quality, not a precise premium multiple."
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: price-discipline
    title: Financing history and entry discipline
    body: "The observable financing record provides an anchor but not a current mark. QuantumRun reports a $1.3 billion post-money valuation for the March 2023 extension and says the June 2021 round reached $1.5 billion; Tracxn reports the March 2023 round as $109 million and lists a $1.41 billion post-money valuation. These are close but not identical secondary records, and neither establishes a 2026 transaction price. A separate 2026 article describes a potential IPO valuation exceeding $4 billion, while a reference profile says the United States IPO plans were suspended in May 2026 without a formal SEC registration statement. The correct discipline is to treat $4 billion as an unverified scenario, not an investable valuation. Dilution, liquidation preferences, option-pool effects, debt, and secondary liquidity remain private-company gaps."
    claimRefs: [CV006, CV007, CV008, CV009]
  - id: scenarios-and-comparables
    title: Scenarios, comparables, and downside
    body: "A scenario framework is more defensible than a single point estimate because revenue quality, recurring software mix, enterprise adoption, and crypto-market sensitivity are not publicly reconciled. QuantumRun reports $70.9 million of 2024 revenue and $36.7 million in 2023, but the page is an analyst-style secondary source and does not provide audited segment detail. A 2026 IPO article instead describes nine-figure 2025 revenue, which is directionally supportive but not a substitute for accounts. Tracxn places Ledger among funded crypto-security peers and lists Blockstream, CertiK, and MetaMask as competitors, but those businesses are not directly comparable on revenue model or custody exposure. Coinbase market capitalization data can illustrate public-market volatility in crypto infrastructure, not a valuation multiple for Ledger. Downside is therefore driven by evidence gaps as much as by operating risk."
    claimRefs: [CV010, CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
  - id: recommendation-and-diligence
    title: Recommendation and diligence asks
    body: "The recommendation is track, with medium confidence and a fair-to-unknown valuation stance rather than buy. Ledger's funding base, product breadth, and institutional positioning are meaningful strengths, but the evidence set cannot establish current revenue run-rate, gross margin, retention, enterprise ACV, customer concentration, or the capitalization waterfall. The investment committee should require audited 2025 financial statements, a 2026 year-to-date bridge, hardware versus software and enterprise revenue, gross-margin and cash-burn schedules, and a fully diluted cap table with preference terms. It should also request incident-adjusted customer and conversion data, the status of any IPO process, and evidence that third-party dependencies are controlled. A thesis break would be a down round, material trust event without measurable remediation, or proof that recurring enterprise economics are not emerging."
    claimRefs: [CV015, CV016]

tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, track, "Strategic strengths are visible; current price is not", "Monitor and seek financing data"]
      - [Confidence, medium, "Multiple secondary sources agree on historical financing, not current terms", "Do not underwrite a precise mark"]
      - [Risk rating, high, "Cyclical demand and recurring trust / dependency exposure", "Require incident and concentration diligence"]
      - [Valuation stance, fair, "2023 marks are observable; 2026 price is not verified", "Avoid premium entry without disclosure"]
    notes: "Assessment is analytical; valuation and operating metrics are not audited in the assigned public evidence."
    claimRefs: [CV001, CV004, CV006, CV009]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Current implication]
    rows:
      - [Scaled security franchise, "$575M raised across seven rounds and hardware-wallet leadership are reported", "Audited revenue and customer retention fail to show scale", "Positive but incomplete"]
      - [Institutional expansion, "Ledger Enterprise and institutional partnerships are described in 2026 coverage", "Enterprise revenue and ACV remain undisclosed", "Potential upside, not proven"]
      - [Security moat, "Review reports no publicly confirmed remote key extraction from properly secured devices", "A material device compromise or unresolved supply-chain incident", "Core product supports thesis"]
      - [Brand and dependency risk, "Global-e exposure and earlier ecosystem incidents are reported", "Quantified remediation and reduced third-party exposure", "High diligence priority"]
    notes: "Rows separate company/product strengths from evidence-sensitive conditions that could reverse the investment view."
    claimRefs: [CV003, CV004, CV005, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Recurring enterprise revenue is material; 2026 growth persists; IPO or strategic liquidity clears", "A price above the 2023 mark could be justified by audited growth and software mix", "Low until audited metrics and transaction terms appear", "IPO process or enterprise economics fail"]
      - [Base, "Hardware remains scaled but cyclical; enterprise and software are developing; valuation remains near prior marks", "Track at or below a refreshed private mark; require downside protection", "Most consistent with current evidence", "No disclosure of recurring economics"]
      - [Bear, "Crypto cycle weakens; trust or partner incidents damage demand; financing reprices", "Down-round risk and preference overhang reduce common-equity value", "Material risk given evidence gaps", "Down round, major incident, or liquidity freeze"]
      - [Public comparator lens, "Coinbase market cap data shows crypto-market valuation volatility, not Ledger comparability", "Use only as a sentiment / beta reference, never as a Ledger multiple", "Context only", "Market multiple compression"]
    notes: "Scenarios are qualitative because current Ledger revenue, margins, capital structure, and transaction price are not independently established; no precise USD range is invented."
    claimRefs: [CV006, CV010, CV012, CV013, CV014]

figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Scale and product proof support monitoring, while missing price and operating disclosures constrain the recommendation.
    data:
      nodes:
        - {id: scale, label: "Funding and installed base", tone: positive}
        - {id: product, label: "Hardware security proposition", tone: positive}
        - {id: enterprise, label: "Enterprise expansion", tone: neutral}
        - {id: disclosure, label: "Limited current financial disclosure", tone: negative}
        - {id: price, label: "Unverified 2026 entry price", tone: negative}
        - {id: decision, label: "Track / research more", tone: neutral}
      edges:
        - {from: scale, to: enterprise}
        - {from: product, to: enterprise}
        - {from: enterprise, to: decision}
        - {from: disclosure, to: decision}
        - {from: price, to: decision}
    approximationNotes: "Flow expresses analytical ordering, not a measured conversion rate or probability."
    claimRefs: [CV001, CV003, CV008, CV009, CV015]

callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: The public record supports Ledger as a strategically credible company, but not a premium buy at an unverified 2026 valuation. Revisit the call when audited financials, cap-table terms, and transaction pricing are available.
    claimRefs: [CV009, CV015, CV016]
  - calloutType: risk
    title: Evidence gap is itself valuation risk
    body: Missing current revenue quality, margins, retention, concentration, and preference data can make a seemingly attractive headline valuation economically misleading for new investors.
    claimRefs: [CV010, CV016]

