artifact: financials
slug: ledger
runDate: 2026-10-24
company:
  name: Ledger
chapter:
  number: 4
  title: Financials
  summary: Ledger appears to have reached triple-digit millions of revenue in 2025 while broadening from hardware sales toward wallet services, subscriptions, and enterprise custody. The public record does not disclose audited segment revenue, gross margin, cash, burn, or unit economics, so reported scale cannot yet establish revenue quality or capital adequacy.
sections:
  - id: revenue-model
    title: Revenue architecture and monetization
    body: >-
      Ledger's company-issued Wallet 4.0 announcement describes an intended shift from
      hardware into a recurring trading and services model, built on more than 8 million
      devices sold. The disclosed architecture combines upfront signer sales with
      wallet activity, third-party buy and swap services, optional Recover subscriptions,
      and enterprise custody. This is evidence of monetization breadth, not revenue mix:
      no retained source reports attach rates, transaction volume, Ledger's provider
      take rate, enterprise contract value, or the accounting split between hardware
      and services. An affiliate review lists Recover at $9.99 per month and estimates
      user-facing partner fees, but those figures are neither Ledger-issued pricing nor
      proof of realized net revenue.
    claimRefs: [CI001, CI002, CI004, CI005, CI006]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: scale-and-unit-economics
    title: Traction, cost structure, and sales efficiency
    body: >-
      Crypto Briefing attributes triple-digit millions of 2025 revenue to Ledger's CEO;
      two lower-reputation sources use comparable nine-figure or hundreds-of-millions
      language. These reports likely share underlying company commentary, so they
      corroborate wording rather than independently audit the metric. Revenue is not
      ARR, and none of the sources supplies recognized segment revenue, gross margin,
      inventory turns, warranty cost, channel discounts, CAC, sales cycle, payback, NRR,
      churn, or customer concentration. Specialized secure-element hardware makes device
      mix, manufacturing, returns, and support plausible margin drivers, while partner
      services introduce volume and take-rate dependencies. A current registry page
      exposes only 2016 accounts, making its historical figures unsuitable for estimating
      Ledger's 2025 or 2026 economics.
    claimRefs: [CI003, CI007, CI008, CI015]
    tableRefs: [TI003]
  - id: capital-and-verdict
    title: Capital adequacy, downside exposure, and verdict
    body: >-
      Tracxn reports $575 million raised across seven rounds, including a $109 million
      Series C in March 2023. That history demonstrates financing access, not current
      liquidity: funding raised is not cash available, and no assigned source reports
      cash, burn, runway, debt, covenants, working-capital needs, or a next-round trigger.
      Crypto Briefing reports preparations for a possible U.S. IPO above $4 billion,
      but contingent proceeds cannot be treated as financing already secured. Financial
      downside is also unquantified. Yahoo Finance reported compromised-device concerns
      across four retailers in three countries and an investigator loss estimate that
      Ledger had not verified. The underwriting verdict is therefore research-more:
      reported scale is encouraging, but margin, cash conversion, incident cost, and
      capital sufficiency remain private-evidence blockers.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
callouts:
  - calloutType: risk
    title: Revenue scale is not revenue quality
    body: Reported 2025 revenue is a broad company-attributed band; no retained source reconciles it to audited segment revenue, ARR, gross margin, cash generation, or service contribution.
    claimRefs: [CI003, CI013]
  - calloutType: recommendation
    title: Require a current cash and segment bridge
    body: Underwriting should require audited segment financials, product-level gross margin, service take rates, cohort retention, inventory and warranty schedules, and a cash-to-runway bridge before assigning a premium financial score.
    claimRefs: [CI008, CI013, CI014, CI015]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism and unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [Hardware signers, "Upfront sale per device", "More than 8 million devices sold, company-issued", "Scale visible; ASP, mix and recognized revenue unavailable", "Units and ASP by model, discounts, returns, warranty cost, COGS"]
      - [Wallet transactions, "Buy, swap, trading and provider activity", "Wallet 4.0 describes recurring trading and services", "Recurring potential; volume and Ledger take rate unavailable", "Active transactors, GMV, provider contracts, gross-versus-net policy"]
      - [Ledger Recover, "Optional monthly subscription", "$9.99 per month in an affiliate review", "List-price proxy only; subscribers and churn unavailable", "Official price history, paid users, churn, servicing cost, contribution"]
      - [Enterprise custody, "Institutional software, custody and infrastructure contracts", "Secondary sources identify enterprise as a revenue contributor", "Potentially recurring; ACV, concentration and margin unavailable", "ARR, ACV, implementation fees, NRR, renewals, top-customer share"]
    notes: "Public descriptions establish mechanisms, not audited revenue mix; the Recover price and transaction-fee observations come from an affiliate review and are not realized Ledger revenue."
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
  - id: TI002
    title: Pricing and monetization signals
    columns: [Offer or activity, Public price or fee, Denominator, Ledger economics, Qualification]
    rows:
      - [Ledger Recover, "$9.99", "Per month", "Undisclosed", "Affiliate-review figure; official current pricing and paid subscriber count not retained"]
      - [Partner crypto purchase, "1% to 4%", "User-facing transaction fee", "Undisclosed", "Review estimate; fee accrues through partners and Ledger share is not stated"]
      - [Crypto swap, "Approximately 1% plus network fees", "User-facing swap cost", "Undisclosed", "Review estimate; pair, provider, volume and Ledger share are not stated"]
      - [Hardware devices, null, "Per device", "Undisclosed", "No current assigned source provides model prices, discounts, channel margin or realized ASP"]
    notes: "Null means unavailable in the assigned evidence. User-facing partner charges must not be treated as Ledger revenue, take rate, or margin."
    claimRefs: [CI005, CI006]
  - id: TI003
    title: Unit economics and capital-underwriting inputs
    columns: [Metric, Public value, Period, Confidence, Underwriting implication, Required evidence]
    rows:
      - [Revenue, "Triple-digit millions", "2025", "Medium", "Shows scale but not recurrence or profitability", "Audited recognized revenue and segment bridge"]
      - [Devices sold, "More than 8 million", "By March 2026", "Medium", "Large installed base; active base and replacement cadence unknown", "Active devices, cohort age, replacement and service attach"]
      - [Gross margin, null, "Current", "Low", "Margin path cannot be underwritten", "Hardware and service gross margin, COGS, warranty and support"]
      - [CAC and payback, null, "Current", "Low", "Sales efficiency cannot be assessed", "CAC by channel, sales cycle, payback and cohort contribution"]
      - ["Cash, burn and runway", null, "Current", "Low", "Capital adequacy cannot be assessed", "Cash ledger, monthly burn, debt, covenants and liquidity forecast"]
      - [Funding raised, "$575M across seven rounds", "Through March 2023", "Medium", "Signals historical access, not cash available", "Cap table, preferences, remaining cash and use of proceeds"]
      - [Latest public accounts on Pappers, "€869K revenue; -€397K net result", "2016", "Medium", "Too stale to proxy current performance", "Audited 2024-2026 statements and consolidation scope"]
      - [Incident-related cost, null, "2026", "Low", "Returns, support, remediation and channel effects are unquantified", "Incident cost, insurance recovery, returns and post-event conversion"]
    notes: "Revenue is not ARR, accounting loss is not cash burn, and funding raised is not cash available. Historical 2016 accounts are shown only to document the current public-data gap."
    claimRefs: [CI002, CI003, CI007, CI008, CI009, CI011, CI012, CI013, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge and missing conversion inputs
    type: flow
    summary: The public evidence identifies monetization paths from signer distribution to services, but it does not disclose the conversions, take rates, costs, or gross profit needed to quantify the bridge.
    data:
      nodes:
        - id: acquisition
          label: Customer acquisition
          detail: "Channel mix, CAC, sales cycle and discounts are undisclosed."
        - id: device-sale
          label: Signer sale
          value: "Upfront"
          detail: "Model-level units, ASP, returns and warranty expense are undisclosed."
        - id: installed-base
          label: Installed base
          value: ">8M devices sold"
          detail: "Company-issued lifetime scale; active devices are undisclosed."
        - id: wallet-activity
          label: Wallet activity
          value: "Undisclosed"
          detail: "Active users, transaction frequency and service attach are unavailable."
        - id: partner-services
          label: Partner transactions
          value: "Undisclosed"
          detail: "Buy, swap and rewards activity may monetize through providers; take rate is unavailable."
        - id: recover
          label: Recover subscription
          value: "$9.99/month proxy"
          detail: "Affiliate-review list price; subscribers, churn and contribution are unavailable."
        - id: enterprise
          label: Enterprise contracts
          value: "Undisclosed"
          detail: "ACV, renewal, implementation cost and concentration are unavailable."
        - id: gross-profit
          label: Gross profit
          value: "Undisclosed"
          detail: "No current segment gross-margin bridge is public in the assigned evidence."
      edges:
        - from: acquisition
          to: device-sale
          label: "Conversion unavailable"
        - from: device-sale
          to: installed-base
          label: "Device activation unavailable"
        - from: installed-base
          to: wallet-activity
          label: "Active rate unavailable"
        - from: wallet-activity
          to: partner-services
          label: "Transaction attach unavailable"
        - from: wallet-activity
          to: recover
          label: "Subscription attach unavailable"
        - from: acquisition
          to: enterprise
          label: "Enterprise sales cycle unavailable"
        - from: partner-services
          to: gross-profit
          label: "Take rate and cost unavailable"
        - from: recover
          to: gross-profit
          label: "Contribution unavailable"
        - from: enterprise
          to: gross-profit
          label: "Contract margin unavailable"
    approximationNotes: "Qualitative flow only. Values retain their stated denominators; no conversion rate, revenue allocation, or gross-profit amount is estimated."
    claimRefs: [CI014]
