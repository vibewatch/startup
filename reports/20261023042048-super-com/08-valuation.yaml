callouts:
  - calloutType: recommendation
    title: Track at the reported mark
    body: The operating narrative is compelling, but the reported valuation is price-sensitive and the public evidence does not establish durable segment economics or investor preference terms.
    claimRefs: [CV001, CV006, CV010, CV013]
  - calloutType: risk
    title: Revenue quality is the key unknown
    body: A reported revenue figure should not be treated as ARR, recognized revenue, or cash generation until the segment bridge and accounting basis are provided.
    claimRefs: [CV002, CV007]
