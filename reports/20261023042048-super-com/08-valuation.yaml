company:
  name: Super.com
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a strong operating story and a reported $1.2 billion valuation in connection with the Series D, but the available record does not disclose enough segment economics or capital-stack terms to underwrite that price with high confidence. The appropriate stance is track/research-more until revenue quality, retention, and preference terms are verified.
sections:
  - id: investment-case
    title: Investment case and price sensitivity
    body: >-
      Super.com has a credible scale-and-monetization narrative: PhocusWire reports a $65 million Series D led by TPG and says the company stated a $1.2 billion valuation, while the same report says Super.com became profitable in 2025 and reported 50% revenue growth. The Product Market Fit Show account adds useful operating context, describing a $15 monthly Super+ membership, a product pivot from hotel booking into financial tools, and reported 2025 revenue of about $200 million; however, that account is based on the founder's narrative and should not be treated as audited financial disclosure. On the reported figures, $1.2 billion divided by $200 million is approximately 6.0x revenue, but this is an indicative multiple, not ARR or a verified run-rate. The company-controlled site emphasizes up to 40% hotel discounts, 10% Super+ hotel cashback, and a secured-card structure, supporting the monetization proposition but not proving contribution margin or retention. The positive thesis is a differentiated value proposition that can combine travel acquisition with recurring membership and fintech cross-sell. The anti-thesis is that discounts, cashback, support obligations, credit exposure, and third-party booking friction may make gross revenue a poor proxy for durable free cash flow. A buy call therefore requires segment-level revenue, gross-margin, cohort-retention, loss-rate, and cap-table evidence that is not public in this pool.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
  - id: scenarios
    title: Bull, base, and bear cases
    body: >-
      Scenario valuation should be disciplined around what is known versus what is merely claimed. The bull case assumes the reported $200 million of 2025 revenue is comparable to the valuation numerator, that 50% growth persists for several years, and that Super+ and financial products improve recurring mix without disproportionate credit, servicing, or acquisition costs. The base case gives more weight to the reported $1.2 billion mark but applies a hold/track posture because the evidence does not establish revenue composition, gross margin, recurring revenue, or retention. The bear case treats the reported valuation as vulnerable to a down-round or multiple compression if growth normalizes, booking disputes increase support cost, or cash-advance and card economics require more capital than the headline model suggests. These are probability signals rather than a formal discounted-cash-flow output: the pool contains no audited statements, capitalization table, liquidation preferences, debt schedule, or independently verified cohort dataset. Entry discipline should therefore prioritize price and information rights over a precise target price.
    claimRefs: [CV006, CV007, CV008, CV009]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence-and-exit
    title: Diligence asks and exit readiness
    body: >-
      Exit readiness is not established by the funding headline alone. PhocusWire provides an independent financing datapoint, but the public record here does not disclose investor preference structure, secondary liquidity, debt, board rights, or an exit timetable. Super.com's own disclosures say its card is issued by Republic Bank & Trust Company and that Super.com is not a bank or FDIC insured; this makes partner, compliance, and balance-sheet diligence central to any valuation decision. Adverse review evidence is mixed: competitor Gerald says user experiences vary and identifies customer-service issues around cancellations and refunds, while a low-reputation review site notes reported concerns about non-transparent subscription enrollment and booking inconsistencies. Those sources are not representative customer cohorts, but they are downside signals that should be tested rather than dismissed. The assigned Rakuten investor-document landing page yielded no usable current trading multiple, so it cannot anchor a public-comparable valuation. Final diligence should request monthly revenue by travel, membership, and financial products; gross margin and contribution margin by segment; Super+ twelve-month retention and ARPU; cash-advance approval, delinquency, and loss data; card economics; full capitalization and preference terms; and complaint/refund metrics. The thesis breaks if growth falls materially below plan while support, credit, or acquisition costs rise, if regulatory or partner restrictions impair the financial products, or if the next financing materially resets the reported $1.2 billion mark.
    claimRefs: [CV010, CV011, CV012, CV013]
    tableRefs: []
  - id: recommendation
    title: Recommendation
    body: >-
      Recommendation: track, with medium confidence and a stretched valuation stance. The operating evidence is attractive enough to merit continued diligence, but the reported 6.0x revenue framing is not sufficient for a buy decision because the numerator is founder/company-reported, revenue quality is not disclosed, and preference overhang and dilution are unknown. A more favorable call would require verified segment economics and a price that compensates for customer-service, regulatory-partner, credit, and liquidity risks. A less favorable call follows if the reported revenue is gross booking value rather than recognized revenue, if membership retention is weak, or if financing terms place common-equity investors behind substantial liquidation preferences.
    claimRefs: [CV001, CV006, CV010, CV013]
    tableRefs: []
