  topStrengths:
    - Reported 2026 Series D financing and valuation indicate continued investor access.
    - A broad travel, membership, rewards, and financial-product bundle creates plausible cross-sell paths.
    - Public coverage reports profitability and strong revenue growth, although the figures are not audited.
  topRisks:
    - Segment revenue, gross margin, retention, and cash conversion are not publicly reconciled.
    - >-
      Cash-advance, subscription, booking, privacy, and servicing exposures create material compliance and execution
      risk.
    - Customer counts, complaint denominators, partner concentration, and capital-stack preferences remain undisclosed.
  unresolvedGaps:
