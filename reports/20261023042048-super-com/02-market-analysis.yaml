callouts:
  - calloutType: insight
    title: Macro travel output is context, not company TAM
    body: "The $2.64 trillion total-output measure includes direct and indirect activity across the U.S. tourism economy. Super.com's serviceable opportunity requires a bottom-up bridge from reachable users and transactions."
    claimRefs: [CM005, CM007, CM008]
  - calloutType: risk
    title: Financial-access adjacency brings policy exposure
    body: "The retained CFPB evidence is a proposed rule, not a final product-specific determination. Current legal treatment, fees, repayment behavior, and compliance costs require direct diligence."
    claimRefs: [CM016]
