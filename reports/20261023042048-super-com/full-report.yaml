chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and evolution
        blocks:
          - type: paragraph
            body: >-
              Super.com is the renamed successor to SnapTravel and Snapcommerce, built around a savings theme rather
              than a single financial product. A 2025 Sacra interview describes the business as “Born as SnapTravel’s
              SMS hotel-deal bot” and says it relaunched in 2022 as a personal-finance and travel superapp for
              low-to-middle-income consumers. BetaKit reports that the company rebranded from Snapcommerce in October
              2022 and moved its headquarters from Toronto to San Francisco in the same month, while the app listings
              identify Super.com Inc. as the provider. The identity is therefore clear, but headquarters and operating
              footprint require a canonical company disclosure before being treated as settled.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
