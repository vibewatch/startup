              - CO006
              - CO007
              - CO008
              - CO011
      - number: '1.3'
        title: Funding, valuation, and operating scale
        blocks:
          - type: paragraph
            body: >-
              The strongest current financing evidence is independent 2026 reporting: PhocusWire says Super.com raised
              $65 million in Series D financing, while Multiples records a July 2026 $1.2 billion post-money valuation
              and $200 million of revenue or run-rate revenue alongside the round. Multiples also describes $17 million
              of primary capital and secondary transactions, which means headline funding raised is not the same as cash
              available to the company. Historical sources give materially different cumulative funding totals,
              including approximately $150 million, nearly $200 million, $220 million, and $235 million depending on
              inclusion of debt, timing, and source methodology. The chapter therefore treats the latest round and
              valuation as reported facts while leaving total raised and cash resources explicitly qualified.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO011
              - CO014
              - CO015
      - number: '1.4'
        title: Milestones, product breadth, and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              Super.com’s milestones show a deliberate expansion from travel distribution into a bundled savings and
              financial-wellness proposition: a 2016 founding, 2021 marketplace acquisition and financing, 2022 rebrand,
              2023 savings-app financing, 2024 travel GMV milestone, and 2026 Series D. The app stores corroborate an
              active product spanning travel discounts, cashback, credit building, cash advances, and earning features,
              but product pages are company-issued marketing evidence rather than independent proof of user outcomes.
              BBB’s February 2026 review identifies complaints concerning Super+ subscription enrollment; this is a
              relevant adverse signal, not evidence of systemic misconduct. The next diligence pass should reconcile
              product-level revenue, membership retention, compliance controls, customer and employee counts, and
              capital-stack terms.
            claimRefs:
