      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Hussein Fazal is consistently identified as Super.com’s co-founder and CEO, and Henry Shi is identified as
              the other co-founder in the BetaKit account. The assigned evidence does not provide a complete current
              executive roster, board composition, committee structure, or investor control rights. That gap matters
              because the company combines regulated or partner-dependent financial products with travel and marketplace
              operations, increasing the value of experienced functional coverage. The available record shows a
              founder-led strategy: Fazal explained the cross-sell thesis, the target consumer, and the product roadmap
              in interviews, while funding coverage attributes the company’s transition and fundraising narrative
              primarily to him. Key-person dependence is consequently a material diligence question, not a proven
              governance defect.
            claimRefs:
              - CO005
              - CO006
              - CO007
