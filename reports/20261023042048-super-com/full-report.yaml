  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - track
        - Continue diligence; do not underwrite a buy from public evidence alone.
      - - Confidence
        - medium
        - Operating direction is credible but key economics are unverified.
      - - Risk rating
        - high
        - Credit, partner, service, and valuation risks remain material.
      - - Valuation stance
        - stretched
        - Reported $1.2B valuation implies about 6.0x reported $200M revenue.
    notes: Reported financing and revenue figures are not audited in this pool; the multiple is indicative and not ARR.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV010
  - id: TV002
    title: Thesis / anti-thesis
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - Membership and fintech can deepen monetization
        - Super+ is described as a $15/month membership with travel and financial benefits.
        - Verified cohort retention, ARPU, and contribution margin.
      - - Reported scale supports a meaningful platform
        - PhocusWire reports 50% revenue growth and 2025 profitability as stated by the company.
        - Audited revenue bridge and cash-flow reconciliation.
      - - Price may overstate durable economics
        - Reported valuation is $1.2B while segment mix and gross margin are undisclosed.
        - Lower entry price or independently verified recurring economics.
      - - Customer friction can impair repeat value
        - Independent reviews cite cancellation, refund, and subscription-enrollment concerns.
        - Complaint rates, refund cohorts, and retention by issue status.
    notes: The table separates reported operating claims from the diligence evidence needed to validate durability and price.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV011
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Reported $200M revenue is recognized revenue; 50% growth persists; membership and fintech margins improve.
        - A 6.0x entry multiple becomes more defensible if growth and cash conversion persist.
        - Low-to-medium
        - Segment margins or retention fail to scale.
      - - Base
        - Reported $1.2B valuation is directionally correct; growth moderates; economics remain opaque.
        - Track rather than buy; seek price protection and information rights.
        - Medium
        - Next financing reprices materially or reveals weak recurring mix.
      - - Bear
        - Growth normalizes; support, credit, cashback, or partner costs consume contribution margin.
        - Multiple compression and dilution make current entry unattractive.
        - Medium
        - Down-round, loss-rate deterioration, or partner/regulatory constraint.
    notes: >-
      Scenarios are qualitative probability signals, not a formal forecast; no public cap table, debt schedule, or
      audited segment model was available.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
