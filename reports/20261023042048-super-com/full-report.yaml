  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Super.com's defensible market boundary begins with consumer jobs, not the full value of tourism or
              financial services. Its company-issued app listings combine discounted hotels and related travel, cashback
              and earning offers, credit-building, and cash advances; Sacra similarly categorizes the product across
              personal finance and travel. Within that bundle, paid Super+ benefits are distinct from the free
              hotel-browsing and booking path described by Side Hustles Central. Included activity is therefore the
              subset of travel transactions, recurring savings benefits, rewards engagement, and financial-access usage
              that the app can serve. Excluded activity includes indirect tourism supply-chain output, unrelated
              household deposits or lending, and destination spending outside the app. Direct hotel booking, major
              online travel agencies, free loyalty programs, specialist rewards apps, banks, and standalone advance or
              credit-building products remain substitutes.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The strongest retained sizing evidence is category-level and must not be presented as Super.com's TAM. BEA
              measured $2.64 trillion of total U.S. tourism-related current-dollar output in 2023, comprising $1.52
              trillion of direct output and $1.12 trillion of indirect output. On a different basis, its
              chained-2017-dollar series placed traveler accommodations at $239.466 billion and travel arrangement and
              reservation services at $83.671 billion in 2023. Those real-output segment measures are closer to the
              travel workflow, but they still cover the entire national industries rather than Super.com's reachable
              customers or revenue pool. The reservation-services series recovered from $36.828 billion in 2020 to
              $83.671 billion in 2023, while the retained evidence provides no disclosed company-specific conversion
              from industry output to SAM or SOM.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM008
              - CM009
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The bundle serves several decision contexts. A traveler can browse and book without paying for Super+,
              while a recurring member must expect the used discounts and rewards to exceed the reported $15 monthly
              fee. Credit-building and paycheck-advance users instead enter through cash-management needs, and rewards
              users trade time, purchases, or offer completion for credits or cashback. The Federal Reserve's current
              household survey covers hardships, savings, banking, and credit across nearly 13,000 adults, while the
              FDIC survey covers transaction and credit needs across approximately 30,000 nationally representative
              households; both establish useful segmentation dimensions, not demand for Super.com itself. Company
              listings claim more than 20 million users and promote specific savings percentages, but they do not
              disclose paid-member count, conversion, retention, or usage by buyer segment.
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM011
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM011
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Travel recovery, a broad product bundle, and a simple savings message can support adoption. BEA reported
              that real travel and tourism output grew 7.0% in 2023, compared with 2.9% real GDP growth, and U.S. Travel
              maintains monthly travel-price and industry dashboards that can monitor the category after that historical
              period. The principal constraints are benefit realization, switching friction, trust, and regulation.
              Independent reviews advise comparing final hotel prices, fees, cancellation terms, and realistic benefit
              use rather than relying on headline offers. The CFPB's retained page remains a 2024 proposed interpretive
              rule, under which some paycheck-advance offerings and costs such as expedited-delivery fees and tips may
              trigger existing federal requirements. PhocusWire separately reports the company's statement that it
              became profitable while revenue grew 50% in 2025; this is neither independently verified profitability nor
              evidence of cash generation, and it cannot substitute for segment-level margins.
            claimRefs:
              - CM006
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Macro travel output is context, not company TAM
            body: >-
              The $2.64 trillion total-output measure includes direct and indirect activity across the U.S. tourism
              economy. Super.com's serviceable opportunity requires a bottom-up bridge from reachable users and
              transactions.
            calloutType: insight
            claimRefs:
              - CM005
              - CM007
              - CM008
          - type: callout
            title: Financial-access adjacency brings policy exposure
            body: >-
              The retained CFPB evidence is a proposed rule, not a final product-specific determination. Current legal
              treatment, fees, repayment behavior, and compliance costs require direct diligence.
            calloutType: risk
            claimRefs:
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Super.com sits at the intersection of online travel agencies, rewards and cashback platforms, and
              consumer-finance apps. Its travel entry point is discounted hotel inventory, while Super+ adds cashback,
              credit-building, cash advances, and other savings benefits. The company therefore competes with direct
              hotel-booking alternatives such as mainstream OTAs, with rewards and shopping platforms such as Ibotta and
              Honey, and with banking or earned-wage-access products such as Chime SpotMe. A status-quo buyer can also
              book direct, use a general-purpose rewards card, or self-manage savings without a membership. The evidence
              supports a broad alternative set, including likely entrants from scaled travel, payments, and banking
              platforms, but does not support a complete market-share ranking for every class.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP007
              - CP013
              - CP014
      - number: '3.2'
        title: Capability, pricing, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              Super.com's strongest disclosed advantage is bundling: a single paid tier combines hotel savings with
              rewards and financial tools, allowing one acquisition to support several jobs to be done. Pulse2 reports
              nearly one million Super+ members, up to 40% hotel discounts, and an extra 10% cashback on hotel bookings,
              while the Google Play listing advertises cashback, cash advances, credit building, and earning features.
              Chime demonstrates the counter-position: its SpotMe product is narrower but embedded in a free checking
              account, with zero fees and automatic repayment. Honey demonstrates a different distribution moat: PayPal
              said its 2019 acquisition target had approximately 17 million monthly active users and worked across about
              30,000 online retailers. These are not like-for-like or independent benchmarks—PayPal was describing its
              own acquisition—but they show why breadth alone may not overcome incumbent reach or simpler pricing.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP009
              - CP010
              - CP014
      - number: '3.3'
        title: Switching costs, trust, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The likely switching costs are behavioral and data-driven rather than contractual. Super+ members may
              accumulate savings habits, card usage, credit-building history, and familiarity with cross-sold benefits,
              but the public evidence does not establish retention, cohort payback, or exclusivity of hotel supply.
              Super.com's own product claims emphasize convenience and breadth; independent and competitor-adjacent
              reviews describe the trade-off as lower prices versus stricter cancellation terms, refund friction, and
              inconsistent support. Chime's direct-deposit requirement creates a concrete account-level lock-in, while
              Honey's integration into PayPal illustrates how distribution and merchant reach can be harder to replicate
              than a feature list. The moat is therefore plausible but conditional on reliable fulfillment, transparent
              membership economics, and evidence that cross-sell raises retention rather than merely increasing product
              complexity.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP013
      - number: '3.4'
        title: Displacement risks and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The most credible displacement risk is a better-distributed incumbent copying the savings layer or
              bundling an equivalent benefit into an existing travel, payments, or banking relationship. Ibotta's public
              market value and Honey's historical user and merchant footprint show that rewards competitors can bring
              materially different scale, although these figures are not direct measures of Super.com's competitive
              position. Super.com's 2026 Series D supplies capital for product expansion, but financing scale does not
              establish a durable buyer advantage. Adverse customer-review evidence also matters: prepaid or
              non-refundable bookings, cancellation constraints, booking errors, and subscription enrollment concerns
              can erode trust and raise support costs. The assigned pool does not provide verified Super+ retention,
              realized versus list pricing, customer-acquisition payback, hotel-supply exclusivity, or head-to-head
              conversion data. Those gaps prevent a high-confidence claim that the membership flywheel is durable
              against free or more established alternatives.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Bundling is the clearest differentiator
            body: >-
              Super.com connects a hotel-savings acquisition wedge to paid membership, cashback, card, credit-building,
              and cash-advance use cases; the pool supports breadth, but not yet the retention or margin outcome of that
              bundle.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: Trust can erase price advantage
            body: >-
              Independent review evidence describes lower prices alongside prepaid or non-refundable terms, booking
              errors, refund friction, and membership-enrollment concerns; this creates a credible displacement path for
              more established alternatives.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP014
          - type: callout
            title: Underwrite the moat through cohort and controlled-price evidence
            body: >-
              The next diligence step is a matched booking and membership study covering realized savings, cancellation
              outcomes, conversion, retention, cross-sell, and acquisition payback against direct booking, mainstream
              OTAs, rewards platforms, and banking substitutes.
            calloutType: recommendation
            claimRefs:
              - CP012
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization model and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Super.com presents a multi-product consumer savings model rather than a single-purpose SaaS model. Its
              travel front door monetizes discounted hotel inventory and related booking activity, while Super+ adds
              recurring membership revenue and bundles deeper hotel discounts, cashback, a card, cash advances, and
              other savings tools. An independent founder-interview account describes Super+ as a $15/month membership
              and says the company added recurring revenue on top of transactional revenue after placing the card behind
              the paywall. The official app-store descriptions separately advertise hotel discounts, cashback, earning
              activities, credit-building, and cash advances, but they do not disclose realized take rates, revenue
              recognition, or contribution margins. Consequently, list benefits and company-reported traction should not
              be treated as revenue or gross profit without segment reporting.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI013
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI014
      - number: '4.2'
        title: Unit economics, cost structure, and operating leverage
        blocks:
          - type: paragraph
            body: >-
              Public materials provide useful mechanism clues but not a complete unit-economic bridge. Super.com is
              described as sourcing hotel rates through closed or negotiated channels and retaining a margin after
              paying the hotel, while its app surfaces additional benefits such as cashback and discounts. The founder
              account says the pre-COVID travel business exceeded $100 million of GMV at a 10–15% margin, but that
              historical margin is not defined as gross margin, contribution margin, or accounting profit and is not
              evidence of the current mix. The same account says the company cut 20–30% of staff during COVID, later
              devoted more than half of staff to products that initially generated no revenue, and made the paid
              membership a mechanism for usage and retention. These facts suggest meaningful customer-acquisition,
              rewards, support, credit, and product-development costs, but no public source supplies CAC, payback,
              default loss, servicing cost, or gross margin by stream.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Public traction and forward capital needs
        blocks:
          - type: paragraph
            body: >-
              Current third-party coverage reports that Super.com raised $65 million in Series D funding led by TPG at a
              stated $1.2 billion valuation, and that the company said it became profitable in 2025 while growing
              revenue by 50%. A separate founder-interview account reports approximately $200 million of 2025 revenue,
              more than 50% year-over-year growth, about 300 employees, and a Super+ base approaching one million
              members, while another current analysis page labels the company report as published October 12, 2026 but
              exposes no underlying dataset in the fetched text. These figures are useful public traction signals, not
              audited financial statements, and the sources do not establish cash on hand, burn, runway, debt, reserve
              requirements, or the portion of funding still available. Capital adequacy therefore remains a diligence
              question even alongside reported profitability.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a monetization thesis built around price-led travel acquisition, recurring Super+
              membership, and cross-sell into financial tools, with reported profitability providing a positive but
              company-attributed signal. It does not support a precise revenue multiple, margin forecast, or cash-runway
              conclusion because stream mix, realized take rates, rewards expense, credit losses, servicing costs, and
              working-capital needs are not publicly reconciled. Independent consumer reviews also flag that membership
              cost, advance limits, repayment terms, cancellation friction, and customer-support performance affect
              realized value and potentially retention. The underwriting posture should therefore distinguish reported
              revenue and funding from cash available, and treat the current financial case as promising but materially
              under-specified until management supplies cohort, segment, and capital-stack schedules.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public metrics are not interchangeable
            body: >-
              Revenue, GMV, funding, valuation, membership, and advertised savings describe different denominators and
              economic layers; this chapter keeps them separate.
            calloutType: assumption
            claimRefs:
              - CI005
              - CI009
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: A broad savings bundle organized around Super+
        blocks:
          - type: paragraph
            body: >-
              The product is best understood as a consumer savings bundle rather than a single-purpose travel or fintech
              application. Super.com's mobile-store materials place discounted hotels, flights, attractions and rental
              cars beside a funded card, credit reporting, cash advances, cashback, games, surveys and subscription
              management. Super+ is the commercial and experience hub: official terms set the current membership fee at
              $15 per month, while several benefits and financial-product access paths depend on active membership. This
              breadth can create more engagement surfaces, but it also increases product-governance complexity because
              travel, payments, credit reporting and reward fulfillment have different counterparties and failure modes.
              Public sources do not provide product-line usage, attachment, retention or contribution-margin data, so
              breadth should not be confused with demonstrated cross-sell.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE010
              - CE014
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE008
              - CE016
      - number: '5.2'
        title: Workflow combines discovery, transactions and follow-on offers
        blocks:
          - type: paragraph
            body: >-
              The customer journey begins in the app with an account and a travel, earning or financial need, then
              routes the user to either a Super.com feature or a partner-supported service. The clearest roadmap signal
              is company-described AI personalization: after a flight booking, the app is intended to surface hotels,
              tours and activities for the destination. That is a commercially coherent recommendation loop, but
              PhocusWire reports it as the company's investment plan rather than as a measured production outcome. The
              App Store listing shows frequent releases and described version 14.11.1 as containing bug fixes and
              performance improvements, yet no public deployment frequency, latency, uptime, incident,
              recommendation-quality or support-resolution metric was found. Technical maturity therefore remains
              evidenced at the distribution surface, not at the service-level objective or operating-control level.
            claimRefs:
              - CE004
              - CE005
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE012
              - CE013
              - CE016
      - number: '5.3'
        title: Public evidence points to an orchestration layer over partner rails
        blocks:
          - type: paragraph
            body: >-
              The observable operating model is partner-heavy. Super.com's legal center says services may be offered by
              Super.com or partners, and the independent card review identifies Republic Bank & Trust Co. as card
              issuer. Travel inventory, linked bank accounts, credit bureaus and fraud tooling add further external
              dependencies. LeadIQ lists Kafka, Airflow, dbt, PostgreSQL and Grafana, but this is a third-party
              technology-detection claim, not a company architecture disclosure; it does not prove which systems are
              production-critical, how data boundaries are enforced, or whether the stack is current. The strongest
              defensibility visible from public evidence is product orchestration and merchandising across categories.
              Proprietary models, data advantages, patents, throughput, failover design and integration contracts remain
              unverified.
            claimRefs:
              - CE003
              - CE006
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE016
      - number: '5.4'
        title: Documented privacy controls coexist with material trust gaps
        blocks:
          - type: paragraph
            body: >-
              Super.com's privacy notice discloses collection of account, booking, payment, device, location,
              communications and fraud-prevention data. It also states that the company uses technical, physical and
              organizational controls, restricted access and Cloudflare Turnstile for bot and fraud defense. These are
              useful control descriptions, but they are self-attested and are not substitutes for independent assurance,
              penetration-test results, incident history, recovery objectives or a public status record. Consumer
              evidence adds a separate service-quality concern: SmartCustomer summarizes reports of unauthorized
              charges, cancellation difficulty, slow support and denied refunds, while one Reddit user reported that a
              hotel lacked the reservation shortly before travel. These observations are anecdotal or
              platform-summarized rather than incidence-rate evidence, but they identify workflows that merit
              operational testing. Public cash-advance limits also conflict, reinforcing the need to verify live terms
              in-product.
            claimRefs:
              - CE008
              - CE009
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Product breadth is visible; technical depth is not
            body: >-
              The public record shows a broad app and an expanding personalization roadmap, but provides no validated
              architecture diagram, performance benchmark, service-level record or independent security certification.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE009
          - type: callout
            title: Live product terms require direct verification
            body: >-
              Independent pages disagree on the maximum cash advance and one review warns that some card information may
              be outdated, so underwriting should use current in-app eligibility, limits and disclosures rather than a
              single public summary.
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: A value-seeking consumer base spans travel and financial use cases
        blocks:
          - type: paragraph
            body: >-
              Super.com serves consumers rather than a disclosed roster of enterprise accounts. Its public app listings
              position hotel booking, Super+ membership, cash advances, credit building, cashback, games, and surveys as
              linked jobs within one mobile product. Independent travel-industry coverage narrows the target further to
              price-sensitive, mobile-first travelers and describes Super+ as a paid layer that combines recurring
              membership revenue with deeper travel discounts. This breadth creates several buyer and user modes, but
              the payer remains the individual consumer through booking spend, membership fees, or product engagement.
              No reviewed source discloses segment-level revenue, active-user mix, or which surface is the dominant
              acquisition entry point.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Public adoption signals are large but use incompatible denominators
        blocks:
          - type: paragraph
            body: >-
              The strongest scale statement is company-issued: the Google Play listing says the product is used by more
              than 20 million users and cites a 4.6+ App Store rating. Independent review evidence confirms meaningful
              public engagement but not active customers: Trustpilot displayed 67,189 reviews and a 4.3 score at access,
              while its automated summary considered 21,762 reviews. Apple's Austrian storefront displayed 30 ratings, a
              local and nonrepresentative denominator. BBB separately reported 1,124 complaints in the last 12 months
              and 2,974 over three years. These figures establish reach and servicing activity, not retention,
              conversion, or complaint rates, because none shares a common customer denominator or cohort.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
              - CU012
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
              - CU012
              - CU016
      - number: '6.3'
        title: Production use is visible, but account-level proof is absent
        blocks:
          - type: paragraph
            body: >-
              Public proof comes from consumer production surfaces rather than named account case studies. Google Play
              and Apple show live distribution; Trustpilot reviews describe completed booking experiences; and BBB
              records disputes involving memberships, bookings, refunds, and support. BBB's February 2026 review
              specifically identified Super+ enrollment as a complaint theme. A separate review aggregator reproduces
              historical allegations about refunds and contact difficulty, while Elliott's consumer guide says phone and
              email support are unavailable. These records are useful adverse evidence but are self-selected and cannot
              measure prevalence. The absence of named customer references is expected for a consumer app, yet
              transaction cohorts, repeat behavior, and support resolution times remain necessary to judge durable
              adoption.
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU008
              - CU013
              - CU014
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU012
              - CU013
              - CU016
      - number: '6.4'
        title: Cross-sell mechanics are visible; retention economics are not
        blocks:
          - type: paragraph
            body: >-
              The expansion thesis is a product journey rather than a verified cohort outcome. Hospitality Today reports
              that metasearch visibility and discounted inventory can bring value-oriented travelers into the funnel,
              while PhocusWire describes a planned personalization loop in which a flight booking can trigger hotel,
              tour, and activity offers. The app listing adds Super+ membership, cashback, card, credit-building, cash
              advance, and earning surfaces that can deepen engagement. Available evidence therefore supports plausible
              land-and-expand paths, but it does not disclose Super+ conversion, renewal, churn, GRR, NRR, contract
              length, acquisition-channel cohorts, or top-channel concentration. Investors should treat recurring
              durability and cross-sell productivity as unverified until cohort data links entry products to repeat
              usage and gross profit.
            claimRefs:
              - CU003
              - CU010
              - CU011
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU010
              - CU011
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Retention remains the central customer-economics gap
            body: >-
              Public reach and ratings do not substitute for Super+ renewal, product activation, repeat booking, churn,
              GRR, NRR, or acquisition-channel cohort data. BBB complaint volume also lacks a transaction denominator,
              so it is a risk signal rather than a measured failure rate.
            calloutType: risk
            claimRefs:
              - CU007
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is the interaction between financial-product claims, recurring membership
              billing, and customer servicing. Super.com's app listing advertises no-credit-check cash advances with no
              fees or interest, while its own guide describes a $15 monthly membership and immediate self-service
              cancellation. Against that positioning, Trustpilot's current profile includes recent complaints about
              unexpected fees, incorrect room configurations, long support waits, and unresolved refunds. These reviews
              are anecdotal and the platform does not fact-check each account, but they identify concrete failure modes
              that legal, compliance, and operations diligence should test. The risk matrix therefore ranks consumer
              compliance and servicing above financing or platform distribution; it does not allege a violation or treat
              missing public incidents as proof of clean status.
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR008
              - CR009
              - CR010
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR016
      - number: '7.2'
        title: Operational and customer execution
        blocks:
          - type: paragraph
            body: >-
              Scale claims increase the cost of weak controls. The company-issued app copy says the product spans
              travel, cash advances, credit-building, cashback, subscription management, shipment protection, games, and
              surveys and is used by more than 20 million users. Trustpilot shows a strong aggregate score, but 12% of
              reviews are one-star and the recent-review summary flags international-card fees and hidden costs;
              individual reviews add room-type, overbooking, refund, and support failures. The aggregate is not a
              representative incident rate, because reviewer selection and invitation practices affect the sample.
              Investment diligence should therefore measure booking defect rates, refund aging, chargebacks,
              contact-center service levels, fraud losses, and complaint rates using transaction and active-customer
              denominators.
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Partner, platform, and capital dependencies
        blocks:
          - type: paragraph
            body: >-
              Super.com's travel proposition depends on hotel counterparties and inventory-system integration: a
              company-issued release says discounts rely on negotiated hotel rates and real-time availability across
              thousands of properties. Distribution and privacy disclosures also depend on mobile storefronts; Apple's
              listing says usage data may be used for cross-company tracking and that user content and usage data may be
              linked to identity. Capital is another execution input rather than a solved risk. PhocusWire reported a
              $65 million Series D and company-stated $1.2 billion valuation, with proceeds intended for new products
              and AI, while the same article relayed company claims of 2025 profitability and 50% revenue growth. Those
              statements do not establish cash on hand, burn, segment margins, or runway.
            claimRefs:
              - CR003
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Mitigations, kill criteria, and diligence conditions
        blocks:
          - type: paragraph
            body: >-
              Public mitigation evidence is narrow. Super.com says members can cancel immediately through self-service
              or an automated phone line and explicitly distinguishes its discount product from broad card-style travel
              insurance. The allocated independent financial pages do not close the model-risk gap: Sacra's fetched
              public page exposes no numerical model outputs, and LeadIQ's August 2026 funding summary is stale relative
              to PhocusWire's July 2026 Series D report. Before investment, management should provide licensing and
              bank-partner documentation, a regulatory and litigation schedule, security certifications and incident
              logs, cash-advance loss and fraud vintages, complaint cohorts, partner concentration, and audited
              cash/runway. Thesis-break triggers are a material enforcement action, repeated refund or booking failures
              without improving cohorts, loss or fraud rates outside underwriting limits, loss of a critical hotel or
              platform partner, or runway falling below the board-approved financing horizon.
            claimRefs:
              - CR004
              - CR005
              - CR011
              - CR012
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not treat absence of a public incident as a clean record
            body: >-
              The assigned evidence does not establish current licensing, enforcement, litigation, security-incident,
              outage, or cash-advance loss history. Close those gaps with primary records and management evidence before
              underwriting the residual-risk labels.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR010
              - CR016
          - type: callout
            title: Investment conditions
            body: >-
              Require a legal-entity and license map, bank and hotel partner concentration, audited cash and runway,
              loss and fraud vintages, booking/refund cohorts, complaint denominators, security attestations, and a
              complete incident and litigation schedule.
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and price sensitivity
        blocks:
          - type: paragraph
            body: >-
              Super.com has a credible scale-and-monetization narrative: PhocusWire reports a $65 million Series D led
              by TPG and says the company stated a $1.2 billion valuation, while the same report says Super.com became
              profitable in 2025 and reported 50% revenue growth. The Product Market Fit Show account adds useful
              operating context, describing a $15 monthly Super+ membership, a product pivot from hotel booking into
              financial tools, and reported 2025 revenue of about $200 million; however, that account is based on the
              founder's narrative and should not be treated as audited financial disclosure. On the reported figures,
              $1.2 billion divided by $200 million is approximately 6.0x revenue, but this is an indicative multiple,
              not ARR or a verified run-rate. The company-controlled site emphasizes up to 40% hotel discounts, 10%
              Super+ hotel cashback, and a secured-card structure, supporting the monetization proposition but not
              proving contribution margin or retention. The positive thesis is a differentiated value proposition that
              can combine travel acquisition with recurring membership and fintech cross-sell. The anti-thesis is that
              discounts, cashback, support obligations, credit exposure, and third-party booking friction may make gross
              revenue a poor proxy for durable free cash flow. A buy call therefore requires segment-level revenue,
              gross-margin, cohort-retention, loss-rate, and cap-table evidence that is not public in this pool.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
      - number: '8.2'
        title: Bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              Scenario valuation should be disciplined around what is known versus what is merely claimed. The bull case
              assumes the reported $200 million of 2025 revenue is comparable to the valuation numerator, that 50%
              growth persists for several years, and that Super+ and financial products improve recurring mix without
              disproportionate credit, servicing, or acquisition costs. The base case gives more weight to the reported
              $1.2 billion mark but applies a hold/track posture because the evidence does not establish revenue
              composition, gross margin, recurring revenue, or retention. The bear case treats the reported valuation as
              vulnerable to a down-round or multiple compression if growth normalizes, booking disputes increase support
              cost, or cash-advance and card economics require more capital than the headline model suggests. These are
              probability signals rather than a formal discounted-cash-flow output: the pool contains no audited
              statements, capitalization table, liquidation preferences, debt schedule, or independently verified cohort
              dataset. Entry discipline should therefore prioritize price and information rights over a precise target
              price.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV010
              - CV011
              - CV013
      - number: '8.3'
        title: Diligence asks and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not established by the funding headline alone. PhocusWire provides an independent
              financing datapoint, but the public record here does not disclose investor preference structure, secondary
              liquidity, debt, board rights, or an exit timetable. Super.com's own disclosures say its card is issued by
              Republic Bank & Trust Company and that Super.com is not a bank or FDIC insured; this makes partner,
              compliance, and balance-sheet diligence central to any valuation decision. Adverse review evidence is
              mixed: competitor Gerald says user experiences vary and identifies customer-service issues around
              cancellations and refunds, while a low-reputation review site notes reported concerns about
              non-transparent subscription enrollment and booking inconsistencies. Those sources are not representative
              customer cohorts, but they are downside signals that should be tested rather than dismissed. The assigned
              Rakuten investor-document landing page yielded no usable current trading multiple, so it cannot anchor a
              public-comparable valuation. Final diligence should request monthly revenue by travel, membership, and
              financial products; gross margin and contribution margin by segment; Super+ twelve-month retention and
              ARPU; cash-advance approval, delinquency, and loss data; card economics; full capitalization and
              preference terms; and complaint/refund metrics. The thesis breaks if growth falls materially below plan
              while support, credit, or acquisition costs rise, if regulatory or partner restrictions impair the
              financial products, or if the next financing materially resets the reported $1.2 billion mark.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Recommendation
        blocks:
          - type: paragraph
            body: >-
              Recommendation: track, with medium confidence and a stretched valuation stance. The operating evidence is
              attractive enough to merit continued diligence, but the reported 6.0x revenue framing is not sufficient
              for a buy decision because the numerator is founder/company-reported, revenue quality is not disclosed,
              and preference overhang and dilution are unknown. A more favorable call would require verified segment
              economics and a price that compensates for customer-service, regulatory-partner, credit, and liquidity
              risks. A less favorable call follows if the reported revenue is gross booking value rather than recognized
              revenue, if membership retention is weak, or if financing terms place common-equity investors behind
              substantial liquidation preferences.
            claimRefs:
              - CV001
              - CV006
              - CV010
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track at the reported mark
            body: >-
              The operating narrative is compelling, but the reported valuation is price-sensitive and the public
              evidence does not establish durable segment economics or investor preference terms.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV010
              - CV013
          - type: callout
            title: Revenue quality is the key unknown
            body: >-
              A reported revenue figure should not be treated as ARR, recognized revenue, or cash generation until the
              segment bridge and accounting basis are provided.
            calloutType: risk
            claimRefs:
              - CV002
              - CV007
