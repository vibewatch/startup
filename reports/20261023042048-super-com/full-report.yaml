  - id: FE001
    title: Observable product architecture and dependency map
    type: stack
    summary: >-
      The product appears as a consumer orchestration layer spanning several vertical services and external fulfillment
      rails.
    data:
      layers:
        - name: Consumer surfaces
          label: Consumer surfaces
          detail: Public mobile and web entry points expose the bundled product.
          modules:
            - label: Mobile app
              detail: Travel, membership, card, advance, rewards and earning workflows.
            - label: Website
              detail: Account, legal and travel-service access.
        - name: Identity and membership
          label: Identity and membership
          detail: Account and entitlement controls connect the product modules.
          modules:
            - label: User account
              detail: Identity and payment credentials govern service access.
            - label: Super+ entitlement
              detail: Recurring billing and membership status control benefits.
        - name: Product modules
          label: Product modules
          detail: Multiple consumer jobs share one distribution surface.
          modules:
            - label: Travel
              detail: Hotels, flights, activities and rental-car offers.
            - label: Card and cash advance
              detail: Funded card spending, credit reporting and short-term liquidity.
            - label: Earnings and rewards
              detail: Games, surveys, cashback and promotional credits.
        - name: Recommendation and data use
          label: Recommendation and data use
          detail: Interaction and travel context support administration and offers.
          modules:
            - label: Booking context
              detail: Destination and transaction activity can inform adjacent offers.
            - label: Location and technical data
              detail: The privacy notice discloses collection of these data classes.
            - label: AI personalization
              detail: Company-described roadmap for destination-specific recommendations.
        - name: External rails
          label: External rails
          detail: Third parties are necessary to fulfill travel and financial services.
          modules:
            - label: Travel providers
              detail: Inventory and fulfillment dependencies are externally supplied.
            - label: Republic Bank
              detail: NerdWallet identifies the bank as card issuer.
            - label: Credit bureaus
              detail: Reporting is part of the credit-building proposition.
        - name: Trust and support
          label: Trust and support
          detail: Controls and remediation processes span the shared product surface.
          modules:
            - label: Access controls
              detail: Official privacy disclosures describe restricted system access.
            - label: Cloudflare Turnstile
              detail: Officially disclosed bot and fraud-defense dependency.
            - label: Customer support and disputes
              detail: Booking, cancellation, refund and account remediation workflows.
    approximationNotes: >-
      This is an evidence-bounded operating-model view, not a verified internal system topology; component ownership,
      interfaces and service levels are not public.
