      - [Hotel bookings, "Up to 40%-50% savings advertised", "Discounted inventory and possible member cashback", "Realized price versus OTA, take rate, cancellation/refund cost", "Headline discount cannot be used as revenue or margin"]
      - [Super.com Card, "1% cashback advertised", "Credit-building and spend-linked rewards", "Interchange, funding, charge-offs, and rewards expense", "Card economics may be positive or negative depending on usage mix"]
      - [Cash advance, "Up to $250 reported; optional tip or expedited fee described by reviews", "Short-term liquidity for qualifying members", "Exact fee, repayment, underwriting, loss, and state-by-state structure", "Advance volume can add both revenue and credit/regulatory exposure"]
      - [Earning activities, "Up to $400-$430/month advertised for some members", "Games, surveys, missions, and referrals", "Partner payout rate, fraud, and actual member earnings distribution", "Promotional maxima should not be modeled as typical user income"]
    notes: "Prices and ceilings are list or reported terms, not realized revenue; current contracts, discounts, eligibility, and costs are not disclosed in the fetched sources."
    claimRefs: [CI002, CI003, CI013, CI015]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value, Confidence, Why it matters, Diligence request]
    rows:
      - [Revenue, "Approximately $200M for 2025 reported in a founder-interview account", "Medium; third-party account of company-reported figure", "Anchors scale but not audited quality or segment mix", "Audited income statement and revenue-recognition policy"]
      - [Revenue growth, "50% reported for 2025; another account says 40%+", "Medium; company-attributed reports differ in phrasing", "Growth can mask mix or margin pressure", "Monthly revenue bridge by product and cohort"]
      - [Profitability, "Company reported profitability in 2025", "Medium; no statement or margin disclosed", "Profitability is a positive signal but may be narrow or adjusted", "GAAP/IFRS reconciliation, EBITDA bridge, and cash-flow statement"]
      - [Pre-COVID travel margin, "10%-15% margin on over $100M GMV", "Low-to-medium; historical founder account", "Shows prior transaction economics but not current mix", "Define margin and provide current travel contribution margin"]
      - [Headcount, "About 300 employees reported in 2026 account", "Medium; third-party account of company-reported figure", "Signals operating cost base and product investment", "Current payroll, contractor spend, and allocation by product"]
      - [Cash runway, null, "Unavailable", "Determines financing dependency despite reported profitability", "Cash balance, monthly burn, restricted cash, and runway case"]
    notes: "Null means the metric was not disclosed in the assigned fetched sources; reported values are not independently audited and historical GMV margin is not interchangeable with current gross margin."
    claimRefs: [CI005, CI009, CI010, CI011, CI012]
figures:
  - id: FI001
    title: Public revenue-model bridge
    type: flow
    summary: Customer travel and financial activity feed transactional and recurring monetization, while rewards and credit costs determine the unobserved contribution outcome.
    data:
      nodes:
        - {id: customer-activity, label: "Customer activity", detail: "Hotel bookings, card spend, cash advances, and earning activity"}
        - {id: travel-acquisition, label: "Travel acquisition", detail: "Discounted hotel inventory is the reported front door"}
        - {id: membership, label: "Super+ membership", detail: "$15/month reported in founder interview"}
        - {id: transaction-revenue, label: "Transactional revenue", detail: "Booking margin and financial-product economics are not disclosed"}
        - {id: recurring-revenue, label: "Recurring revenue", detail: "Membership revenue reported as added to transactional revenue"}
        - {id: contribution-outcome, label: "Contribution outcome", detail: "Rewards, credit losses, servicing, support, and acquisition costs remain unquantified"}
      edges:
        - {from: customer-activity, to: travel-acquisition}
        - {from: customer-activity, to: membership}
        - {from: travel-acquisition, to: transaction-revenue}
        - {from: membership, to: recurring-revenue}
        - {from: transaction-revenue, to: contribution-outcome}
        - {from: recurring-revenue, to: contribution-outcome}
    approximationNotes: "This is an evidence-backed mechanism map, not a quantitative bridge; no node value is inferred where the assigned sources are silent."
    claimRefs: [CI001, CI002, CI004, CI014]
callouts:
  - calloutType: assumption
    title: Public metrics are not interchangeable
    body: Revenue, GMV, funding, valuation, membership, and advertised savings describe different denominators and economic layers; this chapter keeps them separate.
    claimRefs: [CI005, CI009, CI012]
