company:
  name: Super.com
chapter:
  number: 4
  title: Financials
  summary: Super.com combines discounted travel, paid membership, cashback, earning tools, and cash advances, but public evidence does not disclose segment revenue, realized pricing, loss rates, or cash runway. The strongest current evidence points to a growing and reportedly profitable business, while underwriting still depends on private cohort, margin, and capital-stack data.
sections:
  - id: monetization-model
    title: Monetization model and revenue quality
    body: Super.com presents a multi-product consumer savings model rather than a single-purpose SaaS model. Its travel front door monetizes discounted hotel inventory and related booking activity, while Super+ adds recurring membership revenue and bundles deeper hotel discounts, cashback, a card, cash advances, and other savings tools. An independent founder-interview account describes Super+ as a $15/month membership and says the company added recurring revenue on top of transactional revenue after placing the card behind the paywall. The official app-store descriptions separately advertise hotel discounts, cashback, earning activities, credit-building, and cash advances, but they do not disclose realized take rates, revenue recognition, or contribution margins. Consequently, list benefits and company-reported traction should not be treated as revenue or gross profit without segment reporting.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-and-costs
    title: Unit economics, cost structure, and operating leverage
    body: Public materials provide useful mechanism clues but not a complete unit-economic bridge. Super.com is described as sourcing hotel rates through closed or negotiated channels and retaining a margin after paying the hotel, while its app surfaces additional benefits such as cashback and discounts. The founder account says the pre-COVID travel business exceeded $100 million of GMV at a 10–15% margin, but that historical margin is not defined as gross margin, contribution margin, or accounting profit and is not evidence of the current mix. The same account says the company cut 20–30% of staff during COVID, later devoted more than half of staff to products that initially generated no revenue, and made the paid membership a mechanism for usage and retention. These facts suggest meaningful customer-acquisition, rewards, support, credit, and product-development costs, but no public source supplies CAC, payback, default loss, servicing cost, or gross margin by stream.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: traction-and-capital-adequacy
    title: Public traction and forward capital needs
    body: Current third-party coverage reports that Super.com raised $65 million in Series D funding led by TPG at a stated $1.2 billion valuation, and that the company said it became profitable in 2025 while growing revenue by 50%. A separate founder-interview account reports approximately $200 million of 2025 revenue, more than 50% year-over-year growth, about 300 employees, and a Super+ base approaching one million members, while another current analysis page labels the company report as published October 12, 2026 but exposes no underlying dataset in the fetched text. These figures are useful public traction signals, not audited financial statements, and the sources do not establish cash on hand, burn, runway, debt, reserve requirements, or the portion of funding still available. Capital adequacy therefore remains a diligence question even alongside reported profitability.
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: The evidence supports a monetization thesis built around price-led travel acquisition, recurring Super+ membership, and cross-sell into financial tools, with reported profitability providing a positive but company-attributed signal. It does not support a precise revenue multiple, margin forecast, or cash-runway conclusion because stream mix, realized take rates, rewards expense, credit losses, servicing costs, and working-capital needs are not publicly reconciled. Independent consumer reviews also flag that membership cost, advance limits, repayment terms, cancellation friction, and customer-support performance affect realized value and potentially retention. The underwriting posture should therefore distinguish reported revenue and funding from cash available, and treat the current financial case as promising but materially under-specified until management supplies cohort, segment, and capital-stack schedules.
    claimRefs: [CI013, CI014, CI015, CI016]
    callouts:
      - calloutType: strength
        title: Reported profitability is a positive signal, not a margin schedule
        body: Current coverage reports profitability in 2025 and 50% revenue growth, but no fetched source provides audited statements or segment margins.
        claimRefs: [CI009, CI010]
      - calloutType: risk
        title: Cash runway and credit-loss exposure remain unverified
        body: Public evidence does not disclose cash on hand, burn, advance loss rates, servicing costs, or debt and reserve obligations.
        claimRefs: [CI012, CI015]
      - calloutType: recommendation
        title: Request a segment-level underwriting pack
        body: Management should provide revenue and gross-profit bridges by travel, membership, card, cashback, earning, and cash-advance products, plus cohort retention and capital-adequacy schedules.
        claimRefs: [CI014, CI016]
