company:
  name: Super.com
chapter:
  number: 7
  title: Risks
  summary: >-
    Consumer-compliance and servicing risk ranks highest in the available evidence because Super.com combines cash advances, a recurring membership, travel booking, credit-building, and rewards while recent customer reviews still describe fee, room-fulfillment, support, and refund failures. The public evidence does not establish company-specific licensing, loss rates, partner concentration, incident history, or runway, so these remain diligence conditions rather than assumed mitigations.
sections:
  - id: severity-ranked-risk-posture
    title: Severity-ranked risk posture
    body: >-
      The highest residual exposure is the interaction between financial-product claims, recurring membership billing, and customer servicing. Super.com's app listing advertises no-credit-check cash advances with no fees or interest, while its own guide describes a $15 monthly membership and immediate self-service cancellation. Against that positioning, Trustpilot's current profile includes recent complaints about unexpected fees, incorrect room configurations, long support waits, and unresolved refunds. These reviews are anecdotal and the platform does not fact-check each account, but they identify concrete failure modes that legal, compliance, and operations diligence should test. The risk matrix therefore ranks consumer compliance and servicing above financing or platform distribution; it does not allege a violation or treat missing public incidents as proof of clean status.
    claimRefs: [CR001, CR004, CR006, CR007, CR008, CR009, CR010, CR016]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operational-and-customer-execution
    title: Operational and customer execution
    body: >-
      Scale claims increase the cost of weak controls. The company-issued app copy says the product spans travel, cash advances, credit-building, cashback, subscription management, shipment protection, games, and surveys and is used by more than 20 million users. Trustpilot shows a strong aggregate score, but 12% of reviews are one-star and the recent-review summary flags international-card fees and hidden costs; individual reviews add room-type, overbooking, refund, and support failures. The aggregate is not a representative incident rate, because reviewer selection and invitation practices affect the sample. Investment diligence should therefore measure booking defect rates, refund aging, chargebacks, contact-center service levels, fraud losses, and complaint rates using transaction and active-customer denominators.
    claimRefs: [CR002, CR006, CR007, CR008, CR009, CR010]
    tableRefs: [TR002]
  - id: partner-platform-and-capital-dependencies
    title: Partner, platform, and capital dependencies
    body: >-
      Super.com's travel proposition depends on hotel counterparties and inventory-system integration: a company-issued release says discounts rely on negotiated hotel rates and real-time availability across thousands of properties. Distribution and privacy disclosures also depend on mobile storefronts; Apple's listing says usage data may be used for cross-company tracking and that user content and usage data may be linked to identity. Capital is another execution input rather than a solved risk. PhocusWire reported a $65 million Series D and company-stated $1.2 billion valuation, with proceeds intended for new products and AI, while the same article relayed company claims of 2025 profitability and 50% revenue growth. Those statements do not establish cash on hand, burn, segment margins, or runway.
    claimRefs: [CR003, CR011, CR012, CR013, CR014]
    tableRefs: [TR003]
  - id: mitigations-kill-criteria-and-diligence
    title: Mitigations, kill criteria, and diligence conditions
    body: >-
      Public mitigation evidence is narrow. Super.com says members can cancel immediately through self-service or an automated phone line and explicitly distinguishes its discount product from broad card-style travel insurance. The allocated independent financial pages do not close the model-risk gap: Sacra's fetched public page exposes no numerical model outputs, and LeadIQ's August 2026 funding summary is stale relative to PhocusWire's July 2026 Series D report. Before investment, management should provide licensing and bank-partner documentation, a regulatory and litigation schedule, security certifications and incident logs, cash-advance loss and fraud vintages, complaint cohorts, partner concentration, and audited cash/runway. Thesis-break triggers are a material enforcement action, repeated refund or booking failures without improving cohorts, loss or fraud rates outside underwriting limits, loss of a critical hotel or platform partner, or runway falling below the board-approved financing horizon.
    claimRefs: [CR004, CR005, CR011, CR012, CR014, CR015]
