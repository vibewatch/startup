callouts:
  - calloutType: risk
    title: Do not treat absence of a public incident as a clean record
    body: >-
      The assigned evidence does not establish current licensing, enforcement, litigation, security-incident, outage, or cash-advance loss history. Close those gaps with primary records and management evidence before underwriting the residual-risk labels.
    claimRefs: [CR001, CR003, CR010, CR016]
  - calloutType: recommendation
    title: Investment conditions
    body: >-
      Require a legal-entity and license map, bank and hotel partner concentration, audited cash and runway, loss and fraud vintages, booking/refund cohorts, complaint denominators, security attestations, and a complete incident and litigation schedule.
    claimRefs: [CR008, CR010, CR011, CR012, CR013, CR016]
