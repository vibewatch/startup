company:
  name: "Super.com"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Super.com has broad consumer reach across travel, membership, rewards, and
    financial tools, with the company claiming more than 20 million users and
    public review platforms showing substantial engagement. The evidence is
    materially weaker on retention, cohort economics, and concentration, while
    BBB complaint volume and recurring-enrollment concerns make customer
    durability a central diligence risk.
sections:
  - id: "customer-segments"
    title: "A value-seeking consumer base spans travel and financial use cases"
    body: >-
      Super.com serves consumers rather than a disclosed roster of enterprise
      accounts. Its public app listings position hotel booking, Super+
      membership, cash advances, credit building, cashback, games, and surveys
      as linked jobs within one mobile product. Independent travel-industry
      coverage narrows the target further to price-sensitive, mobile-first
      travelers and describes Super+ as a paid layer that combines recurring
      membership revenue with deeper travel discounts. This breadth creates
      several buyer and user modes, but the payer remains the individual
      consumer through booking spend, membership fees, or product engagement.
      No reviewed source discloses segment-level revenue, active-user mix, or
      which surface is the dominant acquisition entry point.
    claimRefs: ["CU001", "CU002", "CU003"]
    tableRefs: ["TU001"]
  - id: "adoption-signals"
    title: "Public adoption signals are large but use incompatible denominators"
    body: >-
      The strongest scale statement is company-issued: the Google Play listing
      says the product is used by more than 20 million users and cites a 4.6+
      App Store rating. Independent review evidence confirms meaningful public
      engagement but not active customers: Trustpilot displayed 67,189 reviews
      and a 4.3 score at access, while its automated summary considered 21,762
      reviews. Apple's Austrian storefront displayed 30 ratings, a local and
      nonrepresentative denominator. BBB separately reported 1,124 complaints
      in the last 12 months and 2,974 over three years. These figures establish
      reach and servicing activity, not retention, conversion, or complaint
      rates, because none shares a common customer denominator or cohort.
    claimRefs: ["CU004", "CU005", "CU006", "CU007", "CU009", "CU012", "CU016"]
    tableRefs: ["TU002"]
  - id: "customer-proof-quality"
    title: "Production use is visible, but account-level proof is absent"
    body: >-
      Public proof comes from consumer production surfaces rather than named
      account case studies. Google Play and Apple show live distribution;
      Trustpilot reviews describe completed booking experiences; and BBB
      records disputes involving memberships, bookings, refunds, and support.
      BBB's February 2026 review specifically identified Super+ enrollment as a
      complaint theme. A separate review aggregator reproduces historical
      allegations about refunds and contact difficulty, while Elliott's
      consumer guide says phone and email support are unavailable. These
      records are useful adverse evidence but are self-selected and cannot
      measure prevalence. The absence of named customer references is expected
      for a consumer app, yet transaction cohorts, repeat behavior, and support
      resolution times remain necessary to judge durable adoption.
    claimRefs: ["CU004", "CU005", "CU007", "CU008", "CU013", "CU014", "CU016"]
    tableRefs: ["TU003"]
  - id: "durability-and-expansion"
    title: "Cross-sell mechanics are visible; retention economics are not"
    body: >-
      The expansion thesis is a product journey rather than a verified cohort
      outcome. Hospitality Today reports that metasearch visibility and
      discounted inventory can bring value-oriented travelers into the funnel,
      while PhocusWire describes a planned personalization loop in which a
      flight booking can trigger hotel, tour, and activity offers. The app
      listing adds Super+ membership, cashback, card, credit-building, cash
      advance, and earning surfaces that can deepen engagement. Available
      evidence therefore supports plausible land-and-expand paths, but it does
      not disclose Super+ conversion, renewal, churn, GRR, NRR, contract length,
      acquisition-channel cohorts, or top-channel concentration. Investors
      should treat recurring durability and cross-sell productivity as
      unverified until cohort data links entry products to repeat usage and
      gross profit.
    claimRefs: ["CU003", "CU010", "CU011", "CU015"]
    figureRefs: ["FU001"]
