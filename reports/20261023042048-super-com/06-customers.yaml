    approximationNotes: "Stage order reflects publicly described product touchpoints; no conversion rates, cohort sizes, or proportional stage widths are inferred."
    claimRefs: ["CU010", "CU011", "CU015"]
callouts:
  - calloutType: "risk"
    title: "Retention remains the central customer-economics gap"
    body: >-
      Public reach and ratings do not substitute for Super+ renewal, product
      activation, repeat booking, churn, GRR, NRR, or acquisition-channel cohort
      data. BBB complaint volume also lacks a transaction denominator, so it is
      a risk signal rather than a measured failure rate.
    claimRefs: ["CU007", "CU015", "CU016"]
