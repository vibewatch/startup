schemaVersion: "report-v2"
artifact: product-tech
slug: super-com
runDate: "2026-10-23"
company:
  name: Super.com
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Super.com presents one consumer app that combines travel booking, a paid
    membership, card and cash-advance products, rewards, and earning features.
    The public record supports the breadth of the product and several partner
    dependencies, but not enough internal architecture, reliability,
    certification, or product-level performance evidence to underwrite
    technical defensibility.
sections:
  - id: product-bundle
    title: A broad savings bundle organized around Super+
    body: >-
      The product is best understood as a consumer savings bundle rather than a
      single-purpose travel or fintech application. Super.com's mobile-store
      materials place discounted hotels, flights, attractions and rental cars
      beside a funded card, credit reporting, cash advances, cashback, games,
      surveys and subscription management. Super+ is the commercial and
      experience hub: official terms set the current membership fee at $15 per
      month, while several benefits and financial-product access paths depend
      on active membership. This breadth can create more engagement surfaces,
      but it also increases product-governance complexity because travel,
      payments, credit reporting and reward fulfillment have different
      counterparties and failure modes. Public sources do not provide
      product-line usage, attachment, retention or contribution-margin data,
      so breadth should not be confused with demonstrated cross-sell.
    claimRefs: [CE001, CE002, CE003, CE010]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: workflow-and-personalization
    title: Workflow combines discovery, transactions and follow-on offers
    body: >-
      The customer journey begins in the app with an account and a travel,
      earning or financial need, then routes the user to either a Super.com
      feature or a partner-supported service. The clearest roadmap signal is
      company-described AI personalization: after a flight booking, the app is
      intended to surface hotels, tours and activities for the destination.
      That is a commercially coherent recommendation loop, but PhocusWire
      reports it as the company's investment plan rather than as a measured
      production outcome. The App Store listing shows frequent releases and
      described version 14.11.1 as containing bug fixes and performance
      improvements, yet no public deployment frequency, latency, uptime,
      incident, recommendation-quality or support-resolution metric was found.
      Technical maturity therefore remains evidenced at the distribution
      surface, not at the service-level objective or operating-control level.
    claimRefs: [CE004, CE005, CE007]
    tableRefs: [TE002]
  - id: architecture-and-dependencies
    title: Public evidence points to an orchestration layer over partner rails
    body: >-
      The observable operating model is partner-heavy. Super.com's legal center
      says services may be offered by Super.com or partners, and the independent
      card review identifies Republic Bank & Trust Co. as card issuer. Travel
      inventory, linked bank accounts, credit bureaus and fraud tooling add
      further external dependencies. LeadIQ lists Kafka, Airflow, dbt,
      PostgreSQL and Grafana, but this is a third-party technology-detection
      claim, not a company architecture disclosure; it does not prove which
      systems are production-critical, how data boundaries are enforced, or
      whether the stack is current. The strongest defensibility visible from
      public evidence is product orchestration and merchandising across
      categories. Proprietary models, data advantages, patents, throughput,
      failover design and integration contracts remain unverified.
    claimRefs: [CE003, CE006, CE016]
    tableRefs: [TE003]
  - id: trust-controls-and-product-risk
    title: Documented privacy controls coexist with material trust gaps
    body: >-
      Super.com's privacy notice discloses collection of account, booking,
      payment, device, location, communications and fraud-prevention data. It
      also states that the company uses technical, physical and organizational
      controls, restricted access and Cloudflare Turnstile for bot and fraud
      defense. These are useful control descriptions, but they are
      self-attested and are not substitutes for independent assurance,
      penetration-test results, incident history, recovery objectives or a
      public status record. Consumer evidence adds a separate service-quality
      concern: SmartCustomer summarizes reports of unauthorized charges,
      cancellation difficulty, slow support and denied refunds, while one
      Reddit user reported that a hotel lacked the reservation shortly before
      travel. These observations are anecdotal or platform-summarized rather
      than incidence-rate evidence, but they identify workflows that merit
      operational testing. Public cash-advance limits also conflict, reinforcing
      the need to verify live terms in-product.
    claimRefs: [CE008, CE009, CE011, CE012, CE013, CE014, CE015]
callouts:
  - calloutType: insight
    title: Product breadth is visible; technical depth is not
    body: >-
      The public record shows a broad app and an expanding personalization
      roadmap, but provides no validated architecture diagram, performance
      benchmark, service-level record or independent security certification.
    claimRefs: [CE001, CE004, CE006, CE009]
  - calloutType: risk
    title: Live product terms require direct verification
    body: >-
      Independent pages disagree on the maximum cash advance and one review
      warns that some card information may be outdated, so underwriting should
      use current in-app eligibility, limits and disclosures rather than a
      single public summary.
    claimRefs: [CE014, CE015]
