      - Diligence gap
    rows:
      - ["Super Travel", "Book discounted hotels and adjacent travel", "Live in mobile-store listing", "Membership cashback layered onto travel discounts", "Bookings, take rate, supplier coverage and fulfillment-failure rate"]
      - ["Super+", "Access bundled savings and product benefits", "Live recurring membership at $15 per month", "One subscription links travel, card, advance and reward benefits", "Paid-member cohorts, attach rate, benefit cost and cancellation rate"]
      - ["Super.com Card", "Build credit and earn cashback using linked funds", "Live product independently reviewed in 2026", "No-credit-check funded spending with bureau reporting", "Active accounts, bureau-reporting outcomes, loss exposure and partner SLAs"]
      - ["Cash Advance", "Bridge short-term liquidity without a credit check", "Marketed publicly, but limits conflict across sources", "Membership-linked access and no-interest positioning", "Live limit, fee schedule, eligibility, repayment and default performance"]
      - ["Super Earn and rewards", "Earn cash or credits through games, surveys and offers", "Live in mobile-store listing", "Adds earning engagement to the savings bundle", "Offer-wall partners, fulfillment rate, economics and fraud controls"]
    notes: "Status reflects public evidence available on 2026-10-23; maturity is not a measure of adoption, retention, profitability or control effectiveness."
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE010, CE014, CE015]
  - id: TE002
    title: Customer workflow and observable limitations
    columns:
      - User job
      - Current workflow
      - Super.com solution
      - Public benefit signal
      - Limitation
    rows:
      - ["Plan travel", "Search and book components separately", "Hotel, flight, activity and rental-car offers in one app", "Company advertises travel discounts and membership cashback", "No public inventory coverage, conversion or fulfillment SLA"]
      - ["Build credit", "Use a secured or alternative card and monitor reporting", "Link funds, spend through the Super.com Card and report activity to bureaus", "No hard credit check and no-interest structure reported", "No disclosed score-lift distribution or graduation path"]
      - ["Access short-term funds", "Apply for liquidity and repay under product terms", "Membership-linked cash advance", "No-interest and no-credit-check positioning", "Public maximums conflict and repayment performance is undisclosed"]
      - ["Extend a trip purchase", "Book a flight and later search destination products", "Company-described AI surfaces hotels, tours and activities", "Potentially reduces repeated discovery work", "Roadmap claim lacks production adoption and recommendation-quality metrics"]
    notes: "Benefits are company claims or third-party descriptions, not measured outcomes; null operating metrics are explicit diligence gaps."
    claimRefs: [CE001, CE002, CE003, CE004, CE012, CE013, CE016]
  - id: TE003
    title: Technology and operating architecture evidence
    columns:
      - Layer or dependency
      - Observable role
      - Public evidence
      - Principal risk
    rows:
      - ["Consumer surfaces", "Account, discovery, booking, rewards and financial access", "iOS and Android listings show a broad live app", "A shared surface concentrates experience and support failures"]
      - ["Membership orchestration", "Eligibility, billing and benefit access across modules", "Official terms define recurring billing and benefit restrictions", "Cancellation, authorization and entitlement errors can affect multiple products"]
      - ["Data and personalization", "Use interaction, booking, location and technical data to tailor services", "Privacy notice describes collected data; company says it is investing in AI personalization", "Model quality, consent boundaries and governance are not independently tested"]
      - ["Financial and travel rails", "Issue cards, move funds, report credit and fulfill travel", "Republic Bank and third-party travel-provider dependencies are publicly identified", "Counterparty outages, reconciliation and service ownership are undisclosed"]
      - ["Internal data tooling", "Possible event, workflow, transformation, storage and monitoring stack", "LeadIQ lists Kafka, Airflow, dbt, PostgreSQL and Grafana", "Third-party detection does not establish production use, topology or resilience"]
      - ["Trust and fraud controls", "Restrict access and distinguish bots from users", "Official notice describes organizational controls and Cloudflare Turnstile", "No public certification, penetration test, SLO or incident-history evidence"]
    notes: "Architecture is limited to observable interfaces, legal disclosures and third-party technology detection; no internal topology is inferred."
    claimRefs: [CE003, CE004, CE006, CE007, CE008, CE009, CE010, CE016]
figures:
  - id: FE001
    title: Observable product architecture and dependency map
    type: stack
    summary: >-
      The product appears as a consumer orchestration layer spanning several
      vertical services and external fulfillment rails.
    data:
      layers:
        - name: Consumer surfaces
          label: Consumer surfaces
          detail: Public mobile and web entry points expose the bundled product.
          modules:
            - label: Mobile app
              detail: Travel, membership, card, advance, rewards and earning workflows.
            - label: Website
              detail: Account, legal and travel-service access.
        - name: Identity and membership
          label: Identity and membership
          detail: Account and entitlement controls connect the product modules.
          modules:
            - label: User account
              detail: Identity and payment credentials govern service access.
            - label: Super+ entitlement
              detail: Recurring billing and membership status control benefits.
        - name: Product modules
          label: Product modules
          detail: Multiple consumer jobs share one distribution surface.
          modules:
            - label: Travel
              detail: Hotels, flights, activities and rental-car offers.
            - label: Card and cash advance
              detail: Funded card spending, credit reporting and short-term liquidity.
            - label: Earnings and rewards
              detail: Games, surveys, cashback and promotional credits.
        - name: Recommendation and data use
          label: Recommendation and data use
          detail: Interaction and travel context support administration and offers.
          modules:
            - label: Booking context
              detail: Destination and transaction activity can inform adjacent offers.
            - label: Location and technical data
              detail: The privacy notice discloses collection of these data classes.
            - label: AI personalization
              detail: Company-described roadmap for destination-specific recommendations.
        - name: External rails
          label: External rails
          detail: Third parties are necessary to fulfill travel and financial services.
          modules:
            - label: Travel providers
              detail: Inventory and fulfillment dependencies are externally supplied.
            - label: Republic Bank
              detail: NerdWallet identifies the bank as card issuer.
            - label: Credit bureaus
              detail: Reporting is part of the credit-building proposition.
        - name: Trust and support
          label: Trust and support
          detail: Controls and remediation processes span the shared product surface.
          modules:
            - label: Access controls
              detail: Official privacy disclosures describe restricted system access.
            - label: Cloudflare Turnstile
              detail: Officially disclosed bot and fraud-defense dependency.
            - label: Customer support and disputes
              detail: Booking, cancellation, refund and account remediation workflows.
    approximationNotes: >-
      This is an evidence-bounded operating-model view, not a verified internal
      system topology; component ownership, interfaces and service levels are
      not public.
    claimRefs: [CE001, CE004, CE008, CE016]
