evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: A current legal-entity or company-issued headquarters record reconciled with the 2022 San Francisco move.
    whyItMatters: >-
      Location affects corporate domicile, operating footprint, hiring, and interpretation of the Toronto and San
      Francisco descriptions.
    diligencePath: Obtain a current corporate profile, registration extract, or board-approved company fact sheet.
    relatedQuestionRefs:
      - QO001
      - QO008
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current executive roster, board composition, investor rights, and succession coverage.
    whyItMatters: >-
      Founder-led execution and regulated product partnerships make governance and key-person dependence important to
      underwriting.
    diligencePath: Request an organizational chart, board materials, cap table, and investor-rights summary under NDA.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A transaction-by-transaction capital schedule separating primary equity, secondary sales, credit facilities, and
      debt.
    whyItMatters: Headline funding raised does not equal cash available to fund operations or dilution borne by investors.
    diligencePath: Reconcile signed financing documents, capitalization tables, and debt schedules.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: scale
    missingEvidence: >-
      Audited revenue definition, product mix, active customer and Super+ member definitions, retention, and current
      headcount.
    whyItMatters: Valuation and growth claims cannot be compared without common periods, denominators, and segment economics.
    diligencePath: Request monthly cohort, revenue-recognition, margin, credit-loss, and workforce schedules.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: access-blocked
    severity: minor
    topic: adverse
    missingEvidence: Complaint counts, response outcomes, and any regulatory correspondence related to Super+ enrollment.
    whyItMatters: The BBB signal identifies a customer-risk area but does not quantify severity, recurrence, or remediation.
    diligencePath: Obtain complaint logs, subscription-consent controls, refund data, and regulator correspondence.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A bottom-up Super.com SAM and SOM with reachable users, active customers, paid members, travel transaction volume,
      take rate, and product-level margins.
    whyItMatters: Macro tourism output cannot establish the revenue pool or attainable share for a bundled consumer app.
    diligencePath: >-
      Request management's market model and reconcile every layer to product telemetry, geographies, eligibility,
      conversion, and audited revenue.
    relatedQuestionRefs:
      - QM009
