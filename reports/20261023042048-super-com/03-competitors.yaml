    claimRefs: [CP001, CP003, CP004, CP005, CP007, CP008, CP013]
callouts:
  - calloutType: strength
    title: Bundling is the clearest differentiator
    body: Super.com connects a hotel-savings acquisition wedge to paid membership, cashback, card, credit-building, and cash-advance use cases; the pool supports breadth, but not yet the retention or margin outcome of that bundle.
    claimRefs: [CP005, CP006]
  - calloutType: risk
    title: Trust can erase price advantage
    body: Independent review evidence describes lower prices alongside prepaid or non-refundable terms, booking errors, refund friction, and membership-enrollment concerns; this creates a credible displacement path for more established alternatives.
    claimRefs: [CP010, CP011, CP014]
  - calloutType: recommendation
    title: Underwrite the moat through cohort and controlled-price evidence
    body: The next diligence step is a matched booking and membership study covering realized savings, cancellation outcomes, conversion, retention, cross-sell, and acquisition payback against direct booking, mainstream OTAs, rewards platforms, and banking substitutes.
    claimRefs: [CP012, CP015, CP016]
