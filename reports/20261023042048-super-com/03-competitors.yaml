      - [Chime SpotMe, "$0 fees; qualifying direct deposit of at least $200 per month described by WalletGrower", "Automatic debit-purchase overdraft coverage up to $200", "Requires Chime checking and does not cover ACH or bill payments", "Simpler and cheaper for small debit shortfalls, but narrower than Super.com's bundle"]
      - [Honey / PayPal, "Consumer fee not stated in the cited release; PayPal described Honey as a suite of free tools", "Shopping assistant, offers, rewards, and price tracking", "Relies on merchant and PayPal distribution rather than paid membership", "A free, scaled discovery layer can pressure paid savings subscriptions"]
      - [Ibotta, "Current consumer pricing not established in assigned evidence", "Shopping rewards and cashback", "Public-market accountability but direct Super.com packaging is not comparable", "Useful scale comparator, not a verified price benchmark"]
      - [Direct hotel booking / mainstream OTA, "List prices, commissions, and membership economics not established in assigned pool", "Inventory and booking support", "May offer different cancellation and service policies", "Controlled tests are required before claiming Super.com price superiority"]
    notes: "Prices are list, advertised, or historical transaction values as labeled; they are not realized revenue, margin, or customer payback. Unknown fields require primary pricing and cohort evidence."
    claimRefs: [CP005, CP006, CP009, CP010, CP014]
