company:
  name: Super.com
chapter:
  number: 1
  title: Company Overview
  summary: Super.com has evolved from SnapTravel into a private consumer savings and financial-services app spanning travel, membership, card, cash advance, and earning products. Public evidence supports a 2026 Series D, approximately $1.2 billion valuation, and more than $200 million of reported net revenue, but the company-level record is inconsistent on funding totals, customer counts, headcount, and the economics of each product.
sections:
  - id: identity-and-evolution
    title: Identity and evolution
    body: Super.com is the renamed successor to SnapTravel and Snapcommerce, built around a savings theme rather than a single financial product. A 2025 Sacra interview describes the business as “Born as SnapTravel’s SMS hotel-deal bot” and says it relaunched in 2022 as a personal-finance and travel superapp for low-to-middle-income consumers. BetaKit reports that the company rebranded from Snapcommerce in October 2022 and moved its headquarters from Toronto to San Francisco in the same month, while the app listings identify Super.com Inc. as the provider. The identity is therefore clear, but headquarters and operating footprint require a canonical company disclosure before being treated as settled.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person dependence
    body: "Hussein Fazal is consistently identified as Super.com’s co-founder and CEO, and Henry Shi is identified as the other co-founder in the BetaKit account. The assigned evidence does not provide a complete current executive roster, board composition, committee structure, or investor control rights. That gap matters because the company combines regulated or partner-dependent financial products with travel and marketplace operations, increasing the value of experienced functional coverage. The available record shows a founder-led strategy: Fazal explained the cross-sell thesis, the target consumer, and the product roadmap in interviews, while funding coverage attributes the company’s transition and fundraising narrative primarily to him. Key-person dependence is consequently a material diligence question, not a proven governance defect."
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: funding-scale-and-economics
    title: Funding, valuation, and operating scale
    body: "The strongest current financing evidence is independent 2026 reporting: PhocusWire says Super.com raised $65 million in Series D financing, while Multiples records a July 2026 $1.2 billion post-money valuation and $200 million of revenue or run-rate revenue alongside the round. Multiples also describes $17 million of primary capital and secondary transactions, which means headline funding raised is not the same as cash available to the company. Historical sources give materially different cumulative funding totals, including approximately $150 million, nearly $200 million, $220 million, and $235 million depending on inclusion of debt, timing, and source methodology. The chapter therefore treats the latest round and valuation as reported facts while leaving total raised and cash resources explicitly qualified."
    claimRefs: [CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-open-diligence
    title: Milestones, product breadth, and unresolved diligence
    body: "Super.com’s milestones show a deliberate expansion from travel distribution into a bundled savings and financial-wellness proposition: a 2016 founding, 2021 marketplace acquisition and financing, 2022 rebrand, 2023 savings-app financing, 2024 travel GMV milestone, and 2026 Series D. The app stores corroborate an active product spanning travel discounts, cashback, credit building, cash advances, and earning features, but product pages are company-issued marketing evidence rather than independent proof of user outcomes. BBB’s February 2026 review identifies complaints concerning Super+ subscription enrollment; this is a relevant adverse signal, not evidence of systemic misconduct. The next diligence pass should reconcile product-level revenue, membership retention, compliance controls, customer and employee counts, and capital-stack terms."
    claimRefs: [CO013, CO014, CO015, CO016]
callouts:
  - calloutType: strength
    title: Current financing signal
    body: The July 2026 Series D and reported $1.2 billion post-money valuation indicate continued investor access and a credible scale narrative, although secondary proceeds and undisclosed terms limit inference about primary capital and investor returns.
    claimRefs: [CO008, CO009, CO010]
  - calloutType: risk
    title: Disclosure and product-complexity risk
    body: Super.com spans travel, subscriptions, payments, credit building, cash advances, and earning products. Incomplete public disclosure on segment economics, governance, compliance outcomes, and customer metrics makes underwriting confidence materially lower than the headline valuation and revenue figures suggest.
    claimRefs: [CO012, CO014, CO015, CO016]
