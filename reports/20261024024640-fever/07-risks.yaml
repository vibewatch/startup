schemaVersion: "report-v2"
artifact: risks
slug: fever
runDate: 2026-10-24
company:
  name: Fever
chapter:
  number: 7
  title: Risks
  summary: Fever's expansion is exposed to consumer-protection, platform-regulation, cross-border execution, and event-market risks. Public evidence shows relevant controls and partners, but does not disclose enough about incident rates, compliance testing, cash conversion, or counterparty concentration to reduce residual exposure below material.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      Ticketing regulation is a concrete risk rather than a hypothetical one. The FTC says its Rule on Unfair or Deceptive Fees applies to businesses that offer, display, or advertise live-event tickets, including third-party platforms, and requires upfront disclosure of the total price. Its guidance also requires the final amount of payment to be displayed before payment and prohibits misrepresentations about fees. That creates product, pricing, and monitoring obligations across Fever's consumer surfaces, even though the public record here does not establish a Fever enforcement action. The EU Digital Services Act applies to intermediary services offered in the Union where there is a substantial connection, and describes online platforms that disseminate recipient information to the public; Fever should document its legal classification, notice-and-action controls, and trader-information processes for each relevant service. UK CMA materials show that ticket platforms have faced court orders, compliance reviews, and recommendations for licensing and sanctions. Fever's exposure is bounded by the fact that this evidence concerns secondary-ticketing operators, not a finding against Fever, but its marketplace and distribution model still warrants jurisdiction-by-jurisdiction review.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operating-and-financial
    title: Operational, quality, and financial resilience
    body: >-
      Fever's own recruiting materials indicate operational complexity: its distribution team tracks performance by product, vertical, reseller, and geography, collaborates with external partners, and runs pricing and marketing experiments. That operating model creates data-quality, attribution, and execution failure modes that are not resolved by the existence of dashboards. The global FX partnership announcement describes transactions spanning dozens of currencies and payments to local partners and creators, while also stating that a currency swing can turn a profitable event series into a loss; outsourcing the capability to Corpay reduces treasury workload but creates a material dependency and does not disclose hedge limits, counterparty controls, or realized gains and losses. The September 2026 financing provides growth capital, but public sources do not provide audited revenue, cash burn, working capital, or runway. Live-market conditions add downside: Digital Music News reports that some festivals were cancelled and that ticket resale platforms suffered large share-price declines, so event demand, permits, weather, and inventory quality can impair returns even when platform metrics remain positive.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: dependencies-and-break-triggers
    title: Dependencies, mitigations, and thesis-break triggers
    body: >-
      Fever's mitigation posture is partly visible but not measurable enough to underwrite low residual risk. The Corpay relationship is described as exclusive, and Fever's recruiting materials describe reseller distribution and partner-performance management; both are useful controls but increase the importance of service continuity, data portability, and counterparty diversification. The evidence also conflicts on financing and valuation: Forge reports a September 2026 Series F of $250 million at a $5.2 billion post-money valuation, while Tracxn's fetched record is an older $427 million total and $1.8 billion 2023 valuation, and Digital Music News reports the 2026 round without independently confirming the valuation. This is not evidence of fraud or a loss, but it makes private-market assumptions and dilution or preference exposure a diligence item. A thesis break should be tied to observable outcomes: a material fee-enforcement notice, a repeated outage or payment failure, a sustained deterioration in event cancellations or refunds, loss of a critical reseller or FX provider without replacement, or cash runway below the financing plan.
    claimRefs: [CR010, CR011, CR012, CR013, CR014]
    tableRefs: [TR003]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule / case, Jurisdiction, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - [FTC total-price and fee disclosure rule, United States, Effective May 12 2025, medium, high, "Map every advertised and checkout price; test mandatory versus optional charges; retain audit logs.", "Material product and enforcement exposure; no Fever action established in assigned evidence.", "Obtain U.S. counsel memo and the latest fee-disclosure test results."]
      - [Digital Services Act intermediary / online-platform obligations, European Union, Regulation dated October 19 2022, medium, high, "Document service classification, notice-and-action, trader information, and risk-governance controls.", "Material multi-market compliance exposure; applicability to each Fever service is unresolved.", "Commission a service-by-service DSA applicability and control-gap assessment."]
      - [Secondary-ticketing consumer-protection enforcement, United Kingdom, CMA case history through August 2021, low-to-medium, medium, "Separate primary ticketing from resale exposure; review listing and disclosure controls.", "No Fever finding; comparable enforcement shows regulator willingness to escalate.", "Request UK product map, resale policy, complaints log, and legal sign-off."]
      - [Spanish data-protection complaints process, Spain, AEPD portal accessed October 24 2026, medium, medium, "Maintain documented privacy notice, response workflow, and data-subject escalation path.", "Incident and complaint volumes are not disclosed; fetched portal page itself does not evidence a Fever case.", "Obtain AEPD correspondence register and GDPR incident metrics."]
    notes: "Rows are severity-ordered analytical assessments. Regulatory sources establish obligations or enforcement context, not a finding that Fever violated them; residual exposure and likelihood require company evidence."
    enumerationScope:
      coverage: partial
      basis: "Publicly documented regulatory and legal exposures relevant to Fever's ticketing and platform operations as of 2026-10-24."
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Price or channel data error across products, partners, or geographies", medium, high, "Developing: job posting describes KPI dashboards and a single source of truth.", "Incorrect attribution or pricing decisions could impair revenue and partner trust.", "No public data-quality incident rate, reconciliation control, or SLA."]
      - ["FX or cross-border settlement loss", medium, high, "Developing: exclusive Corpay FX partnership and stated operational expertise.", "Currency volatility, provider concentration, and hedge effectiveness remain unquantified.", "Request hedge policy, limits, counterparty review, and realized FX variance."]
      - ["Event cancellation, permit, weather, or inventory shock", medium, high, "Partial: platform and partner tooling can improve reach but cannot ensure event delivery.", "Demand and supply shocks can produce refunds, reputational loss, and marketing waste.", "Obtain cancellation, refund, chargeback, and incident rates by market."]
      - ["Privacy, security, or platform-control failure", medium, high, "Unknown: DSA and AEPD materials identify obligations or channels, not Fever controls.", "Cross-border user and partner data could create regulatory and trust costs.", "Obtain SOC reports, penetration-test summary, breach history, and DPA inventory."]
    notes: "Likelihood and severity are risk-register judgments anchored to the cited operating or regulatory evidence; public sources do not provide Fever's internal incident denominators."
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration signal, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Foreign exchange and cross-border payments", Corpay Cross-Border, "Exclusive official global FX partner", "Exclusive relationship stated publicly", "Settlement delay, hedge failure, or provider outage affects local partners and creators", high, "Specialist provider and expertise intended to optimize FX operations.", "High until contract, fallback rails, hedge limits, and exit rights are reviewed."]
      - ["Third-party experience distribution", "Resellers and partner platforms", "Incremental reach and revenue", "Job posting says distribution team works with resellers across markets", "A reseller or channel underperforms or exits", high, "KPI ownership, channel sizing, experiments, and partner-performance management.", "Material; partner-level revenue and concentration are undisclosed."]
      - ["Event and content supply", "Promoters, artists, venues, sports teams, and cultural institutions", "Supply of experiences and partner tools", "2026 financing coverage lists these partner groups", "Event cancellation, permit, or quality failure reduces inventory and increases refunds", high, "Technology and tools intended to help partners understand demand and optimize ticketing.", "Material; no partner renewal, failure, or concentration dashboard is public."]
      - ["Capital and private-market assumptions", "EQT, Point72, Baillie Gifford, and existing investors", "Growth financing and expansion capacity", "$250 million 2026 primary round; valuation evidence conflicts across sources", "Funding plan underwrites expansion but does not prove runway or unit economics", high, "Reconcile cap table, preferences, covenants, runway, and use of funds.", "High until audited financial and financing documents are reviewed."]
    notes: "Concentration signals describe disclosed relationship structure, not measured revenue concentration. Counterparty roles and failure scenarios require contract and management evidence."
    claimRefs: [CR006, CR007, CR010, CR011, CR012]
