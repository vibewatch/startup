  topStrengths:
    - Global consumer discovery and ticketing product with broad event-category coverage.
    - Partner-facing distribution, data, and technology capabilities supported by named commercial relationships.
    - Reported revenue growth and EBITDA profitability alongside a substantial 2026 primary financing.
  topRisks:
    - Private valuation and security terms are not independently supported by audited company financials.
    - Take rate, gross margin, cash conversion, retention, and partner concentration are undisclosed.
    - Ticketing fee regulation, operating complexity, event supply, and cross-border execution can pressure economics.
  unresolvedGaps:
    - Audited trailing revenue, GMV, take rate, and segment or geography mix.
    - EBITDA bridge, cash conversion, working-capital profile, debt, and runway.
    - Repeat purchase, organizer renewal, enterprise retention, and top-partner concentration.
    - Refund-rate, incident-rate, and support-SLA dashboards by event category and geography.
    - Contract economics, implementation cost, and renewal status for major partners.
