callouts:
  - calloutType: "recommendation"
    title: "Price discipline overrides company quality"
    body: >-
      Keep Fever on the watch list, but do not approve a new entry at the $5.2 billion mark
      until audited operating evidence and the full preference-adjusted ownership return are available.
    claimRefs: ["CV003", "CV004", "CV005", "CV016"]
