chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Fever's September 2026 financing supplies a fresh $5.2 billion post-money reference, but
    the public record still does not disclose the audited operating and cash-flow inputs
    needed to underwrite that price. The recommendation is therefore to research more and
    defer a new-money decision until private evidence supports both the valuation and the
    preference-adjusted return.
sections:
  - id: "recommendation-and-entry-discipline"
    title: "Recommendation and entry discipline"
    body: >-
      The appropriate call is research more, with high risk and an unsupported-at-present
      valuation stance. Independent reports describe a $250 million primary round announced
      on September 17, 2026, while Forge lists a $5.2 billion post-money valuation. That is a
      current transaction reference, not proof of fair value. The reviewed public sources do
      not provide audited Fever revenue, GMV, take rate, recurring revenue, free cash flow, or
      net debt, so neither a revenue multiple nor a preference-adjusted target return can be
      calculated responsibly. A new entry at the stated mark should require a data-room bridge
      from reported growth to cash generation, plus full security terms and ownership dilution.
      Without those items, the apparent scale and fresh capital are reasons to keep tracking
      Fever, not reasons to accept the round price.
    claimRefs: ["CV002", "CV003", "CV005", "CV016"]
    tableRefs: ["TV001"]
    figureRefs: ["FV001"]
  - id: "financing-cap-table-and-operating-proof"
    title: "Financing, cap table, and operating proof"
    body: >-
      The financing history shows accelerating nominal marks but also makes entry terms
      important. Forge reports the September 2026 Series F at $250 million, $8.26 per share,
      and a $5.2 billion post-money valuation; it also displays a 1.0x liquidation preference,
      a 6.0% non-cumulative dividend, and non-participating preferred terms. Earlier records
      are not fully consistent: Tracxn's archived page reports $427 million raised and a $1.8
      billion valuation as of 2023, while Fever's own June 2025 release says it secured more
      than $100 million and achieved full-year EBITDA profitability after more than 20x
      pre-pandemic revenue growth. Later reporting says revenue more than tripled over three
      years while remaining EBITDA-positive. These are encouraging operating signals, but they
      are company claims or secondary records rather than audited statements, and they do not
      establish cash conversion.
    claimRefs: ["CV002", "CV003", "CV004", "CV006", "CV007", "CV008", "CV009"]
    tableRefs: ["TV002"]
  - id: "comparable-context-and-scenarios"
    title: "Comparable context and scenarios"
    body: >-
      Public comparables demonstrate both category value and valuation sensitivity, but they
      cannot be applied mechanically to Fever. Music Business Worldwide reported that CTS
      Eventim generated EUR3.079 billion of 2025 revenue and EUR584 million of adjusted EBITDA,
      while its ticketing segment produced EUR977.1 million of revenue at a 46.4% adjusted
      EBITDA margin. The same report placed Eventim's market capitalization near $5.1 billion
      after a greater-than-21% share decline following near-flat guidance and disclosure of
      arena cost pressure. Live Nation's market capitalization was reported at $35.44 billion
      in July 2025 and $40.40 billion in October 2026 by two market-data publishers. These
      references show that Fever participates in a valuable category, but differences in scale,
      disclosure, business mix, debt, and liquidity prevent a defensible public-comparable
      range. The scenario cases therefore use evidence gates rather than invented probabilities.
    claimRefs: ["CV010", "CV011", "CV012", "CV013", "CV014", "CV015"]
    tableRefs: ["TV003"]
  - id: "exit-readiness-and-final-diligence"
    title: "Exit readiness, diligence asks, and thesis-break triggers"
    body: >-
      Exit readiness is not established by the financing alone. Forge labels market activity
      limited and provides no available Forge price or last matched price, so the $5.2 billion
      mark should not be treated as a liquid secondary-market quotation. Before approval, obtain
      audited trailing revenue and gross profit by segment, GMV and take rate, cohort retention,
      partner concentration, EBITDA-to-free-cash-flow conversion, net cash, and a fully diluted
      capitalization table with every preference and dividend. The thesis strengthens if those
      materials validate durable growth, positive cash conversion, and a credible exit path at
      an entry price below or demonstrably supported by the round mark. Thesis-break triggers
      include a down round, negative cash conversion despite reported EBITDA, material customer
      concentration, or preference terms that absorb a disproportionate share of downside
      proceeds. Until those tests are passed, track rather than buy.
    claimRefs: ["CV004", "CV005", "CV012", "CV013", "CV016"]
tables:
  - id: "TV001"
    title: "Recommendation summary"
    columns: ["Decision field", "Assessment", "Decision implication"]
    rows:
      - ["Recommendation", "Research more / track", "Do not approve a new entry from public evidence alone."]
      - ["Confidence", "Medium-low", "Fresh financing evidence is available, but core private operating data is absent."]
      - ["Risk rating", "High", "Illiquidity, disclosure limits, and preference uncertainty dominate the return case."]
      - ["Valuation stance", "Unsupported at present", "Treat $5.2B as a financing mark, not independently derived fair value."]
      - ["Approval threshold", "Data-room validation required", "Require audited metrics, cash conversion, cap table, and ownership-return analysis."]
    notes: >-
      Assessments are analytical conclusions from the cited public financing records; they are
      not investment prices or return forecasts, and private data could materially change them.
    claimRefs: ["CV002", "CV003", "CV005", "CV016"]
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Lens", "Current evidence", "What would change the view"]
    rows:
      - ["Thesis", "Fresh $250M primary financing and reported multi-year growth indicate investor and operating momentum.", "Audited growth, retention, and positive free-cash-flow evidence would strengthen conviction."]
      - ["Thesis", "Company reporting says 2024 was EBITDA-profitable after more than 20x pre-pandemic revenue growth.", "A reconciliation from adjusted EBITDA to operating cash flow would make the signal investable."]
      - ["Anti-thesis", "The $5.2B mark lacks public audited revenue, margin, cash, and net-debt denominators.", "A complete data room supporting a conservative preference-adjusted return would reduce this objection."]
      - ["Anti-thesis", "Public live-events evidence shows valuation compression when guidance softens or capital projects overrun.", "Low capital intensity and resilient forward guidance would reduce comparable downside concern."]
    notes: >-
      Growth and profitability statements are company claims reported by Fever or secondary
      publishers; comparable-company evidence is directional and not a direct Fever benchmark.
    claimRefs: ["CV002", "CV003", "CV007", "CV008", "CV012", "CV013", "CV016"]
  - id: "TV003"
    title: "Bull, base, and bear scenarios"
    columns: ["Case", "Evidence-dependent assumptions", "Valuation / return logic", "Probability signal and downside trigger"]
    rows:
      - ["Bull", "Audited growth and EBITDA claims hold, retention is durable, and cash conversion is positive.", "The $5.2B round mark becomes a testable ceiling only after a preference-adjusted return model supports it; no wider public range is defensible.", "No defensible public probability; fails if audited cash conversion or retention misses the claimed growth profile."]
      - ["Base", "Growth remains positive but normalizes, while disclosed margins and concentration justify a discount for illiquidity.", "Seek a price below the $5.2B financing mark or contractual downside protection; the exact range requires private denominators.", "No defensible public probability; fails if dilution or preference overhang prevents target ownership returns."]
      - ["Bear", "Growth slows, cash conversion trails EBITDA, or concentrated partners and capital needs increase downside.", "Defer entry even at a headline discount until runway, net debt, and preference waterfalls are known.", "No defensible public probability; triggered by a down round, negative cash conversion, or materially adverse preference terms."]
    notes: >-
      These are conditional decision cases rather than numerical forecasts. Public evidence is
      insufficient to assign probabilities, revenue multiples, exit values, or target returns.
    claimRefs: ["CV003", "CV005", "CV007", "CV008", "CV010", "CV011", "CV012", "CV013", "CV016"]
