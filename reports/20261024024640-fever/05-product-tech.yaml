callouts:
  - calloutType: insight
    title: Product breadth is better evidenced than technical defensibility
    body: >-
      The retained sources show a broad functional surface and a named Formula 1 rollout.
      They do not provide architecture, reliability, security, or unit-level outcome evidence
      sufficient to establish a durable technical moat.
    claimRefs: [CE005, CE007, CE008, CE012]
  - calloutType: risk
    title: Privacy and operating controls require primary diligence
    body: >-
      Apple's disclosure identifies broad data categories that may be linked to users, while
      the assigned evidence does not establish retention, access-control, incident, refund,
      or support-SLA performance.
    claimRefs: [CE010, CE012]
