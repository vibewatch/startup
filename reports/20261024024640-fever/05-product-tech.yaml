artifact: product-tech
slug: fever
runDate: 2026-10-24
company:
  name: Fever
chapter:
  number: 5
  title: Product & Technology
  summary: Fever combines consumer discovery and ticketing with original programming, partner distribution, analytics, and event-operations tooling. The public evidence establishes a broad product surface and named deployments, but it does not establish the underlying technical architecture, reliability, security controls, or partner-level outcomes.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      Fever's consumer workflow runs from local-event discovery through ticket use. Current
      mobile listings describe recommendations, date-and-time filters, maps, favorites,
      wallet rewards, ticket transfers, paper-free tickets, and multilingual support. The
      U.S. App Store snapshot adds a maturity signal rather than an operating KPI: it showed
      a 4.8-out-of-5 rating from 74K ratings on the access date. On the supply side, Fever
      presents partner tools for audience reach, demand understanding, ticket optimization,
      and expansion of formats into new markets. A Fever-issued job repost describes the
      operating loop behind distribution: SQL and BI dashboards by product, vertical,
      partner, and geography, plus experiments involving pricing, marketing investment, and
      discounts. Independent directory and private-market descriptions also characterize Fever
      as an experience-discovery platform, but they add no user-level outcome evidence. These
      disclosures identify real workflow surfaces, but they do not measure conversion lift,
      repeat purchase, implementation cost, or partner return on investment.
    claimRefs: [CE001, CE002, CE003, CE004, CE006, CE013, CE014]
    tableRefs: [TE001, TE002]
  - id: platform-architecture
    title: Operating architecture, deployment, and maturity
    body: >-
      Public evidence supports an operating architecture, not a disclosed software stack.
      Independent analysis separates the system into media distribution, a marketplace,
      proprietary programming, and on-site event infrastructure; it also describes Fever
      Cashless as combining access control, capacity monitoring, payments, and staff
      management. Fever's announcement supplies a concrete deployment boundary: under its
      Formula 1 agreement, the company says it will provide ticketing technology through
      2031 and roll out a platform across every Grand Prix via Formula 1's global website.
      That is stronger evidence of deployment scope than generic partnership language, but
      it remains a company claim without public implementation milestones or service data.
      LeadIQ lists Terraform, Elastic, CrowdStrike, SolarWinds, and Datadog among Fever's
      technology products, but the directory does not disclose its verification method, use
      boundaries, or deployment date, so this is only a low-confidence diligence lead. The
      assigned evidence does not disclose APIs, cloud topology, data models, service-level
      objectives, incident history, peak-load performance, or venue hardware dependencies.
      Consequently, the architecture map below is an evidence-bounded functional model, not
      a representation of Fever's internal systems.
    claimRefs: [CE005, CE007, CE008, CE009, CE012, CE015]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-controls
    title: Differentiation, trust, and diligence limits
    body: >-
      Fever's plausible differentiation is the combination of demand aggregation, exclusive
      or original programming, partner distribution, analytics, and event execution rather
      than any single app feature. That breadth may create a feedback loop between audience
      discovery, format selection, distribution, and venue operations, but public sources do
      not quantify the loop or show that every module is deployed consistently across
      markets. Trust evidence is especially incomplete. Apple's storefront disclosure says
      purchases, financial information, location, contacts, search history, identifiers,
      usage data, and diagnostics may be collected and linked to a user; that is a disclosure
      of data categories, not proof of deficient controls or proof of compliance. The assigned
      pool contains no usable primary evidence for penetration testing, formal certifications,
      retention limits, outage rates, refund performance, or support SLAs. Direct diligence
      should therefore test control effectiveness and operating performance before treating
      product breadth as a durable technical moat.
    claimRefs: [CE005, CE009, CE010, CE011, CE012]
