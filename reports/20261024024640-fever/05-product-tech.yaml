      - [Formula 1 rollout, Formula 1 and fans, Announced deployment through 2031, Global-site ticket distribution and fan-experience optimization, Rollout milestones uptime and adoption by Grand Prix]
      - [Fever Cashless, Organizers venues and staff, Described by independent analysis but not independently audited, Access capacity payments and staff workflows, Availability hardware dependencies and incident performance]
    notes: >-
      Status is limited to the assigned sources and is not an independent product audit;
      listed gaps are unavailable metrics or controls, not zero values.
    claimRefs: [CE001, CE003, CE005, CE006, CE007, CE009, CE013, CE014]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Fever solution, Measurable benefit, Limitation]
    rows:
      - [Find a local experience, Search fragmented event supply, Filters maps favorites and recommendations, App-store rating is observable but discovery lift is not, Recommendation quality and conversion are undisclosed]
      - [Buy and share tickets, Purchase and distribute access, Mobile tickets wallet rewards and ticket transfer, Paper handling is removed from the listed workflow, Transfer success fraud and refund performance are undisclosed]
      - [Promote an event, Reach relevant audiences through owned and reseller channels, Partner distribution dashboards and channel experiments, Incremental reach is the stated objective, No partner-level lift or attribution evidence is public]
      - [Scale a proven format, Replicate an event in additional markets, Demand tools distribution and partner network, New-market replication is an explicit product objective, Localization cost and launch cycle are undisclosed]
      - [Operate an event, Manage access payments capacity and staff, Fever Cashless operating suite, A unified venue workflow is described, Product availability reliability and security are not independently verified]
    notes: >-
      Benefits are limited to source-described objectives or observable workflow changes;
      no conversion, utilization, or ROI is calculated.
    claimRefs: [CE001, CE003, CE004, CE006, CE009]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - [Demand discovery, Recommendations filters maps and event catalog, Accurate inventory and user data, Recommendation quality privacy and catalog freshness]
      - [Transaction and access, Ticket purchase transfer and scanning, Payments inventory and venue acceptance, Fraud refunds scanning reliability and peak load]
      - [Partner distribution, Reseller and official partner channels, Integrations attribution and channel data, Data quality and channel dependency]
      - [Programming and rights, Original and exclusive experiences, Rights holders creators venues and repeatable formats, Rights economics supply continuity and format concentration]
      - [Analytics and experimentation, Dashboards KPI definitions and channel tests, Consistent data definitions and permissions, Lineage reproducibility and access control]
      - [Directory-reported technology signals, Terraform Elastic CrowdStrike SolarWinds and Datadog, Unverified third-party data collection, Actual deployment scope ownership and configuration]
      - [On-site operations, Access capacity payments and staff workflows, Venue hardware connectivity and operating procedures, Availability incident response and support SLA]
    notes: >-
      This functional architecture is synthesized from the retained evidence; Fever has not
      disclosed a complete technical stack, integration specification, or service-level model.
    claimRefs: [CE003, CE004, CE006, CE007, CE009, CE012, CE015]
