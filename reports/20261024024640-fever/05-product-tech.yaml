  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Public uptime, outage, incident-response, refund-rate, peak-load, and support-SLA metrics for consumer, partner, and on-site products.
      whyItMatters: Ticketing and event operations are time-sensitive, so failures can create refunds, reputational damage, and partner liability.
      diligencePath: Request 24-month service dashboards, incident postmortems, refund and chargeback reports, peak-load tests, and contractual SLAs by product surface.
      relatedQuestionRefs: [QE006, QE008]
    - type: missing-source
      severity: material
      topic: security
      missingEvidence: Independent security assessment, certifications, data-retention policy, access-control design, subprocessors, and breach history.
      whyItMatters: The app disclosure covers sensitive data categories while the public evidence does not show control design or effectiveness.
      diligencePath: Obtain current audit or certification evidence, penetration-test summaries, DPIAs, subprocessors, retention schedules, and incident logs.
      relatedQuestionRefs: [QE006, QE008]
    - type: private-evidence-only
      severity: material
      topic: partner-outcomes
      missingEvidence: Partner-level conversion, sell-through, incremental revenue, retention, implementation cost, and renewal evidence for named deployments.
      whyItMatters: Announced partnerships demonstrate access and deployment intent but do not prove realized economic value or scalable implementation.
      diligencePath: Request anonymized cohort dashboards and contract samples for Formula 1, venues, promoters, and cultural institutions.
      relatedQuestionRefs: [QE004, QE007]
