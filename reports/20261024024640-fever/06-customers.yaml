schemaVersion: "report-v2"
artifact: customers
slug: fever
runDate: 2026-10-24
company:
  name: Fever
chapter:
  number: 6
  title: Customers
  summary: Fever has concrete partner deployments across sports, immersive experiences, and corporate events, but its headline reach is company-reported and inconsistent on period. Public evidence does not establish retention, contract economics, or customer concentration.
sections:
  - id: customer-segments
    title: Linked consumer, partner, and enterprise segments
    body: >-
      Fever operates a multi-sided customer system rather than serving one uniform account type. Consumers use
      discovery, recommendation, ticketing, transfer, and support surfaces, while promoters, venues, sports
      properties, attractions, museums, and cultural institutions use distribution and ticketing tools. A
      company-issued job repost adds a distinct channel layer: Fever's Distribution team works with resellers to
      reach incremental audiences, particularly tourists, and tracks performance by product, vertical, partner,
      and geography. Corporate buyers form another segment through tailored Candlelight events. This breadth can
      create cross-market demand and supply loops, but the retained evidence does not disclose segment revenue,
      payer mix, take rate, or contribution margin. Fever's official reach language should therefore be read as
      top-of-funnel exposure, not as a count of active customers or paid accounts.
    claimRefs: [CU001, CU003, CU004, CU009]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption signals are broad but not comparable
    body: >-
      Fever's official newsroom says the platform inspired more than 300 million people in the last year across
      more than 55 countries, and an independent trade article repeats that annual formulation. A company-issued
      job repost instead says the platform inspires more than 300 million people every month. The denominator is
      not defined in either case, and the annual-versus-monthly conflict prevents a defensible active-user or
      growth series. More concrete adoption signals come from scoped deployments: LIV Golf named Fever the
      ticketing and demand-generation partner for 14 international events in its 2026 season, while Formula 1
      announced a five-year global ticketing relationship beginning in 2027. These metrics describe different
      populations and periods, so they should remain separate rather than being treated as a conversion funnel.
    claimRefs: [CU001, CU002, CU005, CU006, CU008]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named proof ranges from live deployments to future commitments
    body: >-
      Formula 1 provides the strongest counterparty-specific proof, but the broad F1.com rollout is prospective:
      Fever is expected to support general admission, local hospitality, and Paddock Club ticketing from 2027.
      Sector also reports that Fever already powers the F1 Exhibition globally and was selected for ticketing,
      fan engagement, and entertainment programming at Madrid's MADRING circuit. LIV Golf is a nearer-term
      production signal for 2026. In immersive entertainment, The VR Collective reports that Eclipso uses Fever
      for Manhattan ticket sales and that Fever developed Smithsonian Starstruck with the Smithsonian
      Astrophysical Observatory. Corporate proof is broader but less independently verified: trade coverage
      repeats Fever's claim that more than 1,000 companies have used its formats without publishing account-level
      outcomes, repeat behavior, or contract values.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010, CU012, CU013]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability and concentration remain private-evidence questions
    body: >-
      The retained sources establish named relationships and operating scope, not durable customer economics.
      None supplies NRR, GRR, churn, renewal rates, repeat-purchase cohorts, contract length, customer-level
      revenue, or top-customer share. Even the external private-market page retained as a cautious counterpoint
      says that its inputs may be limited and are not independently verified, so aggregator data cannot close
      these gaps. The investment case therefore needs customer and event cohorts reconciled to recognized
      revenue, plus representative contracts and concentration schedules. Particular attention should go to
      reseller dependence and flagship sports properties: they can accelerate distribution, but delivery or
      renewal problems at a visible partner could weaken both revenue durability and future reference value.
      Current public funding coverage says Fever intends to invest in partner tools and expand beyond 55
      countries, which increases the importance of measuring whether expansion creates repeatable economics.
    claimRefs: [CU014, CU015, CU016]
callouts:
  - calloutType: strength
    title: Counterparty-specific partner proof
    body: Formula 1 and LIV Golf describe scoped ticketing relationships, which is stronger evidence than an unexplained customer logo.
    claimRefs: [CU005, CU006, CU008]
  - calloutType: risk
    title: Reach is not retained revenue
    body: The public record does not disclose repeat purchase, renewal, churn, contract value, or customer concentration, and the reported 300 million reach has conflicting annual and monthly periods.
    claimRefs: [CU001, CU002, CU015]
  - calloutType: recommendation
    title: Underwrite cohorts and contracts
    body: Request consumer purchase cohorts, partner renewals, event-level economics, SLA and refund performance, reseller mix, and top-customer concentration before treating public reach as durable demand.
    claimRefs: [CU015, CU016]
