    notes: "Values preserve each source's metric, period, and denominator limits. Reach, geography, contract duration, event count, and company count are not a common cohort."
    claimRefs: [CU001, CU002, CU005, CU006, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or partner, Segment, Deployment/use case, Production vs pilot, Outcome or stated value, Limitation]
    rows:
      - [Formula 1, Sports property, "F1.com ticketing for admission, local hospitality, and Paddock Club", "Five-year rollout announced for 2027 onward", "Improve discoverability, purchasing, and customer service", "Future broad rollout; no performance data"]
      - [MADRING / IFEMA Madrid, Sports venue, "Ticketing, fan engagement, and entertainment programming", "Selected deployment reported in 2026", "Integrated venue and fan-experience scope", "No volume, SLA, or economics disclosed"]
      - [LIV Golf, Sports property, "Ticketing and demand generation across 14 international events", "Multi-year relationship covering the 2026 season", "Central ticket-sales and fan-engagement hub", "No sell-through, renewal, or economics disclosed"]
      - [Eclipso, Immersive-experience operator, "Fever ticket sales for Everest: The First Ascent in Manhattan", "Open production event reported for 2026", "Named venue and ticketing use", "No attendance, conversion, or revenue outcome disclosed"]
      - ["Corporate users including Meta, MGM Resorts, Pfizer, Accenture, and Kiko Milano", Corporate events, "Candlelight and other Fever event formats", "Fever says events were realized; account status is not enumerated", "Reported use across multiple industries", "Company-attributed list with no repeat-rate or contract data"]
    notes: "Sample of named public proof, not a complete customer roster. Production labels follow source wording; absent volume, outcome, and contract fields remain explicit."
    enumerationScope:
      coverage: sample
      basis: "Five named examples or grouped accounts found in the assigned partner and trade sources available for the 2026-10-24 refresh."
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU012]
figures:
  - id: FU001
    title: Customer journey from discovery to partner expansion
    type: journey-map
    summary: Public evidence shows linked consumer discovery, transaction, partner delivery, and channel expansion surfaces without quantifying conversion or retention.
    data:
      items:
        - label: Discover
          actor: Consumer
          touchpoints: ["App and web discovery", "Personalized recommendations", "Maps and filters"]
          note: "Reported reach is not an active-user or buyer count."
        - label: Purchase
          actor: Consumer
          touchpoints: ["Mobile ticket", "Ticket transfer", "Customer support"]
          note: "The app listing describes features, not conversion or refund performance."
        - label: Distribute
          actor: Reseller
          touchpoints: ["Third-party platforms", "Tourist audiences", "Channel experiments"]
          note: "The company-issued job repost describes the operating mechanism."
        - label: Deploy
          actor: Rights holder or venue
          touchpoints: ["Ticketing platform", "Hospitality inventory", "Demand generation"]
          note: "F1 and LIV Golf provide named scopes with limited economics."
        - label: Deliver
          actor: Experience operator
          touchpoints: ["Live event", "Immersive format", "Corporate program"]
          note: "Named examples establish use, not repeat behavior."
        - label: Expand
          actor: Fever and partner
          touchpoints: ["New markets", "New formats", "Additional channels"]
          note: "Expansion is stated strategy; renewal evidence is absent."
    approximationNotes: "Stages are an analytical sequence, not a measured funnel; no conversion rates or proportional values are implied."
    claimRefs: [CU003, CU004, CU014]
