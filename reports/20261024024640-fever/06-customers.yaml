      - ["Countries of operation", "More than 55", "Current 2026 descriptions", "Fever Newsroom / EventFAQs", "Medium", "Broad geographic surface", "Active-market and country-revenue mix are unavailable"]
      - ["F1 ticketing agreement", "Five years from 2027", "Announced in 2026", "Formula 1 announcement / Sector", "High", "Flagship future global deployment", "Ticket volume, revenue, SLA, and renewal economics are undisclosed"]
      - ["LIV Golf events covered", "14 international events", "2026 season", "TicketNews", "Medium", "Multi-event sports distribution", "Sell-through, conversion, and Fever economics are unavailable"]
