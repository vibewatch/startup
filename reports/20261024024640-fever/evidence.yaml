evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current cap table, board composition, voting rights, executive roster, and succession planning materials.
    whyItMatters: >-
      Founder and investor control, key-person exposure, and governance quality cannot be assessed from partial public
      names.
    diligencePath: >-
      Request the latest cap table, shareholder agreement, board minutes, reserved-matters schedule, and executive
      organization chart.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: Audited or management financial statements showing revenue, GMV, take rate, EBITDA, cash conversion, and runway.
    whyItMatters: Funding raised and a company-attributed EBITDA statement do not establish recurring economics or available cash.
    diligencePath: >-
      Obtain the latest audited accounts, monthly management accounts, KPI bridge, cash-flow forecast, and
      working-capital schedule.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      Primary transaction documents reconciling the $1.8B historical reference with Forge's $5.2B September 2026
      estimate.
    whyItMatters: >-
      Valuation stance and dilution cannot be judged when private-market estimates and prior press valuations differ
      materially.
    diligencePath: >-
      Request the September 2026 term sheet, capitalization table, security class, price per share, and independent
      valuation support.
    relatedQuestionRefs:
      - QO005
      - QO010
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: headquarters
    missingEvidence: A current legal-entity and operating-office map resolving New York, Madrid, London, and other listed locations.
    whyItMatters: >-
      Headquarters, tax, employment, and regulatory obligations depend on the relevant entity rather than a directory
      label.
    diligencePath: >-
      Request the corporate structure chart, registered-office records, and current entity-by-entity employee and
      revenue footprint.
    relatedQuestionRefs:
      - QO003
  - type: private-evidence-only
    severity: material
    topic: operating-risk
    missingEvidence: Event-level refund, incident, support-SLA, partner-renewal, and customer-concentration dashboards.
    whyItMatters: >-
      The public record shows reach and partnerships but not service reliability, repeat behavior, or concentration
      risk.
    diligencePath: Request the last 24 months of operating KPI dashboards segmented by event category, geography, and major partner.
    relatedQuestionRefs:
      - QO008
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: Fever GMV, take rate, service-fee revenue, organizer software revenue, and geographic segment mix.
    whyItMatters: Without a company-specific denominator, external market totals cannot be converted into SAM, SOM, or market share.
    diligencePath: >-
      Obtain management reporting or audited segment disclosures and reconcile them to transaction volume and active
      markets.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A reconciled definition for global live entertainment, U.S. live events, and online event-ticketing estimates.
    whyItMatters: The retained estimates use different scopes and could materially overstate opportunity if combined.
    diligencePath: >-
      Request source methodologies, denominators, and inclusion rules from each publisher, then select one comparable
      base case.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Partner retention, contract duration, customer concentration, realized pricing, and take-rate data for Fever and
      major competitors.
    whyItMatters: >-
      Feature breadth and reseller activity do not establish switching costs or durable economics without renewal and
      unit-level evidence.
    diligencePath: >-
      Request cohort retention, partner renewal, contract, take-rate, and concentration schedules under NDA, segmented
      by geography and product.
    relatedQuestionRefs:
      - QP004
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Comparable current operating metrics and customer counts for Ticketmaster, Live Nation, DICE, Eventbrite, and
      Fever.
    whyItMatters: >-
      Public market capitalization and revenue data are not directly comparable to Fever's private metrics or to
      competitor segment economics.
    diligencePath: >-
      Collect current filings, investor materials, product pricing, and partner references for each material
      alternative.
    relatedQuestionRefs:
      - QP002
      - QP004
    relatedTableRefs:
      - TP001
      - TP003
  - type: access-blocked
    severity: minor
    topic: pricing-transparency
    missingEvidence: >-
      A complete, current price and fee schedule across Fever, Eventbrite, DICE, incumbent ticketing, and resale
      alternatives.
    whyItMatters: >-
      The FTC rule changes the trust and conversion context, but the pool does not show realized customer prices or
      platform fee incidence.
    diligencePath: >-
