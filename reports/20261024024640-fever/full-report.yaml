        - Company reporting says 2024 was EBITDA-profitable after more than 20x pre-pandemic revenue growth.
        - A reconciliation from adjusted EBITDA to operating cash flow would make the signal investable.
      - - Anti-thesis
        - The $5.2B mark lacks public audited revenue, margin, cash, and net-debt denominators.
        - A complete data room supporting a conservative preference-adjusted return would reduce this objection.
      - - Anti-thesis
        - Public live-events evidence shows valuation compression when guidance softens or capital projects overrun.
        - Low capital intensity and resilient forward guidance would reduce comparable downside concern.
    notes: >-
      Growth and profitability statements are company claims reported by Fever or secondary publishers;
      comparable-company evidence is directional and not a direct Fever benchmark.
    claimRefs:
      - CV002
      - CV003
      - CV007
      - CV008
      - CV012
      - CV013
      - CV016
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Case
      - Evidence-dependent assumptions
      - Valuation / return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - Audited growth and EBITDA claims hold, retention is durable, and cash conversion is positive.
        - >-
          The $5.2B round mark becomes a testable ceiling only after a preference-adjusted return model supports it; no
          wider public range is defensible.
        - >-
          No defensible public probability; fails if audited cash conversion or retention misses the claimed growth
          profile.
      - - Base
        - >-
          Growth remains positive but normalizes, while disclosed margins and concentration justify a discount for
          illiquidity.
        - >-
          Seek a price below the $5.2B financing mark or contractual downside protection; the exact range requires
          private denominators.
        - No defensible public probability; fails if dilution or preference overhang prevents target ownership returns.
      - - Bear
        - Growth slows, cash conversion trails EBITDA, or concentrated partners and capital needs increase downside.
        - Defer entry even at a headline discount until runway, net debt, and preference waterfalls are known.
        - >-
          No defensible public probability; triggered by a down round, negative cash conversion, or materially adverse
          preference terms.
    notes: >-
      These are conditional decision cases rather than numerical forecasts. Public evidence is insufficient to assign
      probabilities, revenue multiples, exit values, or target returns.
    claimRefs:
      - CV003
      - CV005
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
      - CV016
