  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer system
        blocks:
          - type: paragraph
            body: >-
              Fever's relevant market is narrower than the whole entertainment economy. The directly addressable core is
              digital discovery, ticket transaction, and demand generation for live experiences, augmented by software
              and services sold to organizers, venues, sports teams, promoters, and cultural institutions. Fever's own
              app description lists concerts, festivals, museums, theater, food, nightlife, tours, and cinema, while the
              job-market evidence describes reseller distribution, channel sizing, pricing tests, and revenue models.
              This supports a two-sided boundary: consumer demand and checkout on one side, and organizer inventory,
              promotion, pricing, analytics, and distribution on the other. Excluded from the core sizing are the full
              value of venue operations, artist compensation, food and beverage, and unsold or purely offline
              transactions. Those adjacencies can expand Fever's opportunity but should not be counted as
              ticket-platform revenue without a disclosed take rate or service-fee basis.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM010
              - CM011
              - CM012
      - number: '2.2'
        title: Sizing lenses and market growth
        blocks:
          - type: paragraph
            body: >-
              Available market estimates are directionally positive but not interchangeable. GII places online event
              ticketing at USD 88.38 billion in 2026 and USD 105.17 billion in 2031, a 3.55% CAGR, with mobile devices
              representing 58.40% of 2025 transactions and music concerts and festivals representing 36.12% of 2025
              revenue. Coherent Market Insights gives a much broader U.S. live-events estimate of USD 489.90 billion in
              2026 and USD 660.28 billion in 2033 at 5.1% CAGR; that includes event categories and organizer segments
              beyond ticketing. Gitnux reports a USD 1.2 trillion global live-entertainment figure for 2023, but its
              page does not establish a comparable platform-revenue denominator. These lenses should be treated as a
              range of market contexts, not a single TAM. Fever-specific capture requires disclosed GMV, take rate, fee
              revenue, organizer software revenue, and geographic mix; none is established by the public evidence
              retained here.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is supported by mobile behavior, personalized discovery, exclusive inventory, and organizer
              demand for measurable distribution. The job posting describes dashboards by product, vertical, partner,
              and geography, channel experiments, and reseller partnerships intended to unlock incremental revenue. The
              app listing documents recommendations, map-based discovery, mobile tickets, transfers, loyalty, and
              multilingual support. These capabilities can reduce search friction and improve conversion, but they do
              not prove retention or unit economics. Constraints are equally material: GII identifies fee-transparency
              and antitrust scrutiny, while Coherent identifies high operational costs and incumbent entry barriers. A
              2023 industry article reported that North America exceeded 50% of Fever revenue, which indicates
              geographic concentration if still representative but is historical and company-reported. The investment
              case therefore depends on repeat purchase, organizer renewal, supply exclusivity, contribution margin
              after event production, and compliance costs rather than on headline market size alone.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: What the market evidence actually establishes
            body: >-
              The evidence establishes a large multi-segment demand environment and plausible technology-enabled
              adoption drivers, but it does not isolate Fever's serviceable market or prove a sustainable share.
            calloutType: insight
            claimRefs:
              - CM005
              - CM008
              - CM014
          - type: callout
            title: Key sizing risk
            body: >-
              Public estimates mix ticketing revenue, live-event spending, and broader event production; using them as
              one denominator would overstate Fever's addressable revenue pool.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Fever's competitive set spans several jobs to be done. The assigned third-party analysis describes a
              platform that lets users browse and book local experiences across sports, music, food, wellness, and
              immersive entertainment, while also providing on-location access control, capacity control, cashless
              payments, inventory, and staff-management services. That breadth puts Fever against Ticketmaster and Live
              Nation in large-scale ticketing and discovery, Eventbrite in self-serve event tooling, DICE and other
              focused music-ticketing products in nightlife, and StubHub, viagogo, SeatGeek, and Vivid Seats in resale
              or secondary-market demand. Status-quo alternatives remain direct venue sales, promoter-owned websites,
              social discovery, spreadsheets, and internal event operations. The result is a multi-front market: Fever
              can win a partner with bundled distribution and operations, but it can also be displaced one workflow at a
              time.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP010
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Fever's strongest strategic distinction is the combination of demand generation, partner distribution, and
              repeatable original formats. Its own hiring material says the distribution team works with resellers to
              reach niche audiences and uses dashboards by product, vertical, partner, and geography, while the
              independent analysis characterizes the business as an end-to-end, data-driven operating system for live
              entertainment. DICE adds a music-oriented product with a wait-list mechanism that can return tickets to
              fans instead of sending them to resellers. These capabilities are meaningful only if Fever can maintain
              supply quality, conversion, and partner economics across markets. Trust is also a competitive axis: the UK
              Competition and Markets Authority required stronger information practices in secondary ticketing, and the
              US Federal Trade Commission's rule requires all-in price disclosure for advertised live-event tickets.
              Those rules raise compliance demands for every ticketing intermediary, while transparent pricing can
              become a product differentiator.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Moat durability, pricing pressure, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Fever's moat is more likely to be an operating system of partner relationships, local demand data,
              distribution channels, and reusable formats than a permanently protected feature. The third-party analysis
              explicitly notes that Ticketmaster launched City Guides for local discovery and that Fever's repeatable
              concepts can be copied by competitors seeking the same cities and organizers. Competitive scale is uneven:
              Eventbrite's assigned market-data page reports a $0.45 billion market capitalization in October 2026 and
              $325 million of 2024 revenue, but that public-company comparison is not directly comparable to Fever's
              private operating metrics. Pricing and regulatory pressure can also compress take rates or raise support
              costs. Fever's strategic response is to deepen partner integration, build original IP, and use data-driven
              experimentation, but the pool does not provide verified customer-retention, realized-price, or competitor
              contract data. Those missing inputs limit confidence in switching costs and long-term share durability.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP006
              - CP008
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP009
              - CP010
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated wedge
            body: >-
              Fever can use discovery and ticketing to expand into production, partner distribution, and on-site
              operations, increasing the number of workflows in which a partner may rely on it.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
          - type: callout
            title: Copyability and incumbent response
            body: >-
              The most visible differentiators are exposed to imitation: Ticketmaster has launched local discovery
              guides, while repeatable Fever formats can be copied and compete for the same cities, organizers, and
              audiences.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
          - type: callout
            title: Switching-cost evidence remains incomplete
            body: >-
              No assigned source verifies partner retention, contract duration, realized pricing, or customer
              concentration, so integration breadth should not be treated as proven lock-in.
            calloutType: assumption
            claimRefs:
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and public traction
        blocks:
          - type: paragraph
            body: >-
              Fever monetizes a combination of consumer discovery, ticketing, and partner-facing technology rather than
              a pure subscription product. Its distribution role includes resellers and third-party platforms, while its
              partner tooling is positioned to help organizers gauge demand, reach audiences, improve ticketing, and
              expand successful formats. A company job description says the distribution team builds revenue models,
              tracks performance by product, vertical, reseller, and geography, and runs pricing, marketing-investment,
              and discount experiments. Those are credible operating proxies for a sophisticated marketplace or
              ticketing motion, but they are not disclosed CAC, payback, take-rate, or contribution-margin figures.
              Public traction is similarly top-line and company-reported: the same job posting says the platform
              inspires over 300 million people monthly in more than 55 countries, while a 2026 financing report says
              revenue more than tripled over three years and the business remained EBITDA-positive. The differing
              audience descriptions are not directly comparable without a definition of people, users, or monthly
              activity.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI007
      - number: '4.2'
        title: Pricing, cost structure, and efficiency
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is fragmented because Fever's economics vary by event, geography, partner,
              channel, and experience format. The consumer application listing describes ticket discovery, exclusive
              events, personalized recommendations, ticket transfers, mobile tickets, and customer support, but it does
              not publish a standard platform fee or contract schedule. The distribution role explicitly references
              resellers, channel sizing, revenue models, pricing tests, alternative discounts, and partner performance,
              indicating that realized monetization is likely negotiated or experiment-dependent rather than captured by
              one public list price. Cost drivers should therefore include demand generation, payment and support
              operations, partner tooling, event or experience production, and the service burden of a global footprint.
              Fever reports EBITDA positivity, but no retained source supplies gross margin, EBITDA amount, cash
              conversion, working capital, refund rate, or cost per acquired customer. Underwriting should treat these
              as unavailable rather than infer them from revenue growth or a financing headline.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI013
      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The September 2026 primary equity round provides a meaningful financing signal: Fever raised $250 million
              led by EQT, with Baillie Gifford, Point72 Private Investments, and existing shareholders participating.
              The company said proceeds would support expansion beyond 55 countries, deeper coverage of entertainment
              categories, and more technology for partners. Independent reporting also describes Fever as
              EBITDA-positive and says revenue more than tripled over the prior three years. A secondary stake sale
              reported by Atresmedia implied approximately EUR 4.5 billion, or roughly $5.2 billion at contemporary
              exchange rates, but that is an implied transaction valuation rather than a company-confirmed audited
              valuation. A private-market data page records the same round and valuation while warning that its data may
              rely on limited inputs and is not independently verified; an older Tracxn snapshot still shows $1.8
              billion valuation and $427 million total funding as of early 2023. Those older observations are not
              current comparators. Separately, CompaniesMarketCap reports Eventbrite at $0.45 billion in October 2026
              versus $2.17 billion at year-end 2018, which illustrates public-market category volatility rather than
              furnishing a direct valuation benchmark for Fever. Cash on hand, net burn, runway, debt, working-capital
              needs, and next-round triggers remain undisclosed, so the financing improves optionality but does not
              prove capital sufficiency or cash availability.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI004
            claimRefs:
              - CI003
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI007
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Operating leverage is plausible, not yet measurable
            body: >-
              Fever reports more than tripled revenue while remaining EBITDA-positive, but the public record does not
              provide the revenue denominator, EBITDA bridge, gross margin, or cash conversion needed to distinguish
              operating leverage from scale purchased with capital.
            calloutType: insight
            claimRefs:
              - CI003
              - CI008
          - type: callout
            title: Financing is not runway
            body: >-
              The $250 million equity raise is gross financing, not cash on hand; without burn, working-capital, debt,
              and use-of-funds detail, runway and next-round dependency remain open underwriting questions.
            calloutType: risk
            claimRefs:
              - CI009
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Fever's consumer workflow runs from local-event discovery through ticket use. Current mobile listings
              describe recommendations, date-and-time filters, maps, favorites, wallet rewards, ticket transfers,
              paper-free tickets, and multilingual support. The U.S. App Store snapshot adds a maturity signal rather
              than an operating KPI: it showed a 4.8-out-of-5 rating from 74K ratings on the access date. On the supply
              side, Fever presents partner tools for audience reach, demand understanding, ticket optimization, and
              expansion of formats into new markets. A Fever-issued job repost describes the operating loop behind
              distribution: SQL and BI dashboards by product, vertical, partner, and geography, plus experiments
              involving pricing, marketing investment, and discounts. Independent directory and private-market
              descriptions also characterize Fever as an experience-discovery platform, but they add no user-level
              outcome evidence. These disclosures identify real workflow surfaces, but they do not measure conversion
              lift, repeat purchase, implementation cost, or partner return on investment.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
              - CE013
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
              - CE007
              - CE009
              - CE013
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE006
              - CE009
      - number: '5.2'
        title: Operating architecture, deployment, and maturity
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports an operating architecture, not a disclosed software stack. Independent analysis
              separates the system into media distribution, a marketplace, proprietary programming, and on-site event
              infrastructure; it also describes Fever Cashless as combining access control, capacity monitoring,
              payments, and staff management. Fever's announcement supplies a concrete deployment boundary: under its
              Formula 1 agreement, the company says it will provide ticketing technology through 2031 and roll out a
              platform across every Grand Prix via Formula 1's global website. That is stronger evidence of deployment
              scope than generic partnership language, but it remains a company claim without public implementation
              milestones or service data. LeadIQ lists Terraform, Elastic, CrowdStrike, SolarWinds, and Datadog among
              Fever's technology products, but the directory does not disclose its verification method, use boundaries,
              or deployment date, so this is only a low-confidence diligence lead. The assigned evidence does not
              disclose APIs, cloud topology, data models, service-level objectives, incident history, peak-load
              performance, or venue hardware dependencies. Consequently, the architecture map below is an
              evidence-bounded functional model, not a representation of Fever's internal systems.
            claimRefs:
              - CE005
              - CE007
              - CE008
              - CE009
              - CE012
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE009
              - CE012
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE012
      - number: '5.3'
        title: Differentiation, trust, and diligence limits
        blocks:
          - type: paragraph
            body: >-
              Fever's plausible differentiation is the combination of demand aggregation, exclusive or original
              programming, partner distribution, analytics, and event execution rather than any single app feature. That
              breadth may create a feedback loop between audience discovery, format selection, distribution, and venue
              operations, but public sources do not quantify the loop or show that every module is deployed consistently
              across markets. Trust evidence is especially incomplete. Apple's storefront disclosure says purchases,
              financial information, location, contacts, search history, identifiers, usage data, and diagnostics may be
              collected and linked to a user; that is a disclosure of data categories, not proof of deficient controls
              or proof of compliance. The assigned pool contains no usable primary evidence for penetration testing,
              formal certifications, retention limits, outage rates, refund performance, or support SLAs. Direct
              diligence should therefore test control effectiveness and operating performance before treating product
              breadth as a durable technical moat.
            claimRefs:
              - CE005
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Product breadth is better evidenced than technical defensibility
            body: >-
              The retained sources show a broad functional surface and a named Formula 1 rollout. They do not provide
              architecture, reliability, security, or unit-level outcome evidence sufficient to establish a durable
              technical moat.
            calloutType: insight
            claimRefs:
              - CE005
              - CE007
              - CE008
              - CE012
          - type: callout
            title: Privacy and operating controls require primary diligence
            body: >-
              Apple's disclosure identifies broad data categories that may be linked to users, while the assigned
              evidence does not establish retention, access-control, incident, refund, or support-SLA performance.
            calloutType: risk
            claimRefs:
              - CE010
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Linked consumer, partner, and enterprise segments
        blocks:
          - type: paragraph
            body: >-
              Fever operates a multi-sided customer system rather than serving one uniform account type. Consumers use
              discovery, recommendation, ticketing, transfer, and support surfaces, while promoters, venues, sports
              properties, attractions, museums, and cultural institutions use distribution and ticketing tools. A
              company-issued job repost adds a distinct channel layer: Fever's Distribution team works with resellers to
              reach incremental audiences, particularly tourists, and tracks performance by product, vertical, partner,
              and geography. Corporate buyers form another segment through tailored Candlelight events. This breadth can
              create cross-market demand and supply loops, but the retained evidence does not disclose segment revenue,
              payer mix, take rate, or contribution margin. Fever's official reach language should therefore be read as
              top-of-funnel exposure, not as a count of active customers or paid accounts.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU008
              - CU009
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU014
      - number: '6.2'
        title: Adoption signals are broad but not comparable
        blocks:
          - type: paragraph
            body: >-
              Fever's official newsroom says the platform inspired more than 300 million people in the last year across
              more than 55 countries, and an independent trade article repeats that annual formulation. A company-issued
              job repost instead says the platform inspires more than 300 million people every month. The denominator is
              not defined in either case, and the annual-versus-monthly conflict prevents a defensible active-user or
              growth series. More concrete adoption signals come from scoped deployments: LIV Golf named Fever the
              ticketing and demand-generation partner for 14 international events in its 2026 season, while Formula 1
              announced a five-year global ticketing relationship beginning in 2027. These metrics describe different
              populations and periods, so they should remain separate rather than being treated as a conversion funnel.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU008
              - CU009
      - number: '6.3'
        title: Named proof ranges from live deployments to future commitments
        blocks:
          - type: paragraph
            body: >-
              Formula 1 provides the strongest counterparty-specific proof, but the broad F1.com rollout is prospective:
              Fever is expected to support general admission, local hospitality, and Paddock Club ticketing from 2027.
              Sector also reports that Fever already powers the F1 Exhibition globally and was selected for ticketing,
              fan engagement, and entertainment programming at Madrid's MADRING circuit. LIV Golf is a nearer-term
              production signal for 2026. In immersive entertainment, The VR Collective reports that Eclipso uses Fever
              for Manhattan ticket sales and that Fever developed Smithsonian Starstruck with the Smithsonian
              Astrophysical Observatory. Corporate proof is broader but less independently verified: trade coverage
              repeats Fever's claim that more than 1,000 companies have used its formats without publishing
              account-level outcomes, repeat behavior, or contract values.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
      - number: '6.4'
        title: Durability and concentration remain private-evidence questions
        blocks:
          - type: paragraph
            body: >-
              The retained sources establish named relationships and operating scope, not durable customer economics.
              None supplies NRR, GRR, churn, renewal rates, repeat-purchase cohorts, contract length, customer-level
              revenue, or top-customer share. Even the external private-market page retained as a cautious counterpoint
              says that its inputs may be limited and are not independently verified, so aggregator data cannot close
              these gaps. The investment case therefore needs customer and event cohorts reconciled to recognized
              revenue, plus representative contracts and concentration schedules. Particular attention should go to
              reseller dependence and flagship sports properties: they can accelerate distribution, but delivery or
              renewal problems at a visible partner could weaken both revenue durability and future reference value.
              Current public funding coverage says Fever intends to invest in partner tools and expand beyond 55
              countries, which increases the importance of measuring whether expansion creates repeatable economics.
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Counterparty-specific partner proof
            body: >-
              Formula 1 and LIV Golf describe scoped ticketing relationships, which is stronger evidence than an
              unexplained customer logo.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU008
          - type: callout
            title: Reach is not retained revenue
            body: >-
              The public record does not disclose repeat purchase, renewal, churn, contract value, or customer
              concentration, and the reported 300 million reach has conflicting annual and monthly periods.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU015
          - type: callout
            title: Underwrite cohorts and contracts
            body: >-
              Request consumer purchase cohorts, partner renewals, event-level economics, SLA and refund performance,
              reseller mix, and top-customer concentration before treating public reach as durable demand.
            calloutType: recommendation
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Ticketing regulation is a concrete risk rather than a hypothetical one. The FTC says its Rule on Unfair or
              Deceptive Fees applies to businesses that offer, display, or advertise live-event tickets, including
              third-party platforms, and requires upfront disclosure of the total price. Its guidance also requires the
              final amount of payment to be displayed before payment and prohibits misrepresentations about fees. That
              creates product, pricing, and monitoring obligations across Fever's consumer surfaces, even though the
              public record here does not establish a Fever enforcement action. The EU Digital Services Act applies to
              intermediary services offered in the Union where there is a substantial connection, and describes online
              platforms that disseminate recipient information to the public; Fever should document its legal
              classification, notice-and-action controls, and trader-information processes for each relevant service. UK
              CMA materials show that ticket platforms have faced court orders, compliance reviews, and recommendations
              for licensing and sanctions. Fever's exposure is bounded by the fact that this evidence concerns
              secondary-ticketing operators, not a finding against Fever, but its marketplace and distribution model
              still warrants jurisdiction-by-jurisdiction review.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational, quality, and financial resilience
        blocks:
          - type: paragraph
            body: >-
              Fever's own recruiting materials indicate operational complexity: its distribution team tracks performance
              by product, vertical, reseller, and geography, collaborates with external partners, and runs pricing and
              marketing experiments. That operating model creates data-quality, attribution, and execution failure modes
              that are not resolved by the existence of dashboards. The global FX partnership announcement describes
              transactions spanning dozens of currencies and payments to local partners and creators, while also stating
              that a currency swing can turn a profitable event series into a loss; outsourcing the capability to Corpay
              reduces treasury workload but creates a material dependency and does not disclose hedge limits,
              counterparty controls, or realized gains and losses. The September 2026 financing provides growth capital,
              but public sources do not provide audited revenue, cash burn, working capital, or runway. Live-market
              conditions add downside: Digital Music News reports that some festivals were cancelled and that ticket
              resale platforms suffered large share-price declines, so event demand, permits, weather, and inventory
              quality can impair returns even when platform metrics remain positive.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Dependencies, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Fever's mitigation posture is partly visible but not measurable enough to underwrite low residual risk.
              The Corpay relationship is described as exclusive, and Fever's recruiting materials describe reseller
              distribution and partner-performance management; both are useful controls but increase the importance of
              service continuity, data portability, and counterparty diversification. The evidence also conflicts on
              financing and valuation: Forge reports a September 2026 Series F of $250 million at a $5.2 billion
              post-money valuation, while Tracxn's fetched record is an older $427 million total and $1.8 billion 2023
              valuation, and Digital Music News reports the 2026 round without independently confirming the valuation.
              This is not evidence of fraud or a loss, but it makes private-market assumptions and dilution or
              preference exposure a diligence item. A thesis break should be tied to observable outcomes: a material
              fee-enforcement notice, a repeated outage or payment failure, a sustained deterioration in event
              cancellations or refunds, loss of a critical reseller or FX provider without replacement, or cash runway
              below the financing plan.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR010
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Most immediate compliance risk
            body: >-
              Fee transparency is an operational control problem: the FTC rule covers third-party live-event ticket
              platforms and requires total-price and final-payment disclosures.
            calloutType: risk
            claimRefs:
              - CR001
          - type: callout
            title: Highest dependency risk
            body: >-
              The public announcement describes Corpay as Fever's exclusive global FX partner, but does not disclose
              fallback rails, hedge limits, or counterparty protections.
            calloutType: risk
            claimRefs:
              - CR006
          - type: callout
            title: Evidence boundary
            body: >-
              No assigned source establishes a Fever enforcement action, security incident, outage, or cash shortfall;
              those are diligence questions, not asserted events.
            calloutType: assumption
            claimRefs:
              - CR004
              - CR008
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The appropriate call is research more, with high risk and an unsupported-at-present valuation stance.
              Independent reports describe a $250 million primary round announced on September 17, 2026, while Forge
              lists a $5.2 billion post-money valuation. That is a current transaction reference, not proof of fair
              value. The reviewed public sources do not provide audited Fever revenue, GMV, take rate, recurring
              revenue, free cash flow, or net debt, so neither a revenue multiple nor a preference-adjusted target
              return can be calculated responsibly. A new entry at the stated mark should require a data-room bridge
              from reported growth to cash generation, plus full security terms and ownership dilution. Without those
              items, the apparent scale and fresh capital are reasons to keep tracking Fever, not reasons to accept the
              round price.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV008
              - CV016
      - number: '8.2'
        title: Financing, cap table, and operating proof
        blocks:
          - type: paragraph
            body: >-
              The financing history shows accelerating nominal marks but also makes entry terms important. Forge reports
              the September 2026 Series F at $250 million, $8.26 per share, and a $5.2 billion post-money valuation; it
              also displays a 1.0x liquidation preference, a 6.0% non-cumulative dividend, and non-participating
              preferred terms. Earlier records are not fully consistent: Tracxn's archived page reports $427 million
              raised and a $1.8 billion valuation as of 2023, while Fever's own June 2025 release says it secured more
              than $100 million and achieved full-year EBITDA profitability after more than 20x pre-pandemic revenue
              growth. Later reporting says revenue more than tripled over three years while remaining EBITDA-positive.
              These are encouraging operating signals, but they are company claims or secondary records rather than
              audited statements, and they do not establish cash conversion.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV012
              - CV013
              - CV016
      - number: '8.3'
        title: Comparable context and scenarios
        blocks:
          - type: paragraph
            body: >-
              Public comparables demonstrate both category value and valuation sensitivity, but they cannot be applied
              mechanically to Fever. Music Business Worldwide reported that CTS Eventim generated EUR3.079 billion of
              2025 revenue and EUR584 million of adjusted EBITDA, while its ticketing segment produced EUR977.1 million
              of revenue at a 46.4% adjusted EBITDA margin. The same report placed Eventim's market capitalization near
              $5.1 billion after a greater-than-21% share decline following near-flat guidance and disclosure of arena
              cost pressure. Live Nation's market capitalization was reported at $35.44 billion in July 2025 and $40.40
              billion in October 2026 by two market-data publishers. These references show that Fever participates in a
              valuable category, but differences in scale, disclosure, business mix, debt, and liquidity prevent a
              defensible public-comparable range. The scenario cases therefore use evidence gates rather than invented
              probabilities.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not established by the financing alone. Forge labels market activity limited and
              provides no available Forge price or last matched price, so the $5.2 billion mark should not be treated as
              a liquid secondary-market quotation. Before approval, obtain audited trailing revenue and gross profit by
              segment, GMV and take rate, cohort retention, partner concentration, EBITDA-to-free-cash-flow conversion,
              net cash, and a fully diluted capitalization table with every preference and dividend. The thesis
              strengthens if those materials validate durable growth, positive cash conversion, and a credible exit path
              at an entry price below or demonstrably supported by the round mark. Thesis-break triggers include a down
              round, negative cash conversion despite reported EBITDA, material customer concentration, or preference
              terms that absorb a disproportionate share of downside proceeds. Until those tests are passed, track
              rather than buy.
            claimRefs:
              - CV004
              - CV005
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline overrides company quality
            body: >-
              Keep Fever on the watch list, but do not approve a new entry at the $5.2 billion mark until audited
              operating evidence and the full preference-adjusted ownership return are available.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV016
