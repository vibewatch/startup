chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Fever presents as a two-sided live-entertainment platform. Its consumer surface helps users discover and
              book events through web and mobile products, while its partner proposition provides ticketing, audience
              reach, distribution analytics, and event-creation support. The retained app listings describe
              recommendations, event maps, ticket transfers, mobile tickets, and 24/7 support, while company-authored
              job copy says Fever uses technology and data to help event creators scale and reach new audiences. That
              combination indicates that Fever is not only a marketplace for third-party inventory: it also participates
              in experience creation and partner distribution. Corporate identity and scale are less settled. Current
              sources disagree on a 2012 versus 2014 founding year, identify different headquarters labels, and use
              incompatible audience, country, city, and employee denominators. The supportable baseline is therefore a
              private global live-entertainment platform with material consumer and partner surfaces, not a single
              precise scale statistic or office designation.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: Leadership, founders, and governance
        blocks:
          - type: paragraph
            body: >-
              The named founding group is consistent across current financing coverage and reference sources: Ignacio
              Bachiller, Francisco Hein, and Alexandre Perez are identified as co-founders, while Wikipedia also names
              Pep Gomez. Craft lists Pep Gomez as founder and board member, Ignacio Bachiller as co-founder and CEO,
              Alexandre Perez as co-founder, and Alvaro Fresnillo Vírseda as VP of Operations. This gives Fever visible
              founder continuity and some functional coverage, but it does not establish a complete executive committee,
              board composition, voting control, or succession plan. That absence is material for a late-stage private
              company financing internationally and expanding through partnerships and acquisition. A buyer or investor
              should request the current cap table, board rights, reserved matters, executive responsibilities, and
              key-person contingency plan rather than infer governance from public directories.
            claimRefs:
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: Capital, scale, and milestones
        blocks:
          - type: paragraph
            body: >-
              The strongest current financing evidence is Pollstar's report of a $250 million primary-equity round led
              by EQT, with Point72 Private Investments and Baillie Gifford participating alongside existing investors.
              Pollstar also reports that Fever said revenue more than tripled over the preceding three years and
              remained EBITDA-positive; those are company-attributed statements, not audited financial results in the
              retained source. A separate syndicated funding report gives the same round and stated use of proceeds:
              expansion beyond 55 countries and more investment in partner technology. Forge's private-market page
              supplies a $5.2 billion post-money estimate for a September 2026 Series F, while Wikipedia retains the
              earlier $1.8 billion valuation from 2023. Forge expressly says its private-company data may rely on
              limited inputs and is not independently verified, so the later estimate should remain a diligence item
              rather than a settled cover metric. The dated record still shows progression from founding and product
              launch through growth financing, the DICE acquisition, the Formula 1 agreement, and the EQT-led round.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO008
              - CO009
              - CO010
              - CO013
              - CO014
              - CO016
      - number: '1.4'
        title: Diligence implications and open gaps
        blocks:
          - type: paragraph
            body: >-
              Fever has evidence of a scaled distribution model, recognizable institutional partners, and continued
              access to growth capital. The same evidence exposes the main diligence limits. The company describes
              audience reach and revenue growth, but the retained material does not provide audited revenue, GMV, take
              rate, contribution margin, repeat purchase, customer concentration, cash conversion, or current runway.
              Apple's app listing also states that purchases and identifiers may be used to track users across apps and
              websites owned by other companies; that disclosure identifies a privacy diligence topic but does not
              establish a breach or regulatory incident. The company-overview conclusion is therefore positive on
              distribution and financing access but conditional on verification of economics, governance, data
              practices, and operating reliability. Diligence should prioritize audited financials, the legal-entity
              map, cap-table and board materials, DICE integration economics, privacy controls, and dashboards for
              refunds, incidents, repeat purchase, partner renewal, and geographic mix.
