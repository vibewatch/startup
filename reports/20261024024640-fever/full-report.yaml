  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Fever is positioned as broader and more integrated than focused ticketing peers, while incumbent scale and
      regulatory exposure remain separate competitive dimensions.
    data:
      xAxis: Workflow breadth and integration (ordinal, 1=narrow, 5=multi-layer)
      yAxis: Distribution and scale evidence (ordinal, 1=limited, 5=strong)
      points:
        - label: Fever
          x: 5
          'y': 4
          note: >-
            Marketplace, originals, operations, reseller distribution, and data-led experimentation are described;
            private scale metrics remain incomplete.
        - label: Ticketmaster / Live Nation
          x: 4
          'y': 5
          note: >-
            Incumbent live-entertainment and ticketing scale is described qualitatively; comparable Fever displacement
            data is unavailable.
        - label: Eventbrite
          x: 3
          'y': 3
          note: >-
            $325M 2024 revenue and $0.45B October 2026 market cap are reported, but product overlap is not fully
            enumerated.
        - label: DICE
          x: 3
          'y': 3
          note: >-
            Music-focused ticketing, price transparency, and wait-list functionality are described; post-acquisition
            scale is unknown.
        - label: Secondary marketplaces
          x: 2
          'y': 4
          note: Resale liquidity is a distinct alternative, while the CMA records compliance concerns across platforms.
        - label: Direct venue or promoter sales
          x: 1
          'y': 2
          note: Status quo control is plausible, but assigned evidence does not quantify direct-channel reach or tooling.
