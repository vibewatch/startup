      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: competitor-scale
      missingEvidence: "Comparable current operating metrics and customer counts for Ticketmaster, Live Nation, DICE, Eventbrite, and Fever."
      whyItMatters: "Public market capitalization and revenue data are not directly comparable to Fever's private metrics or to competitor segment economics."
      diligencePath: "Collect current filings, investor materials, product pricing, and partner references for each material alternative."
      relatedQuestionRefs: [QP002, QP004]
      relatedTableRefs: [TP001, TP003]
    - type: access-blocked
      severity: minor
      topic: pricing-transparency
      missingEvidence: "A complete, current price and fee schedule across Fever, Eventbrite, DICE, incumbent ticketing, and resale alternatives."
      whyItMatters: "The FTC rule changes the trust and conversion context, but the pool does not show realized customer prices or platform fee incidence."
      diligencePath: "Run controlled checkout comparisons by market and event type, preserving displayed price, mandatory fees, refund terms, and final total."
      relatedQuestionRefs: [QP004, QP006]
      relatedTableRefs: [TP003]
