artifact: competitors
slug: fever
runDate: 2026-10-24
company:
  name: Fever
chapter:
  number: 3
  title: Competitors
  summary: Fever competes as a discovery, ticketing, event-operations, and original-content platform rather than as a single-purpose ticket marketplace. Its broad operating wedge and data-led distribution are differentiated, but Ticketmaster, secondary marketplaces, Eventbrite, focused music-ticketing providers, and copycat experience operators can attack individual layers.
sections:
  - id: competitive-landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      Fever's competitive set spans several jobs to be done. The assigned third-party
      analysis describes a platform that lets users browse and book local experiences
      across sports, music, food, wellness, and immersive entertainment, while also
      providing on-location access control, capacity control, cashless payments,
      inventory, and staff-management services. That breadth puts Fever against
      Ticketmaster and Live Nation in large-scale ticketing and discovery, Eventbrite
      in self-serve event tooling, DICE and other focused music-ticketing products in
      nightlife, and StubHub, viagogo, SeatGeek, and Vivid Seats in resale or
      secondary-market demand. Status-quo alternatives remain direct venue sales,
      promoter-owned websites, social discovery, spreadsheets, and internal event
      operations. The result is a multi-front market: Fever can win a partner with
      bundled distribution and operations, but it can also be displaced one workflow
      at a time.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: capability-and-distribution
    title: Capability, distribution, and trust comparison
    body: >-
      Fever's strongest strategic distinction is the combination of demand generation,
      partner distribution, and repeatable original formats. Its own hiring material
      says the distribution team works with resellers to reach niche audiences and
      uses dashboards by product, vertical, partner, and geography, while the
      independent analysis characterizes the business as an end-to-end, data-driven
      operating system for live entertainment. DICE adds a music-oriented product
      with a wait-list mechanism that can return tickets to fans instead of sending
      them to resellers. These capabilities are meaningful only if Fever can maintain
      supply quality, conversion, and partner economics across markets. Trust is also
      a competitive axis: the UK Competition and Markets Authority required stronger
      information practices in secondary ticketing, and the US Federal Trade
      Commission's rule requires all-in price disclosure for advertised live-event
      tickets. Those rules raise compliance demands for every ticketing intermediary,
      while transparent pricing can become a product differentiator.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
  - id: durability-and-risks
    title: Moat durability, pricing pressure, and displacement risk
    body: >-
      Fever's moat is more likely to be an operating system of partner relationships,
      local demand data, distribution channels, and reusable formats than a
      permanently protected feature. The third-party analysis explicitly notes that
      Ticketmaster launched City Guides for local discovery and that Fever's
      repeatable concepts can be copied by competitors seeking the same cities and
      organizers. Competitive scale is uneven: Eventbrite's assigned market-data
      page reports a $0.45 billion market capitalization in October 2026 and $325
      million of 2024 revenue, but that public-company comparison is not directly
      comparable to Fever's private operating metrics. Pricing and regulatory
      pressure can also compress take rates or raise support costs. Fever's
      strategic response is to deepen partner integration, build original IP, and
      use data-driven experimentation, but the pool does not provide verified
      customer-retention, realized-price, or competitor contract data. Those
      missing inputs limit confidence in switching costs and long-term share
      durability.
    claimRefs: [CP009, CP010, CP011, CP012]
    tableRefs: [TP003]
    figureRefs: [FP001]
tables:
  - id: TP001
    title: Competitor profile and alternative map
    columns: [Competitor or alternative, Category, Scale or evidence, Target segment, Differentiation, Limitation or diligence gap]
    rows:
      - [Ticketmaster / Live Nation, Incumbent ticketing and live entertainment, "Ticketmaster City Guides were live in London, Los Angeles, and New York in the cited 2025 analysis", "Large venues, sports, music", "Incumbent supply and discovery distribution", "Direct current share, contract duration, and Fever displacement win rates are not disclosed"]
      - [Eventbrite, Direct / adjacent event platform, "$325M 2024 revenue; $0.45B market cap in October 2026", Self-serve event organizers and attendees, Public scale and broad event tooling, "Public metrics are not like-for-like with Fever; current product overlap requires diligence"]
      - [DICE, Focused music-ticketing peer and acquired capability, "Fever acquired DICE in June 2025 according to the assigned analysis", Music and nightlife fans, Price transparency and wait-list flow, "Post-acquisition retention, economics, and integration outcomes are unknown"]
      - [StubHub / viagogo / SeatGeek / Vivid Seats, Secondary-market substitutes, "CMA records enforcement and information concerns across secondary platforms", Resale buyers and sellers, Inventory liquidity and resale demand, "Fever's exposure to secondary-market economics and compliance obligations is not quantified"]
      - [Promoter or venue direct sales, Status quo / internal build, "Direct websites and owned channels are identified as alternatives; no assigned source quantifies adoption", "Venues, promoters, cultural institutions", "Control and economics may be attractive", "Discovery reach and tooling investment are internal costs"]
    notes: "Evidence is a mixed snapshot from independent analysis, regulator records, and public-company market data; missing cells denote unavailable comparable evidence rather than zero capability."
    enumerationScope:
      coverage: sample
      basis: "Representative alternatives across incumbent, adjacent, acquired, resale, and status-quo solutions identified in the assigned competitor evidence pool."
    claimRefs: [CP001, CP003, CP009, CP010]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, Fever, Ticketmaster / Live Nation, Eventbrite, DICE / focused music, Status quo]
    rows:
      - [Local discovery, "Supported; marketplace and city-level discovery are described", "City Guides described as a competing local-discovery initiative", "Not established in assigned text", "Music-focused discovery", "Owned channels only"]
      - [Ticketing, "Core capability", "Incumbent capability", "Core event-platform capability", "Music-ticketing capability", "Direct sales"]
      - [Event operations, "Cashless, access, capacity, inventory, and staff services described", "Not established in assigned text", "Not established in assigned text", "Not established in assigned text", "Internal tools or vendors"]
      - [Original content, "Fever Originals including Candlelight and other formats", "Not established in assigned text", "Not established in assigned text", "Focused music supply", "Promoter-created content"]
      - [Reseller distribution, "Hiring material describes reseller partnerships and channel dashboards", "Not quantified", "Not established in assigned text", "Wait-list can return tickets to fans", "No incremental channel"]
      - [Transparent pricing and compliance, "Exposure and current implementation are not verified", "FTC all-in pricing rule applies to advertised tickets", "Implementation not established", "Price transparency is described for DICE", "Depends on local compliance"]
    notes: "Cells marked not established are deliberate unknowns. The matrix compares evidence-backed capabilities and does not infer parity from a competitor's category label."
    claimRefs: [CP005, CP006, CP007, CP008]
  - id: TP003
    title: Pricing, packaging, and switching-cost comparison
    columns: [Solution, Price or contract model, Included capabilities, Discount or unknowns, Competitive implication]
    rows:
      - [Fever marketplace and originals, "Ticket prices and marketing-fee economics; realized pricing not disclosed", "Discovery, ticketing, originals, and partner promotion", "Realized fees, take rate, and discounts unknown", "Bundling can increase share of the event lifecycle"]
      - [Fever distribution channels, "Partner / reseller distribution; price terms not disclosed", "Third-party reach, KPI dashboards, experiments, and channel strategy", "Partner economics and renewal terms unknown", "Distribution data may increase switching costs if performance is proven"]
      - [DICE / music ticketing, "Ticketing economics not disclosed", "Music discovery, price transparency, and wait list", "Post-acquisition packaging and pricing unknown", "Focused music UX can defend a segment while broadening Fever's supply"]
      - [Eventbrite, "Public revenue is reported, but event-level prices and contract terms are not in the pool", "Event creation and ticketing platform", "Customer-level pricing and retention unknown", "Public scale is a benchmark, not proof of direct product parity"]
      - [Secondary marketplaces, "Resale prices and fees vary by listing and platform", "Secondary inventory and buyer-seller matching", "Fee disclosure and compliance history create uncertainty", "Liquidity competes for demand but carries trust and regulatory risk"]
    notes: "No assigned source provides a comparable price sheet across competitors. The table preserves unknown realized pricing, take rates, discounts, and contract terms rather than estimating them."
    claimRefs: [CP002, CP006, CP008, CP011]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Fever is positioned as broader and more integrated than focused ticketing peers, while incumbent scale and regulatory exposure remain separate competitive dimensions.
    data:
      xAxis: "Workflow breadth and integration (ordinal, 1=narrow, 5=multi-layer)"
      yAxis: "Distribution and scale evidence (ordinal, 1=limited, 5=strong)"
      points:
        - {label: Fever, x: 5, y: 4, note: "Marketplace, originals, operations, reseller distribution, and data-led experimentation are described; private scale metrics remain incomplete."}
        - {label: Ticketmaster / Live Nation, x: 4, y: 5, note: "Incumbent live-entertainment and ticketing scale is described qualitatively; comparable Fever displacement data is unavailable."}
        - {label: Eventbrite, x: 3, y: 3, note: "$325M 2024 revenue and $0.45B October 2026 market cap are reported, but product overlap is not fully enumerated."}
        - {label: DICE, x: 3, y: 3, note: "Music-focused ticketing, price transparency, and wait-list functionality are described; post-acquisition scale is unknown."}
        - {label: Secondary marketplaces, x: 2, y: 4, note: "Resale liquidity is a distinct alternative, while the CMA records compliance concerns across platforms."}
        - {label: Direct venue or promoter sales, x: 1, y: 2, note: "Status quo control is plausible, but assigned evidence does not quantify direct-channel reach or tooling."}
    claimRefs: [CP001, CP005, CP009, CP010]
callouts:
  - calloutType: strength
    title: Integrated wedge
    body: Fever can use discovery and ticketing to expand into production, partner distribution, and on-site operations, increasing the number of workflows in which a partner may rely on it.
    claimRefs: [CP001, CP005]
  - calloutType: risk
    title: Copyability and incumbent response
    body: "The most visible differentiators are exposed to imitation: Ticketmaster has launched local discovery guides, while repeatable Fever formats can be copied and compete for the same cities, organizers, and audiences."
    claimRefs: [CP009, CP010]
  - calloutType: assumption
    title: Switching-cost evidence remains incomplete
    body: No assigned source verifies partner retention, contract duration, realized pricing, or customer concentration, so integration breadth should not be treated as proven lock-in.
    claimRefs: [CP011, CP012]
