slug: fever
runDate: 2026-10-24
company:
  name: Fever
chapter:
  number: 2
  title: Market Analysis
  summary: Fever operates at the intersection of online event ticketing, live-event discovery, and event-production technology. The evidence supports a large, growing, but heterogeneous market; the principal diligence issue is not top-down demand, but how much of the addressable spend Fever can capture with defensible economics across consumers, organizers, and distribution partners.
sections:
  - id: market-boundary
    title: Market boundary and buyer system
    body: >-
      Fever's relevant market is narrower than the whole entertainment economy. The
      directly addressable core is digital discovery, ticket transaction, and demand
      generation for live experiences, augmented by software and services sold to
      organizers, venues, sports teams, promoters, and cultural institutions. Fever's
      own app description lists concerts, festivals, museums, theater, food, nightlife,
      tours, and cinema, while the job-market evidence describes reseller distribution,
      channel sizing, pricing tests, and revenue models. This supports a two-sided
      boundary: consumer demand and checkout on one side, and organizer inventory,
      promotion, pricing, analytics, and distribution on the other. Excluded from the
      core sizing are the full value of venue operations, artist compensation, food and
      beverage, and unsold or purely offline transactions. Those adjacencies can expand
      Fever's opportunity but should not be counted as ticket-platform revenue without
      a disclosed take rate or service-fee basis.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001, TM003]
  - id: sizing-lenses
    title: Sizing lenses and market growth
    body: >-
      Available market estimates are directionally positive but not interchangeable.
      GII places online event ticketing at USD 88.38 billion in 2026 and USD 105.17
      billion in 2031, a 3.55% CAGR, with mobile devices representing 58.40% of 2025
      transactions and music concerts and festivals representing 36.12% of 2025
      revenue. Coherent Market Insights gives a much broader U.S. live-events estimate
      of USD 489.90 billion in 2026 and USD 660.28 billion in 2033 at 5.1% CAGR; that
      includes event categories and organizer segments beyond ticketing. Gitnux reports
      a USD 1.2 trillion global live-entertainment figure for 2023, but its page does
      not establish a comparable platform-revenue denominator. These lenses should be
      treated as a range of market contexts, not a single TAM. Fever-specific capture
      requires disclosed GMV, take rate, fee revenue, organizer software revenue, and
      geographic mix; none is established by the public evidence retained here.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: adoption-drivers-constraints
    title: Adoption drivers, constraints, and valuation relevance
    body: >-
      Adoption is supported by mobile behavior, personalized discovery, exclusive
      inventory, and organizer demand for measurable distribution. The job posting
      describes dashboards by product, vertical, partner, and geography, channel
      experiments, and reseller partnerships intended to unlock incremental revenue.
      The app listing documents recommendations, map-based discovery, mobile tickets,
      transfers, loyalty, and multilingual support. These capabilities can reduce
      search friction and improve conversion, but they do not prove retention or
      unit economics. Constraints are equally material: GII identifies fee-transparency
      and antitrust scrutiny, while Coherent identifies high operational costs and
      incumbent entry barriers. A 2023 industry article reported that North America
      exceeded 50% of Fever revenue, which indicates geographic concentration if still
      representative but is historical and company-reported. The investment case
      therefore depends on repeat purchase, organizer renewal, supply exclusivity,
      contribution margin after event production, and compliance costs rather than on
      headline market size alone.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
    tableRefs: []
callouts:
  - calloutType: insight
    title: What the market evidence actually establishes
    body: The evidence establishes a large multi-segment demand environment and plausible technology-enabled adoption drivers, but it does not isolate Fever's serviceable market or prove a sustainable share.
    claimRefs: [CM005, CM008, CM014]
  - calloutType: risk
    title: Key sizing risk
    body: Public estimates mix ticketing revenue, live-event spending, and broader event production; using them as one denominator would overstate Fever's addressable revenue pool.
    claimRefs: [CM006, CM007, CM008]
