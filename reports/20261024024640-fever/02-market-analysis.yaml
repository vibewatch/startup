  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: Fever GMV, take rate, service-fee revenue, organizer software revenue, and geographic segment mix.
      whyItMatters: Without a company-specific denominator, external market totals cannot be converted into SAM, SOM, or market share.
      diligencePath: Obtain management reporting or audited segment disclosures and reconcile them to transaction volume and active markets.
      relatedQuestionRefs: [QM007, QM008]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: A reconciled definition for global live entertainment, U.S. live events, and online event-ticketing estimates.
      whyItMatters: The retained estimates use different scopes and could materially overstate opportunity if combined.
      diligencePath: Request source methodologies, denominators, and inclusion rules from each publisher, then select one comparable base case.
      relatedQuestionRefs: [QM002, QM007]
      relatedTableRefs: [TM002]
