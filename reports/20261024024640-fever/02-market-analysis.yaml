  - id: TM003
    title: Adoption drivers and constraints
    columns: [Evidence, Direction, Mechanism, Budget owner or affected party, Valuation implication]
    rows:
      - ["Mobile devices were 58.40% of 2025 online ticketing transactions", "positive", "Mobile checkout and wallet behavior can reduce friction", "Consumer and organizer", "Supports conversion investment"]
      - ["Music concerts and festivals were 36.12% of 2025 online ticketing revenue", "positive", "Large category concentration creates repeatable inventory", "Promoter and ticketing platform", "Supports category focus"]
      - ["5G and mobile payments", "positive", "Faster discovery and checkout expand mobile reach", "Consumer and platform", "Potential volume growth"]
      - ["Personalized recommendations and maps", "positive", "Lower search cost and better matching", "Consumer", "Potential engagement moat"]
      - ["Reseller partnerships and channel experiments", "positive", "Incremental distribution can add demand", "Growth and partner teams", "Potential CAC leverage"]
      - ["Fee-transparency scrutiny", "negative", "Upfront fee disclosure can reduce surprise-fee revenue and add compliance work", "Platform and organizer", "Margin and conversion risk"]
      - ["Antitrust and exclusivity scrutiny", "negative", "Limits to exclusive arrangements can constrain supply advantages", "Platform and rights holders", "Moat risk"]
      - ["High operating costs", "negative", "Venue, labor, safety, insurance, and production expenses compress margins", "Organizer and producer", "Contribution-margin risk"]
    notes: Directional synthesis from the cited sources; no source provides Fever-specific conversion, retention, or margin evidence.
    claimRefs: [CM003, CM006, CM010, CM011, CM012]
