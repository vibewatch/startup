      - ["Partner technology", "Demand, audience, and ticketing tools for organizers", "Partners and events", "Investment planned; no standalone software revenue disclosed", "Company/press-reported", "Separate software fees from ticketing and production revenue"]
      - ["Reseller distribution", "Third-party channels and partner platforms", "Products, verticals, resellers, geographies", "Revenue models and KPI dashboards described; values unavailable", "Operational proxy from job posting", "Obtain channel margin, reseller fees, incremental conversion, and concentration"]
      - ["Experience production and branded formats", "Exclusive and co-produced experiences", "Events and experiences", "Examples disclosed; segment mix unavailable", "Company/partner examples; no financial split", "Obtain production cost, rights economics, and event-level contribution margin"]
      - ["Consumer ticket purchase", "Event-specific ticket purchase", "Ticket transaction", "No standard platform fee published", "Pricing surface observed; realized price unavailable", "Obtain fee schedule and settlement statements"]
      - ["Reseller channel", "Third-party distribution", "Channel transaction", "Pricing tests and alternative discounts referenced", "Operational proxy from job posting", "Obtain channel margin and reseller fees"]
      - ["Partner technology pricing", "Partner demand and ticketing tools", "Partner contract", "No public price card or contract terms", "Contract economics unavailable", "Obtain software fee basis and implementation scope"]
      - ["Unit economics", "Customer acquisition, delivery, and support", "CAC, payback, gross margin", "Unavailable in assigned public evidence", "Underwriting gap", "Obtain cohort CAC, payback, margin, refunds, and support costs"]
    notes: "Public sources describe mechanisms and operating proxies, not audited segment revenue; null or unavailable values must not be read as zero."
    claimRefs: [CI001, CI002, CI005, CI007]
  - id: TI003
    title: Unit economics and efficiency availability
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - ["CAC or paid acquisition cost", null, low, "Determines whether audience growth is capital-efficient", "Cohort CAC by channel, geography, and event category"]
      - ["Payback period", null, low, "Tests whether distribution investment converts before cash needs recur", "Gross-profit payback by customer and partner cohort"]
      - ["Gross margin", null, low, "Separates software/distribution leverage from event delivery costs", "Audited gross margin bridge by revenue stream"]
      - ["Refund and support cost rate", null, low, "Live-event cancellations and service load can absorb gross profit", "Refund, chargeback, support-SLA, and incident dashboards"]
    notes: "All values are unavailable in the assigned public evidence; no zero is implied. Each null requires private financial or operating evidence."
    claimRefs: [CI008, CI013]
  - id: TI004
    title: Capital signals and underwriting status
    columns: [Input, Public evidence, Interpretation, Status, Diligence ask]
    rows:
      - ["Latest financing", "$250M primary equity round led by EQT in September 2026", "Adds gross capital and investor support", "Observed in independent reporting", "Confirm closing documents, fees, preferences, and cash received"]
      - ["Implied valuation", "Approximately EUR4.5B / roughly $5.2B implied by Atresmedia stake sale", "Secondary transaction implication, not audited company valuation", "Reported estimate", "Obtain cap table, transaction price, and current preferred terms"]
      - ["Profitability signal", "Revenue more than tripled in three years while remaining EBITDA-positive", "Positive directional signal; denominator and bridge absent", "Company/press-reported", "Obtain audited P&L, EBITDA reconciliation, and cash conversion"]
      - ["Public-category valuation context", "Eventbrite market cap of $0.45B in October 2026 versus $2.17B at year-end 2018", "Shows category valuation volatility; not a direct Fever benchmark", "Independent market-data observation", "Build a revenue-growth and margin-adjusted comparable set"]
      - ["Cash, burn, runway, and debt", null, "Financing does not establish cash available or runway", "Material gap", "Obtain monthly cash, burn, debt schedule, working capital, and next-round trigger"]
    notes: "Financing raised, implied valuation, accounting EBITDA, and cash availability are distinct quantities; the table preserves those distinctions."
    claimRefs: [CI003, CI009, CI010, CI011, CI012, CI013, CI014]
