  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: Audited revenue by stream, ticket GMV, take rate, gross margin, CAC, payback, and contribution margin.
      whyItMatters: Without these denominators, reported growth and EBITDA positivity cannot be translated into durable revenue quality or cash economics.
      diligencePath: Request audited monthly management accounts and cohort economics split across ticketing, partner technology, distribution, and produced experiences.
      relatedQuestionRefs: [QI004, QI005]
      relatedTableRefs: [TI001, TI003]
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash balance, monthly net burn, working-capital schedule, debt and preferred obligations, and runway model.
      whyItMatters: A financing headline measures capital raised, not liquidity, and the business may carry event, refund, or partner-settlement obligations.
      diligencePath: Obtain the latest balance sheet, 24-month cash forecast, debt schedule, covenant package, and board-approved financing plan.
      relatedQuestionRefs: [QI008, QI009]
      relatedTableRefs: [TI004]
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: Executed financing documents and an updated cap table reconciling the September 2026 valuation with older private-market records.
      whyItMatters: The valuation hurdle drives return expectations, dilution analysis, and whether reported growth is sufficient for the current price.
      diligencePath: Reconcile the primary round, secondary transaction, preferred terms, option pool, and fully diluted share count with the company or lead investors.
      relatedQuestionRefs: [QI007]
      relatedTableRefs: [TI004]
    - type: enumeration-incomplete
      severity: material
      topic: pricing
      missingEvidence: A complete inventory of customer, reseller, partner, and event-level pricing and fee schedules.
      whyItMatters: Public app surfaces and job postings reveal mechanisms but not realized pricing, discounts, channel fees, or mix.
      diligencePath: Sample executed contracts and settlement statements across geographies, event categories, and distribution channels.
      relatedQuestionRefs: [QI003, QI010]
      relatedTableRefs: [TI001]
