schemaVersion: "report-v2"
artifact: financials
slug: fever
runDate: 2026-10-24
company:
  name: Fever
chapter:
  number: 4
  title: Financials
  summary: Fever presents a scaled, multi-sided live-entertainment platform with reported revenue growth and EBITDA profitability, but public evidence still does not disclose the revenue base, take rate, cash balance, burn, or unit economics needed for underwriting. The September 2026 financing improves capital optionality while the implied valuation raises the hurdle for durable margins and cash conversion.
sections:
  - id: monetization-and-traction
    title: Monetization and public traction
    body: >-
      Fever monetizes a combination of consumer discovery, ticketing, and partner-facing
      technology rather than a pure subscription product. Its distribution role includes
      resellers and third-party platforms, while its partner tooling is positioned to help
      organizers gauge demand, reach audiences, improve ticketing, and expand successful
      formats. A company job description says the distribution team builds revenue models,
      tracks performance by product, vertical, reseller, and geography, and runs pricing,
      marketing-investment, and discount experiments. Those are credible operating proxies
      for a sophisticated marketplace or ticketing motion, but they are not disclosed CAC,
      payback, take-rate, or contribution-margin figures. Public traction is similarly
      top-line and company-reported: the same job posting says the platform inspires over
      300 million people monthly in more than 55 countries, while a 2026 financing report
      says revenue more than tripled over three years and the business remained
      EBITDA-positive. The differing audience descriptions are not directly comparable
      without a definition of people, users, or monthly activity.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: pricing-costs-and-efficiency
    title: Pricing, cost structure, and efficiency
    body: >-
      Public pricing evidence is fragmented because Fever's economics vary by event,
      geography, partner, channel, and experience format. The consumer application listing
      describes ticket discovery, exclusive events, personalized recommendations, ticket
      transfers, mobile tickets, and customer support, but it does not publish a standard
      platform fee or contract schedule. The distribution role explicitly references
      resellers, channel sizing, revenue models, pricing tests, alternative discounts, and
      partner performance, indicating that realized monetization is likely negotiated or
      experiment-dependent rather than captured by one public list price. Cost drivers
      should therefore include demand generation, payment and support operations, partner
      tooling, event or experience production, and the service burden of a global footprint.
      Fever reports EBITDA positivity, but no retained source supplies gross margin,
      EBITDA amount, cash conversion, working capital, refund rate, or cost per acquired
      customer. Underwriting should treat these as unavailable rather than infer them from
      revenue growth or a financing headline.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-adequacy-and-underwriting
    title: Capital adequacy and underwriting blockers
    body: >-
      The September 2026 primary equity round provides a meaningful financing signal:
      Fever raised $250 million led by EQT, with Baillie Gifford, Point72 Private
      Investments, and existing shareholders participating. The company said proceeds
      would support expansion beyond 55 countries, deeper coverage of entertainment
      categories, and more technology for partners. Independent reporting also describes
      Fever as EBITDA-positive and says revenue more than tripled over the prior three
      years. A secondary stake sale reported by Atresmedia implied approximately EUR
      4.5 billion, or roughly $5.2 billion at contemporary exchange rates, but that is
      an implied transaction valuation rather than a company-confirmed audited valuation.
      A private-market data page records the same round and valuation while warning that
      its data may rely on limited inputs and is not independently verified; an older
      Tracxn snapshot still shows $1.8 billion valuation and $427 million total funding
      as of early 2023. Those older observations are not current comparators. Separately,
      CompaniesMarketCap reports Eventbrite at $0.45 billion in October 2026 versus
      $2.17 billion at year-end 2018, which illustrates public-market category volatility
      rather than furnishing a direct valuation benchmark for Fever. Cash on hand, net
      burn, runway, debt, working-capital needs, and next-round triggers remain
      undisclosed, so the financing improves optionality but does not prove capital
      sufficiency or cash availability.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
    tableRefs: [TI004]
    figureRefs: [FI001]
callouts:
  - calloutType: insight
    title: Operating leverage is plausible, not yet measurable
    body: Fever reports more than tripled revenue while remaining EBITDA-positive, but the public record does not provide the revenue denominator, EBITDA bridge, gross margin, or cash conversion needed to distinguish operating leverage from scale purchased with capital.
    claimRefs: [CI003, CI008]
  - calloutType: risk
    title: Financing is not runway
    body: The $250 million equity raise is gross financing, not cash on hand; without burn, working-capital, debt, and use-of-funds detail, runway and next-round dependency remain open underwriting questions.
    claimRefs: [CI009, CI013]
