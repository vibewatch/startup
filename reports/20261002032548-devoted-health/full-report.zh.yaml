      - number: '3.3'
        title: 定价机制、分销渠道与业务持久性挑战
        blocks:
          - type: paragraph
            body: >-
              Medicare Advantage 医保计划普遍以 $0 月保费为招牌，将消费者的决策重心完全引向附加福利丰厚度、医疗网络覆盖广度、处方药共付额（copays）以及经纪人的主观推荐。Devoted 主打 $0
              保费的 HMO 与 PPO 计划，捆绑 Part D 处方药险并附赠丰厚的额外权益。MA 领域的分销主导权高度受制于区域营销机构（FMOs，如 Senior Market
              Advisors）及独立持牌销售经纪人。Devoted
              极力争取经纪人心智，简化产品定位并提供极速响应的专属支持，有效降低了客户流失率并保障了经纪人的续保佣金分成。然而，来自老牌巨头的挤压与监管逆风对其长期韧性构成了严峻考验。传统险企在本地医疗机构谈判中具备强大的压价筹码，且能承受短暂的
              MLR 利润挤压，而此类挤压足以击垮规模较小的资产负债表。此外，Devoted
              采取全风险运营模式，新进驻州一旦遭遇突发医疗支出激增或逆向选择，将对其法定偿付资本造成巨大压力；历史监管文件显示，尽管公司营收增长迅猛，其营业利润率此前长期徘徊在盈亏平衡点边缘。
            claimRefs:
              - CP002
              - CP011
              - CP013
              - CP014
              - CP015
              - CP016
