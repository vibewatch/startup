      - number: '6.3'
        title: 临床交付与医疗网络落地印证
        blocks:
          - type: paragraph
            body: >-
              不同于纯粹充当资金中介的传统健康险公司，Devoted Health 将医保计划与自营诊疗实体及签约医疗网络伙伴紧密结合 [CU001, CU002]。其会员留存与促活战略的核心支柱是“Devoted
              Health Guides”服务模式：位于美国本土的全职专员担任会员的专属私人导医，协助预约挂号、解答福利政策并协助转诊衔接 [CU001, CU005]。在人工 Guides 背后，自研 Orinoco
              平台作为统一软件架构，深度整合了电子病历、理赔结算与客户服务工作流，使服务人员在交互中能够实时调取完整的全病程连续数据 [CU004]。


              临床交付端，Devoted Medical 作为一家线上优先与上门巡诊相结合的医疗实体，与本地签约社区医疗机构协同联动 [CU002, CU004]。例如在佛罗里达等区域市场，Devoted 与
              LifeStance Health 等心理与行为健康网络建立院内合作，确保会员只需支付标准共付额（copayment）即可享有门诊心理咨询、精神科诊疗与药物管理服务 [CU010]。在专科诊疗领域，公司称
              Devoted Medical 线上糖尿病诊所聘用高阶执业医护人员（NP 和 PA），借助定制电子健康信息工具开展精细化血糖控制与用药方案调整 [CU006]。即便如此，由于 Devoted
              在自有医护之外依然严重依赖外部签约医疗集团与区域医院，转诊网络中断风险与预先授权（Prior Authorization）行政摩擦依然是左右医疗方满意度与会员留存的关键决定项 [CU004, CU010]。
            claimRefs:
              - CU001
