  - id: FU001
    title: Devoted Health 会员旅程与体验地图
    type: journey-map
    summary: 全景呈现 Medicare Advantage 会员从方案比选、临床转诊到年度续约的端到端服务旅程。
    data:
      items:
        - label: 认知与了解
          stage: 认知与了解
          description: 老年人在年度开放投保期（AEP）评估各家 Medicare Advantage 计划。
          actor: 潜在会员
          touchpoints:
            - 官网方案对比工具
            - 社区宣讲会与销售代理咨询
          sentiment: neutral
        - label: 投保入组
          stage: 投保入组
          description: 会员选定含牙科、视力、听力及 OTC 补贴的 $0 保费计划。
          actor: 参保会员
          touchpoints:
            - 首发迎新礼包与会员卡
            - 专属 Member Guide 首次外呼电话
          sentiment: positive
        - label: 照护协调与就医导引
          stage: 照护协调与就医导引
          description: 专属会员服务向导协助搜寻医疗机构、预约门诊及配置药房。
          actor: 在保会员
          touchpoints:
            - 专属 Member Guide 电话支持
            - Orinoco 数据平台背景调取
          sentiment: positive
        - label: 专科临床转诊
          stage: 专科临床转诊
          description: 患慢性病的高需求会员分流至 Devoted Medical 微型诊所。
          actor: 慢病患者
          touchpoints:
            - 虚拟糖尿病诊所问诊
            - 执业护士上门检查
          sentiment: positive
        - label: 行政与核查摩擦
          stage: 行政与核查摩擦
          description: 会员或医疗服务机构遭遇预先授权或回顾性病历编码审查。
          actor: 患者与网络内临床医生
          touchpoints:
            - 预先授权审核函
            - 回顾性风险调整质检
          sentiment: warning
        - label: 年度留存与续保
          stage: 年度留存与续保
          description: 会员评估方案价值、星级评定质量福利与医疗网络稳定性。
          actor: 续保会员
          touchpoints:
            - 年度变更通知（ANOC）
            - AEP 续保或退保决策
          sentiment: neutral
    approximationNotes: 各阶段与触点反映 Medicare Advantage 标准服务流程及 Devoted Health 披露的 Guide/Orinoco 运营架构。
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU006
      - CU011
