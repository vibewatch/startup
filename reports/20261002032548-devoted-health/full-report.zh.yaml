      - number: '4.4'
        title: 资本充足率、融资历程与投资尽调结论
        blocks:
          - type: paragraph
            body: >-
              作为受严格监管的健康险机构，Devoted Health 除需保障日常运营及研发资金外，还必须在其展业的每个州法律实体名下维持数额庞大的基于风险法定资本准备金。为满足监管资本红线并支撑跨州极速扩张，公司完成了
              3.66 亿美元的 Series F 股权融资，具体由 2025 年 11 月的 4800 万美元以及 2026 年 1 月完成的 3.17 亿美元 Series F-Prime
              构成。非公开老股市场与行业报告还记录了其紧随早期募资传闻之后、于 2026 年 9 月完成的 5.55 亿美元 Series G 轮融资，估值达到 250 亿美元里程碑。即便如此，由于经审计的 GAAP
              合并财务报表、法定口径医疗赔付率（MLR）以及净烧钱速度从未公开，机构投资方在出具出资承诺时，必须将核验多州储备金充足率与实际现金跑道列为关键前提。
