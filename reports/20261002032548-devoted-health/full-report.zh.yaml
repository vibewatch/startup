  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分群与支付方机制
        blocks:
          - type: paragraph
            body: >-
              Devoted Health 在 Medicare Advantage 医疗保险赛道中定位为科技赋能的“医保医办（Payvidor）”，将健康险计划运营与直接医疗服务交付融为一体 [CU001,
              CU002]。其核心客户群为全美 29 个业务州中年满 65 岁且符合 Medicare 资格的长者，业务版图自 2018 年在佛罗里达州率先启动的 8 个县大幅拓展而来 [CU002,
              CU003]。其客户关系呈现双层架构：Medicare 个人受益人是在集中开放投保期挑选 Devoted Health HMO 或 PPO
              计划的终端投保消费者；而联邦医疗保险和医疗补助服务中心（CMS）则是机构支付方，负责拨付保费基准金、风险调整费用以及质量奖励金 [CU001, CU004]。


              在这一客群内部，Devoted Health 对会员进行了分层：一类是追求全面附加权益的常规 Medicare Advantage 参保者；另一类则是通过 Devoted Medical
              线上糖尿病诊所等特色微诊所精准干预的高危慢病人群 [CU005, CU006]。其商业化产品以 $0 起步月保费为招牌，打包处方药保障，并提供牙科、视力、听力、健身以及非处方健康用品等附加津贴
              [CU005]。针对慢病群体，Devoted Medical 组建由资深执业医师、内分泌专家及认证糖尿病管理专员构成的多学科团队，开展密集的线上与入户干预，力求遏制代价高昂的突发住院
              [CU006]。这类权益的经济可持续性高度依赖维系卓越的 CMS Star Ratings，藉此获取必要的返款奖励金，在不引发灾难性医疗赔付率的前提下支撑零美元保费计划的运转 [CU004]。
            claimRefs:
