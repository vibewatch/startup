      - number: '7.4'
        title: 财务模型、资本密集度与合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Devoted Health 处于资本高度密集的保险赛道，前期的承保亏损、法定准备金要求以及扩张资本需求，迫使其频频依赖外部股权融资 [CR004, CR014]。公司分两期完成了 $366m 的 Series
              F 股权融资——2025 年 11 月完成 $48m，2026 年 1 月由 The Space Between（TSB）联手 Centricus 领投完成 $317m Series
              F-Prime——将其非公开投后估值推高至 $12.6b–$12.9b [CR004, CR009, CR014]。据媒体与老股交易市场报告，各方曾探讨过最高达 $25b 的 Pre-IPO 估值，但经审计的合并
              GAAP 财务报表仍未公开，其实际医疗赔付率（MLR）与真实烧钱速度仍无法确认 [CR009, CR014, CR015]。


              其核心外部依赖包括签约合作医院网络、药品福利管理（PBM）网络、再保险交易对手以及专业投资财团 [CR004, CR006]。对 The Space Between 和 Centricus
              等领投方的重度依赖蕴含着融资隐患：一旦后期私募市场转冷或公开 IPO 窗口迟迟未能开启，公司将面临严峻的资金链承压 [CR004, CR015]。
