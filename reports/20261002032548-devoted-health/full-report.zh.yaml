      - number: '6.2'
        title: 用户增长轨迹与会员规模
        blocks:
          - type: paragraph
            body: >-
              Devoted Health 的用户增长轨迹展现出在 Medicare Advantage 赛道内的超常规扩张势头。截至 2026 年 1 月，公司公布其在 29 个展业州服务的 Medicare
              Advantage 参保会员已超 466,000 人，实现了 121% 的同比增长 [CU003]。该扩张建立在自 2018
              年进军佛罗里达州中南部首批展业县以来的稳步扩张之上，并得到了多笔重大成长期融资的支撑，包括在 2025 年 11 月至 2026 年 1 月期间分两期完成的 $366m Series F 轮股权融资（约 3.66
              亿美元） [CU002, CU007]。在其官方公开渠道上，Devoted Health 重点宣传其医保计划及医疗服务已累计覆盖逾 50 万人，并援引调研数据称会员信任度达 92%，同行推荐率达 94%
              [CU008]。


              然而，这轮会员扩张同时遭遇严峻的监管与宏观经济逆风。尽管 Devoted Health 取得了极高的质量评定——2026 年将 95% 的在保会员纳入 4 星及以上 CMS 合约，并斩获多个 5
              星合约，全美平均星级高居第四位——但这一高增长曲线掩盖了持续存在的实质性信息盲区
              [CU004]。作为一家非上市公司，其各县域的具体参保分布、单一计划层级的医疗赔付率（MLR）以及开放投保窗口期之外的净会员流失率均未公开披露
              [CU009]。评估其会员基本盘的持久性，不仅要看年度投保期的总新增规模，更需全面衡量主动退保率以及新开拓区域市场内的临床服务黏性 [CU004, CU009]。
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
              - CU008
              - CU009
