      - number: '8.2'
        title: 融资历程、股权结构表与估值透视
        blocks:
          - type: paragraph
            body: >-
              Devoted Health 历经多轮密集股权融资。据 Tracxn 记录，公司通过 9 轮融资累计吸收 $2.62b；而二级市场申报材料显示其全历史融资总额达 $3.19b。公司此前完成了 $287m
              Series E 轮融资（包含 2023 年 12 月的 $175m 及 2024 年内以每股 $56.25 交割的 $112m）；随后推进总额 $366m 的 Series F 融资，分两笔交割：2025 年
              11 月以每股 $56.25 完成 $48.4m Series F 轮（投后估值 $13.27b），2026 年 1 月以每股 $67.50 完成 $317.2m Series F-Prime 轮（投后估值
              $16.27b），由 Centricus 与 The Space Between (TSB) 联合领投，Morgan Health 及 Google Ventures 参投。


              Forge Global 梳理的监管申报文件显示，公司在 2026 年 9 月递交 Series G 轮融资申报，拟融资 $555m，每股发行价 $103.69，投后估值定在 $25b，发行在外股数
              5,352,480 股，附带 1.0x 非参与型清算优先权（Non-Participating Senior Liquidation Preference）与 6.0% 非累积股息率。与此同时，Nasdaq
              Private Market 估价显示 2026 年 9 月 11 日 NPM 每股价格为 $64.67
              美元，折射出二级市场估价与顶层优先股一级发行价之间的明显脱节。这种多层级优先清算结构意味着，一旦最终上市或并购估值低于 $25b
              这一标杆线，早期普通股持有者与后期二级市场买家将承受沉重的优先权挤压（Preference Overhang）。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
