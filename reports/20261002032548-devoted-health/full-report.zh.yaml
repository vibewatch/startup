  - id: FE001
    title: 证据支撑的产品运营体系架构
    type: stack
    summary: 六层环环相扣的服务与技术架构，依已核实证据界定，而非凭空推测的生产拓扑。
    data:
      layers:
        - label: 会员触达
          detail: 涵盖公开网站、门户系统、纸质材料与保险方案沟通；多端设计来自公司公开招聘材料证据。
