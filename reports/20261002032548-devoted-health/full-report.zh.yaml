  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与评级建议
        blocks:
          - type: paragraph
            body: >-
              Devoted Health 在 Medicare Advantage 领域切出差异化诊疗交付模式，把自研 Orinoco 平台、自有线上优先医疗集团（Devoted Medical）与专属会员向导 Guides
              深度整合，业务覆盖 29 个州。据 2026 年 8 月报道，Devoted Health 正洽谈新一轮融资，投后估值或达 $25 billion；此前公司刚在 2026 年 1 月完成 Series
              F-Prime 轮，投后估值定格在 $16.27 billion。这一估值爬升印证了业务快速扩张：截至 2026 年 1 月，Devoted 会员规模扩至 466,000 人，实现 121%
              同比增长，展业网络铺开至 29 个州。诊疗质量依然领跑行业：2026 年 95% 会员落入 4 星及以上计划，多份统包合同评达 5 星，顺利锁定关键的 CMS 质量奖金（Quality Bonus
              Payments）。


              然而，估值看空逻辑根植于公开市场倍数严重脱节以及治理透明度缺失。按 $25 billion 估值计，Devoted 对应过去 12 个月收入运行率约 7.5x、单会员估值 $53,600；而公开市场
              Medicare Advantage 可比同行 Alignment Healthcare (ALHC) 与 Clover Health (CLOV) 的 EV/Revenue 仅为
              1.1x–1.2x、单会员估值仅 $16,000–$21,000。截至 2026 年 9 月 11 日，Nasdaq Private Market (NPM) 二级市场撮合价为每股 $64.67（自 2024 年
              9 月以来上涨 14.39%），折射出一级市场资金持续关注，但撮合流动性相当有限。此外，公司历经多轮融资累计吸纳 $2.62B 至 $3.19B，清算优先权层层堆叠，却从未披露合并 GAAP
              营业利润与医疗赔付率（MLR）。基于偏紧绷的估值立场与高风险画像，我们给出「持续跟踪」建议；在重金入场前，必须等待审计财务凭据兑现以及行业倍数理性回归。
