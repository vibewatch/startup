  - id: TV004
    title: 乐观、基准与悲观情景测算
    columns:
      - 情景
      - 概率
      - 经营假设
      - 目标倍数
      - 隐含估值
      - 下行 / 逻辑破坏触发动因
    rows:
      - - 乐观情景
        - 25%
        - 会员数达到 700k+；MLR 降至 84% 以下；Star Ratings 保持 4.5+ 平均评级
        - 6.0x EV / Revenue 倍数
        - $28B - $32B
        - CMS 费率下调或严重流感季推高理赔成本
      - - 基准情景
        - 50%
        - 会员数达到 550k；MLR 稳定在 86-88%；逐步实现运营盈亏平衡
        - 4.0x EV / Revenue 倍数
        - $18B - $22B
        - V28 风险调整费率削减与区域医疗机构合同纠纷
      - - 悲观情景
        - 25%
        - 增长放缓至 15% 以下；MLR 超过 90%；持续烧钱迫使接受降估值融资
        - 2.0x EV / Revenue 倍数
        - $10B - $14B
        - Star Rating 评级降至 4.0 星以下，失去质量奖励金
    notes: 前瞻情景结合 Medicare Advantage 政策周期与单体经济模型评估企业价值。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
