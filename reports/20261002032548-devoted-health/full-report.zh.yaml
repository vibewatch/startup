        - 核心营收支柱：构成 Devoted 在 29 个准入州 46.6 万会员的绝大部分来源。
      - - 特殊需求计划（C-SNP / D-SNP）
        - 针对慢病管理及 Medicaid 费用分摊整合上浮的风险调整人头拨付。
        - 标准非临床类健康计划，以及未经统筹按项目付费的州级 Medicaid 理赔（claims）。
        - 付费方：CMS 与各州 Medicaid 管理机构；购买方：符合纳保条件的低收入及双重资格老人。
        - 高增长利润抓手：C-SNP PLUS 产品线将目标市场拓展至高病情复杂度的老人客群。
      - - 自建线上与上门基础医疗
        - 临床医生薪资、线上诊疗基础设施、上门诊断护理及预防性健康随访。
        - 独立第三方按项目付费的诊所账单，以及外部医疗系统的医院端营收。
        - 由医保计划人头费结余与医疗赔付支出预算在内部划拨支持。
        - 控费核心引擎：Devoted Medical 团队主导预防干预，降低住院率以优化医疗赔付率（MLR）。
      - - 医疗操作系统与 AI 平台（Orinoco）
        - 自研软件开发、EHR 电子病历整合、自动识别诊疗缺口以及会员向导调度系统。
        - 面向第三方的企业级 SaaS 商业化变现与外部供应商软件许可费。
        - 作为行政管理技术投资及日常运营开支在内部出资。
        - 规模化底座：支撑多州跨区展业，避免行政后台人员随规模同比例膨胀。
    notes: 市场范围依据 CMS Title XVIII 联邦医保法规界定。Devoted Health 作为持牌 Medicare Advantage 机构展业，收取政府人头统筹拨款，而非商业健康险保费。
