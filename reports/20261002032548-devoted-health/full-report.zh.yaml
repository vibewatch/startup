  - id: FV001
    title: 投资建议决策链
    type: flow
    summary: 从规模与技术质量延伸至倍数分化及「观察」建议的逻辑链条。
    data:
      nodes:
        - id: scale
          label: 运营规模：466k 会员（同比 +121%），覆盖 29 个州
        - id: quality
          label: 临床验证：Orinoco AI 平台赋能，95% 参保 4+ 星级计划
        - id: pricing
          label: 估值参照：$25B Series G（$103.69/股）对比 $64.67 NPM 老股交易
        - id: peers
          label: 同行对比：较上市 MA 可比公司 ALHC/CLOV 享有 5-7x EV/Rev 溢价
        - id: overhang
          label: 下行风险：未披露 GAAP 净利润及 $2.6B+ 优先清算包袱
        - id: verdict
          label: 决策建议：维持「观察」建议，估值立场偏高
      edges:
        - from: scale
          to: quality
        - from: quality
          to: pricing
        - from: pricing
          to: peers
        - from: peers
          to: overhang
        - from: overhang
          to: verdict
    approximationNotes: 综合规模、技术、估值指标与风险要素的序列逻辑架构。
