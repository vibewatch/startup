            body: >-
              Medicare Advantage 获客具有强烈的季节性与渠道依赖度，秋季年度投保期（AEP）主要依靠独立保险经纪人、一线地推代理机构及数字营销驱动。截至 2026 年 1 月，Devoted Health
              已在 29 个州积累了超过 466,000 名参保受益人；据报道，在既有业务版图基础上实现了 121% 的参保人数同比增速，其宣传口径更声称服务人数已达 50
              万人。要将新增参保会员转化为可持续的毛利率，关键在于依托自研 Orinoco 技术平台与专属会员服务专员 Guides 开展主动临床干预。Devoted Health
              力求及早筛查慢性病并组织入户巡诊，以此压降急诊就诊率与可预防性住院率，在固定人头费收入的边界下直接守住承保利润率。
