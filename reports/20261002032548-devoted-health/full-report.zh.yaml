      - number: '8.3'
        title: 公开市场对标、情景推演与尽调清单
        blocks:
          - type: paragraph
            body: >-
              对照公开市场管理型医疗对标标的，Devoted Health 呈现出极其尖锐的估值分化。上市 Medicare Advantage 保险科技公司 Alignment Healthcare 与 Clover
              Health 的企业价值倍数仅为 1.1x 至 1.2x EV/Revenue，单名在保会员估值约 $16,000 至 $21,000。将该公开估值锚点套用于 Devoted Health 的 466,000
              名在保会员，对应隐含企业价值仅 $7.5B 至 $9.8B，较 Series G 轮 $25 billion 估值折价 60% 至 70%。一级市场估值内含 5x 至 7x 溢价，其隐含假设是：Orinoco
              软件调度能力与领先的 CMS 星级评定（Star Ratings）能够打破传统医保局限，在承保利润率与临床控费上形成结构性优势。


              为评估投资回报，我们构建了三套未来经营情景。乐观情景（Bull Case）假设年会员增速持续保持在 40%+，医疗赔付率（MLR）压降至 84% 以下，最终以 $28B 至 $32B 公开 IPO 上市（约
              6.0x 远期营收）。基准情景（Base Case）预计增速放缓至 20%–25%，在持续消化 CMS V28 风险调整模型压力的同时 MLR 稳定在 86%–88%，最终以 $18B 至 $22B
              实现流动性退出（约 4.0x 营收）。悲观情景（Bear Case）预演了 CMS 费率压降、老年群体医疗需求激增及星级评定下滑，迫使公司以 $10B 至 $14B 进行降估值重组或战略出售（约 2.0x
              营收），因清算优先权偿付顺序引发底层严重稀释。投资决策前，核心尽调必须覆盖审计后 GAAP 合并财务报表、分区域计划级 MLR 以及 Series G 轮后股权结构表的清算瀑布偿付顺位。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
