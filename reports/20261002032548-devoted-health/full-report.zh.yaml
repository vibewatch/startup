      - number: '7.2'
        title: 监管、法律与 CMS 合约风险
        blocks:
          - type: paragraph
            body: >-
              Devoted Health 最核心的法律与监管掣肘，在于其直接依赖同联邦医疗保险和医疗补助服务中心（CMS）签署的年度合约，以及同各州针对双重资格特殊需求计划（D-SNPs）签署的 Medicaid 协议
              [CR006, CR007]。正如 DEVOTED C-SNP 007 NM (HMO C-SNP) 等保险责任范围（Evidence of Coverage）官方备案文件所示，其参保资格受制于同 CMS
              的年度合约续签，且福利待遇、自付费用分摊及医疗网络每年均须经受监管审批与动态调整 [CR006, CR007]。此外，特殊需求计划还要求针对糖尿病与心血管疾病等特定慢性病实施专业的临床管理并保留严密病历记录
              [CR011]。


              除基础合约续签外，Medicare 风险调整模型的变动——例如 CMS 第 28 版风险调整模型（V28）的分步落地——在临床病历归档无法同步跟进时，将直接侵蚀收入获取能力 [CR005]。更有甚者，Star
              Ratings 评定表现属于关键财务敏感项，因为质量奖励金极大程度地倒贴了驱动会员获客与留存的高额附加福利
              [CR002]。一旦合约评级下调或遭遇不利的监管审计，营业利润率将被迅速压缩，进而被迫收紧特定展业区域的福利丰厚度 [CR005, CR011]。
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR007
              - CR011
      - number: '7.3'
        title: 运营可靠性、临床质量与人才团队扩张
        blocks:
          - type: paragraph
            body: >-
              Devoted Health 的服务模式将自研 Orinoco 技术平台与人在回路的会员 Guides 专员及 Devoted Medical 医护人员深度融合 [CR001, CR002]。随着业务版图从 13
              个州迅速扩张至 29 个州，要维系极高的会员信任度（据报道达 92%）与 94% 的推荐率，必须伴随高强度的人力团队扩张 [CR001, CR012]。公司在马萨诸塞州 Waltham、缅因州 New
              Gloucester、佛罗里达州 Pembroke Pines 以及明尼苏达州 Eagan 设有分散的行政、理赔与临床分支中心，并称在全美范围内雇佣了规模庞大的远程办公团队 [CR009, CR010]。


              这一复杂的运营网络使得人力资源与员工关系落地变得至关重要 [CR010]。公司建立了正式机制，以处理跨多州司法管辖区的申诉维权、纪律处分及法规遵从 [CR010]。潜在故障模式包括：一线 Guides
              专员职业倦怠、临床医护人才短缺，以及对话式 AI 或平台录入工具的技术摩擦导致老年人产生抵触情绪——在 65 岁以上老人中，日常使用互联网的比例不足 60% [CR002, CR013]。
