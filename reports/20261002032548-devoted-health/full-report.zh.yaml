      - number: '4.3'
        title: 成本结构、单元经济学与运营承压
        blocks:
          - type: paragraph
            body: >-
              全风险医保医办（Payvidor）机构的核心成本项是医疗理赔支出，行业普遍占保费收入的 80 至 88%。Devoted Health 采取一体化临床模式，将外部签约社区医生与自营 Devoted Medical
              团队相结合，调配线上诊疗、流动巡诊车以及全职临床病历审核员和服务专员，集中管理复杂慢病人群。然而，公司在 2025
              年遭遇显著运营阻滞：据报道称其遭遇营收停滞，并在调整福利与定价的同时裁员缩编。这些逆风反映了全行业面临的系统性压力——包括 CMS 风险调整模型全面转向
              V28，以及长者群体医疗就诊率全面抬头；这也证明在竞争激烈的区域市场中，单靠高星级评定不足以消除承保端的业绩波动。
            claimRefs:
