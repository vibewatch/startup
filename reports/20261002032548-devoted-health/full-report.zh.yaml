      - number: '3.4'
        title: 论点展项
        blocks:
          - type: callout
            title: 星级评定：结构性财务杠杆
            body: >-
              在 Medicare Advantage 体系中，临床诊疗协同与会员体验是直接的财务抓手，而非单纯的品牌包装。由于 CMS 质量奖励金要求医保计划达到 4 星及以上才能获得全额基准返还款，Devoted
              Health 将 95% 的在保会员纳入 4 星及以上合约，据估计平均每位会员可带来 5%
              的收入奖励加成。该笔资金反哺了更丰厚的附加福利补贴，带来老牌巨头在星级下调困境中若不牺牲承保利润便无法复制的自我强化获客正循环。
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
              - CP010
          - type: callout
            title: 分销渠道把守与巨头规模壁垒
            body: >-
              尽管拥有技术层面的相对优势，Devoted Health 驱动年度参保时依然高度受制于独立经纪人与 FMO 分销网络。老牌巨头凭借更广泛的全国版图打包方案与商业险捆绑设计，牢牢绑定了渠道忠诚度。一旦 CMS
              进一步限制经纪人佣金标准或压低附加福利营销空间，Devoted 高速获客的步伐恐将遭遇严重阻力。
            calloutType: risk
            claimRefs:
              - CP002
              - CP011
              - CP014
              - CP015
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、产品定价与 CMS 变现机制
        blocks:
          - type: paragraph
            body: >-
              Devoted Health 的全部商业收入几乎均来自 Medicare Advantage 项目，其核心支付方是联邦政府而非参保老人个人。其产品以零美元
              起步的月度个人保费为特色，叠加牙科、视力、听力及非处方药补贴等全面附加权益，旨在每年的投保季强力拉动参保量。变现逻辑底层依托于联邦医疗保险和医疗补助服务中心（CMS）的人头付费模型，该模型设定县级基准费率并根据参保会员的个体风险评分进行动态调整。最关键的是，Devoted
              Health 的财务表现与 CMS Star Ratings 深度绑定：评级达 4 星及以上的合约可斩获联邦质量奖励金并提高补贴返款比例，以资助超额福利。2026 年，Devoted Health 有百分之九十五
              的在保会员隶属于此类高评级合约。
            claimRefs:
              - CI001
              - CI005
