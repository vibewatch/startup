      - number: '8.4'
        title: 核心展图
        blocks:
          - type: callout
            title: 投资建议立场：估值溢价收敛前保持跟踪
            body: >-
              尽管 Devoted Health 展现出领先行业的会员增速（同比 +121%）与卓越的临床星级评定，但在 Medicare Advantage 行业利润率面临强监管挤压的背景下，其 $25b
              的一级市场估值对应着极其极端的估值倍数（7.5x EV/Rev）。在合并承保利润率及清算优先权瀑布明细尚未披露前，投资机构应维持跟踪立场。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
          - type: callout
            title: 估值风险：与公开标的严重背离及优先清算层叠
            body: >-
              公开市场 Medicare Advantage 保险科技公司的估值中枢约为 1.1x 至 1.2x EV/Revenue，单会员对应 $16,000 至 $21,000。在 $25 billion
              估值下，Devoted Health 单会员估值超过 $53,000。一旦一二级倍数向行业均值收敛，在累计 $3.19B 优先资本压顶下，次级优先股与普通股股东将承受沉重的清算优先权挤压。
            calloutType: risk
            claimRefs:
              - CV004
