  - id: FM001
    title: Devoted Health 市场规模分层结构
    type: pyramid
    summary: 同心圆目标市场分层，自全美 Medicare Advantage 总支出逐层向下穿透至 Devoted Health 2026 年实际运营收入。
    data:
      items:
        - label: 总可用市场（TAM）
          value: 450
          unit: $B
          detail: 全美 Medicare Advantage 品类年度总支出，覆盖超过 33M+ 老年群体。
        - label: 可服务市场（SAM）
          value: 200
          unit: $B
          detail: 预估 Devoted Health 现已展业的 29 个州内 Medicare Advantage 总体支出。
        - label: 特殊需求细分市场（C-SNP / D-SNP）
          value: 28
          unit: $B
          detail: 病情复杂的重症慢性病及双重资格客群，2026 年计划供给数量增长 42%。
        - label: 雇主团体退休市场（EGWP）
          value: 15
          unit: $B
          detail: 相邻的公共部门与市政退休人员团体豁免合同市场机遇。
        - label: 目标县老年医疗支出
          value: 8.5
          unit: $B
          detail: 佛罗里达、德克萨斯与俄亥俄等主力市场中的高密度核心展业县。
        - label: 可获取市场（SOM）
          value: 3.27
          unit: $B
          detail: 466,000 名参保会员实现的 2026 收入运行率，折合每位会员约 ~$13,400。
    approximationNotes: 数值参考 Sacra 行业估算与 CMS 公开基准。TAM 代表全美 MA 总支出；SAM 代表展业各州可触达支出；SOM 则反映年化会员收入。
