        - label: 临床交付
          detail: Devoted Medical 携手本地医疗机构，提供虚拟诊所与入户医疗服务。
        - label: 保险与服务网络
          detail: Medicare Advantage 保险方案与签约本地医疗机构构建起基础保障环境。
        - label: 运营协同
          detail: 自研技术体系驱动整体模型运转；第三方供应商分析点名 Orinoco 平台，并称其承担理赔、计费与病历管理功能。
        - label: 工程研发信号
          detail: 招聘与访谈信息提及设计系统、数据工程、系统集成、API、云架构与持久化存储，但无法证实实际部署情况。
