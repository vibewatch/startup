              Devoted Health 由 Todd Park 与 Ed Park 兄弟于 2017 年创立，总部位于马萨诸塞州 Waltham。公司由创始人亲自掌舵，定位于全风险自营型 Medicare
              Advantage 医疗健康企业，而非向健康险公司出售软件的 IT 厂商。其公开模式深度融合 Medicare Advantage HMO 与 PPO 计划、Devoted Medical
              临床医疗服务、自研技术平台以及专属服务专员 Guides。旗下保险经营实体直接同联邦 Medicare 签约，D-SNP 计划亦与各州 Medicaid
