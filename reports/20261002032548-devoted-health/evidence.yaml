evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, committee membership, director independence, succession planning, and a dated record of
      material leadership changes.
    whyItMatters: Founder concentration cannot be assessed against independent oversight or management depth without these records.
    diligencePath: >-
      Request the charter, current capitalization table, board and committee minutes, director biographies, and
      executive succession materials.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited consolidated revenue, medical-loss ratio, operating result, cash balance, debt, and monthly cash-use data
      for 2024 through 2026.
    whyItMatters: >-
      A reported accounting decline cannot establish the amount of revenue, profitability, cash burn, liquidity, or
      runway.
    diligencePath: >-
      Request audited consolidated financial statements, statutory entity reconciliations, debt schedules, and a monthly
      cash bridge from management.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: capitalization
    missingEvidence: >-
      Primary financing documents reconciling current valuation, cumulative primary capital, secondaries, debt, and the
      post-Series F-Prime preference stack.
    whyItMatters: Database figures conflict materially and cannot support ownership, dilution, liquidity, or valuation analysis.
    diligencePath: >-
      Reconcile signed stock-purchase documents, the fully diluted capitalization table, secondary ledgers, and cash
      receipts by financing date.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: membership-scale
    missingEvidence: Plan-level January 2025 and January 2026 enrollment counts that reconcile the stated 121% and 12% growth rates.
    whyItMatters: The discrepancy changes the interpretation of growth velocity and market traction by an order of magnitude.
    diligencePath: >-
      Compare CMS contract and plan enrollment extracts for identical plan populations and dates, then reconcile to
      management reporting.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: consolidated-gaap-revenue
    missingEvidence: >-
      Consolidated audited GAAP income statements and balance sheets breaking down premium revenues, medical claims
      expense, and net underwriting margin.
    whyItMatters: >-
      Without GAAP financial disclosures, revenue and MLR rely on third-party estimates (such as Sacra's $3.27B model)
      and state regulatory extractions that may omit parent overhead.
    diligencePath: >-
      Request audited financial statements or pre-IPO disclosure documents under non-disclosure agreement during formal
      investor diligence.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: minor
    topic: county-level-penetration
    missingEvidence: >-
      Granular county-level market share breakdowns comparing Devoted enrollment to local eligible Medicare
      beneficiaries across all 29 states.
    whyItMatters: >-
      While state-level licensing spans 29 states, actual provider network adequacy and enrollment may be heavily
      concentrated in select metropolitan areas (e.g., Florida and Texas).
    diligencePath: >-
      Extract CMS monthly county-level Medicare Advantage enrollment files and cross-tabulate contract numbers by county
      FIPS code.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: plan-level-medical-loss-ratios
    missingEvidence: >-
      Audited plan-level and county-level Medical Loss Ratio (MLR) and medical cost performance benchmarks comparing
      Devoted Health directly against regional Humana and UnitedHealthcare contracts.
    whyItMatters: >-
      Without granular county-level MLR reporting, it is impossible to evaluate whether Devoted's clinical care
      interventions produce sustainable underwriting margin expansion or rely on temporary star rating rebate subsidies.
    diligencePath: >-
      Review CMS annual contract-level Medical Loss Ratio public use files and state insurance department statutory
      filings for Devoted Health's state insurance underwriting subsidiaries.
    relatedQuestionRefs:
      - QP001
      - QP004
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited consolidated GAAP financial statements disclosing net premium revenue, medical loss ratio (MLR), operating
      income, and cash runway.
    whyItMatters: >-
      Without audited consolidated statements, underwriting cannot independently verify plan-level medical expense
      efficiency, statutory reserve adequacy, or true operating cash burn.
    diligencePath: >-
      Request audited consolidated financial statements, state statutory annual statements across all 29 states, and
      internal cash flow schedules under NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: security-and-ai-governance
    missingEvidence: >-
      Current SOC 2 or HITRUST reports, penetration-test summaries, security architecture, material incident history,
      privacy-impact assessments, and AI model-governance controls.
    whyItMatters: >-
      The product handles sensitive health, claims, and member-service data, while the assigned evidence only asserts
      HIPAA-aware interview scenarios and AI usage.
    diligencePath: >-
      Request certification reports, control matrices, incident and breach logs, subprocessor inventory, model cards,
      validation results, and board-level security reporting under NDA.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: reliability-and-roadmap
    missingEvidence: >-
      Production uptime, service-level objectives, recovery targets, deployment frequency, defect or escalation metrics,
      support commitments, and a dated product roadmap.
    whyItMatters: >-
      Stack names and hiring requirements do not show whether member, clinical, and claims workflows remain reliable or
      whether roadmap commitments are delivered.
    diligencePath: >-
      Review 24 months of status and incident records, SLO dashboards, change-failure and recovery metrics, support
      data, release notes, and the board-approved roadmap.
    relatedQuestionRefs:
      - QE010
  - type: private-evidence-only
    severity: material
    topic: plan-level-churn-and-mlr
    missingEvidence: >-
      Plan-level voluntary disenrollment rates, county-level enrollment concentration, and regional Medical Loss Ratios
      (MLRs) across all 29 active states.
    whyItMatters: >-
      High top-line member growth could mask elevated voluntary churn or unprofitable customer concentration in newly
      entered expansion states under CMS V28 payment models.
    diligencePath: >-
      Request CMS contract-level PBP disenrollment logs, statutory annual NAIC financial filings for each regulated
      insurance entity, and plan-level MLR reconciliations.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
      - TU003
  - type: private-evidence-only
    severity: material
    topic: consolidated-financial-transparency
    missingEvidence: >-
      Audited consolidated GAAP financial statements detailing full-year 2025 and 2026 medical loss ratio (MLR),
      operating margins, and statutory cash burn.
    whyItMatters: >-
      Without consolidated GAAP financials, underwriting profitability cannot be independently separated from parent
      entity cash burn and statutory reserve requirements.
    diligencePath: >-
      Obtain state-level NAIC statutory annual filings across all licensed insurance legal entities or request
      confidential audited financials under non-disclosure agreement.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: minor
    topic: enumeration-coverage-gap
    missingEvidence: >-
      Comprehensive listing of all active municipal, county, and state healthcare administrative permits and D-SNP
      contracts.
    whyItMatters: >-
      Partial enumeration in the regulatory risk register reflects public filings rather than an exhaustive audit of all
      29 state licenses.
    diligencePath: >-
      Cross-reference CMS contract directory and state insurance commissioner license registries for all 29 operating
      jurisdictions.
    relatedTableRefs:
      - TR001
