callouts:
  - calloutType: "risk"
    title: "Existential Payer Dependency on Annual CMS Program Rules"
    body: "Unlike traditional commercial insurers with diversified employer-sponsored or individual lines, Devoted Health's revenue is near-exclusively derived from Medicare Advantage capitation. Annual contract renewals, V28 risk adjustment revisions, and Star Ratings bonus policies represent structural vulnerabilities where regulatory policy shifts directly dictate margin viability."
    claimRefs:
      - "CR002"
      - "CR005"
      - "CR006"
      - "CR007"
  - calloutType: "insight"
    title: "Capital Intensity and Solvency Cushion Realities"
    body: "Scaling to 466,000+ members across 29 states demands substantial statutory reserves and operating liquidity. The completion of the $366M Series F/F-Prime rounds in early 2026 provided immediate runway, but absent audited GAAP profitability, Devoted remains reliant on receptive private growth capital or an eventual public offering."
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR009"
      - "CR014"
