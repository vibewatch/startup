      - ["Proprietary coordination technology", "Guides, clinicians, and payer operations", "Company confirms proprietary technology; a vendor analysis names Orinoco and describes its scope", "Claimed connective layer across payer, provider, service, and clinical workflows", "No primary architecture, deployment, uptime, control, or benchmark documentation in the assigned pool"]
      - ["Digital and print experience system", "Members aged 65+, prospects, and internal content teams", "A company-issued contract role described an active redesign and implementation program", "Cross-surface design tokens and accessibility requirements tailored to older adults", "Job requirements do not prove current WCAG conformance or completed rollout"]
    notes: "Status and differentiation reflect company descriptions, company-issued hiring material, or named third-party reports; null operating metrics remain diligence gaps rather than estimates."
