  - id: "TE002"
    title: "Member and operating workflow use cases"
    columns: ["User job", "Current workflow evidenced", "Devoted solution", "Measurable benefit", "Limitation"]
    rows:
      - ["Understand benefits and find care", "Member contacts a Guide for questions and provider navigation", "Human Member Service Guides included with the plan", "No independently measured navigation outcome in the assigned pool", "Response time, resolution rate, channel mix, and escalation data are unavailable"]
      - ["Coordinate complex care", "Local-provider care supplemented by virtual and in-home services", "Devoted Medical programs plus technology-powered care coordination", "Company reported a 2.3 average HbA1c reduction over 113 days for participating members", "Population, sample size, and independent validation are not supplied on the cited page"]
      - ["Manage hypertension", "Clinical teams engage members through specialized programs", "Devoted Medical care-team intervention", "Company reported a 15 mmHg average systolic reduction over 40 days", "Selection criteria, comparator, persistence, and program-wide coverage are undisclosed"]
      - ["Operate claims and personalized recommendations", "Third-party interview prompts reference claims, records, member profiles, and real-time updates", "A vendor analysis attributes claims, billing, records, and integration functions to Orinoco", "No verified latency, automation, accuracy, or cost metric is public in the assigned evidence", "Interview prompts and vendor analysis are not production documentation"]
    notes: "Benefits are retained only with their stated company attribution, metric name, and period; third-party prompts are treated as directional signals, not proof of live architecture."
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE011, CE012]
  - id: "TE003"
    title: "Technology and operating architecture evidence"
    columns: ["Layer / process", "Role", "Evidence-backed dependency", "Primary risk"]
    rows:
      - ["Experience surfaces", "Public website, member portal, and print communications", "Company hiring material specifies Prismic for the website and React/Storybook for the portal", "The material describes desired implementation, not completion or production reliability"]
      - ["Service and API patterns", "Connect applications and operational services", "TechPrep reports Go, gRPC, GraphQL, and REST interview emphasis", "No primary repository, API documentation, versioning policy, or dependency inventory"]
      - ["Data and payer operations", "Support claims, billing, records, and member context", "Jobmentis prompts mention claims, EMR, and profiles; Perspective attributes integration to Orinoco", "Neither source verifies deployed topology, data lineage, controls, or model performance"]
      - ["Cloud and persistence", "Host services and maintain operational data", "TechPrep reports AWS and PostgreSQL as interview-stack topics", "Interview-prep reporting is insufficient to establish production vendors, resilience, or concentration"]
    notes: "Architecture entries are evidence-strength labels: official hiring requirements and third-party practitioner or vendor signals, not an audited production-system inventory."
    claimRefs: [CE006, CE008, CE009, CE010, CE011, CE012, CE013]
figures:
  - id: "FE001"
    title: "Evidence-backed product operating stack"
    type: "stack"
    summary: "Six linked service and technology layers, labeled by what the assigned evidence supports rather than by an inferred production topology."
    data:
      layers:
        - label: "Member access"
          detail: "Public website, portal, print, and plan communications; multi-surface design work is company-issued hiring evidence."
        - label: "Human navigation"
          detail: "Member Service Guides help members find care and answer plan questions."
        - label: "Clinical delivery"
          detail: "Devoted Medical provides virtual and in-home care alongside local providers."
        - label: "Insurance and network"
          detail: "Medicare Advantage plans and contracted local providers define the covered-care environment."
        - label: "Operational coordination"
          detail: "Proprietary technology coordinates the model; a vendor analysis names Orinoco and attributes claims, billing, and record functions to it."
        - label: "Engineering signals"
          detail: "Hiring and interview sources reference design systems, data engineering, integrations, APIs, cloud, and persistence, without proving deployment."
    approximationNotes: "The layer order is an analytical view of supported responsibilities, not a disclosed deployment diagram or assertion of data-flow direction."
    claimRefs: [CE001, CE002, CE003, CE006, CE012, CE014]
callouts:
  - calloutType: "strength"
    title: "The product advantage is operational integration"
    body: "The evidence supports a product that combines plan benefits, human navigation, local providers, and Devoted Medical rather than asking members to coordinate separate services alone."
    claimRefs: [CE001, CE002, CE003]
  - calloutType: "risk"
    title: "Technical diligence cannot stop at stack-name signals"
    body: "Interview and vendor sources suggest a modern data and service platform, but they do not establish production topology, security controls, uptime, AI governance, or roadmap delivery."
    claimRefs: [CE009, CE010, CE011, CE012, CE013]
