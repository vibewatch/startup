company:
  name: Devoted Health
chapter:
  number: 4
  title: Financials
  summary: Devoted Health operates as a Medicare Advantage payvidor monetizing primarily through CMS capitation premiums and quality bonus payments across 466,000 members in 29 states. While the company secured $366 million in Series F/F-Prime equity capital in late 2025 and early 2026 and was linked to a $25 billion valuation milestone in late 2026, 2025 revenue dips and selective layoffs reflect margin pressures from evolving Medicare Advantage risk adjustments. In the absence of public consolidated audited GAAP statements and medical loss ratios, financial underwriting requires direct verification of statutory filings and plan-level medical expense performance.
sections:
  - id: revenue-streams-and-pricing
    title: Revenue Model, Pricing, and CMS Monetization
    body: 'Devoted Health generates virtually all its commercial revenue through the Medicare Advantage program, where the primary payer is the federal government rather than individual seniors. Plans feature monthly member-facing premiums starting at zero dollars, accompanied by comprehensive supplemental benefits such as dental, vision, hearing, and over-the-counter allowances designed to attract enrollments during annual election periods. Monetization relies fundamentally on the Centers for Medicare and Medicaid Services (CMS) capitation payment formula, which establishes county-level benchmark rates adjusted for member risk scores. Crucially, Devoted Health''s financial performance is tied to CMS Star Ratings: contracts earning four or more stars receive federal quality bonus payments and elevated rebate percentages that subsidize extra benefits, with ninety-five percent of Devoted Health''s members enrolled in high-rated contracts for 2026.'
    claimRefs:
      - CI001
      - CI005
    tableRefs:
      - TI001
  - id: gtm-and-conversion-flow
    title: Sales Efficiency, Growth, and Monetization Flow
    body: Customer acquisition in Medicare Advantage is heavily seasonal and channel-dependent, dominated by independent insurance brokers, field agencies, and digital marketing during the fall Annual Election Period. Devoted Health scaled its enrolled member base to over 466,000 beneficiaries across 29 states as of January 2026, representing a reported 121 percent year-over-year enrollment increase from its prior footprint, alongside promotional claims of serving half a million individuals. Converting enrolled members into sustainable gross margin requires proactive clinical engagement through the proprietary Orinoco technology platform and dedicated Member Service Guides. By detecting chronic conditions early and coordinating in-home visits, Devoted Health aims to curtail emergency room visits and preventable hospitalizations, directly protecting underwriting margin under fixed capitation revenues.
    claimRefs:
      - CI003
      - CI004
      - CI012
      - CI013
    figureRefs:
      - FI001
  - id: cost-structure-and-margin-pressures
    title: Cost Structure, Unit Economics, and Operational Pressures
    body: The core cost driver for any Medicare Advantage payvidor is medical claims expense, typically representing 80 to 88 percent of premium revenue across the industry. Devoted Health operates an integrated clinical model pairing contracted community clinicians with its owned Devoted Medical group, deploying virtual care, mobile clinics, and full-time clinical auditors and service guides to manage complex patient cohorts. However, the organization encountered notable operational friction in 2025, experiencing reported revenue stagnation and executing workforce layoffs alongside benefit and pricing adjustments. These headwinds reflect category-wide pressures from CMS risk-model revisions (the V28 phase-in) and elevated healthcare utilization among seniors, demonstrating that high star ratings alone do not eliminate underwriting volatility in competitive geographic markets.
    claimRefs:
      - CI002
      - CI006
      - CI007
      - CI014
    tableRefs:
      - TI002
  - id: capital-adequacy-and-underwriting-verdict
    title: Capital Adequacy, Financing Milestones, and Underwriting Verdict
    body: As a regulated health plan, Devoted Health must maintain substantial risk-based statutory capital reserves across each licensed state legal entity in addition to funding administrative operations and technological development. To satisfy these capital requirements and support rapid multi-state expansion, the company completed a $366 million Series F equity financing, structured as $48 million in November 2025 and $317 million in Series F-Prime in January 2026. Private secondary markets and industry reports further recorded a September 2026 Series G financing of $555 million at a $25 billion valuation milestone, following earlier reports of fundraising targets. Nonetheless, because consolidated audited GAAP financial statements, statutory medical loss ratios, and net cash burn remain undisclosed, institutional underwriters must condition commitments on verifying multi-state reserve adequacy and cash runway.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
    tableRefs:
      - TI003
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Revenue Stream
      - Mechanism
      - Unit Metric
      - Current Value / Status
      - Revenue Quality
      - Diligence Ask
    rows:
      - - CMS Capitation Premiums
        - Monthly risk-adjusted CMS payment per enrolled beneficiary
        - Per member per month (PMPM)
        - Primary revenue driver; over 466,000 members
        - High predictable cash flow but exposed to V28 risk model adjustments
        - Inspect county-level risk score distribution and historical CMS payment reconciliations
      - - CMS Quality Bonus Payments
        - Rebate bonuses tied to 4+ Star contract performance
        - Percentage rebate bonus PMPM
        - 95% of members in 4+ star plans (2026)
        - High margin contribution; vulnerable to CMS cut point methodology shifts
        - Review historical Star Rating measure scores and CAHPS member experience survey trends
      - - Supplemental Benefit Buy-Ups
        - Member-paid optional rider premiums
        - Monthly fee per electing enrollee
        - Limited share; base plans start at $0 premium
        - Low margin contribution; consumer price sensitive
        - Request enrollment mix and margin breakdown for optional benefit riders
      - - Value-Based Provider Incentives
        - Shared savings or surplus distributions from Devoted Medical care delivery
        - Per attributed patient surplus
        - Internal care management integration
        - Directly offsets medical expenses; unaudited
        - Inspect internal transfer pricing between health plan and Devoted Medical group
    notes: Revenue streams are derived from Medicare Advantage regulatory mechanics and company disclosures; exact dollar contributions are private and unaudited.
    claimRefs:
      - CI001
      - CI003
      - CI005
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product Line
      - Price / Unit / Contract
      - List Pricing
      - Realized Pricing
      - Discounts / Unknowns
      - Source
    rows:
      - - Standard MA HMO Plans
        - $0 monthly premium to member
        - $0 premium list price
        - Government-funded via CMS benchmark bidding
        - Supplemental allowances vary by county
        - Devoted Health website
      - - Enhanced MA PPO Plans
        - $0 to low monthly premium
        - $0 list base premium
        - CMS capitation minus plan rebate allocation
        - Network cost-sharing differentials undisclosed
        - Devoted Health website
      - - Dental, Vision & OTC Allowances
        - Embedded allowance per quarter
        - Included benefit allowances
        - Funded through CMS rebate dollars
        - Realized utilization and breakage rates private
        - Devoted Health website
      - - Prescription Drug Coverage (Part D)
        - Formulary-tiered copays
        - Standard Medicare Part D tiers
        - Direct CMS subsidy and manufacturer rebates
        - Manufacturer rebate pass-through percentage unknown
        - Devoted Health website
    notes: Official plan pricing represents member-facing list premiums; realized net revenue per member is governed by CMS benchmark bids and risk adjustment.
    claimRefs:
      - CI001
      - CI005
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Reported / Estimated Value
      - Confidence
      - Strategic Diligence Significance
      - Diligence Ask
    rows:
      - - Medical Loss Ratio (MLR)
        - null
        - Low
        - Core determinant of underwriting profitability and CMS 85% minimum rebate compliance
        - Request audited statutory MLR by contract and operating legal entity for 2024-2026
      - - Medical Care PMPM
        - null
        - Low
        - Measures effectiveness of Orinoco and Devoted Medical in containing acute utilization
        - Examine gross medical claims paid per member per month across primary geographies
      - - Sales & Marketing CAC
        - null
        - Low
        - Indicates sales efficiency across broker commissions versus direct acquisition
        - Request fully loaded CAC by acquisition channel and broker commission schedule
      - - Member Retention / Churn
        - 94% recommend rate reported
        - Medium
        - High retention amortizes acquisition costs over multi-year member lifetime
        - Obtain annual voluntary and involuntary disenrollment rates by plan and state
    notes: Private insurer metrics with null values reflect undisclosed proprietary data; external diligence requires access to statutory state filings or data room disclosures.
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI014
