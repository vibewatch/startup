callouts:
  - calloutType: risk
    title: Revenue Volatility and Medicare Advantage Headwinds
    body: Reports of revenue stagnation and workforce restructuring in 2025 underscore that Devoted Health faces margin compression from CMS risk adjustment changes (V28) and rising utilization, necessitating strict underwriting scrutiny.
    claimRefs:
      - CI006
      - CI007
  - calloutType: insight
    title: Quality Bonus Dependency in Unit Economics
    body: With 95% of members enrolled in 4-star-or-better plans, Devoted Health depends heavily on federal quality bonus payments to subsidize richer benefits, making annual Star Rating methodology changes a key financial vulnerability.
    claimRefs:
      - CI005
      - CI001
