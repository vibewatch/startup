    title: "No defensible current valuation or total-raised figure"
    body: "The assigned third-party profiles disagree on both total funding and valuation, and one profile is internally inconsistent about valuation timing. These quantities should remain null in cover materials until reconciled to financing documents and the capitalization table."
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"
  - calloutType: "insight"
    title: "Scale disclosures require denominator reconciliation"
    body: "The January 2026 member count and 29-state footprint are repeated, but the year-over-year growth rate differs by an order of magnitude across the company release and a recap. Plan-level CMS enrollment extracts are the appropriate reconciliation path."
    claimRefs:
      - "CO007"
      - "CO008"
