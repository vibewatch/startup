company:
  name: "Devoted Health"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Devoted Health is a founder-led, private Medicare Advantage company headquartered in Waltham, Massachusetts, with an integrated model spanning health plans, clinical services, technology, and member Guides. Its January 2026 financing and enrollment disclosures establish substantial scale, but assigned sources conflict on growth, valuation, total funding, and headcount, while audited consolidated financials and board composition remain unavailable."
sections:
  - id: "identity-and-model"
    title: "Identity and operating model"
    body: >-
      Devoted Health was founded in 2017 by brothers Todd and Ed Park and is
      headquartered in Waltham, Massachusetts. It is a private, founder-led
      healthcare company operating in Medicare Advantage rather than a software
      vendor selling to health plans. Its disclosed model combines Medicare
      Advantage HMO and PPO plans, Devoted Medical clinical services, a
      proprietary technology platform, and dedicated service Guides. The
      insurance entities contract with Medicare, and the D-SNP plans also
      contract with state Medicaid programs. This structure makes plan
      enrollment and contract renewal central operating dependencies, while the
      integrated clinical and service components are intended to influence care
      quality and member experience.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership, governance, and organizational dependence"
    body: >-
      The assigned evidence identifies Ed Park as co-founder and chief executive
      officer and Todd Park as co-founder and executive chairman. Keeping both
      founders in the two most senior disclosed operating and governance roles
      supports a key-person-dependence concern: strategic continuity, external
      relationships, and oversight remain visibly concentrated in the founding
      team. The evidence does not provide a current board roster, committee
      composition, succession plan, or a reliable history of material
      leadership changes. Company-selected careers testimonials consistently
      describe a fast-moving, mission-driven culture, but they are not
      independent evidence of retention, management depth, or employee
      sentiment. Governance and succession therefore require direct diligence.
    claimRefs:
      - "CO001"
      - "CO005"
      - "CO006"
      - "CO016"
    tableRefs:
      - "TO002"
  - id: "scale-and-operating-signals"
    title: "Scale and conflicting operating signals"
    body: >-
      Devoted announced more than 466,000 members across 29 states as of January
      2026 and described that level as 121% year-over-year growth. A StartUp
      Health recap reported the same member count, date, and state footprint but
      stated 12% growth, a material discrepancy that should be resolved against
      plan-level enrollment data. Current company pages later say more than half
      a million people are served, without a precise measurement date in the
      fetched text. Separately, Endpoints News reported that 2025 revenue and
      membership declined for the first time since plan launch, but its
      accessible excerpt does not disclose the revenue amount, membership
      denominator, or reconciliation to the January 2026 point-in-time claim.
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO015"
  - id: "capital-and-milestones"
    title: "Capital formation, valuation uncertainty, and milestones"
    body: >-
      The strongest financing evidence is the company's January 2026
      announcement of $366 million in equity funding across a $48 million
      Series F completed in November 2025 and a $317 million Series F-Prime
      completed in January 2026; the rounded tranches sum to $365 million, so the
      $366 million headline should not be silently recomputed. The round was led
      by The Space Between in partnership with Centricus and included a broad
      investor syndicate. No dependable current valuation or cumulative funding
      total can be established from the assigned evidence: one database reports
      $2.6 billion raised, while another reports $719.5 million and presents
      internally inconsistent valuation labels. These figures remain diligence
      gaps, not cover metrics.
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
