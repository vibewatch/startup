  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Payer Dynamics
        blocks:
          - type: paragraph
            body: >-
              Devoted Health operates in the Medicare Advantage healthcare insurance sector as a technology-enabled
              'payvidor', combining health plan sponsorship with direct clinical delivery [CU001, CU002]. Its core
              customer base consists of Medicare-eligible older Americans aged 65 and older across 29 operational
              states, having expanded substantially from an initial 8-county footprint in Florida launched in 2018
              [CU002, CU003]. The customer relationship exhibits a dual-layered structure: individual Medicare
              beneficiaries are the end-users and insured consumers who select Devoted Health HMO or PPO plans during
              open enrollment periods, while the Centers for Medicare & Medicaid Services (CMS) functions as the
              institutional payor financing premium benchmarks, risk-adjusted payments, and quality bonus payments
              [CU001, CU004].


              Within this demographic, Devoted Health segments members across standard commercial Medicare Advantage
              enrollees seeking comprehensive supplemental benefits and high-needs chronic cohorts targeted by
              specialized virtual micro-clinics, such as the Devoted Medical virtual diabetes clinic [CU005, CU006]. The
              commercial offering is anchored by $0 starting monthly premiums, integrated prescription drug coverage,
              and supplemental allowances for dental, vision, hearing, fitness, and over-the-counter health items
              [CU005]. For chronic disease populations, Devoted Medical deploys multidisciplinary teams consisting of
              advanced practice providers, endocrinologists, and certified diabetes care specialists to deliver
              intensive virtual and home-based interventions designed to prevent costly acute hospitalizations [CU006].
              The economic viability of these benefits depends directly on maintaining superior CMS Star Ratings, which
              fund the rebate bonuses required to sustain zero-dollar premium plans without incurring catastrophic
              medical loss ratios [CU004].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU006
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
