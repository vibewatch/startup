        title: Accessibility is visible; security, reliability, and roadmap proof is not
        blocks:
          - type: paragraph
            body: >-
              A company-issued job post explicitly required WCAG 2.1 AA+ design, larger default type, high contrast,
              simplified layouts, and clear hierarchy for a population aged 65 and older. That is a meaningful product
              requirement, but a hiring specification is not evidence that every live surface currently conforms.
              Careers content names data-engineering and EDI/integration roles, while a job aggregator displayed 57
              remote Devoted openings without exposing role-level evidence in the fetched text; together these are only
              weak organizational signals. The assigned successful pool does not establish SOC 2 or HITRUST status,
              penetration-test results, uptime or incident history, disaster-recovery objectives, model-governance
              controls, deployment cadence, support service levels, or a dated roadmap. Those omissions remain diligence
              gaps, and the adverse search record's lack of retained URLs must not be interpreted as proof that no
