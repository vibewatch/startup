    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Devoted Health was founded in 2017 by brothers Todd and Ed Park and is headquartered in Waltham,
              Massachusetts. It is a private, founder-led healthcare company operating in Medicare Advantage rather than
              a software vendor selling to health plans. Its disclosed model combines Medicare Advantage HMO and PPO
              plans, Devoted Medical clinical services, a proprietary technology platform, and dedicated service Guides.
              The insurance entities contract with Medicare, and the D-SNP plans also contract with state Medicaid
              programs. This structure makes plan enrollment and contract renewal central operating dependencies, while
              the integrated clinical and service components are intended to influence care quality and member
              experience.
