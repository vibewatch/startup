            body: >-
              Reports of revenue stagnation and workforce restructuring in 2025 underscore that Devoted Health faces
              margin compression from CMS risk adjustment changes (V28) and rising utilization, necessitating strict
              underwriting scrutiny.
            calloutType: risk
