  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: An integrated service product, not a standalone software SKU
        blocks:
          - type: paragraph
            body: >-
              The member-facing product begins with a Medicare Advantage plan and extends into navigation and care
              delivery. Devoted says every plan includes Member Service Guides who help members find care and resolve
              questions, while its clinical-model description combines the plan, local providers, virtual and in-home
              Devoted Medical care, full-service Guides, and proprietary technology. That makes the product boundary
              broader than an insurance policy or an app: the delivered experience is a coordinated operating model in
              which human service and clinical workflows are part of the product. The company also reported serving more
              than half a million people on its homepage at the October 2026 access date, indicating that these
              workflows operate at material scale, although the figure is company-issued and does not prove platform
              performance.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE007
              - CE012
              - CE016
      - number: '5.2'
        title: Workflow design links navigation, care coordination, and clinical programs
        blocks:
          - type: paragraph
            body: >-
              The clearest supported workflow is member-to-Guide-to-care: members use Guides for navigation, while
              Devoted Medical supplements local providers with virtual and in-home care. Devoted further says its
              medical teams use specialized clinical programs and technology-powered care coordination. On a page
              discussing 2023 Star Ratings, the company reported an average HbA1c reduction of 2.3 over 113 days and an
              average systolic blood-pressure reduction of 15 mmHg over 40 days. Those figures are company claims tied
              to selected clinical programs, not independent product benchmarks or proof that every member receives the
              same result. They nevertheless show the outcome lens the product is designed around: coordinated
              interventions rather than software engagement alone.
