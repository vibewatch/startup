  - id: financing-and-valuation-context
    title: Financing History, Cap Table Structure, and Valuation Context
    body: >-
      Devoted Health has raised extensive equity capital across successive financing rounds, securing $2.62B over 9
      funding rounds according to Tracxn records and up to $3.19B in total funding across its corporate history
      according to secondary market filings. The company previously closed a $287 million Series E funding round
      (incorporating $175M in December 2023 and $112M in closings during 2024 at $56.25/share), followed by a $366M
      Series F financing executed in two tranches: a $48.4M Series F round in November 2025 at $56.25 per share ($13.27B
      post-money valuation) and a $317.2M Series F-Prime financing in January 2026 at $67.50 per share ($16.27B
      post-money valuation), co-led by Centricus and The Space Between (TSB) with participation from Morgan Health and
      Google Ventures.


      Regulatory filings detailed by Forge Global record a subsequent Series G financing filed in September 2026 for
      $555M at $103.69 per share, establishing a post-money valuation of $25B with 5,352,480 shares outstanding and a
      1.0x non-participating senior liquidation preference carrying a 6.0% non-cumulative dividend rate. Simultaneously,
      secondary market marks through Nasdaq Private Market recorded an NPM share price of $64.67 on September 11, 2026,
      illustrating a dispersion between secondary pricing marks and top-tier primary preferred issuance prices. Capital
      structures with multi-tiered senior liquidation preferences mean earlier common equity and late secondary buyers
      face significant preference overhang if an eventual public listing or acquisition occurs below the $25 billion
      headline mark.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
    tableRefs:
      - TV003
    figureRefs: []
  - id: scenarios-comps-and-diligence
    title: Comparable Peer Benchmarks, Scenarios, and Diligence Asks
    body: >-
      Valuing Devoted Health against public managed care comparables illustrates an acute valuation divergence. Public
      Medicare Advantage insurtechs Alignment Healthcare and Clover Health trade at enterprise value multiples of 1.1x
      to 1.2x EV/Revenue and roughly $16,000 to $21,000 per active member. Applying these public benchmarks to Devoted
      Health’s 466,000 enrolled members yields an implied enterprise value of $7.5B to $9.8B—representing a 60% to 70%
      discount to the $25 billion Series G valuation mark. The 5x to 7x premium embedded in Devoted’s private valuation
      assumes that proprietary software orchestration via Orinoco and superior CMS Star Ratings will translate into
      structurally superior underwriting margins and clinical cost containment over a traditional health plan.


      To evaluate return outcomes, we construct three forward operating scenarios. The Bull Case assumes sustained 40%+
      annual enrollment growth, medical loss ratio (MLR) containment below 84%, and a public market IPO debut at $28B to
      $32B (~6.0x forward revenue). The Base Case projects growth moderating to 20–25%, MLR stabilizing around 86–88%
      amidst ongoing CMS V28 risk model headwind absorption, and an eventual liquidity event at $18B to $22B (~4.0x
      revenue). The Bear Case envisions CMS rate pressure, elevated senior utilization, and Star Rating slippage forcing
      down-round equity recapitalization or strategic sale at $10B to $14B (~2.0x revenue), triggering lower-tier
      dilution due to senior liquidation preference order. Critical pre-investment diligence requires inspecting audited
      GAAP consolidated financials, plan-level MLR by geographic market, and post-Series G cap table liquidation
      waterfall seniority.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
    tableRefs:
      - TV004
    figureRefs: []
