        - Older senior cohorts exhibit survey friction and conversational AI intake has unproven MLR impact
        - Independent peer-reviewed clinical outcome studies or audited claims audit
      - - Membership Growth
        - Explosive 121% YoY expansion to 466,000 members across 29 states demonstrates market dominance
        - Hyper-growth in Medicare Advantage risks adverse risk selection and margin deterioration
        - CMS county-level retention and disenrollment reports through open enrollment
      - - Valuation & Multiple
        - Commanding technology platform premium justified by vertical payvidor integration
        - Valuation at $25B ($53k/member) is disconnected from public peers ($16k-$21k/member)
        - Public comparable multiple re-rating or private valuation down-round
      - - Capital Structure
        - High-tier institutional backing provides deep cash reserves to fund aggressive expansion
        - Over $2.6B raised with 1.0x senior liquidation preferences creates heavy downside overhang for junior holders
        - Full disclosure of post-Series G cap table liquidation priority waterfall
