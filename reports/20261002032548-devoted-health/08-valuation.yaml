chapter:
  number: 8
  title: Valuation
  summary: >-
    Devoted Health is in talks to raise new capital at a reported $25 billion valuation in late 2026, marking a
    substantial jump from its $16.27 billion Series F-Prime post-money mark in January 2026 and earlier $12.87–13.16
    billion Series D/E levels. While membership growth to 466,000 enrolled seniors across 29 states (+121% YoY) and top
    Star Ratings demonstrate exceptional operational velocity, the implied valuation represents an aggressive ~7.5x
    multiple on estimated revenues and over $53,000 per member—trading at a severe 5–7x premium over public Medicare
    Advantage peers like Alignment Healthcare (ALHC) and Clover Health (CLOV). With consolidated GAAP financial audits
    remaining undisclosed, high private liquidation preferences, and ongoing V28 risk model headwinds, we maintain a
    track recommendation with a stretched valuation stance.
