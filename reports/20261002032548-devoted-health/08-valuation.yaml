callouts:
  - calloutType: recommendation
    title: 'Recommendation Stance: Track Pending Valuation Convergence'
    body: >-
      While Devoted Health exhibits industry-leading membership growth (+121% YoY) and superior clinical Star Ratings,
      its private valuation expansion to $25 billion demands extreme multiples (7.5x EV/Rev) in a Medicare Advantage
      sector undergoing severe regulatory margin compression. Investors should maintain a track stance pending financial
      disclosure of consolidated underwriting margins and liquidation preference waterfall details.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
  - calloutType: risk
    title: 'Valuation Risk: Dislocation from Public Comps and Preference Stacks'
    body: >-
      Public Medicare Advantage insurtechs trade at approximately 1.1x to 1.2x EV/Revenue and $16,000 to $21,000 per
      member. At $25 billion, Devoted Health trades at over $53,000 per member. If private-to-public multiples compress
      toward sector averages, junior preferred and common equity holders face severe liquidation preference overhang
      from $3.19B in cumulative senior capital.
    claimRefs:
      - CV004
      - CV011
      - CV012
      - CV013
