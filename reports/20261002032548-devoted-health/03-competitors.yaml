callouts:
  - calloutType: "insight"
    title: "Star Ratings as a Structural Financial Wedge"
    body: "In Medicare Advantage, clinical care integration and member experience are direct financial drivers rather than brand exercises. Because CMS Quality Bonus Payments require plans to achieve 4 or more stars to receive full benchmark rebates, Devoted Health's achievement of placing 95% of members in 4+ star contracts generates an estimated 5% revenue bonus per member. This bonus funds superior supplemental allowances, creating a self-reinforcing acquisition loop that legacy carriers struggling with star downgrades cannot match without eroding underwriting margin."
    claimRefs:
      - "CP005"
      - "CP006"
      - "CP010"
  - calloutType: "risk"
    title: "Distribution Gatekeeping and Incumbent Scale Barriers"
    body: "Despite its technological superiority, Devoted Health remains structurally dependent on independent brokers and FMO networks to drive annual enrollment. Incumbent giants command deep distributor loyalty through broader national footprint packaging and commercial bundle arrangements. If CMS further restricts agent compensation or caps supplemental marketing, Devoted's rapid customer acquisition velocity could face sharp headwinds."
    claimRefs:
      - "CP002"
      - "CP011"
      - "CP014"
      - "CP015"
