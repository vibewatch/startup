callouts:
  - calloutType: "insight"
    title: "The Medicare Advantage Senior Listening Paradox"
    body: "Devoted Health's heavy reliance on digital platforms like Orinoco and high-level satisfaction surveys highlights a structural industry paradox: the seniors most vulnerable to churn—those aged 75+ with complex chronic conditions—are the least likely to complete digital questionnaires or mail-back CAHPS surveys. Ensuring genuine customer durability requires voice-first, proactive listening rather than relying on self-reported trust metrics from digitally engaged cohorts."
    claimRefs:
      - "CU004"
      - "CU008"
  - calloutType: "risk"
    title: "Risk Adjustment Coding and Chart Audit Exposure"
    body: "As Devoted Health expands rapidly across 29 states, managing retrospective coding accuracy across both in-house teams and offshore vendor partners (such as AHS) represents a critical operational risk. With CMS tightening risk-adjustment oversight under the V28 model, documentation discrepancies or coding drift could trigger substantial federal clawbacks and jeopardize Star Rating bonus funding."
    claimRefs:
      - "CU004"
      - "CU011"
