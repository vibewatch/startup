  topStrengths:
    - 首飞前已有真实需求：公司披露已预售超过 $3B 的发射合同，且仍能看到具名客户的活动。
    - Relativity 仍保有差异化的制造体系，并持续推进工业化规模建设、设施开发以及 Terran R 相关项目里程碑。
    - 相比完全依赖风险投资的路径，Schmidt 的控股投资似乎改善了治理连续性，也可能延长了公司的资金跑道。
    - 客户组合覆盖商业卫星运营商和政府相关发射需求；如果飞行执行落地，最终可触达市场会更宽。
  topRisks:
    - Terran R 仍处于首飞前阶段：审阅材料中的公开来源没有显示一体化级间热试车、轨道任务、助推器回收或再次飞行，因此核心的复用与高频发射论点尚未经验证。
    - 资本密集度高，流动性却不透明。公开报道仍未披露经审计现金余额、烧钱速度或 Schmidt 投资后的融资条款。
    - 积压订单质量难以评估，因为公开来源没有披露订金安排、里程碑开票、取消保护或客户集中度。
    - 现有巨头和实力相近的新进入者带来的竞争仍然激烈，尤其是在 Terran R 建立飞行履历之前。
    - 战略聚焦风险仍在：管理层还要同时平衡发射开发、制造商业化和项目执行。
  unresolvedGaps:
    - Schmidt 投资后的确切股权表条款、持股比例、证券优先级和稀释机制尚未公开。
    - 未找到经审计的收入、现金、烧钱、毛利率或 ARR 披露，任何公开收入数字仍仅属估算。
    - 公开来源没有披露客户层面的积压订单集中度、订金、取消权利，或 Terran 1 重置后的重新预订行为。
    - 审阅材料仍缺少 Terran R 的飞行证据，例如公开的级间热试车结果、首次发射结果、回收数据，或进入 Lane 1 任务订单资格的路径。
    - 审阅来源仍无法 conclusively 解释公司规范创立日期究竟应记为 2015 年还是 2016 年。
