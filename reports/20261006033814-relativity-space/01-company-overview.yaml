callouts:
  - calloutType: "risk"
    title: "Historic valuation is not current equity value"
    body: "The $4.2 billion figure belongs to the June 2021 Series E. It should not be carried forward as a current valuation after the 2025 control financing, especially while Series 0 economics, current cash, and the fully diluted ownership waterfall remain undisclosed."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO009"
  - calloutType: "insight"
    title: "Commercial signals precede technical proof"
    body: "The company reports more than $3 billion of pre-sold launch contracts and SES confirms an expanded multi-launch agreement, but Terran R remains pre-flight. Underwriting should therefore separate customer interest from recognized revenue, enforceable backlog, launch reliability, and schedule execution."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO016"
