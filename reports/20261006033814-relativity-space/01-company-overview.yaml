company:
  name: "Relativity Space"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Relativity Space is a private Long Beach aerospace manufacturer centered on the still-unflown Terran R launch vehicle, with Eric Schmidt serving as CEO after a 2025 control transaction. Public evidence supports a historic $4.2 billion 2021 valuation, roughly $1.34 billion raised by that round, 2,000 employees, and $3 billion-plus in company-reported launch contracts, but current valuation, revenue, cash, and post-recapitalization ownership remain undisclosed."
sections:
  - id: "identity-and-business"
    title: "Identity, Product, and Business Model"
    body: >-
      Relativity Space is a private American aerospace manufacturer headquartered in Long Beach,
      California. Independent profiles identify Tim Ellis and Jordan Noone as its founders in 2015,
      while the current company About page describes its organizational history as running "Since
      2016"; the difference may reflect formation versus operating history and should not be
      collapsed into a single unsupported date. The operating thesis is launch services built around
      Terran R, a reusable medium-to-heavy-lift rocket, supported by in-house propulsion and
      manufacturing capabilities. This remains a development-stage business rather than a proven
      recurring-revenue launch operator: Terran R has not flown, and the available evidence does not
      disclose audited revenue, ARR, profitability, cash, or burn.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "leadership-and-control"
    title: "Leadership, Governance, and Key-Person Dependence"
    body: >-
      Eric Schmidt became chief executive in 2025, replacing co-founder Tim Ellis, while the official
      company page explicitly frames the change as a new chapter under Schmidt's leadership.
      Independent reporting summarized in the assigned evidence says Schmidt took a controlling
      interest and Ellis remained on the board. A review of the March 2025 charter describes a
      simplified capital structure in which Series 0 directors receive collective voting power equal
      to the total authorized board, concentrating governance around Schmidt's financing vehicle.
      That same review reports a 30% annual Series 0 dividend that can rise to 45% after a triggering
      event. These are material control and seniority terms, but exact ownership, board composition,
      security balances, and dilution are not public in the retained sources.
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "financing-and-stakeholders"
    title: "Financing History and Stakeholder Structure"
    body: >-
      Relativity's last broadly disclosed institutional pricing predates its current control
      structure. In November 2020, it raised $500 million in a Series D associated with a $2.3
      billion valuation. In June 2021, Fidelity led a $650 million Series E; CNBC reported that the
      transaction brought cumulative capital raised to $1.34 billion and increased valuation to
      $4.2 billion. Those figures describe historical financing, not current cash available or a
      current valuation. Fidelity, Tiger Global, BlackRock, Coatue, and other investors supplied the
      venture capital base, but Schmidt's later control investment changed the economic hierarchy.
      The absence of current cap-table and liquidity data prevents a reliable estimate of common
      equity value or runway.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO015"
    tableRefs:
      - "TO003"
    figureRefs: []
  - id: "scale-contracts-and-milestones"
    title: "Operating Scale, Contract Signals, and Milestones"
    body: >-
      The company reports 2,000 employees and five U.S. locations spanning California, Mississippi,
      Florida, Washington, D.C., and Seattle. Its About page also reports more than $3 billion in
      pre-sold launch contracts across more than a dozen customers; this is contractual backlog, not
      recognized revenue or cash. Customer-side evidence is narrower but useful: SES announced an
      expanded multi-year, multi-launch agreement in November 2025 and said Terran R's first launch
      was then planned for late 2026. Execution risk remains visible. Terran 1 failed to reach orbit
      in March 2023 and was retired, while an October 2026 profile still characterized Terran R as
      development-stage, with no publicly reported stage hot-fire and an FAA vehicle operator
      license still pending.
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO016"
    tableRefs: []
    figureRefs:
      - "FO001"
