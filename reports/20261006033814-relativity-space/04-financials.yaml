callouts:
  - calloutType: "risk"
    title: "Backlog Realization Risk Under Extended Flight Schedule Slippage"
    body: "Relativity's widely reported $1.8B to $2B+ commercial backlog represents customer launch reservations rather than guaranteed cash receipts. Because satellite operators like SES and Telesat must deploy orbital assets within strict regulatory spectrum deadlines, prolonged development delays or slips past targeted late-2026 maiden flight milestones expose Relativity to customer rebooking or contract cancellation."
    claimRefs:
      - "CI002"
      - "CI005"
      - "CI011"
