company:
  name: "Relativity Space"
chapter:
  number: 7
  title: "Risks"
  summary: "Relativity Space's central risk is concentrated Terran R execution: the predecessor vehicle did not reach orbit, a 2021 target for 2024 commercial service moved to a no-earlier-than-2026 first-flight expectation, and the current vehicle remains in development. The assigned evidence also leaves launch approvals, current cash and burn, contract protections, and incident history unresolved, so those items are diligence gaps rather than assumed facts."
sections:
  - id: "risk-ranking-and-evidence-limits"
    title: "Risk Ranking and Evidence Limits"
    body: "The highest residual exposure is Terran R program execution because Relativity's only orbital attempt, Terran 1, suffered an upper-stage anomaly and did not reach orbit before the vehicle was retired. Schedule evidence also moved materially: a 2021 industry report said commercial Terran R launches would begin in 2024, while the reviewed company history records a later expectation of no earlier than 2026. This comparison supports an elevated schedule-risk judgment, not a precise probability forecast. The assigned source set contains no direct licensing docket, court record, safety determination, audited financial statement, or incident register, so legal, liquidity, and safety conclusions remain explicitly unverified."
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR016"
    tableRefs:
      - "TR001"
  - id: "technical-and-operational-execution"
    title: "Technical and Operational Execution"
    body: "Terran R combines unproven flight execution with a complex operating footprint. Relativity currently describes the rocket as under construction and publishes payload targets, but those specifications are company claims rather than demonstrated mission performance. Independent synthesis says the design uses outside suppliers for tank domes and fairings, adding interface and schedule dependencies to an already difficult integration program. Company-issued recruiting material also describes information technology spanning the production floor through flight operations, while a separate workforce-operations role emphasizes data integrity, compliance, reporting, and audit readiness. Those roles indicate management attention to controls, but hiring descriptions do not prove that controls are implemented or effective."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR012"
      - "CR013"
      - "CR014"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "capital-governance-and-dependencies"
    title: "Capital, Governance, and Counterparty Dependencies"
    body: "The financial risk is capital intensity rather than a quantified cash-runway conclusion. CNBC reported a $650 million Series E in June 2021 and $1.34 billion raised since founding at that point; it also reported that management intended the new capital to accelerate production and launch cadence. Funding raised is not cash still available in 2026, and the assigned sources contain no current balance sheet, burn, revenue, or margin disclosure. Governance also changed materially: the current company leadership page names Eric Schmidt chief executive officer and executive chairman, while an independent synthesis reports that he took a controlling interest in 2025. That can provide strategic backing but also concentrates key-person and ownership dependency."
    claimRefs:
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR016"
    tableRefs:
      - "TR003"
  - id: "mitigations-monitors-and-thesis-breaks"
    title: "Mitigations, Monitoring Indicators, and Thesis Breaks"
    body: "Observable mitigation signals include named executives for manufacturing and supply chain, test and launch, information systems, and strategic affairs; recruiting for workforce controls; and participation in the NSSL Phase 3 Lane 1 program. These are capability and access signals, not proof of successful execution or contracted revenue. Monitoring should therefore focus on primary evidence: first-stage integrated test completion, launch-license and range approvals, demonstrated orbital performance, supplier qualification, customer contract durability, and audited liquidity. The thesis should break if licensing lacks a credible path to the planned flight window, integrated testing repeatedly misses disclosed milestones, initial Terran R missions fail to reach orbit, or verified liquidity cannot fund the program through corrective action."
    claimRefs:
      - "CR010"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
