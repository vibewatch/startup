      - number: '5.2'
        title: 推进系统与子系统工程
        blocks:
          - type: paragraph
            body: >-
              Terran R 推进架构在两级都采用液氧（LOX）和液态天然气 / 甲烷推进剂。一级助推器由 13 台 Aeon R 燃气发生器循环火箭发动机组成， 合计起飞推力约 3.5 million
              pounds。中部和中间位置的九台发动机采用万向节控制，在上升、返推和着陆机动中提供推力矢量控制；外围四台发动机 保持固定。二级采用单台真空优化的 Aeon V 发动机，提供 323,000 pounds
              真空推力。两种发动机都使用专有 3D 打印铜合金部件，以集成复杂 的内部冷却通道和涡轮机械歧管；这些部件若用传统方式加工，会很难或成本过高。车辆开发在 2023 年 12 月通过初步设计审查，并于 2024 年
              12 月完成关键设计审查，为推进系统集成子系统认证扫清道路。
            claimRefs:
