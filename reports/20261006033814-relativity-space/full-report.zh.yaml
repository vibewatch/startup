      - number: '5.3'
        title: 制造模式与认证测试
        blocks:
          - type: paragraph
            body: >-
              Relativity 已把制造理念从创立之初打印整枚火箭 95% 结构，调整为务实的混合生产模式。圆柱形推进剂箱筒体、大型穹顶和载荷整流罩等主要
              火箭结构，现采用传统航空航天铝合金，并交由专业外部供应商生产。内部增材制造集中用于高价值、几何复杂的总成，例如 Aeon R 推力结构、 喷注器总成、内部流体挡板和结构桁条。在 Long Beach 总部，公司于
              2026 年 6 月完成首级认证件结构组装，并开始静态机械验证和加压载荷测试。 在完整发动机和级段验收前，严格的部件级测试流程按既定军用标准，覆盖流体、气动、电气和航空电子子系统。这种混合生产方式旨在消除
              增材制造瓶颈，同时保留增材原型制造对复杂发动机部件的灵活性。
