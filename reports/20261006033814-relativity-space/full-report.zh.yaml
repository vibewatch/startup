      - number: '4.2'
        title: 资本充足性、融资结构与持续烧钱
        blocks:
          - type: paragraph
            body: >-
              截至 2021 年 6 月 Series E，Relativity 在八轮有文件记录的融资中累计股权融资约 $1.34 billion。该轮由 Fidelity Management & Research 领投
              $650 million，投后估值 $4.2 billion，Tiger Global、Baillie Gifford、Coatue 和 BlackRock 共同参与。2025 年 3 月， 前 Google
              CEO Eric Schmidt 完成大额私人资本投资，取得管理层控制权并直接担任 CEO 和 Executive Chairman，接替联合创始人 Tim Ellis。
              虽然这一由赞助方支持的控制权转移提供了关键的近期续航，并使公司免受风险资本市场困境影响，但历史基准显示，开发可复用中重型轨道发射系统 需要 $1 billion 至 $2 billion
              的专用开发资本。公司估计约有 2,000 名员工，基础设施承诺覆盖 Long Beach 总部、NASA Stennis Space Center 测试设施和 Cape Canaveral Launch
              Complex 16，持续运营烧钱仍然可观。由于没有关于 Schmidt 之后现金余额、月度烧钱或债务义务的 经审计公开披露，未来资本充足性完全取决于 Schmidt
              的财务支持能否让车辆验收测试和发射运营持续到经常性商业收入出现。
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: 单位经济、成本结构与投资判断
        blocks:
          - type: paragraph
            body: >-
              Relativity Space 的核心单位经济逻辑，是把专有金属增材制造（Stargate 3D printers）与助推器复用结合起来，相比传统航空航天制造实现 跃迁式降本。Relativity
              历来声称，增材制造可以将火箭零件数量减少 100 倍，并把生产周期从数年压缩到 60 天以内。在可运营的复用场景中，
              一级回收可以把资本支出摊到多次飞行，反复发生的边际成本则集中在二级制造、推进剂、发射台运营、靶场费用和车辆翻修。可是，Terran R
              尚未首飞，这些单位经济优势仍停留在理论阶段。实际毛利率无法审计，私人二级交易显示估值已从 2021 年高点压缩，商业发射定价还承受 SpaceX 高发射频次 Falcon 9
              舰队的激烈竞争压力。对机构投资判断而言，Relativity 是一项尚未验证的资产：商业发射积压、毛利率和未来现金 续航都被私人公司信息不透明性遮蔽，投入资本前必须严格完成尽调。
            claimRefs:
              - CI013
