            body: >-
              Relativity Space 是一家总部位于美国加州 Long Beach 的私人航天制造商。独立简介将 Tim Ellis 和 Jordan Noone 认定为 2015 年的创始人，而现公司 About
              页面把组织历史写为 “Since 2016”；这可能分别对应成立时间和运营历史， 不应在缺乏依据的情况下合并成一个日期。公司的运营逻辑是围绕 Terran R 提供发射服务；这是一款可复用的中重型火箭，
