      - CP015
  - id: FI001
    title: Terran R 商业发射变现流程
    type: flow
    summary: 展示从卫星合同签订、进度里程碑收款，到轨道交付和递延收入确认的商业生命周期。
    data:
      nodes:
        - id: N1
          label: 客户合同执行
          description: 卫星运营商签署多次发射协议；收到初始不可退款的预订定金
        - id: N2
          label: 里程碑进度付款
          description: 客户在硬件制造和集成里程碑完成时支付现金，计入递延收入
        - id: N3
          label: 级段验收与靶场集成
          description: 在 Stennis Space Center 进行二级生产和助推器验收测试
        - id: N4
          label: 轨道发射执行
          description: Terran R 从 Cape Canaveral LC-16 起飞，将卫星载荷送入 LEO/MEO
        - id: N5
          label: 载荷部署与任务成功
          description: 卫星载荷在目标轨道面成功分离；主要任务合同履行完毕
        - id: N6
          label: 收入确认与助推器回收
          description: 发射服务结束；确认里程碑收入，并回收一级用于翻修
      edges:
        - from: N1
          to: N2
        - from: N2
          to: N3
        - from: N3
          to: N4
        - from: N4
          to: N5
        - from: N5
          to: N6
    approximationNotes: 流程顺序反映商业卫星发射服务在会计和运营生命周期中的标准惯例。
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Terran R 发射系统从制造到靶场执行的结构与运营层。
    data:
      layers:
        - label: 载荷与整流罩层
          detail: 5 米载荷整流罩，可容纳商业和政府卫星、部署器及深空科学卫星平台。
        - label: 二级推进与航电
          detail: 单台真空优化 Aeon V 发动机（推力 323,000 lbf），配备飞行计算机和高空重启能力。
        - label: 级间段与级间分离机构
          detail: 气动分离硬件与冷气反作用控制系统，用于精确助推器分级和姿态控制。
        - label: 一级结构总成
          detail: 铝制筒段与 3D 打印桁条、连接件、内部推进剂挡板和外部导管支架组成的混合结构。
        - label: 一级推进堆栈
          detail: 由 13 台 Aeon R 液氧 / 甲烷发动机构成的集群，提供 3.5 million lbf 起飞推力，其中 9 台可摆动、4 台固定。
        - label: 地面支持与发射基础设施
          detail: LC-16 发射台设施，包括水平集成起重机、60,000-gallon 水喷淋系统、液氧储罐区和 Stennis A-2 级段台架。
    approximationNotes: null
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE007
      - CE012
  - id: FU001
    title: 从需求到持久收入的客户旅程
    type: journey-map
    summary: 公开证据在需求形成阶段最充分，但交付、续约和集中度披露仍最薄弱。
    data:
      nodes:
        - label: 任务需求
          detail: 商业和政府买方确定轨道目的地、载荷级别和时间表。
          touchpoints:
            - Terran R payload envelope
            - Launch-capacity planning
        - label: 运载火箭选择
          detail: 买方通过协议、合作伙伴关系或资格流程选择 Relativity。
          touchpoints:
            - Multi-launch agreement
            - Government qualification
        - label: 已签积压订单
          detail: 公开报道汇总了已签需求，但合同质量和现金转化仍未披露。
          touchpoints:
            - Reported backlog
            - Unnamed contract terms
        - label: 任务集成
          detail: 发射前必须完成载荷集成、进度保障和验收里程碑。
          touchpoints:
            - Enterprise and manufacturing systems
            - Supplier and purchase-order execution
        - label: 载荷交付
          detail: 保留来源集合无法证明 Relativity 已成功交付任何客户载荷。
          touchpoints:
            - Launch execution
            - Orbital insertion
        - label: 复购与扩张
          detail: 新增任务可能表明业务扩张，但续约、流失、留存，以及 客户集中度仍未披露。
          touchpoints:
            - Follow-on missions
            - Renewal and concentration review
    approximationNotes: 这是证据阶段图，不是转化漏斗；不推断转化率或各阶段耗时。
    claimRefs:
      - CU002
      - CU006
      - CU010
      - CU013
      - CU014
      - CU015
      - CU016
  - id: FR001
    title: 风险热力图：受证据约束的剩余敞口
    type: matrix
    summary: 对指定证据最直接支持的四个风险集群，定性评估其可能性、影响和缓解成熟度。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解成熟度
      rows:
        - label: Terran R 首次飞行执行
          values:
            - label: 偏高
              detail: Terran 1 历史上的未入轨结果及 Terran R 后续时间安排，支持“偏高”的定性评级。
            - label: 严重
              detail: 首次飞行失败或延误将推迟对当前飞行器的验证。
            - label: 早期
              detail: 可见开发活动，但指定资料池不包含集成飞行证据。
        - label: 发射批准与任务保障
          values:
            - label: Unknown
              detail: 未指定直接许可或靶场案卷。
            - label: 严重
              detail: 缺失批准文件可能阻止发射。
            - label: 无证据支持
              detail: 领导层职责和 NSSL 获选并不能证明已获批准。
        - label: 资本跑道与生产规模
          values:
            - label: Unknown
              detail: 最新量化融资证据属于历史信息，未披露当前现金或消耗。
            - label: 高
              detail: 流动性不足可能让开发或纠偏工作停摆。
            - label: 部分
              detail: 过往融资有证据支持，但当前现金跑道没有。
        - label: 供应商与运营基础设施
          values:
            - label: 中
              detail: 外部采购组件、基础设施覆盖面广，因而存在多个接口。
            - label: 高
              detail: 关键供应商或 IT 中断可能拖慢集成和发射。
            - label: 部分
              detail: 已有明确负责的高管，但冗余安排和控制有效性仍未知。
        - label: 所有权与领导层集中度
          values:
            - label: Unknown
              detail: 指定来源未披露治理权利、继任保护或融资承诺。
            - label: 高
              detail: 控股股东同时担任 CEO 和执行主席，战略与资本决策因此集中于一人。
            - label: 部分
              detail: 公开可见的高管名单较完整，但私有治理条款并未披露。
        - label: 员工数据与合规控制
          values:
            - label: 中
              detail: 公司正在为一个复杂且快速扩张的组织招聘负责控制工作的高级负责人。
            - label: 中
              detail: 控制薄弱可能影响合规、报告和组织信任。
            - label: 发展中
              detail: 职位描述明确了意图和责任，但尚未测试运营有效性。
    approximationNotes: 序数标签是分析师判断，并非测量所得的概率；指定来源缺乏一手证据之处，标签保留了未知状态。
    claimRefs:
      - CR002
      - CR007
      - CR008
      - CR011
      - CR012
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 这条决策逻辑链把技术规模、商业积压订单、飞行执行缺口和二级市场定价串联起来，最终导向跟踪建议。
    data:
      nodes:
        - id: node-manufacturing
          label: 3D 打印与规模优势
          detail: 专有 Stargate 打印机与精简的零件架构
        - id: node-backlog
          label: 商业积压订单验证
          detail: 据报道，商业星座已签署的发射合同超过 $2.9B
        - id: node-governance
          label: 领导层与资产负债表
          detail: Eric Schmidt 于 March 2025 以 CEO 身份取得控股权
        - id: node-execution
          label: 飞行测试执行缺口
          detail: Terran 1 在发生异常后退役；Terran R 的飞行前目标定在 late 2026
        - id: node-secondary
          label: 二级市场估值压缩
          detail: 二级市场交易价格为 $1.9B–$2.8B（较 $4.2B Series E 低 -34% 至 -55%）
        - id: node-recommendation
          label: 跟踪建议
          detail: 等待完成入轨和初始级段回收后再进入股权投资
      edges:
        - from: node-manufacturing
          to: node-backlog
        - from: node-backlog
          to: node-governance
        - from: node-governance
          to: node-execution
        - from: node-execution
          to: node-secondary
        - from: node-secondary
          to: node-recommendation
    approximationNotes: 这是一条逻辑推进链，把运营能力与市场估值信号连接成决策门槛。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV008
