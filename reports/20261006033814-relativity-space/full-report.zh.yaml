      - number: '7.3'
        title: 资本、治理与交易对手依赖
        blocks:
          - type: paragraph
            body: >-
              财务风险在于资本密集，而不是已有量化的现金续航结论。CNBC 报道 2021 年 6 月的 $650 million Series E，并称公司当时自成立以来 已融资 $1.34
              billion；报道还称管理层计划用新资本加快生产和发射频次。融资额不等于 2026 年仍可用的现金，指定来源也没有当前资产负债表、 烧钱、收入或利润率披露。治理同样发生重大变化：公司当前领导层页面称 Eric
              Schmidt 为 CEO 和 executive chairman，独立综合分析称 他在 2025 年取得控制性权益。这可以提供战略支持，但也会集中关键人物和所有权依赖。
