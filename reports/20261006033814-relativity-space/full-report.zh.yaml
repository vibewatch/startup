      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Relativity 的差异化逻辑仍是将增材制造的快速设计迭代与可复用发射架构结合起来。但这一逻辑的持久性比“完全打印火箭”的叙事更窄： 经审阅的二手来源称，Terran R
              已不再用增材制造生产燃料箱，并从外部供应商采购燃料箱穹顶、整流罩等部件。这或许是务实的工业选择， 但也意味着供应商获取、认证吞吐、发射场执行和飞行学习的重要性可能不亚于专有打印技术。进度证据不利：2021
              年来源称商业发射目标为 2024 年，而经审阅的 2026 年二手来源已将预期推迟至不早于 2026 年。在 Terran R 形成可重复飞行和回收证据之前，成熟对手的发射频次
              和客户信任可能压过名义上的载荷差异化。
            claimRefs:
              - CP002
              - CP003
              - CP004
