      - CM002
      - CM003
      - CM011
  - id: FP001
    title: Terran R 竞争证据快照
    type: kpi
    summary: 已发布的载荷声明与历史进度变化和资本规模并列；这些卡片不代表融资或目标日期等同于飞行表现。
    data:
