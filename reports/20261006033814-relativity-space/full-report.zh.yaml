  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 运载器架构与载荷能力
        blocks:
          - type: paragraph
            body: >-
              Relativity Space 的旗舰产品是 Terran R，这是一款两级中重型轨道运载器，面向卫星星座部署和政府发射需求。在下行段助推器着陆的基础 可复用配置下，Terran R 的目标能力是将
              23,500 kg 送入低地球轨道（LEO），将 5,500 kg 送入地球同步转移轨道（GTO）。一次性使用 的飞行模式下，宣传的 LEO 载荷能力升至 33,500 kg。这一载荷范围使 Terran R
              直接对标 SpaceX Falcon 9 主力级别，同时提供高于 典型小型发射商的专用运力。该架构接替首款 Terran 1 演示器；Terran 1 是一次性使用的小型运载器，在 2023 年 3
              月飞行中达到最大动压， 但上级发生异常，随后退役。公司全面转向 Terran R，把工程资源转向中重型发射服务，因为商业卫星巨型星座需要更高运力和可复用经济性。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
              - CE011
