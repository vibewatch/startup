              Relativity 的运营测试和发射版图覆盖 NASA 在 Mississippi 的 Stennis Space Center 以及 Florida 的 Cape Canaveral Space Force
              Station。 在 Stennis，公司已在专用 R Stand 完成首飞批次所有 Aeon R 助推器发动机的验收测试，并开始上级 Aeon V 发动机验收测试。同时，Terran R 二级测试件通过驳船抵达
              Stennis，准备在新租赁并升级的 A-2 测试台进行垂直级段热试车；该测试台配有 1.4-million-pound 导流器。 在 Cape Canaveral Launch Complex
              16，基础设施升级仍在进行，包括水平集成设施吊车、喷水抑制水箱和低温推进剂储罐区。除商业发射服务外， Relativity 还宣布 Interplanetary Sciences
