  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Relativity Space 的核心投资论点建立在两点上：将大规模增材制造用于轨道运载器，以及通过 Terran R 已公告的 $2.9 billion 合同积压获得 商业验证。公司最初部署专有
              Stargate 金属 3D 打印机，寻求把零件数量减少 100 倍，并相对传统航空航天制造商压缩生产周期。此外，前 Google CEO Eric Schmidt 于 2025 年 3
              月加入，取得管理层领导权和控制性权益，显著加强了治理监督、资产负债表韧性，以及面向防务和商业巨型星座部署的高层战略一致性。 但反论点集中在陡峭的技术执行风险和战略妥协上。Terran 1 在 2023 年 3
              月第二级燃烧期间发生飞行异常后，Relativity 退役了这款小型火箭，未实现轨道部署， 并把全部公司资源转向更重型的 Terran R。为把 Terran R 做到 23,500 kg 可复用 LEO
              载荷级别，Relativity 放弃了主要结构的纯 3D 打印， 改向传统供应商采购燃料箱穹顶等关键部件。这一转向使 Relativity 直接面对 SpaceX Falcon
              9，形成一种尚未验证的竞争定位；首飞前的积压订单不能被视为安全的经常性收入。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV008
              - CV012
      - number: '8.2'
        title: 估值历史、股权结构表与二级定价
        blocks:
          - type: paragraph
            body: >-
              Relativity Space 的资本化历史反映了 2020 至 2021 年太空科技扩张期激进的资本供给。公司于 2020 年 11 月以 $2.3 billion 估值获得 $500 million
              Series D，随后在 2021 年 6 月完成 Fidelity 领投的 $650 million Series E，峰值投后估值为 $4.2 billion，累计股权融资约达 $1.34
              billion。FundedIQ 等私人情报名单记录历史轮次，TechStackIPO 则给出一个说明性 IPO 前模型估值 $9.5 billion，准备度评分为 70；
              但当代私人市场指标显示估值明显压缩。具体而言，二级情报平台 QuantLogix 估算 Relativity Space 在 2026 年 10 月的股权估值为 $2.8 billion，比 Series E
              headline 标记下降 34%。这一估算很大程度基于 2026 年 6 月以 $1.9 billion 执行的一笔已验证二级市场交易， 暗示底层折价超过 54%。在缺乏经审计收入、毛利率指标，或 Eric
              Schmidt 资本重组条款公开披露的情况下，潜在投资者必须把早期轮次标记视为过时， 并认识到普通股和初级优先股类别上方存在显著清算优先权悬置。
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV009
              - CV013
              - CV015
      - number: '8.3'
        title: 情景框架、市场可比公司与估值倍数
        blocks:
          - type: paragraph
            body: >-
              评估 Relativity Space，需要把其运营阶段与发射同业比较，并建立情景式估值框架。在公开市场，Rocket Lab 凭借数十次已验证的 Electron 轨道任务
              和不断增长的太空系统收入，获得企业价值支撑；SpaceX 则依靠 Falcon 9 的主导发射频次和 Starlink 星座现金流，估值超过 $150 billion，位居行业前列。
              相比之下，Relativity Space 在轨道发射服务上仍无收入。乐观情景（$6.0B 至 $8.5B）假设 Terran R 在 2026 年末成功首飞、2027 年迅速转入
              商业飞行，并以有吸引力的运营利润率将 $2.9 billion 积压订单货币化。基准情景（$2.5B 至 $3.5B，主观概率 55%）考虑首飞推迟至 2027 年、
              通过多次飞行迭代测试实现级段回收，以及客户谈判交付保护后价格被压缩。在这一情景下，公允价值约收敛至 QuantLogix 的 $2.8 billion 估算。 悲观情景（$1.0B 至 $1.8B，概率
              25%）假设级段测试灾难性失败，或 Stennis A-2、Cape Canaveral LC-16 地面基础设施长期延误，导致客户流失和稀释性资本重组。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV014
      - number: '8.4'
        title: 最终建议、决策逻辑与尽调请求
        blocks:
          - type: paragraph
            body: >-
              我们最终给出“跟踪”建议，估值立场为“偏高”，风险评级为“高”，分析信心为“中”。可复用中重型运力作为 SpaceX 替代方案的市场机会很大， 但以接近 2021 年峰值 $4.2 billion
              的估值投入新增长股权，缺乏公开证据支持。即使二级定价为 $1.9 billion 至 $2.8 billion， 如果 Aeon R 发动机集群或 Terran R
              级间分离遭遇开发障碍，下行敞口仍然很大。投资者应等关键技术去风险里程碑完成后再投入资本。
              考虑进入股权前的首要尽调包括：第一，检查经审计财务报表，以确定净烧钱和运营续航；第二，审计客户积压协议，核实前期不可退还现金订金和终止罚金； 第三，审阅 Stennis A-2
              测试台的全时长静态点火遥测；第四，取得完整资本表明细，说明 Eric Schmidt 的优先级、控制权和清算优先权倍数。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: “尽调提示：在 Terran R 飞行里程碑前维持跟踪立场”
            body: >-
              Relativity Space 将大规模金属增材制造的世界级技术雄心，与令人印象深刻的 $2.9 billion 商业积压结合起来。但 Terran 1 首飞异常后退役， 且 Terran R 到 2026
              年末仍未首飞，公司面临重大技术执行风险。近期二级市场成交价为 $1.9 billion，相对 $4.2 billion 的 Series E headline 估值折价约
              55%，说明私人市场较为谨慎。投资者应维持“跟踪”立场，等待成功入轨和级段回收验证后再投入增长股权。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV014
          - type: callout
            title: “估值风险：稀释与清算优先权悬置”
            body: >-
              公司在多轮私人融资中累计募集超过 $1.34 billion 股权，Eric Schmidt 于 2025 年 3 月取得控制权；新的增长投资者可能面临高级清算优先权 和未披露治理条款造成的结构性悬置。如果
              Terran R 飞行测试推迟至 2027 年，中重型火箭制造的巨额资本需求可能触发更多稀释性资本注入， 进一步压低普通股和初级优先股价值。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV014
              - CV015
