  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、服务范围与战略转向
        blocks:
          - type: paragraph
            body: >-
              Relativity Space 将目标市场定义为轨道发射服务，重点面向需要灵活中重型运力的商业卫星星座和机构载荷。2023 年 3 月 3D 打印 Terran 1
              火箭完成首次亚轨道测试后，管理层果断退出现已供给过剩、利润率偏低的小卫星类别，将小型卫星发射业务 的全部工程和生产能力转向 Terran R。这是一款部分可复用火箭，在下行段回收模式下，设计为最多将 23,500
              kilograms 送入低地球轨道。 公司放弃小卫星发射、集中做重型轨道物流，直接瞄准核心星座部署预算，同时排除在轨载荷制造、卫星载荷运营等相邻但非核心的航天应用。
            claimRefs:
              - CM004
              - CM007
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM007
              - CM014
      - number: '2.2'
        title: 市场规模、增长预测与可服务需求
        blocks:
          - type: paragraph
            body: >-
              全球商业航天经济覆盖数千亿美元级的可服务市场；市场分析师预计，低地球轨道（LEO）任务支出到 2035 年将达到 $312 billion。在这一宏观扩张中，轨道发射服务是不可替代的入口，预计从 2022 年的
              $16.9 billion 增长到 2027 年的 $29.6 billion，复合年增长率为 11.9%。Relativity 的服务可服务市场（SAM）集中在中重型商业发射领域，全球需求主要
              由多卫星星座架构驱动。Relativity 已在 OneWeb、Intelsat 和 SES 等头部运营商中，为 Terran R 累积约 $2.9 billion
              的商业合同积压，显示市场确实在寻找替代发射商。但由于 Relativity 尚未入轨，这些积压是有条件的多年期承诺，而非已确认收入。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
      - number: '2.3'
        title: 买方分层、预算归属与采用流程
        blocks:
          - type: paragraph
            body: >-
              重型轨道运力需求分为三类客户：商业巨型星座运营商、民用空间科学机构，以及国家安全防务组织。商业卫星星座运营商 是 Relativity 的主要客户量来源，原因是运力严重短缺，也因为它们迫切需要摆脱 SpaceX
              Falcon 9 双寡头、分散发射清单。 这些商业买家按多年采购周期运作，直接由高管层谈判，优先考虑发射窗口可用性、载荷成本效率和任务可靠性。同时，NASA 等 民用机构以及 US Space Force
              内的防务项目是高毛利率、逆周期的预算所有者；其法定职责要求多个国内发射商，以保证持续进入太空。
            claimRefs:
              - CM003
              - CM006
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM012
      - number: '2.4'
        title: 增长驱动、资本强度与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              结构性发射缺口和较快的卫星替换周期推动 Terran R 的采用，但行业动态仍受重大运营壁垒约束。商业航天发射行业需要极高的前期 资本支出、漫长开发周期，并接受严格的 FAA 和靶场安全监管。Relativity
              虽在 2021 年成功募集 $650 million Series E 股权融资以建设生产基础设施，但开发新的轨道重型运载火箭会持续消耗大量现金。2024 年末关于流动性压力的报道，凸显了开发
              资本与飞行就绪之间的脆弱平衡。此外，SpaceX 已完成飞行验证的 Falcon 9 以及即将到来的 Starship 带来的激进定价压力， 形成竞争上限，要求新兴发射商几乎无瑕疵地执行技术方案。
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资本密集度高，首飞前流动性承压
            body: 商业航空航天制造需要为工装、发动机认证和发射场基础设施投入巨额资本。2024 年末的独立报道提示潜在流动性压力， 因而要避免稀释性资本重组，按期执行 Terran R 飞行计划至关重要。
            calloutType: risk
            claimRefs:
              - CM008
              - CM010
          - type: callout
            title: 商业积压订单不保证偿付能力
            body: >-
              Relativity 的 $2.9 billion 商业积压订单，证明客户对 SpaceX Falcon 9 替代方案有强烈需求。但发射服务合同受里程碑
              约束且公司尚未运营，因此要把积压转成现金，必须达到严格的技术里程碑并完成轨道载荷部署。
            calloutType: insight
            claimRefs:
              - CM003
              - CM011
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              经审阅证据中最稳定的直接同业集合是 SpaceX、Blue Origin 和 ULA：Distill 与 Owler 都列出三者，CNBC 也明确将 Terran R 与 Falcon 9 对比。Rocket
              Lab 属于相邻的端到端航天与发射服务商，Distill 还把 Stoke Space、Firefly Aerospace、 Isar Aerospace、ABL Space Systems
              及大型防务承包商纳入更宽泛的竞争范围。Craft 的名单不那么聚焦发射，还包括在轨物流企业，
              说明通用竞争数据库可能模糊发射服务边界。买方也可以推迟任务、改用拼车或另一种载荷级别，或者向成熟供应商采购；自行开发发射系统 理论上可以替代，但对普通商业卫星运营商而言通常是无法承担的资本承诺。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP015
      - number: '3.2'
        title: 能力、验证与信任
        blocks:
          - type: paragraph
            body: >-
              Relativity 公布 Terran R 的可复用 LEO 能力为 23,500 kg（下行段着陆），GTO 能力为 5,500 kg（下行段着陆），一次性使用 时的 LEO 能力为 33,500
              kg。这一规格使 Terran R 进入有意义的中重型运力采购讨论，但不等同于已证明的发射频次、任务保障或回收经济性。 2026 年 6 月更新记录了首级初步验证案例、首飞 Aeon R
              一级发动机完成验收测试、Aeon V 开始验收测试，以及 LC-16 持续建设。 这些都是切实的准备度信号，但历史上的 Terran 1
              首飞未能入轨，且任务结束后火箭退役。因此，买方面对的是公开运力与可重复交付之间的验证缺口。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP011
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP011
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP012
              - CP015
      - number: '3.3'
        title: 定价、产品组合与购买路径
        blocks:
          - type: paragraph
            body: >-
              当前提供的官方页面披露了载荷能力和工程里程碑，但没有披露 Terran R 的目录价、实际合同价、订金安排、取消权、批量折扣或服务等级 救济。保留的竞争对手名单同样没有提供 SpaceX、Blue
              Origin、ULA、Rocket Lab 或新兴供应商的可比价格或合同条款。因此，无法用这组证据 算出有依据的每公斤价格或单次任务总成本。Relativity
              的历史融资规模支持其继续开发，但融资额既不是客户收入，也不能证明发射报价更便宜。 采购尽调必须比较实际方案、进度保证、集成服务、保险处理和里程碑付款风险。
            claimRefs:
              - CP011
              - CP015
              - CP016
