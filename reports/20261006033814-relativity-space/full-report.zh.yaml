      - number: '7.4'
        title: 缓释措施、监测指标与论点失效
        blocks:
          - type: paragraph
            body: >-
              可观察的缓释信号包括负责制造与供应链、测试与发射、信息系统和战略事务的高管；面向劳动力控制的招聘；以及参与 NSSL Phase 3 Lane 1 项目。
              这些是能力和准入信号，不是成功执行或已签约收入的证明。因此，监测应聚焦一手证据：首级集成测试完成、发射许可证和靶场批准、已证明的轨道表现、
              供应商认证、客户合同持久性和经审计流动性。如果许可证缺乏通向计划飞行窗口的可信路径，集成测试反复错过披露里程碑，Terran R 初始任务未能入轨， 或经核实流动性不足以支撑项目完成纠偏，投资论点就应失效。
