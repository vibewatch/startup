      - 下行情景 / 论点失效触发条件
    rows:
      - - 乐观情景
        - 20%
        - Terran R 于 2026 年末实现首次发射；2027 年快速转入商业发射节奏；积压订单超过 $2.9B 并实现转化
        - $6.0B–$8.5B
        - 反映商业发射倍数的平价水平（运行率收入的 6.0x–8.0x），并成功成为 Falcon 9 的挑战者
        - 二级市场复苏，以及星座多次发射合同扩展
      - - 基准情景
        - 55%
        - 首次入轨推迟至 2027 年；通过 2–3 次飞行逐步证明可重复使用能力；选择性转化积压订单
        - $2.5B–$3.5B
        - 与 QuantLogix 当前二级市场估值（$2.8B）一致，并相对于最近披露的 $4.2B 估值适度折价
        - 级段测试延误，或客户改订其他运营中的发射供应商
      - - 悲观情景
        - 25%
        - 级段异常长期持续；可重复使用开发严重延误；客户取消订单侵蚀积压；进行摊薄性下轮融资
        - $1.0B–$1.8B
        - 困境二级市场清算价值低于 2026 年 6 月二级市场成交价（$1.9B），且清算优先权形成悬压
        - 失去主要客户锚点，或在 Schmidt 任期内无法获得额外资本
    notes: 情景估值矩阵基于 QuantLogix 二级市场数据、历史融资估值和 Terran R 商业化里程碑。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV010
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 时间线将外部报道的成立与融资事件，与公司叙述的历史、产品重置、领导层变动及当前飞行前执行检查点分开呈现。
    data:
      items:
        - date: '2015'
          label: 外部报道的成立
          detail: 独立简介确认 Tim Ellis 和 Jordan Noone 是 2015 年的创始人。
          tone: neutral
        - date: '2016'
          label: 官方历史锚点
          detail: 当前 About 页面称该组织“Since 2016”不断发展，因此成立日期的标注仍未解决。
          tone: neutral
        - date: 2020-11
          label: Series D
          detail: 公司在一轮融资中募集 $500 million，对应估值 $2.3 billion。
          tone: positive
        - date: '2021-06-08'
          label: Series E
          detail: Fidelity 领投 $650 million 融资；CNBC 报道累计融资 $1.34 billion，估值为 $4.2 billion。
          tone: positive
        - date: 2023-03
          label: Terran 1 探路飞行未能入轨
          detail: Terran 1 通过最大动压阶段，但上级异常导致未能入轨；该飞行后飞行器退役。
          tone: warning
        - date: 2025-03
          label: Schmidt 领导与控制权转移
          detail: Eric Schmidt 接替 Tim Ellis 出任 CEO，据报道取得控制性权益。
          tone: warning
        - date: '2025-11-12'
          label: SES 扩大发射协议
          detail: SES 宣布在扩大的多年期、多次发射协议下增加 Terran R 发射任务。
          tone: positive
        - date: '2026-10-05'
          label: Terran R 仍处于开发阶段
          detail: 一份当前简介称尚无公开级段热试车记录，FAA 飞行器运营商许可证也仍在等待。
          tone: warning
    approximationNotes: 仅标注月份的日期反映保留来源所能提供的精度；这些里程碑不是完整的运营历史。
    claimRefs:
      - CO002
      - CO003
      - CO005
      - CO008
      - CO009
      - CO013
      - CO014
      - CO016
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 从整体太空经济到 Relativity 已签约商业积压订单的分层市场规模。
    data:
      items:
        - label: 整体太空经济（2035 年视野）
          value: $312B
          detail: LEO 任务、商业卫星通信和地球观测的预计总价值链
          tone: neutral
        - label: 全球发射服务 TAM（2027）
          value: $29.6B
          detail: 专用及拼车式轨道发射运输服务，规模从 2022 年的 $16.9B 扩大
          tone: neutral
        - label: 中重型运力可服务 SAM
          value: $15B+
          detail: 能将 10,000 kg 至 35,000 kg 载荷送入轨道的运载火箭细分市场
          tone: neutral
        - label: 商业星座部署需求
          value: $10B+
          detail: 商业运营商所需的非 SpaceX 卫星星座发射储备
          tone: positive
        - label: Relativity 已签积压订单（SOM 视角）
          value: $2.9B
          detail: OneWeb、Intelsat 和 SES 签署的 Terran R 多次商业发射合同
          tone: positive
        - label: 飞行前已实现轨道收入
          value: $0B
          detail: 在 Terran R 首次飞行前，截至目前确认的轨道商业发射收入为零
          tone: warning
    approximationNotes: 数字反映已发布的第三方市场预测和公司报告的积压订单承诺；首次轨道发射前，近期已实现飞行收入为零。
    claimRefs:
