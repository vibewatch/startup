          tone: positive
        - label: 可重复使用的 GTO 载荷
          value: 5500
          unit: kg
          detail: 公司发布的评级，包含下行着陆。
          tone: positive
        - label: 一次性 LEO 载荷
          value: 33500
          unit: kg
          detail: 公司发布的一次性使用评级。
          tone: neutral
        - label: 历史发射目标
          value: 2024
          unit: year
