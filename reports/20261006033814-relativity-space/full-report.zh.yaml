  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、发射定价架构与积压确认
        blocks:
          - type: paragraph
            body: >-
              Relativity Space 将商业收入模式建立在重载荷轨道发射服务上，并辅以次级任务窗口、防务订单型运载器和未来载荷托管等推测性业务。 在 2023 年 3 月演示飞行中第二级异常、公司随后退役小型
              Terran 1 火箭之前，公司曾以接近 $12 million 的目录价销售专用小卫星发射。 战略全面转向 Terran R 后，公司把商业销售重心转向商业星座运营商和机构买家。Terran R
              是两级可复用运载器，设计为在下行段着陆时 将最多 23,500 kg 送入低地球轨道（LEO）。公司与 SES、Telesat、Iridium 和 OneWeb 等卫星星座运营商签订商业协议，形成了据报 $1.8
              billion 至 $2 billion、覆盖至少九名客户的合同积压。此外，进入 NASA 的 Launch Services II（NLS II）以及 U.S. Space Force $5.6 billion
              的 National Security Space Launch（NSSL）Phase 3 Lane 1 无固定交付 / 无固定数量（IDIQ）框架，扩大了可服务的联邦采购范围。
              但在轨道发射合同中，签署的商业发射清单不代表已完成收入或无条件现金订金。客户合同通常包含协商的退出机制、延误违约金、重新预订选项和 绩效里程碑依赖。由于 Terran R
              仍在地面开发、尚未完成轨道飞行测试，运营发射服务的确认收入实际上为零；已报道的积压订单更像未赚取需求的代理指标， 而不是可直接存入银行的经营现金流。
