              Terran R 的飞行执行尚未验证，且运营版图复杂。Relativity 目前将这枚火箭描述为处于建造阶段，并发布载荷目标，但这些规格是公司主张，不是已证明的任务表现。
              独立综合分析称，设计使用外部供应商生产燃料箱穹顶和整流罩，为已经困难的集成项目增加接口和进度依赖。公司招聘材料还描述从生产车间到飞行
              运营的信息技术体系，另一份工作说明则强调数据完整性、合规、报告和审计准备。这些岗位说明管理层关注控制，但招聘描述不能证明控制已经实施或有效。
