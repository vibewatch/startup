      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Eric Schmidt 于 2025 年出任 CEO，接替联合创始人 Tim Ellis；公司官方页面明确将这一变化描述为 Schmidt 领导下的新篇章。指定证据中的独立报道总结称，Schmidt
              取得了控制性权益，Ellis 仍留在董事会。对 2025 年 3 月 章程的审阅显示，资本结构已简化：Series 0 董事拥有相当于整个授权董事会的集体投票权，使治理权集中到 Schmidt
              的融资工具。该审阅还称，Series 0 年度股息为 30%，触发事件后可升至 45%。这些都是重大的控制权和优先级条款， 但保留来源没有公开确切持股、董事会构成、证券余额或稀释情况。
