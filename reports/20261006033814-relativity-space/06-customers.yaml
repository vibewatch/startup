schemaVersion: "report-v2"
artifact: customers
slug: relativity-space
runDate: 2026-10-06
company:
  name: Relativity Space
chapter:
  number: 6
  title: Customers
  summary: >-
    Relativity has disclosed a broad mix of commercial, civil, and defense launch
    demand, including multi-launch relationships and a reported $2.9 billion Terran R
    backlog. That is meaningful pre-launch validation, but the reviewed evidence does
    not establish revenue conversion, retention, customer concentration, or a
    successful production payload delivery.
sections:
  - id: customer-segments
    title: Buyer segments and jobs to be done
    body: >-
      Relativity's customer proposition is launch capacity rather than a recurring
      software seat: satellite operators, constellation builders, civil agencies, and
      national-security buyers procure orbital delivery for payloads with different
      mission, schedule, and assurance requirements. Publicly named relationships
      span commercial constellation deployment, fixed-satellite services, government
      launch programs, and exploration missions. The company currently markets Terran
      R capacities of 23,500 kg to low Earth orbit with downrange landing, 5,500 kg to
      geosynchronous transfer orbit with downrange landing, and 33,500 kg to low Earth
      orbit in an expendable configuration. Those specifications define addressable
      use cases, but they are not evidence that customers have flown on Terran R.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU012]
    tableRefs: [TU001]
  - id: adoption-and-named-demand
    title: Adoption evidence is contractual, not operational
    body: >-
      The strongest adoption signal is contracted demand before service entry.
      Third-party summaries describe a progression from pre-sold Terran 1 launches to
      more than $1 billion of Terran R contracts in 2023, a nine-customer and $1.8
      billion order-book snapshot of unclear date, and a reported Terran R backlog
      above $2.9 billion in 2025. Named relationships include OneWeb, Intelsat, SES,
      NASA, and Impulse Space. These figures use different dates and scopes and should
      not be added together. More importantly, backlog is neither recognized revenue
      nor proof of deposits, cancellation protection, launch readiness, or realized
      gross margin.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU009, CU011]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Durability and expansion remain unproven
    body: >-
      Multi-year and multi-launch language suggests a pathway from an initial vehicle
      selection to repeat missions, and SES's reported addition of previously
      unannounced missions is the clearest public expansion signal in the reviewed
      set. However, no source in the assigned evidence discloses renewal rates,
      contract length by customer, churn, gross or net retention, deposits,
      termination rights, rebooking behavior, or customer-level backlog shares.
      Without those terms, a large headline backlog cannot establish revenue
      durability or diversification. The customer journey therefore has a strong
      demand-discovery stage but unresolved conversion and repeat-use stages.
    claimRefs: [CU006, CU007, CU015, CU016]
    figureRefs: [FU001]
  - id: delivery-and-procurement-friction
    title: Delivery proof is the gating customer risk
    body: >-
      The central customer-risk distinction is between signing demand and delivering
      a payload. Terran 1's only flight carried no payload and did not reach orbit,
      while the investment report in the pool explicitly identifies the lack of an
      operational track record as a trust risk. Relativity's current job materials
      show internal work on enterprise applications, manufacturing systems, supplier
      sourcing, lead times, and purchase-order execution. Those activities are
      consistent with a company preparing to scale, but company-issued recruiting
      language is not independent evidence of operational readiness. Diligence should
      test manifested missions, customer acceptance criteria, schedule remedies, and
      procurement bottlenecks before assigning high confidence to backlog conversion.
    claimRefs: [CU010, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation and value map
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public proof
      - Strategic value
      - Evidence gap
    rows:
      - - Commercial constellations
        - Satellite operator procurement and mission teams
        - Multi-launch deployment of satellite fleets
        - OneWeb multi-year, multi-launch agreement
        - Potential repeat cadence across a constellation buildout
        - No disclosed realized launches, economics, or cancellation terms
      - - Fixed-satellite and connectivity operators
        - Fleet operator and network-planning teams
        - Medium-to-heavy payload delivery and fleet replenishment
        - Intelsat agreement and later SES expansion are publicly reported
        - Larger payload classes and potential follow-on missions
        - Mission count, deposits, pricing, and schedule remedies are undisclosed
      - - Civil and national-security agencies
        - Government program and mission offices
        - Science, experimental payload, and responsive launch procurement
        - NASA relationships and reported Space Force eligibility
        - Credibility plus access to competed mission pipelines
        - Eligibility and partnership do not equal awarded or completed launches
      - - Exploration and in-space infrastructure
        - Mission developer and payload owner
        - Launch for interplanetary or specialized missions
        - Impulse Space is named in public relationship summaries
        - Differentiated missions beyond routine satellite deployment
        - Schedule, funding, technical dependencies, and enforceable scope are unclear
    notes: >-
      Segments are analyst groupings from the retained sources; public agreements and
      eligibility are not treated as completed launches or recognized revenue.
    claimRefs: [CU001, CU003, CU004, CU005, CU006, CU012]
  - id: TU002
    title: Customer demand and delivery trajectory
    columns:
      - Evidence date
      - Metric or milestone
      - Reported value
      - Evidence posture
      - Implication
      - Missing denominator or qualification
    rows:
      - - June 2021
        - Terran 1 pre-sales
        - CEO called it the most pre-sold rocket before launch
        - Company claim reported by CNBC
        - Early willingness to reserve capacity
        - Customer count, contract value, deposits, and cancellation rights not given
      - - March 2023
        - Terran R contract value
        - More than $1 billion
        - dot.LA reported the company announcement
        - Material pre-flight commercial interest
        - Contract count, enforceability, and revenue timing not given
      - - Date unclear in retained report
        - Terran R customers and order book
        - Nine customers and more than $1.8 billion
        - Manhattan Venture Research estimate/report
        - Broader named and unnamed customer validation
        - Vintage and customer-level composition are not disclosed
      - - March-November 2025 reporting
        - Terran R commercial backlog
        - More than $2.9 billion
        - Secondary compilation citing industry reporting
        - Headline demand expanded ahead of first Terran R flight
        - Backlog is not revenue; deposits, cancellations, concentration, and margin are unknown
    notes: >-
      Values are separate historical snapshots with different scopes and vintages; they
      are not additive, and no row converts backlog into revenue or cash.
    claimRefs: [CU007, CU008, CU009, CU011]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / counterparty
      - Segment
      - Publicly described relationship
      - Proof stage
      - Reported outcome
      - Limitation
    rows:
      - - OneWeb
        - Commercial constellation
        - Multi-year, multi-launch Terran R agreement
        - Contracted / pre-flight
        - Named demand for second-generation constellation deployment
        - No completed Relativity launch or customer outcome in the retained evidence
      - - Intelsat
        - Fixed-satellite services
        - Multi-launch Terran R services agreement
        - Contracted / pre-flight
        - Named commercial operator in the order book
        - Mission count, value, schedule, and cancellation terms are not public here
      - - NASA
        - Civil government
        - VADR selection and other partnership or mission interest are reported
        - Qualified / partnered, not proven delivery
        - Access to competed civil missions and technical collaboration
        - Selection or partnership is not evidence of a completed paid Terran R mission
      - - Impulse Space
        - Exploration and in-space transportation
        - Publicly described launch and Mars-mission relationship
        - Announced / pre-flight
        - Named strategic mission use case beyond satellite deployment
        - Schedule and execution remain dependent on unflown systems
    notes: >-
      Partial enumeration of named relationships visible in the assigned sources as of
      2026-10-06; it excludes unnamed customers and does not infer production use.
    enumerationScope:
      coverage: partial
      basis: >-
        Named commercial and government relationships appearing in the assigned
        prefetched source set, not the full contract population.
    claimRefs: [CU003, CU004, CU005, CU008, CU009]
figures:
  - id: FU001
    title: Customer journey from demand to durable revenue
    type: journey-map
    summary: >-
      Public evidence is strongest at demand formation and weakest at delivery,
      renewal, and concentration disclosure.
    data:
      nodes:
        - label: Mission need
          detail: Commercial and government buyers identify an orbital destination, payload class, and schedule.
          touchpoints:
            - Terran R payload envelope
            - Launch-capacity planning
        - label: Vehicle selection
          detail: Buyers select Relativity through an agreement, partnership, or eligibility process.
          touchpoints:
            - Multi-launch agreement
            - Government qualification
        - label: Contracted backlog
          detail: Public reports aggregate signed demand, but contract quality and cash conversion remain undisclosed.
          touchpoints:
            - Reported backlog
            - Unnamed contract terms
        - label: Mission integration
          detail: Payload integration, schedule assurance, and acceptance milestones must be completed before launch.
          touchpoints:
            - Enterprise and manufacturing systems
            - Supplier and purchase-order execution
        - label: Payload delivery
          detail: No successful customer payload delivery by Relativity is established in the retained source set.
          touchpoints:
            - Launch execution
            - Orbital insertion
        - label: Repeat and expansion
          detail: Added missions can indicate expansion, but renewal, churn, retention, and customer outcomes remain undisclosed.
          touchpoints:
            - Follow-on missions
            - Renewal and concentration review
    approximationNotes: >-
      This is an evidence-stage map, not a conversion funnel; no conversion rates or
      time-to-stage estimates are inferred.
    claimRefs: [CU002, CU006, CU010, CU013, CU014, CU015, CU016]
callouts:
  - calloutType: insight
    title: Demand validation precedes product validation
    body: >-
      The reported backlog and named agreements show buyer interest, but they do not
      substitute for successful payload delivery or customer outcome evidence.
    claimRefs: [CU007, CU008, CU009, CU010]
  - calloutType: risk
    title: Contract quality is the key hidden variable
    body: >-
      Customer-level concentration, deposits, termination rights, pricing, and
      rebooking behavior are required to translate backlog into durable revenue.
    claimRefs: [CU015, CU016]
