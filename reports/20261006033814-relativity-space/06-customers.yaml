  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-retention
      missingEvidence: >-
        Customer-level renewal history, churn, gross and net retention, contract
        duration, satisfaction, and repeat-launch behavior.
      whyItMatters: >-
        Signed demand cannot establish durable adoption without evidence that
        customers remain contracted, renew, and expand after delivery.
      diligencePath: >-
        Review the contract cohort by signing date, renewal and termination events,
        customer references, mission manifests, and board-level retention reporting.
      relatedQuestionRefs: [QU008]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Top-customer backlog shares, deposits collected, cancellation and rebooking
        rights, pricing, milestone acceptance, and schedule remedies.
      whyItMatters: >-
        The conversion probability and downside of the reported backlog depend on
        enforceability, concentration, and customer remedies rather than headline value.
      diligencePath: >-
        Obtain a customer-by-customer backlog bridge with signed contract excerpts,
        cash deposits, cancellation history, expected launch dates, and margin by mission.
      relatedQuestionRefs: [QU009]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customers
      missingEvidence: >-
        A complete current roster reconciling legacy Terran 1 customers, Terran R
        customers, government eligibility, unnamed buyers, and superseded agreements.
      whyItMatters: >-
        Public names are a sample and cannot support a precise customer count or
        diversification conclusion.
      diligencePath: >-
        Reconcile the CRM, signed backlog schedule, launch manifest, and customer
        permission list against every public announcement.
      relatedTableRefs: [TU003]
