    title: Capability and readiness matrix
    columns:
      - Buying criterion
      - Relativity Space
      - SpaceX
      - Blue Origin / ULA
      - Rocket Lab / emerging peers
      - Evidence boundary
    rows:
      - ["Reusable LEO payload", "23,500 kg claimed with downrange landing", "Falcon 9 is the direct reference; retained source gives no current figure", "Unknown", "Unknown", "Only Relativity's current payload number is retained"]
      - ["GTO payload", "5,500 kg claimed with downrange landing", "Unknown", "Unknown", "Unknown", "No comparable competitor figures in the pool"]
      - ["Expendable LEO payload", "33,500 kg claimed", "Unknown", "Unknown", "Unknown", "No comparable competitor figures in the pool"]
      - ["Orbital proof", "Terran R under development; Terran 1 failed to reach orbit and was retired", "Falcon 9 described as a workhorse and direct benchmark", "Unknown in retained evidence", "Unknown in retained evidence", "Vehicle-specific mission records were not allocated"]
      - ["2026 readiness signal", "Stage-one proof testing, flight-engine acceptance work, and LC-16 construction", "Unknown in retained evidence", "Unknown in retained evidence", "Unknown in retained evidence", "Relativity evidence is company-issued and not a launch outcome"]
      - ["Manufacturing model", "Additive manufacturing remains relevant, but tanks moved away from printing and some components use suppliers", "Unknown", "Unknown", "Unknown", "No independent cost or cycle-time benchmark was retained"]
    notes: "The matrix reports only fields supported by the assigned evidence; 'unknown' means no comparable fact was retained, not that the capability is absent."
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP011, CP013, CP014]
  - id: TP003
    title: Pricing and packaging evidence
    columns:
      - Offer
      - Price / unit / contract model
      - Included capabilities evidenced
      - Discounts or unknowns
      - Diligence implication
    rows:
      - ["Terran R reusable mission", "Not disclosed in reviewed official pages", "Published LEO and GTO payload ratings with downrange landing", "Deposits, discounts, cancellation rights, and realized pricing unknown", "Obtain a live proposal and executed-contract cohort"]
      - ["Terran R expendable mission", "Not disclosed in reviewed official pages", "Published 33,500 kg LEO payload rating", "Mission-specific services and price premium unknown", "Request price bridge versus reusable configuration"]
      - ["SpaceX / Blue Origin / ULA", "Not available in retained competitor pages", "Named as direct or core alternatives", "No like-for-like package or terms retained", "Source current proposals on identical orbit and payload assumptions"]
      - ["Rocket Lab / emerging providers / status quo", "Not available or not directly comparable", "Broader alternative set only", "Vehicle class, schedule, integration, and insurance treatment differ", "Model mission-level total cost rather than headline price"]
    notes: "This is an evidence-availability comparison, not a price estimate; null commercial terms are material diligence gaps and should not be interpreted as zero."
    claimRefs: [CP001, CP007, CP008, CP009, CP010, CP011, CP016]
