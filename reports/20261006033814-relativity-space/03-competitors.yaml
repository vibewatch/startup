      - ["Delay, rideshare, redesign, or internal build", "Status quo and substitute", "Customer-specific and unavailable", "Payload owners with schedule or architecture flexibility", "Avoids committing immediately to an unproven vehicle", "Cost, feasibility, and switching burden depend on the mission"]
    notes: "Coverage is a reasoned landscape from three independent comparison pages plus CNBC; unknown cells are intentional, funding raised is not cash available, and no row implies equivalent payload class or readiness."
    claimRefs: [CP007, CP008, CP009, CP010, CP011, CP015]
