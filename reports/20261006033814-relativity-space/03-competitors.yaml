callouts:
  - calloutType: risk
    title: Execution proof dominates the current competitive verdict
    body: >-
      Terran R's capacity claims are relevant, but schedule movement and the absence of a Terran R
      flight record in the retained evidence leave mission assurance, cadence, recovery economics,
      and pricing as underwriting gaps rather than demonstrated advantages.
    claimRefs: [CP001, CP012, CP013, CP014, CP016]
