  - type: private-evidence-only
    severity: material
    topic: liquidity-and-contract-durability
    missingEvidence: >-
      Current cash, monthly burn, committed capital, debt and preference terms, customer deposits, cancellation rights,
      and supplier commitments.
    whyItMatters: >-
      Historical funding raised does not establish current runway or the durability of customer and supplier commitments
