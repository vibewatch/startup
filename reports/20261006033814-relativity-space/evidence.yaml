evidenceGaps:
  - type: conflicting-data
    severity: minor
    topic: founding
    missingEvidence: >-
      A primary formation record that reconciles the independently reported 2015 founding with the official page's
      "Since 2016" operating-history language.
    whyItMatters: The canonical company age should distinguish legal formation, incorporation, and the start of operations.
    diligencePath: Review the Delaware formation record and ask company counsel which date is used in corporate representations.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: capitalization-and-financials
    missingEvidence: >-
      Current fully diluted cap table, Series 0 investment amount and terms, current valuation, audited revenue, cash
      balance, burn, runway, and customer-level backlog terms.
    whyItMatters: >-
      These records determine common-equity value, security seniority, financing need, and whether reported contracts
      can support cash requirements.
    diligencePath: >-
      Request the amended charter, stock ledger, board roster, latest financing documents, audited financials, cash
      schedule, and redacted launch-service agreements under NDA.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      A complete current executive-team and board roster with appointment dates, reporting lines, and committee
      assignments.
    whyItMatters: >-
      The public evidence establishes CEO control but does not show the breadth of operating leadership or independent
      board oversight.
    diligencePath: Request the current organizational chart, board list, committee charters, and key-person succession plan.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: liquidity-constraints
    missingEvidence: >-
      Audited financial statements disclosing Relativity Space's current cash balance, monthly cash burn rate, and
      capital runway heading into Terran R flight testing.
    whyItMatters: >-
      Independent reporting indicates the company is running low on cash, which could delay or jeopardize Terran R's
      2026 maiden launch target if additional capital is not secured.
    diligencePath: >-
      Review subsequent funding announcements, venture debt filings, or strategic investor disclosures to determine
      capitalization runway through orbital qualification.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Comparable executed contracts or current proposals showing price, payload and orbit assumptions, deposits,
      discounts, cancellation rights, and remedies.
    whyItMatters: >-
      Without realized terms, headline vehicle capability cannot be translated into customer economics or a defensible
      price-performance comparison.
    diligencePath: >-
      Request anonymized executed-contract cohorts and solicit like-for-like proposals from Relativity and the
      shortlisted providers.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer-level evidence on integration work, schedule priority, rebooking rights, multi-homing, qualification
      transfer, and partner or launch-site constraints.
    whyItMatters: >-
      The commercial moat depends on whether signed customers can move missions easily when schedule, vehicle, or orbit
      assumptions change.
    diligencePath: >-
      Review master launch-service agreements, interview customers that rebooked missions, and map payload qualification
      work that must be repeated with another provider.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitor-benchmark
    missingEvidence: >-
      Vehicle-level current data for competitor payload, demonstrated cadence, mission success, recovery, insurance, and
      integration service.
    whyItMatters: >-
      The retained comparison pages identify peers but do not support a normalized capability, reliability, or
      total-cost benchmark.
    diligencePath: >-
      Build a vehicle-level benchmark from provider manuals, regulator records, launch manifests, customer contracts,
      and insurer evidence.
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: burn-and-runway
    missingEvidence: >-
      Audited financial statements showing cash on hand, monthly cash burn rate, gross margin projections, and forward
      runway under current headcount.
    whyItMatters: >-
      Without cash burn and liquidity disclosure, underwriters cannot determine whether existing capital will survive
      the Terran R maiden flight timeline without dilutive recapitalization.
    diligencePath: Request confidential management accounts, cash flow statements, and capital commitment schedules under NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: cap-table-terms
    missingEvidence: >-
      Exact security terms, liquidation preferences, dilution impact, and board control mechanisms governing Eric
      Schmidt's March 2025 controlling investment.
    whyItMatters: >-
      Different security classes determine junior shareholder recovery, dilution risk for early equity holders, and
      strategic exit options.
    diligencePath: Inspect amended Articles of Incorporation and latest Series E/controlling equity investor rights agreements.
    relatedQuestionRefs:
      - QI005
  - type: missing-source
    severity: material
    topic: backlog-contract-terms
    missingEvidence: >-
      Customer contract details detailing payment schedules, escrow deposit provisions, termination for convenience
      fees, and launch delay penalty thresholds.
    whyItMatters: >-
      High reported backlog may be subject to cancellation or refund demands if Terran R flight qualification slips
      beyond contractual delivery windows.
    diligencePath: >-
      Examine sample commercial launch service agreements with anchor customers including SES and Telesat during
      confirmatory diligence.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: orbital-stage-recovery
    missingEvidence: >-
      Flight telemetry, hot-fire logs, and recovery performance data demonstrating successful atmospheric reentry and
      propulsive landing of the Terran R first stage.
    whyItMatters: >-
      Terran R's economic model and launch pricing depend on reliable booster reusability; unproven reusability leaves
      turnaround costs and vehicle attrition unmodeled.
    diligencePath: >-
      Review A-2 stage test stand hot-fire results at NASA Stennis and initial flight demonstration telemetry upon
      maiden orbital attempt.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: additive-manufacturing-throughput
    missingEvidence: >-
      Audited cycle times, material defect rates, and qualification yield metrics for 3D-printed Aeon R engine
      components and Horizon manufacturing hardware.
    whyItMatters: >-
      Propulsion manufacturing bottlenecks or unverified print speeds directly jeopardize the targeted multi-mission
      launch manifest.
    diligencePath: >-
      Request internal engine build logs, non-destructive evaluation (NDE) inspection records, and print qualification
      data during technical diligence.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Customer-level renewal history, churn, gross and net retention, contract duration, satisfaction, and repeat-launch
      behavior.
    whyItMatters: >-
      Signed demand cannot establish durable adoption without evidence that customers remain contracted, renew, and
      expand after delivery.
    diligencePath: >-
      Review the contract cohort by signing date, renewal and termination events, customer references, mission
      manifests, and board-level retention reporting.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer backlog shares, deposits collected, cancellation and rebooking rights, pricing, milestone acceptance,
      and schedule remedies.
    whyItMatters: >-
      The conversion probability and downside of the reported backlog depend on enforceability, concentration, and
      customer remedies rather than headline value.
    diligencePath: >-
      Obtain a customer-by-customer backlog bridge with signed contract excerpts, cash deposits, cancellation history,
      expected launch dates, and margin by mission.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: minor
    topic: named-customers
    missingEvidence: >-
      A complete current roster reconciling legacy Terran 1 customers, Terran R customers, government eligibility,
      unnamed buyers, and superseded agreements.
    whyItMatters: Public names are a sample and cannot support a precise customer count or diversification conclusion.
    diligencePath: >-
      Reconcile the CRM, signed backlog schedule, launch manifest, and customer permission list against every public
      announcement.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-legal-and-safety
    missingEvidence: >-
      Primary FAA, range, environmental, court, enforcement, export-control, and safety records current to the planned
