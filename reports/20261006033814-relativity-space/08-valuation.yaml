company:
  name: "Relativity Space"
chapter:
  number: 8
  title: "Valuation"
  summary: "Relativity Space combines an ambitious software-defined 3D printing manufacturing model with an announced $2.9 billion commercial launch backlog, but faces significant execution risk following the retirement of Terran 1 and ongoing pre-flight development of Terran R. Secondary market pricing prints at $1.9 billion reflect an approximate 55% discount against the last priced $4.2 billion Series E valuation, warranting a disciplined 'Track' stance pending empirical orbital flight and stage recovery milestones."
sections:
  - id: "sec-investment-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "The core investment thesis for Relativity Space rests on its pioneering application of large-scale additive manufacturing to orbital launch vehicles, combined with commercial validation via an announced $2.9 billion contract backlog for Terran R. By deploying proprietary Stargate metal 3D printers, the company initially sought to reduce parts count by 100-fold and compress production cycles relative to legacy aerospace manufacturers. Furthermore, the arrival of former Google CEO Eric Schmidt in March 2025, who assumed executive leadership and acquired a controlling interest, substantially strengthens governance oversight, balance sheet resilience, and high-level strategic alignment for upcoming defense and commercial mega-constellation deployments. However, the anti-thesis centers on steep technical execution risk and strategic compromise. Following the March 2023 flight anomaly of Terran 1 during its second-stage burn, Relativity retired the smaller vehicle without achieving orbital insertion, pivoting all corporate resources to the heavier Terran R. In scaling Terran R to a 23,500 kg reusable LEO payload class, Relativity retreated from pure 3D printing for primary structures, procuring critical components such as fuel tank domes from conventional suppliers. This pivot positions Relativity directly against SpaceX's Falcon 9, creating an unproven competitive profile where pre-flight backlog cannot be treated as secure recurring revenue."
    tableRefs:
      - "TV002"
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV005"
      - "CV008"
      - "CV012"

  - id: "sec-valuation-mechanics"
    title: "Valuation History, Cap Table Mechanics, and Secondary Pricing"
    body: "Relativity Space's capitalization history reflects the aggressive capital availability of the 2020 to 2021 space tech expansion. The company secured $500 million in Series D capital in November 2020 at a $2.3 billion valuation, followed by a $650 million Series E round led by Fidelity in June 2021 at a peak post-money valuation of $4.2 billion, bringing cumulative equity raised to approximately $1.34 billion. While private intelligence rosters such as FundedIQ record historical rounds and TechStackIPO presents an illustrative pre-IPO modeled valuation of $9.5 billion with a moderate readiness score of 70, contemporary private market indicators signal meaningful valuation compression. Specifically, secondary intelligence platform QuantLogix estimates Relativity Space's equity valuation at $2.8 billion as of October 2026, marking a 34% decline from the Series E headline mark. This estimate is heavily weighted by a verified secondary market transaction executed at $1.9 billion in June 2026, implying an underlying discount exceeding 54%. In the absence of audited revenue figures, gross margin metrics, or public disclosure regarding Eric Schmidt's capital restructuring terms, potential investors must treat early round marks as obsolete and recognize substantial liquidation preference overhang across common and junior preferred share classes."
    tableRefs: []
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV006"
      - "CV009"
      - "CV013"
      - "CV015"

  - id: "sec-scenarios-comparables"
    title: "Scenario Framework, Market Comparables, and Valuation Multiples"
    body: "Evaluating Relativity Space requires benchmarking its operational stage against launch peers and establishing a scenario-based valuation framework. In the public markets, Rocket Lab trades at an enterprise value supported by dozens of proven Electron orbital missions and growing space systems revenue, while SpaceX commands an industry-leading valuation exceeding $150 billion anchored by Falcon 9's dominant launch cadence and Starlink constellation cash flows. In contrast, Relativity Space remains pre-revenue in orbital launch services. Its bull case ($6.0B to $8.5B) assumes a successful maiden launch of Terran R in late 2026, rapid operational transition to commercial flights in 2027, and monetization of its $2.9 billion backlog at attractive operating margins. The base case ($2.5B to $3.5B), carrying a 55% subjective probability, factors in maiden flight slippage into 2027, multi-flight iterative testing to achieve stage recovery, and price compression as customers negotiate delivery protections. Under this scenario, fair value converges around QuantLogix's $2.8 billion estimate. The bear case ($1.0B to $1.8B, 25% probability) models catastrophic stage test failures or prolonged ground infrastructure delays at Stennis A-2 or Cape Canaveral LC-16, leading to customer defections and dilutive recapitalizations."
    tableRefs:
      - "TV003"
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV010"
      - "CV011"
      - "CV014"

  - id: "sec-recommendation-diligence"
    title: "Final Recommendation, Decision Logic, and Diligence Asks"
    body: "We conclude our valuation assessment with a 'Track' recommendation, supported by a 'Stretched' valuation stance and a 'High' risk rating with 'Medium' analytical confidence. While the market opportunity for a reusable medium-to-heavy lift alternative to SpaceX is vast, committing fresh growth equity at valuations mirroring the 2021 peak of $4.2 billion is unsupported by public evidence. Even secondary pricing marks of $1.9 billion to $2.8 billion carry substantial downside exposure if the Aeon R engine cluster or Terran R stage separation encounters developmental hurdles. Investors should defer capital deployment until key technical de-risking milestones are achieved. Primary diligence asks required before considering equity entry include: first, inspecting audited financial statements to determine net cash burn and operational runway; second, auditing customer backlog agreements to verify upfront non-refundable cash deposits and termination penalties; third, reviewing full-duration static fire telemetry from the Stennis A-2 test stand; and fourth, obtaining complete capitalization table schedules detailing Eric Schmidt's seniority, control rights, and liquidation preference multiples."
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV008"
      - "CV014"
      - "CV015"

