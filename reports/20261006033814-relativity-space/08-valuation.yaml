callouts:
  - calloutType: recommendation
    title: "Diligence Callout: Maintain Track Stance Pending Terran R Flight Milestones"
    body: "Relativity Space combines world-class technological ambition in large-scale metal additive manufacturing with an impressive $2.9 billion commercial backlog. However, with the retirement of Terran 1 after its maiden launch anomaly and Terran R remaining pre-flight through late 2026, the company faces substantial technical execution risk. Recent secondary market prints at $1.9 billion reflect an approximate 55% discount from the headline Series E valuation of $4.2 billion, indicating private market wariness. Investors should maintain a 'Track' stance and await successful orbital insertion and stage recovery proof before committing growth equity."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV004"
      - "CV008"
      - "CV014"

  - calloutType: risk
    title: "Valuation Risk: Dilution and Liquidation Preference Overhang"
    body: "With more than $1.34 billion in total equity raised across multiple private rounds and Eric Schmidt assuming control in March 2025, new growth investors face potential structural overhang from senior liquidation preferences and undisclosed governance terms. If Terran R flight test slips into 2027, the substantial capital requirements of medium-to-heavy lift rocket manufacturing may trigger additional dilutive capital infusions, further compressing common and junior preferred share value."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV014"
