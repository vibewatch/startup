companyProfile:
  summary: >-
    Relativity Space is a Long Beach-based private aerospace manufacturer building Terran R, a reusable
    medium-to-heavy-lift launch vehicle, and commercializing adjacent manufacturing capabilities. The company moved from
    co-founder-led development to Eric Schmidt's 2025 control investment and executive leadership, and it now reports
    2,000 employees, five U.S. locations, and more than $3 billion in pre-sold launch contracts. The business remains
    pre-flight, so demand evidence is real but revenue conversion and flight execution still need to be proven.
