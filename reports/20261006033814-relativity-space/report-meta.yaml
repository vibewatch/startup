  topStrengths:
    - >-
      Real demand exists before first flight: the company reports more than $3 billion in pre-sold launch contracts and
      still surfaces named customer activity.
    - >-
      Relativity retains a differentiated manufacturing stack and continues to show industrial-scale buildout, facility
      development, and program milestones around Terran R.
    - >-
      Schmidt's control investment appears to have improved governance continuity and likely runway relative to a purely
      venture-financed path.
    - >-
      The customer mix spans commercial satellite operators and government-adjacent launch demand, which broadens the
      eventual addressable market if flight execution arrives.
  topRisks:
    - >-
      Terran R remains pre-flight: no public source in the reviewed pack shows an integrated stage hot-fire, orbital
      mission, booster recovery, or reflight, so the core reuse-and-cadence thesis is unproven.
    - >-
      Capital intensity is high and liquidity is opaque. Public reporting still does not disclose the audited cash
      balance, burn rate, or post-Schmidt financing terms.
    - >-
      Backlog quality is hard to underwrite because public sources do not disclose deposit schedules, milestone billing,
      cancellation protections, or customer concentration.
    - >-
      Competition remains severe from incumbents and near-peer entrants, especially before Terran R establishes flight
      heritage.
    - >-
      Strategic focus risk persists because management is still balancing launch development, manufacturing
      commercialization, and program execution simultaneously.
  unresolvedGaps:
    - >-
      Exact post-Schmidt cap-table terms, ownership percentage, security seniority, and dilution mechanics are not
      public.
    - >-
      No audited revenue, cash, burn, gross-margin, or ARR disclosure was found, and any public revenue figures remain
      estimated only.
    - >-
      Public sources do not disclose customer-level backlog concentration, deposits, cancellation rights, or rebooking
      behavior after the Terran 1 reset.
    - >-
      The reviewed pack still lacks Terran R flight evidence such as a public stage hot-fire result, first launch
      outcome, recovery data, or route into Lane 1 task-order eligibility.
    - >-
      The reviewed sources do not conclusively reconcile whether the company's canonical founding date should be treated
      as 2015 or 2016.
