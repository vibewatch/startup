callouts:
  - calloutType: "risk"
    title: "High Capital Intensity and Pre-Flight Liquidity Pressure"
    body: "The commercial aerospace manufacturing sector demands immense capital expenditure for tooling, engine qualification, and launch complex infrastructure. Independent reporting in late 2024 highlighted potential liquidity strains, making execution of Terran R's flight schedule critical to avoiding dilutive recapitalizations."
    claimRefs:
      - "CM008"
      - "CM010"
  - calloutType: "insight"
    title: "Commercial Backlog Does Not Guarantee Solvency"
    body: "Relativity's $2.9 billion commercial backlog demonstrates robust customer demand for alternatives to SpaceX's Falcon 9. However, because launch service contracts are milestone-contingent and pre-operational, converting backlog into cash requires meeting strict technical milestones and delivering orbital payload insertion."
    claimRefs:
      - "CM003"
      - "CM011"
