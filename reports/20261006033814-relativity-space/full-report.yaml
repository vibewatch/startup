      - number: '7.3'
        title: Capital, Governance, and Counterparty Dependencies
        blocks:
          - type: paragraph
            body: >-
              The financial risk is capital intensity rather than a quantified cash-runway conclusion. CNBC reported a
              $650 million Series E in June 2021 and $1.34 billion raised since founding at that point; it also reported
              that management intended the new capital to accelerate production and launch cadence. Funding raised is
              not cash still available in 2026, and the assigned sources contain no current balance sheet, burn,
              revenue, or margin disclosure. Governance also changed materially: the current company leadership page
              names Eric Schmidt chief executive officer and executive chairman, while an independent synthesis reports
              that he took a controlling interest in 2025. That can provide strategic backing but also concentrates
              key-person and ownership dependency.
            claimRefs:
