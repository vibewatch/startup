              - CP015
      - number: '3.3'
        title: Pricing, packaging, and route to purchase
        blocks:
          - type: paragraph
            body: >-
              The supplied current official pages disclose payload capability and engineering milestones, but not a
              Terran R list price, realized contract price, deposit schedule, cancellation right, volume discount, or
              service-level remedy. The retained competitor enumerations likewise do not provide comparable price or
              contract terms for SpaceX, Blue Origin, ULA, Rocket Lab, or emerging providers. Consequently, no
              defensible price-per-kilogram or total-mission-cost comparison can be calculated from this evidence set.
              Relativity's historical fundraising scale supports continued development capacity, but funding raised is
              neither customer revenue nor proof that its launch offer is cheaper. Procurement diligence must compare
              actual proposals, schedule guarantees, integration services, insurance treatment, and milestone-payment
              risk.
            claimRefs:
              - CP011
              - CP015
