  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Launch Pricing Architecture, and Backlog Recognition
        blocks:
          - type: paragraph
            body: >-
              Relativity Space has structured its commercial revenue model around heavy-payload orbital launch services,
              supplemented by secondary mission slots, defense task-order vehicles, and speculative future payload
              hosting. Prior to the retirement of its small-lift Terran 1 rocket following a second-stage anomaly during
              its March 2023 demonstration flight, the company marketed dedicated small-satellite launches at list
              prices near $12 million. Following the strategic pivot entirely toward Terran R—a two-stage reusable
              vehicle designed to loft up to 23,500 kg to Low Earth Orbit (LEO) with downrange landing—Relativity
              transitioned its commercial sales motion toward commercial constellation operators and institutional
              buyers. Commercial agreements with satellite constellation operators including SES, Telesat, Iridium, and
              OneWeb established a contracted backlog reported at $1.8 billion to $2 billion across at least nine
              customers. Furthermore, access to NASA's Launch Services II (NLS II) and the U.S. Space Force's $5.6
              billion National Security Space Launch (NSSL) Phase 3 Lane 1 indefinite-delivery/indefinite-quantity
              (IDIQ) framework broadens addressable federal procurement. However, in orbital launch contracting, signed
              commercial manifests do not represent completed revenue or unconditional cash deposits. Customer launch
              contracts routinely contain negotiated off-ramps, liquidated delay damages, rebooking options, and
              performance milestone dependencies. Because Terran R remains in ground development without an orbital
              flight test, recognized revenue from operational flight services remains effectively zero, making reported
              backlog figures a proxy for unearned demand rather than bankable operating cash flow.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
