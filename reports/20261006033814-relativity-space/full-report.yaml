      - number: '3.2'
        title: Capability, proof, and trust
        blocks:
          - type: paragraph
            body: >-
              Relativity publishes a 23,500 kg reusable LEO rating with downrange landing, 5,500 kg to GTO with
              downrange landing, and 33,500 kg to LEO when expendable. That specification places Terran R in a
              meaningful medium-to-heavy-lift buying conversation, but it is not equivalent to demonstrated cadence,
              mission assurance, or recovery economics. The June 2026 update records initial stage-one proof cases,
              completed acceptance testing for flight-one Aeon R first-stage engines, the start of Aeon V acceptance
              testing, and continued LC-16 construction. Those are tangible readiness signals, yet the historical Terran
              1 flight failed to reach orbit and the vehicle was retired after its maiden mission. Buyers therefore face
              a proof gap between published capacity and repeatable delivery.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP011
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
