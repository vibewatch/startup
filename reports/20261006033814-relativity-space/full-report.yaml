  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Relativity Space is a private American aerospace manufacturer headquartered in Long Beach, California.
              Independent profiles identify Tim Ellis and Jordan Noone as its founders in 2015, while the current
              company About page describes its organizational history as running "Since 2016"; the difference may
              reflect formation versus operating history and should not be collapsed into a single unsupported date. The
              operating thesis is launch services built around Terran R, a reusable medium-to-heavy-lift rocket,
              supported by in-house propulsion and manufacturing capabilities. This remains a development-stage business
              rather than a proven recurring-revenue launch operator: Terran R has not flown, and the available evidence
              does not disclose audited revenue, ARR, profitability, cash, or burn.
