      - number: '6.2'
        title: Adoption evidence is contractual, not operational
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption signal is contracted demand before service entry. Third-party summaries describe a
              progression from pre-sold Terran 1 launches to more than $1 billion of Terran R contracts in 2023, a
              nine-customer and $1.8 billion order-book snapshot of unclear date, and a reported Terran R backlog above
              $2.9 billion in 2025. Named relationships include OneWeb, Intelsat, SES, NASA, and Impulse Space. These
              figures use different dates and scopes and should not be added together. More importantly, backlog is
              neither recognized revenue nor proof of deposits, cancellation protection, launch readiness, or realized
              gross margin.
            claimRefs:
