            title: Thesis-Break Trigger
            body: >-
              Treat the investment thesis as broken if Terran R lacks a credible approval and integrated-test path into
              its stated flight window, if initial missions fail to achieve orbit without a funded corrective plan, or
              if verified liquidity cannot carry the program through remediation.
            calloutType: risk
            claimRefs:
