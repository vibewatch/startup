      - number: '7.4'
        title: Mitigations, Monitoring Indicators, and Thesis Breaks
        blocks:
          - type: paragraph
            body: >-
              Observable mitigation signals include named executives for manufacturing and supply chain, test and
              launch, information systems, and strategic affairs; recruiting for workforce controls; and participation
              in the NSSL Phase 3 Lane 1 program. These are capability and access signals, not proof of successful
              execution or contracted revenue. Monitoring should therefore focus on primary evidence: first-stage
              integrated test completion, launch-license and range approvals, demonstrated orbital performance, supplier
              qualification, customer contract durability, and audited liquidity. The thesis should break if licensing
              lacks a credible path to the planned flight window, integrated testing repeatedly misses disclosed
              milestones, initial Terran R missions fail to reach orbit, or verified liquidity cannot fund the program
              through corrective action.
            claimRefs:
