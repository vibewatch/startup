      - number: '6.3'
        title: Durability and expansion remain unproven
        blocks:
          - type: paragraph
            body: >-
              Multi-year and multi-launch language suggests a pathway from an initial vehicle selection to repeat
              missions, and SES's reported addition of previously unannounced missions is the clearest public expansion
              signal in the reviewed set. However, no source in the assigned evidence discloses renewal rates, contract
              length by customer, churn, gross or net retention, deposits, termination rights, rebooking behavior, or
              customer-level backlog shares. Without those terms, a large headline backlog cannot establish revenue
              durability or diversification. The customer journey therefore has a strong demand-discovery stage but
              unresolved conversion and repeat-use stages.
            claimRefs:
              - CU006
              - CU007
              - CU015
              - CU016
