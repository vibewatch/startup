      - number: '4.2'
        title: Capital Adequacy, Financing Structure, and Ongoing Cash Burn
        blocks:
          - type: paragraph
            body: >-
              Relativity's cumulative equity financing reached approximately $1.34 billion across eight documented
              rounds through its Series E financing in June 2021, when Fidelity Management & Research led a $650 million
              injection valuing the enterprise at $4.2 billion post-money alongside Tiger Global, Baillie Gifford,
              Coatue, and BlackRock. In March 2025, former Google CEO Eric Schmidt completed a major private capital
              investment, assuming executive control and direct leadership as CEO and Executive Chairman, succeeding
              co-founder Tim Ellis. While this sponsor-backed control shift provided critical near-term runway and
              insulated the company from distressed venture market conditions, historical benchmarks demonstrate that
              developing a reusable medium-to-heavy-lift orbital launch system requires between $1 billion and $2
              billion in dedicated development capital. With an estimated workforce of approximately 2,000 employees and
              significant infrastructure commitments spanning Long Beach headquarters, NASA Stennis Space Center test
              facilities, and Cape Canaveral Launch Complex 16, ongoing operational burn remains substantial. Without
              audited public disclosures regarding post-Schmidt cash balances, monthly cash burn, or debt obligations,
              underwriting forward capital adequacy depends entirely on whether Schmidt's financial backing can sustain
              vehicle acceptance testing and launch operations until recurring commercial revenue materializes.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Unit Economics, Cost Structure, and Underwriting Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              The core unit economics thesis for Relativity Space relies on the combination of proprietary metal
              additive manufacturing (Stargate 3D printers) and booster reusability to achieve step-function cost
              reductions over conventional aerospace fabrication. Historically, Relativity asserted that additive
              manufacturing would reduce rocket part counts 100-fold and compress production cycle times from years to
              under 60 days. In an operational reuse scenario, first-stage recovery amortizes capital expenditure across
              multiple flights, leaving recurring marginal costs confined to second-stage fabrication, propellants,
              launch pad operations, range fees, and vehicle refurbishment. Nevertheless, these unit-economic advantages
              remain theoretical while Terran R is pre-flight. Realized gross margin cannot be audited, private
              secondary transactions indicate valuation compression from 2021 peaks, and commercial launch pricing faces
              aggressive competitive pressure from SpaceX's high-cadence Falcon 9 fleet. For institutional underwriting,
              Relativity represents an unproven asset where commercial launch backlog, gross margins, and forward cash
              runway remain shielded behind private-company opacity, necessitating strict diligence verification before
              committing capital.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Backlog Realization Risk Under Extended Flight Schedule Slippage
            body: >-
              Relativity's widely reported $1.8B to $2B+ commercial backlog represents customer launch reservations
              rather than guaranteed cash receipts. Because satellite operators like SES and Telesat must deploy orbital
              assets within strict regulatory spectrum deadlines, prolonged development delays or slips past targeted
              late-2026 maiden flight milestones expose Relativity to customer rebooking or contract cancellation.
            calloutType: risk
            claimRefs:
              - CI002
              - CI005
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Vehicle Architecture and Payload Capabilities
        blocks:
          - type: paragraph
            body: >-
              Relativity Space's flagship product offering is Terran R, a two-stage medium-to-heavy-lift orbital launch
              vehicle designed to address satellite constellation deployment and government launch requirements. In its
              baseline reusable configuration with downrange booster landing, Terran R is targeted to deliver 23,500 kg
              to low Earth orbit (LEO) and 5,500 kg to geosynchronous transfer orbit (GTO). In an expendable flight
              profile, advertised payload capacity increases to 33,500 kg to LEO. This payload envelope positions Terran
              R directly against the SpaceX Falcon 9 workhorse class while offering dedicated lift capacity above
              typical small-launch providers. The vehicle architecture succeeds Relativity's inaugural Terran 1
              demonstrator, an expendable small launcher that reached maximum aerodynamic pressure during its March 2023
              flight but suffered an upper-stage anomaly and was subsequently retired. By pivoting entirely to Terran R,
              the company redirected its engineering resources toward medium-and-heavy-lift launch services, where
              commercial satellite mega-constellations demand higher lift capacities and reusable economics.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
              - CE011
              - CE013
      - number: '5.2'
        title: Propulsion Stack and Subsystem Engineering
        blocks:
          - type: paragraph
            body: >-
              The Terran R propulsion architecture relies on liquid oxygen (LOX) and liquid natural gas/methane
              propellants across both stages. The first-stage booster is powered by a cluster of 13 Aeon R gas generator
              cycle rocket engines generating approximately 3.5 million pounds of combined liftoff thrust. Nine of the
              center and intermediate engines are gimbaled to provide thrust vector control during ascent, boostback,
              and landing maneuvers, while four outer perimeter engines remain fixed. The second stage utilizes a single
              vacuum-optimized Aeon V engine delivering 323,000 pounds of vacuum thrust. Both engine variants utilize
              proprietary 3D-printed copper alloy components to integrate complex internal cooling channels and
              turbomachinery manifolds that would be difficult or cost-prohibitive to machine conventionally.
              Development of the vehicle passed preliminary design review in December 2023 and completed critical design
              review in December 2024, clearing the way for integrated subsystem qualification across the propulsion
              cluster.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: figure
            figureRef: FE001
