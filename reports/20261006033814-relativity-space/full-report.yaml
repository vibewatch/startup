      - number: '6.4'
        title: Delivery proof is the gating customer risk
        blocks:
          - type: paragraph
            body: >-
              The central customer-risk distinction is between signing demand and delivering a payload. Terran 1's only
              flight carried no payload and did not reach orbit, while the investment report in the pool explicitly
              identifies the lack of an operational track record as a trust risk. Relativity's current job materials
              show internal work on enterprise applications, manufacturing systems, supplier sourcing, lead times, and
              purchase-order execution. Those activities are consistent with a company preparing to scale, but
              company-issued recruiting language is not independent evidence of operational readiness. Diligence should
              test manifested missions, customer acceptance criteria, schedule remedies, and procurement bottlenecks
              before assigning high confidence to backlog conversion.
            claimRefs:
              - CU010
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand validation precedes product validation
            body: >-
              The reported backlog and named agreements show buyer interest, but they do not substitute for successful
              payload delivery or customer outcome evidence.
            calloutType: insight
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
          - type: callout
            title: Contract quality is the key hidden variable
            body: >-
              Customer-level concentration, deposits, termination rights, pricing, and rebooking behavior are required
              to translate backlog into durable revenue.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Ranking and Evidence Limits
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is Terran R program execution because Relativity's only orbital attempt,
              Terran 1, suffered an upper-stage anomaly and did not reach orbit before the vehicle was retired. Schedule
              evidence also moved materially: a 2021 industry report said commercial Terran R launches would begin in
              2024, while the reviewed company history records a later expectation of no earlier than 2026. This
              comparison supports an elevated schedule-risk judgment, not a precise probability forecast. The assigned
              source set contains no direct licensing docket, court record, safety determination, audited financial
              statement, or incident register, so legal, liquidity, and safety conclusions remain explicitly unverified.
            claimRefs:
              - CR003
              - CR004
