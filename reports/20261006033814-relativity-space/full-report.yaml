          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP016
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Relativity's differentiated thesis remains rapid design iteration through additive manufacturing combined
              with a reusable launch architecture. The durability of that thesis is narrower than an "entirely printed
              rocket" narrative suggests: the reviewed secondary source says Terran R moved away from additive
              manufacturing for fuel tanks and uses outside suppliers for items including tank domes and fairings. That
              may be a pragmatic industrial choice, but it also means supplier access, qualification throughput,
              launch-site execution, and flight learning can matter as much as proprietary printing. Schedule evidence
              is adverse: 2021 sources described a 2024 commercial-launch target, whereas the reviewed 2026 secondary
              source moved the expectation to no earlier than 2026. Until Terran R produces repeatable flight and
              recovery evidence, incumbent cadence and customer trust can outweigh nominal payload differentiation.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Execution proof dominates the current competitive verdict
            body: >-
              Terran R's capacity claims are relevant, but schedule movement and the absence of a Terran R flight record
              in the retained evidence leave mission assurance, cadence, recovery economics, and pricing as underwriting
              gaps rather than demonstrated advantages.
            calloutType: risk
            claimRefs:
              - CP001
              - CP012
              - CP013
              - CP014
