        title: Operating Scale, Contract Signals, and Milestones
        blocks:
          - type: paragraph
            body: >-
              The company reports 2,000 employees and five U.S. locations spanning California, Mississippi, Florida,
              Washington, D.C., and Seattle. Its About page also reports more than $3 billion in pre-sold launch
              contracts across more than a dozen customers; this is contractual backlog, not recognized revenue or cash.
