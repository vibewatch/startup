      - number: '5.3'
        title: Manufacturing Model and Qualification Testing
        blocks:
          - type: paragraph
            body: >-
              Relativity has restructured its manufacturing philosophy from its founding concept of printing 95 percent
              of the entire rocket structure to a pragmatic hybrid production model. Primary rocket structures,
              including cylindrical propellant tank barrels, large domes, and payload fairings, now leverage
              conventional aerospace aluminum alloys and specialized external suppliers. In-house additive manufacturing
              remains concentrated on high-value, geometrically complex assemblies such as the Aeon R thrust structure,
              injector assemblies, internal fluid baffles, and structural stringers. At its Long Beach headquarters, the
              company completed structural assembly of the first-stage qualification article in June 2026 and began
              static mechanical proof and pressurized load testing. Rigorous component-level test procedures govern
              fluid, pneumatic, electrical, and avionics subassemblies under established military-standard testing
              protocols prior to full engine and stage acceptance. This hybrid production approach aims to eliminate
              additive manufacturing bottlenecks while preserving the agility of additive prototyping for intricate
              engine parts.
            claimRefs:
              - CE009
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE008
              - CE009
              - CE012
              - CE014
      - number: '5.4'
        title: Testing Infrastructure and Program Roadmap
        blocks:
          - type: paragraph
            body: >-
              Relativity's operational testing and launch footprint spans major aerospace facilities at NASA's Stennis
              Space Center in Mississippi and Cape Canaveral Space Force Station in Florida. At Stennis, Relativity
              completed acceptance testing for all flight-one Aeon R booster engines on the dedicated R Stand and
              initiated acceptance testing for the upper-stage Aeon V engine. Concurrently, the Terran R second-stage
              test article arrived at Stennis via barge transport to prepare for vertical stage hot-fire trials at the
              newly leased and upgraded A-2 test stand, which features a 1.4-million-pound flame diverter. At Cape
              Canaveral Launch Complex 16, infrastructure enhancements continue with the horizontal integration facility
              crane installations, water deluge tanks, and cryogenic propellant farms. Beyond commercial launch
              services, Relativity announced the Interplanetary Sciences Program to develop deep-space science
              platforms. However, Terran R remains entirely pre-flight, and significant diligence risks persist
              regarding vacuum stage ignition, first-stage aerodynamic recovery, and commercial flight cadence.
            claimRefs:
              - CE003
              - CE008
              - CE014
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE006
              - CE008
              - CE009
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Pre-Flight Status and Staging Validation Gap
            body: >-
              Although component qualification for the first-stage Aeon R engine cluster has matured, Terran R has yet
              to perform a full-stage hot fire at NASA Stennis or an orbital flight test. The loss of Terran 1 due to
              upper-stage ignition failure underscores the critical importance of validating vacuum ignition and stage
              separation dynamics before entering commercial service.
            calloutType: risk
            claimRefs:
              - CE008
              - CE010
              - CE014
              - CE015
          - type: callout
            title: Strategic Evolution Toward Hybrid Manufacturing
            body: >-
              Relativity has transitioned from its initial marketing narrative of printing 95 percent of the rocket to
              an industrial hybrid approach. By pairing additive manufacturing for complex engine manifolds and thrust
              structures with standard aluminum fabrication for large cylindrical tanks, the company reduces production
              bottlenecks while retaining design agility.
            calloutType: insight
            claimRefs:
              - CE009
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments and jobs to be done
        blocks:
          - type: paragraph
            body: >-
              Relativity's customer proposition is launch capacity rather than a recurring software seat: satellite
              operators, constellation builders, civil agencies, and national-security buyers procure orbital delivery
              for payloads with different mission, schedule, and assurance requirements. Publicly named relationships
              span commercial constellation deployment, fixed-satellite services, government launch programs, and
              exploration missions. The company currently markets Terran R capacities of 23,500 kg to low Earth orbit
              with downrange landing, 5,500 kg to geosynchronous transfer orbit with downrange landing, and 33,500 kg to
              low Earth orbit in an expendable configuration. Those specifications define addressable use cases, but
              they are not evidence that customers have flown on Terran R.
            claimRefs:
