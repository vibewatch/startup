      - number: '1.2'
        title: Leadership, Governance, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              Eric Schmidt became chief executive in 2025, replacing co-founder Tim Ellis, while the official company
              page explicitly frames the change as a new chapter under Schmidt's leadership. Independent reporting
              summarized in the assigned evidence says Schmidt took a controlling interest and Ellis remained on the
              board. A review of the March 2025 charter describes a simplified capital structure in which Series 0
              directors receive collective voting power equal to the total authorized board, concentrating governance
              around Schmidt's financing vehicle. That same review reports a 30% annual Series 0 dividend that can rise
              to 45% after a triggering event. These are material control and seniority terms, but exact ownership,
              board composition, security balances, and dilution are not public in the retained sources.
            claimRefs:
              - CO005
