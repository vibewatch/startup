      - number: '1.3'
        title: Financing History and Stakeholder Structure
        blocks:
          - type: paragraph
            body: >-
              Relativity's last broadly disclosed institutional pricing predates its current control structure. In
              November 2020, it raised $500 million in a Series D associated with a $2.3 billion valuation. In June
              2021, Fidelity led a $650 million Series E; CNBC reported that the transaction brought cumulative capital
              raised to $1.34 billion and increased valuation to $4.2 billion. Those figures describe historical
              financing, not current cash available or a current valuation. Fidelity, Tiger Global, BlackRock, Coatue,
              and other investors supplied the venture capital base, but Schmidt's later control investment changed the
              economic hierarchy. The absence of current cap-table and liquidity data prevents a reliable estimate of
              common equity value or runway.
