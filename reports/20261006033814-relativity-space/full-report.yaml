      - number: '7.2'
        title: Technical and Operational Execution
        blocks:
          - type: paragraph
            body: >-
              Terran R combines unproven flight execution with a complex operating footprint. Relativity currently
              describes the rocket as under construction and publishes payload targets, but those specifications are
              company claims rather than demonstrated mission performance. Independent synthesis says the design uses
              outside suppliers for tank domes and fairings, adding interface and schedule dependencies to an already
              difficult integration program. Company-issued recruiting material also describes information technology
              spanning the production floor through flight operations, while a separate workforce-operations role
              emphasizes data integrity, compliance, reporting, and audit readiness. Those roles indicate management
              attention to controls, but hiring descriptions do not prove that controls are implemented or effective.
            claimRefs:
