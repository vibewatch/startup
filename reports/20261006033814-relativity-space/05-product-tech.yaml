company:
  name: "Relativity Space"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Relativity Space is developing Terran R, a two-stage partially reusable medium-to-heavy-lift rocket designed to deliver 23,500 kg to LEO with downrange landing. The vehicle utilizes a hybrid manufacturing approach combining additive manufacturing for 13 Aeon R first-stage engines with conventional tank structures, alongside testing operations at NASA Stennis and Cape Canaveral LC-16. While individual engine acceptance and structural qualification have advanced, Terran R remains pre-flight with integrated stage hot-fire and aerodynamic recovery yet to be demonstrated."
sections:
  - id: "vehicle-architecture-and-payload-capabilities"
    title: "Vehicle Architecture and Payload Capabilities"
    body: "Relativity Space's flagship product offering is Terran R, a two-stage medium-to-heavy-lift orbital launch vehicle designed to address satellite constellation deployment and government launch requirements. In its baseline reusable configuration with downrange booster landing, Terran R is targeted to deliver 23,500 kg to low Earth orbit (LEO) and 5,500 kg to geosynchronous transfer orbit (GTO). In an expendable flight profile, advertised payload capacity increases to 33,500 kg to LEO. This payload envelope positions Terran R directly against the SpaceX Falcon 9 workhorse class while offering dedicated lift capacity above typical small-launch providers. The vehicle architecture succeeds Relativity's inaugural Terran 1 demonstrator, an expendable small launcher that reached maximum aerodynamic pressure during its March 2023 flight but suffered an upper-stage anomaly and was subsequently retired. By pivoting entirely to Terran R, the company redirected its engineering resources toward medium-and-heavy-lift launch services, where commercial satellite mega-constellations demand higher lift capacities and reusable economics."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE002"
  - id: "propulsion-stack-and-subsystem-engineering"
    title: "Propulsion Stack and Subsystem Engineering"
    body: "The Terran R propulsion architecture relies on liquid oxygen (LOX) and liquid natural gas/methane propellants across both stages. The first-stage booster is powered by a cluster of 13 Aeon R gas generator cycle rocket engines generating approximately 3.5 million pounds of combined liftoff thrust. Nine of the center and intermediate engines are gimbaled to provide thrust vector control during ascent, boostback, and landing maneuvers, while four outer perimeter engines remain fixed. The second stage utilizes a single vacuum-optimized Aeon V engine delivering 323,000 pounds of vacuum thrust. Both engine variants utilize proprietary 3D-printed copper alloy components to integrate complex internal cooling channels and turbomachinery manifolds that would be difficult or cost-prohibitive to machine conventionally. Development of the vehicle passed preliminary design review in December 2023 and completed critical design review in December 2024, clearing the way for integrated subsystem qualification across the propulsion cluster."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
    figureRefs:
      - "FE001"
  - id: "manufacturing-model-and-qualification-testing"
    title: "Manufacturing Model and Qualification Testing"
    body: "Relativity has restructured its manufacturing philosophy from its founding concept of printing 95 percent of the entire rocket structure to a pragmatic hybrid production model. Primary rocket structures, including cylindrical propellant tank barrels, large domes, and payload fairings, now leverage conventional aerospace aluminum alloys and specialized external suppliers. In-house additive manufacturing remains concentrated on high-value, geometrically complex assemblies such as the Aeon R thrust structure, injector assemblies, internal fluid baffles, and structural stringers. At its Long Beach headquarters, the company completed structural assembly of the first-stage qualification article in June 2026 and began static mechanical proof and pressurized load testing. Rigorous component-level test procedures govern fluid, pneumatic, electrical, and avionics subassemblies under established military-standard testing protocols prior to full engine and stage acceptance. This hybrid production approach aims to eliminate additive manufacturing bottlenecks while preserving the agility of additive prototyping for intricate engine parts."
    claimRefs:
      - "CE009"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE003"
  - id: "testing-infrastructure-and-program-roadmap"
    title: "Testing Infrastructure and Program Roadmap"
    body: "Relativity's operational testing and launch footprint spans major aerospace facilities at NASA's Stennis Space Center in Mississippi and Cape Canaveral Space Force Station in Florida. At Stennis, Relativity completed acceptance testing for all flight-one Aeon R booster engines on the dedicated R Stand and initiated acceptance testing for the upper-stage Aeon V engine. Concurrently, the Terran R second-stage test article arrived at Stennis via barge transport to prepare for vertical stage hot-fire trials at the newly leased and upgraded A-2 test stand, which features a 1.4-million-pound flame diverter. At Cape Canaveral Launch Complex 16, infrastructure enhancements continue with the horizontal integration facility crane installations, water deluge tanks, and cryogenic propellant farms. Beyond commercial launch services, Relativity announced the Interplanetary Sciences Program to develop deep-space science platforms. However, Terran R remains entirely pre-flight, and significant diligence risks persist regarding vacuum stage ignition, first-stage aerodynamic recovery, and commercial flight cadence."
    claimRefs:
      - "CE003"
      - "CE008"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE001"
