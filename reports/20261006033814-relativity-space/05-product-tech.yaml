callouts:
  - calloutType: "risk"
    title: "Pre-Flight Status and Staging Validation Gap"
    body: "Although component qualification for the first-stage Aeon R engine cluster has matured, Terran R has yet to perform a full-stage hot fire at NASA Stennis or an orbital flight test. The loss of Terran 1 due to upper-stage ignition failure underscores the critical importance of validating vacuum ignition and stage separation dynamics before entering commercial service."
    claimRefs:
      - "CE008"
      - "CE010"
      - "CE014"
      - "CE015"
  - calloutType: "insight"
    title: "Strategic Evolution Toward Hybrid Manufacturing"
    body: "Relativity has transitioned from its initial marketing narrative of printing 95 percent of the rocket to an industrial hybrid approach. By pairing additive manufacturing for complex engine manifolds and thrust structures with standard aluminum fabrication for large cylindrical tanks, the company reduces production bottlenecks while retaining design agility."
    claimRefs:
      - "CE009"
      - "CE012"
