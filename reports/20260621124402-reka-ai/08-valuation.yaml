- id: TV005
  title: Thesis-break and kill triggers table
  notes: These thresholds are intended to convert a fuzzy late-stage AI story into clear pass/fail diligence gates.
  claimRefs:
  - CV033
  - CV034
  - CV035
  - CV036
  - CV039
  - CV040
