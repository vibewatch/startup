  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: Series B term sheet, liquidation preference, anti-dilution, pay-to-play, and side-letter summary for the 2025 round.
    whyItMatters: A clean headline valuation can still produce weak investor economics if downside protections or seniority are unusually aggressive.
    diligencePath: Request counsel-reviewed financing documents and board-approved cap-table summary before assigning any positive entry call.
    relatedQuestionRefs:
    - QV031
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: gross-margin-burn
    missingEvidence: Gross margin by product, compute/storage cost bridge, monthly burn, and runway analysis.
    whyItMatters: This evidence determines whether Reka behaves like scalable software or like capital-intensive infrastructure with headline-software pricing.
    diligencePath: Obtain CFO pack with monthly gross margin, burn, and infrastructure-cost bridge by product line.
    relatedQuestionRefs:
    - QV032
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: Snowflake-sourced pipeline, closed ARR, discounting rules, and any revenue-share or marketplace economics.
    whyItMatters: The Snowflake narrative is central to the bull case, but it can justify valuation only if it creates efficient and durable revenue.
    diligencePath: Review partnership agreement, booked ARR attribution, and funnel conversion data with the CRO and partnerships lead.
    relatedQuestionRefs:
    - QV033
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer and top-partner revenue share, renewal schedule, and design-partner dependency.
    whyItMatters: A concentrated revenue base would make the current valuation far more fragile than a diversified enterprise book.
    diligencePath: Request top-10 customer schedule, cohort retention, and contracted backlog by customer and by channel.
    relatedQuestionRefs:
    - QV034
    relatedTableRefs:
    - TV005
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-coverage
    missingEvidence: Clean same-date revenue and valuation pairs for every frontier or sovereign AI comparable in the retained set.
    whyItMatters: Comparable analysis remains partly heuristic where private rounds lack synchronized revenue disclosure.
    diligencePath: Expand the comp set only with additional fetch-reviewed sources that disclose both valuation timing and revenue timing more clearly.
    relatedTableRefs:
    - TV004
