  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current revenue and retention
    - Monthly ARR / revenue bridge, cohort retention, and expansion by product
    - Without this, the current round rests on stale or estimated top-line data
    - CFO and revenue-operations pack
  - - Gross margin and burn
    - Gross margin by product plus compute, storage, support, and burn bridge
    - Determines whether AI revenue is valuable revenue
    - CFO plus infrastructure leader
  - - Preference stack
    - Series B term sheet, liquidation preference, anti-dilution, and side-letter summary
    - A clean headline valuation can still produce weak investor economics
    - External counsel and board materials
  - - Channel economics
    - Snowflake-sourced pipeline, closed ARR, revenue share, and discounting rules
    - Tests whether the strategic channel is margin-accretive or margin-dilutive
    - CRO / partnerships lead
  - - Customer concentration
    - Top-10 customer mix, largest deployment, renewal calendar, and use-case concentration
    - Concentration can turn a promising growth curve into a cliff risk
    - CRO plus customer-success review
