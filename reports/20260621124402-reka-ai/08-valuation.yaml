  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Forward revenue miss
    - Run-rate still below $25M at the next financing checkpoint
    - Current mark stays above even optimistic forward multiple support
    - Pass or demand materially better entry terms
  - - Gross-margin miss
    - Product gross margin below 50%-55%
    - Efficient-model story looks more like compute resale than software leverage
    - Downgrade valuation range and model a down-round
  - - Preference overhang
    - Participating preferred, ratchets, or heavy seniority in 2025 round
    - Common/new-money upside gets capped even if operating progress is real
    - Require legal term review before any positive call
  - - Channel concentration
    - Snowflake or one partner accounts for an outsized share of pipeline or booked ARR
    - Strategic value becomes dependency instead of leverage
    - Discount the channel premium and tighten scenario weights
  - - Customer concentration / weak retention
    - Top five accounts dominate ARR or expansion stalls below healthy SaaS norms
    - Valuation becomes hostage to a small number of renewals
    - Treat growth as fragile rather than compounding
- id: TV006
  title: Final diligence asks table
  notes: These are the minimum private-data asks required to move from public framing to an underwritten price decision.
  claimRefs:
  - CV037
  - CV038
  - CV039
  - CV040
