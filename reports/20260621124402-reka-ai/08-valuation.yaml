chapter:
  number: 8
  title: Valuation
summary: Reka's latest >$1B valuation is understandable as a strategic-growth bet but not yet fully supported by public fundamentals. With roughly $10.9M of 2025 revenue estimated by GetLatka and about 60-64 employees tracked publicly, the round implies about 92x trailing revenue—richer than the public AI/platform anchors reviewed here and above most private enterprise-AI comparables that have disclosed far more scale. The price can still work if Snowflake-led distribution, multimodal workflow adoption, and software-like gross margins lift revenue toward $40M-$60M in the next 12-24 months, but the base case supported by public evidence remains below the current mark. The resulting stance is conditional monitor / pass at current price pending proof on forward run-rate, gross margin, customer concentration, and preference terms.
sections:
- id: recommendation-and-entry-discipline
  title: Recommendation Summary and Entry Discipline
  body: |-
    The public case for Reka begins with a real financing event, not a rumor: the company announced a $110 million raise in July 2025 backed by NVIDIA and Snowflake, while Reuters-syndicated coverage and private-company trackers placed the company above a $1 billion valuation. That is enough to treat the unicorn mark as real, but not enough to treat it as obviously attractive. The best public commercial signal still comes from GetLatka's estimate that Reka generated about $10.9 million of 2025 revenue with a roughly 60-person team, while Tracxn places the company around 64 employees and about $168 million of cumulative funding. Put together, the round implies roughly 92x trailing revenue and more than 15x cumulative funding to trailing revenue. Those are venture-style expectations, not present-day fundamentals.

    The round is also better understood as a strategic option value bet than as a clean trailing-multiple comp. Snowflake is not just a financial logo; its own partner materials say customers can bring Reka's multimodal assistant to enterprise data inside Snowflake, which gives a plausible channel to step-function revenue growth. Public reporting on 2024 acquisition talks between Snowflake and Reka around the $1 billion level adds further context: strategic buyers clearly saw the asset as important, but talks still stopped. That means there is strategic relevance, not a proven valuation floor. Our recommendation is therefore **CONDITIONAL MONITOR / PASS AT CURRENT PRICE**: investors should not underwrite the current mark as cheap, but should stay engaged if diligence can prove a much higher forward run-rate, strong gross margins, and a clean late-stage preference stack.
  claimRefs:
