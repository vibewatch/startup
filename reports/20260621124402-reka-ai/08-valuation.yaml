- id: comparable-framing
  title: Comparable Valuation Framing
  body: |-
    The private comparable set splits into two buckets. The first bucket is enterprise-AI application or platform companies that actually disclose meaningful scale. Cohere's 2025 ARR of about $240 million and valuation context around $7 billion imply a high-20s multiple; Glean's ARR trajectory to $300 million and $7.2 billion valuation likewise show that the market awards premium marks after a company has already crossed a revenue threshold that is many times larger than Reka's public revenue estimate. Harvey and Databricks make the same point from different angles: category leaders can absolutely reach $11 billion or $134 billion valuations, but only after much deeper workflow embed, customer penetration, or revenue scale than Reka has publicly shown.

    The second bucket is framing comps rather than clean multiple comps. Anthropic's fundraising history shows that cloud-linked contracts and threshold-based terms can distort the headline valuation conversation. Mistral's 2026 valuation rumor and Aleph Alpha's earlier sovereign-AI financing show that frontier or sovereign narratives can attract huge capital, but those companies are closer to foundation-model or state-backed strategic stories than to Reka's current enterprise-multimodal wedge. Public anchors are therefore more useful for discipline. Snowflake trades around 17x revenue, NVIDIA around 24x, Palantir around 69x, and C3.ai around 4x on the retained sources used here. Reka's implied ~92x trailing mark is above all of them, including the Palantir outlier. That does not prove the round is wrong—private AI can price on future optionality—but it does prove the current mark already embeds a lot of future success.
