  topStrengths:
    - Reka 把高效多模态模型与视觉、研究场景的工作流产品结合起来，并不只是销售通用聊天端点。
    - Snowflake 分销和 NVIDIA 背书融资，大幅提升了企业相关性，超过小型独立模型实验室通常能拿到的认可。
    - 与更大的前沿模型同行相比，公司看起来技术密度高、资本效率相对更好，因此在成本敏感的企业部署里有可能守住细分位置。
  topRisks:
    - 公开收入、利润率、烧钱速度、留存和客户集中度数据大多未披露，估值纪律只能依赖私下尽调。
    - 核心竞争横跨 OpenAI、Anthropic、Google、Mistral、Cohere 和开放权重替代方案；基础模型层的切换成本仍低。
    - 算力获取、安全 / 合规预期和伙伴渠道依赖，可能压缩利润率，或在市场趋同后削弱差异化。
  unresolvedGaps:
