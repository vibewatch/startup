    - Teams often need separate image, audio, and text pipelines
    - Chat API over a single OpenAI-compatible surface
    - Lower integration friction because multimodal content fits one request pattern
    - Short-video guidance still pushes longer assets into a separate Vision workflow
  - - Search a long video archive
    - Manual review or brittle CV stacks do not scale across hours of footage
