- id: architecture-operating-model
  title: Architecture and Operating Model
  body: 'The architectural split between Chat, Vision, Research, and Edge is the clearest clue to how Reka thinks about multimodal workloads. Chat is optimized for direct conversational inference, including short video clips, while Vision introduces a separate ingestion and indexing layer for longer visual corpora. The long-video path is explicit in the docs: upload by file or URL, optionally group assets, index them, then run semantic search, question answering, clip generation, and tagging over the resulting chunks. That is a materially different operating model from a single end-to-end chat completion call, and it reflects a belief that enterprise video retrieval needs pre-processing and retrieval structure rather than raw context stuffing.


    At the model layer, Edge is the most revealing artifact. Reka describes it as a roughly 7B-class vision-language model combining a ConvNeXt V2 vision encoder with a 6B-plus language backbone, designed to emit only 64 tokens per image tile. That token discipline is the heart of the company''s efficiency thesis: if high-resolution visual inputs can be represented compactly, latency, context pressure, and serving cost all improve at once. The Edge launch materials position this as physical-AI infrastructure for robots, cameras, vehicles, and wearables rather than a cloud-only assistant.


    Research and Flash show the same bias toward structured reasoning rather than brute-force scale. Research uses tool-augmented browsing over web and private documents, while Flash 3.1 is framed as a 21B reasoning model improved through reinforcement learning and then made easier to self-host through Llama-compatible release and quantization work. The result is a product architecture that tries to move value into orchestration, retrieval, and efficient model packaging instead of competing head-on in the largest-parameter race.'
  claimRefs:
