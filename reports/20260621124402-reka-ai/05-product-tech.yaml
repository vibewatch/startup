    severity: material
    topic: public-trust-gap
    missingEvidence: Publicly accessible SOC 2, ISO, uptime history, incident process, or equivalent trust-center documentation for Reka’s hosted products.
    whyItMatters: Regulated buyers can accept strong product capabilities only if operational and compliance evidence keeps pace; without it, procurement friction and vendor risk both rise.
    diligencePath: Ask management for current trust-center materials, audit reports, uptime commitments, and customer-facing support/SLA terms.
