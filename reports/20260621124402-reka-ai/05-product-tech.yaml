  - - Run grounded research across the web and private docs
    - Analysts manually browse, compare, and summarize sources
    - Reka Research with browsing, doc search, and parallel thinking
    - Better factual grounding and adjustable accuracy/cost trade-off versus plain chat
    - Benchmarking and trust still rely heavily on company-authored evidence
  - - Run multimodal reasoning near the device
    - Cloud round-trips add latency, privacy risk, and deployment complexity
    - Reka Edge local / on-prem / offline path
    - Edge packaging is a strong fit for robotics, surveillance, and other physical-AI loops
    - Open-weight commercial terms and production support scope remain a diligence item
