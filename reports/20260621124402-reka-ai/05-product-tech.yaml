    missingEvidence: Current independent benchmark runs or customer-grade validation for the latest Edge, Vision, and Research surfaces, not only Flash or company-authored studies.
    whyItMatters: The current thesis leans heavily on efficiency and workflow performance, but those advantages are harder to underwrite when third-party coverage of the newest surfaces is still thin.
