      - number: '2.2'
        title: Sizing Lenses and Addressable Spend
        blocks:
          - type: paragraph
            body: >-
              Public-market and analyst sources rarely isolate the exact slice Reka targets, so a single headline TAM
              would overstate precision. The best top-down anchor is Gartner’s 2026 AI-spending forecast, which pegs
              AI-model spend at $32.6B and AI-software spend at $453.2B, inside a total AI market of $2.596T. Gartner
              also states that multimodal capabilities will permeate enterprise software over the next several years,
              implying that model-layer value should increasingly migrate from text-only usage toward mixed-modality
              workflows.


              A second lens is structural rather than numeric. ResearchAndMarkets maps multimodal AI by data modality,
              vertical, technology, and region through 2035, while the Business Research Company segments foundation AI
              models across language, vision, multimodal, speech, and code applications. Those structures support a view
              that Reka’s commercial surface spans multiple end-markets—media and entertainment, government/public
              sector, manufacturing, retail, and enterprise knowledge workflows—rather than a single narrow vertical.


              A third lens is evidence-constrained and Reka-specific. If only 5-15% of Gartner’s 2026 AI-model-spend
              pool is ultimately allocated to enterprise multimodal reasoning, video understanding, and
              document-grounded research categories relevant to Reka, that implies roughly $1.6B to $4.9B of model-layer
              spend before adding deployment services or surrounding software. This is not a precise forecast; it is a
              conservative SAM-style heuristic intended to bound the category Reka can reasonably attack over the next
              few years without assuming it becomes a general-purpose hyperscaler.
