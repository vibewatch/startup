      - number: '7.4'
        title: People, Safety, and Execution Scaling Risk
        blocks:
          - type: paragraph
            body: >-
              Execution risk is amplified because Reka is trying to do several hard things simultaneously: ship
              frontier-adjacent multimodal products, satisfy privacy-sensitive enterprise buyers, support partner
              distribution, and keep pace with a rapidly changing regulatory perimeter. Public tracker data suggests a
              workforce of only about 60-64 people, which is impressive for the current product surface but also a
              warning that management bandwidth, safety operations, support coverage, and compliance specialization may
              be thinly spread. The external safety evidence is also uncomfortable. The multimodal safety report
              republished by the Cloud Security Alliance shows that image-based prompt injection and multimodal
              jailbreaks can sharply increase harmful outputs and dangerous information leakage under adversarial
              conditions. MIT's AI risk repository then broadens the point: harmful content, privacy leakage, model
              exploitation, and misinformation are not separate edge cases but a recurring cluster of risks that
              compound each other. Reka's own public change log shows ongoing feature and model changes, which is
              strategically positive but increases the need for disciplined release governance and regression testing.
              None of this proves that Reka is unsafe. It does prove that investors should underwrite the company as a
              live operational system with expanding attack surface, not just a model benchmark story. In a company of
              this size, one senior compliance, safety, platform, or enterprise-support gap can cascade into slower
              deals, weaker incident response, and higher churn risk.
