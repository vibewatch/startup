        - Discount the channel premium and tighten scenario weights
      - - Customer concentration / weak retention
        - Top five accounts dominate ARR or expansion stalls below healthy SaaS norms
        - Valuation becomes hostage to a small number of renewals
        - Treat growth as fragile rather than compounding
