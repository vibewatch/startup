      - number: '3.3'
        title: Distribution Power, Switching Costs, and Multi-Homing
        blocks:
          - type: paragraph
            body: >-
              Model APIs are more multi-homable than traditional enterprise software, so switching costs at the pure
              model layer are limited. Buyers can often test the same prompt flow across OpenAI, Anthropic, Gemini,
              Mistral, Cohere, and Reka with modest engineering effort. That reality weakens any claim that a
              stand-alone model API is a durable moat.


              Where stickiness starts to matter is above the model. Reka Vision and Reka Research embed workflow logic,
              indexing, alerting, and deployment patterns that are harder to swap than a base chat-completions endpoint.
              Once a customer has integrated video indexing into an existing VMS or connected a research workflow to
              internal files under security review, the cost of requalification rises materially. Snowflake distribution
              adds another source of stickiness: the closer the model sits to governed enterprise data, the more a buyer
              optimizes for security and operational convenience rather than raw benchmark delta.


              The countervailing force is bundle power from larger vendors. OpenAI, Google, and Anthropic can spread R&D
              across broader product lines. Snowflake itself can mediate demand by offering multiple third-party models
              in Cortex. Open models lower switching barriers further by giving sophisticated teams a credible
              internal-build fallback. In other words, Reka can create local lock-in around workflows and deployment,
              but it cannot assume global lock-in at the model category level.
