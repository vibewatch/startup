      - number: '1.4'
        title: Commercial Traction, Deployments, and Milestones
        blocks:
          - type: paragraph
            body: >-
              By mid-2025 Reka had moved beyond “model lab” status into identifiable commercial deployments. The
              clearest public customer proof is Shutterstock: the June 2024 partnership made Shutterstock both a data
              licensor and a paying customer using Reka to enrich metadata across its image and video library. That
              matters because it ties Reka’s multimodal pitch to a real production archive with legal-licensing
              constraints, metadata economics, and an enterprise buyer that cares about quality rather than novelty.


              The second major proof point is physical security. Reka Vision is positioned as an intelligence layer that
              sits alongside existing video-management systems instead of demanding rip-and-replace. Official product
              materials claim 65% faster case resolution and up to 95% fewer false alarms in deployments, while the
              Turing partnership states Guardian AI runs on Reka Vision across a footprint of 13,000+ sites and 10M+
              daily events and is already used by U.S. law-enforcement customers. Whether those outcomes generalize is
              still unproven, but they do show Reka targeting operational workflows with measurable ROI rather than
              generic chatbot use.


              The milestone record reinforces a company that is commercializing in stages: 2022 founding, 2023 external
              financing and Snowflake partnership, 2024 Shutterstock partnership and technical-report publication, 2025
              launch/GA of Vision and Research plus the unicorn round and Turing partnership. The defense-security page
              adds a final clue about strategic direction: Reka is deliberately courting sovereign and air-gapped
              deployments where model efficiency, privacy, and deployment portability matter as much as leaderboard
              performance.
