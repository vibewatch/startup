            body: >-
              Public financial visibility is thin but not zero. The strongest top-line signal is GetLatka's estimate
              that Reka reached $10.9M of revenue in 2025. That is not company-filed revenue and should not be treated
              as audited fact, but it is directionally useful because tracker sources broadly agree that Reka is now a
              unicorn with roughly 60-64 employees and two disclosed institutional rounds. If those figures are
              directionally right, the company has crossed from pre-revenue narrative into measurable commercialization,
              yet is still very early relative to the scale of capital it has raised.


              Those same tracker figures allow only rough proxies. Using the $10.9M estimate against 60-64 employees
              implies roughly $170k-$182k of revenue per employee, which is respectable for an early enterprise-AI
              vendor but still well below mature software benchmarks. Pairing the same revenue estimate with roughly
              $168M-$170M of total funding implies more than 15x capital raised to annual revenue, and pairing it with a
              $1B valuation implies a valuation-to-revenue multiple of roughly 92x. None of those derived metrics should
              be mistaken for true unit economics—they are cross-source estimates—but they do frame the underwriting
              question clearly: investors are paying for future platform leverage, not for currently disclosed cash
