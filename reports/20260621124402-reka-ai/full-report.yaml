  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Reka should not be analyzed as serving the entire AI market. The relevant market is the enterprise
              multimodal-model layer: software and services that let organizations reason over text, images, video,
              audio, and private documents under production governance constraints. Gartner’s multimodal forecast and
              the taxonomy in broader foundation-model reports both support this framing. In practice, Reka is selling
              into workflows where a plain text LLM is insufficient—security footage search, media-archive tagging,
              multimodal research, and governed enterprise AI embedded next to proprietary data.


              That definition includes four spending buckets. First is model consumption itself: API or managed-model
              usage. Second is enterprise application value layered on top of models, such as Reka Vision and Reka
              Research. Third is deployment and governance work required to run those systems inside a private cloud,
              VPC, on-premise environment, or air-gapped setting. Fourth is adjacent compute and data-infrastructure
              spend needed to make multimodal use cases performant enough for production.


              The boundary excludes several look-alike categories. Consumer chatbots are not the core market. Generic
              office copilots matter indirectly as substitutes, but they do not define the job-to-be-done for Reka’s
              buyers. Pure robotics hardware, generalized cloud IaaS, and one-off annotation services are also adjacent
              rather than core. The status quo alternatives are often manual review, keyword metadata systems, narrow
              computer-vision point tools, or internal buildouts using hyperscaler and open-source components.
            claimRefs:
