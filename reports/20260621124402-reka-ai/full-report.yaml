            body: >-
              Reka's public surfaces describe a company selling primarily to technical buyers, not mass-market
              consumers. The homepage and Vision materials repeatedly position the platform for enterprises, creators,
              and developers in security, media, defense, and other physical-world workflows, while the quickstart and
              pricing pages show a self-serve path for API-native builders. In practice that creates at least four
              distinct customer lanes: developers who want OpenAI-compatible multimodal APIs; enterprise security and
              operations teams that need search, alerts, and investigation over video; media and data-platform buyers
              that want metadata enrichment or content understanding at scale; and platform/channel partners that bundle
              Reka capabilities into their own product suites. The most attractive ICP is therefore an organization with
              large unstructured visual or multimodal datasets, an engineering team comfortable with API integration,
              and a clear business case for governed deployment. Buyers that need on-premise, VPC, or air-gapped
              deployment in defense, public safety, or regulated enterprise settings fit the product especially well.
              Smaller nontechnical teams can still experiment through the playground and prepaid API credits, but public
              materials suggest they will hit practical limits sooner because rate limits, implementation work, and
              enterprise-only features push serious production use toward a higher-touch motion.
