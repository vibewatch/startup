      - number: '5.5'
        title: Trust, Reliability, and Open Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The public trust and reliability surface is meaningful but still incomplete. On the positive side, Reka
              documents structured JSON errors, request IDs for log correlation, explicit client actions for
              400/401/404/429/500 states, and visible Vision rate-limit headers. The privacy policy is also more
              concrete than generic marketing copy: paid API content is not used for model training unless the customer
              opts in, while free or promotional usage may be used; uploaded documents may be temporarily staged in
              secure S3 with expiring links and time-bounded deletion; and the policy offers a vulnerability-reporting
              contact. Those are useful operating signals for enterprise developers.


              Vision's metadata-tagging surface adds another form of operational control by exposing content-oriented
              fields such as violence, profanity, adult content, drugs, alcohol, gambling, and political markers, plus
              descriptive tags and virality-oriented fields. That suggests Reka understands real deployments need
              classification and policy hooks, not only open-ended generation.


              Still, the fetched material did not surface the kind of audited trust center evidence that cautious buyers
              often want before moving sensitive workloads at scale: public SOC 2 or ISO references, a public uptime
              history, or clearly published support commitments comparable to larger incumbents. Independent reviews
              also underline that Reka remains enterprise- and developer-centric, with integration effort and
              revalidation overhead as practical costs. The technical story is strong; the operational proof layer is
              improving but not yet equally mature in public.
