  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation Summary and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The public case for Reka begins with a real financing event, not a rumor: the company announced a $110
              million raise in July 2025 backed by NVIDIA and Snowflake, while Reuters-syndicated coverage and
              private-company trackers placed the company above a $1 billion valuation. That is enough to treat the
              unicorn mark as real, but not enough to treat it as obviously attractive. The best public commercial
              signal still comes from GetLatka's estimate that Reka generated about $10.9 million of 2025 revenue with a
              roughly 60-person team, while Tracxn places the company around 64 employees and about $168 million of
              cumulative funding. Put together, the round implies roughly 92x trailing revenue and more than 15x
              cumulative funding to trailing revenue. Those are venture-style expectations, not present-day
              fundamentals.


              The round is also better understood as a strategic option value bet than as a clean trailing-multiple
              comp. Snowflake is not just a financial logo; its own partner materials say customers can bring Reka's
              multimodal assistant to enterprise data inside Snowflake, which gives a plausible channel to step-function
              revenue growth. Public reporting on 2024 acquisition talks between Snowflake and Reka around the $1
              billion level adds further context: strategic buyers clearly saw the asset as important, but talks still
              stopped. That means there is strategic relevance, not a proven valuation floor. Our recommendation is
              therefore **CONDITIONAL MONITOR / PASS AT CURRENT PRICE**: investors should not underwrite the current
              mark as cheap, but should stay engaged if diligence can prove a much higher forward run-rate, strong gross
              margins, and a clean late-stage preference stack.
