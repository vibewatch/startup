      - number: '2.4'
        title: Growth Drivers, Constraints, and Timing
        blocks:
          - type: paragraph
            body: >-
              Several forces support adoption. Gartner’s 2030 multimodal forecast indicates that enterprise software
              will increasingly ingest images, video, audio, and text in one workflow. IDC’s FutureScape language points
              to AI moving from pilots to broader orchestration and trust-driven transformation. ARK’s infrastructure
              work argues that training and inference costs are falling rapidly even as usage expands, while NVIDIA
              claims Blackwell-based inference providers can reduce cost per token by up to 10x versus Hopper in some
              open-model deployments. If those efficiency curves continue, smaller providers like Reka gain room to
              serve richer multimodal workloads without needing hyperscaler-scale balance sheets.


              The constraints are equally material. Control Risks argues that compute access is increasingly shaped by
              export controls, power, water, and geopolitical permission rather than money alone. Snowflake’s own
              enterprise-AI material emphasizes that data movement across trust boundaries raises security and
              operational overhead. For Reka, these constraints translate into real GTM friction: enterprises need
              privacy, governance, latency, and support commitments before they will trust multimodal models with
              sensitive footage or internal knowledge.


              A third constraint is market structure. Open-source and open-weight models are improving quickly, and
              hyperscaler platforms increasingly offer multimodal tooling beside the customer’s data. That means Reka’s
              market grows, but so does substitution pressure. The adoption window is favorable now because buyers still
              need specialist orchestration, deployment, and workflow packaging. Over time, however, model-layer
              commoditization could compress margins unless Reka keeps differentiating on efficiency, deployment
              flexibility, and domain-specific product UX.
