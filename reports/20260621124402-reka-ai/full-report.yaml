      - number: '8.5'
        title: Key Drivers, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The cleanest drivers that would justify the round are all measurable. First, management needs to prove
              that Snowflake and direct enterprise channels can push the company into at least a $30 million-$40 million
              forward run-rate soon, with a credible path to $50 million-plus thereafter. Second, it needs to show that
              the product mix really does create software-like economics rather than just higher-priced compute resale:
              gross margins north of 65%, stable support cost, and limited storage/indexing drag in Vision-style
              workloads. Third, investors need confidence that the customer base is not overly concentrated in a few
              design partners, channel relationships, or one-off lighthouse deployments.


              The undercutters are equally clear. If the current round carries structured protections that materially
              subordinate new money or common, if gross margin sits closer to infrastructure than software, if
              Snowflake-sourced demand is shallow or economically expensive, or if top-customer concentration is high,
              then the current price has too little margin for error. Public sources still do not disclose audited ARR,
              net retention, burn, customer concentration, channel economics, or the 2025 preference stack. That missing
              evidence is not a footnote; it is the difference between a strategic narrative and an underwritten
              investment. The right next step is therefore a short diligence list with hard pass/fail thresholds, not
              more storytelling. The most plausible upside exit today remains another private round or a strategic sale
              rather than a near-term IPO, because Reka's publicly visible revenue base still trails even the smallest
              public software anchors reviewed here by a wide margin.
