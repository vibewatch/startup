      - number: '3.2'
        title: Capability Breadth and Pricing Comparison
        blocks:
          - type: paragraph
            body: >-
              On raw model breadth, the incumbents still set the pace. OpenAI’s GPT-4o family emphasizes all-modality
              input and output, real-time voice, and tool access. Anthropic’s Claude family emphasizes reasoning, long
              context, strong vision, and enterprise connectors. Google’s Gemini stack emphasizes advanced multimodal
              understanding, long-horizon agentic workflows, and a free-to-enterprise pricing ladder. Mistral positions
              around an agentic production platform with many model variants, while Cohere focuses on secure enterprise
              AI and private deployment. Aleph Alpha is different again: it is less a frontier-scale API race
              participant and more a sovereign-European provider for highly controlled environments.


              Reka cannot beat every rival on every dimension, so its comparison must be criterion-specific. On raw
              frontier prestige, it trails the biggest labs. On token price, Reka Flash is materially cheaper than
              premium frontier models and pairs that with explicit video and research-product packaging. On deployment
              flexibility, Reka competes better than many consumer-origin vendors because it openly markets private
              cloud, on-premise, and air-gapped patterns. On video-centric workflows, it is more specialized than
              text-first API vendors that only recently deepened multimodal tooling.


              Pricing is directionally favorable for Reka but not universally decisive. Token prices only matter if
              capability per dollar remains high enough, and larger vendors often discount through bundles, enterprise
              credits, or adjacent platform lock-in. Therefore buyers are more likely to choose Reka when workflow fit
              and deployment constraints dominate, and more likely to choose an incumbent when they want one vendor
              spanning a broad portfolio of general AI workloads.
