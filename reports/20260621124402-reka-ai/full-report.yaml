      - number: '7.3'
        title: Competitive, Customer-Concentration, and Financing Risk
        blocks:
          - type: paragraph
            body: >-
              Reka is not competing in a vacuum where efficient multimodal models automatically command premium pricing.
              The rival set now advertises exactly the controls that enterprise buyers care about when evaluating a
              smaller vendor: OpenAI says customers retain ownership and control over inputs and outputs, Anthropic
              markets enterprise search, SSO, role-based controls, compliance APIs, and no model training on customer
              content by default, Mistral emphasizes self-hosted and hybrid deployment with full ownership of data, and
              Cohere markets VPC or on-prem deployment with training opt-out. At the same time, open-weight pressure has
              become more serious. Meta markets Llama as open-source, Gemma highlights cloud-to-device deployment and
              safety classifiers, and Mistral Small 3.1 says it can run on a single RTX 4090 under an Apache 2.0
              license. That combination compresses the room for a smaller closed provider to win on model access alone.
              Financing helps but does not remove the risk. Public reporting confirms that Reka raised a $110 million
              round backed by Nvidia and Snowflake at a $1 billion valuation, while trackers place the company around
              60-64 employees with roughly $10.9 million of 2025 revenue. Those numbers are not a thesis-break by
              themselves, but they imply that the valuation still assumes future operating leverage, diversified
              enterprise contracts, and continued capital-market willingness to fund AI infrastructure exposure. Public
              sources still do not show top-customer concentration, retention, or reserved channel economics, so the
              downside case remains highly sensitive to a small number of accounts and partner relationships.
