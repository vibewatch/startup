      - number: '8.2'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is straightforward. Reka has a real multimodal product wedge, credible strategic
              backers, and a channel story that most small model companies do not. Snowflake's product and investment
              materials show that Reka can be surfaced inside a governed enterprise data stack rather than sold only as
              a stand-alone API. The company also positioned the new capital for technical development and enterprise
              adoption, which is directionally what investors want to see at this stage. In that reading, the round is
              paying for three compounding options: Snowflake-led distribution, video/document-heavy workflow
              specialization, and the possibility that efficient multimodal models produce better gross margins than the
              market assumes.


              The anti-thesis is just as strong. Bessemer warns that private AI cloud valuations have arguably bubbled
              again even while public cloud multiples sit closer to historical norms, and Equidam makes the harsher
              point that AI revenue multiples can be actively misleading when compute-heavy costs and cloud-credit
              structures are hidden. The comparable set reinforces that caution. Cohere, Glean, Harvey, and Databricks
              all command richer private marks only after disclosing much greater ARR, run-rate revenue, user scale, or
              workflow embed than Reka has publicly shown. Anthropic's 2024 fundraising process further illustrates how
              AI marks can be shaped by thresholds, cloud contracts, and SPV structures rather than by clean price
              discovery. The right framing is therefore not that Reka is low quality; it is that the public proof set
              still supports a strategic-upside story more strongly than a fundamental value story.
            claimRefs:
