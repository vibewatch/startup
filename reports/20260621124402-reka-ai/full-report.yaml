      - number: '8.3'
        title: Bull / Base / Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              The scenario work should be read as supportable-value guardrails, not as a false-precision DCF. The
              current public anchor is a >$1 billion round against roughly $10.9 million of estimated 2025 revenue, so
              the core question is what forward revenue path makes that price look normal. At $1 billion, the company
              would trade at 25x on $40 million of revenue, 20x on $50 million, and 15x on about $66.7 million. Those
              thresholds are the real underwriting test.


              The bull case assumes Snowflake and direct enterprise channels convert quickly, pushing Reka toward
              roughly $60 million-$75 million of revenue inside the next 12-24 months while gross margins hold above 65%
              and the product mix shifts toward higher-value workflow software. On 18x-22x revenue, that supports
              roughly $1.1 billion-$1.65 billion and makes the current mark plausible, though still not obviously
              bargain-priced. The base case assumes more measured conversion: roughly $35 million-$50 million of revenue
              and 14x-18x revenue, which supports only about $0.5 billion-$0.9 billion. The bear case assumes revenue
              reaches only $20 million-$30 million, margins remain compute-heavy, or channel dependence proves weaker
              than hoped; on 10x-14x revenue that supports roughly $0.2 billion-$0.4 billion. In other words, the
              public-data payoff is asymmetric: there is upside if execution is excellent, but the base case still sits
              below the round.
