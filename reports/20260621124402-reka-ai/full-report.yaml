  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Reka now presents itself less as a generic chatbot lab and more as a multimodal infrastructure vendor with
              distinct buyer lanes. On the core API side, the public self-serve surface centers on reka-flash and
              reka-edge, exposed through an OpenAI-compatible chat interface. That matters because developer adoption
              friction is lowered: teams can reuse the OpenAI SDK pattern, switch the base URL, and begin with text,
              image, short-video, audio, and PDF inputs without learning a novel request shape. The public model menu is
              intentionally narrower than the full research narrative, which suggests the company is curating a
              practical self-serve offering rather than exposing every internal model artifact at once.


              Above the base chat lane, Reka has turned multimodality into productized workflows. Vision handles
              long-form video and image archives through explicit upload, indexing, search, Q&A, clip generation, and
              metadata-tagging endpoints; Research adds grounded browsing across the web and private documents; and
              Speech addresses multilingual transcription and translation with timestamps for high-volume offline jobs.
              In workflow terms, Reka is selling a way to turn large unstructured media corpora into searchable and
              automatable systems, not merely a better prompt box.


              The product portfolio therefore maps well to enterprise media, security, robotics, and regulated
              knowledge-work use cases, but much less to consumer AI distribution. The public surfaces emphasize
              deployable APIs, domain workflows, and integration assets rather than a polished mass-market assistant.
              That product positioning is consistent across the docs, Labs page, and independent commentary: Reka wins
              when buyers care about video, edge inference, or governed deployment more than they care about broad
              consumer adoption or leaderboard brand power.
