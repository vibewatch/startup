      - number: '7.5'
        title: Downside Scenarios, Kill Criteria, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The right way to read the risk stack is as a transmission chain, not a list of unrelated warnings. A
              governance miss on training-data provenance or privacy rights can delay enterprise procurement; delayed
              procurement makes the valuation more dependent on future rounds; future rounds become harder if compute
              and power scarcity compress gross margin or if open-weight rivals narrow the product moat; and a small
              team then has less room to absorb incident response, enterprise security asks, or channel friction. That
              logic produces clear diligence thresholds. Investors should ask for the concrete evidence that closes the
              public gaps: training-data provenance and opt-out records, named security certifications and recent
              pen-test outputs, committed compute or hosting capacity, top-customer and partner concentration, and a
              compliance hiring plan matched to the regulatory map. If management cannot show those items, the prudent
              posture is not mild caution but a lower conviction score or an explicit wait. By contrast, if Reka can
              prove enterprise-grade governance while preserving low-cost inference and diversified demand, then the
              same public risks become manageable rather than fatal. The investment case is therefore conditional on
              operational proof, not on optimism about the AI market in general.
