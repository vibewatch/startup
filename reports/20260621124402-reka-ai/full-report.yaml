  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Classes of Rival
        blocks:
          - type: paragraph
            body: >-
              Reka’s competitive set is broader than a simple “other model labs” list. The first class is the
              frontier-platform incumbents: OpenAI, Anthropic, and Google, each of which offers broad multimodal
              capability, large distribution footprints, and rapidly iterating model families. The second class is
              enterprise-focused challengers such as Cohere, Mistral, and Aleph Alpha, which compete more directly on
              privacy, customization, and controlled deployment. The third class is open-weight substitution led by
              Llama and Gemma, which allows sophisticated buyers to build internally or through managed inference
              providers instead of paying a specialist vendor.


              Reka sits between these classes. It is too small to outspend the frontier incumbents, yet it is more
              productized around multimodal video and research workflows than many generalist API vendors. Snowflake’s
              investment and Cortex distribution help offset the company’s scale gap, because Reka can be evaluated
              inside an existing enterprise data platform rather than through a separate procurement motion. That
              channel advantage is meaningful, but it does not remove the fact that a buyer can often test Reka against
              multiple API providers in parallel.


              Tracxn’s profile, which lists hundreds of active competitors, reinforces the core conclusion: Reka is not
              in a winner-take-all market. It is in a crowded, rapidly converging market where the relevant question is
              not “who has a model?” but “who can solve the buyer’s exact workflow with acceptable economics, trust, and
              deployment fit?”
            claimRefs:
