            body: >-
              The cleanest direct customer proof is Shutterstock. Both Reka and Shutterstock state that the companies
              entered a multi-year arrangement in which Shutterstock licenses training data to Reka and also retains
              Reka to enhance the metadata attached to Shutterstock's image and video library. That is meaningful
              because it proves paid workflow utility inside a real media-data operation, not just logo sharing. It does
              not, however, disclose contract value, rollout breadth across business units, or whether the relationship
              has expanded beyond metadata enrichment. Snowflake is a different kind of proof point. Snowflake first
              invested in Reka and then publicly integrated Reka models into Cortex so Snowflake customers could run
              multimodal analysis where their data already lives. This validates channel credibility and enterprise
              governance positioning, but it is not the same as showing Snowflake itself as a large direct application
              customer of Reka. Turing is different again: Reka Vision powers Guardian AI on top of Turing's
              surveillance platform, giving Turing's installed base natural-language search and agentic incident
              workflows. Together these three examples suggest Reka wins when it plugs into an existing platform,
