  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Stack
        blocks:
          - type: paragraph
            body: >-
              Reka's public price cards show that the company is not monetizing through a single undifferentiated chat
              endpoint. The base layer is a pay-as-you-go API with explicit price discrimination by capability: Edge is
              the low-cost or on-device option, Flash is the mainstream workhorse, Core is the premium tier, and
              Research is priced separately per thousand requests for multi-step web-and-document work. Above that base
              model layer, Vision introduces a different revenue logic around indexed video minutes, searches, image
              storage, tagging, and clip generation. That matters because the company is monetizing both inference and
              workflow context rather than only prompt volume.


              The second important layer is packaging. Vision has a developer tier with standard metered prices, but the
              enterprise tier shifts to monthly invoicing, bulk discounts, flexible storage, and dedicated support.
              Research likewise packages a higher-value workflow whose unit is not merely tokens but completed research
              requests. Together these surfaces suggest a hybrid model: self-serve usage to reduce friction, then
              enterprise contracts where support, retention, and storage become part of the economic equation. The
              public evidence supports that breadth, but it does not disclose revenue mix, realized discount rates, or
              what share of sales comes from productized software versus professional enablement.
