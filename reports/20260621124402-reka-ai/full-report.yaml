        - Run-rate still below $25M at the next financing checkpoint
        - Current mark stays above even optimistic forward multiple support
        - Pass or demand materially better entry terms
      - - Gross-margin miss
        - Product gross margin below 50%-55%
        - Efficient-model story looks more like compute resale than software leverage
        - Downgrade valuation range and model a down-round
      - - Preference overhang
        - Participating preferred, ratchets, or heavy seniority in 2025 round
        - Common/new-money upside gets capped even if operating progress is real
        - Require legal term review before any positive call
      - - Channel concentration
        - Snowflake or one partner accounts for an outsized share of pipeline or booked ARR
