evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-history
    missingEvidence: Primary company confirmation of the exact 2023 round size and post-money valuation.
    whyItMatters: >-
      Public trackers cite roughly $58M versus $60M and private-market valuation context is central to dilution and
      return analysis.
    diligencePath: Request the signed 2023 financing announcement, board materials, or cap-table summary from management.
    relatedQuestionRefs:
      - QO010
      - QO012
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-and-customers
    missingEvidence: Verified ARR, customer count, and revenue concentration by product or partner channel.
    whyItMatters: >-
      The public company snapshot is capital-rich but still lacks the commercial metrics needed to judge durability and
      valuation support.
    diligencePath: Obtain management KPI pack covering ARR, pipeline, gross retention, and top-customer concentration.
    relatedQuestionRefs:
      - QO017
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board composition, voting control, and founder retention terms.
    whyItMatters: >-
      Founder concentration is a strategic asset, but investors need to know who can approve future financings,
      liquidity events, or executive changes.
    diligencePath: Request board list, charter, investor rights agreement, and key retention grants.
    relatedQuestionRefs:
      - QO024
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: A company-confirmed 2026 employee number rather than tracker estimates and a July 2025 media quote.
    whyItMatters: Headcount is a useful efficiency proxy for a model company, but public sources disagree on the latest number.
    diligencePath: Request HR snapshot or payroll-supported headcount by function.
    relatedQuestionRefs:
      - QO016
      - QO025
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: snowflake-commercial-terms
    missingEvidence: Contract economics, exclusivity, and minimum-commitment details of the Snowflake relationship.
    whyItMatters: >-
      Snowflake is simultaneously investor, distribution partner, and former acquisition counterparty, which can
      materially affect bargaining power.
    diligencePath: Review signed commercial agreement, side letters, and any strategic-rights schedule with Snowflake.
    relatedQuestionRefs:
      - QO014
      - QO015
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: multimodal-sam
    missingEvidence: >-
      A third-party source that directly quantifies the narrow enterprise multimodal-workflow category Reka actually
      targets.
    whyItMatters: >-
      Current public data sizes either the full AI stack or very broad multimodal categories, forcing heuristic SAM
      estimates.
    diligencePath: >-
      Obtain paid analyst excerpts or investor diligence materials isolating multimodal enterprise software and model
      spend.
    relatedQuestionRefs:
      - QM009
      - QM010
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: vertical-demand
    missingEvidence: Customer conversion rates, average contract values, and deployment sizes by segment.
    whyItMatters: >-
      Without segment-level commercial data, it is hard to know whether Reka’s strongest visible use cases are niche or
      repeatable.
    diligencePath: Request pipeline and booked ARR by vertical, customer count by segment, and pilot-to-production conversion.
    relatedQuestionRefs:
      - QM011
