  evidenceGaps:
  - type: missing-source
    severity: material
    topic: benchmark-parity
    missingEvidence: Fresh third-party benchmarks directly comparing current Reka commercial models against the latest OpenAI, Anthropic, and Gemini releases.
    whyItMatters: Public competition claims change quickly and chapter conclusions become stale if vendor comparisons rely on different model vintages.
    diligencePath: Run an internal benchmark harness or obtain a recent independent evaluation using matched prompts and cost controls.
    relatedQuestionRefs:
    - QP010
    - QP024
    relatedTableRefs:
    - TP002
  - type: private-evidence-only
    severity: material
    topic: discounted-pricing
    missingEvidence: Actual enterprise contract pricing and discount levels for Reka and major competitors.
    whyItMatters: Public list prices often diverge sharply from negotiated enterprise economics, especially for high-volume or bundled buyers.
    diligencePath: Request recent Reka contracts and competitor quote sheets from procurement-led deals.
    relatedQuestionRefs:
    - QP011
    - QP012
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Recent competitive win-loss analysis showing where Reka loses to OpenAI, Anthropic, Gemini, or internal build.
    whyItMatters: Moat claims are speculative without evidence of actual buying behavior under head-to-head evaluation.
    diligencePath: Review CRM win-loss notes, RFP outcomes, and deal-level objections.
    relatedQuestionRefs:
    - QP020
    - QP021
    - QP025
    relatedTableRefs:
    - TP004
  - type: stale
    severity: minor
    topic: feature-velocity
    missingEvidence: A current changelog-normalized comparison of feature release velocity across rivals.
    whyItMatters: Frontier vendors add modalities and enterprise tools quickly, which can erase point-in-time differentiation.
    diligencePath: Track quarterly release notes for each competitor and refresh this chapter every cycle.
    relatedQuestionRefs:
    - QP024
  - type: private-evidence-only
    severity: minor
    topic: channel-dependence
    missingEvidence: Revenue share attributable to Snowflake or other partners.
    whyItMatters: A strong channel can accelerate growth, but concentration can also reduce pricing power and strategic flexibility.
    diligencePath: Request partner-sourced pipeline and closed ARR by channel.
    relatedQuestionRefs:
    - QP014
    - QP025
    relatedTableRefs:
    - TP004
