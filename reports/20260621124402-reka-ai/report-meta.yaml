companyProfile:
  summary: >
    Reka AI is a Sunnyvale-based multimodal model company founded in 2022 by former DeepMind, Google, Meta, and Baidu researchers. Its commercial surface spans the Reka API, Reka Flash, Reka Vision, and Reka Research, with a positioning centered on efficient multimodal inference, private deployment, and enterprise workflow fit rather than sheer frontier-model scale. Snowflake partnership materials, Shutterstock customer proof, and Turing partner evidence support real market relevance, while the July 2025 NVIDIA- and Snowflake-backed financing confirms strategic interest. The main diligence constraint is disclosure depth: public evidence does not establish audited revenue quality, customer concentration, margin structure, or durable moat strength relative to rapidly improving frontier and open-weight alternatives.
