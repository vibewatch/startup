  topStrengths:
    - Reka combines efficient multimodal models with workflow products in vision and research rather than selling only a generic chat endpoint.
    - Snowflake distribution and NVIDIA-backed financing materially improve enterprise relevance beyond what a small independent model lab would normally command.
    - The company appears technically dense and relatively capital-efficient compared with larger frontier-model peers, giving it a plausible niche in cost-sensitive enterprise deployment.
  topRisks:
    - Public revenue, margin, burn, retention, and customer-concentration data remain largely undisclosed, so valuation discipline depends on private diligence.
    - Core competition is intense across OpenAI, Anthropic, Google, Mistral, Cohere, and open-weight substitutes, while switching costs at the base model layer remain low.
    - Compute access, safety/compliance expectations, and partner-channel dependence could compress margins or weaken differentiation as the market converges.
  unresolvedGaps:
    - Audited 2025 and 2026 revenue, ARR, gross margin, burn, runway, and direct evidence separating recurring software economics from compute-heavy services
    - Customer count, concentration, renewal behavior, and the split between direct Reka revenue and partner- or channel-mediated usage
    - Full cap table, liquidation preferences, Snowflake commercial economics, and fresh independent benchmarks versus current frontier and open-weight alternatives
