- id: distribution-gtm-proxies
  title: Enterprise Distribution and GTM Proxies
  body: |-
    Snowflake is financially important because it is more than a logo investor. Snowflake's own announcements say customers can bring Reka into their Snowflake accounts, run or support Reka models in Cortex, and keep multimodal analysis inside a governed enterprise perimeter. That arrangement potentially lowers Reka's direct customer-acquisition burden for some accounts by embedding discovery and procurement into an existing data-platform relationship. It also means the channel can produce indirect monetization even where the buyer first experiences Reka through Snowflake rather than through Reka's native API.

    The clearest named end-customer proof remains Shutterstock, which simultaneously licenses training data to Reka and retains Reka to enrich metadata across its image and video library. That dual role matters financially: it is evidence of a real enterprise use case, but it also hints that some commercial relationships may bundle data rights, workflow software, and model usage in ways that are not visible from the public price card. The GTM upside is obvious—credible enterprise references, strategic platform partners, and product-market fit in media and security workflows. The GTM caveat is just as important: no public source discloses sales cycle length, ACV, win rate, channel mix, or whether Snowflake bills through revenue share, referral, or simple model availability.
  claimRefs:
