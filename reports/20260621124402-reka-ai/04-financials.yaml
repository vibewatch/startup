  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count-arr
    missingEvidence: Paid customer count, ARR, and top-customer concentration are not publicly disclosed.
    whyItMatters: Without customer count and ARR composition, it is impossible to judge ACV, concentration risk, or whether revenue is broad-based.
    diligencePath: Request current paid-customer count, ARR by product, and top-10 customer concentration schedule.
    relatedQuestionRefs:
    - QI011
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: No public gross margin, COGS split, or product-level margin disclosure is available.
    whyItMatters: Margin quality determines whether Reka is becoming a software business or simply reselling compute and support at thin spread.
    diligencePath: Request gross margin by API, Vision, Research, and channel-delivered workloads plus underlying COGS buckets.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: sales-efficiency
    missingEvidence: CAC, payback, sales-cycle, win-rate, and partner economics are not publicly disclosed.
    whyItMatters: A company with multiple monetization surfaces still fails financially if distribution is expensive or channel terms erode contribution margin.
    diligencePath: Request funnel metrics by channel, CAC, payback, ACV distribution, and Snowflake partnership economics.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway-burn
    missingEvidence: Cash on hand, gross burn, net burn, runway, and infrastructure commitments are not public.
    whyItMatters: Capital adequacy cannot be judged responsibly without knowing whether current financing supports 12 months or several years of execution.
    diligencePath: Request latest balance sheet, 13-week cash forecast, monthly burn trend, and cloud or hardware commitments.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: revenue-mix
    missingEvidence: No primary source discloses revenue mix across API, Vision, Research, and channel-driven sales.
    whyItMatters: The investment case depends on whether higher-value workflow software is becoming a meaningful share of revenue or whether monetization is still dominated by low-switching-cost usage.
    diligencePath: Request trailing-12-month revenue mix by product and by direct versus channel origin, plus realized discount and support burden data.
    relatedQuestionRefs:
    - QI024
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
