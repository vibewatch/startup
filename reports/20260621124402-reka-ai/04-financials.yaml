- id: verdict-and-diligence
  title: Financial Verdict, Risks, and Diligence Blockers
  body: |-
    The investable part of the story is straightforward. Reka has more monetization surface than a pure frontier-model lab: public API pricing, packaged Vision and Research products, named enterprise users, and a credible distribution relationship with Snowflake. The company also appears capitalized well enough to continue product development and GTM expansion in the near term. For a compact team, those are non-trivial signals.

    The blocker is that revenue quality remains materially under-disclosed. The best public revenue number is third-party estimated, the customer base is not enumerated, and no public source discloses ARR, gross margin, retention, pricing realization, or sales efficiency. Because compute economics are compressing across the sector, the burden of proof will shift from raw model efficiency to durable contract quality, customer expansion, and operating leverage. Until management supplies those data-room items, the chapter's financial verdict is constructive on monetization potential but incomplete for full underwriting. The right diligence posture is not skepticism about whether Reka can charge for its products; it is skepticism about how repeatable, high-margin, and capital-efficient that charging model really is at scale.
