- id: cost-structure-capital-intensity
  title: Cost Structure, Capital Intensity, and Capital Adequacy
  body: |-
    Reka's official messaging repeatedly emphasizes efficient training and serving infrastructure, lower compute demand, and compact multimodal models. That narrative may be true, but public evidence still supports only the direction, not the magnitude, of the benefit. Third-party industry evidence is useful here: NVIDIA and Snowflake both describe a world where Blackwell-class hardware and system optimization materially reduce cost per token, improve throughput, and keep data close to governed enterprise environments. ARK and Control Risks supply the counterweight. They argue that inference costs are indeed falling rapidly, but that advantage is perishable because many providers can access the same efficiency curve while power, water, regulation, and compute access still constrain real-world deployment.

    That makes capital adequacy the key unresolved issue. The company clearly has a meaningful balance-sheet event behind it—the $110M round on top of the 2023 Series A—but no public source discloses cash on hand, monthly burn, runway, debt, or committed capex. The most defensible reading is therefore narrow: Reka has enough external financing and partner support to keep scaling product, talent, and infrastructure, but there is no responsible public basis for claiming how long that capital lasts or when the next financing trigger appears. Management says proceeds are for technical development and broader enterprise adoption; investors still need the actual burn map.
