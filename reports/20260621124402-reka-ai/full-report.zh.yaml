      - number: '8.4'
        title: 可比估值框架
        blocks:
          - type: paragraph
            body: >-
              私营可比集合分成两类。第一类是已经披露实质规模的 enterprise-AI application 或 platform 公司。Cohere 2025 年 ARR 约 $240 million，估值背景约 $7
              billion，意味着 high-20s multiple；Glean 的 ARR 轨迹到 $300 million、估值 $7.2 billion，也说明市场会在公司跨过远大于 Reka
              公开收入估计的门槛后给予 premium marks。Harvey 和 Databricks 从不同角度说明同一点：类别领导者绝对可以达到 $11 billion 或 $134 billion 估值，但前提是
              workflow embed、客户渗透或收入规模比 Reka 公开呈现的深得多。


              第二类是 framing comps，而不是干净 multiple comps。Anthropic 的融资史显示，cloud-linked contracts 和 threshold-based terms
              会扭曲 headline valuation 讨论。Mistral 的 2026 valuation rumor 和 Aleph Alpha 更早的 sovereign-AI 融资表明，frontier 或
              sovereign narratives 能吸引巨额资本，但这些公司更接近 foundation-model 或 state-backed strategic stories，而不是 Reka 当前的
              enterprise-multimodal wedge。因此，公开锚点更适合用来保持纪律。按这里保留来源，Snowflake 约 17x revenue，NVIDIA 约 24x，Palantir 约
              69x，C3.ai 约 4x。Reka 隐含约 92x trailing mark，高于所有这些公司，包括 Palantir 这个离群值。这不能证明本轮定价错误——private AI 可以按 future
              optionality 定价——但它确实证明当前 mark 已经嵌入大量未来成功。
