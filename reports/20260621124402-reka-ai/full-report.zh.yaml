      - number: '2.3'
        title: 买家、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              买家地图比泛泛的“企业 AI”更专业。在媒体和档案用例里，买家很可能是内容平台、媒体运营或数据产品负责人，希望把大型图像 / 视频库变现或变得可搜索；Shutterstock
              是最清晰的公开证明点。在物理安全用例里，买家通常是安全或运营负责人，负责告警质量、调查速度和摄像头网络 ROI；用户是调查员、调度员或操作员，而经济赞助人可能坐在公共安全预算负责人、企业安全负责人或 CIO
              位置。在企业研究用例里，买家通常是 CTO、首席数据官或 AI 平台负责人，希望让团队同时查询外部网页来源和内部文件。


              采用路径同样按工作流分化。买家通常在高价值人工流程变得太慢或太嘈杂时启动：清洗安全录像、丰富元数据，或跨许多来源综合复杂研究。随后，他们会在受限数据集或站点覆盖范围上测试窄试点，评估准确率和运营节省，之后才扩大到生产规模部署。Snowflake
              和 Reka 的部署材料说明，治理和数据本地性从第一次会议开始就是采购关键项，而不是事后补丁。


              结论是，Reka 更可能在用户痛点尖锐且多模态证据不可或缺的场景胜出，而不是在买家只想要低成本通用助手时胜出。这会收窄漏斗，但也能提高付费意愿，因为解决方案替代人工、压缩周期，或解锁此前难以变现的资产。
