      - number: '7.2'
        title: 基础设施、算力与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Reka 的战略依赖一个命题：即便整个行业竞相部署更大、更多工作负载，高效多模态模型仍能保持商业吸引力。公开宏观证据更像警告，而不是安慰毯。IEA 称，2025 年 data-centre 用电需求激增
              17%，到 2030 年 data-centre 用电将翻倍，AI-focused 站点则增长三倍；同时，chips、transformers、turbines 和电网连接都在收紧。RAND
              得出类似尖锐结论，估计到 2027 年全球 AI data-centre 电力需求为 68 gigawatts，并警告电力短缺可能把基础设施推向海外，带来安全和出口管制后果。DOE 和 BloombergNEF
              进一步强化了同一问题的运营版本：gigawatt-scale 项目已经撞上电网 lead time 和 reserve-margin 压力。对 Reka
              来说，这有两层含义。第一，即便模型效率真实存在，公司仍处在与大型竞争对手相同的上游算力、电力和托管瓶颈中。第二，本章公开记录仍未披露 Reka 是否有预留 GPU
              capacity、优先云经济性，或有电力背书的托管承诺来保护供应紧张时的服务质量。结果是典型的不对称风险：公司可以赢下产品评估，但如果上游 capacity 成为真正 choke point，仍可能输掉
              gross margin 或交付可靠性。
