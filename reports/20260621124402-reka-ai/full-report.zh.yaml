      - number: '6.4'
        title: 留存信号、采用障碍与公开证据缺口
        blocks:
          - type: paragraph
            body: >-
              公开留存证据很薄。Reka 没有披露客户数、NRR、GRR、流失率、平均合同期限或收入集中度，具名证明也不包含续约历史。可用的代理信号都是间接的：Shutterstock
              的用例嵌在元数据增强运营里，Snowflake 把 Reka 放进更大的企业平台，Turing
              加俄亥俄州执法案例则暗示监控调查工作流有深度。这些信号支持一种判断：集成完成后，切换成本可能变得有意义；但它们不能替代 cohort 或收入留存数据。主要采用障碍也能在公开记录中看到。小型买家要面对预付
              credits、技术集成工作、有限的公开速率上限，以及更奖励工程成熟度的 API-first 界面。即便是一篇来自竞争对手的正向第三方定价评测，也把 Reka
              描述为强大的原始模型层，而不是开箱即用的支持产品，并指出可变 token 经济性和定制集成会让低技术团队更难做预算和部署。因此，最大的 diligence 缺口不是 Reka
