      - number: '8.5'
        title: 关键驱动、打破 thesis 的触发项与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              最能证明本轮估值合理的驱动项都可衡量。第一，管理层需要证明 Snowflake 和直接企业渠道很快能把公司推到至少 $30 million-$40 million 的 forward
              run-rate，并且之后有可信路径超过 $50 million。第二，公司需要证明产品组合真的能创造软件式经济性，而不只是价格更高的 compute resale：gross margins 高于
              65%、support cost 稳定，Vision 式工作负载中的 storage / indexing drag 有限。第三，投资人需要确信客户基础没有过度集中在少数 design
              partners、channel relationships 或一次性 lighthouse deployments。


              下行因素同样清楚。如果当前轮次带有结构性保护，实质上压低新钱或 common 的位置；如果 gross margin 更接近 infrastructure 而不是 software；如果
              Snowflake-sourced demand 很浅或经济成本很高；或如果 top-customer concentration 很高，那么当前价格的容错空间就太小。公开来源仍未披露经审计 ARR、net
              retention、burn、customer concentration、channel economics 或 2025 preference
              stack。这个缺失证据不是脚注；它决定了这是战略叙事，还是可承销投资。因此，正确下一步是一张带硬性 pass/fail 门槛的短 diligence
              清单，而不是更多讲故事。今天最合理的上行退出仍是另一轮私募融资或战略出售，而不是近期 IPO，因为 Reka 公开可见的收入基础仍大幅落后于这里审阅的最小 public software anchors。
