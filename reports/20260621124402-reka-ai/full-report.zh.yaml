companyProfile:
  summary: >
    Reka AI 是一家位于 Sunnyvale 的多模态模型公司，由前 DeepMind、Google、Meta 和 Baidu 研究人员于 2022 年创立。其商业产品面覆盖 Reka API、Reka Flash、Reka
    Vision 和 Reka Research，定位不靠纯粹前沿模型规模取胜，而是强调高效多模态推理、私有化部署与企业工作流适配。Snowflake 合作材料、Shutterstock 客户证明以及 Turing
    伙伴证据支撑其真实市场相关性；2025 年 7 月由 NVIDIA 和 Snowflake
    支持的融资则确认了战略兴趣。主要尽调约束在披露深度：公开证据无法证明经审计的收入质量、客户集中度、利润率结构，或相对于快速改进的前沿模型和开放权重替代品的持久护城河强度。
