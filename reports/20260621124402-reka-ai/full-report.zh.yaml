      - number: '5.5'
        title: 信任、可靠性与待尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开材料里，信任与可靠性这层已经有实质内容，但还不完整。积极的一面是，Reka 记录了结构化 JSON 错误、用于日志关联的 request ID、针对 400/401/404/429/500
              状态的明确客户端动作，以及可见的 Vision 速率限制响应头。隐私政策也比泛泛营销话术更具体：付费 API 内容不会用于模型训练，除非客户主动选择加入；免费或促销使用可能会被使用；上传文档可能临时存放在安全
              S3 中，配有会过期的链接和限时删除；政策还给出了漏洞报告联系方式。这些都是企业开发者可用的运营信号。


              Vision 的元数据标注能力又增加了一层运营控制：它暴露 violence、profanity、adult content、drugs、alcohol、gambling、political markers
              等面向内容的字段，也包括描述性标签和偏传播性的字段。这说明 Reka 理解真实部署需要分类和策略钩子，而不只是开放式生成。


              不过，抓取到的材料没有呈现谨慎买家在大规模迁移敏感工作负载前常要看的经审计信任中心证据：公开 SOC 2 或 ISO 引用、公开 uptime 历史，或可与大型在位厂商相比的明确支持承诺。独立评测也强调，Reka
              仍以企业和开发者为中心，集成工作和重新验证开销都是实际成本。技术叙事很强；运营证明层在改善，但公开成熟度还没有同等跟上。
