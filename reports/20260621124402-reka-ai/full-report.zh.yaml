  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议摘要与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Reka 的公开 case 起点是一笔真实融资，而不是传闻：公司宣布 2025 年 7 月完成 $110 million 融资，NVIDIA 和 Snowflake 参投；Reuters-syndicated
              报道和私营公司 trackers 则把公司估值放在 $1 billion 以上。这足以把 unicorn mark 当真，但不足以把它视为明显有吸引力。最好的公开商业信号仍来自 GetLatka 的估计：Reka
              2025 年收入约 $10.9 million，团队约 60 人；Tracxn 则把公司规模放在约 64 名员工、累计融资约 $168 million。合起来看，这轮融资意味着约 92x trailing
              revenue，以及超过 15x cumulative funding to trailing revenue。这是 venture-style 预期，不是当下 fundamentals。


              与其把这轮理解成干净的 trailing-multiple comp，不如理解成战略期权价值押注。Snowflake 不只是财务 logo；其自身 partner 材料称，客户可以把 Reka 的多模态助手带入
              Snowflake 内的企业数据，这给 step-function revenue growth 提供了一个可信渠道。关于 2024 年 Snowflake 与 Reka 在 $1 billion
              左右进行收购谈判的公开报道，也增加了背景：战略买家显然认为这项资产重要，但谈判仍然停止。这说明存在战略相关性，而不是已被证明的估值底部。因此，我们的建议是 **CONDITIONAL MONITOR / PASS
              AT CURRENT PRICE**：投资人不应把当前 mark 当作便宜，但如果 diligence 能证明更高得多的 forward run-rate、强 gross margins 和干净的
              late-stage preference stack，就应继续保持接触。
