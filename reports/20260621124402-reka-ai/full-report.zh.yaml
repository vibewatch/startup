      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              Chat、Vision、Research 和 Edge 之间的架构拆分，是理解 Reka 如何看待多模态工作负载的最清晰线索。Chat 针对直接对话式推理优化，包括短视频片段；Vision
              则为更长视觉语料引入单独摄取和索引层。长视频路径在文档里很明确：按文件或 URL 上传，可选择把资产分组，完成索引，再对结果分块执行语义搜索、问答、剪辑生成和打标。这与单次端到端 chat completion
              调用的运营模型有实质差异，也反映了一种判断：企业视频检索需要预处理和检索结构，而不是把原始上下文硬塞进去。


              在模型层，Edge 是最能说明问题的产物。Reka 称它是约 7B 级视觉语言模型，把 ConvNeXt V2 视觉编码器与 6B+ 语言骨干结合，并设计成每个图像 tile 只发出 64 个 tokens。这种
              token 纪律是公司效率论点的核心：如果高分辨率视觉输入能被紧凑表示，延迟、上下文压力和服务成本会同时改善。Edge 发布材料把它定位为面向机器人、摄像头、车辆和可穿戴设备的物理 AI
              基础设施，而不是只跑在云端的助手。


              Research 和 Flash 也显示出同样偏好：重结构化推理，而不是暴力堆规模。Research 使用工具增强浏览，覆盖网页和私有文档；Flash 3.1 被描述为一个 21B
              推理模型，先通过强化学习改进，再通过 Llama 兼容发布和量化工作降低自托管难度。结果是一套产品架构，试图把价值转移到编排、检索和高效模型打包上，而不是正面参加最大参数竞赛。
