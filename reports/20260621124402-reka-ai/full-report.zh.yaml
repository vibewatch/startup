      - number: '3.2'
        title: 能力宽度与定价对比
        blocks:
          - type: paragraph
            body: >-
              单看原始模型宽度，既有巨头仍在定节奏。OpenAI 的 GPT-4o 家族强调全模态输入输出、实时语音和工具访问。Anthropic 的 Claude 家族强调推理、长上下文、强视觉和企业连接器。Google 的
              Gemini 栈强调先进多模态理解、长周期智能体工作流，以及从免费到企业级的价格阶梯。Mistral 定位为拥有多种模型变体的智能体生产平台，Cohere 聚焦安全企业 AI 和私有部署。Aleph Alpha
              又不同：它不太像前沿规模 API 竞赛参与者，更像面向高度受控环境的欧洲主权提供商。


              Reka 无法在每个维度击败所有对手，因此比较必须按标准拆开。按原始前沿声望看，它落后于最大实验室。按 token 价格看，Reka Flash
              明显便宜于高端前沿模型，并且配有明确的视频和研究产品打包。按部署灵活性看，Reka
              比许多源自消费者业务的供应商更能竞争，因为它公开销售私有云、本地和气隙模式。按视频中心工作流看，它比那些近期才深化多模态工具的文本优先 API 供应商更专业。


              定价方向上对 Reka 有利，但并非在所有场景都一锤定音。只有当每美元能力仍足够高时，token
              价格才重要；大型供应商又常通过捆绑、企业点数或相邻平台锁定给折扣。因此，当工作流适配和部署约束占主导时，买家更可能选择 Reka；当他们想要一个覆盖广泛通用 AI 工作负载组合的供应商时，更可能选择既有巨头。
