chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与商业模式
        blocks:
          - type: paragraph
            body: >-
              Reka AI 把自己定义为一家研究与产品公司，构建“面向物理 AI 时代的模型和基础设施”。这个定位比泛泛的 LLM 实验室更具体。官网和技术论文都把 Reka
              描述为从底层开始做多模态，覆盖文本、图像、视频和音频，而不是事后薄薄补一层视觉能力。这一点具有商业含义：公司并不试图打赢广义消费者聊天机器人之战，而是把基础模型能力打包进开发者 API
              和更高层企业工作流。在这些场景里，多模态上下文比单纯的原始规模更重要。


              产品栈分三层。第一层，Reka 通过 API 暴露聊天模型，公开基线访问包括 reka-flash 和 reka-edge，定价形态类似传统按用量计费的模型平台。第二层，Reka 销售更高阶应用：Reka
              Vision 面向大型视频或图像语料库做搜索、推理、剪辑和告警；Reka Research 面向多步骤网页与私有文档研究。第三层，Reka 强调部署灵活性——API、私有云、本地部署、VPC
              和气隙环境。对一家年轻初创公司来说，这一点异常突出，也贴合媒体、安全和受监管环境中的企业买家。


              因此，公司的经济逻辑更像基础设施与应用软件的混合体。按用量定价的 API 变现直接开发者需求，企业层、微调和部署项目支撑更大的合同价值。Snowflake 集成把分销延伸进既有企业数据工作流，Guardian
              AI 等伙伴主导产品则让 Reka 把多模态推理嵌入面向客户的系统中间接变现。结果是一个比 OpenAI 式大众消费者分发更窄、但更贴近企业场景的商业模式。
