      - - 训练数据 / 版权治理
        - 来源证据和退出处理
        - 尽调资料室没有记录数据集沿袭、权利分析或下架流程
        - 暂停承保，或要求投资前完成法律整改
      - - 隐私 / 生物识别暴露
        - 数据权利运营指标
        - 没有 DPIA 式流程、删除 SLA，或针对监控部署的敏感数据边界
        - 降低信心，并收窄目标客户论证
      - - 算力 / 电力入口
        - 预留容量和托管经济性
        - 未为预计未来 12-18 个月增长锁定 GPU 或托管容量
        - 假设毛利率受压、融资需求上升
      - - 客户集中
        - 头部账户收入占比
        - 前 3 大客户或渠道贡献过大，且缺少多年留存证据
        - 下调收入耐久性评级
      - - 安全与信任状态
        - 认证 / 渗透测试 / 事件准备度
        - 企业扩张期间没有可信安全路线图或独立测试证据
        - 预期销售周期拉长、成交速度放慢
      - - 团队和执行带宽
        - 组织深度和招聘计划
        - 虽然产品线很宽，但合规、基础设施和企业支持没有清晰梯队
        - 在补齐人员前，把管理带宽视为可能打破论点的风险
  - id: TV001
    title: 投资建议摘要表
    notes: 本表把公开证据转成决策姿态；各项判断是综合研判，不是管理层指引。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV034
      - CV043
      - CV046
      - CV047
    columns:
      - 维度
      - 当前判断
      - 证据锚点
      - 决策含义
    rows:
      - - 投资建议
        - 有条件跟踪 / 以当前价格放弃
        - 公开基准情景仍低于本轮估值
        - 只有尽调补齐核心缺口，才继续保持接触
      - - 信心
        - 中
        - 融资轮、追踪器和可比公司数据真实存在，但关键经济性仍是私有信息
        - 不要用稀疏公开数据过度拟合精确结论
      - - 风险评级
        - 高
        - 隐含约 92x trailing 倍数，披露很薄
        - 需要明确下行保护或更强证明
      - - 估值立场
        - 偏高但并不荒谬
        - 战略伙伴价值解释了部分溢价
        - 当前估值已经计入重大前瞻执行
      - - 可由公开数据支撑的区间
        - ~$0.2B-$1.65B；基准 ~$0.5B-$0.9B
        - 牛市情景需要 $60M-$75M 收入；基准情景支撑不了本轮估值
        - 只有偏牛判断才适合承保当前价格
      - - 上调门槛
        - 需要 >$30M-$40M run-rate、>65% 毛利率、干净条款
        - 这些指标会显著压低隐含前瞻倍数
        - 若拿不到，就等待或重新谈判入场纪律
  - id: TV002
    title: 正方 / 反方论点表
    notes: 论点对价格敏感：同一家公司的质量，在一个入场估值下可能有吸引力，换一个估值就可能偏贵。
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
      - CV016
      - CV038
      - CV044
      - CV045
    columns:
      - 论点
      - 当前证据
      - 什么会改变判断
    rows:
      - - Snowflake 牵头的企业分发可以加速规模化
        - Snowflake 产品和投资材料显示，GTM 集成真实存在
        - 需要渠道贡献的 pipeline、转化率和收入分成证据
      - - 高效多模态产品可能带来有吸引力的毛利率
        - 管理层和合作伙伴叙事指向效率，而不是蛮力扩张
        - 需要按产品和工作负载拆分、经审计的毛利率桥接
      - - 私有 AI 可比公司可以支撑溢价估值
        - Cohere、Glean、Harvey 和 Databricks 都表明，私有 AI 可以获得溢价定价
        - 需要证明 Reka 能迅速从约 $10.9M 收入提升到 $40M+
      - - 当前私有 AI 市场可能过热
        - BVP 认为，在公开市场倍数正常化时，私有 AI cloud 可能已经起泡
        - 更冷静的私有市场，或 Reka 增长放慢，都会压缩估值
      - - AI 轮次条款可能扭曲 headline valuation
        - Semafor 和 Equidam 都认为，绑定云服务的条款和成本结构会误导简单倍数
        - 需要实际的 2025 年优先权栈和算力承诺
      - - 战略选择权真实存在，但不是估值底
        - 收购谈判报道显示买方有兴趣，但谈判仍然停止
        - 需要多个战略买家或可重复入站兴趣的证据
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    notes: 情景数值是基于公开收入锚点和可比倍数区间推导出的可支撑价值区间，不是目标价。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV046
    columns:
      - 情景
      - 收入假设
      - 倍数假设
      - 可支撑估值区间
      - 概率信号
      - 关键条件
    rows:
      - - 牛市
        - 近期前瞻收入 $60M-$75M
        - 18x-22x
        - ~$1.1B-$1.65B
        - 需要超计划执行
        - Snowflake / 直销企业渠道完成转化，毛利率保持软件式水平
      - - 基准
        - 近期前瞻收入 $35M-$50M
        - 14x-18x
        - ~$0.5B-$0.9B
        - 公开数据最能支撑
        - 商业化增长真实，但不足以完全支撑当前价格
      - - 熊市
        - 近期前瞻收入 $20M-$30M
        - 10x-14x
        - ~$0.2B-$0.4B
        - 如果转化或经济性不达预期，概率不低
        - 算力 / 存储拖累、伙伴依赖，或客户扩张乏力
  - id: TV004
    title: 可比估值表
    notes: 各行混合了干净收入倍数锚点和框架性可比公司；多个私有 AI 轮次缺少完全同步的估值和收入日期，因此本表应方向性使用，不宜机械套用。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-relevant private AI and public AI/platform comparables retained from fetch-reviewed
        sources; it is not an exhaustive census of all 2024-2026 AI financings.
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV016
      - CV017
      - CV019
      - CV020
      - CV021
      - CV022
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
    columns:
      - 可比公司
      - 指标 / 估值锚点
      - 隐含倍数或规模备注
      - 为什么相关
      - 局限
    rows:
      - - Reka（当前）
        - 基于约 $10.9M 估算 2025 年收入，估值 >$1B
        - ~92x trailing 收入
        - 本章的直接锚点
        - 收入来自第三方估算，未经审计
      - - Cohere
        - $240M ARR 与约 $7B 估值背景
        - ~29x ARR 经验值
        - 企业模型 / API 可比公司，带私有部署姿态
        - ARR 与融资日期并不完全同步
      - - Glean
        - 2026 年 5 月 ARR 达 $300M；2025 年 6 月估值 $7.2B
        - 获得溢价估值前，ARR 规模大得多
        - 企业 AI 应用可比公司
        - 当前 ARR 和最新估值来自不同观察日期
      - - Harvey
        - $11B 估值；1,300 家组织和 100,000+ 名律师
        - 更深工作流嵌入支撑溢价估值
        - 产品变得像操作系统时，展示垂直 AI 天花板
        - 保留的官方来源没有披露干净 ARR 数字
      - - Anthropic
        - 2024 年目标估值 $15B-$20B，并有阈值 / 信贷复杂性
        - 不是干净倍数可比
        - 说明 frontier AI 估值可能被结构性扭曲
        - 基础模型经济性与 Reka 差异很大
      - - Mistral
        - 传闻 2026 年融资 €20B，此前 Series C 为 €11.7B
        - frontier / 主权溢价框架
        - 可作为欧洲基础模型参考
        - 基于传闻，且保留来源没有收入锚点
      - - Aleph Alpha
        - 2023 年 $500M Series B
        - 融资规模可比，不是干净收入倍数可比
        - 主权企业 AI 参考点
        - 公开收入 / 估值同步性较弱
      - - Databricks
        - 2025 年 12 月 run-rate 收入 $4.8B、估值 $134B
        - ~28x run-rate 收入
        - 规模化 data+AI 平台天花板
        - 规模和成熟度远高于 Reka
      - - Snowflake
        - FY2026 收入 $4.684B，对应市值 $80.51B
        - ~17.2x 收入
        - 与 Reka 渠道背景相连的公开 governed-data-platform 锚点
        - 流动性公开市场倍数，且规模成熟
      - - Palantir
        - FY2025 收入 $4.475B，对应市值 $307.98B
        - ~68.8x 收入
        - 公开 AI / 平台溢价异常值
        - 产品套件更宽，政府业务占比也高于 Reka
      - - C3.ai
        - FY2025 收入 $389.1M，对应市值 $1.49B
        - ~3.8x 收入
        - 公开企业 AI 应用估值底
        - 公开公司重估，增长质量也不同
  - id: TV005
    title: 打破论点的触发条件与否决触发条件表
    notes: 这些阈值旨在把模糊的后期 AI 故事转成清晰的尽调通过 / 失败门槛。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV039
      - CV040
      - CV041
      - CV042
    columns:
      - 触发条件
      - 阈值 / 事件
      - 如何传导到论点
      - 行动含义
    rows:
      - - 前瞻收入不达标
        - 下一次融资检查点时 run-rate 仍低于 $25M
        - 即使用乐观前瞻倍数支撑，当前估值仍然偏高
        - 放弃，或要求实质更好的入场条款
      - - 毛利率不达标
        - 产品毛利率低于 50%-55%
        - 高效模型故事更像算力转售，而不是软件杠杆
        - 下调估值区间，并建模 down-round
      - - 优先权负担
        - 2025 年融资轮有参与型优先股、ratchet，或重 seniority
        - 即使经营进展真实，普通股 / 新资金上行也会被封顶
        - 任何正面判断前，都要求法律条款审查
      - - 渠道集中
        - Snowflake 或单一伙伴贡献了 pipeline 或已签 ARR 的过大份额
        - 战略价值从杠杆变成依赖
        - 折价渠道溢价，并收紧情景权重
      - - 客户集中 / 留存薄弱
        - 前五大账户主导 ARR，或扩张低于健康 SaaS 常态
        - 估值被少数续约绑架
        - 把增长视为脆弱，而不是可复利
  - id: TV006
    title: 最终尽调要求表
    notes: 这些是从公开框架走向可承保价格决策所需的最低私有数据要求。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV042
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 当前收入和留存
        - 月度 ARR / 收入桥接、队列留存，以及按产品拆分的扩张
        - 没有这些，当前轮次只能建立在陈旧或估算的 top-line 数据上
        - CFO 和收入运营材料包
      - - 毛利率和 burn
        - 按产品拆分的毛利率，加上算力、存储、支持和 burn 桥接
        - 决定 AI 收入是否是有价值收入
        - CFO 加基础设施负责人
      - - 优先权栈
        - Series B 条款清单、清算优先权、反稀释和 side letter 摘要
        - 干净的 headline valuation 仍可能带来薄弱投资人经济性
        - 外部律师和董事会材料
      - - 渠道经济性
        - Snowflake 来源 pipeline、已签 ARR、收入分成和折扣规则
        - 检验战略渠道是增厚毛利率还是稀释毛利率
        - CRO / 合作伙伴负责人
      - - 客户集中
        - 前 10 大客户组合、最大部署、续约日历和用例集中度
        - 集中度会把一条有希望的增长曲线变成悬崖风险
        - CRO 加客户成功复核
