  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、版权与数据治理暴露
        blocks:
          - type: paragraph
            body: >-
              多模态模型提供商面临的法律和治理负担已经从理论问题变成具体问题。Reka 自身条款在一个窄点上有帮助：公开条款称，付费 API
              请求不会用于模型训练，除非客户明确选择加入；免费使用可用于改进模型，聚合匿名使用数据仍可能为运营目的保留。这对企业采购有方向性帮助，但还不能证明公司已经具备监管机构和大客户现在期待的稳健训练数据
              lineage、权利管理或删除工作流。European Commission 的 GPAI 指引和 AI Act 文本说明了问题为何重要。通用 AI
              模型提供商必须维护技术文档、执行版权政策并发布训练内容摘要；被认定有系统性风险的模型还要承担额外的事件报告、风险缓释和网络安全义务。与此同时，EDPB、ICO 和 California
              隐私制度都指向第二层暴露：个人数据的合法基础、生物识别或敏感数据处理、数据主体权利，以及可解释治理。实际风险不是 Reka
              今天显然无法履行这些义务；而是本章审阅的公开记录还没有证明公司如何在视频、图像、音频和文档工作负载中把这些义务运营化。这个缺口很重大，因为一次隐私或版权争议就可能拖慢企业采用，其速度远快于模型质量改进带来的加速。
