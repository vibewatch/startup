      - number: '4.3'
        title: 公开收入信号与单位经济估算
        blocks:
          - type: paragraph
            body: >-
              公开财务可见度很薄，但不是零。最强的收入顶线信号是 GetLatka 估计 Reka 在 2025 年达到 $10.9M 收入。这不是公司申报收入，不应被视为经审计事实，但方向上有用，因为 tracker
              来源大体同意 Reka 现在是独角兽，约有 60-64 名员工，并披露了两轮机构融资。如果这些数字方向正确，公司已经从收入前叙事跨入可衡量商业化，但相对于已融资本规模仍非常早期。


              同一组 tracker 数字只能支撑粗略代理指标。用 $10.9M 估算收入除以 60-64 名员工，隐含每员工收入约 $170k-$182k；对早期企业 AI
              供应商来说，这个水平可观，但仍明显低于成熟软件基准。把同一收入估算与约 $168M-$170M 总融资配对，隐含已融资本超过年收入 15x；与 $1B 估值配对，则隐含估值 / 收入倍数约
              92x。这些衍生指标都不应被误认为真实单位经济——它们是跨来源估算——但它们清楚框定了承销问题：投资人买的是未来平台杠杆，而不是当前披露的现金生成。
