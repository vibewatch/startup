      - number: '1.3'
        title: 融资历史、战略投资人与资本形成
        blocks:
          - type: paragraph
            body: >-
              Reka 的资本故事不长，但很关键。Tracker 数据指向 2023 年 Series A，规模约 $58M-$60M，估值约 $300M；随后是 2025 年 7 月 $110M 的 Series
              B，把估值推到 $1B 以上。Snowflake 出现在两轮融资里：2023 年先是投资人与合作伙伴，2025 年又与 NVIDIA 一同参与。重复参与说明 Reka
              通过了战略投资人的一个关键尽调门槛：其模型不只是值得发合作新闻，也足以获得资产负债表支持。


              Snowflake 2023 年公告把合作框定为让客户在 Snowflake 内运行和微调 Reka；后续 Snowflake 材料又把 Cortex 内对 Reka Flash 和 Core
              的支持扩展开来。战略解释是，Reka 给 Snowflake 提供多模态模型库存和企业定制可选项，Snowflake 不必把每项能力都内部自建。对 Reka 来说，Snowflake
              带来企业分销、治理可信度，以及进入数据云账户的下游路径。


              不利皱褶在于，Snowflake 也曾在 2024 年探索以超过 $1B 收购 Reka，谈判后来停止。这笔未成交易看起来并不致命——双方仍保持合作——但它确实暴露了战略张力：Reka
              价值足以吸引收购接触，却选择或接受继续独立。独立保留了股东上行空间，但也让公司必须在没有大型平台所有者庇护的情况下，为人才、算力和 GTM 扩张继续融资。
