      - CV007
      - CV008
      - CV028
      - CV034
      - CV041
      - CV047
    data:
      nodes:
        - id: n1
          label: 最新轮次
          detail: 融资 $110M，估值 >$1B
        - id: n2
          label: 公开牵引力
          detail: 2025 年收入估算约 ~$10.9M，员工约 ~60-64 人
        - id: n3
          label: 战略切口
          detail: Snowflake 渠道叠加 NVIDIA / 合作伙伴支持
        - id: n4
          label: 私募市场谨慎
          detail: BVP 和 Equidam 都警告，不要轻易外推 AI 倍数
        - id: n5
          label: 公开可比公司压力
          detail: 公开 AI / 平台倍数多数低于 Reka 隐含的过去十二个月标记
        - id: n6
          label: 情景结果
          detail: 基准情形低于本轮；乐观情形也只略高于本轮
        - id: n7
          label: 建议
          detail: 有条件观望 / 当前价格下放弃
        - id: n8
          label: 上调门槛
          detail: 需要 >$30M-$40M 年化收入、>65% 毛利率、干净条款
        - id: n9
          label: 下调门槛
          detail: 利润率偏弱、合作伙伴集中，或有结构化优先权
      edges:
