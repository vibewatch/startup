          score: 3.5
          trend: stable
          detail: 收入规模仍来自跟踪器估算，不是审计或公司认证数据。
        - label: 战略渠道杠杆
          score: 7
          trend: up
          detail: Snowflake 合作带来可信的企业分发切口。
        - label: 估值拉伸
          score: 2
          trend: down
          detail: 隐含约 ~92x 过去十二个月收入，给执行失误留下的空间很小。
        - label: 证据质量
          score: 3
          trend: stable
          detail: 毛利率、留存、股权结构和集中度仍未公开。
        - label: 退出可选性
          score: 6
          trend: up
          detail: 战略兴趣存在，但 IPO 准备度仍显遥远。
