      - number: '4.4'
        title: 成本结构、资本强度与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Reka 官方叙事反复强调高效训练和服务基础设施、更低算力需求以及紧凑多模态模型。这个叙事可能成立，但公开证据仍只支持方向，不支持收益幅度。第三方行业证据在这里有用：NVIDIA 和 Snowflake
              都描述了一个由 Blackwell 级硬件和系统优化显著降低每 token 成本、提升吞吐，并让数据贴近受治理企业环境的世界。ARK 和 Control Risks
              提供反向权重。它们认为推理成本确实在快速下降，但这种优势会消耗，因为许多提供商都能接入同一条效率曲线，而电力、水、监管和算力获取仍约束现实部署。


              因此，资本充足性是关键未解问题。公司背后显然有一次有意义的资产负债表事件——在 2023 年 Series A 之上又拿到 $110M 融资——但没有公开来源披露账上现金、月度烧钱、 runway、债务或已承诺
              capex。最可防守的解读因此很窄：Reka
              有足够外部融资和伙伴支持，继续扩张产品、人才和基础设施，但没有负责任的公开依据来声称这笔资本能撑多久，或下一次融资触发点何时出现。管理层称募资用于技术开发和更广泛企业采用；投资人仍需要真实烧钱地图。
