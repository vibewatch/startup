      - number: '4.5'
        title: 财务结论、风险与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              故事中可投资的部分很直接。Reka 的变现面比纯前沿模型实验室更宽：公开 API 定价、打包的 Vision 和 Research 产品、具名企业用户，以及与 Snowflake
              的可信分销关系。公司资本化水平看起来也足以在近期继续产品开发和 GTM 扩张。对一个紧凑团队来说，这些信号并不轻。


              阻断点在于，收入质量披露仍严重不足。最好的公开收入数字来自第三方估算，客户群没有列明，也没有公开来源披露
              ARR、毛利率、留存、定价兑现或销售效率。由于整个行业的算力经济性都在压缩，证明责任会从原始模型效率转向持久合同质量、客户扩张和运营杠杆。管理层提供这些数据室材料之前，本章财务结论可以对变现潜力保持建设性，但不足以支持完整承销。正确尽调姿态不是怀疑
              Reka 能否为产品收费，而是怀疑这种收费模式在规模化后究竟有多可重复、多高毛利、多资本高效。
