      - number: '1.4'
        title: 商业牵引、部署与里程碑
        blocks:
          - type: paragraph
            body: >-
              到 2025 年中，Reka 已经从“模型实验室”状态进入可识别的商业部署阶段。最清晰的公开客户证明是 Shutterstock：2024 年 6 月合作使 Shutterstock
              同时成为数据授权方和付费客户，使用 Reka 丰富其图像和视频库的元数据。这一点重要，因为它把 Reka 的多模态卖点连到一个真实生产档案库，背后有法律授权约束、元数据经济性，以及重视质量而非新奇感的企业买家。


              第二个主要证明点是物理安全。Reka Vision 被定位为一层智能能力，贴在既有视频管理系统旁边，而不是要求推倒重来。官方产品材料称，在部署中案件解决速度快 65%，误报最多减少 95%；Turing 合作则称
              Guardian AI 在 13,000+ 站点、10M+ 日事件的覆盖范围内运行于 Reka Vision 之上，并已被美国执法客户使用。这些结果能否泛化仍未证明，但它们确实显示 Reka 在瞄准带有可衡量
              ROI 的运营工作流，而不是泛用聊天机器人。


              里程碑记录强化了一个分阶段商业化的公司图景：2022 年成立，2023 年外部融资与 Snowflake 合作，2024 年 Shutterstock 合作与技术报告发布，2025 年 Vision 和
              Research 发布 / GA，加上独角兽融资和 Turing 合作。国防安全页面又补上一条战略方向线索：Reka 正有意争取主权和气隙部署，在这些场景里，模型效率、隐私和部署可移植性与排行榜性能同样重要。
