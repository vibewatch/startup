  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流看产品面
        blocks:
          - type: paragraph
            body: >-
              Reka 现在更像一家多模态基础设施供应商，而不是泛用聊天机器人实验室，并且有清晰买家路径。在核心 API 侧，公开自助产品面围绕 reka-flash 和 reka-edge，通过 OpenAI
              兼容聊天接口暴露。这一点重要，因为开发者采用摩擦被降低：团队可以复用 OpenAI SDK 模式，切换 base URL，并从文本、图像、短视频、音频和 PDF
              输入开始，而不必学习全新请求形态。公开模型菜单刻意比完整研究叙事更窄，说明公司在策划一个实用自助产品，而不是一次性暴露每个内部模型产物。


              在基础聊天路径之上，Reka 已把多模态转成产品化工作流。Vision 通过明确的上传、索引、搜索、Q&A、剪辑生成和元数据打标端点，处理长视频和图像档案；Research
              增加跨网页和私有文档的扎根浏览；Speech 则面向高量离线任务，提供带时间戳的多语言转写和翻译。按工作流看，Reka 销售的是把大型非结构化媒体语料库转成可搜索、可自动化系统的方法，而不只是一个更好的
              prompt 框。


              因此，产品组合很好映射到企业媒体、安全、机器人和受监管知识工作用例，但不太适合消费者 AI 分发。公开产品面强调可部署 API、领域工作流和集成资产，而不是精致的大众市场助手。这个产品定位在文档、Labs
              页面和独立评论中保持一致：当买家更关心视频、边缘推理或受治理部署，而不是广泛消费者采用或排行榜品牌力时，Reka 才会赢。
