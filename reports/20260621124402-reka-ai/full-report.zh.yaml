      - number: '7.3'
        title: 竞争、客户集中与融资风险
        blocks:
          - type: paragraph
            body: >-
              Reka 并不是在一个高效多模态模型自然就能拿到溢价的真空市场里竞争。竞争对手现在恰好在宣传企业买家评估小供应商时最在意的控制项：OpenAI 称客户保留对 inputs 和 outputs
              的所有权与控制权，Anthropic 主打企业搜索、SSO、基于角色的控制、合规 API，以及默认不使用客户内容训练模型；Mistral 强调 self-hosted 和 hybrid
              deployment，并让客户完全拥有数据；Cohere 则营销 VPC 或 on-prem deployment 以及 training opt-out。同时，open-weight 压力也变得更严肃。Meta
              把 Llama 定位为 open-source，Gemma 突出 cloud-to-device deployment 和 safety classifiers，Mistral Small 3.1 称可在单张
              RTX 4090 上运行，且采用 Apache 2.0 license。这种组合压缩了小型闭源提供商仅靠模型访问取胜的空间。融资有帮助，但不能消除风险。公开报道确认 Reka 完成了由 Nvidia 和
              Snowflake 支持的 $110 million 融资，估值 $1 billion；追踪机构则把公司规模放在约 60-64 名员工、2025 年收入约 $10.9 million。这些数字本身还不是推翻
              thesis 的证据，但它们意味着估值仍假设未来 operating leverage、多元化企业合同，以及资本市场继续愿意为 AI infrastructure 暴露买单。公开来源仍没有显示
              top-customer concentration、retention 或预留 channel economics，因此下行情境仍对少数账户和伙伴关系高度敏感。
