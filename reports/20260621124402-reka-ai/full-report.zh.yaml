      - number: '8.3'
        title: Bull / Base / Bear 情境分析
        blocks:
          - type: paragraph
            body: >-
              情境分析应被视为可支撑价值的护栏，而不是伪精确 DCF。当前公开锚点是 >$1 billion 融资，对应约 $10.9 million 的 2025 年估计收入；核心问题是，怎样的 forward
              revenue 路径能让这个价格显得正常。在 $1 billion 估值下，公司在 $40 million 收入上是 25x，在 $50 million 上是 20x，在约 $66.7 million 上是
              15x。这些门槛才是真正的 underwriting test。


              Bull case 假设 Snowflake 和直接企业渠道快速转化，把 Reka 在未来 12-24 个月内推向约 $60 million-$75 million 收入，同时 gross margins 保持在
              65% 以上，产品组合转向更高价值的工作流软件。按 18x-22x revenue 计算，可支撑约 $1.1 billion-$1.65 billion，使当前 mark 变得
              plausible，虽然仍谈不上明显便宜。Base case 假设转化更温和：约 $35 million-$50 million 收入和 14x-18x revenue，只能支撑约 $0.5
              billion-$0.9 billion。Bear case 假设收入仅达到 $20 million-$30 million，margins 仍受算力拖累，或渠道依赖弱于预期；按 10x-14x
              revenue，可支撑约 $0.2 billion-$0.4 billion。换言之，公开数据下的回报不对称：如果执行极佳就有上行，但 base case 仍低于本轮估值。
