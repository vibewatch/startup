      - number: '5.3'
        title: 部署模式、集成与开发者体验
        blocks:
          - type: paragraph
            body: >-
              对一家年轻模型公司来说，Reka 的部署叙事异常居中。quickstart 文档同时覆盖托管 API 使用和本地 Edge 部署，包括 Apple Silicon 本地运行指引，以及面向更高吞吐服务的 Linux
              CUDA 与 vLLM 指引。Hugging Face 模型卡进一步说明，本地部署不是营销后的补充：Flash 3.1 以 Llama 兼容格式发布，GitHub 组织也展示了 vllm-reka
              插件、SDK、reka-mcp、clip 示例和官方 n8n node 等支持资产。换句话说，Reka 试图在开发者已有工作环境中与他们相遇，而不是强迫他们进入封闭专有运行时。


              同样模式也出现在智能体工具中。Vision 的 MCP server 明确面向 Claude Code、Codex、Cursor
              及类似智能体客户端，通过智能体原生控制平面暴露视频上传、索引、搜索、Q&A、转写检查和目标检测。n8n node 把同一逻辑推进低代码自动化；剪辑、图像提示、长视频 Q&A 和目标检测已经有文档，而
              Research、Speech 和 Text 支持仍标为后续推出。这些产品面让应用型构建者更容易理解平台，比原始端点目录更清楚。


              Reka 也依赖分销和互操作伙伴，而不是只坚持直接 API 采用。Snowflake 把 Reka 多模态能力嵌入 Cortex；NVIDIA 的 VSS blueprint 为 Vision
              提供大规模视频部署的标准流水线；Oracle 国防生态纳入则释放出对安全和类主权环境的 GTM 兴趣。取舍在于，伙伴触达可以加速企业采用，但产品成功也会部分依赖第三方平台及其采购周期。
