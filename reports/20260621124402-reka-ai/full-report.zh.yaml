      - number: '2.4'
        title: 增长驱动、约束与时机
        blocks:
          - type: paragraph
            body: >-
              几股力量支撑采用。Gartner 的 2030 多模态预测显示，企业软件会越来越在一个工作流里摄取图像、视频、音频和文本。IDC 的 FutureScape 表述指向 AI
              从试点走向更广泛编排和由信任驱动的转型。ARK 的基础设施研究认为，训练和推理成本在使用量扩张的同时快速下降；NVIDIA 则称，基于 Blackwell 的推理提供商在某些开放模型部署中，可相较 Hopper
              将每 token 成本最多降低 10x。如果这些效率曲线延续，Reka 这类较小提供商就能服务更丰富的多模态工作负载，而不必拥有 hyperscaler 级资产负债表。


              约束同样实质。Control Risks 认为，算力获取越来越受出口管制、电力、水和地缘政治许可塑造，而不只是钱。Snowflake 自己的企业 AI 材料强调，数据跨信任边界移动会抬高安全和运营开销。对
              Reka 来说，这些约束会转化为真实 GTM 摩擦：企业在把敏感录像或内部知识交给多模态模型前，需要隐私、治理、延迟和支持承诺。


              第三个约束是市场结构。开源和开放权重模型改进很快，hyperscaler 平台也越来越在客户数据旁边提供多模态工具。这意味着 Reka
              的市场在增长，替代压力也在增长。当前采用窗口有利，因为买家仍需要专业编排、部署和工作流打包。但随着时间推移，除非 Reka 持续在效率、部署灵活性和领域化产品 UX 上拉开差异，否则模型层商品化可能压缩利润率。
