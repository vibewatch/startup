  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 决策流把最新融资、偏薄的公开基本面、战略渠道上行空间和价格纪律连到「观望」建议。
    approximationNotes: 流程突出最可能推动建议变化的变量，而非公司所有属性。
    claimRefs:
