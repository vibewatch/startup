  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与理想客户画像
        blocks:
          - type: paragraph
            body: >-
              Reka 的公开界面显示，它主要卖给技术买家，而不是大众消费者。首页和 Vision 材料反复把平台定位给安全、媒体、国防和其他物理世界工作流里的企业、创作者和开发者；快速上手和定价页则给 API
              原生构建者提供自助路径。实际看，至少形成四条客户线：想要 OpenAI 兼容多模态 API 的开发者；需要对视频做搜索、告警和调查的企业安全与运营团队；希望大规模做元数据增强或内容理解的媒体与数据平台买家；以及把
              Reka 能力打包进自身产品套件的平台 / 渠道伙伴。因此，最有吸引力的 ICP 是这样的组织：拥有大量非结构化视觉或多模态数据集，工程团队熟悉 API
              集成，并且有明确的受治理部署业务场景。国防、公共安全或受监管企业场景里，需要 on-premise、VPC 或 air-gapped 部署的买家尤其契合。小型非技术团队仍可通过 playground 和预付
              API credits 试用，但公开材料显示，他们会更早撞上实际限制，因为速率限制、实施工作和仅企业可用功能，会把严肃生产使用推向更高接触度的销售动作。
