      - - 搜索长视频归档
        - 人工审看或脆弱的 CV 技术栈无法扩展到数小时素材
        - Vision 上传 + 索引 + 语义搜索
        - 带时间戳的分块检索和可选生成报告，构成可用的检索层
        - 需要摄取 / 索引步骤，公开自助速率限制也较低
      - - 回答关于长片段的问题
        - 直接把完整视频塞进原始 LLM 提示并不现实
        - 基于已索引资产的 Vision 问答
        - 长视频检索与对话层分离，上下文才可控
        - 买方仍需在自己的素材上测试真实准确性
      - - 为媒体工作流生成片段和元数据
        - 编辑或审核员要手工识别高光和描述符
        - 片段生成 + 元数据打标
        - 结构化标签和自动片段任务，让技术栈更接近工作流软件，而不是基础推理
        - 输出质量和政策适配仍由公司描述，而非广泛独立基准验证
      - - 跨网页和私有文档做有依据的研究
        - 分析师手工浏览、对比和总结来源
        - Reka Research，带浏览、文档搜索和并行思考
        - 相比普通聊天，事实锚定更好，准确性 / 成本权衡也可调整
        - 基准测试和信任仍高度依赖公司自有证据
      - - 在设备附近运行多模态推理
        - 云端往返带来延迟、隐私风险和部署复杂度
        - Reka Edge 本地 / 本地机房 / 离线路径
        - 边缘封装很适合机器人、监控和其他物理 AI 闭环
        - 开放权重商业条款和生产支持范围仍是尽调项
