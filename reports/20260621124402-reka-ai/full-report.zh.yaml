      - number: '4.2'
        title: 企业分销与 GTM 代理指标
        blocks:
          - type: paragraph
            body: >-
              Snowflake 在财务上重要，因为它不只是一个 logo 投资人。Snowflake 自己的公告称，客户可以把 Reka 带入 Snowflake 账户，在 Cortex 中运行或支持 Reka
              模型，并把多模态分析留在受治理的企业边界内。这种安排可能会把发现和采购嵌入既有数据平台关系，从而降低 Reka 在部分账户上的直接获客负担。它也意味着，即便买家首先通过 Snowflake 而不是 Reka 原生
              API 体验 Reka，渠道仍可产生间接变现。


              最清晰的具名终端客户证明仍是 Shutterstock：它一边向 Reka 授权训练数据，一边聘用 Reka
              来丰富其图像和视频库的元数据。这种双重角色在财务上重要：它证明了真实企业用例，但也暗示有些商业关系可能把数据权利、工作流软件和模型用量捆在一起，公开价格卡看不到这些安排。GTM
              上行空间很清楚——可信的企业参考客户、战略平台伙伴，以及媒体和安全工作流中的产品—市场匹配。GTM 警示也同样重要：没有公开来源披露销售周期长度、ACV、胜率、渠道组合，或 Snowflake
              是通过收入分成、转介还是简单模型可用性来计费。
