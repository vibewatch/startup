      - number: '2.2'
        title: 规模测算视角与可服务支出
        blocks:
          - type: paragraph
            body: >-
              公开市场和分析师来源很少单独拆出 Reka 瞄准的精确切片，因此单一 headline TAM 会夸大精度。最佳自上而下锚点是 Gartner 的 2026 年 AI 支出预测：AI 模型支出 $32.6B，AI
              软件支出 $453.2B，总 AI 市场为 $2.596T。Gartner 还称，未来几年多模态能力将渗透企业软件，这意味着模型层价值会越来越从纯文本用量迁往混合模态工作流。


              第二个视角是结构性而非数值型。ResearchAndMarkets 按数据模态、垂直行业、技术和地区把多模态 AI 映射到 2035 年；Business Research Company 则把基础 AI
              模型分为语言、视觉、多模态、语音和代码应用。这些结构支撑一种判断：Reka 的商业产品面横跨多个终端市场——媒体与娱乐、政府 / 公共部门、制造、零售和企业知识工作流——而不是单一狭窄垂直。


              第三个视角受证据约束，并且更贴近 Reka。如果 Gartner 2026 年 AI 模型支出池最终只有 5-15% 分配给与 Reka
              相关的企业多模态推理、视频理解和文档扎根研究类别，那么在加入部署服务或周边软件之前，模型层支出约为 $1.6B 到 $4.9B。这不是精确预测；它是一个保守的 SAM 式启发法，用来界定 Reka
              未来几年可以合理进攻的类别，而不假设它会成为通用型 hyperscaler。
