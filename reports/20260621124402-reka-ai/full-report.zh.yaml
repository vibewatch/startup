    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格记分卡，衡量价格支撑、渠道杠杆、证据质量和退出可选性。
    approximationNotes: 分数是基于保留证据综合出的 0-10 启发式估算，而非外部评级。
