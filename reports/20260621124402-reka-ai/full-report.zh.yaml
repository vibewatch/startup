      - number: '6.2'
        title: 具名客户与伙伴证明：证据真正说明了什么
        blocks:
          - type: paragraph
            body: >-
              最干净的直接客户证明是 Shutterstock。Reka 和 Shutterstock 都称，双方达成多年安排：Shutterstock 向 Reka 授权训练数据，同时聘用 Reka 增强
              Shutterstock 图像和视频库附带的元数据。这个信号有意义，因为它证明了真实媒体数据运营中的付费工作流价值，而不只是标识展示。不过，它没有披露合同金额、跨业务单元 rollout
              广度，或关系是否已从元数据增强扩展出去。Snowflake 是另一类证明点。Snowflake 先投资 Reka，随后公开把 Reka 模型集成进 Cortex，让 Snowflake
              客户能在数据原本所在的位置运行多模态分析。这验证了渠道可信度和企业治理定位，但不等于证明 Snowflake 本身是 Reka 的大型直接应用客户。Turing 又不同：Reka Vision 在 Turing
              的监控平台之上驱动 Guardian AI，为 Turing 的装机基础提供自然语言搜索和 agentic 事件工作流。合在一起，这三个例子说明，Reka
              在接入既有平台、目录或摄像头网络时更容易赢；它们还不能证明公司拥有庞大的独立客户名单，或网站上每个标识都有广泛生产使用。
