      - number: '7.5'
        title: 下行情境、终止标准与尽调问题
        blocks:
          - type: paragraph
            body: >-
              正确理解风险栈的方式，是把它看成传导链，而不是一串互不相关的警告。训练数据 provenance 或隐私权治理一次失手，就可能拖延企业采购；采购延迟会让估值更依赖未来融资轮；如果算力和电力稀缺压缩 gross
              margin，或 open-weight 对手缩小产品 moat，未来融资会更难；小团队也就更难吸收事件响应、企业安全要求或渠道摩擦。这条逻辑给出了清晰的 diligence
              门槛。投资人应要求能补上公开缺口的具体证据：训练数据 provenance 与 opt-out 记录、具名安全认证和近期 pen-test 输出、已承诺算力或托管 capacity、top-customer
              与伙伴集中度，以及与监管地图匹配的合规招聘计划。如果管理层无法展示这些项目，审慎姿态就不应是轻微谨慎，而是降低 conviction score 或明确等待。反过来，如果 Reka
              能在保持低成本推理和多元需求的同时证明企业级治理，同样的公开风险就会变得可管理，而不是致命。投资 case 因此取决于运营证明，而不是对 AI 市场的泛泛乐观。
