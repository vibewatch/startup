  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现栈
        blocks:
          - type: paragraph
            body: >-
              Reka 的公开价格卡显示，公司不是靠一个无差别聊天端点变现。基础层是按用量付费的 API，并按能力做明确价格区分：Edge 是低成本或端侧选项，Flash 是主流工作马，Core 是高端层，Research
              则按每千次请求为多步骤网页与文档工作单独定价。在这个基础模型层之上，Vision
              围绕已索引视频分钟数、搜索、图像存储、打标和剪辑生成引入另一套收入逻辑。这一点重要，因为公司变现的不只是推理，还有工作流上下文，而不只是 prompt 量。


              第二个重要层是打包。Vision 有标准计量价格的开发者层，但企业层转向月度开票、批量折扣、灵活存储和专属支持。Research 同样打包了更高价值工作流，其单位不只是
              tokens，而是完成的研究请求。这些产品面合在一起，指向一种混合模型：用自助式用量降低摩擦，再用企业合同把支持、留存和存储纳入经济方程。公开证据支撑这种宽度，但没有披露收入结构、实际折扣率，或销售中有多少来自产品化软件、多少来自专业化赋能。
