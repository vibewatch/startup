      - number: '8.2'
        title: 投资 thesis 与反 thesis
        blocks:
          - type: paragraph
            body: >-
              可投资 thesis 很直接。Reka 拥有真实的多模态产品 wedge、可信的战略支持者，以及多数小型模型公司没有的渠道故事。Snowflake 的产品和投资材料显示，Reka
              可以出现在受治理的企业数据栈内部，而不是只作为独立 API
              销售。公司也把新资本定位用于技术开发和企业采用，这与投资人在这一阶段希望看到的方向一致。在这种解读下，这轮融资买的是三个相互叠加的期权：Snowflake 带动的分发、视频 / 文档密集型工作流
              specialization，以及高效多模态模型产生比市场假设更好 gross margins 的可能性。


              反 thesis 同样强。Bessemer 警告称，private AI cloud valuations 在 public cloud multiples 更接近历史常态时，可能又一次起泡；Equidam
              的说法更严厉：当 compute-heavy 成本和 cloud-credit 结构被隐藏时，AI revenue multiples
              会主动误导。可比公司集合也强化了这种谨慎。Cohere、Glean、Harvey 和 Databricks 都是在披露远高于 Reka 公开水平的 ARR、run-rate revenue、用户规模或
              workflow embed 后，才拿到更高的 private marks。Anthropic 的 2024 融资过程进一步说明，AI marks 可能受 thresholds、cloud contracts 和
              SPV structures 塑造，而不是由干净 price discovery 决定。正确 framing 因此不是 Reka 质量低；而是公开证明集更支持一个 strategic-upside
              story，而不是 fundamental value story。
