      - number: '3.3'
        title: 分销力量、切换成本与多供应商并用
        blocks:
          - type: paragraph
            body: >-
              模型 API 比传统企业软件更容易多供应商并用，因此纯模型层的切换成本有限。买家通常只需适度工程投入，就能把同一套 prompt flow 放到
              OpenAI、Anthropic、Gemini、Mistral、Cohere 和 Reka 上测试。这个现实削弱了“独立模型 API 本身就是持久护城河”的说法。


              粘性开始变重要的地方在模型之上。Reka Vision 和 Reka Research 嵌入工作流逻辑、索引、告警和部署模式，比基础 chat-completions 端点更难替换。一旦客户把视频索引接入既有
              VMS，或在安全评审下把研究工作流连到内部文件，重新认证成本会显著上升。Snowflake 分销又增加一层粘性：模型越靠近受治理的企业数据，买家越会优化安全和运营便利，而不是只看原始基准差异。


              反向力量来自大型供应商的捆绑能力。OpenAI、Google 和 Anthropic 可以把研发摊到更宽产品线。Snowflake 本身也能通过在 Cortex
              中提供多个第三方模型来调节需求。开放模型进一步降低切换门槛，因为成熟团队拥有可信的内部自建退路。换句话说，Reka 可以围绕工作流和部署创造局部锁定，但不能假设模型品类层面存在全局锁定。
