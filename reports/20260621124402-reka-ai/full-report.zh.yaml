      - number: '1.2'
        title: 创始人、领导层与组织设计
        blocks:
          - type: paragraph
            body: >-
              Reka 由 Dani Yogatama、Cyprien de Masson d’Autume、Qi Liu、Mikel Artetxe 和 Yi Tay 于 2022 年创立；私营公司画像和官方引用都一致把
              Yogatama 标为
              CEO。公开材料没有给出完整董事会名单，但显示这是一家创始人主导的组织，即使达到独角兽状态后，团队规模仍异常小。小团队姿态并非偶然：外部报道和产品帖子反复强调资深技术密度、高效训练与推理，以及重视直接技术贡献、轻管理层级的文化。


              创始人—市场匹配度很强。Shutterstock 的合作新闻稿称 Reka 由来自 DeepMind、Google Brain 和 FAIR 的科学家与工程师创立；2024 年技术报告则把五位具名创始人列入
              Core、Flash 和 Edge 背后的核心作者组。研究履历与直接模型构建参与叠加，构成投资叙事的核心：买家和投资人本质上在押注一个精英小团队，相信它能用远少于最大实验室的资本，做出接近前沿的性能。


              同一结构也放大关键人物风险。Yogatama 既是外部发言人，也是战略决策者；Yi Tay
              反复作为科学可信度出现；更广泛的创始团队似乎与模型路线图高度绑定。由于公开治理披露很薄，外部投资人仍需尽调正式董事会控制权、留才方案和继任计划。不过目前，公司的小员工数和高创始人集中度更应被理解为有意的运营设计，而不只是组织不成熟。
