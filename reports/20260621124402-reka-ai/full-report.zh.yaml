      - number: '7.4'
        title: 人员、安全与执行扩张风险
        blocks:
          - type: paragraph
            body: >-
              Reka 同时要做几件难事，执行风险被放大：交付接近前沿的多模态产品，满足对隐私敏感的企业买家，支持伙伴分发，并跟上快速变化的监管边界。公开 tracker 数据显示，团队只有约 60-64
              人；以当前产品面来看很 impressive，但也提示管理带宽、安全运营、支持覆盖和合规专门化可能被摊得很薄。外部安全证据也并不舒服。Cloud Security Alliance
              转载的多模态安全报告显示，在对抗条件下，基于图像的 prompt injection 和多模态 jailbreaks 会显著增加有害输出和危险信息泄露。MIT 的 AI risk repository
              则把问题进一步扩大：有害内容、隐私泄露、模型利用和 misinformation 不是彼此分离的边缘案例，而是一组反复出现、会相互叠加的风险。Reka 自身公开 change log
              显示，功能和模型仍在持续变化；这在战略上是正面的，但也提高了对严格 release governance 和 regression testing 的需求。这些并不能证明 Reka
              不安全。它证明的是，投资人应该把公司承销为一个攻击面持续扩大的实时运营系统，而不只是一个模型 benchmark
              故事。在这种规模的公司里，一个高级合规、安全、平台或企业支持缺口，都可能级联成更慢的交易、更弱的事件响应和更高的 churn 风险。
