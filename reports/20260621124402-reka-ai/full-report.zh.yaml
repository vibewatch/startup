  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              分析 Reka 时，不应把它看成服务整个 AI 市场。相关市场是企业多模态模型层：一套软件和服务，让组织能在生产治理约束下，对文本、图像、视频、音频和私有文档进行推理。Gartner
              的多模态预测以及更广义基础模型报告中的分类法，都支撑这个框架。落到实践中，Reka 销售的是纯文本 LLM 不够用的工作流——安全录像搜索、媒体档案打标、多模态研究，以及嵌在专有数据旁边、受治理的企业 AI。


              这个定义包括四个支出桶。第一是模型消费本身：API 或托管模型用量。第二是在模型上叠加的企业应用价值，例如 Reka Vision 和 Reka
              Research。第三是在私有云、VPC、本地环境或气隙环境中运行这些系统所需的部署与治理工作。第四是相邻的算力和数据基础设施支出，用来把多模态用例的性能推到可生产化。


              边界也排除了几类相似但不同的类别。消费者聊天机器人不是核心市场。通用办公 copilots 作为替代品有间接意义，但不定义 Reka 买家的待办任务。纯机器人硬件、泛化云 IaaS
              和一次性标注服务也只是相邻，而非核心。现状替代方案往往是人工审核、关键词元数据系统、狭窄计算机视觉点工具，或使用 hyperscaler 与开源组件内部自建。
