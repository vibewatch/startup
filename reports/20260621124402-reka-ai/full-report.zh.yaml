      - number: '6.3'
        title: 购买动作、部署模式与渠道角色
        blocks:
          - type: paragraph
            body: >-
              Reka 似乎采用分层 go-to-market 模型。低端入口处，开发者可以创建免费账号、预付 credits、生成 API key，并从 OpenAI 兼容调用或 n8n
              node、工作流模板等社区自动化资产开始。这降低了构建者和小团队的评估摩擦。但公开文档也显示了自助路径的边界：Research 的内部数据访问仅限企业，Vision 在公开 keys 上的速率限制较低，更高
              quota 或专门部署模式需要直接联系。面对安全和国防买家，销售动作会更偏咨询式。Reka 的国防页面描述了资格筛选、环境评估、在客户边界内试点部署和运营交接。VMS 集成文章明确建议把 Vision
              叠加到既有摄像头栈上，先从一组高价值摄像头开始，再横向扩展。渠道很重要，因为它们缩短了这段旅程。Snowflake 让客户在受治理的数据云环境中消费多模态模型；Turing 把 Vision
              打包进已部署在数千个站点的监控产品；GitHub 加 n8n 则为技术熟练的采用者打开生态路径。因此，扩张逻辑不像病毒式席位增长，更像是在窄试点证明 ROI
              后，扩大摄像头覆盖、索引更多媒体、增加更多工作流并加深集成。
