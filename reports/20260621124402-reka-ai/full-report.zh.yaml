  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 下行情形从治理或产能约束开始，传导到销售摩擦、利润率压力、融资需求和估值压缩。
    approximationNotes: 连线表达业务上的方向性传导，不代表确定因果。
    data:
      nodes:
        - id: governance
          label: 治理缺口
          detail: 缺少训练数据、隐私或安全证据
        - id: compute
          label: 算力瓶颈
