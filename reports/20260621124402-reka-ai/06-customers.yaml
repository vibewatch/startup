  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-roster
    missingEvidence: A fuller list of named production customers, including go-live dates, deployment type, and referenceability.
    whyItMatters: Without a broader roster, public proof can overstate maturity by leaning on a small set of frequently repeated examples.
    diligencePath: Request a customer reference sheet that distinguishes direct customers, channel accounts, pilots, and production deployments.
    relatedQuestionRefs:
    - QU022
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, renewal rate, average contract duration, and churn by major segment or channel.
    whyItMatters: Workflow depth can suggest stickiness, but only retention metrics show whether customers renew and expand economically.
    diligencePath: Request cohort tables for direct enterprise, platform-channel, and security-deployment cohorts.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: A current company-wide active-customer count split by direct customers, partner-sourced customers, and self-serve developers.
    whyItMatters: Named examples do not reveal whether the broader base is narrow, diversified, or mostly experimental.
    diligencePath: Ask management for active paying account counts, active developers, and production deployments as of runDate.
    relatedQuestionRefs:
    - QU014
    - QU022
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer and top-partner concentration, including revenue share and usage share for Snowflake, Shutterstock, Turing, and any other strategic accounts.
    whyItMatters: A partner-heavy customer story can look diversified in logos while remaining concentrated in economics.
    diligencePath: Request top-10 customer concentration, channel mix, and partner-dependence metrics from finance.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: independent-customer-reviews
    missingEvidence: Independent customer reviews, procurement records, or customer-authored case studies for Reka itself.
    whyItMatters: Current proof relies heavily on company and partner narratives, which makes deployment quality harder to verify independently.
    diligencePath: Search again for customer-authored case studies or ask management for directly referenceable customers outside partner announcements.
    relatedQuestionRefs:
    - QU018
