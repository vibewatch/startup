company:
  name: Reka AI
chapter:
  number: 6
  title: Customers
  summary: 'Reka''s public customer evidence is strongest where multimodal AI is embedded in concrete enterprise workflows rather than where broad logo walls imply adoption: Shutterstock is a named customer and data partner for metadata enrichment, Snowflake distributes Reka models inside Cortex, and Turing uses Reka Vision inside Guardian AI for physical-security customers. The buying motion is therefore split between self-serve developers, high-touch enterprise deployments, and channel-led distribution, while the biggest public gaps remain customer count, retention, ARR concentration, and the difference between logos, pilots, and production use.'
sections:
- id: customer-segmentation-icp
  title: Customer Segments and Ideal Customer Profile
  body: 'Reka''s public surfaces describe a company selling primarily to technical buyers, not mass-market consumers. The homepage and Vision materials repeatedly position the platform for enterprises, creators, and developers in security, media, defense, and other physical-world workflows, while the quickstart and pricing pages show a self-serve path for API-native builders. In practice that creates at least four distinct customer lanes: developers who want OpenAI-compatible multimodal APIs; enterprise security and operations teams that need search, alerts, and investigation over video; media and data-platform buyers that want metadata enrichment or content understanding at scale; and platform/channel partners that bundle Reka capabilities into their own product suites. The most attractive ICP is therefore an organization with large unstructured visual or multimodal datasets, an engineering team comfortable with API integration, and a clear business case for governed deployment. Buyers
    that need on-premise, VPC, or air-gapped deployment in defense, public safety, or regulated enterprise settings fit the product especially well. Smaller nontechnical teams can still experiment through the playground and prepaid API credits, but public materials suggest they will hit practical limits sooner because rate limits, implementation work, and enterprise-only features push serious production use toward a higher-touch motion.'
