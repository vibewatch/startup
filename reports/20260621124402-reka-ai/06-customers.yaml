- id: retention-barriers-and-gaps
  title: Retention Signals, Adoption Barriers, and Public Evidence Gaps
  body: 'Public retention evidence is thin. Reka does not disclose customer count, NRR, GRR, churn, average contract duration, or revenue concentration, and the named proofs do not include renewal histories. The available proxy signals are indirect: Shutterstock''s use case is operationally embedded in metadata enrichment, Snowflake places Reka inside a broader enterprise platform, and Turing plus Ohio law-enforcement examples imply workflow depth in surveillance investigations. Those signals support the idea that switching costs can become meaningful after integration, but they are not a substitute for cohort or revenue-retention data. The main adoption barriers are also visible in the public record. Smaller buyers face prepaid credits, technical integration work, limited public rate ceilings, and an API-first surface that rewards engineering maturity. Even a supportive third-party pricing review from a competitor frames Reka as a powerful raw model layer rather than a turnkey support product,
    arguing that variable token economics and custom integration can make budgeting and deployment harder for less technical teams. The biggest diligence gap is therefore not whether Reka can do interesting multimodal work; it is whether the company has converted that capability into a diversified, renewing, production-grade customer base beyond a handful of well-publicized partners and examples.'
