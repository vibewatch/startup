figures:
- id: FU001
  title: Customer Journey Map
  type: journey-map
  layout: wide
  summary: A typical Reka customer journey starts with technical evaluation, then bifurcates into self-serve experimentation, consultative pilots, or channel-led adoption.
  data:
    items:
    - label: 1. Discovery
      stage: Discovery
      actor: Developer, security lead, or platform owner
      action: Finds Reka through official site, docs, partner announcement, GitHub, or n8n assets
      pain: Unstructured video, multimodal data, or workflow latency in existing tools
      outcome: Understands that Reka can be evaluated without replacing the whole stack
    - label: 2. Evaluation
      stage: Evaluation
      actor: Engineering or security team
      action: Tests API key, quickstart, pricing, and sample workflows
      pain: Need to judge whether self-serve limits, model fit, and deployment options are acceptable
      outcome: Selects either lightweight trial, partner route, or sales-led pilot
    - label: 3. Pilot
      stage: Pilot
      actor: Enterprise operator or partner integrator
      action: Runs a scoped proof over a subset of footage, data, or metadata workload
      pain: Integration, governance, and accuracy must be validated before wider rollout
      outcome: ROI and workflow fit are demonstrated in a bounded environment
    - label: 4. Production
      stage: Production
      actor: Operations team, analysts, or investigators
      action: Deploys Reka directly or through Snowflake/Turing in daily workflows
      pain: Need reliability, quotas, and support that match production demand
      outcome: Search, metadata, or multimodal analysis become embedded in the operating workflow
    - label: 5. Expansion
      stage: Expansion
      actor: Budget owner / programme lead
      action: Adds more cameras, assets, departments, or deployment environments
      pain: Budgeting, procurement, and proof of durable usage remain gating factors
      outcome: Account expands if measured ROI beats the friction of custom integration
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU024
  - CU025
  - CU027
  - CU037
