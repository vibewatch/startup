  - type: private-evidence-only
    severity: material
    topic: vertical-demand
    missingEvidence: Customer conversion rates, average contract values, and deployment sizes by segment.
    whyItMatters: Without segment-level commercial data, it is hard to know whether Reka’s strongest visible use cases are niche or repeatable.
