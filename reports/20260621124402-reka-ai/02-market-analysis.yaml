    whyItMatters: Current public data sizes either the full AI stack or very broad multimodal categories, forcing heuristic SAM estimates.
    diligencePath: Obtain paid analyst excerpts or investor diligence materials isolating multimodal enterprise software and model spend.
    relatedQuestionRefs:
