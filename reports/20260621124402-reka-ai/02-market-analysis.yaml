chapter:
  number: 2
  title: Market Analysis
  summary: Reka AI sits inside the enterprise multimodal-foundation-model market rather than the entire generative-AI universe. Gartner says AI-model spend rises from $15.5B in 2025 to $32.6B in 2026 and that 80% of enterprise software will be multimodal by 2030, while IDC frames 2026 as the year AI moves from pilots to transformation. For Reka specifically, the most relevant spending pool is a narrower subset where buyers need video, image, audio, and document reasoning under enterprise governance; evidence supports a multi-billion-dollar addressable layer, but exact SAM remains estimation-heavy because public sources usually size the full AI stack rather than multimodal application niches.
sections:
- id: market-boundary
  title: Market Boundary and Status-Quo Alternatives
  body: 'Reka should not be analyzed as serving the entire AI market. The relevant market is the enterprise multimodal-model layer: software and services that let organizations reason over text, images, video, audio, and private documents under production governance constraints. Gartner’s multimodal forecast and the taxonomy in broader foundation-model reports both support this framing. In practice, Reka is selling into workflows where a plain text LLM is insufficient—security footage search, media-archive tagging, multimodal research, and governed enterprise AI embedded next to proprietary data.


    That definition includes four spending buckets. First is model consumption itself: API or managed-model usage. Second is enterprise application value layered on top of models, such as Reka Vision and Reka Research. Third is deployment and governance work required to run those systems inside a private cloud, VPC, on-premise environment, or air-gapped setting. Fourth is adjacent compute and data-infrastructure spend needed to make multimodal use cases performant enough for production.


    The boundary excludes several look-alike categories. Consumer chatbots are not the core market. Generic office copilots matter indirectly as substitutes, but they do not define the job-to-be-done for Reka’s buyers. Pure robotics hardware, generalized cloud IaaS, and one-off annotation services are also adjacent rather than core. The status quo alternatives are often manual review, keyword metadata systems, narrow computer-vision point tools, or internal buildouts using hyperscaler and open-source components.'
