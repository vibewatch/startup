    severity: minor
    topic: compute-economics
    missingEvidence: Direct company-level data showing how much Blackwell or newer infra improves Reka’s own token economics.
    whyItMatters: Third-party infrastructure trends may not translate one-for-one to Reka’s internal cost structure.
