company:
  name: Reka AI
chapter:
  number: 7
  title: Risks
  summary: 'Reka''s risk profile is investable only if diligence converts a broad set of public signals into hard evidence on training-data governance, compute access, customer concentration, and enterprise controls. The most acute near-term risks are not abstract ''AI risk'' slogans but a practical stack: EU and privacy compliance for general-purpose and multimodal systems, power and GPU bottlenecks that can compress margins or delay capacity, open-model and privacy-first competitor pressure, and execution strain from trying to support a wide product surface with a still-small team. The chapter''s bottom line is therefore conditional: Reka has visible mitigations and strategic backers, but several thesis-breaking items remain privately held rather than publicly evidenced.'
sections:
- id: regulatory-copyright-data-governance
  title: Regulatory, Copyright, and Data-Governance Exposure
  body: 'The legal and governance burden around multimodal model providers has become concrete rather than theoretical. Reka''s own terms help on one narrow point: the public terms say paid API requests are not used for model training unless the customer explicitly opts in, while free usage can be used to improve the models and aggregated anonymized usage data may still be retained for operational purposes. That is directionally supportive for enterprise procurement, but it is not the same as proving that the company already has robust training-data lineage, rights management, or deletion workflows at the standard regulators and large customers now expect. The European Commission''s GPAI guidance and the AI Act text show why this matters. Providers of general-purpose AI models must maintain technical documentation, implement a copyright policy, and publish a summary of training content, while models deemed systemic-risk face added incident-reporting, risk-mitigation, and cybersecurity duties.
    In parallel, the EDPB, ICO, and California privacy regime all point to a second layer of exposure: lawful basis for personal data, biometric or sensitive-data handling, data-subject rights, and explainable governance. The practical risk is not that Reka obviously fails these duties today; it is that the public record reviewed for this chapter does not yet prove how the company operationalizes them across video, image, audio, and document workloads. That gap is material because one privacy or copyright dispute can stall enterprise adoption far faster than model quality improvements can accelerate it.'
