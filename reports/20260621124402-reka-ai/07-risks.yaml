- id: compute-infrastructure-and-dependency
  title: Infrastructure, Compute, and Dependency Risk
  body: 'Reka''s strategy depends on the proposition that efficient multimodal models can stay commercially attractive even as the whole sector races to deploy larger and more numerous workloads. The public macro evidence is a warning, not a comfort blanket. The IEA says data-centre electricity demand surged 17% in 2025 and that data-centre use is set to double by 2030 while AI-focused sites triple, even as chips, transformers, turbines, and grid connections tighten. RAND reaches a similarly stark conclusion, estimating 68 gigawatts of global AI data-centre power demand by 2027 and warning that power scarcity could push infrastructure abroad with security and export-control consequences. DOE and BloombergNEF reinforce the operational version of the same point: gigawatt-scale projects are already colliding with grid lead times and reserve-margin stress. For Reka this matters in two ways. First, even if model efficiency is real, the company still lives inside the same upstream compute, power,
    and hosting bottlenecks as larger rivals. Second, the public chapter record still does not disclose whether Reka has reserved GPU capacity, preferred cloud economics, or power-backed hosting commitments that would protect service quality during a supply squeeze. The result is a classic asymmetric risk: a company can win product evaluations but still lose gross margin or delivery reliability if upstream capacity becomes the real choke point.'
