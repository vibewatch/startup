  evidenceGaps:
  - type: missing-source
    severity: material
    topic: training-data-provenance
    missingEvidence: A dataset inventory, rights analysis, copyright opt-out workflow, and public-summary artifact aligned to GPAI obligations.
    whyItMatters: Without provenance evidence, the legal and enterprise-procurement risk sits at the core of the underwriting case.
    diligencePath: Request the training-data governance pack, counsel memos, takedown workflow, and the current draft of any training-content summary.
    relatedQuestionRefs:
    - QR003
    - QR005
    - QR023
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: reserved-compute-capacity
    missingEvidence: Committed GPU, hosting, or power-backed capacity agreements and the economics attached to them.
    whyItMatters: Capacity opacity makes it impossible to underwrite delivery reliability or margin resilience during infrastructure shortages.
    diligencePath: Request cloud and accelerator contracts, allocation letters, hosting commitments, and stress-test scenarios for constrained supply.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration-and-retention
    missingEvidence: Top-customer and top-partner revenue share, GRR/NRR, renewal cohorts, and channel economics.
    whyItMatters: A small number of accounts or partner routes could make revenue far less durable than the headline valuation implies.
    diligencePath: Request top-10 customer ARR, contract terms, concentration ratios, and renewal history by cohort.
    relatedQuestionRefs:
    - QR022
    relatedTableRefs:
    - TR004
    - TR005
  - type: missing-source
    severity: material
    topic: security-certifications-and-incident-discipline
    missingEvidence: Named certifications, pen-test summaries, incident metrics, and a public trust-center style security packet.
    whyItMatters: Security diligence is one of the most likely places for enterprise deals to stall against larger rivals with richer public controls.
    diligencePath: Request SOC/ISO status, latest pen-test executive summary, incident-response plan, and customer security FAQ.
    relatedQuestionRefs:
    - QR020
    - QR025
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: org-depth-and-key-person-risk
    missingEvidence: An org chart showing second-line owners for compliance, infrastructure, support, and enterprise security roles.
    whyItMatters: A 60-64 person company can execute brilliantly, but only if management has enough depth to absorb regulation, safety, and customer load simultaneously.
    diligencePath: Request the current org chart, open roles, planned senior hires, and role-specific coverage during incidents or vacations.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR004
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register coverage
    missingEvidence: A complete jurisdiction-by-jurisdiction matrix of laws, customer-specific clauses, and product boundaries.
    whyItMatters: The chapter intentionally prioritizes the most decision-relevant regimes; a full contract and jurisdiction inventory is still required for final legal underwriting.
    diligencePath: Build a counsel-reviewed compliance matrix that maps products, geographies, customer verticals, and regulatory triggers.
    relatedQuestionRefs:
    - QR003
    - QR007
    - QR008
    relatedTableRefs:
    - TR001
