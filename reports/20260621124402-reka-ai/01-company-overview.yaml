company:
  name: Reka AI
chapter:
  number: 1
  title: Company Overview
  summary: 'Reka AI is a Sunnyvale-based multimodal model company founded in 2022 by a small team of former frontier-AI researchers. Its commercial posture centers on efficient enterprise deployment: Reka Flash powers API access, Reka Vision handles large-scale video and image reasoning, and Reka Research provides web-and-document grounded research automation. The company raised roughly $168M-$170M across a 2023 Series A and a $110M July 2025 round backed by NVIDIA and Snowflake, lifting valuation above $1B while preserving independence after earlier acquisition talks with Snowflake ended without a deal.'
sections:
- id: identity-product-model
  title: Identity, Product Scope, and Business Model
  body: 'Reka AI presents itself as a research-and-product company building “models and infrastructure for the physical AI era,” which is a more specific positioning than a generic LLM lab. The official site and technical paper both describe Reka as multimodal from the ground up, spanning text, image, video, and audio rather than adding vision as a thin extension later. That matters commercially because the company is not trying to win a broad consumer-chatbot battle; instead it packages foundation-model capability into developer APIs and higher-level enterprise workflows where multimodal context matters more than raw scale alone.


    The product stack breaks into three layers. First, Reka exposes chat models through an API, with public baseline access to reka-flash and reka-edge and pricing that resembles a conventional usage-metered model platform. Second, it sells higher-order applications: Reka Vision for search, reasoning, clipping, and alerting across large video or image corpora, and Reka Research for multi-step web and private-document research. Third, it markets deployment flexibility—API, private cloud, on-premise, VPC, and air-gapped environments—which is unusually prominent for a young startup and fits enterprise buyers in media, security, and regulated environments.


    The company’s economic logic therefore appears to be a hybrid of infrastructure and applied software. Usage-priced APIs monetize direct developer demand, while enterprise tiers, fine-tuning, and deployment projects support larger contract values. Snowflake integration extends distribution into existing enterprise-data workflows, and partner-led products such as Guardian AI let Reka monetize indirectly by embedding multimodal reasoning inside customer-facing systems. The result is a narrower but more enterprise-specific business model than OpenAI-style mass consumer distribution.'
