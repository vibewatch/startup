- id: funding-partnerships
  title: Funding History, Strategic Investors, and Capital Formation
  body: 'Reka’s capital story is short but important. Tracker data points to a 2023 Series A of roughly $58M-$60M at about a $300M valuation, followed by a July 2025 Series B of $110M that lifted valuation above $1B. Snowflake appears in both rounds: first as an investor-partner in 2023 and later again alongside NVIDIA in the 2025 round. That repeat participation suggests Reka cleared a key diligence hurdle for strategic investors: its models were good enough to merit not just partnership press but balance-sheet support.


    Snowflake’s own 2023 announcement framed the partnership around letting customers run and fine-tune Reka inside Snowflake, while later Snowflake materials expanded support for Reka Flash and Core inside Cortex. The strategic interpretation is that Reka gives Snowflake multimodal model inventory and enterprise customization optionality without forcing Snowflake to build every capability internally. For Reka, Snowflake offers enterprise distribution, governance credibility, and a downstream route into data-cloud accounts.


    The adverse wrinkle is that Snowflake also explored buying Reka for more than $1B in 2024, and those negotiations later stopped. That failed transaction does not look fatal—both sides kept collaborating—but it does reveal strategic tension: Reka was valuable enough to attract an acquisition approach, yet chose or accepted continued independence. That independence preserves upside for shareholders, but it also leaves the company to finance talent, compute, and go-to-market expansion without the shelter of a larger platform owner.'
