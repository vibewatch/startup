company:
  name: PointClickCare
chapter:
  number: 6
  title: Customers
  summary: PointClickCare appears deeply embedded in North American long-term and post-acute care workflows, with evidence spanning provider organizations, facilities, clinical users, and named deployments. The evidence is stronger for breadth and workflow centrality than for current retention, expansion, or revenue concentration because current denominators and cohort disclosures are not public in the assigned sources.
sections:
  - id: customer-base-and-buyer
    title: Customer base and buying surfaces
    body: >-
      PointClickCare sells into a multi-sided care-delivery workflow rather than a single
      software persona. The platform is described as serving skilled nursing, senior living,
      hospice, and related post-acute organizations, with nurses, managers, physicians,
      administrators, revenue-cycle teams, and external partners as users. An assigned
      customer database identifies Avamere, Select Rehabilitation, Continuing Healthcare
      Solutions, Carespring Healthcare Management, and Allied Services as organizations using
      the EHR, while the case-study directory lists named technology and operations users at
      PointClickCare itself. These sources establish segment breadth and workflow relevance,
      not a current audited customer count or revenue split. The strongest commercial signal
      is system-of-record behavior: named deployments cover admissions, discharges, bed
      transfers, medication administration, behavioral-health charting, hospice intake, and
      interdisciplinary care. That breadth can support multi-module adoption, but the
      assigned evidence does not quantify module attach rates, pricing, renewal terms, or
      revenue by segment.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption breadth, trajectory, and durability
    body: >-
      Adoption evidence points to substantial scale, but the measures are not interchangeable.
      A 2026 company-issued release says PointClickCare is trusted by over 30,000 provider
      organizations and has a marketplace of more than 400 integrated partners; an
      independent technology guide separately discusses a vendor-reported figure of more
      than 60% of U.S. skilled nursing facilities and distinguishes that from older filing
      snapshots. The same guide records historical 2015 figures of approximately 2,300
      customer organizations, 10,900 facilities, and roughly 850,000 residents served per
      day, explicitly labeling them historical. These datapoints support a large installed
      base and broad workflow penetration, but they do not form a time-series cohort.
      There is no assigned source with current NRR, GRR, churn, renewal rates, contract
      length, or customer-level expansion. Durability is therefore inferred from workflow
      centrality and multi-facility use, not presented as measured retention.
    claimRefs: [CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002]
  - id: named-proof-and-concentration
    title: Named customer proof, expansion, and concentration risk
    body: >-
      Named customer evidence is concrete on use cases but uneven on outcome measurement.
      Apps Run The World describes Allied Services using PointClickCare for admissions,
      discharges, bed transfers, and cross-EMR automation; Avamere deployments for clinical,
      medication, behavioral-health, wound-care, and hospice workflows; and Bella Care
      Hospice for admissions, consent, recertification, care planning, scheduling, and
      interdisciplinary meetings. A separate customer-story directory lists customer
      testimonials and outcomes such as reduced certification time, HIPAA-compliant
      analytics and disaster recovery, and improved care transitions, but does not provide
      a standardized denominator or audited counterfactual. The assigned adverse evidence
      adds a durability risk: the Fourth Circuit affirmed a preliminary injunction after
      finding PointClickCare likely engaged in information blocking in a dispute over
      third-party automated access, while PointClickCare argued bots could create slowdowns
      or outages. This does not prove customer churn, but it makes interoperability and
      partner-access governance a customer-retention variable. Current top-customer
      concentration, pilot-to-production conversion, and outcome persistence remain open.
    claimRefs: [CU011, CU012, CU013, CU014, CU015]
    tableRefs: [TU003]
    figureRefs: [FU001]
