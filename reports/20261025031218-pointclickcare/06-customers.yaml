    notes: "Values have different populations, sources, and periods; they are not a single adoption funnel or compound growth series. Nulls and missing denominators are intentional."
    claimRefs: [CU006, CU007, CU008, CU009, CU010]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment, Deployment/use case, Production vs pilot, Outcome or workflow proof, Limitation]
    rows:
      - [Allied Services, Healthcare organization, "Admissions, discharges, bed transfers, and cross-EMR workflow automation", "Documented implementation in 2014", "PointClickCare served as the system of record for patient administration events", "Historical implementation; outcome magnitude is not quantified"]
      - [Avamere Family Companies, Healthcare organization, "Clinical documentation, medication/treatment administration, behavioral health, wound care, hospice coordination", "Documented implementation in 2018", "Deployment supported care for up to 30 patients concurrently at a described behavioral-health unit", "Site-level example; no current renewal or outcome data"]
      - [Bella Care Hospice, Hospice provider, "Admissions, consent, recertification, care plans, scheduling, and interdisciplinary meetings", "Documented implementation in 2017", "EHR became the authoritative record for recurring hospice workflows", "Historical case; current footprint and outcomes are not disclosed"]
      - [PointClickCare customer references, Multiple provider settings, "Case-study listings include security, disaster recovery, certification, marketing, and care-transition workflows", "Customer-story references; status varies by listing", "Named user and executive quotes show workflow-level engagement", "Directory does not standardize production status, denominator, or counterfactual"]
    enumerationScope:
      coverage: partial
      basis: "Assigned public customer records and case-study listings available through the 2026-10-25 refresh pool"
    notes: "Rows are a partial sample of named proof, not an exhaustive customer census. Historical implementation dates are preserved; production status is stated only where the source supports it."
    claimRefs: [CU011, CU012, CU013, CU014]
