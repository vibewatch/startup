    claimRefs: [CM005, CM006, CM008, CM009]
callouts:
  - calloutType: insight
    title: Vertical market with measurable operating units
    body: PointClickCare's opportunity is strongest where a provider needs one LTPAC system spanning clinical, financial, and connected-care workflows; the provider base is measurable, but public market-value denominators are not.
    claimRefs: [CM001, CM005, CM010]
  - calloutType: risk
    title: Interoperability can be both moat and bottleneck
    body: The Real Time dispute shows that data access, API coverage, security controls, and information-blocking rules can affect partner adoption and create legal friction around a platform's network effects.
    claimRefs: [CM013, CM014, CM015]
