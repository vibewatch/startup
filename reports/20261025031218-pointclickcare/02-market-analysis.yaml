      - [Hospital or health-plan counterpart, "Network, transitions or population-health leadership", "Care managers and analysts", "Enterprise interoperability budget", "Need for timely post-acute data", "Data-sharing terms and governance"]
      - [Analytics or technology partner, "Product and data leadership", "Analysts and automated services", "Partner integration budget", "API or marketplace access", "Security, performance and information-blocking rules"]
    notes: "Buyer roles and triggers are analytical mappings grounded in the platform, value-based-care, and data-access sources; PointClickCare does not publish a complete budget-owner taxonomy."
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
