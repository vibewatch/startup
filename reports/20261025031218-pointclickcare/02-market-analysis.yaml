artifact: market-analysis
slug: pointclickcare
runDate: 2026-10-25
company:
  name: PointClickCare
chapter:
  number: 2
  title: Market Analysis
  summary: PointClickCare addresses a specialized long-term and post-acute care software market whose physical provider base is measurable, geographically concentrated, and increasingly exposed to interoperability and value-based-care requirements. The evidence supports a large and durable core opportunity, but public sources do not isolate PointClickCare's serviceable market, obtainable share, or buyer-level economics.
sections:
  - id: market-boundary
    title: Market boundary and customer economics
    body: >-
      The relevant market is not all electronic health records. It is the software and connected-data
      spend of long-term and post-acute care providers, especially skilled nursing facilities and senior
      living operators, with adjacent demand from hospitals, health plans, pharmacies, and analytics
      partners that need post-acute information. PointClickCare's platform is described as combining
      clinical documentation, medication management, billing, analytics, and interoperability for this
      setting, which makes the core buying decision a workflow and system-of-record decision rather than
      a single-feature purchase. Included spend therefore covers the core EHR, revenue-cycle functions,
      care coordination, data exchange, analytics, and workflow add-ons. Excluded from the core boundary
      are acute-care enterprise EHRs, standalone clinical analytics, staffing services, and facility
      operating revenue; those are adjacencies or substitutes that can influence budget allocation but
      are not interchangeable with the full LTPAC record system. A provider can also retain a status-quo
      mix of legacy software, manual work, and point integrations, so adoption requires migration,
      training, data governance, and confidence that the platform can meet regulatory reporting needs.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing through provider and workflow lenses
    body: >-
      The evidence supports a bottom-up provider lens but not a defensible single TAM number. Definitive
      Healthcare tracks more than 18,400 active U.S. skilled nursing facilities and identifies nearly
      1,900 parent organizations; its 2026 metro table gives 680 facilities in New York-Newark-Jersey City,
      514 in Los Angeles-Long Beach-Anaheim, and 428 in Chicago-Naperville-Elgin. SNFData reports 16,858
      facilities from each facility's most recent Medicare cost report, illustrating why differently scoped
      facility counts cannot be averaged or converted into software spend without a price-per-facility
      assumption. A third technographics lens identifies more than 1,602 companies using PointClickCare
      as an EHR tool in 2026, but detected companies are not interchangeable with facilities or provider
      organizations. PointClickCare materials separately claim more than 30,000 provider organizations and
      a 400-plus partner marketplace. These figures establish operating-unit and workflow lenses, not
      revenue, ARR, or obtainable share. SAM and SOM remain open until contract values, module penetration,
      renewal rates, and buyer segmentation are disclosed.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: adoption-drivers
    title: Buyers, drivers, and constraints
    body: >-
      The primary economic buyer is the skilled nursing or senior living operator, with finance and
      clinical leadership sharing budget ownership because the product affects both resident-care
      workflows and reimbursement administration. Users include nurses, clinicians, administrators, and
      care managers; external beneficiaries include hospitals, health plans, pharmacies, and analytics
      partners that depend on exchangeable records. Adoption is pulled by mandatory reporting, pressure
      to coordinate transitions, and value-based-care models that increasingly require measurable cost and
      quality performance. The Advisory Board's 2026 discussion says CMMI is emphasizing recognizable cost
      savings and downside risk, which increases the value of data integration but also raises the proof
      burden for technology vendors. Switching costs are correspondingly meaningful because a provider
      must migrate records, retrain staff, preserve billing continuity, and connect counterparties.
      Interoperability is also a constraint: the Real Time litigation shows that access controls, APIs,
      security protocols, and information-blocking rules can become commercial friction when analytics
      companies need data beyond the standard interface. This is a market driver and a material adoption
      risk, not proof that every buyer will expand spend.
    claimRefs: [CM010, CM011, CM012, CM013, CM014, CM015]
    tableRefs: [TM003]
  - id: exhibits
    title: Evidence gaps
    body: >-
      Public evidence does not isolate PointClickCare's current LTPAC software revenue, average contract
      value, module attach rate, net retention, customer concentration, or the share of the provider
      universe using competing systems. Published facility, organization, partner, patient, and detected-
      company counts use different units and cannot support a single penetration percentage. The litigation
      also leaves open how commercial API access, security exceptions, and partner economics will evolve.
      These gaps prevent a sourced SAM/SOM conversion and should be resolved with a segmented customer
      count, price book, cohort retention schedule, implementation funnel, competitive win-loss data, and
      documented interoperability economics. Until then, the defensible valuation lens is market structure
      and adoption friction rather than a precise top-down market value.
    claimRefs: [CM009, CM013, CM015, CM016]
