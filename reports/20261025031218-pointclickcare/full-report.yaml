  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      PointClickCare's public product surface layers a cloud EHR and financial core with workflow modules,
      interoperability, and embedded intelligence.
    data:
      layers:
        - name: Trust and access governance
          label: Trust and access governance
          detail: Security, compliance, identity, and customer data-access policy
          items:
            - name: Identity and access controls
              detail: Authentication, authorization, customer permissions, and documented bot or exception policies
            - name: Security and compliance evidence
              detail: Controls, attestations, incident response, and auditability for protected health information
        - name: Intelligence and decision support
          label: Intelligence and decision support
          detail: Embedded AI and analytics for clinical, referral, billing, and operational decisions
          items:
            - name: Advisor Suite
              detail: Chart, Referral, and Billing Advisor surfaces; MDS Advisor was described as beta for 2026
            - name: Analytics and reporting
              detail: Operational, clinical, quality, and financial reporting across facility workflows
        - name: Interoperability and network
          label: Interoperability and network
          detail: APIs, FHIR, interfaces, connectors, and care-coordination connections
          items:
            - name: Partner EHR API
              detail: Publicly cataloged REST API surface for partner access
            - name: HL7 FHIR API
              detail: Publicly cataloged FHIR-oriented clinical interoperability surface
            - name: Care coordination connections
              detail: Interfaces, connectors, and network assets for transitions and external providers
        - name: Workflow applications
          label: Workflow applications
          detail: Clinical, medication, and revenue-cycle workflows
          items:
            - name: Clinical documentation
              detail: Orders, nursing documentation, assessments, care plans, and MDS workflows
            - name: QuickMAR
              detail: Medication and treatment administration documentation with pharmacy-connected workflows
            - name: Revenue Cycle Management
              detail: Billing, claims, collections, and financial workflow support
        - name: Cloud operating core
          label: Cloud operating core
          detail: Cloud-delivered, multi-tenant SaaS system of record
          items:
            - name: Multi-tenant SaaS platform
              detail: >-
                Cloud-delivered system of record for LTPAC workflows with logical customer separation described in
                public analysis
        - name: Engagement and support surfaces
          label: Engagement and support surfaces
          detail: Portals and connected workflows for residents, families, clinicians, and facility teams
          items:
            - name: Resident, family, and physician portals
              detail: >-
                Public product analysis describes portal and secure-messaging surfaces, with exact availability varying
                by setting
