  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strategic scale merits diligence, while stale valuation evidence, missing operating inputs, and legal exposure
      prevent a current price endorsement.
    data:
      nodes:
        - id: vertical-position
          label: Specialized cloud EHR position
        - id: asserted-scale
          label: Company-asserted provider and patient scale
        - id: stale-marker
          label: Historical $4B valuation marker
        - id: missing-inputs
          label: Revenue, ARR, NRR, margins, and waterfall missing
        - id: legal-overhang
          label: Data-access and information-blocking overhang
        - id: recommendation
          label: Research-more before entry
      edges:
        - from: vertical-position
          to: asserted-scale
        - from: asserted-scale
          to: stale-marker
        - from: stale-marker
          to: missing-inputs
        - from: missing-inputs
          to: legal-overhang
        - from: legal-overhang
          to: recommendation
    approximationNotes: The flow is a qualitative decision sequence, not a score, probability model, or quantitative bridge.
    claimRefs:
