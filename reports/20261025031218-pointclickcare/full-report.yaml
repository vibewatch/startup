  - id: FU001
    title: Customer journey from adoption to expansion
    type: journey-map
    summary: >-
      PointClickCare's documented customer journey moves from facility workflow adoption to cross-setting coordination
      and ecosystem expansion, with interoperability governance as the principal unresolved friction.
    data:
      nodes:
        - id: segment
          label: Care setting fit
          title: SNF, senior living, hospice, and home-based workflows
          detail: Buyer and user groups span operators, clinical teams, administrators, and interdisciplinary staff.
        - id: core
          label: Core EHR
          title: Clinical and operational system of record
          detail: Admissions, documentation, medication, care plans, billing, and regulatory workflows.
        - id: expansion
          label: Module expansion
          title: RCM, analytics, portals, and care coordination
          detail: Named evidence covers revenue-cycle, analytics, portals, and transition workflows.
        - id: network
          label: Cross-setting network
          title: Hospitals, pharmacies, health plans, and marketplace partners
          detail: Company materials cite 400+ integrated partners and broad data exchange.
        - id: outcomes
          label: Operational outcomes
          title: Continuity, utilization, and administrative efficiency
          detail: Sources document workflow use and selected modeled or testimonial outcomes, not a uniform measured cohort.
        - id: friction
          label: Durability friction
          title: API access, security controls, and partner governance
          detail: The Real Time dispute shows that third-party access terms can become a customer and ecosystem risk.
