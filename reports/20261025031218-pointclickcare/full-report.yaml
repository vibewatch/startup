chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and operating model
        blocks:
          - type: paragraph
            body: >-
              PointClickCare was founded in Mississauga in 2000 by brothers Dave and Mike Wessinger, initially as a
              clinical documentation tool for one long-term-care facility. The available profile evidence describes a
              later expansion across skilled nursing, assisted living, independent living, and home health, with
              products spanning electronic health records, medication management, billing, population health analytics,
              and care transitions. A separate company profile characterizes the business as a cloud-based EHR and
              care-coordination platform for senior and post-acute care. The company's own March 2026 release describes
              a next-generation EHR for practice groups with native AI workflow features and bi-directional exchange
              across PointClickCare and non-PointClickCare facilities. These sources support the identity and product
              model, but not a complete segment-level revenue split or a verified current valuation.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO009
              - CO010
              - CO007
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.2'
        title: Leadership, ownership, and capital
        blocks:
          - type: paragraph
            body: >-
              The evidence identifies Dave Wessinger as CEO and co-founder and Mike Wessinger as executive chair and
              co-founder, indicating meaningful founder continuity. An investor-profile source says Brian Gannon,
              formerly of TriNet, became CFO in December 2024; that change is a relevant maturity and governance signal,
              although the available evidence does not establish a full board roster, succession plan, or employment
              terms. The company is described as privately held, with Dragoneer Investment Group, Hellman & Friedman,
              and JMI Equity among its backers. A 2021 secondary investment is reported as valuing the company at
              approximately $18.4 billion, but this is a historical third-party report rather than a current mark.
              Current total raised, debt, preference terms, and any confirmed IPO timetable remain unsupported in this
              pool.
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Scale, customers, and product expansion
        blocks:
          - type: paragraph
            body: >-
              PointClickCare's scale is visible primarily through operating-footprint disclosures rather than audited
              financial statements. The March 2026 company release says the platform is trusted by over 30,000 provider
              organizations. A 2025 trade report gives a more granular but different snapshot: more than 27,000
              long-term and post-acute providers, 3,600 ambulatory clinics, 2,800 hospitals, 350 risk-bearing providers,
              and 70 state and government agencies. The same report says a separate analytics company served roughly
              1,700 skilled nursing facilities, illustrating the scale of a data-access ecosystem but not PointClickCare
              revenue. The company also says its 2026 practice-group product embeds Ambient Scribe and
              clinical-prioritization tools; an early adopter reported saving five minutes per note, a customer
              statement rather than an independently measured outcome. The conflicting provider totals should be carried
              as period- and definition-sensitive rather than reconciled into one exact customer count.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: Milestones and material risks
        blocks:
          - type: paragraph
            body: >-
              The most material documented risk is the Real Time Medical Systems litigation over automated access to
              PointClickCare-hosted records. A Fourth Circuit case summary says the district court granted a preliminary
              injunction and that the appellate court affirmed, finding PointClickCare's conduct likely implicated
              information blocking and that the company had not shown an applicable exception. Trade coverage records
              PointClickCare's position that bots posed security and performance risks, while also reporting that the
              court record was preliminary and contested. This is a legal and platform-governance risk, not proof of a
              final liability judgment. The milestone record also includes the 2024 lawsuit filing, the 2025 appellate
              decision, the June 2025 renewed dismissal effort, and the March 2026 practice-group EHR launch. The pool
              does not establish a post-breach forensic report, current enforcement outcome, audited revenue, or a
              current valuation, so those remain explicit diligence gaps.
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Embedded workflow and distribution
            body: >-
              The evidence supports a purpose-built senior-care EHR with a broad provider footprint and product
              expansion into practice-group workflows, analytics, and interoperability.
            calloutType: strength
            claimRefs:
              - CO002
              - CO009
              - CO012
          - type: callout
            title: Data-access litigation remains material
            body: >-
              The preliminary-injunction record creates an unresolved legal, interoperability, and
              competitive-governance risk; it should not be treated as a final merits judgment.
            calloutType: risk
            claimRefs:
              - CO013
              - CO014
              - CO015
          - type: callout
            title: Private-company metrics are not interchangeable
            body: >-
              Provider-site counts, organization counts, revenue, valuation, and funding are different measures; the
              available sources do not support converting one into another.
            calloutType: assumption
            claimRefs:
              - CO009
              - CO010
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and customer economics
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all electronic health records. It is the software and connected-data spend of
              long-term and post-acute care providers, especially skilled nursing facilities and senior living
              operators, with adjacent demand from hospitals, health plans, pharmacies, and analytics partners that need
              post-acute information. PointClickCare's platform is described as combining clinical documentation,
              medication management, billing, analytics, and interoperability for this setting, which makes the core
              buying decision a workflow and system-of-record decision rather than a single-feature purchase. Included
              spend therefore covers the core EHR, revenue-cycle functions, care coordination, data exchange, analytics,
              and workflow add-ons. Excluded from the core boundary are acute-care enterprise EHRs, standalone clinical
              analytics, staffing services, and facility operating revenue; those are adjacencies or substitutes that
              can influence budget allocation but are not interchangeable with the full LTPAC record system. A provider
              can also retain a status-quo mix of legacy software, manual work, and point integrations, so adoption
              requires migration, training, data governance, and confidence that the platform can meet regulatory
              reporting needs.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
      - number: '2.2'
        title: Sizing through provider and workflow lenses
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a bottom-up provider lens but not a defensible single TAM number. Definitive
              Healthcare tracks more than 18,400 active U.S. skilled nursing facilities and identifies nearly 1,900
              parent organizations; its 2026 metro table gives 680 facilities in New York-Newark-Jersey City, 514 in Los
              Angeles-Long Beach-Anaheim, and 428 in Chicago-Naperville-Elgin. SNFData reports 16,858 facilities from
              each facility's most recent Medicare cost report, illustrating why differently scoped facility counts
              cannot be averaged or converted into software spend without a price-per-facility assumption. A third
              technographics lens identifies more than 1,602 companies using PointClickCare as an EHR tool in 2026, but
              detected companies are not interchangeable with facilities or provider organizations. PointClickCare
              materials separately claim more than 30,000 provider organizations and a 400-plus partner marketplace.
              These figures establish operating-unit and workflow lenses, not revenue, ARR, or obtainable share. SAM and
              SOM remain open until contract values, module penetration, renewal rates, and buyer segmentation are
              disclosed.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
      - number: '2.3'
        title: Buyers, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary economic buyer is the skilled nursing or senior living operator, with finance and clinical
              leadership sharing budget ownership because the product affects both resident-care workflows and
              reimbursement administration. Users include nurses, clinicians, administrators, and care managers;
              external beneficiaries include hospitals, health plans, pharmacies, and analytics partners that depend on
              exchangeable records. Adoption is pulled by mandatory reporting, pressure to coordinate transitions, and
              value-based-care models that increasingly require measurable cost and quality performance. The Advisory
              Board's 2026 discussion says CMMI is emphasizing recognizable cost savings and downside risk, which
              increases the value of data integration but also raises the proof burden for technology vendors. Switching
              costs are correspondingly meaningful because a provider must migrate records, retrain staff, preserve
              billing continuity, and connect counterparties. Interoperability is also a constraint: the Real Time
              litigation shows that access controls, APIs, security protocols, and information-blocking rules can become
              commercial friction when analytics companies need data beyond the standard interface. This is a market
              driver and a material adoption risk, not proof that every buyer will expand spend.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Evidence gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not isolate PointClickCare's current LTPAC software revenue, average contract value,
              module attach rate, net retention, customer concentration, or the share of the provider universe using
              competing systems. Published facility, organization, partner, patient, and detected- company counts use
              different units and cannot support a single penetration percentage. The litigation also leaves open how
              commercial API access, security exceptions, and partner economics will evolve. These gaps prevent a
              sourced SAM/SOM conversion and should be resolved with a segmented customer count, price book, cohort
              retention schedule, implementation funnel, competitive win-loss data, and documented interoperability
              economics. Until then, the defensible valuation lens is market structure and adoption friction rather than
              a precise top-down market value.
            claimRefs:
              - CM009
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertical market with measurable operating units
            body: >-
              PointClickCare's opportunity is strongest where a provider needs one LTPAC system spanning clinical,
              financial, and connected-care workflows; the provider base is measurable, but public market-value
              denominators are not.
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM010
          - type: callout
            title: Interoperability can be both moat and bottleneck
            body: >-
              The Real Time dispute shows that data access, API coverage, security controls, and information-blocking
              rules can affect partner adoption and create legal friction around a platform's network effects.
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports a segmented landscape rather than one interchangeable EHR category.
              PointClickCare is described as purpose-built for long-term and post-acute care, with admission, census,
              payer, room, transfer, discharge, billing, and coordination workflows. MatrixCare is the closest named
              LTPAC alternative in the assigned comparison sources, while WellSky and KanTime are framed around
              home-health needs. Epic, Oracle Health, MEDITECH, Veradigm, athenahealth, and eClinicalWorks are adjacent
              generalist choices whose broader acute or ambulatory scope does not by itself establish equivalent LTPAC
              depth. SeniorCRE represents a likely adjacent entrant in operator infrastructure, and Real Time
              demonstrates that analytics can sit above the system of record. Manual reports, exports, and
              customer-directed access remain status-quo substitutes. Public comparison pages are useful for class
              discovery, not market-share or outcome benchmarking.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP010
              - CP011
              - CP012
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP010
              - CP012
              - CP014
      - number: '3.2'
        title: Capability, packaging, and buyer economics
        blocks:
          - type: paragraph
            body: >-
              Buying criteria should be normalized around care-setting fit, workflow coverage, interoperability,
              implementation burden, and total contract cost. Public pricing is particularly weak. Enzo, itself a
              competing home-health vendor, says PointClickCare uses custom quotes driven by organization size, modules,
              and care settings; its dollar ranges and competitor prices are explicitly third-party estimates, not
              vendor rate cards or realized customer contracts. The evidence therefore supports directional comparisons
              only. PointClickCare appears strongest for facility-centered buyers that value an integrated resident
              record and partner ecosystem. Home-health-only buyers have more specialized alternatives, while acute-care
              organizations can keep broader incumbent EHRs. Unsupported feature cells remain unknown because
              product-listing overlap is not proof of functional parity, and the assigned sources do not disclose
              competitor funding, retention, win rates, or normalized implementation economics.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP009
              - CP010
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP015
      - number: '3.3'
        title: Moat durability, channel power, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              PointClickCare's moat is best understood as a combination of specialized workflow, installed distribution,
              and controlled integration rather than an unassailable feature lead. A company-issued release reports
              repeated KLAS recognition, more than 30,000 provider organizations, and over 400 integrated marketplace
              partners; a company appellate brief separately claims more than 30,000 healthcare providers and over 1.6
              million patients. These issuer claims indicate scale but are not independent market-share measures. The
              same ecosystem creates tension over who controls data access. The Fourth Circuit summary and trade
              reporting describe an affirmed preliminary injunction in the Real Time dispute and likely information
              blocking, while PointClickCare argues that bot restrictions protect security, performance, and contractual
              controls. This conflict makes partner access a two-sided moat: governed APIs can reinforce retention and
              trust, but restrictive terms can provoke competitive, customer, and regulatory challenge. Durability
              should therefore be underwritten from actual contracts, API terms, migration rights, and customer
              references rather than awards or directory rankings alone.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Specialization is the defensible core
            body: >-
              The evidence consistently distinguishes PointClickCare through LTPAC-specific workflows and ecosystem
              breadth, not through a universally superior EHR feature set.
            calloutType: strength
            claimRefs:
              - CP001
              - CP004
              - CP010
          - type: callout
            title: Ecosystem control can become a liability
            body: >-
              The Real Time litigation shows that access restrictions intended to protect performance and security can
              also be challenged as anticompetitive information blocking.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP016
          - type: callout
            title: Compare contracts, not list-page claims
            body: >-
              Require matched quotes, implementation scopes, API terms, data-export rights, and references from the same
              care setting before assigning value to pricing or switching-cost advantages.
            calloutType: recommendation
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              PointClickCare appears to monetize a modular cloud platform for long-term and post-acute care through
              custom enterprise contracts rather than a public self-serve rate card. Enzo's pricing review describes a
              subscription quoted by organization, with beds or census, module selection, and care settings driving the
              quote, and says facility contracts are commonly structured per bed per month (CI006, CI008). The same
              source gives third-party monthly estimates from $500-$2,000 for small organizations, $2,000-$5,000 for
              medium organizations, and $5,000-$15,000+ for large organizations, explicitly labeling these as estimates
              rather than vendor-published figures (CI007). This supports a recurring software-revenue model, not a
              verified ARR figure. The platform's stated scope includes clinical documentation, billing, care
              coordination, and compliance modules, so mix and realized price likely vary materially by setting and
              bundle; no source in this pool provides contracted price, discounting, renewal, or module-level revenue
              mix.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
              - CI006
              - CI008
              - CI009
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.2'
        title: Cost structure and operating leverage
        blocks:
          - type: paragraph
            body: >-
              The cost base is likely shaped by implementation, onboarding, training, data migration, integrations, and
              ongoing support in addition to product engineering and customer success. Enzo lists implementation and
              onboarding, recurring training, above-base support, custom interfaces, and data migration as costs to test
              separately from the subscription (CI009). It also suggests first-year total cost can run two to three
              times annualized subscription once setup, training, migration, and interfaces are included, but this is a
              category heuristic, not a PointClickCare disclosure (CI009). PointClickCare's scale proxy is meaningful:
              Growjo estimates 2,399 employees and $480.3M annual revenue, implying about $200,200 revenue per employee
              as its own estimate (CI001, CI004). That ratio is not a gross-margin or cash-generation measure. There is
              no public evidence here for gross margin, hosting cost, support cost per facility, CAC, sales cycle,
              payback, working capital, capex, or service-delivery cost, so operating leverage cannot be underwritten
              from the pool alone.
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI004
              - CI009
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Growjo estimates $230M of total funding and a current valuation of $4B, but those are third-party
              estimates and do not establish cash on hand, liquidity, proceeds remaining, debt, preferred terms, burn,
              or runway (CI002, CI003). The assigned evidence contains no cash balance, debt schedule, financing
              covenant, next-round trigger, or planned use of funds. It therefore cannot support a capital-adequacy
              conclusion or a precise valuation multiple. Commercial scale may be substantial: Taction, an integration
              provider, describes 27,000+ LTC/PAC providers and 3,100+ hospitals, while Healthcare IT Today reports the
              company said more than 1.2 million professionals access the platform daily and that it serves
              approximately 1.6 million patients; these are company or partner-reported traction figures, not audited
              revenue evidence (CI015, CI014). The adverse legal record also shows that PointClickCare characterized
              automated access as a risk of slowdowns or outages for paying customers, while the Fourth Circuit affirmed
              a preliminary injunction finding likely information blocking (CI011, CI012). This creates potential
              compliance, platform-governance, and partner-economics exposure that should be reflected in underwriting
              rather than treated as a settled financial loss.
            claimRefs:
              - CI002
              - CI003
              - CI011
              - CI012
              - CI014
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recurring monetization is plausible
            body: >-
              A custom, capacity-linked subscription model and broad module scope are consistent with recurring
              enterprise software revenue, but realized pricing and retention remain unverified.
            calloutType: strength
            claimRefs:
              - CI006
              - CI008
          - type: callout
            title: Capital adequacy is not observable
            body: >-
              Funding and valuation estimates do not establish cash available, burn, runway, debt, or financing
              dependency; these are blocking underwriting gaps.
            calloutType: risk
            claimRefs:
              - CI002
              - CI003
          - type: callout
            title: Data-access dispute may affect partner economics
            body: >-
              The preliminary-injunction record creates legal and ecosystem risk around automated access, security
              exceptions, and the economics of third-party data use.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              PointClickCare is delivered as a cloud-based electronic health record and operating platform for long-term
              and post-acute care. The public product descriptions place the system in the daily workflow of skilled
              nursing, senior-living, and related post-acute providers: clinical documentation, assessments, care plans,
              medication administration, billing, claims, analytics, and care transitions are represented as modules or
              connected services rather than as a single point solution. The independent API profile identifies a
              partner EHR API and an HL7 FHIR API, with a developer portal and REST base URL, which is concrete evidence
              of a programmatic interoperability surface rather than merely a marketing claim. IntuitionLabs describes
              the platform as a cloud-delivered, multi-tenant system of record, while cautioning that product pages do
              not establish every clinical capability; for example, QuickMAR documentation supports medication
              administration and pharmacy-connected workflows but does not establish prescribing authority. The
              resulting product thesis is breadth and workflow centrality, with diligence focused on the exact licensed
              modules, data scopes, implementation effort, and realized customer outcomes.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE004
              - CE006
              - CE007
              - CE008
      - number: '5.2'
        title: Architecture, integrations, and maturity
        blocks:
          - type: paragraph
            body: >-
              The public architecture is best understood as a layered SaaS operating model. A shared cloud application
              layer supports a logical separation of customer data, while domain modules handle clinical records,
              medication administration, revenue-cycle work, analytics, and resident or family engagement. External
              connectivity is a strategic layer: PointClickCare exposes APIs and FHIR-oriented interoperability, and the
              broader platform has been extended through care-coordination and network assets. This structure can reduce
              duplicate entry and make the product more valuable as a facility adds workflows, but it also creates
              dependency on interface contracts, partner permissions, data mapping, and reliable change control. The
              current maturity signal is mixed by feature. Core EHR and RCM functions are described as established
              workflows; the June 2026 Advisor release says Billing Advisor is available to all skilled nursing
              providers using the PointClickCare EHR, while MDS Advisor was described as beta for 2026. That distinction
              matters: announced, generally available, beta, and planned capabilities should not be treated as
              equivalent deployment maturity. The product architecture is therefore credible as a broad platform, but
              module-level availability, integration test evidence, uptime history, and migration controls remain
              customer-specific diligence items.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE009
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
              - CE009
      - number: '5.3'
        title: Trust, safety, and technical risk
        blocks:
          - type: paragraph
            body: >-
              PointClickCare operates in a high-consequence data environment where confidentiality, availability, and
              permitted use of electronic health information are product requirements, not optional add-ons. The
              strongest adverse evidence is the Real Time Medical Systems dispute. The Fourth Circuit summary says the
              district court found PointClickCare's access restrictions likely constituted information blocking and that
              PointClickCare did not demonstrate that an exception applied; the independent legal analysis further
              reports that the court viewed the security and performance rationale as insufficiently documented and not
              shown to be consistently applied. McKnight's account records PointClickCare's contrary position that
              automated bots could cause slowdowns or outages and that customer agreements prohibit screen scraping.
              These are competing positions in ongoing litigation, not proof that the platform is insecure or that every
              access control is unlawful. They do show a technical-governance risk: platform security controls, partner
              authentication, API coverage, bot policy, exception documentation, and customer data rights must be
              designed and evidenced together. The product review should therefore request current security
              attestations, incident and uptime history, interface inventories, access-control standards, and the
              documented process for handling legitimate third-party analytics access.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Diligence priority
            body: >-
              Require a module-by-module product inventory and an interoperability control pack before underwriting
              maturity: endpoint coverage, tenant isolation, uptime, incident history, AI governance, and the documented
              basis for blocking or allowing automated data access.
            calloutType: recommendation
            claimRefs:
              - CE005
              - CE007
              - CE009
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and buying surfaces
        blocks:
          - type: paragraph
            body: >-
              PointClickCare sells into a multi-sided care-delivery workflow rather than a single software persona. The
              platform is described as serving skilled nursing, senior living, hospice, and related post-acute
              organizations, with nurses, managers, physicians, administrators, revenue-cycle teams, and external
              partners as users. An assigned customer database identifies Avamere, Select Rehabilitation, Continuing
              Healthcare Solutions, Carespring Healthcare Management, and Allied Services as organizations using the
              EHR, while the case-study directory lists named technology and operations users at PointClickCare itself.
              These sources establish segment breadth and workflow relevance, not a current audited customer count or
              revenue split. The strongest commercial signal is system-of-record behavior: named deployments cover
              admissions, discharges, bed transfers, medication administration, behavioral-health charting, hospice
              intake, and interdisciplinary care. That breadth can support multi-module adoption, but the assigned
              evidence does not quantify module attach rates, pricing, renewal terms, or revenue by segment.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
      - number: '6.2'
        title: Adoption breadth, trajectory, and durability
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence points to substantial scale, but the measures are not interchangeable. A 2026
              company-issued release says PointClickCare is trusted by over 30,000 provider organizations and has a
              marketplace of more than 400 integrated partners; an independent technology guide separately discusses a
              vendor-reported figure of more than 60% of U.S. skilled nursing facilities and distinguishes that from
              older filing snapshots. The same guide records historical 2015 figures of approximately 2,300 customer
              organizations, 10,900 facilities, and roughly 850,000 residents served per day, explicitly labeling them
              historical. These datapoints support a large installed base and broad workflow penetration, but they do
              not form a time-series cohort. There is no assigned source with current NRR, GRR, churn, renewal rates,
              contract length, or customer-level expansion. Durability is therefore inferred from workflow centrality
              and multi-facility use, not presented as measured retention.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
      - number: '6.3'
        title: Named customer proof, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Named customer evidence is concrete on use cases but uneven on outcome measurement. Apps Run The World
              describes Allied Services using PointClickCare for admissions, discharges, bed transfers, and cross-EMR
              automation; Avamere deployments for clinical, medication, behavioral-health, wound-care, and hospice
              workflows; and Bella Care Hospice for admissions, consent, recertification, care planning, scheduling, and
              interdisciplinary meetings. A separate customer-story directory lists customer testimonials and outcomes
              such as reduced certification time, HIPAA-compliant analytics and disaster recovery, and improved care
              transitions, but does not provide a standardized denominator or audited counterfactual. The assigned
              adverse evidence adds a durability risk: the Fourth Circuit affirmed a preliminary injunction after
              finding PointClickCare likely engaged in information blocking in a dispute over third-party automated
              access, while PointClickCare argued bots could create slowdowns or outages. This does not prove customer
              churn, but it makes interoperability and partner-access governance a customer-retention variable. Current
              top-customer concentration, pilot-to-production conversion, and outcome persistence remain open.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU006
              - CU011
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow centrality
            body: >-
              Named deployments and independent descriptions place PointClickCare inside clinical, administrative, and
              cross-setting workflows rather than at a single point solution.
            calloutType: strength
            claimRefs:
              - CU003
              - CU011
              - CU012
              - CU013
          - type: callout
            title: Retention is not publicly measured here
            body: >-
              The assigned evidence does not provide current NRR, GRR, churn, renewal, contract length, or customer
              concentration, so durability should not be scored as proven.
            calloutType: risk
            claimRefs:
              - CU010
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The Real Time Medical Systems dispute is the most concrete company-specific risk in the assigned evidence.
              The Fourth Circuit affirmed a preliminary injunction for Real Time and agreed that PointClickCare's
              actions likely violated the Cures Act's information-blocking prohibition; this was a preliminary
              assessment, not a final merits disposition. As of June 10, 2025, McKnight's reported that PointClickCare
              had renewed its motion to dismiss while the injunction remained in place. The court's treatment of
              PointClickCare's manner, security, and health-IT-performance defenses makes documentation quality,
              consistent enforcement, and alternate data-access coverage central control tests. The case also creates a
              broader pathway for alleged Cures Act violations to support Maryland unfair-competition claims even though
              the federal statute itself has no private right of action.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR014
      - number: '7.2'
        title: Operational resilience and patient-data security
        blocks:
          - type: paragraph
            body: >-
              Platform availability and data integrity have unusually high consequences because PointClickCare's own
              appellate brief described more than 30,000 provider organizations and over 1.6 million patients using the
              platform. The same brief alleged one bot-related system collapse affecting 10,000 patients and a separate
              latency incident affecting 7,700 patients, but those figures are litigant assertions rather than
              independently verified incidents. A Documo partner article describes encryption, individual credentials,
              business-associate agreements, and physical, technical, and administrative safeguards; it is not an
              independent control attestation. Sector evidence raises the baseline threat: HIPAA Journal reported that
              hacking and other IT incidents accounted for more than 80% of large healthcare breaches in 2025, while
              DeXpose describes third-party and supply-chain compromise as rivaling direct attacks.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Partner, workflow, and model dependencies
        blocks:
          - type: paragraph
            body: >-
              PointClickCare's data ecosystem is both a moat and a control surface. McKnight's reported the company's
              statement that roughly 1,900 other data partners followed specified security protocols and paid a
              reasonable access rate, but the assigned evidence does not independently reconcile that population, its
              concentration, or the commercial terms. The Real Time dispute demonstrates how access method, API
              coverage, bot restrictions, and price can migrate from partner negotiation into litigation and
              reputational exposure. Third-party descriptions also make clear that cross-continuum data exchange and
              integrated workflows are core to the product proposition, so a failure in an access path can affect
              customer operations rather than merely an optional add-on. Public custom-pricing descriptions leave
              implementation and margin sensitivity unquantified.
            claimRefs:
              - CR006
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR012
              - CR013
              - CR016
      - number: '7.4'
        title: Residual risk, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Legal and access-governance exposure ranks highest because it is supported by an affirmed preliminary
              injunction, continuing litigation, and judicial skepticism toward the evidence then offered for
              PointClickCare's exceptions. Cyber and continuity risk ranks next because the platform's asserted scale
              magnifies harm, while public evidence does not establish current recovery performance or independent
              control effectiveness. Mitigation should be judged through the live case docket, exception memoranda,
              consistent access-control logs, API completeness, SOC or HITRUST evidence, incident and recovery testing,
              partner concentration, and insurance coverage. Thesis-break triggers are a final adverse
              information-blocking outcome that constrains the operating model, a material patient-data or availability
              event, repeated inability to support access restrictions with documented evidence, or losses and
              remediation costs that exceed verified insurance and liquidity capacity.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
              - CR010
              - CR011
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              A final adverse information-blocking outcome or material patient-data event would require a full
              re-underwrite of product access, compliance cost, customer trust, and loss-absorption capacity.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR010
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and valuation anchor
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a research-more recommendation with medium confidence and high risk, rather than a
              price-insensitive buy. Tracxn reports $283M of cumulative funding across five rounds and a $4B valuation
              dated January 6, 2021. That is a historical third-party marker, not evidence of a current financing price.
              Sacra's much thinner fetched profile displays $86.91M under "Funding" alongside 2024 without defining the
              denominator, illustrating why public financing aggregations cannot substitute for primary transaction
              documents. The assigned sources provide no verified current revenue or ARR denominator, so neither a
              current enterprise value nor an entry multiple can be calculated responsibly. A buyer should require a
              current financing document, audited recurring-revenue bridge, cohort retention, and the cap-table and
              preference waterfall before underwriting a secondary purchase.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and price sensitivity
        blocks:
          - type: paragraph
            body: >-
              The thesis is that PointClickCare occupies a specialized, regulated workflow where a cloud-based EHR can
              become a durable system of record. ResearchOrg describes the company as bringing cloud EHR technology to a
              long-term and post-acute market underserved by legacy on-premise systems, while Tracxn ranks it first in
              its six-company active-competitor set. PointClickCare's own appellate brief claims more than 30,000
              healthcare-provider users and more than 1.6 million patients; those figures demonstrate the company's
              asserted scale but remain company-issued litigation evidence, not independent verification. The
              anti-thesis is that platform centrality creates interoperability and regulatory exposure. The Fourth
              Circuit affirmed a preliminary injunction in the Real Time dispute, and the current status after the June
              2025 reporting is not established by the assigned pool. The recommendation should improve only after
              scale, retention, margins, and the legal remedy are independently verified.
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
      - number: '8.3'
        title: Scenarios and comparable valuation framework
        blocks:
          - type: paragraph
            body: >-
              A revenue-multiple framework is the least-worst public benchmark until PointClickCare's profitability and
              cash generation are disclosed, but it cannot produce a dollar valuation without a verified denominator.
              Aventis reports a 4.6x median public SaaS EV/revenue multiple as of August 2026 and a 3.1x median for the
              explicitly small first-quarter 2026 private SaaS M&A sample. A separate independent reference describes
              healthtech SaaS as spanning roughly 1x to 7x, showing that vertical labels alone do not select a multiple.
              The scenario bands therefore segment those observed reference points rather than assert a PointClickCare
              value: the bear case uses 1.0x-3.1x revenue, the base case 3.1x-4.6x, and the bull case 4.6x-7.0x. Growth,
              NRR, gross margin, cash conversion, recurring-revenue purity, private-company illiquidity, dilution, and
              the legal outcome must determine where within or outside those reference bands the company belongs.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Diligence asks, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Public evidence is not sufficient to establish exit readiness or a target return. Before committing
              capital, obtain audited 2024-2026 revenue and ARR bridges, bookings, churn and NRR cohorts, gross-margin
              and free-cash-flow statements, debt, option dilution, liquidation preferences, secondary-transfer terms,
              and a current legal-status memorandum for the Real Time matter. The investment thesis should break if
              verified retention is materially weaker than the platform narrative, margins or cash conversion require
              unmodeled capital, a financing below the historical marker exposes preference overhang, or a legal remedy
              makes compliant data access commercially unattractive. Positive movement requires primary evidence of
              durable expansion, improving profitability, a clean preference waterfall, and a documented access model
              that customers, partners, and regulators can sustain. Until then, the appropriate exit assumption is
              unproven rather than an invented IPO timetable or return multiple.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Defer price commitment
            body: >-
              The assigned evidence supports research-more, not buy: obtain a current recurring-revenue denominator and
              financing waterfall before accepting any secondary valuation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV015
              - CV016
          - type: callout
            title: Legal exposure is valuation-relevant
            body: >-
              The affirmed preliminary injunction makes remediation, documentation, and data-access economics required
              underwriting workstreams; the assigned evidence does not establish the matter's current disposition.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
          - type: callout
            title: Comparable multiples are reference points
            body: >-
              Public and private SaaS multiples describe market regimes, not a PointClickCare valuation; applying them
              requires verified revenue quality, growth, retention, and margins.
            calloutType: assumption
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV016
