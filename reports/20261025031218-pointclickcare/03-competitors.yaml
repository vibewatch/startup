company:
  name: PointClickCare
chapter:
  number: 3
  title: Competitors
  summary: >-
    PointClickCare's clearest competitive advantage is specialized long-term and
    post-acute care workflow depth reinforced by an extensive integration channel.
    That position is durable but not absolute: home-health specialists, generalist
    EHRs, adjacent operating platforms, and customer-directed analytics all attack
    portions of the job, while opaque pricing and the Real Time data-access dispute
    expose limits to ecosystem control.
sections:
  - id: competitive-landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      The available evidence supports a segmented landscape rather than one
      interchangeable EHR category. PointClickCare is described as purpose-built
      for long-term and post-acute care, with admission, census, payer, room,
      transfer, discharge, billing, and coordination workflows. MatrixCare is the
      closest named LTPAC alternative in the assigned comparison sources, while
      WellSky and KanTime are framed around home-health needs. Epic, Oracle Health,
      MEDITECH, Veradigm, athenahealth, and eClinicalWorks are adjacent generalist
      choices whose broader acute or ambulatory scope does not by itself establish
      equivalent LTPAC depth. SeniorCRE represents a likely adjacent entrant in
      operator infrastructure, and Real Time demonstrates that analytics can sit
      above the system of record. Manual reports, exports, and customer-directed
      access remain status-quo substitutes. Public comparison pages are useful for
      class discovery, not market-share or outcome benchmarking.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP015]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: buyer-economics
    title: Capability, packaging, and buyer economics
    body: >-
      Buying criteria should be normalized around care-setting fit, workflow
      coverage, interoperability, implementation burden, and total contract cost.
      Public pricing is particularly weak. Enzo, itself a competing home-health
      vendor, says PointClickCare uses custom quotes driven by organization size,
      modules, and care settings; its dollar ranges and competitor prices are
      explicitly third-party estimates, not vendor rate cards or realized customer
      contracts. The evidence therefore supports directional comparisons only.
      PointClickCare appears strongest for facility-centered buyers that value an
      integrated resident record and partner ecosystem. Home-health-only buyers
      have more specialized alternatives, while acute-care organizations can keep
      broader incumbent EHRs. Unsupported feature cells remain unknown because
      product-listing overlap is not proof of functional parity, and the assigned
      sources do not disclose competitor funding, retention, win rates, or
      normalized implementation economics.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP008]
    tableRefs: [TP002, TP003]
  - id: moat-and-channel-power
    title: Moat durability, channel power, and adverse evidence
    body: >-
      PointClickCare's moat is best understood as a combination of specialized
      workflow, installed distribution, and controlled integration rather than an
      unassailable feature lead. A company-issued release reports repeated KLAS
      recognition, more than 30,000 provider organizations, and over 400 integrated
      marketplace partners; a company appellate brief separately claims more than
      30,000 healthcare providers and over 1.6 million patients. These issuer
      claims indicate scale but are not independent market-share measures. The same
      ecosystem creates tension over who controls data access. The Fourth Circuit
      summary and trade reporting describe an affirmed preliminary injunction in
      the Real Time dispute and likely information blocking, while PointClickCare
      argues that bot restrictions protect security, performance, and contractual
      controls. This conflict makes partner access a two-sided moat: governed APIs
      can reinforce retention and trust, but restrictive terms can provoke
      competitive, customer, and regulatory challenge. Durability should therefore
      be underwritten from actual contracts, API terms, migration rights, and
      customer references rather than awards or directory rankings alone.
    claimRefs: [CP009, CP010, CP011, CP012, CP013, CP014, CP016]
callouts:
  - calloutType: strength
    title: Specialization is the defensible core
    body: >-
      The evidence consistently distinguishes PointClickCare through LTPAC-specific
      workflows and ecosystem breadth, not through a universally superior EHR
      feature set.
    claimRefs: [CP001, CP004, CP010]
  - calloutType: risk
    title: Ecosystem control can become a liability
    body: >-
      The Real Time litigation shows that access restrictions intended to protect
      performance and security can also be challenged as anticompetitive
      information blocking.
    claimRefs: [CP012, CP013, CP016]
  - calloutType: recommendation
    title: Compare contracts, not list-page claims
    body: >-
      Require matched quotes, implementation scopes, API terms, data-export rights,
      and references from the same care setting before assigning value to pricing
      or switching-cost advantages.
    claimRefs: [CP006, CP007, CP008, CP015]
