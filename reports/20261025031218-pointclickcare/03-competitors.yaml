      - ["Security and compliance posture", "ToolsInfo lists SOC 2, HIPAA, BAA, ISO 27001, SSO, and ONC certification", "Unknown", "Unknown", "SeniorCRE describes support for HIPAA-safeguarded controls", "Directory and issuer statements, not an audit"]
