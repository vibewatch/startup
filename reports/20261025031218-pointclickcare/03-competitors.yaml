  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Product or option
      - Public price or contract model
      - Included scope
      - Qualification
      - Diligence implication
    rows:
      - [PointClickCare, "Custom quote; commonly structured per bed in facility settings", "Modules selected by organization and care setting", "No public vendor rate card in assigned evidence", "Obtain module, interface, census, and escalation schedules"]
      - [PointClickCare, "$500-$15,000+ monthly estimate by organization size", "Small through large organization bands", "Competitor-authored guide citing third-party estimates", "Use only as a negotiation range, not a budget"]
      - [PointClickCare, "$10,000-$200,000 setup estimate by organization size", "Implementation, training, migration, and interfaces may add cost", "Estimate, not a contract or realized spend", "Normalize first-year and steady-state total cost"]
      - [MatrixCare, "$2,000 per month reported starting figure", "Post-acute alternative scope", "Enzo attributes the figure to Software Advice", "Request a matched quote with modules and facility count"]
      - [WellSky, "$1,000-$3,500 small agency; $10,000-$25,000+ enterprise estimates", "Home-health-centered suite", "Third-party estimates from a competing vendor's guide", "Segment and implementation scope may dominate headline price"]
      - [KanTime, "$1,000-$3,000 monthly small-agency estimate", "Home-health-native option", "Third-party estimate from a competing vendor's guide", "Potential shortlist option for agencies without facilities"]
    notes: "All dollar figures are third-party estimates reported by Enzo, not vendor-published rates or realized customer pricing; currency, term, discounts, modules, interfaces, and implementation scope are not normalized."
    claimRefs: [CP006, CP007, CP008, CP015]
