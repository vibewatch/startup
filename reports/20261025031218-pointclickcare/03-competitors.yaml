      - ["Home-health orientation", "Secondary line according to Enzo", "Home-care and home-health alternative", "Home-health-centered / home-health-native", "SeniorCRE and acute EHR fit not established", "Competitor-authored comparison"]
      - ["Acute and ambulatory breadth", "Not the core positioning in assigned evidence", "Unknown", "Unknown", "Epic, Oracle Health, MEDITECH, Veradigm, athenahealth, and eClinicalWorks listed", "Directory evidence only"]
      - ["Partner ecosystem", "Company claims 400-plus integrated marketplace partners", "Unknown", "Unknown", "SeniorCRE integration availability varies by configuration", "Issuer claims; no normalized benchmark"]
