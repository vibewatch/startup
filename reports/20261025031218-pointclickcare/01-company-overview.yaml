company:
  name: PointClickCare
chapter:
  number: 1
  title: Company Overview
  summary: PointClickCare is a privately held Canadian health-technology company founded in 2000 that has expanded from a long-term-care documentation tool into a cloud EHR and care-coordination platform. Current evidence supports a large provider footprint, continued product expansion, and durable founder involvement, but private-company financials, current capitalization, and the ultimate resolution of its data-access litigation remain incomplete.
sections:
  - id: identity-and-platform
    title: Identity, platform, and operating model
    body: >-
      PointClickCare was founded in Mississauga in 2000 by brothers Dave and Mike
      Wessinger, initially as a clinical documentation tool for one long-term-care
      facility. The available profile evidence describes a later expansion across
      skilled nursing, assisted living, independent living, and home health, with
      products spanning electronic health records, medication management, billing,
      population health analytics, and care transitions. A separate company profile
      characterizes the business as a cloud-based EHR and care-coordination platform
      for senior and post-acute care. The company's own March 2026 release describes
      a next-generation EHR for practice groups with native AI workflow features and
      bi-directional exchange across PointClickCare and non-PointClickCare facilities.
      These sources support the identity and product model, but not a complete
      segment-level revenue split or a verified current valuation.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-capital
    title: Leadership, ownership, and capital
    body: >-
      The evidence identifies Dave Wessinger as CEO and co-founder and Mike
      Wessinger as executive chair and co-founder, indicating meaningful founder
      continuity. An investor-profile source says Brian Gannon, formerly of TriNet,
      became CFO in December 2024; that change is a relevant maturity and governance
      signal, although the available evidence does not establish a full board roster,
      succession plan, or employment terms. The company is described as privately
      held, with Dragoneer Investment Group, Hellman & Friedman, and JMI Equity
      among its backers. A 2021 secondary investment is reported as valuing the
      company at approximately $18.4 billion, but this is a historical third-party
      report rather than a current mark. Current total raised, debt, preference
      terms, and any confirmed IPO timetable remain unsupported in this pool.
    claimRefs: [CO002, CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: scale-and-commercial-expansion
    title: Scale, customers, and product expansion
    body: >-
      PointClickCare's scale is visible primarily through operating-footprint
      disclosures rather than audited financial statements. The March 2026 company
      release says the platform is trusted by over 30,000 provider organizations.
      A 2025 trade report gives a more granular but different snapshot: more than
      27,000 long-term and post-acute providers, 3,600 ambulatory clinics, 2,800
      hospitals, 350 risk-bearing providers, and 70 state and government agencies.
      The same report says a separate analytics company served roughly 1,700 skilled
      nursing facilities, illustrating the scale of a data-access ecosystem but not
      PointClickCare revenue. The company also says its 2026 practice-group product
      embeds Ambient Scribe and clinical-prioritization tools; an early adopter
      reported saving five minutes per note, a customer statement rather than an
      independently measured outcome. The conflicting provider totals should be
      carried as period- and definition-sensitive rather than reconciled into one
      exact customer count.
    claimRefs: [CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: risk-and-milestones
    title: Milestones and material risks
    body: >-
      The most material documented risk is the Real Time Medical Systems litigation
      over automated access to PointClickCare-hosted records. A Fourth Circuit case
      summary says the district court granted a preliminary injunction and that the
      appellate court affirmed, finding PointClickCare's conduct likely implicated
      information blocking and that the company had not shown an applicable
      exception. Trade coverage records PointClickCare's position that bots posed
      security and performance risks, while also reporting that the court record
      was preliminary and contested. This is a legal and platform-governance risk,
      not proof of a final liability judgment. The milestone record also includes
      the 2024 lawsuit filing, the 2025 appellate decision, the June 2025 renewed
      dismissal effort, and the March 2026 practice-group EHR launch. The pool does
      not establish a post-breach forensic report, current enforcement outcome,
      audited revenue, or a current valuation, so those remain explicit diligence
      gaps.
    claimRefs: [CO013, CO014, CO015, CO016]
callouts:
  - calloutType: strength
    title: Embedded workflow and distribution
    body: The evidence supports a purpose-built senior-care EHR with a broad provider footprint and product expansion into practice-group workflows, analytics, and interoperability.
    claimRefs: [CO002, CO009, CO012]
  - calloutType: risk
    title: Data-access litigation remains material
    body: The preliminary-injunction record creates an unresolved legal, interoperability, and competitive-governance risk; it should not be treated as a final merits judgment.
    claimRefs: [CO013, CO014, CO015]
  - calloutType: assumption
    title: Private-company metrics are not interchangeable
    body: Provider-site counts, organization counts, revenue, valuation, and funding are different measures; the available sources do not support converting one into another.
    claimRefs: [CO009, CO010, CO016]
