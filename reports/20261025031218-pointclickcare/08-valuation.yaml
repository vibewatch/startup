schemaVersion: "report-v2"
artifact: valuation
slug: pointclickcare
runDate: 2026-10-25
company:
  name: PointClickCare
chapter:
  number: 8
  title: Valuation
  summary: >-
    PointClickCare has vertical-healthcare software scale and a documented historical $4B valuation
    marker, but the assigned evidence does not establish a current revenue or ARR denominator,
    financing price, or preference stack. The evidence supports a research-more recommendation,
    with valuation discipline tied to verified recurring revenue, retention, profitability, and
    resolution of the documented data-access litigation overhang.
sections:
  - id: investment-call
    title: Investment call and valuation anchor
    body: >-
      The evidence supports a research-more recommendation with medium confidence and high risk,
      rather than a price-insensitive buy. Tracxn reports $283M of cumulative funding across five
      rounds and a $4B valuation dated January 6, 2021. That is a historical third-party marker, not
      evidence of a current financing price. Sacra's much thinner fetched profile displays $86.91M
      under "Funding" alongside 2024 without defining the denominator, illustrating why public
      financing aggregations cannot substitute for primary transaction documents. The assigned
      sources provide no verified current revenue or ARR denominator, so neither a current
      enterprise value nor an entry multiple can be calculated responsibly. A buyer should require
      a current financing document, audited recurring-revenue bridge, cohort retention, and the
      cap-table and preference waterfall before underwriting a secondary purchase.
    claimRefs: [CV001, CV002, CV004, CV014, CV015, CV016]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and price sensitivity
    body: >-
      The thesis is that PointClickCare occupies a specialized, regulated workflow where a
      cloud-based EHR can become a durable system of record. ResearchOrg describes the company as
      bringing cloud EHR technology to a long-term and post-acute market underserved by legacy
      on-premise systems, while Tracxn ranks it first in its six-company active-competitor set.
      PointClickCare's own appellate brief claims more than 30,000 healthcare-provider users and
      more than 1.6 million patients; those figures demonstrate the company's asserted scale but
      remain company-issued litigation evidence, not independent verification. The anti-thesis is
      that platform centrality creates interoperability and regulatory exposure. The Fourth Circuit
      affirmed a preliminary injunction in the Real Time dispute, and the current status after the
      June 2025 reporting is not established by the assigned pool. The recommendation should improve
      only after scale, retention, margins, and the legal remedy are independently verified.
    claimRefs: [CV003, CV005, CV006, CV007, CV008, CV009, CV013]
    tableRefs: [TV002]
  - id: scenarios-and-comps
    title: Scenarios and comparable valuation framework
    body: >-
      A revenue-multiple framework is the least-worst public benchmark until PointClickCare's
      profitability and cash generation are disclosed, but it cannot produce a dollar valuation
      without a verified denominator. Aventis reports a 4.6x median public SaaS EV/revenue multiple
      as of August 2026 and a 3.1x median for the explicitly small first-quarter 2026 private SaaS
      M&A sample. A separate independent reference describes healthtech SaaS as spanning roughly
      1x to 7x, showing that vertical labels alone do not select a multiple. The scenario bands
      therefore segment those observed reference points rather than assert a PointClickCare value:
      the bear case uses 1.0x-3.1x revenue, the base case 3.1x-4.6x, and the bull case 4.6x-7.0x.
      Growth, NRR, gross margin, cash conversion, recurring-revenue purity, private-company
      illiquidity, dilution, and the legal outcome must determine where within or outside those
      reference bands the company belongs.
    claimRefs: [CV010, CV011, CV012, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence-and-exit
    title: Diligence asks, exit readiness, and thesis breaks
    body: >-
      Public evidence is not sufficient to establish exit readiness or a target return. Before
      committing capital, obtain audited 2024-2026 revenue and ARR bridges, bookings, churn and NRR
      cohorts, gross-margin and free-cash-flow statements, debt, option dilution, liquidation
      preferences, secondary-transfer terms, and a current legal-status memorandum for the Real
      Time matter. The investment thesis should break if verified retention is materially weaker
      than the platform narrative, margins or cash conversion require unmodeled capital, a financing
      below the historical marker exposes preference overhang, or a legal remedy makes compliant
      data access commercially unattractive. Positive movement requires primary evidence of durable
      expansion, improving profitability, a clean preference waterfall, and a documented access
      model that customers, partners, and regulators can sustain. Until then, the appropriate exit
      assumption is unproven rather than an invented IPO timetable or return multiple.
    claimRefs: [CV007, CV008, CV009, CV015, CV016]

tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Evidence-supported view, Decision implication]
    rows:
      - ["Recommendation", "research-more", "Do not underwrite a current entry price until recurring revenue and financing terms are verified."]
      - ["Confidence", "medium", "The vertical-software thesis is plausible, but current valuation inputs are incomplete."]
      - ["Risk rating", "high", "Legal exposure and private-company disclosure gaps require a higher return hurdle."]
      - ["Valuation stance", "unsupported at a new price", "The January 2021 $4B marker cannot establish a current price or multiple."]
    notes: Historical funding and valuation are third-party records; no current price, revenue, ARR, or cap-table terms appear in the assigned evidence.
    claimRefs: [CV001, CV002, CV004, CV014, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Vertical workflow potential", "Independent profiles describe a cloud EHR focused on long-term and post-acute care.", "Audited NRR and cohort retention showing durable expansion."]
      - ["Asserted operating scale", "PointClickCare's appellate brief claims more than 30,000 providers and 1.6 million patients.", "Independent current customer and patient census with concentration."]
      - ["Interoperability exposure", "The Fourth Circuit affirmed a preliminary injunction tied to likely information blocking.", "Current disposition, remediation cost, and sustainable access economics."]
      - ["Valuation opacity", "The only defined valuation marker is $4B as of January 6, 2021.", "Current financing price, audited denominator, dilution, and preference waterfall."]
    notes: The operating-scale figures are company-issued litigation assertions; legal sources establish procedural findings, not a quantified valuation haircut.
    claimRefs: [CV001, CV003, CV005, CV006, CV007, CV008, CV013]
  - id: TV003
    title: Bull / base / bear underwriting scenarios
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - ["Bull", "Verified strong growth and NRR, improving margins, clean preferences, and resolved access exposure.", "Reference 4.6x-7.0x revenue only after the denominator is audited; no dollar value is supportable now.", "Premium multiple compression and private illiquidity.", "Upside evidence is not yet present."]
      - ["Base", "Durable workflow use, moderate growth, acceptable margins, and manageable legal remediation.", "Reference 3.1x-4.6x revenue, then apply dilution and liquidity adjustments to verified transaction terms.", "Retention, margin, and remedy costs remain unknown.", "Most defensible conditional case."]
      - ["Bear", "Weak retention, margin pressure, adverse legal economics, or a down round below the historical marker.", "Reference 1.0x-3.1x revenue or defer entry; common-share value may be lower after preferences.", "Down-round, preference, partner, and customer risks.", "Material downside until gaps close."]
      - ["Entry discipline", "Current price, denominator, and waterfall are unavailable.", "Track rather than buy until audited financials and financing documents support a sensitivity table.", "False precision and unmodeled dilution.", "Required condition for commitment."]
    notes: The ranges are analytical partitions of cited 2026 SaaS and healthtech benchmarks, not quoted PointClickCare valuations; no probability percentage or dollar value is inferred.
    claimRefs: [CV001, CV010, CV011, CV012, CV015, CV016]

figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Strategic scale merits diligence, while stale valuation evidence, missing operating inputs, and legal exposure prevent a current price endorsement.
    data:
      nodes:
        - id: vertical-position
          label: "Specialized cloud EHR position"
        - id: asserted-scale
          label: "Company-asserted provider and patient scale"
        - id: stale-marker
          label: "Historical $4B valuation marker"
        - id: missing-inputs
          label: "Revenue, ARR, NRR, margins, and waterfall missing"
        - id: legal-overhang
          label: "Data-access and information-blocking overhang"
        - id: recommendation
          label: "Research-more before entry"
      edges:
        - from: vertical-position
          to: asserted-scale
        - from: asserted-scale
          to: stale-marker
        - from: stale-marker
          to: missing-inputs
        - from: missing-inputs
          to: legal-overhang
        - from: legal-overhang
          to: recommendation
    approximationNotes: The flow is a qualitative decision sequence, not a score, probability model, or quantitative bridge.
    claimRefs: [CV001, CV003, CV008, CV013, CV015, CV016]

callouts:
  - calloutType: recommendation
    title: Defer price commitment
    body: "The assigned evidence supports research-more, not buy: obtain a current recurring-revenue denominator and financing waterfall before accepting any secondary valuation."
    claimRefs: [CV001, CV004, CV015, CV016]
  - calloutType: risk
    title: Legal exposure is valuation-relevant
    body: "The affirmed preliminary injunction makes remediation, documentation, and data-access economics required underwriting workstreams; the assigned evidence does not establish the matter's current disposition."
    claimRefs: [CV007, CV008, CV009]
  - calloutType: assumption
    title: Comparable multiples are reference points
    body: "Public and private SaaS multiples describe market regimes, not a PointClickCare valuation; applying them requires verified revenue quality, growth, retention, and margins."
    claimRefs: [CV010, CV011, CV012, CV016]

