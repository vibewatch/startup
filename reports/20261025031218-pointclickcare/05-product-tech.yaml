company:
  name: PointClickCare
chapter:
  number: 5
  title: Product & Technology
  summary: PointClickCare is a cloud-delivered LTPAC EHR and revenue-cycle platform whose product surface combines clinical documentation, medication workflows, billing, analytics, interoperability, and newer embedded AI tools. Public evidence supports a broad, workflow-centered architecture, but the bot/data-access litigation shows that interoperability controls, security documentation, and the boundary between platform protection and ecosystem access remain material diligence risks.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      PointClickCare is delivered as a cloud-based electronic health record and
      operating platform for long-term and post-acute care. The public product
      descriptions place the system in the daily workflow of skilled nursing,
      senior-living, and related post-acute providers: clinical documentation,
      assessments, care plans, medication administration, billing, claims,
      analytics, and care transitions are represented as modules or connected
      services rather than as a single point solution. The independent API
      profile identifies a partner EHR API and an HL7 FHIR API, with a developer
      portal and REST base URL, which is concrete evidence of a programmatic
      interoperability surface rather than merely a marketing claim. IntuitionLabs
      describes the platform as a cloud-delivered, multi-tenant system of record,
      while cautioning that product pages do not establish every clinical
      capability; for example, QuickMAR documentation supports medication
      administration and pharmacy-connected workflows but does not establish
      prescribing authority. The resulting product thesis is breadth and
      workflow centrality, with diligence focused on the exact licensed modules,
      data scopes, implementation effort, and realized customer outcomes.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture, integrations, and maturity
    body: >-
      The public architecture is best understood as a layered SaaS operating
      model. A shared cloud application layer supports a logical separation of
      customer data, while domain modules handle clinical records, medication
      administration, revenue-cycle work, analytics, and resident or family
      engagement. External connectivity is a strategic layer: PointClickCare
      exposes APIs and FHIR-oriented interoperability, and the broader platform
      has been extended through care-coordination and network assets. This
      structure can reduce duplicate entry and make the product more valuable as
      a facility adds workflows, but it also creates dependency on interface
      contracts, partner permissions, data mapping, and reliable change control.
      The current maturity signal is mixed by feature. Core EHR and RCM functions
      are described as established workflows; the June 2026 Advisor release says
      Billing Advisor is available to all skilled nursing providers using the
      PointClickCare EHR, while MDS Advisor was described as beta for 2026. That
      distinction matters: announced, generally available, beta, and planned
      capabilities should not be treated as equivalent deployment maturity.
      The product architecture is therefore credible as a broad platform, but
      module-level availability, integration test evidence, uptime history, and
      migration controls remain customer-specific diligence items.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: trust-and-risk
    title: Trust, safety, and technical risk
    body: >-
      PointClickCare operates in a high-consequence data environment where
      confidentiality, availability, and permitted use of electronic health
      information are product requirements, not optional add-ons. The strongest
      adverse evidence is the Real Time Medical Systems dispute. The Fourth
      Circuit summary says the district court found PointClickCare's access
      restrictions likely constituted information blocking and that PointClickCare
      did not demonstrate that an exception applied; the independent legal
      analysis further reports that the court viewed the security and performance
      rationale as insufficiently documented and not shown to be consistently
      applied. McKnight's account records PointClickCare's contrary position that
      automated bots could cause slowdowns or outages and that customer
      agreements prohibit screen scraping. These are competing positions in
      ongoing litigation, not proof that the platform is insecure or that every
      access control is unlawful. They do show a technical-governance risk:
      platform security controls, partner authentication, API coverage, bot
      policy, exception documentation, and customer data rights must be
      designed and evidenced together. The product review should therefore
      request current security attestations, incident and uptime history,
      interface inventories, access-control standards, and the documented process
      for handling legitimate third-party analytics access.
    claimRefs: [CE009, CE010, CE011, CE012]
    callouts:
      - calloutType: strength
        title: Workflow centrality is the moat
        body: The platform's value proposition is strongest where clinical, financial, and transition workflows share a common record and integrations.
        claimRefs: [CE001, CE005]
      - calloutType: risk
        title: Interoperability governance is a product risk
        body: The data-access litigation makes partner access, bot controls, security exceptions, and evidence of consistent enforcement a diligence priority.
        claimRefs: [CE009, CE010, CE011]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns: [Module or asset, Primary user, Status or maturity, Differentiation, Diligence gap]
    rows:
      - ["Core EHR", "Nurses and clinical staff", "Established platform surface", "LTPAC-specific clinical record and care-plan workflows", "Verify licensed scope by setting and implementation configuration"]
      - ["QuickMAR eMAR", "Nursing staff and pharmacy-connected teams", "Established product described in public materials", "Medication administration and documentation workflow", "Confirm prescribing boundary, barcode controls, and realized error reduction"]
      - ["Revenue Cycle Management", "Facility operators and billing teams", "Established platform/service area", "Clinical-to-billing workflow within one operating system", "Obtain claims, denial, collections, and service-level evidence"]
      - ["Care coordination and interoperability", "Care managers and external providers", "APIs and FHIR surface publicly documented; deployment varies", "Cross-setting data exchange and transition workflows", "Inventory endpoints, data elements, partner terms, and change controls"]
      - ["Advisor Suite", "Skilled nursing operators", "Billing Advisor stated available June 2026; MDS Advisor beta planned for 2026", "Embedded AI workflow automation in the existing EHR", "Verify production adoption, human review, model governance, and outcome evidence"]
    notes: Public descriptions establish product surfaces and selected release status, not uniform availability, implementation quality, or customer outcomes across every module.
    claimRefs: [CE001, CE003, CE006, CE007]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, PointClickCare solution, Measurable benefit, Limitation]
    rows:
      - ["Document resident care", "Record notes, assessments, care plans, and changes across shifts", "Core EHR and structured clinical workflows", "Centralized record and continuity are the intended benefit", "Public sources do not provide a controlled outcome benchmark"]
      - ["Administer medications", "Document medication and treatment administration while coordinating with pharmacy", "QuickMAR eMAR and pharmacy-connected workflows", "Less paper and duplicated entry are claimed or intended", "Public description does not establish prescribing authority or error reduction"]
      - ["Coordinate transitions", "Receive or send information across hospitals, pharmacies, HIEs, and post-acute settings", "Interfaces, APIs, FHIR, and care-collaboration assets", "Faster access to transition information is the intended benefit", "Coverage depends on endpoint, partner, and data permissions"]
      - ["Protect and capture revenue", "Identify billable services and prepare billing workflows", "RCM plus Billing Advisor", "Potentially fewer missed charges and more timely review", "Billing Advisor availability is documented but independent impact data is not"]
      - ["Support referral decisions", "Review incoming referrals for clinical and financial fit", "Referral Advisor", "Faster and more informed admissions decisions are described", "Public release evidence does not establish conversion, accuracy, or bias metrics"]
    notes: This table separates intended workflow value from independently measured outcomes; no row should be read as a guaranteed clinical, financial, or operational result.
    claimRefs: [CE002, CE004, CE006, CE007, CE008]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Cloud application and logical tenant separation", "Deliver shared SaaS workflows while separating customer data", "Cloud operations and identity controls", "Availability, isolation, and change-management evidence are not public in the assigned sources"]
      - ["Clinical and financial data model", "Connect EHR, medication, billing, assessment, and reporting workflows", "Accurate mappings and consistent master data", "Data quality and workflow configuration can affect downstream decisions"]
      - ["Interoperability layer", "Exchange data through partner APIs, FHIR, HL7, connectors, and networks", "Endpoint availability, schema changes, partner authorization, and contract terms", "Bot and information-blocking dispute shows governance exposure"]
      - ["Embedded intelligence", "Apply Advisor tools to charting, referrals, billing, and future assessment workflows", "Training data, human review, and model monitoring", "Production efficacy, explainability, and safety controls require verification"]
      - ["Security and access governance", "Control who or what can access protected health information", "Authentication, bot policy, exception documentation, and customer agreements", "Inconsistent or poorly documented controls can create legal, availability, and trust risk"]
    notes: Architecture layers are synthesized from the assigned public product and legal sources; the table intentionally marks unavailable operational evidence as diligence gaps rather than inferring controls.
    claimRefs: [CE005, CE009, CE010, CE011, CE012]
