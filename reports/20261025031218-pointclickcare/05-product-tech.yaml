            - name: HL7 FHIR API
              detail: Publicly cataloged FHIR-oriented clinical interoperability surface
            - name: Care coordination connections
              detail: Interfaces, connectors, and network assets for transitions and external providers
        - name: Workflow applications
          label: Workflow applications
          detail: Clinical, medication, and revenue-cycle workflows
          items:
            - name: Clinical documentation
              detail: Orders, nursing documentation, assessments, care plans, and MDS workflows
            - name: QuickMAR
              detail: Medication and treatment administration documentation with pharmacy-connected workflows
            - name: Revenue Cycle Management
              detail: Billing, claims, collections, and financial workflow support
        - name: Cloud operating core
          label: Cloud operating core
          detail: Cloud-delivered, multi-tenant SaaS system of record
          items:
            - name: Multi-tenant SaaS platform
              detail: Cloud-delivered system of record for LTPAC workflows with logical customer separation described in public analysis
        - name: Engagement and support surfaces
          label: Engagement and support surfaces
          detail: Portals and connected workflows for residents, families, clinicians, and facility teams
          items:
            - name: Resident, family, and physician portals
              detail: Public product analysis describes portal and secure-messaging surfaces, with exact availability varying by setting
    claimRefs: [CE003, CE005, CE006, CE007, CE009]
callouts:
  - calloutType: recommendation
    title: Diligence priority
    body: "Require a module-by-module product inventory and an interoperability control pack before underwriting maturity: endpoint coverage, tenant isolation, uptime, incident history, AI governance, and the documented basis for blocking or allowing automated data access."
    claimRefs: [CE005, CE007, CE009, CE012]
