  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: Current uptime, outage, incident-response, recovery-time, and tenant-isolation evidence by product surface.
      whyItMatters: The platform is a system of record for clinical and financial workflows, so availability and isolation failures could interrupt care operations and create regulatory exposure.
      diligencePath: Request the current security and reliability package, including SOC or HITRUST scope, uptime history, incident register, RTO/RPO, penetration-test summary, and tenant-isolation controls.
      relatedQuestionRefs: [QE006, QE008]
    - type: missing-source
      severity: material
      topic: AI
      missingEvidence: Independent evidence of Advisor accuracy, override rates, false positives, bias testing, clinical safety review, and realized customer outcomes.
      whyItMatters: General availability and a product announcement establish release status, not whether embedded AI improves decisions safely or economically.
      diligencePath: Obtain production validation studies, model cards, monitoring dashboards, human-review workflows, and customer-level outcome evidence for each Advisor module.
