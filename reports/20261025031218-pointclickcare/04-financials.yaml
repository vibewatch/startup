    claimRefs: [CI006, CI007, CI008, CI009]
callouts:
  - calloutType: strength
    title: "Recurring monetization is plausible"
    body: "A custom, capacity-linked subscription model and broad module scope are consistent with recurring enterprise software revenue, but realized pricing and retention remain unverified."
    claimRefs: [CI006, CI008]
  - calloutType: risk
    title: "Capital adequacy is not observable"
    body: "Funding and valuation estimates do not establish cash available, burn, runway, debt, or financing dependency; these are blocking underwriting gaps."
    claimRefs: [CI002, CI003]
  - calloutType: risk
    title: "Data-access dispute may affect partner economics"
    body: "The preliminary-injunction record creates legal and ecosystem risk around automated access, security exceptions, and the economics of third-party data use."
    claimRefs: [CI011, CI012]
