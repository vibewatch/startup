company:
  name: PointClickCare
chapter:
  number: 4
  title: Financials
  summary: "Public evidence indicates a large, specialized post-acute software business, but the available revenue, valuation, funding, and pricing figures are third-party estimates rather than disclosed financial statements. The underwriting case therefore rests on recurring per-organization or per-bed monetization and operating leverage potential, while cash, burn, margins, realized price, and capital needs remain material diligence gaps."
sections:
  - id: revenue-and-monetization
    title: Revenue model and monetization
    body: >-
      PointClickCare appears to monetize a modular cloud platform for long-term and post-acute
      care through custom enterprise contracts rather than a public self-serve rate card. Enzo's
      pricing review describes a subscription quoted by organization, with beds or census, module
      selection, and care settings driving the quote, and says facility contracts are commonly
      structured per bed per month (CI006, CI008). The same source gives third-party monthly
      estimates from $500-$2,000 for small organizations, $2,000-$5,000 for medium organizations,
      and $5,000-$15,000+ for large organizations, explicitly labeling these as estimates rather
      than vendor-published figures (CI007). This supports a recurring software-revenue model, not
      a verified ARR figure. The platform's stated scope includes clinical documentation, billing,
      care coordination, and compliance modules, so mix and realized price likely vary materially
      by setting and bundle; no source in this pool provides contracted price, discounting,
      renewal, or module-level revenue mix.
    claimRefs: [CI006, CI007, CI008, CI015]
    tableRefs: [TI001, TI002]
  - id: economics-and-operating-leverage
    title: Cost structure and operating leverage
    body: >-
      The cost base is likely shaped by implementation, onboarding, training, data migration,
      integrations, and ongoing support in addition to product engineering and customer success.
      Enzo lists implementation and onboarding, recurring training, above-base support, custom
      interfaces, and data migration as costs to test separately from the subscription (CI009).
      It also suggests first-year total cost can run two to three times annualized subscription
      once setup, training, migration, and interfaces are included, but this is a category
      heuristic, not a PointClickCare disclosure (CI009). PointClickCare's scale proxy is
      meaningful: Growjo estimates 2,399 employees and $480.3M annual revenue, implying about
      $200,200 revenue per employee as its own estimate (CI001, CI004). That ratio is not a
      gross-margin or cash-generation measure. There is no public evidence here for gross margin,
      hosting cost, support cost per facility, CAC, sales cycle, payback, working capital, capex,
      or service-delivery cost, so operating leverage cannot be underwritten from the pool alone.
    claimRefs: [CI001, CI004, CI005, CI009]
    tableRefs: [TI003]
  - id: capital-adequacy-and-financial-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Growjo estimates $230M of total funding and a current valuation of $4B, but those are
      third-party estimates and do not establish cash on hand, liquidity, proceeds remaining,
      debt, preferred terms, burn, or runway (CI002, CI003). The assigned evidence contains no
      cash balance, debt schedule, financing covenant, next-round trigger, or planned use of
      funds. It therefore cannot support a capital-adequacy conclusion or a precise valuation
      multiple. Commercial scale may be substantial: Taction, an integration provider, describes
      27,000+ LTC/PAC providers and 3,100+ hospitals, while Healthcare IT Today reports the
      company said more than 1.2 million professionals access the platform daily and that it
      serves approximately 1.6 million patients; these are company or partner-reported traction
      figures, not audited revenue evidence (CI015, CI014). The adverse legal record also shows
      that PointClickCare characterized automated access as a risk of slowdowns or outages for
      paying customers, while the Fourth Circuit affirmed a preliminary injunction finding likely
      information blocking (CI011, CI012). This creates potential compliance, platform-governance,
      and partner-economics exposure that should be reflected in underwriting rather than treated
      as a settled financial loss.
    claimRefs: [CI002, CI003, CI011, CI012, CI014, CI015]
    figureRefs: [FI001]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Current value/status, Quality, Diligence ask]
    rows:
      - [Core platform subscription, "Custom organization contract; commonly per-bed in facility settings", "Recurring model supported; realized revenue undisclosed", "Third-party reported / medium confidence", "Obtain contract cohort, renewal, discount, and module-mix data"]
      - [Clinical and compliance modules, "Documentation, assessments, care plans, and compliance tooling", "Module scope described; revenue mix unavailable", "Product description, not financial disclosure", "Reconcile module attach rates and revenue contribution"]
      - [Billing and revenue-cycle modules, "Billing, claims, payment posting, and reporting workflows", "Product scope described; monetization not separately disclosed", "Product description, not financial disclosure", "Request price by module and payer/setting mix"]
      - [Integrations and data access, "Interfaces, APIs, marketplace, and implementation services", "Additional cost lines reported; rates unavailable", "Third-party reported / medium confidence", "Obtain interface fees, services revenue, and partner economics"]
    notes: "Sources describe product scope and estimated pricing, not audited revenue; null or undisclosed fields require management evidence."
    claimRefs: [CI006, CI008, CI009, CI014]
  - id: TI002
    title: Pricing and monetization proxies
    columns: [Pricing dimension, Public evidence, Status, Interpretation, Diligence ask]
    rows:
      - [List price, "No public price list, calculator, or published tiers", "Unavailable", "Pricing opacity prevents list-to-realized analysis", "Obtain current rate card and standard discount policy"]
      - [Contract basis, "Organization quote driven by beds/census, modules, and care settings", "Reported", "Capacity-based pricing can preserve recurring revenue but exposes occupancy sensitivity", "Test minimums, escalators, and occupancy treatment"]
      - [Estimated monthly range, "$500-$2,000 small; $2,000-$5,000 medium; $5,000-$15,000+ large", "Third-party estimate", "Useful only as a quote sanity check, not a budget or ARR input", "Validate against signed customer examples"]
      - [Implementation and first-year load, "Setup, training, migration, interfaces, and support can materially exceed subscription in year one", "Third-party heuristic", "Front-loaded costs may affect payback and services margin", "Separate recurring software margin from implementation economics"]
    notes: "Ranges and cost heuristics are explicitly labeled estimates by Enzo and must not be presented as PointClickCare realized pricing."
    claimRefs: [CI006, CI007, CI008, CI009]
  - id: TI003
    title: Unit economics and underwriting inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Estimated annual revenue, "$480.3M", "Low; Growjo estimate", "Provides scale context but not GAAP revenue or ARR", "Obtain audited or management revenue by year and segment"]
      - [Estimated revenue per employee, "$200,200", "Low; derived in Growjo source", "A rough productivity proxy, not gross profit or cash conversion", "Reconcile headcount definition and revenue denominator"]
      - [Gross margin, null, "Unavailable", "Determines software versus services operating leverage", "Request gross margin by product and implementation services"]
      - [CAC/payback/sales cycle, null, "Unavailable", "Needed to assess growth efficiency and capital intensity", "Request funnel, bookings, CAC, payback, and cohort retention"]
    notes: "Null means no eligible public figure in the assigned pool; estimates are not substitutes for company financial statements."
    claimRefs: [CI001, CI004, CI009]
