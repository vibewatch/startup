    title: Regulatory / legal risk register
    columns: [Risk or rule, Jurisdiction and status, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - ["Cures Act information blocking", "US federal; preliminary injunction affirmed by Fourth Circuit", High, Critical, Partial, High, "Obtain live docket, current injunction scope, and final disposition"]
      - ["Security, performance, and manner exceptions", "Fourth Circuit found PointClickCare had not sufficiently supported the exceptions at the preliminary stage", High, High, Partial, High, "Test written policies, consistent enforcement logs, and alternate-access completeness"]
      - ["Maryland unfair-competition pathway", "Alleged Cures Act violations may support a state claim despite no federal private right of action", Medium, High, Limited, High, "Review claim exposure, reserves, insurance, and counsel assessment"]
      - ["Continuing Real Time litigation", "Renewed dismissal motion reported June 10, 2025; later merits outcome unavailable in the assigned pool", High, High, Unknown, High, "Retrieve current docket, settlement documents, and regulator correspondence"]
    notes: "Partial public-source register through the 2026-10-25 run date; likelihood, severity, maturity, and residual exposure are qualitative analyst judgments, and the injunction is not a final merits judgment."
    enumerationScope:
      coverage: partial
      basis: "Publicly described US legal and regulatory exposures found in the assigned successful prefetched sources."
    claimRefs: [CR001, CR002, CR003, CR004, CR014]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Automated-query load contributes to slowdown or outage", Medium, Critical, Partial, High, "Independent incident reconstruction and capacity evidence"]
      - ["Unauthorized access or alteration affects patient data", Medium, Critical, Partial, High, "Current independent control attestation and penetration-test results"]
      - ["API or alternate-access path does not meet a partner workflow", High, High, Partial, High, "Field-level comparison of requested and available data"]
      - ["Healthcare-sector hacking disrupts availability or confidentiality", High, Critical, Unknown, High, "PointClickCare-specific incident history, RTO, RPO, and recovery tests"]
      - ["Connected vendor or supply-chain compromise propagates into the platform", High, Critical, Unknown, High, "Vendor inventory, dependency map, and continuous assurance results"]
    notes: "Company-specific incident quantities are allegations from PointClickCare's appellate brief; sector metrics establish context, not a PointClickCare breach or outage rate."
    claimRefs: [CR007, CR008, CR009, CR010, CR011, CR012]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration evidence, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["EHR data access", "Real Time and other analytics vendors", "One litigated vendor; total exposure not disclosed", "Access restriction becomes litigation or information blocking", Critical, "Documented exceptions and complete alternate access", High]
      - ["Marketplace and data integrations", "Approximately 1,900 partners claimed by PointClickCare", "No independently reconciled denominator", "Protocol, price, or API mismatch drives churn or claims", High, "Standardized onboarding, monitoring, and escalation", "Medium-high"]
      - ["Provider workflows", "Long-term and post-acute care customers", "More than 30,000 providers claimed in appellant brief", "Outage or integration failure interrupts clinical and financial workflows", Critical, "Resilience testing and alternate workflows", High]
      - ["Commercial packaging", "Facilities buying configurable modules", "Public pricing and module economics unavailable", "Implementation complexity or price pressure compresses economics", Medium, "Cohort-level pricing, implementation, and support analysis", Unknown]
      - ["Insurance and liquidity capacity", "Cyber, liability, and capital providers", "Limits and current liquidity not disclosed in assigned evidence", "Losses, remediation, or legal costs exceed available coverage", High, "Verify policies, exclusions, reserves, and liquidity", Unknown]
    notes: "Partner and provider counts are company-issued or company-attributed rather than independently audited; concentration, insurance, liquidity, and unit economics remain unquantified."
    claimRefs: [CR006, CR007, CR012, CR013, CR016]
