company:
  name: PointClickCare
chapter:
  number: 7
  title: Risks
  summary: PointClickCare's clearest company-specific risk is the unresolved boundary between lawful EHR access controls and prohibited information blocking. That legal exposure compounds a high-consequence operating model in which uptime, patient-data integrity, third-party access, and integration governance require stronger independent diligence than the assigned public evidence provides.
sections:
  - id: legal-regulatory-exposure
    title: Legal and regulatory exposure
    body: >-
      The Real Time Medical Systems dispute is the most concrete company-specific risk in the assigned evidence. The Fourth Circuit affirmed a preliminary injunction for Real Time and agreed that PointClickCare's actions likely violated the Cures Act's information-blocking prohibition; this was a preliminary assessment, not a final merits disposition. As of June 10, 2025, McKnight's reported that PointClickCare had renewed its motion to dismiss while the injunction remained in place. The court's treatment of PointClickCare's manner, security, and health-IT-performance defenses makes documentation quality, consistent enforcement, and alternate data-access coverage central control tests. The case also creates a broader pathway for alleged Cures Act violations to support Maryland unfair-competition claims even though the federal statute itself has no private right of action.
    claimRefs: [CR001, CR002, CR003, CR004, CR014]
    tableRefs: [TR001]
  - id: operational-security-exposure
    title: Operational resilience and patient-data security
    body: >-
      Platform availability and data integrity have unusually high consequences because PointClickCare's own appellate brief described more than 30,000 provider organizations and over 1.6 million patients using the platform. The same brief alleged one bot-related system collapse affecting 10,000 patients and a separate latency incident affecting 7,700 patients, but those figures are litigant assertions rather than independently verified incidents. A Documo partner article describes encryption, individual credentials, business-associate agreements, and physical, technical, and administrative safeguards; it is not an independent control attestation. Sector evidence raises the baseline threat: HIPAA Journal reported that hacking and other IT incidents accounted for more than 80% of large healthcare breaches in 2025, while DeXpose describes third-party and supply-chain compromise as rivaling direct attacks.
    claimRefs: [CR007, CR008, CR009, CR010, CR011, CR012]
    tableRefs: [TR002]
  - id: partner-model-exposure
    title: Partner, workflow, and model dependencies
    body: >-
      PointClickCare's data ecosystem is both a moat and a control surface. McKnight's reported the company's statement that roughly 1,900 other data partners followed specified security protocols and paid a reasonable access rate, but the assigned evidence does not independently reconcile that population, its concentration, or the commercial terms. The Real Time dispute demonstrates how access method, API coverage, bot restrictions, and price can migrate from partner negotiation into litigation and reputational exposure. Third-party descriptions also make clear that cross-continuum data exchange and integrated workflows are core to the product proposition, so a failure in an access path can affect customer operations rather than merely an optional add-on. Public custom-pricing descriptions leave implementation and margin sensitivity unquantified.
    claimRefs: [CR006, CR012, CR013]
    tableRefs: [TR003]
  - id: risk-ranking-and-kill-criteria
    title: Residual risk, mitigations, and thesis-break triggers
    body: >-
      Legal and access-governance exposure ranks highest because it is supported by an affirmed preliminary injunction, continuing litigation, and judicial skepticism toward the evidence then offered for PointClickCare's exceptions. Cyber and continuity risk ranks next because the platform's asserted scale magnifies harm, while public evidence does not establish current recovery performance or independent control effectiveness. Mitigation should be judged through the live case docket, exception memoranda, consistent access-control logs, API completeness, SOC or HITRUST evidence, incident and recovery testing, partner concentration, and insurance coverage. Thesis-break triggers are a final adverse information-blocking outcome that constrains the operating model, a material patient-data or availability event, repeated inability to support access restrictions with documented evidence, or losses and remediation costs that exceed verified insurance and liquidity capacity.
    claimRefs: [CR001, CR003, CR004, CR007, CR010, CR011, CR015, CR016]
    figureRefs: [FR001]
