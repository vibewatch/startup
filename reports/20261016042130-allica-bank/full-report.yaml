      - number: '4.2'
        title: Cost structure, credit costs, and capital
        blocks:
          - type: paragraph
            body: >-
              Profitability is real, but it is being earned alongside continued investment. Underlying profit before tax
              rose to £43.7m in 2025, while operating expenses rose to £108.4m. The annual report attributes that
              expense growth to sales, partnership, technology, data, product, and marketing investment intended to
              support direct originations and Business Rewards Account expansion. This is encouraging for operating
              leverage potential, but it also means public profit should not be read as a fully mature earnings base;
              management is still spending ahead of growth.

              Credit and capital metrics show a bank that remains sound, but not one that is obviously self-funding
              every expansion ambition. Expected credit loss provisions were £42.6m with a 1.1% coverage ratio, while
              CET1 ended 2025 at 13.4% and total capital at 16.8%, both below 2024 levels as assets scaled. Allica's 25
              February 2026 Series D is therefore strategically important: management says it will support UK growth,
              proprietary technology investment, and international expansion. Year-end cash and cash equivalents were
              £1.287bn, but this is not equivalent to venture runway for a regulated bank. Public evidence still does
              not disclose post-Series-D regulatory ratios, internal capital triggers, or the exact pace at which new
              product and geography investments will consume capital.
            claimRefs:
              - CI002
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI007
              - CI008
              - CI011
              - CI012
              - CI013
      - number: '4.3'
        title: Underwriting view and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The best public reading is that Allica has built a financially credible SME-banking engine: lending is
              still the earnings core, deposits are moving toward operating-account balances, and the current account
              appears to improve customer attachment rather than simply add a low value payments feature. New organic
              lending of £1.273bn across broker and direct channels also suggests the bank is diversifying origination
              beyond a pure intermediary model. Those are good signs for revenue quality and margin durability.

              The blocker is granularity. Public disclosures do not provide channel CAC, payback, approval rates, cohort
              retention, product-level yield, customer concentration, or a capital model that translates Series D
              proceeds into risk-weighted-asset capacity. Review evidence also flags that Allica is structurally less
              suitable for cash-handling businesses and that independent service benchmarking is weaker than for
              CMA-surveyed incumbents. The underwriting verdict is therefore positive on momentum and funding mix, but
              incomplete on normalized unit economics and downside resilience without management data-room access.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI009
              - CI010
              - CI014
              - CI016
