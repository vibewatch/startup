  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Allica defines its core market narrowly: established UK SMEs rather than the full SME universe. Across
              company materials and independent summaries, the recurring boundary is operating businesses with 5-250
              employees, trading history, and documented financial performance. That framing matters because it excludes
              sole traders, newly formed businesses, and other thin-file customers that app-led challengers can onboard
              cheaply but that do not fit Allica's economics or underwriting posture. The status-quo substitutes are
              incumbent high-street banks for current accounts and secured lending, while the closest digital
              substitutes are microbusiness accounts such as Starling, Tide, or Zempler for simpler workflows. Allica's
              wedge is the claim that businesses in the middle want a full banking relationship—current account,
              savings, overdraft, mortgages, asset finance, growth finance, and bridging—rather than point products.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
