      - number: '3.2'
        title: Capability and distribution create the main moat, but also define the contest
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Allica's differentiation is strongest where a buyer wants both breadth and
              relationship intensity. The annual report calls the bank the only digital bank built solely for
              established businesses and ties that claim to a full banking relationship via the Business Rewards
              Account, specialist credit products, and a proprietary technology stack. The same filing also says Allica
              originated GBP1.3 billion of new lending in 2025, describes itself as the UK market leader in
              broker-distributed lending, and notes increasing direct customer flow. That matters competitively because
              it means rivalry is not only app versus branch; introducers, brokers, and specialist debt advisers also
              influence who wins the lending relationship. Trust and regulatory posture are mixed rather than uniformly
              stronger than peers: the account and savings surfaces benefit from full UK bank regulation, while some
              lending and bridging products are explicitly stated to be unregulated products. The result is a defensible
              middle position, but one that still leaves room for specialists or software-led challengers to win
              discrete jobs.
