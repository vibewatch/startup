  summary: >-
    Allica Bank is a UK SME-focused digital bank serving established businesses rather than startups or sole traders. It
    combines relationship-led current accounts and savings with lending, using proprietary technology and named
    relationship support to deepen operating-balance relationships. The business is now at Series D / unicorn scale, but
    the public record still leaves ownership structure, exact headcount, and some governance details opaque.
