      - number: '6.2'
        title: Adoption proof is strongest in recommendation and account growth
        blocks:
          - type: paragraph
            body: |
              Public proof of customer traction is strongest in recommendation signals and
              Business Rewards Account growth. ClearBank's case study shows Allica opening
              more than 2,000 current accounts for established SMEs within a year of launch,
              while the 2025 annual report says both account holders and primary-bank usage
              grew strongly during 2025. Recommendation evidence is also unusually visible:
              the bank reported customer NPS of +76 in late 2025, 4.6/5 on Trustpilot from
              more than 1,700 customers, 4.89/5 from more than 2,400 Smart Money People
              reviews, and a separate 2026 claim that it was the most recommended business
              bank based on feedback from over 4,000 businesses. The gap is denominator
              quality: these signals are helpful, but they are not the same as disclosed
              churn, retention, or usage cohorts.
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU008
              - CU009
