      - number: '6.3'
        title: The current account appears to be the expansion hub
        blocks:
          - type: paragraph
            body: |
              The Business Rewards Account appears to be Allica's land-and-expand hub. The
              annual report presents the account as the centre of a full banking
              relationship, because it creates ongoing transaction touchpoints, attracts
              lower-cost funding, and opens lending opportunities. That thesis is reinforced
              by partner evidence from ClearBank and by Allica's own 2026 statements that
              penetration has passed 6% of its target segment and is being pushed toward 10%
              by 2028. Channel evidence matters here too: commercial finance brokers remain
              the largest lending channel, accountants are an increasingly cultivated partner
              set, and a job posting shows Allica operating with 300+ third parties behind
              customer service delivery. Expansion potential is credible, but dependence on
              intermediaries and infrastructure partners is material.
            claimRefs:
              - CU002
              - CU006
              - CU010
              - CU011
              - CU012
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
              - CU011
              - CU012
              - CU016
      - number: '6.4'
        title: Durability and concentration still require offline diligence
        blocks:
          - type: paragraph
            body: |
              The public evidence pack is much weaker on durability than on acquisition and
              recommendation. Allica's ethics statement confirms that it regularly solicits
              feedback and directs customers to Trustpilot, but neither that page nor the
              annual report discloses GRR, NRR, churn, renewal rates, customer concentration,
              or cohort behaviour. Independent review coverage also shows that the account is
              not a universal SME product: a business that cannot maintain a £10,000 average
              balance faces a £25 monthly fee, and the proposition is explicitly a poor fit
              for startups or sole traders. Finally, one of the chapter's net-new discovery
              hits produced only generic marketplace boilerplate rather than a readable
              Allica-specific case study, underlining how thin named end-customer deployment
              proof remains in the assigned pool.
            claimRefs:
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation evidence is unusually visible
            body: >-
              Compared with many private fintechs, Allica exposes unusually strong public recommendation signals through
              NPS, Trustpilot, Smart Money People, and a 2026 "most recommended" claim, even if those signals stop short
              of full retention disclosure.
            calloutType: strength
            claimRefs:
              - CU007
              - CU008
              - CU009
          - type: callout
            title: Customer durability is still more asserted than disclosed
            body: >-
              The public record supports traction and segment fit, but it still does not disclose customer
              concentration, renewal behaviour, churn, or cohort retention, and it offers limited readable
              named-customer proof in the assigned evidence pack.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory perimeter and balance-sheet risks
        blocks:
          - type: paragraph
            body: >-
              Allica's regulated perimeter is real but uneven. Its app and About Us disclosures state that savings and
              current-account products sit under PRA and FCA supervision, while lending products and some affiliated
              finance entities remain outside regulated-product treatment. That matters because the public conduct
              burden appears lighter precisely where underwriting, collections, and fee outcomes can create SME
              dissatisfaction. At the same time, Allica is pressing publicly for higher SME deposit protection and
              warning that Basel 3.1 could raise funding friction for challengers. The risk is not that Allica lacks a
              licence; it is that growth, regulatory change, and conduct expectations can converge faster than capital,
              liquidity, and disclosure buffers expand.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
