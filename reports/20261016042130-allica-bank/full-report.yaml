  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive frame: Allica is selling the gap between incumbents and challengers'
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence frames Allica less as a generic SMB bank and more as a category wedge inside UK
              established-SME banking. Independent funding coverage in February 2026 described Allica as targeting
              established SMBs with roughly 5-250 employees and as addressing firms that have "outgrown challenger
              offerings" while remaining underserved by traditional banks. Allica's own 2025 annual report makes the
              same competitive claim more explicitly: it organizes its proposition against incumbent high-street pain
              points in finance access, relationship coverage, day-to-day pricing, and fragmented service. That means
              the relevant rival set is not one named peer list alone. It includes incumbent SME banks, app-led
              challenger accounts, specialist lenders that can win the credit relationship, and status-quo
              multi-provider stacks that bundle an operating account, an FX or treasury tool, and separate funding
              products. The same evidence also shows that Allica is trying to compress white space by broadening its own
              product scope across current accounts, savings, commercial mortgages, asset finance, bridging, growth
              finance, and invoice finance, reducing how much business a customer must place with specialists.
            claimRefs:
