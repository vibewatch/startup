  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Narrow segment focus, not broad SMB coverage
        blocks:
          - type: paragraph
            body: |
              Allica's customer strategy is intentionally narrow. Across its annual report,
              partner case study, and independent review coverage, the bank repeatedly frames
              its core customer as an established UK SME rather than a startup, sole trader,
              or general microbusiness. That focus matters commercially: the proposition is
              built for finance teams that want a relationship manager, savings yield, and
              lending access in the same banking relationship, not for businesses seeking the
              lightest possible onboarding or a free low-balance operating account. The
              segmentation evidence is therefore strong on who Allica wants, and equally
              important on who it is willing to exclude.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
