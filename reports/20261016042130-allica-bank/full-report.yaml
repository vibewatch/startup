      - number: '2.3'
        title: Buyers, adoption drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer is typically an owner-manager, CFO, or finance lead deciding whether to make Allica a primary
              operating account and lending partner; the user can be the finance team, accountant, or broker-led
              borrower, while the payer is the business itself through balances, fees, and borrowing economics. The
              strongest adoption drivers in public evidence are relationship banking, reward-led deposits, and bundled
              credit: named relationship managers, cashback, savings incentives, and a broader secured-lending stack all
              reinforce account primacy and help Allica fund lending with lower-cost operating balances. The same
              evidence also defines the ceiling. Businesses that cannot sustain the £10,000 average-balance threshold,
              need cash deposits, or require routine multicurrency operations are worse fits, so Allica's current SAM is
              narrower than the broad "SME banking" label implies. European adjacency exists via a Swedish licence
              application, but that remains option value rather than current market proof.
