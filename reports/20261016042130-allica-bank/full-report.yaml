          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.2'
        title: Operational, servicing, and security risks
        blocks:
          - type: paragraph
            body: >-
              The public record shows both mitigation effort and visible execution frictions. Allica's annual report
              frames information security, data, conduct, and operational resilience as principal risks, and says it
              runs daily liquidity monitoring plus ongoing threat detection and penetration testing. But customer-facing
              evidence is less clean: the app listing promises UK-based human support, while a Trustpilot review
              describes unanswered calls, missing search, limited standing-order edits, and no FreeAgent integration.
              One review does not prove systemic failure, but it does show that post-onboarding servicing quality and
              product tooling can become reputation and conduct risks if the bank scales faster than support operations
              and roadmap delivery.
            claimRefs:
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR016
      - number: '7.3'
        title: Partner, channel, and scaling dependencies
        blocks:
          - type: paragraph
            body: >-
              Allica's current-account stack and lending distribution both rely on third-party ecosystems. ClearBank is
              described as the provider that builds, tests, maintains, and upgrades key scheme connectivity, while the
              annual report says commercial finance brokers are the bank's largest lending channel. Allica's own
              committee evidence also says credit bureaus, open banking, and accounting-software data are vital to
              credit assessment. Those dependencies accelerate go-to-market and underwriting, but they also create
              concentration, switching, and SLA exposure. The February 2026 Series D and stated international expansion
              intent raise the execution burden, because scaling a relationship-led bank across more products, partners,
              and geographies increases coordination risk.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Mitigations, kill criteria, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The mitigating case is that Allica remains licensed, liquid, and explicit about monitoring risk: it
              discloses Basel implementation work, daily liquidity metrics, cyber controls, and partner-enabled
              operating leverage. The residual case is that investors still lack public evidence on the exact complaint
              volume, outsourced-service SLAs, partner concentration, and full-cycle credit-loss performance that would
              show whether the model is merely scaling or starting to fray. Practical kill criteria are a further
              capital-ratio step-down without offsetting disclosures, continued stage 3 balance growth, repeated
              service/incident evidence, or any sign that ClearBank or broker dependency is becoming a bottleneck rather
              than a lever.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital and prudential execution are the thesis-break risk
            body: >-
              If Basel 3.1 implementation coincides with further capital-ratio decline or worsening stage 3 balances,
              the investment case shifts from manageable scaling risk to capital-constrained downside.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: callout
            title: Third-party concentration is still under-disclosed
            body: >-
              The public pack does not show ClearBank SLA protections, exact broker share, complaint volumes, or
              incident history, so private diligence on those items should decide whether current dependencies are
              leverage or fragility.
            calloutType: assumption
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current valuation context
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports the existence of a unicorn-scale financing event but not a fully triangulated
              market-clearing price. Independent coverage and company-controlled release channels align that Allica
              reached roughly a $1.2 billion valuation alongside a $155 million Series D in February 2026, while the
              2025 annual report shows a profitable, rapidly growing bank rather than a pre-revenue story. FY2025 gross
              revenue reached £371.3 million, underlying profit before tax reached £43.7 million, lending closed at £3.7
              billion, and customer deposits ended at £5.7 billion. That operating base matters because it means the
              current price narrative is anchored in scale and earnings, not only brand momentum. It does not settle
              whether the price is attractive, because the public materials here still do not disclose a clean peer
              benchmark, precise post-money ownership, or preference terms.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV013
              - CV014
      - number: '8.2'
        title: Why the case is investable but not yet actionable
        blocks:
          - type: paragraph
            body: >-
              The core thesis is straightforward: Allica appears to have found a defensible niche inside UK SME banking
              by serving established businesses that are too complex for mass-market fintechs and too neglected by
              incumbents, pairing relationship managers with proprietary technology and showing unusually early profit
              for a challenger-bank growth story. The anti-thesis is equally important: much of the valuation narrative
              is still company-issued or company-syndicated, capital ratios weakened through 2025 before the raise, and
              the most detailed independent product review shows the franchise is best suited to cash-rich SMEs rather
              than the whole SME market. That combination makes Allica more compelling than a typical opaque fintech,
              but still too evidence-thin for a price-insensitive buy call.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV011
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario framing and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The most defensible way to frame valuation with this evidence set is directionally around the last
              disclosed round rather than through a faux-precise target multiple. A bull case requires Allica to keep
              converting strong current-account and lending traction into durable share gains while preserving
              profitability and replenishing capital through earnings rather than repeated dilution. A base case keeps
              the company around or modestly above the last disclosed valuation if growth remains healthy and credit
              performance stays benign. A bear case is a flat or down round if credit losses season upward, technology
              and international spending run ahead of returns, or customer growth proves narrower and more
              rate-sensitive than headline customer counts imply. Entry discipline should therefore focus on whether a
              new investor is getting either better price discovery or better downside protection than the public
              evidence shows today.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track rather than avoid because the business already demonstrates scale,
              profitability, and customer proof that could justify institutional interest, and it is track rather than
              buy because the missing diligence is exactly the missing diligence that determines investor outcomes in a
              private bank: cap-table mechanics, preference overhang, and credit-cycle resilience. Before underwriting a
              fresh entry, an investor should request the post-Series D share-class stack, liquidation preferences,
              ownership dilution, vintage default and loss data, sector concentration, and evidence that
              relationship-led current accounts convert into durable primary-banking relationships instead of
              rate-driven deposit inflows. If those answers are strong, the disclosed valuation can still work; if they
              are weak, the same unicorn label could mask asymmetric downside.
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Working recommendation: track, do not chase the unicorn label'
            body: >-
              Allica already looks like a real bank with real earnings, but the assigned public evidence still cannot
              prove that a new investor gets enough valuation protection or upside at the current disclosed price.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV014
          - type: callout
            title: Main blocker is valuation mechanics, not product-market fiction
            body: >-
              The core business model appears credible; the missing pieces are round mechanics, preference stack, and
              full-cycle credit evidence that determine whether a fair headline price becomes an attractive entry.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV013
              - CV016
