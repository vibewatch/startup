      - number: '3.3'
        title: Pricing advantage is selective, so several buyer types remain contestable
        blocks:
          - type: paragraph
            body: >-
              Allica's pricing and packaging are attractive only for a specific buyer profile. The independent
              BusinessExpert review says the product works best for established SMEs that keep meaningful cash reserves
              on platform, because the savings pot can pay 2.83% AER above GBP40,000 and promotional boosts can lift the
              top tier to 4.08%. The same source also surfaces the clearest disconfirming evidence in the assigned pool:
              a GBP25 monthly fee applies when average balances fall below GBP10,000 unless the customer also holds an
              active Allica loan or overdraft, there are no cash deposits, cross-border transfers are routed through
              Wise rather than a native multi-currency treasury product, and buyers needing built-in invoicing or
              phone-centric workflows may be better served by Tide or Starling. This does not erase Allica's advantage
              for the right segment; it narrows it. The competitive risk is that low-balance, app-first, or
              internationally active SMEs can still multi-home or choose substitutes without giving Allica the primary
              operating account.
