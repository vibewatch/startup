      - number: '5.3'
        title: Controls, dependencies, and remaining product risks
        blocks:
          - type: paragraph
            body: >-
              The trust and control layer is visible in policy terms but thinner in independently auditable technical
              detail. Allica publicly describes anti-fraud, anti-money-laundering, whistleblowing, threat-detection, and
              penetration-testing controls, which is the minimum expected posture for a regulated digital bank. The
              bigger diligence risk is what remains management-shaped: the assigned evidence does not name core banking
              vendors, expose product-specific incident history, or publish external security certifications in a way
              that would let an underwriter stress-test operational resilience. Product-fit risk also remains real at
