      - number: '2.2'
        title: Sizing lenses and public traction signals
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a real market problem, but only through lens-based sizing rather than a clean
              bottom-up TAM/SAM/SOM stack. A private.law summary of Oxford Economics work commissioned for Allica says
              established SMEs account for 35% of UK private-sector employment and 37% of turnover, while the same
              source cites a £65bn SME lending gap accumulated over 25 years. On the demand side, Allica argues that SME
              overdrafts have structurally retrenched, with balances down from £18bn to £2.7bn and their share of SME
              lending down from 31% to 5% since 2000. Company-reported traction suggests this is translating into
              adoption: management reported more than 14,000 active Business Rewards Account customers, customer
              penetration of the established-SME segment above 6%, and a target of 10%+ penetration in coming years.
              Those are meaningful signals, but they still depend on an unpublished denominator and company-defined
              segmentation logic.
