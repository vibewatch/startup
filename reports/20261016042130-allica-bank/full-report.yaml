    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, licence and operating model
        blocks:
          - type: paragraph
            body: >-
              Allica presents itself as a digital bank built for established UK SMEs rather than startups or sole
              traders, with most public descriptions centering on businesses in the 5-250 employee band. The assigned
              sources support a model that combines regulated banking infrastructure, savings-led primary banking, and
              named relationship-manager coverage rather than an app-only self-serve proposition. Official legal text
              confirms the regulated entity and London registered office, while third-party product review and Allica's
              own deposit-protection explainer reinforce that the proposition is aimed at operating businesses that keep
              meaningful balances on deposit. What remains less transparent in the assigned pool is the exact current
              headcount, full office footprint, and how the company itself distinguishes legal-entity age from the
              operating-bank launch timeline.
