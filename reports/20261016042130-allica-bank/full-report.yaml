  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing mechanics
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows a banking model still anchored in spread income rather than SaaS-like subscription
              revenue. Allica's 2025 gross revenue reached £371.3m and net interest income reached £159.0m as loans and
              advances grew to £3.742bn, while customer deposits reached £5.720bn. The annual report describes the
              Business Rewards Account as the heart of the proposition and a source of both lending opportunities and
              funding. BRA balances reached £1.791bn, equal to 31% of deposits, with SME deposits reaching 71% of the
              total funding base. That mix suggests the current account supports both distribution and funding quality,
              although public evidence does not quantify account-level contribution margin.

              Public pricing should be treated as list pricing, not realized monetization. An independent review checked
              on 4 August 2026 reported no monthly account fee, a 2.83% standard deposit rate, and a 3.33% best
              sustainable rate, with minimum-balance and activity conditions. The review cautions that headline rates
              can stack multiple boosts and should be modelled at the rate a customer can sustain. Those terms may
              attract operating balances, but they do not reveal Allica's weighted funding cost, realized fee income,
              incentive cost, or contribution margin by customer cohort.
            claimRefs:
