  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Revenue, lending and deposit growth stay above recent run rates; profitability remains intact; Series D
          capital funds share gains and disciplined expansion.
        - >-
          Up-round above the last disclosed $1.2bn becomes plausible because scale proof and capital support compound
          together.
        - >-
          Credit losses stay benign, expansion discipline holds, and product adoption broadens beyond the
          highest-balance users.
        - Would need more independent evidence than is currently public.
      - - Base
        - Growth remains healthy, profitability persists, and no major credit or regulatory surprise emerges.
        - >-
          Flat to modestly higher value around the last disclosed round is the most defensible public-evidence stance
          today.
        - Missing peer benchmarks, preference terms, and full-cycle credit data keep upside capped.
        - Best matches the assigned evidence set.
      - - Bear
        - >-
          Credit seasoning worsens, capital rebuild lags, or international / technology spend fails to earn visible
          returns.
        - >-
          A flat or down round below the last disclosed mark becomes credible as investors reprice execution and
          balance-sheet risk.
        - Deposit/customer growth may prove narrower or more price-sensitive than the headline story implies.
        - Material if diligence weakens confidence on capital or cohort quality.
    notes: >-
      Scenario ranges are directional relative to the last disclosed valuation because this pool lacks a clean
      comparable set or secondary price evidence.
