evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-and-ownership
    missingEvidence: >-
      Exact cumulative lifetime equity raised, current cap table, investor ownership percentages, and board or observer
      rights.
    whyItMatters: >-
      Control concentration and preference-stack economics shape downside protection, strategic latitude, and
      refresh-era valuation interpretation.
    diligencePath: >-
      Request the current cap table, board list, shareholder rights summary, and financing instrument mix from
      management or data-room materials.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: cover-metric-completeness
    missingEvidence: >-
      Clean current headcount and complete operating-location disclosure from a primary company source or audited
      filing.
    whyItMatters: >-
      Headcount and footprint are cover metrics that investors use to gauge operating scale, cost base, and execution
      maturity.
    diligencePath: >-
      Request the latest annual report, current org snapshot, and official office list, then update the KPI table with
      company-reported figures.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: customer-risk-signals
    missingEvidence: >-
      Complaint-volume, service-level, and regulatory-outcome data tied to customer-service issues or low-balance-fee
      friction.
    whyItMatters: >-
      Third-party review identifies a fit risk, but without complaint and outcome data it is hard to judge whether the
      issue is isolated or systemic.
    diligencePath: >-
      Pull FCA/FOS complaint disclosures, customer-service KPIs, and support-escalation metrics from management or
      regulator correspondence.
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent public denominator for UK established SMEs that exactly matches Allica's 5-250 employee and
      eligibility boundary.
    whyItMatters: Without that denominator, >6% penetration cannot be converted into a defensible SAM or SOM.
    diligencePath: >-
      Request management's internal segment-sizing deck with company counts by employee band, sector, and eligibility
      filter.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Cohort-level data on account primacy, deposit retention, broker-vs-direct origination mix, and customer
      acquisition cost by segment.
    whyItMatters: These metrics determine whether current traction is broad market pull or concentrated channel success.
    diligencePath: Obtain KPI packs for BRA primacy, churn, broker sourcing, and lending conversion by product line.
    relatedQuestionRefs:
      - QM003
      - QM007
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: >-
      Independent evidence on how many target customers need cash deposits, multicurrency balances, or routinely fall
      below the £10,000 balance threshold.
    whyItMatters: Those frictions define the real ceiling on current-account adoption and the practical width of Allica's SAM.
    diligencePath: >-
      Review declined-account reasons, balance-distribution cohorts, and roadmap materials covering cash and FX
      capabilities.
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: missing-source
    severity: material
    topic: named-peer-benchmark
    missingEvidence: >-
      Current official pricing, product, and trust/compliance pages for named UK SME rivals such as Starling Business,
      Tide, OakNorth, and major incumbent SME-bank offers.
    whyItMatters: >-
      A named-peer benchmark is needed to turn the current category-level map into a precise win-loss view and to
      support a defensible positioning quadrant.
    diligencePath: >-
      Add current official peer product and pricing pages plus at least one independent benchmark or review for each
      major rival category.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: missing-source
    severity: minor
    topic: switching-cost-data
    missingEvidence: >-
      Public data on Allica win rates, account-switching patterns, broker share by competitor, or customer multi-homing
      behavior.
    whyItMatters: >-
      Without switching and channel data, the chapter can describe likely lock-in mechanisms but cannot quantify how
      durable they are.
    diligencePath: >-
      Gather broker surveys, current-account switching data, channel mix disclosures, or management commentary on
      competitive conversion rates.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Channel CAC, payback period, conversion funnel, and retention by broker, direct, and Business Rewards Account
      cohorts.
    whyItMatters: Without acquisition-efficiency data, public profitability cannot be translated into repeatable scaling economics.
    diligencePath: Request monthly cohort dashboards, board KPI packs, and a direct-vs-broker acquisition cost bridge.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-headroom
    missingEvidence: >-
      Post-Series-D regulatory ratios, internal capital buffers, management stress scenarios, and expansion-investment
      phasing.
    whyItMatters: >-
      Public year-end cash, capital ratios, and fundraising headlines do not show how much risk-weighted-asset growth
      current capital supports.
    diligencePath: >-
      Request the latest regulatory capital pack, ICAAP capital plan, and management downside scenarios tied to loan
      growth and operating investment.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: missing-source
    severity: material
    topic: credit-quality-and-pricing
    missingEvidence: >-
      Product-level yields, customer concentration, vintage loss curves, sector concentration, and realized deposit
      beta.
    whyItMatters: These inputs determine whether current margin and provision levels are durable through a weaker credit cycle.
    diligencePath: Request loan-book vintage tables, pricing waterfalls, concentration reports, and quarterly asset-quality packs.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: technical-architecture
    missingEvidence: >-
      Named core-banking vendors, system boundaries, API coverage, and a canonical architecture diagram for
      current-account, savings, payment, and lending services.
    whyItMatters: >-
      Without the real system map, product differentiation and supplier concentration cannot be tested independently
      from management framing.
    diligencePath: >-
      Request an internal architecture diagram, vendor register, and integration inventory covering core banking,
      payments, cards, savings, and lending systems.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: >-
      Product-specific SLA targets, status-page or incident-history data, and module-level uptime/error metrics for
      current accounts, cards, payments, and accounting integrations.
    whyItMatters: >-
      Aggregate release and uptime statistics do not show whether the most important customer journeys are consistently
      reliable.
    diligencePath: >-
      Request historical incident logs, SLA definitions, and service-level reporting for the Business Rewards Account
      and its major integrations.
    relatedQuestionRefs:
      - QE003
      - QE007
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: external-assurance
    missingEvidence: >-
      External security-assurance artifacts such as certification scope, independent audit reports, and model-governance
      documentation for AI-assisted underwriting.
    whyItMatters: >-
      Public policy statements show intent, but not whether controls and AI workflows have been tested to a standard
      appropriate for enterprise customer diligence.
    diligencePath: >-
      Request the security-certification pack, latest audit summaries, and model-governance documentation for
      underwriting automation.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Public disclosure of churn, GRR, NRR, renewal rates, and cohort behaviour for current-account and lending
      customers.
    whyItMatters: >-
      Recommendation signals are positive, but without retention metrics it is hard to distinguish durable
      product-market fit from strong early satisfaction.
    diligencePath: >-
      Request board or investor KPI packs showing cohort retention, product-level churn, and renewal behaviour by
      customer segment.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Exposure by top depositor, top borrower, broker concentration, and channel-level acquisition mix.
    whyItMatters: >-
      Customer quality for a bank depends not just on growth but on how concentrated deposits, loan balances, and
      acquisition channels are.
    diligencePath: >-
      Request internal concentration dashboards for deposits, loan book exposure, and acquisition by
      broker/accountant/referral channel.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Readable named production deployments, customer logos tied to specific use cases, or customer-spoken case studies
      with outcomes.
    whyItMatters: >-
      The assigned pool shows broad recommendation and cohort proof, but it does not let an investor verify customer
      depth account by account.
    diligencePath: >-
      Ask management for named reference customers across deposits, current accounts, asset finance, and commercial
      mortgages, with permissioned diligence calls.
    relatedQuestionRefs:
      - QU004
      - QU005
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: complaints-and-fee-remediation
    missingEvidence: >-
      Exact 2026 complaint counts, FOS/BBRS outcomes, and remediation data tied to support issues and the low-balance
      fee.
    whyItMatters: >-
      Without complaint volume and resolution data, it is hard to distinguish isolated servicing friction from a broader
      conduct or retention issue.
    diligencePath: >-
      Request board / conduct-committee MI covering complaints, fee disputes, response SLAs, and remediation outcomes by
      product.
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-channel-concentration
    missingEvidence: >-
      Exact share of originations and current-account servicing tied to ClearBank, brokers, and accountant/referral
      partners, plus contractual protections and contingency plans.
    whyItMatters: >-
      The public evidence shows these dependencies are important, but not whether one partner or channel has enough
      concentration to become a single-point commercial risk.
    diligencePath: >-
      Request outsourcing register extracts, channel-mix KPIs, top-counterparty SLA terms, and management's exit /
      failover playbooks.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: operational-resilience-incidents
    missingEvidence: >-
      Major-incident history, penetration-test findings, outsourced-service resilience testing, and recovery-time
      performance.
    whyItMatters: >-
      Public controls language is useful, but an investor cannot assess operational fragility without evidence on actual
      incidents, test exceptions, and recovery execution.
    diligencePath: >-
      Review the operational-resilience pack, cyber risk committee papers, incident postmortems, and third-party
      assurance results.
    relatedQuestionRefs:
      - QR006
      - QR007
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: credit-loss-vintages
    missingEvidence: >-
      Vintage default curves, loss-given-default experience, workout timelines, and sector / collateral concentration
      for loans migrating into stage 2 or stage 3.
    whyItMatters: >-
      Rising stage 2 and stage 3 balances are visible publicly, but the investment case depends on whether those
      exposures are seasoning normally or signalling deteriorating underwriting economics.
    diligencePath: >-
      Request cohort-level credit monitoring, stress-test outputs, and realised-loss analysis by product and origination
      vintage.
