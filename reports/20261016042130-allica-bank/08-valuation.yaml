schemaVersion: report-v2
artifact: valuation
slug: allica-bank
runDate: 2026-10-16
company:
  name: Allica Bank
chapter:
  number: 8
  title: Valuation
  summary: >-
    Allica's disclosed ~$1.2 billion valuation and $155 million February 2026 Series D are
    supported by real operating progress, including £371.3 million of 2025 gross revenue,
    £43.7 million of underlying profit before tax, and continued balance-sheet growth. The
    evidence is still not enough for a buy call because the public record in this assigned pool
    does not provide a clean peer set, secondary marks, or post-Series D preference detail, so
    the prudent stance is track / fair with high residual risk.
sections:
  - id: valuation-context
    title: Current valuation context
    body: >-
      Public evidence supports the existence of a unicorn-scale financing event but not a fully
      triangulated market-clearing price. Independent coverage and company-controlled release
      channels align that Allica reached roughly a $1.2 billion valuation alongside a $155
      million Series D in February 2026, while the 2025 annual report shows a profitable,
      rapidly growing bank rather than a pre-revenue story. FY2025 gross revenue reached
      £371.3 million, underlying profit before tax reached £43.7 million, lending closed at
      £3.7 billion, and customer deposits ended at £5.7 billion. That operating base matters
      because it means the current price narrative is anchored in scale and earnings, not only
      brand momentum. It does not settle whether the price is attractive, because the public
      materials here still do not disclose a clean peer benchmark, precise post-money ownership,
      or preference terms.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV013]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Why the case is investable but not yet actionable
    body: >-
      The core thesis is straightforward: Allica appears to have found a defensible niche inside
      UK SME banking by serving established businesses that are too complex for mass-market
      fintechs and too neglected by incumbents, pairing relationship managers with proprietary
      technology and showing unusually early profit for a challenger-bank growth story. The
      anti-thesis is equally important: much of the valuation narrative is still company-issued or
      company-syndicated, capital ratios weakened through 2025 before the raise, and the most
      detailed independent product review shows the franchise is best suited to cash-rich SMEs
      rather than the whole SME market. That combination makes Allica more compelling than a
      typical opaque fintech, but still too evidence-thin for a price-insensitive buy call.
    claimRefs: [CV007, CV008, CV009, CV011, CV012, CV013]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: scenarios
    title: Scenario framing and entry discipline
    body: >-
      The most defensible way to frame valuation with this evidence set is directionally around
      the last disclosed round rather than through a faux-precise target multiple. A bull case
      requires Allica to keep converting strong current-account and lending traction into durable
      share gains while preserving profitability and replenishing capital through earnings rather
      than repeated dilution. A base case keeps the company around or modestly above the last
      disclosed valuation if growth remains healthy and credit performance stays benign. A bear
      case is a flat or down round if credit losses season upward, technology and international
      spending run ahead of returns, or customer growth proves narrower and more rate-sensitive
      than headline customer counts imply. Entry discipline should therefore focus on whether a
      new investor is getting either better price discovery or better downside protection than the
      public evidence shows today.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV008, CV009, CV013, CV015, CV016]
    tableRefs: [TV003]
  - id: diligence-asks
    title: Exit readiness and final diligence asks
    body: >-
      The recommendation is track rather than avoid because the business already demonstrates
      scale, profitability, and customer proof that could justify institutional interest, and it is
      track rather than buy because the missing diligence is exactly the missing diligence that
      determines investor outcomes in a private bank: cap-table mechanics, preference overhang,
      and credit-cycle resilience. Before underwriting a fresh entry, an investor should request
      the post-Series D share-class stack, liquidation preferences, ownership dilution, vintage
      default and loss data, sector concentration, and evidence that relationship-led current
      accounts convert into durable primary-banking relationships instead of rate-driven deposit
      inflows. If those answers are strong, the disclosed valuation can still work; if they are
      weak, the same unicorn label could mask asymmetric downside.
    claimRefs: [CV008, CV009, CV011, CV013, CV014, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - View
      - Evidence signal
      - Decision implication
    rows:
      - [Recommendation, track, "Profitable growth is proven but price discovery is incomplete", "Monitor for a better price or stronger diligence access"]
      - [Confidence, medium, "Public evidence is internally consistent but still partly company-controlled", "Do not underwrite an aggressive upside case from public evidence alone"]
      - [Risk rating, high, "Capital, credit-cycle and execution unknowns still dominate downside", "Treat downside protection as a gating term, not a nice-to-have"]
      - [Valuation stance, fair, "The $1.2bn mark is supportable from scale and profit evidence but not independently benchmarked", "Flat-to-modestly-up outcomes look more defendable than immediate multiple expansion"]
    notes: >-
      Analytical judgment anchored to the disclosed 2026 financing event, FY2025 results, and
      public evidence gaps; this is a decision summary rather than a source table.
    claimRefs: [CV001, CV002, CV003, CV008, CV013, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - ["Thesis: niche fit", "Established SMEs remain Allica's stated 5–250 employee niche, with relationship-led service and proprietary technology repeatedly emphasized across independent and official sources.", "View improves if independent evidence shows that niche advantage translates into durable cross-product share gains beyond marketing language."]
      - ["Thesis: operating proof", "FY2025 gross revenue reached £371.3m, underlying profit before tax reached £43.7m, lending reached £3.7bn, and deposits reached £5.7bn.", "View improves if 2026 data shows those metrics compounding without material capital strain."]
      - ["Anti-thesis: customer fit is narrower than headline brand strength", "Independent product review says the account suits cash-rich established SMEs but becomes unattractive for volatile-balance users because of fee and yield cliffs.", "View improves if management shows customer growth is broad-based across usage cohorts, not concentrated in fee-insulated or high-balance customers."]
      - ["Anti-thesis: price discovery is still opaque", "Assigned public evidence does not provide a clean peer multiple set, secondary marks, or post-Series D preference detail.", "View improves if management discloses round mechanics, investor protections, and a comp set that supports the same entry price."]
    notes: >-
      Each row pairs an investable argument with the incremental evidence needed to move the
      recommendation.
    claimRefs: [CV002, CV003, CV004, CV005, CV007, CV011, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Revenue, lending and deposit growth stay above recent run rates; profitability remains intact; Series D capital funds share gains and disciplined expansion.", "Up-round above the last disclosed $1.2bn becomes plausible because scale proof and capital support compound together.", "Credit losses stay benign, expansion discipline holds, and product adoption broadens beyond the highest-balance users.", "Would need more independent evidence than is currently public."]
      - ["Base", "Growth remains healthy, profitability persists, and no major credit or regulatory surprise emerges.", "Flat to modestly higher value around the last disclosed round is the most defensible public-evidence stance today.", "Missing peer benchmarks, preference terms, and full-cycle credit data keep upside capped.", "Best matches the assigned evidence set."]
      - ["Bear", "Credit seasoning worsens, capital rebuild lags, or international / technology spend fails to earn visible returns.", "A flat or down round below the last disclosed mark becomes credible as investors reprice execution and balance-sheet risk.", "Deposit/customer growth may prove narrower or more price-sensitive than the headline story implies.", "Material if diligence weakens confidence on capital or cohort quality."]
    notes: >-
      Scenario ranges are directional relative to the last disclosed valuation because this pool
      lacks a clean comparable set or secondary price evidence.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV008, CV009, CV013, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Operating proof and niche fit support monitoring the current valuation, while capital and
      price-discovery gaps block a buy recommendation.
    data:
      nodes:
        - id: niche
          label: Underserved established SME niche
          value: "5–250 employee target with relationship-led banking"
          tone: opportunity
        - id: scale
          label: 2025 operating scale is real
          value: "£371.3m revenue; £43.7m underlying PBT; £3.7bn loans"
          tone: positive
        - id: momentum
          label: 2026 financing and traction remain positive
          value: "$155m Series D; >14k BRA customers; >4,000-business recommendation signal"
          tone: positive
        - id: fit-risk
          label: Customer-fit concentration risk persists
          value: "£25 fee below £10k average balance; 0.00% below £20k savings"
          tone: risk
        - id: opacity
          label: Price discovery is incomplete
          value: "No clean peer set, secondary marks, or public preference stack"
          tone: risk
        - id: outcome
          label: Track / fair / high residual risk
          value: "Monitor for better diligence access or better entry terms"
          tone: neutral
      edges:
        - from: niche
          to: scale
          relationship: Focus supports economics
        - from: scale
          to: momentum
          relationship: Operating proof supports the financing narrative
        - from: momentum
          to: fit-risk
          relationship: Growth quality still matters
        - from: fit-risk
          to: opacity
          relationship: Narrow fit increases diligence burden
        - from: opacity
          to: outcome
          relationship: Missing price discovery blocks a buy call
    approximationNotes: null
    claimRefs: [CV002, CV003, CV004, CV006, CV007, CV011, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: "Working recommendation: track, do not chase the unicorn label"
    body: >-
      Allica already looks like a real bank with real earnings, but the assigned public evidence
      still cannot prove that a new investor gets enough valuation protection or upside at the
      current disclosed price.
    claimRefs: [CV001, CV002, CV003, CV013, CV014]
  - calloutType: risk
    title: "Main blocker is valuation mechanics, not product-market fiction"
    body: >-
      The core business model appears credible; the missing pieces are round mechanics,
      preference stack, and full-cycle credit evidence that determine whether a fair headline
      price becomes an attractive entry.
    claimRefs: [CV008, CV009, CV013, CV016]
