callouts:
  - calloutType: insight
    title: Allica's real competitor is not one peer list
    body: >-
      The assigned evidence points to a wedge strategy: Allica is strongest when an
      established UK SME wants both a relationship manager and a broader banking stack than
      app-led challengers provide, but does not want to return fully to incumbent-bank service
      models.
    claimRefs: [CP001, CP002, CP003, CP005]
  - calloutType: risk
    title: The proposition weakens fast outside the cash-rich core
    body: >-
      Independent review evidence suggests Allica loses comparative strength when a buyer is
      balance-constrained, mobile-first, heavily cross-border, or dependent on cash deposits
      and built-in invoicing; those buyers can still choose substitutes without paying a large
      switching-cost penalty.
    claimRefs: [CP010, CP011, CP013, CP014]
