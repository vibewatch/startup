company:
  name: Allica Bank
chapter:
  number: 3
  title: Competitors
  summary: >-
    Assigned evidence supports Allica's strongest competitive wedge as a relationship-led,
    full-service SME bank positioned between incumbent high-street banks and app-led
    challengers. The edge is real for established, cash-rich UK SMEs, but the same evidence
    also shows clear weak-fit segments around low average balances, app-first workflows,
    multi-currency needs, and cash handling.
sections:
  - id: competitive-frame
    title: "Competitive frame: Allica is selling the gap between incumbents and challengers"
    body: >-
      The assigned evidence frames Allica less as a generic SMB bank and more as a category
      wedge inside UK established-SME banking. Independent funding coverage in February 2026
      described Allica as targeting established SMBs with roughly 5-250 employees and as
      addressing firms that have "outgrown challenger offerings" while remaining underserved
      by traditional banks. Allica's own 2025 annual report makes the same competitive claim
      more explicitly: it organizes its proposition against incumbent high-street pain points
      in finance access, relationship coverage, day-to-day pricing, and fragmented service.
      That means the relevant rival set is not one named peer list alone. It includes
      incumbent SME banks, app-led challenger accounts, specialist lenders that can win the
      credit relationship, and status-quo multi-provider stacks that bundle an operating
      account, an FX or treasury tool, and separate funding products. The same evidence also
      shows that Allica is trying to compress white space by broadening its own product scope
      across current accounts, savings, commercial mortgages, asset finance, bridging, growth
      finance, and invoice finance, reducing how much business a customer must place with
      specialists.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP008, CP009]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-distribution
    title: Capability and distribution create the main moat, but also define the contest
    body: >-
      Public evidence suggests Allica's differentiation is strongest where a buyer wants both
      breadth and relationship intensity. The annual report calls the bank the only digital
      bank built solely for established businesses and ties that claim to a full banking
      relationship via the Business Rewards Account, specialist credit products, and a
      proprietary technology stack. The same filing also says Allica originated GBP1.3 billion
      of new lending in 2025, describes itself as the UK market leader in broker-distributed
      lending, and notes increasing direct customer flow. That matters competitively because it
      means rivalry is not only app versus branch; introducers, brokers, and specialist debt
      advisers also influence who wins the lending relationship. Trust and regulatory posture
      are mixed rather than uniformly stronger than peers: the account and savings surfaces
      benefit from full UK bank regulation, while some lending and bridging products are
      explicitly stated to be unregulated products. The result is a defensible middle position,
      but one that still leaves room for specialists or software-led challengers to win
      discrete jobs.
    claimRefs: [CP005, CP006, CP007, CP015]
    tableRefs: [TP002]
  - id: pricing-and-weak-fit-segments
    title: Pricing advantage is selective, so several buyer types remain contestable
    body: >-
      Allica's pricing and packaging are attractive only for a specific buyer profile. The
      independent BusinessExpert review says the product works best for established SMEs that
      keep meaningful cash reserves on platform, because the savings pot can pay 2.83% AER
      above GBP40,000 and promotional boosts can lift the top tier to 4.08%. The same source
      also surfaces the clearest disconfirming evidence in the assigned pool: a GBP25 monthly
      fee applies when average balances fall below GBP10,000 unless the customer also holds an
      active Allica loan or overdraft, there are no cash deposits, cross-border transfers are
      routed through Wise rather than a native multi-currency treasury product, and buyers
      needing built-in invoicing or phone-centric workflows may be better served by Tide or
      Starling. This does not erase Allica's advantage for the right segment; it narrows it.
      The competitive risk is that low-balance, app-first, or internationally active SMEs can
      still multi-home or choose substitutes without giving Allica the primary operating
      account.
    claimRefs: [CP010, CP011, CP012, CP013, CP014, CP016]
    tableRefs: [TP003]
