schemaVersion: report-v2
artifact: financials
slug: allica-bank
runDate: 2026-10-16
company:
  name: Allica Bank
chapter:
  number: 4
  title: Financials
  summary: >-
    Allica's public financial picture is a profitable, balance-sheet-led SME bank whose 2025
    growth was driven by lending expansion and a rapidly scaling Business Rewards Account that
    improved funding mix. Underwriting confidence is limited by missing public data on realized
    product economics, acquisition efficiency, and post-Series-D regulatory headroom despite
    solid disclosed profit, credit-cost, and liquidity metrics.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing mechanics
    body: >-
      Public evidence shows a banking model still anchored in spread income rather than SaaS-like
      subscription revenue. Allica's 2025 gross revenue reached £371.3m and net interest income
      reached £159.0m as loans and advances grew to £3.742bn, while customer deposits reached
      £5.720bn. The annual report describes the Business Rewards Account as the heart of the
      proposition and a source of both lending opportunities and funding. BRA balances reached
      £1.791bn, equal to 31% of deposits, with SME deposits reaching 71% of the total funding
      base. That mix suggests the current account supports both distribution and funding quality,
      although public evidence does not quantify account-level contribution margin.
      
      Public pricing should be treated as list pricing, not realized monetization. An independent
      review checked on 4 August 2026 reported no monthly account fee, a 2.83% standard deposit
      rate, and a 3.33% best sustainable rate, with minimum-balance and activity conditions. The
      review cautions that headline rates can stack multiple boosts and should be modelled at the
      rate a customer can sustain. Those terms may attract operating balances, but they do not
      reveal Allica's weighted funding cost, realized fee income, incentive cost, or contribution
      margin by customer cohort.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
      - CI015
      - CI016
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: cost-structure-credit-and-capital
    title: Cost structure, credit costs, and capital
    body: >-
      Profitability is real, but it is being earned alongside continued investment. Underlying
      profit before tax rose to £43.7m in 2025, while operating expenses rose to £108.4m. The
      annual report attributes that expense growth to sales, partnership, technology, data,
      product, and marketing investment intended to support direct originations and Business
      Rewards Account expansion. This is encouraging for operating leverage potential, but it also
      means public profit should not be read as a fully mature earnings base; management is still
      spending ahead of growth.
      
      Credit and capital metrics show a bank that remains sound, but not one that is obviously
      self-funding every expansion ambition. Expected credit loss provisions were £42.6m with a
      1.1% coverage ratio, while CET1 ended 2025 at 13.4% and total capital at 16.8%, both below
      2024 levels as assets scaled. Allica's 25 February 2026 Series D is therefore strategically
      important: management says it will support UK growth, proprietary technology investment, and
      international expansion. Year-end cash and cash equivalents were £1.287bn, but this is not
      equivalent to venture runway for a regulated bank. Public evidence still does not disclose
      post-Series-D regulatory ratios, internal capital triggers, or the exact pace at which new
      product and geography investments will consume capital.
    claimRefs:
      - CI002
      - CI011
      - CI012
      - CI013
      - CI014
    tableRefs:
      - TI003
  - id: underwriting-view-and-gaps
    title: Underwriting view and diligence blockers
    body: >-
      The best public reading is that Allica has built a financially credible SME-banking engine:
      lending is still the earnings core, deposits are moving toward operating-account balances,
      and the current account appears to improve customer attachment rather than simply add a low
      value payments feature. New organic lending of £1.273bn across broker and direct channels
      also suggests the bank is diversifying origination beyond a pure intermediary model. Those
      are good signs for revenue quality and margin durability.
      
      The blocker is granularity. Public disclosures do not provide channel CAC, payback, approval
      rates, cohort retention, product-level yield, customer concentration, or a capital model that
      translates Series D proceeds into risk-weighted-asset capacity. Review evidence also flags
      that Allica is structurally less suitable for cash-handling businesses and that independent
      service benchmarking is weaker than for CMA-surveyed incumbents. The underwriting verdict is
      therefore positive on momentum and funding mix, but incomplete on normalized unit economics
      and downside resilience without management data-room access.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI009
      - CI010
      - CI014
      - CI016
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Lending spread
        - Interest earned on the SME loan book minus funding and hedging costs
        - £m / NIM
        - Net interest income £159.0m; NIM 4.7%
        - High for disclosed totals; product-level yield mix undisclosed
        - Product-by-product yield, cost-of-funds, and hedge bridge
      - - Business Rewards Account funding
        - Operating balances reduce funding reliance on personal deposits and support primary-bank relationships
        - £bn balances / funding mix
        - BRA balances £1.791bn; 31% of deposits; SME deposits 71% of total
        - Medium; balance mix is clear but retention and churn are not
        - Cohort retention, primary-bank penetration, and average operating balances
      - - Card and transaction economics
        - Card income partly offsets deposit servicing and transaction fees
        - £m
        - Card income £5.0m; deposit servicing fees £5.2m
        - Medium; aggregate contribution only
        - Gross interchange, transaction mix, and per-account contribution margin
      - - Lending fees and newer finance products
        - Loan fees plus newer invoice and embedded finance capabilities acquired with Kriya
        - £m / product status
        - Loan fee income £2.5m; Kriya added invoice and embedded finance in 2025
        - Medium; revenue mix by product family is not public
        - Revenue split by product, acquired-book contribution, and take-rates
    notes: Public data mixes audited 2025 totals with management commentary; realized product economics remain undisclosed.
    enumerationScope:
      coverage: partial
      basis: Publicly disclosed 2025 revenue mechanisms and balances, not an exhaustive product P&L.
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI006
      - CI007
      - CI008
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product / price basis
      - Public list price
      - Realized pricing view
      - Discounts / unknowns
      - Source
    rows:
      - - Business Rewards Account monthly fee
        - £0, subject to eligibility
        - Public list price only
        - Realized servicing cost and waiver incidence are undisclosed
        - The Business Banking Expert review
      - - Standard deposit interest
        - 2.83% AER, with a minimum-balance condition
        - Public list rate checked 4 August 2026
        - Weighted realized rate and deposit beta are undisclosed
        - The Business Banking Expert review
      - - Best sustainable deposit interest
        - 3.33% AER
        - Independent review's sustainable-rate assessment
        - Headline construction depends on activity and other boosts
        - The Business Banking Expert review
      - - Lending and complex-product pricing
        - Not publicly posted at product level
        - Realized loan pricing and fee yield are undisclosed
        - No public margin bridge by lending category or broker/direct channel
        - Annual report
    notes: Public materials disclose list pricing and conditions, but not realized customer pricing or blended product yield.
    enumerationScope:
      coverage: partial
      basis: Publicly visible account and savings pricing only; lending spreads are not posted product-by-product.
    claimRefs:
      - CI009
      - CI010
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value/null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Net interest margin
        - 4.7%
        - High
        - Best public proxy for spread economics on the balance-sheet model
        - Product-level asset yield, funding-cost, and hedge bridge
      - - Credit-cost proxy
        - ECL £42.6m; coverage ratio 1.1%
        - High
        - Indicates current provisioning load but not full-cycle loss behavior
        - Vintage losses, NPL/default data, LGD, and sector concentration
      - - Funding-mix proxy
        - SME deposits 71% of total; BRA balances 31% of deposits
        - High
        - Suggests improving funding quality if balances are sticky operating accounts
        - Cohort churn, primary-bank rate, and deposit beta by segment
      - - Operating leverage proxy
        - Revenue +27% vs operating expenses +35%
        - Medium
        - Shows growth is still investment-led rather than fully scaled
        - Normalized opex run-rate and fixed/variable cost split
      - - CAC / payback / sales-cycle efficiency
        - null
        - Low
        - Core scaling economics are missing from public evidence
        - Channel CAC, payback, approval funnel, win rate, and retention cohorts
    notes: Nulls are genuine public-data gaps, not zero values.
    enumerationScope:
      coverage: partial
      basis: Table mixes disclosed public proxies with missing private metrics needed for underwriting.
    claimRefs:
      - CI003
      - CI007
      - CI008
      - CI011
      - CI012
      - CI013
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence suggests Allica converts SME operating balances and loan origination volume
      into spread income, then into profit, with current-account adoption improving funding mix.
    data:
      nodes:
        - id: customer-base
          label: Established SME customer base
          value: "5-250 employee target segment"
          detail: Relationship-banking focus for established SMEs rather than startups or sole traders.
        - id: current-account-funding
          label: Current accounts and deposits
          value: "£5.720bn deposits; £1.791bn BRA balances"
          detail: Funding base shifted toward SME operating balances and away from personal deposits.
        - id: origination
          label: Lending origination engine
          value: "£1.273bn new organic lending"
          detail: Origination runs through broker and direct channels across multiple lending products.
        - id: income
          label: Interest and fee income
          value: "£159.0m net interest income; £2.5m loan fees; £5.0m card income"
          detail: Spread income remains the main revenue engine, with fee streams still secondary.
        - id: operating-profit
          label: Operating result before tax
          value: "£108.4m opex; £42.6m ECL; £43.7m underlying PBT"
          detail: Profitability exists, but the bank is still funding staff, product, and distribution expansion.
        - id: capital
          label: Capital reinforcement
          value: "CET1 13.4%; total capital 16.8%; Series D announced Feb 2026"
          detail: Public evidence shows adequate capital plus fresh equity/AT1 support for further growth.
      edges:
        - from: customer-base
          to: current-account-funding
          label: operating balances and account adoption
        - from: customer-base
          to: origination
          label: borrowing demand
        - from: current-account-funding
          to: income
          label: funding base and transaction activity
        - from: origination
          to: income
          label: spread income and lending fees
        - from: income
          to: operating-profit
          label: less servicing, opex, and credit costs
        - from: operating-profit
          to: capital
          label: retained earnings plus external capital
    approximationNotes: Public figures are point-in-time or annual aggregates, not a cohort-level unit-economics model.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI011
      - CI012
      - CI013
      - CI014
