      - Year / as-of
      - Geography
      - Value
      - CAGR / trajectory
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - Oxford Economics for Allica (via private.law summary)
        - 2026 summary of cited report
        - UK
        - 35% of private-sector employment
        - n/a
        - Company-commissioned macro segmentation lens
        - Medium
        - Public summary only; no disclosed denominator by product or channel
      - - Oxford Economics for Allica (via private.law summary)
        - 2026 summary of cited report
        - UK
        - 37% of private-sector turnover
        - n/a
        - Company-commissioned macro segmentation lens
        - Medium
        - Macro share, not a direct serviceable-market count
      - - Oxford Economics for Allica (via private.law summary)
        - 2026 summary of cited report
        - UK
        - £65bn accumulated SME lending gap over 25 years
        - n/a
        - Company-commissioned long-run credit-gap lens
        - Medium
        - Indicates unmet demand, not Allica's captureable near-term revenue pool
      - - Allica management / annual report
        - FY2025
        - UK
        - ">14,000 active BRA customers and >6% penetration of established SMEs"
        - Active BRA customers +133% YoY
        - Company-reported traction against internal segment definition
        - High
        - Penetration denominator is not publicly reconciled
      - - Allica management / private.law summary
        - As of Aug 2026
        - UK
        - SME overdrafts down from £18bn to £2.7bn; share down from 31% to 5%
        - ">80% decline since 2000"
        - Company-cited market-failure lens for overdraft demand
        - Medium
        - Long-range category trend, not Allica-specific demand conversion
    notes: >-
      These lenses are not additive TAM→SAM→SOM layers. Public evidence supports demand direction
      and penetration momentum, but not a clean independently verified denominator for Allica's exact
      serviceable market.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM011]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Cash-rich established SME current account
        - Owner-manager or CFO
        - Finance team
        - Operating company
        - Primary account, payments, reserve cash, card spend
        - Finance lead
        - Need to earn on idle balances while keeping a named relationship contact
      - - Broker-led secured borrower
        - Managing director or finance director
        - Borrower with broker and accountant influence
        - Borrowing entity
        - Mortgage, asset finance, growth finance, bridging
        - CFO or owner
        - Incumbent withdrawal from relationship-led SME lending and overdrafts
      - - Finance-software-integrated operator
        - Finance lead
        - Finance team and accountant
        - Operating company
        - Current account plus QuickBooks-enabled back-office flow
        - Controller or CFO
        - Desire for bundled payments, savings, and working-capital access
      - - Poor-fit segment
        - Sole trader, startup founder, or cash-heavy operator
        - Founder or branch operator
        - Small business
        - Low-balance account, cash lodgement, or multicurrency workflow
        - Owner
        - Typically diverted by balance threshold, eligibility rules, or missing cash / FX support
    notes: >-
      Buyer and workflow roles are inferred from published product design and onboarding requirements;
      poor-fit row is included to make the exclusion boundary explicit rather than treating all SMEs as
      equally addressable.
    claimRefs: [CM002, CM004, CM012, CM013, CM014, CM015]
