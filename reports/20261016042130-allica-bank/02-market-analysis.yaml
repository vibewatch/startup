artifact: market-analysis
slug: allica-bank
runDate: 2026-10-16
company:
  name: Allica Bank
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Allica's market is not SME banking in general but UK established SMEs with 5-250 employees:
    firms that public and company-linked sources describe as underserved by incumbents yet too
    complex for microbusiness-first challengers. Public sizing lenses support a meaningful
    opportunity—35% of private-sector employment, 37% of turnover, a cited £65bn lending gap,
    and reported penetration above 6%—but the public record still does not disclose a clean
    independent denominator for a defensible SAM or SOM.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Allica defines its core market narrowly: established UK SMEs rather than the full SME universe.
      Across company materials and independent summaries, the recurring boundary is operating
      businesses with 5-250 employees, trading history, and documented financial performance. That
      framing matters because it excludes sole traders, newly formed businesses, and other thin-file
      customers that app-led challengers can onboard cheaply but that do not fit Allica's economics or
      underwriting posture. The status-quo substitutes are incumbent high-street banks for current
      accounts and secured lending, while the closest digital substitutes are microbusiness accounts such
      as Starling, Tide, or Zempler for simpler workflows. Allica's wedge is the claim that businesses in
      the middle want a full banking relationship—current account, savings, overdraft, mortgages, asset
      finance, growth finance, and bridging—rather than point products.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and public traction signals
    body: >-
      Public evidence supports a real market problem, but only through lens-based sizing rather than a
      clean bottom-up TAM/SAM/SOM stack. A private.law summary of Oxford Economics work
      commissioned for Allica says established SMEs account for 35% of UK private-sector employment
      and 37% of turnover, while the same source cites a £65bn SME lending gap accumulated over 25
      years. On the demand side, Allica argues that SME overdrafts have structurally retrenched, with
      balances down from £18bn to £2.7bn and their share of SME lending down from 31% to 5% since
      2000. Company-reported traction suggests this is translating into adoption: management reported
      more than 14,000 active Business Rewards Account customers, customer penetration of the
      established-SME segment above 6%, and a target of 10%+ penetration in coming years. Those are
      meaningful signals, but they still depend on an unpublished denominator and company-defined
      segmentation logic.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM011]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-and-constraints
    title: Buyers, adoption drivers, and adoption constraints
    body: >-
      The buyer is typically an owner-manager, CFO, or finance lead deciding whether to make Allica a
      primary operating account and lending partner; the user can be the finance team, accountant, or
      broker-led borrower, while the payer is the business itself through balances, fees, and borrowing
      economics. The strongest adoption drivers in public evidence are relationship banking, reward-led
      deposits, and bundled credit: named relationship managers, cashback, savings incentives, and a
      broader secured-lending stack all reinforce account primacy and help Allica fund lending with
      lower-cost operating balances. The same evidence also defines the ceiling. Businesses that cannot
      sustain the £10,000 average-balance threshold, need cash deposits, or require routine multicurrency
      operations are worse fits, so Allica's current SAM is narrower than the broad "SME banking"
      label implies. European adjacency exists via a Swedish licence application, but that remains option
      value rather than current market proof.
    claimRefs: [CM012, CM013, CM014, CM015, CM016]
    tableRefs: [TM003]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Established-SME operating accounts
        - Current account balances, savings pots, term deposits, domestic payments, overdrafts
        - Sole-trader banking, consumer deposits, startup-first app accounts
        - Owner-manager or finance lead / operating company
        - Core wedge for Business Rewards Account primacy and funding
      - - Established-SME secured lending
        - Commercial mortgages, asset finance, growth finance, bridging
        - Unsecured microcredit, venture debt, large-corporate syndicated facilities
        - Finance director or owner with broker influence / borrowing entity
        - Primary monetisation pool tied to underwriting depth
      - - Receivables and embedded-finance adjacency
        - Invoice finance and embedded payments via the Kriya acquisition
        - Generic PSP acquiring and consumer payments flows
        - Finance team or platform operator / business customer
        - Adjacent workflow that can deepen share of wallet
      - - Future European adjacency
        - Potential non-UK SME banking beachhead implied by Swedish licence application
        - Current non-UK production revenue and disclosed European SAM
        - Not yet disclosed / not yet disclosed
        - Strategic option, but not part of today's evidenced market
    notes: >-
      Boundary summary based on company and independent descriptions; rows are not additive TAM
      layers and "not yet disclosed" marks places where public evidence does not isolate the buyer or
      spend base.
    claimRefs: [CM001, CM002, CM003, CM004, CM016]
