schemaVersion: report-v2
artifact: customers
slug: allica-bank
runDate: 2026-10-16
company:
  name: Allica Bank
chapter:
  number: 6
  title: Customers
  summary: >-
    Allica's customer evidence points to a deliberately narrow segment—UK
    established SMEs with 5-250 staff—and to strong recommendation-led
    traction, including more than 2,000 current-account customers within a year
    of launch, customer NPS of +76 in late 2025, and large public review
    volumes. The commercial logic looks durable because the Business Rewards
    Account deepens deposit and lending relationships, but public disclosure
    still does not show churn, cohort, renewal, or concentration metrics, and
    the assigned evidence pack offers little named end-customer proof beyond
    surveys and self-selected reviews.
sections:
  - id: segment-definition
    title: Narrow segment focus, not broad SMB coverage
    body: |
      Allica's customer strategy is intentionally narrow. Across its annual report,
      partner case study, and independent review coverage, the bank repeatedly frames
      its core customer as an established UK SME rather than a startup, sole trader,
      or general microbusiness. That focus matters commercially: the proposition is
      built for finance teams that want a relationship manager, savings yield, and
      lending access in the same banking relationship, not for businesses seeking the
      lightest possible onboarding or a free low-balance operating account. The
      segmentation evidence is therefore strong on who Allica wants, and equally
      important on who it is willing to exclude.
    claimRefs: [CU001, CU002, CU003, CU013]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption proof is strongest in recommendation and account growth
    body: |
      Public proof of customer traction is strongest in recommendation signals and
      Business Rewards Account growth. ClearBank's case study shows Allica opening
      more than 2,000 current accounts for established SMEs within a year of launch,
      while the 2025 annual report says both account holders and primary-bank usage
      grew strongly during 2025. Recommendation evidence is also unusually visible:
      the bank reported customer NPS of +76 in late 2025, 4.6/5 on Trustpilot from
      more than 1,700 customers, 4.89/5 from more than 2,400 Smart Money People
      reviews, and a separate 2026 claim that it was the most recommended business
      bank based on feedback from over 4,000 businesses. The gap is denominator
      quality: these signals are helpful, but they are not the same as disclosed
      churn, retention, or usage cohorts.
    claimRefs: [CU004, CU005, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
  - id: expansion-loops
    title: The current account appears to be the expansion hub
    body: |
      The Business Rewards Account appears to be Allica's land-and-expand hub. The
      annual report presents the account as the centre of a full banking
      relationship, because it creates ongoing transaction touchpoints, attracts
      lower-cost funding, and opens lending opportunities. That thesis is reinforced
      by partner evidence from ClearBank and by Allica's own 2026 statements that
      penetration has passed 6% of its target segment and is being pushed toward 10%
      by 2028. Channel evidence matters here too: commercial finance brokers remain
      the largest lending channel, accountants are an increasingly cultivated partner
      set, and a job posting shows Allica operating with 300+ third parties behind
      customer service delivery. Expansion potential is credible, but dependence on
      intermediaries and infrastructure partners is material.
    claimRefs: [CU002, CU006, CU010, CU011, CU012, CU016]
    figureRefs: [FU001]
  - id: durability-and-proof-gaps
    title: Durability and concentration still require offline diligence
    body: |
      The public evidence pack is much weaker on durability than on acquisition and
      recommendation. Allica's ethics statement confirms that it regularly solicits
      feedback and directs customers to Trustpilot, but neither that page nor the
      annual report discloses GRR, NRR, churn, renewal rates, customer concentration,
      or cohort behaviour. Independent review coverage also shows that the account is
      not a universal SME product: a business that cannot maintain a £10,000 average
      balance faces a £25 monthly fee, and the proposition is explicitly a poor fit
      for startups or sole traders. Finally, one of the chapter's net-new discovery
      hits produced only generic marketplace boilerplate rather than a readable
      Allica-specific case study, underlining how thin named end-customer deployment
      proof remains in the assigned pool.
    claimRefs: [CU013, CU014, CU015]
callouts:
  - calloutType: strength
    title: Recommendation evidence is unusually visible
    body: >-
      Compared with many private fintechs, Allica exposes unusually strong public
      recommendation signals through NPS, Trustpilot, Smart Money People, and a
      2026 "most recommended" claim, even if those signals stop short of full
      retention disclosure.
    claimRefs: [CU007, CU008, CU009]
  - calloutType: risk
    title: Customer durability is still more asserted than disclosed
    body: >-
      The public record supports traction and segment fit, but it still does not
      disclose customer concentration, renewal behaviour, churn, or cohort
      retention, and it offers limited readable named-customer proof in the
      assigned evidence pack.
    claimRefs: [CU013, CU014, CU015]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Established SMEs (5-250 staff)
        - Owner-manager or CFO buys; finance team uses; SME pays
        - Primary business current account, savings, lending
        - Core declared target segment across annual report and partner materials
        - Main addressable segment and funding base
        - No public split by industry, geography, or size band within the segment
      - - Cash-rich established SMEs
        - Finance lead buys; treasury/accounting users; SME pays
        - Current account plus savings pot and fee-waiver economics
        - Product is strongest when balances stay above £10k and especially above £40k
        - Supports deposits and cross-sell into lending
        - Low-balance customers face weaker economics and higher risk of churn
      - - Commercial finance brokers
        - Broker refers; Allica relationship/lending teams serve
        - Loan origination and customer acquisition
        - Annual report calls brokers the largest lending channel
        - Important acquisition channel for lending growth
        - Take-rate and concentration by broker are undisclosed
      - - Accountancy partners
        - Accountant influences; SME decides/pays
        - Banking advice, referrals, practical tools, relationship access
        - Annual report says focus expanded during 2025
        - Extends reach into the established-SME base
        - Revenue contribution and conversion data are undisclosed
    notes: Segment rows synthesize public target-customer statements and partner-channel disclosures; undisclosed sub-segment splits remain blank by design.
    claimRefs: [CU001, CU002, CU003, CU012, CU013]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Business Rewards Account launch
        - External launch to established businesses
        - "2023"
        - ClearBank case study
        - Medium
        - Confirms current-account expansion beyond savings/lending-only relationship
        - Launch cohort size at go-live not disclosed
      - - Current-account customers
        - More than 2,000 established SME customers in less than a year
        - By less than one year after 2023 launch
        - ClearBank case study
        - Medium
        - Shows early adoption of the current account
        - No active-user or primary-account denominator
      - - Primary-bank usage
        - Enormous growth in BRA holders and those using it as their main bank account
        - "2025"
        - Annual report
        - Medium
        - Suggests deepening relationship, not just account opening
        - No disclosed count or share
      - - Customer recommendation
        - Customer NPS +76 versus +67 in November 2024
        - November 2025
        - Annual report / RFI Global survey cited by Allica
        - High
        - Strong satisfaction signal among surveyed customers
        - Sample size and response mix undisclosed
      - - Public review volume
        - Trustpilot 4.6/5 from 1,700+ reviews; Smart Money People 4.89/5 from 2,400+ reviews
        - End-2025
        - Annual report
        - Medium
        - Recommendation signal visible beyond owned channels
        - Reviewers are self-selected, not full customer base
      - - Recommended-bank claim
        - Most recommended business bank based on feedback from over 4,000 businesses
        - 15 Apr 2026
        - Allica press release listing
        - Medium
        - Reinforces recommendation-led positioning
        - Survey design and overlap with prior NPS cohorts undisclosed
      - - Segment penetration
        - Exceeded 6% penetration; targeting 10% by 2028
        - 2026 interview
        - Global City interview
        - Medium
        - Implies headroom remains within target niche
        - Penetration basis and underlying customer count undisclosed
    notes: Values preserve the exact public framing and dates; missing denominators mark where Allica discloses direction or ratios without the base population.
    claimRefs: [CU003, CU004, CU005, CU007, CU008, CU009, CU011]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof surface
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Business Rewards Account customers
        - Established UK SMEs
        - Live current-account usage after 2023 launch
        - Production
        - More than 2,000 customers in less than a year
        - No named end-customer logos or case studies in assigned pack
      - - Surveyed business customers
        - Existing Allica customers in RFI Global survey
        - Recommendation / satisfaction measurement
        - Production
        - Customer NPS +76 in November 2025
        - Sample size and cohort composition undisclosed
      - - Public reviewers
        - Self-selected customers on Trustpilot and Smart Money People
        - Post-sale experience feedback
        - Production
        - 1,700+ Trustpilot reviews at 4.6/5 and 2,400+ Smart Money People reviews at 4.89/5
        - Self-selection bias; does not prove renewal or revenue durability
    notes: This is a partial attribution table because the assigned evidence pack contains cohort-level proof and public reviews, but not readable named end-customer deployments.
    enumerationScope:
      coverage: partial
      basis: Publicly accessible proof surfaces in the assigned pool as of the 2026-10-16 run; named end-customer deployment evidence is not exhaustively disclosed.
    claimRefs: [CU004, CU007, CU008, CU009, CU013, CU015]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Allica's customer loop starts with a narrow established-SME target,
      deepens via the Business Rewards Account, and expands through deposits,
      lending, and partner-mediated distribution.
    data:
      items:
        - label: Targeting
          text: Established UK SMEs with 5-250 staff and existing trading history.
          touchpoints:
            - Relationship-led proposition
            - Not designed for startups or sole traders
        - label: Onboarding
          text: 2023 current-account launch created a fuller operating-account entry point.
          touchpoints:
            - Dedicated relationship manager
            - Cashback / no-fee-above-threshold economics
        - label: Daily banking
          text: Customers use the Business Rewards Account for payments, deposits, and savings.
          touchpoints:
            - Current account
            - Savings pot
            - Finance-team workflow
        - label: Expansion
          text: Full banking relationship creates touchpoints that open lending and overdraft opportunities.
          touchpoints:
            - Lower-cost funding for Allica
            - Cross-sell into lending
        - label: Channel reinforcement
          text: Brokers, accountants, and infrastructure partners reinforce acquisition and service delivery.
          touchpoints:
            - Largest lending channel is brokers
            - Growing accountant partner focus
            - 300+ third parties in operating model
        - label: Recommendation loop
          text: Public reviews and surveys feed recommendation-led growth claims.
          touchpoints:
            - NPS +76
            - Trustpilot and Smart Money People review volume
            - '"Most recommended" claim in 2026'
    claimRefs: [CU001, CU002, CU003, CU007, CU011, CU012, CU016]
