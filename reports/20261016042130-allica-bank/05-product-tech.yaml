      - ["Commercial mortgages and asset finance", "Established SMEs with property or equipment needs", "Scaled and long-standing core lending pillars", "Pairs specialist lending with relationship-led underwriting rather than purely app-led scoring", "No public loss-rate or workflow-turnaround cut by product line in assigned evidence"]
      - ["Growth / bridging / invoice-finance extensions", "SMEs needing working-capital or short-term structured finance", "Live but still expanding through launches and acquisitions", "Expands Allica beyond term lending into broader SME funding workflows", "Module-level integration, pricing, and eligibility detail are incomplete in the assigned pool"]
      - ["Finance-operations features and accountant integrations", "Finance team / accountant", "Actively expanding through 2025-2026 feature work", "QuickBooks connectivity plus Sage/Xero references point to a finance-ops layer, not just account storage", "No public API catalog or feature-by-feature coverage matrix in the assigned evidence"]
    notes: >-
      Rows summarize only modules explicitly evidenced in the assigned 2025-2026
      source pool; missing pricing, eligibility, and adoption detail should be
      treated as diligence gaps rather than inferred coverage.
    claimRefs: ["CE002", "CE003", "CE004", "CE005", "CE011", "CE015"]
  - id: "TE002"
    title: "Workflow / use-case table"
    columns:
      - "User job"
      - "Current workflow"
      - "Company solution"
      - "Measurable benefit"
      - "Limitation"
    rows:
      - ["Run day-to-day business banking", "Hold operating cash, make payments, and keep surplus funds productive", "Business Rewards Account with integrated savings pots and card-based benefits", "More than doubled BRA holders in 2025; product unifies transactional banking and savings under one licence", "Economics depend on maintaining the right balance profile; fit is weaker for low-balance or volatile-cash businesses"]
      - ["Keep accounting records synchronized", "Finance teams and accountants reconcile bank activity into accounting software", "Direct QuickBooks connectivity and cited Sage/Xero integrations", "Automatic transaction synchronization and real-time visibility reduce manual reconciliation effort", "Assigned evidence does not show a public API list, supported objects, or error-rate history by integration"]
      - ["Source complex credit for growth or assets", "Borrow against property, equipment, or other SME financing needs", "Relationship-led underwriting on commercial mortgages, asset finance, and adjacent lending products", "Relationship managers and proprietary loan tooling support more complex SME cases than app-only flows", "Public evidence still lacks product-by-product approval times, decline reasons, and loss-performance data"]
      - ["Control employee spend and finance operations", "Issue cards, manage expenses, and coordinate finance tasks", "Expense cards, bill pay, bulk payments APIs, and cashflow tooling referenced in 2025-2026 materials", "Extends Allica from account holding into finance-operations workflow", "Public evidence does not show penetration, usage frequency, or module-level roadmap sequencing"]
    notes: >-
      Benefits stay at the evidence level: publicly stated adoption figures,
      named integrations, and feature launches. Where the assigned pool does not
      disclose implementation detail, the cell records the limitation explicitly.
    claimRefs: ["CE003", "CE004", "CE005", "CE006", "CE010", "CE011", "CE014"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / component"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Customer channels and service layer", "Online accounts, web/mobile access, onboarding, and relationship-manager support", "Depends on frontline coordination between digital channels and human service teams", "Public evidence confirms the model, but not product-specific service levels or staffing ratios by segment"]
      - ["Finance-operations and integration layer", "Accounting sync, cards, payments, and adjacent finance-ops features", "Depends on partner integrations such as QuickBooks and on Allica's own feature-delivery cadence", "No public integration coverage matrix, API documentation, or incident disclosure in the assigned pool"]
      - ["Lending decisioning layer", "Proprietary loan software, Loan Processing Hub, and AI-assisted underwriting tasks", "Depends on in-house engineering/data teams and access to proprietary internal data", "Public claims of automation are credible but externally unverifiable at model-governance or error-rate level"]
      - ["Control and infrastructure layer", "Information security, data reconciliation, fraud/AML controls, and broader supplier oversight", "Depends on specialist internal teams plus large UK/global technology providers, with some technology services in India", "Vendor concentration, certification coverage, and product-level resilience evidence remain under-disclosed"]
    notes: >-
      This is a public-evidence operating abstraction, not an official systems
      diagram. Named core vendors, system boundaries, certification scope, and
      product-specific resilience metrics are not disclosed in the assigned pool.
    claimRefs: ["CE007", "CE008", "CE009", "CE010", "CE012", "CE013", "CE016"]
