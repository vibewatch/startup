callouts:
  - calloutType: "strength"
    title: "Differentiation comes from software plus service, not software alone"
    body: >-
      The strongest product signal is the combination of digital account rails,
      accountant integrations, and proprietary lending tooling with named
      relationship support. That is a fuller workflow proposition than a
      standalone SME app or a single lending product.
    claimRefs: ["CE003", "CE005", "CE006", "CE007", "CE011"]
  - calloutType: "risk"
    title: "Public resilience evidence is still thinner than the product story"
    body: >-
      Allica discloses release velocity, uptime, and control intent, but the
      assigned evidence still does not expose named core vendors, product-level
      incident history, or external security assurance artifacts. That limits
      independent underwriting of operational resilience.
    claimRefs: ["CE008", "CE012", "CE013", "CE016"]
