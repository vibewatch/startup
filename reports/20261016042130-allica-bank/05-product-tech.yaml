company:
  name: "Allica Bank"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Allica Bank's product stack is built around the Business Rewards Account as
    the daily operating hub for established UK SMEs, then expanded through
    savings, lending, and accountant-facing integrations. Public evidence
    supports a real in-house software and data capability with measurable
    release cadence and reliability, but detailed vendor architecture,
    integration coverage, and external security assurance remain under-disclosed.
sections:
  - id: "hybrid-product-suite"
    title: "Hybrid product suite for established-SME workflows"
    body: >-
      The customer workflow Allica is trying to own is broader than a simple SME
      current account. Public and company-issued evidence consistently frames the
      bank around established businesses rather than startups or sole traders,
      with the Business Rewards Account acting as the entry point for payments,
      savings, and lending relationships. That matters because Allica's product
      definition is not "app-led banking" alone: it packages digital account
      access, savings pots, accountant-facing integrations, and named
      relationship support into one relationship. The result is a product map
      that looks more like a full-service SME operating platform than a single
      point solution, but public evidence still leaves some underwriting rules,
      onboarding SLAs, and module-level eligibility details opaque.
    claimRefs: ["CE001", "CE002", "CE003", "CE004", "CE005", "CE006"]
    tableRefs: ["TE001", "TE002"]
  - id: "proprietary-delivery-model"
    title: "Proprietary delivery model, integrations, and engineering maturity"
    body: >-
      Allica's clearest technology claim is that it moved core lending software
      and product delivery in-house in order to serve a segment that combines
      higher workflow complexity with greater volume than many SME lenders can
      process efficiently. The 2025 annual report gives stronger maturity
      signals than the marketing surfaces: more than 240 product and engineering
      colleagues, more than 3,700 releases during the year, uptime above 99.5%,
      cross-functional squads, and explicit investment in AI-assisted
      engineering and underwriting workflows. The public integration evidence is
      also concrete rather than generic, with accounting links spanning Sage,
      Xero, and QuickBooks and newer finance-operations features such as expense
      cards, bill pay, and bulk payments APIs. That supports a credible software
      platform story, although the bank still does not publicly expose a full
      systems map or vendor-by-vendor architecture boundary.
    claimRefs: ["CE007", "CE008", "CE009", "CE010", "CE011", "CE015"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "controls-dependencies-and-risks"
    title: "Controls, dependencies, and remaining product risks"
    body: >-
      The trust and control layer is visible in policy terms but thinner in
      independently auditable technical detail. Allica publicly describes
      anti-fraud, anti-money-laundering, whistleblowing, threat-detection, and
      penetration-testing controls, which is the minimum expected posture for a
      regulated digital bank. The bigger diligence risk is what remains
      management-shaped: the assigned evidence does not name core banking
      vendors, expose product-specific incident history, or publish external
      security certifications in a way that would let an underwriter stress-test
      operational resilience. Product-fit risk also remains real at the front
      door, because the account economics and onboarding assumptions appear much
      better suited to cash-rich established SMEs than to thin-balance or
      startup users.
    claimRefs: ["CE012", "CE013", "CE014", "CE016"]
