callouts:
  - calloutType: insight
    title: Allica has crossed from challenger narrative into scaled-bank execution
    body: >-
      The assigned 2026 sources combine a unicorn-priced Series D with FY2025 profitability, multi-billion-pound deposits,
      and explicit international-expansion planning, which is a materially different posture from a pre-product fintech.
    claimRefs: [CO005, CO006, CO007, CO009, CO015]
  - calloutType: risk
    title: Public governance disclosure trails the operating scale
    body: >-
      Public evidence identifies named investors and the CEO, but not a current board roster, ownership percentages, or
      full shareholder-rights structure; third-party review also suggests the product is a weaker fit for lower-cash SMEs.
    claimRefs: [CO004, CO011, CO016]
