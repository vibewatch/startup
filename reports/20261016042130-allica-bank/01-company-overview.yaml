company:
  name: Allica Bank
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Allica Bank is a UK SME-focused digital bank that public company materials position at Series D / unicorn stage after a
    $155 million round in February 2026. Assigned evidence also shows FY2025 revenue of £371.3 million, customer deposits
    of £5.7 billion, and continued expansion into European licensing, but public visibility on board composition, cumulative
    lifetime capital raised, and exact current headcount remains limited.
sections:
  - id: identity-licence-and-model
    title: Identity, licence and operating model
    body: >-
      Allica presents itself as a digital bank built for established UK SMEs rather than startups or sole traders, with most
      public descriptions centering on businesses in the 5-250 employee band. The assigned sources support a model that
      combines regulated banking infrastructure, savings-led primary banking, and named relationship-manager coverage rather
      than an app-only self-serve proposition. Official legal text confirms the regulated entity and London registered office,
      while third-party product review and Allica's own deposit-protection explainer reinforce that the proposition is aimed at
      operating businesses that keep meaningful balances on deposit. What remains less transparent in the assigned pool is the
      exact current headcount, full office footprint, and how the company itself distinguishes legal-entity age from the
      operating-bank launch timeline.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-governance-and-stakeholders
    title: Leadership visibility, governance signals, and stakeholder concentration
    body: >-
      Richard Davies is the clearest named operating leader in the assigned evidence, appearing both in historical summary
      coverage and in current fundraising and results releases. Governance visibility beyond the CEO is materially thinner:
      the pool identifies named Series D backers and repeat investors, but it does not surface a current board roster,
      ownership percentages, liquidation preferences, or whether specific investors hold board or observer rights. That means
      the chapter can establish who is visibly involved in leadership and capital formation, but not the full control map.
      This matters because Allica is now large enough that board composition, shareholder rights, and capital-allocation
      discipline directly affect expansion, AI investment, and credit-cycle risk management.
    claimRefs: [CO004, CO005, CO008, CO009, CO011, CO012]
    tableRefs: [TO002, TO003]
  - id: scale-milestones-and-watchpoints
    title: Scale, milestones, and current watchpoints
    body: >-
      The most recent company-issued evidence shows Allica operating at meaningful scale: FY2025 gross revenue reached
      £371.3 million, total lending reached £3.7 billion, and customer deposits reached £5.7 billion. Management also claims
      more than 30,000 established SMB customers, over 6% penetration of the target segment, and an ambition to reach 10%
      by 2028. The milestone record assembled from Wikipedia and Allica's own press hub shows a steady sequence from licence
      acquisition to current-account launch, major funding rounds, and 2026 international-expansion signalling through a
      Swedish banking-licence application. The main operating watchpoint in assigned third-party review is customer fit:
      Allica's economics work better for cash-rich SMEs than for customers whose balances often fall below the fee-free
      threshold.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
