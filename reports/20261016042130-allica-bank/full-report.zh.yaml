          modules:
            - 透支与返现经济
            - Apple Pay / Google Pay
            - 网上银行与网页门户
          outputs:
            - 支付与现金管理
            - 主要运营账户采用
        - label: 会计师与财务运营扩展
          items:
            - QuickBooks 集成
            - 费用管理功能
          modules:
            - QuickBooks 交易同步
            - 费用卡
            - 批量支付 API
            - 账单支付与现金流工具
          outputs:
            - 会计同步
