  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争定位：Allica 销售的是传统银行与挑战者之间的空白
        blocks:
          - type: paragraph
            body: >-
              指定证据把 Allica 描绘成英国成熟中小企业银行内部的细分切入口，而非泛化的 SMB 银行。2026 年 2 月的独立融资报道称，Allica 面向约 5–250 名员工的成熟
              SMB，解决那些“已经超出挑战者产品能力”却仍未被传统银行充分服务的企业需求。Allica 自己的 2025
              年报则更明确地把产品对准传统高街银行在融资获取、客户关系覆盖、日常定价和服务割裂上的痛点。因此，竞争对手不只是某一份具名同业名单，还包括传统中小企业银行、应用驱动的挑战者账户、争夺信贷关系的专业放贷机构，以及把运营账户、外汇或资金管理工具和独立融资产品拼在一起的多供应商组合。Allica
              也在扩大活期、储蓄、商业抵押、资产融资、过桥、成长融资和发票融资产品，压缩客户需要交给专业机构的业务空间。
