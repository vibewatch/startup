      - CI011
      - CI012
      - CI013
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据指向一个分层模型：关系型服务、活期账户金融运营、自有贷款软件和受监管控制职能共同构成这一模型。
