  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价机制
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，这仍是以利差收入为核心的银行模式，而非 SaaS 式订阅收入。2025 年 Allica 总收入达到 £371.3m，净利息收入为 £159.0m；贷款和预付款增至 £3.742bn，客户存款达到
              £5.720bn。年报把 Business Rewards Account 定义为产品核心，同时带来贷款机会和资金来源。BRA 余额达到 £1.791bn，占存款 31%；中小企业存款占总资金基础的
              71%。这说明活期账户同时支持分销和资金质量，但公开证据没有量化账户层面的贡献利润率。

              公开定价应视为价目表，而不是实际变现。2026 年 8 月 4 日核查的独立评测称，账户无月费，标准存款利率为 2.83%，最佳可持续利率为
              3.33%，但附带最低余额和活跃度条件。评测提醒，宣传利率可能叠加多项加成，应按客户能够持续获得的利率建模。这些条款或许能吸引经营性余额，但无法说明 Allica
              的加权资金成本、实际费用收入、激励成本或客户群贡献利润率。
