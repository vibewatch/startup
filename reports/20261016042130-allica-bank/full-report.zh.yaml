      - number: '4.3'
        title: 投资判断与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              从公开信息看，Allica 已搭建出财务上可信的中小企业银行引擎：贷款仍是盈利核心，存款正转向经营性账户余额，活期账户似乎提升了客户黏性，而不只是增加一个低价值支付功能。经纪人和直接渠道合计新增有机贷款
              £1.273bn，也表明银行正摆脱纯中介模式、分散获客来源。这些都支持收入质量和利润率韧性。

              阻碍在于颗粒度不足。公开披露没有给出渠道 CAC、回本期、审批率、客户群留存、产品收益率、客户集中度，也没有把 D 轮资金转化为风险加权资产容量的资本模型。评测证据还指出，Allica
              在结构上不太适合现金处理型企业，独立服务基准也弱于接受 CMA 调查的传统银行。因此，投资判断对增长势头和资金结构持正面看法，但在缺少管理层数据室访问的情况下，标准化单位经济性和下行韧性仍无法完整判断。
            claimRefs:
              - CI004
              - CI005
