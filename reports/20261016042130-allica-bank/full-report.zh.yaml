  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Allica 将核心市场限定为英国成熟中小企业，而不是整个中小企业市场。公司材料和独立摘要反复把边界定义为拥有 5–250
              名员工、经营历史和已记录财务表现的企业。这一定位排除了个体经营者、新成立企业及其他薄档案客户；应用驱动的挑战者可以低成本吸引这些客户，但他们不符合 Allica
              的经济模型或授信取向。现有替代品是提供活期账户和抵押贷款的传统高街银行；最接近的数字替代品则是 Starling、Tide 或 Zempler 等面向小微企业、流程更简单的账户。Allica
              的核心主张是：处于中间地带的企业需要完整银行关系——活期账户、储蓄、透支、抵押贷款、资产融资、成长融资和过桥贷款——而不是零散产品。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
