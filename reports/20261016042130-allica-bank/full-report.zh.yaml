            - 银行和贷款沟通的单一联系人
            - 人工反馈回流产品迭代
          outputs:
            - 数字加人工的混合服务模式
            - 建立完整银行关系的入口
        - label: 日常银行与财务运营
          items:
            - Business Rewards Account
