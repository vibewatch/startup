      - number: '3.3'
        title: 定价优势具有选择性，多类买方仍可争夺
        blocks:
          - type: paragraph
            body: >-
              Allica 的定价和产品组合只对特定买方画像有吸引力。BusinessExpert 独立评测称，该产品最适合在平台上保有较多现金储备的成熟中小企业，因为余额超过 GBP40,000 的储蓄账户可得 2.83%
              AER，促销加成可把最高档推至 4.08%。同一来源也给出指定资料中最清晰的反向证据：平均余额低于 GBP10,000 时每月收取 GBP25，除非客户同时持有有效 Allica
              贷款或透支；不支持现金存款；跨境转账通过 Wise 完成，而非原生多币种资金管理产品；需要内置开票或以手机为中心流程的买方可能更适合 Tide 或 Starling。这并没有抹去 Allica
              对合适细分客群的优势，只是把优势边界收窄。低余额、应用优先或国际业务活跃的中小企业仍可多平台使用或选择替代品，而无需把 Allica 设为主要运营账户。
