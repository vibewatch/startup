      - number: '4.2'
        title: 成本结构、信贷成本与资本
        blocks:
          - type: paragraph
            body: >-
              盈利是真实的，但伴随着持续投入。2025 年税前基础利润升至 £43.7m，运营费用升至 £108.4m。年报将费用增长归因于销售、合作、技术、数据、产品和营销投入，目的是支持直接获客放贷和 Business
              Rewards Account 扩张。这对运营杠杆潜力是积极信号，但公开利润还不能被视为完全成熟的盈利基数；管理层仍在为增长提前投入。

              信贷和资本指标显示银行仍然稳健，但并不能证明每项扩张计划都能自我融资。预期信贷损失拨备为 £42.6m，覆盖率 1.1%；2025 年末 CET1 为 13.4%，总资本为 16.8%，随着资产扩大，两者都低于
              2024 年水平。因此 Allica 2026 年 2 月 25 日的 D 轮具有战略意义：管理层称资金将支持英国增长、自有技术投资和国际扩张。年末现金及现金等价物为
              £1.287bn，但这不等同于受监管银行的创业公司现金跑道。公开证据仍未披露 D 轮后的监管比率、内部资本触发线，或新产品与新地域投资消耗资本的具体速度。
            claimRefs:
              - CI002
              - CI011
              - CI012
              - CI013
              - CI014
