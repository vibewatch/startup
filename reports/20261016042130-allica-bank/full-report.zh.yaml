  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据显示，Allica 将中小企业运营账户余额和贷款发放量转化为利差收入，再转化为利润；活期账户采用率提升了融资结构。
    data:
      nodes:
        - id: customer-base
          label: 成熟型中小企业客户基础
          value: 5-250 employee target segment
          detail: 聚焦成熟型中小企业的关系型银行服务，而非初创企业或个体经营者。
        - id: current-account-funding
          label: 活期账户与存款
          value: £5.720bn deposits; £1.791bn BRA balances
          detail: 融资基础转向中小企业运营账户余额，逐步减少个人存款依赖。
        - id: origination
          label: 贷款发放引擎
          value: £1.273bn new organic lending
          detail: 多种贷款产品通过经纪商和直销渠道发放。
        - id: income
          label: 利息与费用收入
          value: £159.0m net interest income; £2.5m loan fees; £5.0m card income
          detail: 利差收入仍是主要收入引擎，费用收入仍居次位。
        - id: operating-profit
          label: 税前经营结果
          value: £108.4m opex; £42.6m ECL; £43.7m underlying PBT
          detail: 公司已经盈利，但银行仍在为人员、产品和分销扩张投入资金。
        - id: capital
          label: 资本补强
          value: CET1 13.4%; total capital 16.8%; Series D announced Feb 2026
          detail: 公开证据显示资本充足，并有新的股权 / AT1 资金支持进一步增长。
      edges:
        - from: customer-base
          to: current-account-funding
          label: 运营账户余额与账户采用
        - from: customer-base
          to: origination
          label: 借款需求
        - from: current-account-funding
          to: income
          label: 融资基础与交易活动
        - from: origination
          to: income
          label: 利差收入与贷款费用
        - from: income
          to: operating-profit
          label: 扣除服务、运营费用和信贷成本
        - from: operating-profit
          to: capital
          label: 留存收益加外部资本
    approximationNotes: 公开数据是时点值或年度汇总，不是客户群层面的单位经济模型。
