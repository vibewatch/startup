  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Allica 的客户循环从聚焦成熟型中小企业开始，通过 Business Rewards Account 加深关系，再借助存款、贷款和合作伙伴分销扩展。
    data:
      items:
        - label: 目标客户
          text: Established UK SMEs with 5-250 staff and existing trading history.
          touchpoints:
