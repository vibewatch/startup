      - number: '2.2'
        title: 规模测算视角与公开增长信号
        blocks:
          - type: paragraph
            body: >-
              公开证据支持市场问题真实存在，但只能通过分层视角测算，无法拼出干净的自下而上 TAM/SAM/SOM。private.law 对 Allica 委托 Oxford Economics
              完成的研究作了摘要：成熟中小企业占英国私营部门就业的 35% 和营业额的 37%；同一来源还称，25 年间累计形成了 £65bn 的中小企业贷款缺口。需求侧上，Allica
              认为中小企业透支业务已出现结构性收缩：余额从 £18bn 降至 £2.7bn，占中小企业贷款的比例自 2000 年以来从 31% 降至 5%。公司报告的增长表明这正转化为采用：管理层称 Business
              Rewards Account 活跃客户超过 14,000 个，成熟中小企业渗透率超过 6%，未来几年目标为 10%+。这些信号有价值，但仍依赖未公开的分母和公司定义的细分逻辑。
