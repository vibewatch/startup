      - number: '8.3'
        title: 情景框架与入场纪律
        blocks:
          - type: paragraph
            body: >-
              基于这组证据，最稳妥的估值方式是围绕最近披露的融资轮次做方向性判断，而不是假装精确地给出目标倍数。乐观情景要求 Allica
              把强劲的活期账户和贷款增长转化为持久份额提升，同时保持盈利，并靠利润而非反复稀释补充资本。基准情景是增长保持健康、信贷表现温和，公司估值维持在最近披露水平附近或略高。悲观情景则是信贷损失上升、技术和国际投入跑在回报之前，或客户增长比
              headline 客户数显示的更窄、更依赖利率，从而出现平轮或下轮。因此，入场纪律应关注新投资人是否获得了比当前公开证据显示的更好价格发现或更强下行保护。
            claimRefs:
