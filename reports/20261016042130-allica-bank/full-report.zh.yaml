      - number: '2.3'
        title: 买方、采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              买方通常是决定是否把 Allica 作为主要运营账户和贷款伙伴的企业主、CFO
              或财务负责人；用户可能是财务团队、会计师或由经纪人带来的借款人，付款方则是企业本身，通过余额、费用和借款经济性付费。公开证据中最强的采用驱动因素是关系银行、奖励型存款和打包信贷：指定客户经理、返现、储蓄激励和更完整的抵押贷款产品组合共同强化账户主导地位，也帮助
              Allica 用成本更低的经营性余额为贷款提供资金。同一证据也划出了上限：无法维持 £10,000 平均余额、需要现金存款或经常进行多币种操作的企业匹配度更低，因此 Allica 当前的 SAM
              比“中小企业银行”这一宽泛标签暗示的范围更窄。申请瑞典牌照带来欧洲邻近市场机会，但目前仍只是期权价值，不是市场验证。
