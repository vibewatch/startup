  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 论点
      - 证据
      - 哪些信息会改变判断
    rows:
      - - 正方论点：细分市场契合度
        - 成熟型中小企业仍是 Allica 所称的 5–250 人细分市场；独立来源和官方来源都反复强调其关系型服务与自有技术。
        - 若独立证据显示，这一细分优势不只是营销话术，而是能持续转化为跨产品份额增长，判断才会改善。
      - - 正方论点：经营证明
        - FY2025 总收入达到 £371.3m，基础税前利润达到 £43.7m，贷款规模达到 £3.7bn，存款达到 £5.7bn。
        - 若 2026 年数据表明这些指标持续复合增长，且资本没有明显承压，判断才会改善。
      - - 反方论点：客户契合度窄于品牌声量
        - 独立产品评测称，该账户适合现金充裕的成熟型中小企业；但对余额波动较大的用户而言，费用和收益率的断崖会降低吸引力。
        - 若管理层能证明客户增长覆盖各类使用群体，而不是集中在不受费用影响或高余额客户上，判断才会改善。
      - - 反方论点：价格发现仍不透明
        - 已分配的公开证据没有提供清晰的可比公司倍数、二级市场估值或 Series D 后优先权细节。
        - 若管理层披露融资轮次机制、投资者保护条款，以及能支持同一入场价的可比公司集合，判断才会改善。
    notes: 每一行都把可投资论点与足以推动建议变化的增量证据配对。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV007
      - CV011
      - CV013
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 收入、贷款和存款增速高于近期水平；盈利能力保持；Series D 资金推动份额增长和有纪律的扩张。
        - 上一轮披露的 $1.2bn 估值之上进行升轮融资变得可信，因为规模证明和资本支持同步积累。
        - 信贷损失保持温和，扩张纪律不变，产品采用从最高余额用户扩展出去。
        - 需要比当前公开信息更多的独立证据。
      - - 基准
        - 增长保持健康，盈利持续，且不出现重大信贷或监管意外。
        - 以最近披露轮次为基准持平或小幅上升，是当前最有公开证据支撑的判断。
        - 缺少可比公司基准、优先权条款和完整周期信贷数据，限制了上行空间。
        - 与已分配证据集最为匹配。
      - - 悲观
        - 信贷成熟度恶化、资本重建滞后，或国际化 / 技术投入未能带来可见回报。
        - 若投资者重新评估执行和资产负债表风险，低于最近披露估值的持平轮或下行轮融资将变得可信。
        - 存款 / 客户增长可能比标题叙事所暗示的更窄，或对价格更敏感。
        - 如果尽调削弱对资本或客户群质量的信心，这一情景就很重要。
    notes: 情景区间仅相对于最近披露估值提供方向性判断，因为这组证据缺少清晰的可比公司集合或二级市场价格证据。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV008
      - CV009
      - CV013
      - CV015
      - CV016
