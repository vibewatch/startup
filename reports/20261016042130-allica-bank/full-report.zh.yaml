      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              建议跟踪而非回避，因为业务已经展示出足以吸引机构关注的规模、盈利和客户证明；建议跟踪而非买入，是因为缺失的尽调恰好决定私营银行投资结果：股权表机制、优先权负担和信贷周期韧性。在评估新一轮入场前，投资人应索取 D
              轮后的股份类别结构、清算优先权、持股稀释、分期违约与损失数据、行业集中度，以及关系驱动的活期账户是否转化为持久主银行关系而非利率驱动存款流入的证据。如果答案强，披露估值仍可能成立；如果答案弱，同一个独角兽标签可能掩盖不对称下行风险。
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 工作建议：跟踪，不要追逐独角兽标签
            body: Allica 已经像一家有真实盈利的真实银行，但指定公开证据仍无法证明新投资人在当前披露价格下能获得足够估值保护或上行空间。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV014
          - type: callout
            title: 主要阻碍是估值机制，而非产品市场虚构
            body: 核心业务模型看起来可信；缺少的是轮次机制、优先股堆叠和完整周期信贷证据，它们决定一个看似公允的 headline 价格是否构成有吸引力的入场点。
            calloutType: risk
            claimRefs:
              - CV008
