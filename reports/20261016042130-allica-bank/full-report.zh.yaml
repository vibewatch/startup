      - number: '1.3'
        title: 规模、里程碑与当前观察点
        blocks:
          - type: paragraph
            body: >-
              公司最近发布的证据显示，Allica 已达到有意义的运营规模：FY2025 总收入为 £371.3 million，总贷款为 £3.7 billion，客户存款为 £5.7 billion。管理层还称已有超过
              30,000 家成熟 SMB 客户，在目标细分市场的渗透率超过 6%，并希望到 2028 年达到 10%。根据 Wikipedia 和 Allica
              自有新闻中心整理的里程碑记录显示，公司从取得牌照到推出活期账户，再到完成多轮大型融资，随后通过申请瑞典银行牌照释放 2026 年国际扩张信号，路径较为连续。指定第三方评测的主要运营观察点是客户匹配度：Allica
              的经济模型更适合现金充裕的中小企业，不太适合余额经常低于免收费门槛的客户。
