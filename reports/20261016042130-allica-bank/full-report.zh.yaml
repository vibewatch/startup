      - number: '3.2'
        title: 能力与分销构成主要护城河，也决定竞争方式
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Allica 在买方同时看重产品广度和关系服务强度时差异化最明显。年报称其是唯一完全面向成熟企业打造的数字银行，并把这一定位落到 Business Rewards
              Account、专业信贷产品和自有技术栈组成的完整银行关系上。文件还称 Allica 在 2025 年发放了 GBP1.3 billion
              新贷款，是英国经纪人分销贷款市场的领导者，直接客户流量也在增加。竞争因此不只是应用对网点；引荐方、经纪人和专业债务顾问同样会影响谁赢得贷款关系。信任和监管优势并非全面领先：账户和储蓄业务受完整英国银行监管，但部分贷款及过桥产品明确属于不受监管产品。Allica
              因而占据相对稳固的中间位置，却仍给专业机构或软件驱动的挑战者留下赢得单点需求的空间。
            claimRefs:
