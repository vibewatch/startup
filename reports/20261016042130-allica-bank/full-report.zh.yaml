  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 经营证明和细分市场契合度支持继续观察当前估值，但资本和价格发现缺口阻止给出买入建议。
    data:
      nodes:
        - id: niche
          label: 服务不足的成熟型中小企业细分市场
          value: 5–250 employee target with relationship-led banking
          tone: opportunity
        - id: scale
          label: 2025 年经营规模真实存在
          value: £371.3m revenue; £43.7m underlying PBT; £3.7bn loans
          tone: positive
        - id: momentum
          label: 2026 年融资与进展仍然积极
          value: $155m Series D; >14k BRA customers; >4,000-business recommendation signal
          tone: positive
        - id: fit-risk
          label: 客户契合度集中风险持续
          value: £25 fee below £10k average balance; 0.00% below £20k savings
          tone: risk
        - id: opacity
          label: 价格发现不完整
          value: No clean peer set, secondary marks, or public preference stack
          tone: risk
        - id: outcome
          label: 跟踪 / 公允 / 高剩余风险
          value: Monitor for better diligence access or better entry terms
          tone: neutral
      edges:
        - from: niche
          to: scale
          relationship: 聚焦定位支撑经济性
        - from: scale
          to: momentum
          relationship: 经营证明支撑融资叙事
        - from: momentum
          to: fit-risk
          relationship: 增长质量仍然重要
        - from: fit-risk
          to: opacity
          relationship: 契合度窄增加尽调负担
        - from: opacity
          to: outcome
          relationship: 缺少价格发现阻止给出买入结论
    approximationNotes: null
