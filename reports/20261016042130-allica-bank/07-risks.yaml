artifact: risks
slug: allica-bank
runDate: 2026-10-16
company:
  name: Allica Bank
chapter:
  number: 7
  title: Risks
  summary: >-
    Allica's best-evidenced risks are prudential/capital execution, portfolio
    seasoning, and concentration in external infrastructure and channel
    partners. Public materials show the bank is still growing quickly, but that
    growth is landing alongside lower capital and liquidity ratios, higher stage
    2/3 balances, and dependence on ClearBank, brokers, and service execution
    to keep customer trust.
sections:
  - id: regulatory-capital-risks
    title: Regulatory perimeter and balance-sheet risks
    body: >-
      Allica's regulated perimeter is real but uneven. Its app and About Us
      disclosures state that savings and current-account products sit under PRA
      and FCA supervision, while lending products and some affiliated finance
      entities remain outside regulated-product treatment. That matters because
      the public conduct burden appears lighter precisely where underwriting,
      collections, and fee outcomes can create SME dissatisfaction. At the same
      time, Allica is pressing publicly for higher SME deposit protection and
      warning that Basel 3.1 could raise funding friction for challengers. The
      risk is not that Allica lacks a licence; it is that growth, regulatory
      change, and conduct expectations can converge faster than capital,
      liquidity, and disclosure buffers expand.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR008, CR016]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operational-service-security
    title: Operational, servicing, and security risks
    body: >-
      The public record shows both mitigation effort and visible execution
      frictions. Allica's annual report frames information security, data,
      conduct, and operational resilience as principal risks, and says it runs
      daily liquidity monitoring plus ongoing threat detection and penetration
      testing. But customer-facing evidence is less clean: the app listing
      promises UK-based human support, while a Trustpilot review describes
      unanswered calls, missing search, limited standing-order edits, and no
      FreeAgent integration. One review does not prove systemic failure, but it
      does show that post-onboarding servicing quality and product tooling can
      become reputation and conduct risks if the bank scales faster than support
      operations and roadmap delivery.
    claimRefs: [CR009, CR010, CR011]
    tableRefs: [TR002]
  - id: dependency-and-scaling
    title: Partner, channel, and scaling dependencies
    body: >-
      Allica's current-account stack and lending distribution both rely on
      third-party ecosystems. ClearBank is described as the provider that
      builds, tests, maintains, and upgrades key scheme connectivity, while the
      annual report says commercial finance brokers are the bank's largest
      lending channel. Allica's own committee evidence also says credit bureaus,
      open banking, and accounting-software data are vital to credit
      assessment. Those dependencies accelerate go-to-market and underwriting,
      but they also create concentration, switching, and SLA exposure. The
      February 2026 Series D and stated international expansion intent raise the
      execution burden, because scaling a relationship-led bank across more
      products, partners, and geographies increases coordination risk.
    claimRefs: [CR012, CR013, CR014, CR015]
    tableRefs: [TR003]
  - id: mitigations-kill-criteria
    title: Mitigations, kill criteria, and diligence asks
    body: >-
      The mitigating case is that Allica remains licensed, liquid, and explicit
      about monitoring risk: it discloses Basel implementation work, daily
      liquidity metrics, cyber controls, and partner-enabled operating leverage.
      The residual case is that investors still lack public evidence on the
      exact complaint volume, outsourced-service SLAs, partner concentration,
      and full-cycle credit-loss performance that would show whether the model
      is merely scaling or starting to fray. Practical kill criteria are a
      further capital-ratio step-down without offsetting disclosures, continued
      stage 3 balance growth, repeated service/incident evidence, or any sign
      that ClearBank or broker dependency is becoming a bottleneck rather than a
      lever.
    claimRefs: [CR005, CR006, CR007, CR008, CR011, CR012, CR013, CR014, CR016]
