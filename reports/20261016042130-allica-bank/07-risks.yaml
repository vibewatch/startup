callouts:
  - calloutType: risk
    title: Capital and prudential execution are the thesis-break risk
    body: >-
      If Basel 3.1 implementation coincides with further capital-ratio decline
      or worsening stage 3 balances, the investment case shifts from manageable
      scaling risk to capital-constrained downside.
    claimRefs: [CR005, CR006, CR007, CR008]
  - calloutType: assumption
    title: Third-party concentration is still under-disclosed
    body: >-
      The public pack does not show ClearBank SLA protections, exact broker
      share, complaint volumes, or incident history, so private diligence on
      those items should decide whether current dependencies are leverage or
      fragility.
    claimRefs: [CR011, CR012, CR013, CR015]
