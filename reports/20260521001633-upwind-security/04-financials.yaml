- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR / revenue run-rate
    - null
    - low
    - Required to anchor valuation and payback math.
    - Request monthly ARR, GAAP revenue, and bookings bridge.
  - - Gross margin
    - null
    - low
    - Determines whether runtime scale translates into software-like economics.
    - Request cost-of-revenue detail split by cloud processing, support, and services.
  - - CAC / payback
    - Channel-assisted enterprise motion; no ratio disclosed
    - low
    - Payback depends on direct-sales cost, partner leverage, and deployment friction.
    - Request fully loaded CAC, payback, and partner-sourced CAC by segment.
  - - Sales cycle
    - Enterprise and deployment-sensitive
    - low
    - Runtime deployment friction can lengthen time-to-close and time-to-value.
    - Request median cycle from first meeting to production deployment.
  - - Customer ROI proxy
    - 98% fewer alerts and 60% fewer irrelevant CVEs in public examples
    - medium
    - Value realization can support expansion and renewal if borne out financially.
    - Request quantified savings case studies tied to contract value and renewal outcomes.
  - - Channel efficiency proxy
    - 100+ new partners; big accounts reportedly channel-sourced
    - medium
    - Channel can improve reach but may compress net revenue after commissions.
    - Request partner-sourced revenue mix, gross-to-net waterfall, and attach rate.
  - - Public-comp disclosure benchmark
    - Public security peers disclose audited 10-K line items; Upwind does not
    - medium
    - Shows the gap between headline growth and underwritable economics.
    - Request board pack reconciliation to public-company style KPI set.
  notes: Null entries are true disclosure gaps, not zero values. Proxy rows describe directionality only and should not be mistaken for company-reported unit economics.
