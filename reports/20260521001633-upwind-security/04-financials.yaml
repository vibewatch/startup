- id: cost-structure-capital-adequacy-and-disclosure-gaps
  title: Cost structure, capital adequacy, and disclosure gaps
  body: 'Capital adequacy is the clearest part of the financial story. Upwind moved from $180 million total disclosed funding after the December 2024 Series A to $430 million after the January 2026 Series B, and management explicitly tied the new capital to product, go-to-market, support, and global growth. Public hiring signals show why the fresh capital matters: the company described a jump from 150 to more than 300 employees over the prior year, while also expanding product scope toward data, AI, and code. Those moves imply continued heavy R&D, sales, enablement, and post-sales support expense. What public sources do not disclose is the operating baseline against which that expense should be judged. There is no public ending cash balance, monthly burn, gross margin, ARR bridge, customer concentration data, or retention cohort. Nor is there public evidence of debt or structured financing obligations. Compared with public security vendors that publish audited filings, Upwind remains a headline-growth
    story rather than an auditable financial model. The Series B therefore reduces near-term financing pressure, but it does not eliminate core diligence dependence on private financial evidence.'
