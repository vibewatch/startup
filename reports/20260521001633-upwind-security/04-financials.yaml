- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - ARR / GAAP revenue by module
    - Cannot test valuation against current scale or product mix.
    - Request monthly ARR, revenue recognition memo, and revenue by product / region.
  - - Gross margin / cost of revenue
    - Cannot judge whether runtime delivery economics can converge toward mature software margins.
    - Request cost-of-revenue bridge split by cloud costs, support, services, and third-party processing.
  - - CAC / payback / quota productivity
    - Cannot determine whether growth is efficient or subsidy-heavy.
    - Request CAC, payback, sales productivity, and channel-vs-direct sales metrics.
  - - NRR / GRR / churn / customer concentration
    - Cannot underwrite durability of recurring revenue or account concentration risk.
    - Request renewal cohorts, churn reasons, top-customer revenue share, and NRR / GRR tables.
  - - Cash balance / burn / runway
    - Cannot convert the 2026 raise into a usable solvency view.
    - Request monthly cash flow statement, burn forecast, and hiring plan.
  - - Pricing book / discount schedule / contract terms
    - Cannot assess realized price, discount discipline, or revenue quality.
    - Request current price book, discount approvals, standard order forms, and sample contracts.
  notes: Every row is a real diligence blocker rather than an editorial wish list. These are the missing inputs required to move from narrative conviction to underwritten economics.
