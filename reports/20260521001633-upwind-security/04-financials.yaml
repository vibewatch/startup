tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Unified platform subscription
    - Negotiated enterprise software contract sold through demo-led motion
    - Annual or multi-year contract
    - Publicly evident; price undisclosed
    - Potentially strong if embedded in runtime workflows, but contract terms are not public
    - Request average contract value, contract length, and share of revenue from base platform subscriptions.
  - - Module expansion / attach
    - API, AI, identity, posture, and runtime modules expand the land-and-expand opportunity
    - Per module or bundled upsell
    - Module breadth is public; realized attach rate is unknown
    - Upsell potential appears meaningful, but attach and discount behavior are not disclosed
    - Request module attach-rate data and module-level revenue contribution.
  - - Channel-influenced enterprise sales
    - ISVs, MSPs, VARs, and reseller relationships contribute to bookings
    - Partner-sourced contracts
    - Management says 100+ new partners and CRN says many big accounts came through channel
    - Helpful for reach, but reseller margin share and partner dependence are not public
    - Request partner-sourced pipeline, win rate, and gross-to-net economics.
  - - Implementation / onboarding / support
    - Deployment, onboarding, and post-sale support implied by enterprise motion
    - Service hours or packaged onboarding
    - Operationally necessary but no revenue line is public
    - Could improve adoption but could also weigh on margin if services-heavy
    - Request services revenue mix and services gross margin.
  - - Customer expansion from adjacent workflows
    - Platform broadens into data, AI, code, and developer-adjacent workflows after initial deployment
    - Expansion booking
    - Management disclosed expansion priorities, not booked mix
    - Expansion path looks plausible, but no cohort or NRR data are public
    - Request cohort expansion, NRR, and product-expansion win stories with contract value.
  notes: This table separates what is publicly observable about the sales mechanism from what remains economically opaque. Public sources describe the motion but not realized price or revenue recognition.
