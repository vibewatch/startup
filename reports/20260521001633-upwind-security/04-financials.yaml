- id: TI004
  title: Capital adequacy table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Latest equity financing
    - $250M Series B in January 2026
    - medium
    - Fresh primary capital materially extends operating flexibility.
    - Confirm gross proceeds, fees, and primary vs. secondary split.
  - - Total disclosed capital raised
    - $430M
    - medium
    - Shows headline capital access and dilution path.
    - Reconcile total raised to cap-table entries and any secondary sales.
  - - Current cash on hand
    - null
    - low
    - Cash balance is needed to translate the raise into runway.
    - Request cash balance at close and monthly post-close cash update.
  - - Monthly burn / runway months
    - null
    - low
    - Runway cannot be inferred from funding headlines alone.
    - Request monthly burn and base / upside / downside runway model.
  - - Planned use of funds
    - Product, go-to-market, customer support, global growth, and expansion across data / AI / code
    - medium
    - Clarifies where incremental capital will be consumed.
    - Request hiring plan and budget allocation by function.
  - - Debt / project-finance obligations
    - No public disclosure found
    - low
    - Hidden senior claims can alter equity risk materially.
    - Request debt schedule, guarantees, and any structured financing obligations.
  - - Next-round trigger
    - Not publicly stated; likely shifts toward efficient-growth proof
    - low
    - Helps frame whether future financing is optional or required.
    - Request board financing plan and covenants tied to the next raise.
  notes: This table focuses on forward capital adequacy, not the historical chronology already covered in Company Overview. Unknown values remain explicit disclosure gaps.
