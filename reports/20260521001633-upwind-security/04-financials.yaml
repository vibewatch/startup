  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: arr-and-margin
    missingEvidence: Monthly ARR bridge, revenue by module, gross margin, and cost-of-revenue detail.
    whyItMatters: These metrics are required to underwrite revenue quality and margin path rather than just growth narrative.
    diligencePath: Request monthly board KPI packs, revenue waterfall by module, and audited management accounts for FY2024-FY2026.
    relatedQuestionRefs:
    - QI012
    - QI013
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-burn
    missingEvidence: Cash balance, monthly burn, cash conversion, and runway assumptions after the 2026 round.
    whyItMatters: The Series B improves capital adequacy, but runway cannot be judged without burn and balance-sheet visibility.
    diligencePath: Request monthly cash statements, burn forecasts, and hiring plans linked to the 2026 use-of-funds plan.
    relatedQuestionRefs:
    - QI014
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Pricing books, discount policies, minimum contract terms, and realized price per workload or module.
    whyItMatters: Without realized pricing and contract structure, revenue quality and payback remain opaque.
    diligencePath: Request current price book, standard MSA/order form, discount approvals, and module attach-rate reporting.
    relatedQuestionRefs:
    - QI003
    - QI013
    - QI022
    relatedTableRefs:
    - TI002
    - TI005
  - type: missing-source
    severity: material
    topic: retention-and-concentration
    missingEvidence: Customer concentration, GRR/NRR, cohort renewals, and top-account mix.
    whyItMatters: Recurring-software underwriting depends on retention durability and concentration risk, which public traction claims do not reveal.
    diligencePath: Request top-20 customer revenue mix, renewal calendar, churn analysis, and cohort tables.
    relatedQuestionRefs:
    - QI021
    - QI023
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: minor
    topic: capital-structure
    missingEvidence: Debt instruments, secondaries, liquidation preferences, and any off-balance-sheet obligations.
    whyItMatters: Headline capital raised does not show the economic stack or senior claims on future cash flows.
    diligencePath: Request cap table, financing documents, side letters, and any debt or guarantee schedules.
    relatedQuestionRefs:
    - QI015
    - QI024
    relatedTableRefs:
    - TI004
