- id: TI002
  title: Pricing / monetization table
  columns:
  - Surface
  - Price / unit / contract
  - List vs. realized pricing
  - Discounts / unknowns
  - Source
  rows:
  - - Homepage / main platform pages
    - Get a Demo only; no public list price
    - List price absent
    - All realized pricing unknown
    - Official site
  - - Unified platform messaging
    - Bundled platform rather than a single-function SKU
    - Packaging visible; price absent
    - Unknown whether contracts price by workload, cloud account, seat, or module
    - Official site and product messaging
  - - Channel-assisted enterprise sales
    - Likely negotiated contracts through direct and partner channels
    - Realized price absent
    - Reseller margin share and partner commission structure unknown
    - CRN and Series B materials
  - - Buyer comparison signal
    - PeerSpot says higher initial investment may be required
    - Third-party buyer signal only
    - No public confirmation of list or net pricing
    - PeerSpot
  - - Renewal / expansion terms
    - No public term sheet, pricing appendix, or renewal curve
    - Not disclosed
    - Discounting, true-ups, minimums, and uplift clauses all unknown
    - No retained public source
  notes: Official pricing is not public. The only monetization evidence available publicly is the structure of the sales motion and third-party commentary about investment level.
