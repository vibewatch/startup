  summary: Typical Upwind enterprise customer journey from runtime-blindness discovery through pilot, production rollout, expansion, and reference creation.
  data:
    items:
    - id: J1
      label: Awareness
      detail: Security or platform leaders realize posture-only tools are creating noise and missing runtime context.
      actor: CISO / Platform lead
      sentiment: neutral
    - id: J2
      label: Evaluation
      detail: Buyer runs proof-of-concept against cloud accounts, EKS clusters, or APIs to validate signal quality and deployment friction.
      actor: Security engineering
      sentiment: neutral
    - id: J3
      label: Production rollout
      detail: Team deploys runtime sensors, CloudTrail, or AWS-native integrations and begins using topology and exploitability context.
      actor: Platform / DevSecOps
      sentiment: positive
    - id: J4
      label: Operational adoption
      detail: Security, engineering, and DevOps teams work from one prioritized queue and build remediation workflows around Upwind findings.
      actor: Security + Engineering
      sentiment: positive
    - id: J5
      label: Expansion
      detail: Account expands into API security, AI/code modules, or broader AWS procurement surfaces.
      actor: Security leadership / Procurement
      sentiment: positive
    - id: J6
      label: Reference / renewal
      detail: Satisfied customers become public references if alert reduction and faster remediation hold up in production.
      actor: Customer champion
      sentiment: positive
