artifact: customers
slug: upwind-security
runDate: '2026-05-21'
company:
  name: Upwind Security
chapter:
  number: 6
  title: Customers
summary: Upwind has credible customer traction with a growing roster of named enterprise logos and multiple quantified production case studies, but the public record is still much stronger on deployment proof than on retention, concentration, or contract durability. As of 2026-05-21, the supportable narrative is rapid enterprise adoption with broad cloud-native relevance—not yet a fully underwritten renewal-quality story.
sections:
- id: customer-base-and-adoption-trajectory
  title: Customer base and adoption trajectory
  body: 'Public customer-scale evidence is directionally strong but still imprecise. Upwind does not disclose an exact customer count, yet the homepage and customer-love page both frame the company as serving hundreds of enterprises and security teams worldwide. The January 2026 Series B release then adds the harder growth signal: 200% year-over-year logo growth, millions of protected workloads, and an expanded roster of named enterprises including Waste Management, Siemens, Carvana, Roku, ClickUp, Wix, Nubank, Agoda, Peloton, Fiverr, and BILL. TechCrunch corroborates rapid momentum by reporting that the customer base doubled between the December 2024 Series A and the January 2026 Series B, while also describing the target market as large, data-intensive organizations with meaningful cloud footprints. Geography is also widening beyond the company''s original U.S./U.K./Israel core, with explicit momentum in Australia, India, Singapore, and Japan. Taken together, the public record supports
    real enterprise adoption and international expansion, but not a clean denominator by vertical, ACV band, or renewal cohort.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU040
  tableRefs:
  - TU001
  - TU002
  figureRefs: []
- id: named-customer-proof-and-deployment-maturity
  title: Named customer proof and deployment maturity
  body: Named customer proof is the strongest part of Upwind's customer story. The company now publishes a broad set of case studies that describe real production use rather than simple logo walls. People.ai says it replaced Wiz, reached more than 85% runtime coverage in the first day, and reduced false positives by roughly 20–30%. EvenUp reports 95% fewer alerts and 7x faster remediation. H2O.ai says Upwind eliminated more than 90% of noise and helped its teams get to root cause 10x faster. Spacelift describes custom gVisor support that shrank investigations from hours to minutes, while Vestiaire, CallRail, EX.CO, Anzu, TTMzero, and Intezer each describe materially better prioritization, compliance visibility, or operational focus. The February 2026 AWS Security Hub announcement adds a named Waste Management quote that describes a meaningful reduction in alerts and irrelevant CVEs after rollout. The main caveat is that nearly all of this evidence is company-published, so production maturity
    is much better documented than independent corroboration or contract durability.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU016
  - CU017
  - CU019
  - CU020
  - CU021
  - CU022
