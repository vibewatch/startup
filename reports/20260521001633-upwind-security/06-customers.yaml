  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Audited NRR, GRR, gross logo churn, contract length, and cohort renewal data.
    whyItMatters: Public momentum cannot be translated into customer durability or revenue quality without retention metrics.
    diligencePath: Request cohort retention dashboards, renewal schedules, and contract duration distribution by customer size.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: named customer proof table coverage
    missingEvidence: An exhaustive list of production customers and the deployment depth behind every named logo.
    whyItMatters: The chapter can prove several strong references, but it cannot separate flagship references from the full installed base.
    diligencePath: Request a customer roster with ARR, deployment scope, modules sold, go-live date, and current status.
    relatedQuestionRefs:
    - QU003
    - QU007
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration-data
    missingEvidence: Top-customer concentration, top-partner concentration, and AWS-sourced revenue contribution.
    whyItMatters: Public enterprise logos are strong proof, but concentration can materially change revenue durability and negotiation leverage.
    diligencePath: Request top-10 customer ARR share, top-10 partner ARR share, and channel / AWS marketplace mix.
    relatedQuestionRefs:
    - QU019
    - QU022
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: independent-review-depth
    missingEvidence: A larger base of verified third-party reviews and independent reference calls.
    whyItMatters: The company-published proof set is impressive, but sparse review volume limits confidence in repeatability across the full customer base.
    diligencePath: Collect direct reference calls across win/loss cohorts and obtain verified G2/Gartner/Peer Insights review exports if available.
