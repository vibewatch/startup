      - number: '2.3'
        title: 买方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开客户证据显示，这很少是一人采购。H2O.ai 称安全团队购买了产品，但 DevOps 成为主要用户。People.ai 描述安全、工程、审计和合规团队使用同一个运行时与报告界面。CallRail
              显示治理团队也可能是直接利益相关方。平台能挂到既有云工作流上时，采用路径通常更容易。CloudTrail 集成支持无代理监控、合规自动化和调查，可作为更轻的入口。AWS Competency 验证和 EKS
              add-on 随后降低信任和部署摩擦，因为买家可以通过熟悉的 AWS
              路径发现和部署。实践中，采用往往从一个急性痛点开始——告警疲劳、优先级排序弱、合规证据不足，或缺少运行时可见性——只有平台能帮助安全和平台团队基于同一张运营图工作，才会扩张。
