  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 可支撑的投资逻辑
      - 可支撑的反向逻辑
      - 什么会改变判断
    rows:
      - - 产品
        - 运行时优先定位叠加广泛平台扩张，让 Upwind 在整合中的品类里保持相关性。
        - 平台宽度越来越常见，差异化可能被侵蚀成 GTM 竞争。
        - 证明检测效果、采用率和留存显著优于组合内对手。
      - - 客户
        - 具名企业标识和生产案例研究支撑真实买方痛点和部署价值。
        - 公开证明更能说明采用，而不是续约耐久性、扩张质量或集中度。
        - 提供队列留存、扩张 ARR 和头部客户集中度。
      - - 分发
        - 渠道增长和 AWS 路径可以加速触达，并创造战略相关性。
        - 渠道依赖会压缩经济性，也会让 Upwind 更早进入平台厂商购买路径。
        - 展示合作伙伴来源 ARR、毛额到净额经济性，以及直营对比渠道的回本周期。
      - - 市场 / 退出
        - CNAPP 增长叠加 Wiz 级别的战略兴趣，如果 Upwind 成为品类赢家，会带来上行空间。
        - 整合也会压缩独立退出窗口，并惩罚没有可证明经济性的厂商。
        - 证明 Upwind 能成长为一线独立公司，而不是大套件里的一个功能。
      - - 估值
        - 如果私人 ARR、利润率和 NRR 强，当前估值可能合理。
        - 没有这些指标，当前估值很容易高于实际收入基础可支撑水平。
        - 补齐 ARR、利润率、留存和优先股堆叠尽调缺口。
    notes: 投资逻辑和反向逻辑只基于公开证据。经济数据缺失被刻意计入反向逻辑权重，直到尽调排除。
