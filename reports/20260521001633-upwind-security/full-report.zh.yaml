            body: >-
              架构故事具体到足以可信。Upwind 反复区分运行时传感器和无代理扫描器，而不是假装一种采集方法适合所有工作负载。官方材料称，扫描器把覆盖扩展到 serverless 容器、函数、旧 VM
              和其他难以完整部署传感器的环境；EKS 材料则描述了用于进程级可见性和细粒度响应的轻量级 eBPF 传感器。这一区分重要，因为它展示了真实运营模型：连接云账户，在合适位置添加传感器或扫描器，摄取云日志和
              CI/CD 上下文，关联身份与资源，再从一个控制平面排序优先级并修复。集成页面强化了同一设计。CloudTrail、GitHub Actions、Datadog 和更广生态集成都向模型输送上下文，CI/CD
              自动发现则减少一次性 pipeline 对接需求。架构在 AWS 和 Kubernetes 重环境中看起来最强，并围绕该核心叠加了对 OpenShift、ECS、Lambda 和身份工作流的有意义支持。
