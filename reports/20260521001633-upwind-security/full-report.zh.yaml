      - number: '5.4'
        title: 路线图、成熟度与技术结论
        blocks:
          - type: paragraph
            body: >-
              2024 年到 2026 年的发布节奏显示产品执行很快。公开材料展示了一串发布，把平台从核心运行时安全延伸到无代理扫描、EKS marketplace 部署、更丰富的开发者和 CI/CD 上下文、身份控制、AI
              专项安全，以及把平台推向调查和修复编排的 Agentic Pack。这是一条连贯路线图，因为每次发布都在加深同一套运行时优先控制平面逻辑。最强成熟度信号位于运行时可见性、拓扑映射、可利用性驱动的优先级排序、AWS
              和 Kubernetes 覆盖，以及把发现转化为引导式修复的能力。最弱的部分不一定是功能缺口，而是证据缺口。公开证据在
              SLA、事故历史、认证细节和按模块采用上仍偏薄。因此，技术结论对架构和速度是正面的，但仍取决于对运营可靠性和按模块客户深度的更深尽调。
