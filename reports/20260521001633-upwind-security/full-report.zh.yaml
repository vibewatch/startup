  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 与签约额
        - 当前 ARR、季度签约额桥、销售管线质量
        - 公开证据无法锚定可用收入倍数。
        - CEO / CFO 尽调会，加董事会 KPI 包。
      - - 留存与集中度
        - NRR、总留存、前 10 大客户集中度
        - 判断表面 logo 增长是否可持续。
        - 按队列和客户分层抽取收入运营数据。
      - - 利润率与烧钱
        - 毛利率、托管成本、支持负载、现金消耗、现金跑道
        - 区分软件级经济性与资本密集型增长。
        - 财务经营复盘。
      - - 股权结构表与条款
        - 优先股堆叠、参与权、反稀释、新股与老股交易拆分
        - 投资人结果可能与名义投后估值明显背离。
        - 法律尽调覆盖章程和条款文件。
      - - GTM 质量
        - 渠道来源 ARR、胜率、CAC 回本周期、服务收入占比
        - 渠道规模能扩大触达，也可能压缩经济性。
        - CRO / 销售财务会议，拆解渠道瀑布。
      - - 退出准备度
        - 审计准备、KPI 规范、治理纪律、资料室完整度
        - 若缺少机构级披露，退出窗口可能早于公司准备完成。
        - 财务总监 / 法务 / 董事会流程复盘。
    notes: 这张表把公开尽调接到私募承销。每个问题都对应一个证据缺口，并会实质影响估值信心。
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV036
      - CV041
      - CV045
      - CV046
