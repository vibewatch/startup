        - 年度或多年合同
        - 公开可见；价格未披露
        - 如果嵌入运行时工作流，质量可能较强，但合同条款不公开
        - 索要平均合同金额、合同期限和基础平台订阅收入占比。
      - - 模块扩张 / 附加
        - API、AI、身份、姿态和运行时模块扩大先落地再扩张的机会
        - 按模块或捆绑增售
        - 模块广度公开；实际附加率未知
        - 增售潜力看起来有意义，但附加和折扣行为未披露
        - 索要模块附加率数据和模块级收入贡献。
      - - 渠道影响的企业销售
        - ISV、MSP、VAR 和经销商关系贡献订单额
        - 伙伴来源合同
        - 管理层称新增 100+ 伙伴，CRN 称许多大客户来自渠道
        - 有助于触达，但经销商利润分成和伙伴依赖度不公开
        - 索要伙伴来源管线、胜率和总额到净额经济性。
      - - 实施 / 上线 / 支持
        - 企业销售动作意味着还要投入部署、上手和售后支持
        - 服务工时或打包上手服务
        - 运营上少不了，但公开资料没有单列收入
        - 有助于提升采用率；若服务占比过重，也可能压低利润率
        - 要求披露服务收入占比和服务毛利率。
      - - 来自相邻工作流的客户扩张
        - 初次部署后，平台向数据、AI、代码和开发者相邻工作流延展
        - 扩张订单
        - 管理层披露的是扩张重点，不是已签约组合
