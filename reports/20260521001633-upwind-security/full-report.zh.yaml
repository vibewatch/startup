  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              公开材料描述 Upwind 时，更像是在描述一个统一的运行时安全运营模型，而不是单一功能。公司称，平台把资产清单、态势、网络拓扑、应用、API、身份和 AI
              工作流接到同一个运行时智能层。这一框架重要，因为它解释了为什么 Upwind 不停扩张到相邻模块，而不是留在狭窄 CNAPP 盒子里。当前公开模块集很宽：CNAPP、CSPM、CDR、漏洞管理、API 安全、AI
              安全、身份安全、非人类身份分析和 Agentic Pack，都坐在同一套核心平台叙事上。工作流取向也异常明确。Upwind
              持续说明它如何发现资产、映射关系、验证什么真正暴露，然后用上下文驱动修复，而不是堆静态告警量。这就是核心产品逻辑。主要尽调问题不是模块是否存在，而是买家是否真的在生产中按足够规模部署足够多模块，让统一平台主张站得住。
