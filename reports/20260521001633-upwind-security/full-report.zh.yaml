  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 围绕当前价格、上一轮和公开可比信号，给出牛市、基准、熊市的指示性价值区间。
    approximationNotes: 区间只表示方向，取决于私有尽调；它们不是市场价格，也不是正式 DCF。
    data:
      items:
        - label: 熊市情景
          low: 500
          mid: 750
          high: 1000
          unit: $M
          notes: 如果经济性尚未验证、增长先正常化，估值会重置。
        - label: 基准情景
          low: 1200
          mid: 1500
          high: 1800
          unit: $M
          notes: 如果执行保持稳健但经济性只是合格，结果更像跟踪 / 持有。
        - label: 牛市情景
          low: 2200
          mid: 2600
          high: 3200
          unit: $M
          notes: 需要强 ARR 规模、留存和软件级毛利率。
        - label: 参考点
          low: 900
          mid: 1500
          high: 32000
          unit: $M
          notes: Upwind 上一轮、当前轮，以及 Wiz 战略退出。
    claimRefs:
      - CV003
      - CV004
      - CV025
      - CV038
      - CV039
      - CV040
      - CV044
