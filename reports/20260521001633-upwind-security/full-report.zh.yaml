          - type: paragraph
            body: >-
              信任证据是混合的。Upwind 有有意义的验证信号——AWS 生态认可、可见的 Security Hub 集成，以及描述真实安全结果的客户引用——但公开信任界面仍浅于产品叙事。公司没有暴露保留的公开状态页、API
              参考、开源仓库或详细公开信任中心记录，外部审阅者无法独立测试可靠性和保证流程。对于一个想坐在运行时检测、AI、身份和修复工作流中间的平台，这形成了缺口。因此，所需的开发者信号只能间接获得。没有明显公开 OSS
              足迹，所以最佳公开代理指标是从业者证据：TTMzero 描述 DevSecOps 工作流被改造，Spacelift 描述自定义 gVisor
              支持和更快调查，买家评论则谈到部署便捷性与支持深度的取舍。这些信号有用，因为它们来自运营者，而不只是供应商文案；但它们仍弱于直接公开的开发者界面。
