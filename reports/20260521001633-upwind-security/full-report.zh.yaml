chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、运行时逻辑与地域足迹
        blocks:
          - type: paragraph
            body: >-
              Upwind Security 把自己定位为下一代云与 AI
              安全平台，核心围绕运行时上下文，而不是静态态势快照。公司官网、产品页、投资人评论和后续融资报道都延续了这一身份。核心叙事是：现代云安全团队要先弄清生产环境里什么真正在运行、暴露、可触达、彼此连接，才可能聪明地排序风险。创始故事重要，因为它解释了公司为何选择这条路线。Upwind
              由 Amiram Shachar、Lavi Ferdman、Liran Polak 和 Tal Zur 于 2022 年创立；同一团队此前打造 Spot.io，并在 2020 年以大约 $450 million
              价格出售给 NetApp。公司公开材料把总部锚定在 San Francisco，投资人与融资来源也显示其从一开始就在 Israel 有运营足迹，包括 Tel Aviv
              的早期团队集中度以及美国运营。这种双重足迹后文很重要，因为它同时支撑工程深度和全球 GTM 覆盖；但现有公开来源对总部身份的证据，仍强于对法律实体和各办公室地图的精确披露。
