      - number: '2.4'
        title: 增长驱动、约束与缺口
        blocks:
          - type: paragraph
            body: >-
              保留证据支持强需求驱动，但也保留了真实摩擦。市场报告指向网络威胁上升、远程和重云运营模式，以及合规压力。Upwind 的客户证据把这些主题转化为具体价值：H2O.ai 提到噪音减少超过 90%、根因定位快
              10x，Petrofac 提到 AKS 告警减少 98%。这些结果足以支撑整合预算。约束同样可见。MarketsandMarkets 标出技能短缺、监管变化和 CNAPP 复杂度，People.ai
              的案例则显示部署模式决策会制造或消除摩擦。PeerSpot 又给出第二个反向点：Check Point 支持更广、定价更有竞争力，而 Upwind
              可能需要更高初始投入。另一个警示是，公开成功故事强调运营收益，而不是合同规模、续约或回本周期。结论是有利但不干净：增长显而易见，定价不透明，按细分市场拆出的份额数据仍过于有限，无法精确承销。
