  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局、同业集合与替代品类别
        blocks:
          - type: paragraph
            body: >-
              Upwind 面对的不是一簇整齐的创业公司。DellOro 和 TBRC 支持一个更宽的竞争场，包括靠近超大规模云厂商的买家、组合型安全厂商和纯专业玩家。最直接的专业玩家包括 Wiz、Orca、Sysdig 和
              Aqua，它们都营销代码、云、运行时，以及 AI 或应用层保护的某种组合。下一圈包括 Palo Alto Networks、CrowdStrike、SentinelOne、Check Point 和
              Fortinet 等更广的公开平台，它们可以把 CNAPP 折进更大的安全套件和更大的销售覆盖里。现状本身也重要。CAVA 显示，买家往往从多个云和 API
              工具出发，而不是从干净的单一供应商名单出发。因此，Upwind 的竞争场包括直接产品对手、既有套件，以及买家长期保留多套工具的习惯。
