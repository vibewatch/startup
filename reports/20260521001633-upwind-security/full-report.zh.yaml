      - number: '8.3'
        title: 情景与敏感性视角
        blocks:
          - type: paragraph
            body: >-
              公开记录不完整，估值只能做情景分析，不能假装精确。牛市情景在概念上很容易描述：未披露的 ARR
              基数已经很可观，留存优异，毛利率具备软件质量，公司把运行时优先相关性转化为持久定价权。如果这些事实成立，当前估值最终可能显得保守。基准情景更克制，也更符合今天真正公开的信息：Upwind
              是一家强公司，产品市场匹配真实存在，但经济性还没有强到足以支持激进入场价。熊市情景并不需要经营失败；只要增长在私有 KPI
              组合达到市场预期之前回归常态，就足够触发压力。换句话说，主要敏感项不是市场叙事，而是尽调能揭示怎样的收入质量。
