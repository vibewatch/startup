            body: >-
              公开定价透明度在整个品类都偏弱。多数主要供应商页面把买家导向演示或联系表单，而不是列出价格，所以公开分析更多说明采购路径，而不是已实现经济性。Upwind 最清楚的公开采购优势来自 AWS：EKS add-on
              和 AWS Security Hub Extended plan 创造了一条单合同、单账单路径，可降低重 AWS 账户的摩擦；CRN 还称，公司在 Series B 前一年新增了超过 100
              家合作伙伴。相比之下，成熟公开厂商依靠规模和既有覆盖，而不是价格披露。PeerSpot 暗示 Check Point 支持更广、表观定价更低。Fortinet 面向投资人的材料强调托管服务。Prisma
              页面强调合作伙伴和托管服务。企业云安全里，当多个供应商都能可信覆盖代码、云、运行时和 AI 主题后，分销力量可能和功能细节一样决定胜负。因此，伙伴来源 pipeline 和续约杠杆几乎与原始产品广度同样重要。
