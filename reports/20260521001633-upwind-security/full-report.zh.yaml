        blocks:
          - type: paragraph
            body: >-
              公开来源只能支持对 Upwind 赚钱方式的高层次判断，但这套高层次判断是连贯的。公司通过演示驱动的动作销售一个捆绑式企业云与 AI
              安全平台，而不是透明的自助购买路径。官方页面反复强调一个统一的运行时优先平台，覆盖态势、运行时检测、API 安全、AI 安全和贴近开发者的工作流；这说明变现更可能围绕平台订阅和模块扩张，而非狭窄单功能
              SKU。这一解释也符合管理层说法：客户不想要另一个点工具，公司需要广泛集成的平台才能赢得采用。仍然缺失的是投资人通常用来把产品范围转成收入质量的信息：标价、模块级打包、最低合同条款、实施收入、续约机制或收入确认细节。因此，公开记录有助于识别可能的变现机制，但无法承销已实现价格或经常性软件质量。
