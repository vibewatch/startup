      - number: '8.5'
        title: 最终尽调问题与 thesis-break 触发器
        blocks:
          - type: paragraph
            body: >-
              本章还需要补的工作很直接。承销买入之前，投资人需要 ARR
              衔接表、分群留存、客户集中度、毛利率、烧钱速度、伙伴经济性，以及真实的清算优先权结构。这些不是例行材料，而是决定当前股东是在支付合理软件倍数，还是走向未来估值重置风险的变量。论点失效触发器也因此必须写清楚。如果流失显著差于预期，如果毛利率看起来偏基础设施负担，如果渠道杠杆伴随真实的
              gross-to-net 压缩，或者股权结构表的悬挂风险高于标题所暗示，当前估值会很快失去辩护空间。反过来，如果这些指标表现强劲，建议也可以快速上调，因为产品和品类证据已经足以支持继续推进。
