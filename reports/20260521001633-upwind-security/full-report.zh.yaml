      - number: '1.3'
        title: 融资历史、规模与客户信号
        blocks:
          - type: paragraph
            body: >-
              Upwind 对一家 2022 年创立的公司来说融资节奏异常快，公开来源现在也比单一标题更清楚地拼出了路径。Leaders Fund 称，公司在 2022 年 9 月以 $30 million
              种子轮起步。2023 年 9 月，投资人与公司材料记录了一笔 $50 million 融资，使累计披露融资达到 $80 million。2024 年 12 月，公司宣布由 Craft Ventures 领投
              $100 million Series A 轮，TechCrunch 报道投后估值为 $900 million。2026 年 1 月的 Series B 轮又以 $1.5 billion 估值加入 $250
              million，使累计披露融资达到 $430 million。这些融资事件与公开规模指标吻合：2024 年轮次时约 150 名员工，计划在 2025 年接近翻倍，到 2026 年公告时员工超过 300
              人。2026 年新闻稿还把新估值与 900% 收入增长、200% logo 增长、数百万受保护工作负载，以及可见的企业客户名单联系起来。明显缺席的仍是经审计收入、毛利率、NRR
              或定价披露；因此，规模故事方向上很强，但从承销角度看仍不完整。
