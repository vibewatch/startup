      - number: '1.4'
        title: 里程碑、市场摩擦与开放尽调问题
        blocks:
          - type: paragraph
            body: >-
              里程碑记录同时显示出强动能，也给出了保持尽调纪律的充分理由。积极一面是，公司上线后迅速拓宽平台：API Security、运行时漏洞管理、无代理云扫描器、AWS competency 认可，以及
              AI-agentic 功能，都出现在保留的 2024-2026 年材料中。People.ai 等公开客户故事也显示，Upwind
              以运行时为先的定位强到足以在至少部分账户中替换既有工具。但风险叙事并不空。TechCrunch
              报道称，早期客户对部署代理心存犹豫，也质疑重运行时的方法能否顺畅集成；在部署摩擦会拖慢采用的安全项目里，这是实实在在的 GTM 障碍。同一报道还称，Upwind
              得出结论：安全团队不会容忍拥挤云安全市场里又一个狭窄点工具，因此公司需要一个广泛集成的平台。这一框架符合更广泛的云安全格局，也凸显本章的核心开放问题：在没有经审计财务披露的情况下，公司公开增长和客户证据是否足以支撑显著更高的估值。现阶段，答案方向上有希望，但仍不完整。
