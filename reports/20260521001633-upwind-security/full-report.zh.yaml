  - id: TV005
    title: 投资逻辑破裂和否决触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 如何传导到投资逻辑
      - 行动含义
    rows:
      - - 收入质量不达预期
        - ARR 基数太小，或增长很大程度来自非经常性收入
        - 打破“产品动能足以支撑当前估值”的核心论点。
        - 不按当前价格投资。
      - - 留存疲弱
        - NRR 或 logo 留存显示，快速新增 logo 掩盖了流失
        - 增长故事从可持续复利，变成高成本补漏式销售。
        - 下行重新按悲观情景定价。
      - - 利润率低于预期
        - 毛利率明显低于软件业务应有水平
        - 重 runtime 的架构价值低于平台叙事暗示。
        - 下调估值区间，并争取更好的进入条款。
      - - 竞争挤压
        - 组合型厂商靠捆绑或采购杠杆赢下更多交易
        - runtime-first 差异化足以守住定价权的判断被削弱。
        - 建议从可跟踪转为按当前价格回避。
      - - 治理 / 条款压力
        - 优先股堆叠或老股套现明显改变投资人回报测算
        - 即使公司继续执行，回报潜力也会被压低。
        - 要求条款透明，否则放弃。
    notes: 这些触发点要能被持续跟踪，并且直接关系到估值支撑；它们不只是判断公司是否还在交付产品。
