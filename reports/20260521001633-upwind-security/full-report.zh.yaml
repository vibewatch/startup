  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Upwind 属于 CNAPP，但实际购买边界比一个缩写更宽。Gartner、TBRC 和 Dell’Oro 都把 CNAPP 定义为面向云原生基础设施和应用的全生命周期安全。Upwind
              自己的页面也直接映射到这套逻辑：态势、运行时检测、漏洞优先级排序、API 安全，以及现在的 AI 专项控制。集成页面又把经济边界进一步扩到 CI/CD、IAM、SIEM、SOAR
              和漏洞响应工作流，因为这些系统会决定预算实际如何花出去。因此，纳入支出不只是扫描器订阅，还包括买家为了减少工具、改善优先级排序而折叠进一个平台的工作流和相邻控制。排除项则是那些始终无法把可见性、优先级排序和行动连接成一个运营闭环的独立工具。
            claimRefs:
