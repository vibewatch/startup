              具名客户证据是 Upwind 客户故事里最强的部分。公司现在发布了一组广泛案例研究，描述真实生产使用，而不是简单 logo 墙。People.ai 称其替换了 Wiz，首日运行时覆盖超过 85%，误报减少大约
              20–30%。EvenUp 报告告警减少 95%、修复快 7x。H2O.ai 称 Upwind 消除了超过 90% 的噪音，并帮助团队以 10x 速度找到根因。Spacelift 描述自定义 gVisor
