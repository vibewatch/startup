        - 没有统一控制平面的独立扫描或日志
        - 云安全负责人、CISO 预算
        - Upwind 最直接竞争的核心品类
      - - 应用与 API 安全邻近领域
        - API 发现、应用层检测、数据流可见性、schema 漂移
        - 没有运行时上下文的传统应用测试或网关
        - AppSec 负责人、共享安全 / 开发者预算
        - Upwind 明确把 CNAPP 扩展到应用和 API 层
      - - AI 安全邻近领域
        - 模型、agent、prompt、检索路径和 AI 运行时可见性 / 防护
        - 没有云工作负载上下文的纯治理工具
        - AI 平台负责人、安全架构
        - 重要邻近领域，但不等同于核心 CNAPP
      - - 工作流与控制系统集成
        - CI/CD、IAM、SIEM、SOAR、监控、VM 响应
        - 从不参与云风险修复的通用工具
        - 平台工程、DevSecOps
        - 这些工具会影响谁付款、哪些工具被替代
      - - 受监管合规运营
        - 持续控制监测、证据生成、报告、受监管数据可见性
        - 一次性咨询或审计项目
        - 合规、风险、审计、安全预算
        - 客户案例显示这是一个真实切入点
      - - 被排除的替代支出
        - N/A
        - 纯网络工具、仅端点产品、孤立日志，或没有整合动作的点状产品
        - 现有孤岛预算
        - 真实替代品，但除非发生整合，否则不计入 Upwind TAM
    notes: 边界按收敛逻辑划定：纳入连接云可见性、优先级排序和行动的支出；买方不整合时，排除相邻孤岛。
