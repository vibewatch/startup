  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 商业与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Upwind 所处市场需求真实，但平台压力很强。独立市场来源把 CNAPP 描述为快速增长品类，但也指出主要供应商和超大规模云厂商正围绕更广的云与 AI 安全平台收敛。这一点重要，因为 Upwind 通过
              TechCrunch 承认，客户不想要多个云安全工具，早期买家也对代理和部署权限犹豫。换句话说，市场正在拉向宽平台故事，而 Wiz、Palo Alto
              Networks、CrowdStrike、Aqua、SentinelOne 和 Orca 等资本充足的既有厂商已经在营销这类故事。Wiz 自称获得超过一半 Fortune 100 信任。Palo Alto 强调
              code-to-cloud-to-SOC 规模。CrowdStrike 把运行时主张与 MITRE 验证配对。Upwind 仍可凭运行时清晰度和产品速度取胜，但它的商业风险并不抽象：如果买家偏好捆绑平台，或
              Upwind 无法维持信噪比优势，公司将面临定价压力、转化放慢，以及比单看公开增长数字更艰难的续约叙事。
