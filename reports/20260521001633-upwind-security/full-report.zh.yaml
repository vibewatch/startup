      - number: '2.2'
        title: 多重视角测算规模
        blocks:
          - type: paragraph
            body: >-
              最强的公开数字锚点是 TBRC 的 CNAPP 系列，指向 2026 年 $15.42B 市场，并到 2030 年增长至
              $30.91B。这是有用的自上而下视角，但单独看还不够，因为它没有隔离运行时优先份额、超大规模云厂商捆绑，或 AI 安全相邻空间。MarketsandMarkets
              补充了方向性的细分证据：公有云、平台软件、大型企业和 BFSI 是领先切片，品类的主要驱动力是威胁增长和分布式工作。Dell’Oro 提供关键修正：它把 CNAPP 与新兴 AI Systems Security
              市场分开，同时仍把二者描述为相邻。正确读法是分层的：广义 CNAPP 明确庞大且在增长，大型企业和受监管楔子可能最适合 Upwind 服务，而干净的公开 SOM
              仍不可得。同样重要的是，公开来源不足以支持把所有相邻云安全或 AI 安全美元简单相加。更稳妥的解释是：CNAPP 提供主要预算池，AI
              安全是附近的扩张向量，但仍需要单独测量。这个区分重要，因为它把市场规模锚在当前真实购买品类上，而不是承销中的未来重叠猜想和无支撑乐观。
