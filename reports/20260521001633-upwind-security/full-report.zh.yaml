  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当下价格与证据的匹配度
        blocks:
          - type: paragraph
            body: >-
              标题估值好说，真要承销却难。Upwind 在 2026 年 1 月完成 $250M Series B 后估值达到 $1.5B，而 2024 年 12 月估值还是
              $900M。这个跃升有分量，因为速度很快，也伴随清晰的公开增长信号：管理层称收入同比增长 900%，客户 logo 同比增长 200%，员工规模扩至 300 人以上。客户验证也不是假设。Upwind
              能拿出具名企业、公开案例，以及比泛泛 logo 墙更具体的运行时优先成果表述。即便如此，公开记录仍停在标题层面。ARR、收入 run
              rate、毛利率、烧钱速度、NRR、续约曲线和客户集中度都没有披露。因此，当前估值应被看作一家强公司配上一套披露薄弱的经济性证明，而不是一个不证自明的便宜价格。
