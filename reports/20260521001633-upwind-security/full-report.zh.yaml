  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 指示性估值 / 回报逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - ARR 基数被证明足够大，NRR 强，毛利率接近软件水平，品类领导者继续享有战略稀缺溢价。
        - 如果私人 KPI 组合明显强于公开记录，下一轮估值可能达到 $2.2B-$3.0B+。
        - 需要尽调确认 900% 增长主张是在有意义的收入基础上复合增长。
        - 即便基本面强，竞争收敛仍可能缩短窗口。
      - - 基准
        - 产品证明真实，增长仍好但趋于正常化，经济性不错但不出众。
        - 围绕当前估值，$1.2B-$1.8B 的持有至小幅上行区间。
        - 最符合当前公开证据组合：公司强，但价格支撑不完整。
        - 公平但不便宜的结果，在稀释后仍可能让投资人回报平庸。
      - - 悲观
        - 增长放缓快于预期，客户向更大平台整合，尽调暴露留存或利润率偏弱。
        - $0.5B-$1.0B 重置 / 持平至下轮估值下调风险。
        - 公开记录已经为这种情况留下空间，因为看不到 ARR 或 NRR 底线。
        - 估值重置可能早于退出窗口到来。
    notes: 情景区间是方向性估计，锚定当前私人估值、上一轮 $900M 融资、品类交易信号，以及公开单位经济性缺失。它们不是目标价格。
