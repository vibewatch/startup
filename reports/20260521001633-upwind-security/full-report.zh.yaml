              用例。这种错位不能证明控制有问题，但会制造尽调风险，因为买家可能把客户用例合规与供应商控制证据混为一谈。AWS Security Hub Extended Plan
              又加入第二层治理：单一合同、单一账单、整合支持和通过 AWS 的灵活定价。这提高了采购效率，也把更多商业和运营杠杆放到 AWS 手里。最后，市场来源称 CNAPP 采用受监管变化和实施复杂度限制；随着
              Upwind 从运行时 CNAPP 扩到 AI 安全，这两点更重要。
