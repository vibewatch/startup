              最强的公开控制信号是 AWS Security Competency 身份；这很重要，因为它暗示年度验证，并包括 Compliance 和 Privacy 等类别。但这只是起点。保留来源集仍不包括公开
              DPA、隐私政策、子处理方名单、违约条款披露、公开状态页，或清楚记录的供应商侧认证栈，如 SOC 2、ISO 27001 或 FedRAMP。与此同时，公司直接营销到合规敏感工作流：People.ai 和
