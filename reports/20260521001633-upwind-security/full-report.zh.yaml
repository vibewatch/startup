      - number: '8.2'
        title: 市场与可比框架
        blocks:
          - type: paragraph
            body: >-
              品类证据足以支撑继续跟进。TBRC 和其他留存的分析师来源仍指向一个规模大、还在增长的 CNAPP 市场；Dell'Oro 则认为云原生安全正变得更整合、更具战略意义。Wiz 以 $32B
              被收购，为品类龙头给出了显眼的上行参照。与此同时，可比公司也解释了为什么估值纪律重要。Fortinet、CrowdStrike、SentinelOne、Check Point、Palo Alto
              Networks、Sysdig 和 Aqua 都说明，平台宽度越来越只是入场券，分销、支持和经审计披露同样关键。Upwind 的运行时优先叙事可能仍有差异化，但市场已不再只奖励差异化。真正的问题是，Upwind
              能否证明自己更接近稀缺的品类赢家，而不是一家有吸引力但经济性尚未验证的次规模平台。
