chapter:
  number: 3
  title: Competitors
  summary: Upwind’s real peer set spans pure-play cloud-security vendors such as Wiz, Orca, Sysdig, and Aqua; portfolio vendors such as Palo Alto Networks, CrowdStrike, SentinelOne, Check Point, and Fortinet; and the status-quo option of keeping several tools in place. Upwind’s runtime-first story is differentiated and customer-backed, but the market is converging around broad code-cloud-runtime platforms, public pricing is opaque, and established vendors still look stronger on support networks, installed bases, and distribution scale. Moat durability therefore depends less on one feature and more on whether Upwind can turn runtime precision plus easy procurement into sustained win rates.
sections:
- id: landscape
  title: Landscape, Peer Set, and Substitute Classes
  body: Upwind does not compete against one neat cluster of startups. DellOro and TBRC support a broader field that includes hyperscaler-adjacent buyers, portfolio security vendors, and pure-play specialists. The most direct specialist set includes Wiz, Orca, Sysdig, and Aqua, all of which market some combination of code, cloud, runtime, and AI or app-layer protection. The next ring includes broader public platforms such as Palo Alto Networks, CrowdStrike, SentinelOne, Check Point, and Fortinet, which can fold CNAPP into a larger security bundle and a bigger sales footprint. The status quo also matters. CAVA shows that buyers often start from multiple cloud and API tools instead of a clean one-vendor shortlist. Upwind’s competitive field therefore includes direct product rivals, incumbent suites, and the persistent buyer habit of keeping several tools in place.
  claimRefs:
