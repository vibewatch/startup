tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Wiz
    - Direct pure-play peer
    - Google agreed to acquire Wiz for $32B; Wiz targeted $1B ARR; claims >50% of Fortune 100
    - Large enterprises wanting graph-based code-cloud-runtime security
    - Unified security graph and very strong public scale
    - Pricing is opaque and it is not uniquely runtime-first
  - - Orca
    - Direct pure-play peer
    - Private scale not quantified in retained funding sources; markets 100% coverage
    - Teams prioritizing agentless onboarding and low-friction coverage
    - Agentless SideScanning and strong simplicity message
    - Lighter public runtime-depth story than Upwind
  - - Prisma Cloud
    - Portfolio-vendor peer
    - Part of Palo Alto Networks; cites 1T events/day and 1.5M attacks/day
    - Large enterprises already buying a broad security platform
    - Code-to-cloud-to-SOC breadth plus AI-SPM and partner reach
    - Portfolio complexity can blunt a focused runtime message
  - - CrowdStrike
    - Portfolio-vendor peer
    - Public page cites 281+ tracked adversaries and 100% MITRE cloud result
    - Enterprises standardizing on Falcon for endpoint and cloud
    - Sensor plus agentless model with strong threat-intelligence brand
    - Cloud product competes inside a broader bundle
  - - SentinelOne
    - Portfolio-vendor peer
    - Trusted by four of Fortune 10 and hundreds of Global 2000
    - Buyers wanting one AI-heavy platform across endpoint, cloud, identity, and data
    - Very broad CNAPP module coverage and strong endpoint-to-cloud story
    - Breadth can make differentiation look generic
  - - Check Point CloudGuard
    - Incumbent pure-play security vendor
    - Check Point calls itself one of the largest pure-play security vendors globally; PeerSpot shows higher CNAPP mindshare than Upwind
    - Enterprises valuing established support and pricing leverage
    - Support scale and competitive pricing signal
    - Less differentiated runtime narrative than Upwind
  - - Fortinet / Lacework FortiCNAPP
    - Incumbent portfolio vendor
    - Fortinet reported $5.96B 2024 revenue and now lists Lacework FortiCNAPP
    - Customers already inside Fortinet estates
    - Bundle leverage plus managed cloud security services
    - Cloud-native credibility can be diluted by broader portfolio positioning
  - - Sysdig
    - Direct pure-play peer
    - Markets Forrester leader status in Q1 2026 and 6:1 tool consolidation
    - Cloud-native teams that value runtime and Falco heritage
    - Strong runtime and response posture with agent plus agentless model
    - Private-company financial scale is not exposed
  - - Aqua
    - Direct pure-play peer
    - Claims trust from 41% of the Fortune 100
    - Enterprises wanting code-to-cloud-to-prompt coverage
    - Longstanding cloud-native brand with AI and runtime framing
    - Public pricing and distribution detail remain thin
  notes: Scale and funding signals are limited to what the retained public corpus exposed. Private-company rows explicitly preserve what remains undisclosed.
