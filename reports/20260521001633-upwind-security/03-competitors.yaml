  - - Orca
    - Public platform page markets fast ROI, not posted prices
    - Quote-led enterprise contract
    - Agentless CNAPP across multiple modules
    - Actual pricing by asset or cloud account is not public
    - Agentless simplicity may help evaluation even without list pricing
  - - Prisma Cloud
    - Request-a-demo model with no posted enterprise rate card
    - Bundle or platform sale inside Palo Alto portfolio
    - Code, cloud, runtime, AI-SPM, investigations
    - Cloud-specific realized pricing is not public
    - Portfolio bundling can matter more than list-price transparency
  - - Check Point CloudGuard
    - PeerSpot says pricing is competitive
    - Enterprise quote-led sale
    - CNAPP with stronger support footprint
    - Independent public price tables are unavailable
    - One of few retained sources suggesting a direct relative price advantage
