  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-loss
    missingEvidence: Recent win-loss data by named competitor.
    whyItMatters: Moat durability cannot be underwritten from product pages alone because public materials rarely show conversion or displacement rates.
    diligencePath: Request 12-month win-loss data by competitor, segment, channel, and deployment model.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized pricing, discounting, support attach, and services margin data.
    whyItMatters: Competitive economics are mostly invisible in public CNAPP materials.
    diligencePath: Obtain quote data, discount bands, multi-year terms, and support attach by module.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: distribution
    missingEvidence: Partner-sourced pipeline, renewal influence, and channel-specific win rates.
    whyItMatters: Distribution power can overpower product nuance when pricing is private and bundles are broad.
