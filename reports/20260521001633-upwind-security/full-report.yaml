      - number: '8.4'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with medium confidence, a high risk rating, and a stretched valuation
              stance. That is not a disguised negative call on the company. It is a statement that price support is not
              yet robust enough to justify a buy recommendation. Fresh capital reduces near-term financing pressure, the
              customer evidence is credible, and the category remains strategically relevant. However, the same evidence
              base also says the company operates inside a converging field where large vendors can bundle, buyers still
              lack transparent pricing, and public investors would demand much cleaner KPI disclosure than the company
              currently provides. The most reasonable posture is to keep Upwind in diligence, stay interested in the
              asset, and let private financial evidence rather than narrative excitement decide whether the current mark
              is fair or merely aspirational.
            claimRefs:
              - CV019
