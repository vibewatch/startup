  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue quality miss
        - ARR base is too small or growth is heavily non-recurring
        - Breaks the main argument that product momentum can justify the current mark.
        - Do not invest at the current price.
      - - Retention weakness
        - NRR or logo retention shows churn hidden by rapid new-logo growth
        - Turns the growth story from durable compounding into expensive replacement selling.
        - Re-rate downside toward bear case.
      - - Margin disappointment
        - Gross margin looks materially below software-quality expectations
        - Makes the runtime-heavy architecture less valuable than the headline platform story suggests.
        - Lower valuation range and push for better entry terms.
      - - Competitive compression
        - Portfolio vendors win more deals by bundling or procurement leverage
        - Erodes the notion that runtime-first differentiation is enough to hold pricing power.
        - Shift recommendation from trackable to avoid at current price.
      - - Governance / term overhang
        - Preference stack or secondary extraction materially changes investor outcome math
        - Reduces return potential even if the company continues executing.
        - Insist on term transparency or walk away.
    notes: >-
      These triggers are designed to be monitorable and directly tied to valuation support, not just to whether the
      company continues shipping product.
