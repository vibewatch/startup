  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Commercial and competitive risks
        blocks:
          - type: paragraph
            body: >-
              Upwind is operating in a market with real demand but intense platform pressure. Independent market sources
              describe CNAPP as a rapidly growing category, yet also one where major vendors and hyperscalers are
              converging around broader cloud-and-AI security platforms. That matters because Upwind itself
              acknowledged, via TechCrunch, that customers did not want multiple cloud-security tools and that early
              buyers were hesitant about agents and deployment permissions. In other words, the market is pulling toward
              exactly the kind of broad platform story that well-capitalized incumbents such as Wiz, Palo Alto Networks,
              CrowdStrike, Aqua, SentinelOne, and Orca are already marketing. Wiz frames itself as trusted by more than
              half of the Fortune 100. Palo Alto pushes code-to-cloud-to-SOC scale. CrowdStrike pairs runtime claims
              with MITRE validation. Upwind can still win on runtime clarity and product velocity, but its commercial
              risk is not abstract: if buyers prefer bundled platforms, or if Upwind cannot sustain a signal-over-noise
              advantage, the company will face pricing pressure, slower conversions, and a tougher renewal narrative
              than its public growth figures alone imply.
            claimRefs:
