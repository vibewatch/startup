      - number: '1.4'
        title: Milestones, market friction, and open diligence questions
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows both strong momentum and meaningful reasons for diligence discipline. On the
              positive side, the company broadened its platform quickly after launch: API Security, runtime
              vulnerability management, agentless cloud scanners, AWS competency recognition, and AI-agentic
              functionality all appeared in retained 2024-2026 materials. Public customer stories such as People.ai also
              show that Upwind's runtime-first positioning has been strong enough to displace incumbent tools in at
              least some accounts. But the risk narrative is not empty. TechCrunch reported that early customers were
              hesitant about deploying agents and questioned whether a runtime-heavy approach would integrate smoothly,
              which is a real go-to-market hurdle in security programs where deployment friction slows adoption. The
              same reporting also said Upwind concluded it needed a broad integrated platform because security teams
              would not tolerate another narrow point tool in an already crowded cloud-security market. That framing
              fits the broader cloud-security landscape and highlights the central open question for this chapter:
              whether the company's public growth and customer proof are enough to justify a much richer valuation
              without audited financial disclosure. At this stage, the answer is directionally promising but still
              incomplete.
