      - number: '1.3'
        title: Funding history, scale, and customer signals
        blocks:
          - type: paragraph
            body: >-
              Upwind's capital formation is unusually fast for a company founded in 2022, and public sources now
              reconcile the path more clearly than the bare headline often suggests. Leaders Fund says the company
              started with a $30 million seed in September 2022. In September 2023, investor and company materials
              documented a $50 million financing that brought total disclosed funding to $80 million. In December 2024,
              the company announced a $100 million Series A led by Craft Ventures, and TechCrunch reported a $900
              million post-money valuation. The January 2026 Series B then added $250 million at a $1.5 billion
              valuation and brought cumulative disclosed funding to $430 million. Those financing events line up with
              public scale markers: roughly 150 employees at the 2024 round, a plan to nearly double headcount during
              2025, and more than 300 employees by the 2026 announcement. The 2026 release also tied the new valuation
              to 900% revenue growth, 200% logo growth, millions of protected workloads, and a visible enterprise
              customer roster. What remains notably absent is audited revenue, margin, NRR, or pricing disclosure, which
              makes the scale story directionally strong but still incomplete for underwriting purposes.
