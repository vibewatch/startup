              Trust evidence is mixed. Upwind has meaningful validation signals—AWS ecosystem recognition, a visible
              Security Hub integration, and customer references that describe real security outcomes—but the public
              trust surface remains shallower than the product narrative. The company does not expose a retained public
              status page, API reference, open-source repository, or detailed public trust-center record that would let
              an outside reviewer independently test reliability and assurance processes. That creates a gap for a
