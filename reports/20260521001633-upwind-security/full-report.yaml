        - Availability of privacy policy, DPA, subprocessor list, certifications, and incident disclosures
        - If diligence cannot obtain current legal/control docs quickly
        - Delay investment or condition it on control-package delivery
      - - Growth quality opacity
        - NRR, GRR, contract length, and support-cost visibility
        - If retention and pricing data remain unavailable after deeper diligence
        - Treat valuation support as incomplete and move to a higher-risk diligence posture
