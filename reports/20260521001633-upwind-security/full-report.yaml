              of enterprises and security teams worldwide. The January 2026 Series B release then adds the harder growth
              signal: 200% year-over-year logo growth, millions of protected workloads, and an expanded roster of named
              enterprises including Waste Management, Siemens, Carvana, Roku, ClickUp, Wix, Nubank, Agoda, Peloton,
