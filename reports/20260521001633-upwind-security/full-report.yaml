  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, Peer Set, and Substitute Classes
        blocks:
          - type: paragraph
            body: >-
              Upwind does not compete against one neat cluster of startups. DellOro and TBRC support a broader field
              that includes hyperscaler-adjacent buyers, portfolio security vendors, and pure-play specialists. The most
              direct specialist set includes Wiz, Orca, Sysdig, and Aqua, all of which market some combination of code,
              cloud, runtime, and AI or app-layer protection. The next ring includes broader public platforms such as
              Palo Alto Networks, CrowdStrike, SentinelOne, Check Point, and Fortinet, which can fold CNAPP into a
              larger security bundle and a bigger sales footprint. The status quo also matters. CAVA shows that buyers
              often start from multiple cloud and API tools instead of a clean one-vendor shortlist. Upwind’s
              competitive field therefore includes direct product rivals, incumbent suites, and the persistent buyer
              habit of keeping several tools in place.
