      - number: '7.5'
        title: Financial model and execution risks
        blocks:
          - type: paragraph
            body: >-
              The biggest underwriting risk is not that Upwind lacks momentum; it is that momentum is public while unit
              economics remain private. The company disclosed 900% revenue growth, 200% logo growth, millions of
              workloads, and a doubling of headcount to more than 300, but none of the supporting operating metrics—ARR,
              gross margin, burn, NRR, contract length, support costs, or pricing schedules—are public in the retained
              corpus. That makes it hard to know whether the company is scaling efficiently or simply scaling fast.
              External review depth also remains thin, which matters because sparse independent proof can mask
              implementation burden or uneven outcomes until renewal cycles mature. Execution complexity is rising
              simultaneously: Upwind is broadening from runtime CNAPP into AI, data, and code, and MSSP Alert shows the
              company layering agentic workflows on top of that. The result is a classic later-stage private-company
              risk profile: strong category momentum and strong customer stories, but limited public evidence on whether
              growth quality, organizational depth, and support economics are keeping pace with the ambition.
            claimRefs:
