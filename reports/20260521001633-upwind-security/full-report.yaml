      - number: '2.2'
        title: Sizing With Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              The strongest public numeric anchor is TBRC’s CNAPP series, which points to a $15.42B market in 2026
              growing to $30.91B by 2030. That is a useful top-down lens, but it is not enough by itself because it does
              not isolate runtime-first share, hyperscaler bundles, or AI-security adjacency. MarketsandMarkets adds
              directional segment evidence: public cloud, platform software, large enterprises, and BFSI are the leading
              slices, and the category’s major drivers are threat growth plus distributed work. Dell’Oro adds the key
              corrective by separating CNAPP from the emerging AI Systems Security market while still describing them as
              adjacent. The right read is layered: broad CNAPP is clearly large and growing, the large-enterprise and
              regulated wedge is likely most serviceable for Upwind, and any clean public SOM remains unavailable. Just
              as important, the public sources do not justify adding every adjacent cloud or AI security dollar
              together. The safer interpretation is that CNAPP supplies the main budget pool, while AI security is a
              nearby expansion vector that still needs separate measurement. That distinction matters because it keeps
              market sizing tied to actual current buying categories instead of speculative future overlap and
              unsupported optimism in underwriting.
