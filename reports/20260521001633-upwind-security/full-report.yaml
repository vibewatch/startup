      - - eBPF sensor path
        - Kernel-level and process-level runtime visibility with granular response
        - Works best where lightweight sensor deployment is allowed
        - Agent acceptance and kernel / environment compatibility remain practical constraints.
      - - Agentless scanner path
        - Covers serverless, functions, older VMs, and hard-to-instrument environments
        - Depends on snapshots, cloud APIs, and deployment permissions
        - Less live context than full sensor path in some environments.
      - - Cloud log ingestion
        - Uses CloudTrail and similar activity sources for monitoring and forensics
        - Depends on logging completeness and cross-account configuration
        - Misconfigured or incomplete logs reduce detection quality.
      - - Build-time and CI/CD context
        - Adds developer and image provenance to runtime findings
        - Depends on integrations or Upwind's auto-discovery logic
        - Indirect discovery may be less precise than direct pipeline integration.
      - - Identity / NHI graph
        - Maps permissions, trust relationships, and risky role paths
        - Depends on IAM, IdP, and workload context ingestion
        - Permission analysis quality is limited by underlying identity-source completeness.
      - - Agentic control plane
        - Coordinates investigation, validation, and remediation actions
        - Depends on high-quality context and safe workflow boundaries
        - Needs stronger public proof on guardrails, auditability, and reliability.
