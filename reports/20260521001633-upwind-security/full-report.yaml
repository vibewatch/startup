          - type: callout
            title: Bull-case upside depends on private metrics clearing a very high bar
            body: >-
              The category can support large outcomes, but the public record alone does not prove that Upwind belongs in
              the same economic class as the very best cloud-security winners.
            calloutType: assumption
            claimRefs:
              - CV023
