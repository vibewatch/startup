  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public monetization evidence
        blocks:
          - type: paragraph
            body: >-
              Public sources support only a high-level view of how Upwind makes money, but that high-level view is
              coherent. The company sells a bundled enterprise cloud and AI security platform through a demo-led motion
              rather than a transparent self-serve purchase path. Official surfaces repeatedly emphasize one unified
              runtime-first platform spanning posture, runtime detection, API security, AI security, and
              developer-adjacent workflows, which suggests monetization is structured around platform subscriptions with
              module expansion rather than a narrow single-feature SKU. That interpretation also fits management
              commentary that customers did not want another point tool and that the company needed a broad integrated
              platform to win adoption. What remains absent is the information an investor would normally use to
              translate product scope into revenue quality: list pricing, module-level packaging, minimum contract
              terms, implementation revenue, renewal mechanics, or revenue-recognition detail. The public record is
              therefore useful for identifying the likely mechanism of monetization, but not for underwriting realized
              price or recurring-software quality.
