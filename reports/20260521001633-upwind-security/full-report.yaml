  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Upwind belongs in CNAPP, but the practical buying boundary is wider than one acronym. Gartner, TBRC, and
              Dell’Oro all frame CNAPP as lifecycle security for cloud-native infrastructure and applications. Upwind’s
              own pages map directly into that logic: posture, runtime detection, vulnerability prioritization, API
              security, and now AI-specific controls. The integrations page widens the economic boundary further into
              CI/CD, IAM, SIEM, SOAR, and vulnerability-response workflows because those systems shape how budgets are
              actually spent. Included spend therefore means more than scanner subscriptions. It includes the workflows
              and adjacent controls buyers collapse into one platform when they want fewer tools and better
              prioritization. The excluded buckets are stand-alone tools that never connect visibility, prioritization,
              and action into one operating loop.
            claimRefs:
