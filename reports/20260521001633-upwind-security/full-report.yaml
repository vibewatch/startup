      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Good company, incomplete price support
            body: >-
              Upwind has enough product, customer, and category evidence to stay on the investment list. It does not yet
              have enough public economic evidence to deserve a buy call at the current $1.5 billion mark.
            calloutType: recommendation
            claimRefs:
              - CV001
