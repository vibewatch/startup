      - number: '8.2'
        title: Market and comparable frame
        blocks:
          - type: paragraph
            body: >-
              There is enough category evidence to justify staying engaged. TBRC and other retained analyst sources
              still point to a large and growing CNAPP market, while Dell'Oro argues that cloud-native security is
              becoming more consolidated and more strategically important. Wiz's $32 billion acquisition sets an obvious
              upside marker for the category leader. At the same time, the comparable set also explains why valuation
              discipline matters. Fortinet, CrowdStrike, SentinelOne, Check Point, Palo Alto Networks, Sysdig, and Aqua
              show that platform breadth is increasingly table stakes and that distribution, support, and audited
              disclosure matter. Upwind's runtime-first story may still be differentiated, but the market no longer
              rewards differentiation alone. The relevant question is whether Upwind can prove it deserves to be valued
              closer to a scarce category winner than to an attractive but economically unproven subscale platform.
            claimRefs:
