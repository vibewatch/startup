            body: >-
              The public GTM picture is stronger than the public financial picture. Multiple sources indicate that
              Upwind targets large enterprises with significant cloud complexity, and channel reporting suggests partner
              relationships matter economically. CRN reported that management said most major accounts came through
              channel partners, while the Series B announcement highlighted more than 100 new partners across ISVs,
              MSPs, and resellers. That points to a motion where channel leverage can improve acquisition efficiency,
              but also where reseller economics, enablement costs, and partner margins matter. Public sources
              simultaneously show the counterweight: early runtime adoption involved friction. TechCrunch reported that
              prospects were initially hesitant to deploy agents and that sales cycles took time because buyers
              questioned integration complexity and did not want another separate cloud-security tool. Customer outcome
              claims such as 98% alert reduction, 60% fewer irrelevant CVEs, and faster investigations indicate strong
              economic value once deployed, but they do not reveal CAC, payback, realized pricing, or renewal
