              between the December 2024 Series A and the January 2026 Series B, while also describing the target market
              as large, data-intensive organizations with meaningful cloud footprints. Geography is also widening beyond
              the company's original U.S./U.K./Israel core, with explicit momentum in Australia, India, Singapore, and
