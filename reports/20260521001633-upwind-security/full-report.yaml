          - type: callout
            title: Valuation risk is fundamentally an evidence-quality problem
            body: >-
              The biggest debate is not whether Upwind is building a relevant product. It is whether the undisclosed
              ARR, retention, margin, and preference stack justify paying through the current opacity.
            calloutType: risk
            claimRefs:
              - CV007
