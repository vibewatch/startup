      - number: '3.2'
        title: Capability Breadth and Architecture Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The main split is not simple feature count; it is architecture and operating model. Upwind argues for
              runtime-first context, and People.ai plus CAVA suggest that this matters when static inventory cannot
              explain what is actually active or risky. Wiz presents a similar end-to-end idea through a security graph,
              but its public story leans harder on scale. Orca pushes the opposite tradeoff by making agentless coverage
              and low operational friction the primary value proposition. CrowdStrike and SentinelOne argue that buyers
              should not choose between posture and runtime because they combine agentless and sensor-backed telemetry
              inside broader AI-driven platforms, while Prisma Cloud and Aqua frame competition around full lifecycle
              coverage from development to runtime and, increasingly, AI workloads. Upwind is differentiated, but not
              isolated: buyers can now find broad platforms with overlapping claims across nearly every major vendor in
              the field.
