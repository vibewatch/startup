      - number: '1.2'
        title: Leadership, board, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is relatively strong, while governance transparency is only partial. Upwind's
              official materials clearly identify Amiram Shachar as co-founder and CEO, with Tal Zur as CTO and Lavi
              Ferdman leading growth. The public leadership roster also shows a more developed executive bench than an
              early-stage startup might imply, including Tomer Hadassi, Rinki Sethi, Nadav Naor, Dan Yahav, Max Stevens,
              and several product and people leaders. That depth matters because it suggests the company has been
              staffing for scale rather than operating as a founder-only sales story. Public board disclosure is
              thinner. The About page surfaces key investor voices such as Gili Raanan from Cyberstarts, Saam Motamedi
              from Greylock, and Gideon Hayden from Leaders Fund, which is enough to establish investor quality and
              board-level involvement. However, retained sources do not provide a complete picture of independent
              directors, committees, or formal governance controls, and that gap matters more once a private company is
              valued at $1.5 billion. The result is a mixed governance picture: strong founder-market fit and investor
              alignment, but still limited public visibility into the formal oversight structure.
