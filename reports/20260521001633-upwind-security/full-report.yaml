      - number: '7.3'
        title: Regulatory, legal, and compliance risks
        blocks:
          - type: paragraph
            body: >-
              The strongest public control signal is AWS Security Competency status, which matters because it implies
              annual validation and includes categories such as Compliance and Privacy. But that is only a starting
              point. The retained source set still does not include a public DPA, privacy policy, subprocessor list,
              breach-terms disclosure, public status page, or a clearly documented vendor-side certification stack such
              as SOC 2, ISO 27001, or FedRAMP. At the same time, the company markets directly into compliance-sensitive
              workflows: People.ai and CallRail case studies describe SOC 2, ISO, Microsoft 365, CIS, HIPAA, and PCI use
              cases. That mismatch does not prove a control problem, but it does create diligence risk because buyers
              could conflate customer-use-case compliance with vendor-control evidence. The AWS Security Hub Extended
              Plan adds a second governance layer: one contract, one bill, consolidated support, and flexible pricing
              via AWS. That improves procurement efficiency, but also puts more commercial and operational leverage in
              AWS's hands. Finally, market sources say CNAPP adoption is constrained by changing regulations and
              implementation complexity, both of which matter more as Upwind expands from runtime CNAPP into AI
              security.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
