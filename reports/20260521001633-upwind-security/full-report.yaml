    title: Recommendation summary table
    columns:
      - Decision lens
      - Current answer
      - Evidence support
      - Implication
    rows:
      - - Recommendation
        - research-more
        - Product and customer proof are strong, but valuation support still depends on private diligence.
        - Do not underwrite a buy at the current price without internal KPI access.
      - - Confidence
        - medium
        - >-
          Headline growth, financing, and product breadth are visible, while economics and cap-table terms remain
          private.
        - Proceed only with a diligence plan that can materially improve evidence quality.
      - - Risk rating
        - high
        - Competition is converging, price is opaque, and core economic metrics are undisclosed.
        - Treat entry discipline as more important than company-quality enthusiasm.
      - - Valuation stance
        - stretched
        - The $1.5B mark has strategic/category support but lacks public ARR or margin anchors.
        - Current mark should be treated as a diligence checkpoint, not a confirmed bargain.
      - - Decision implication
        - Track or diligence; do not auto-pass, do not auto-buy
        - Fresh capital removes urgency but not price risk.
        - The right next step is private-metric diligence, not immediate conviction capital.
    notes: >-
      This table turns the public evidence into an investment posture. It is intentionally price-sensitive: product
      quality alone is not treated as a buy signal.
