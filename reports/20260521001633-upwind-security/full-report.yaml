  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform definition and module map
        blocks:
          - type: paragraph
            body: >-
              Public materials describe Upwind less as a single feature and more as a unified runtime-security operating
              model. The company says the platform joins inventory, posture, network topology, applications, APIs,
              identities, and AI workflows into one runtime intelligence layer. That framing matters because it explains
              why Upwind keeps expanding into adjacent modules rather than staying inside a narrow CNAPP box. The
              current public module set is broad: CNAPP, CSPM, CDR, vulnerability management, API security, AI security,
              identity security, non-human identity analysis, and the Agentic Pack all sit on the same core platform
              narrative. The workflow orientation is also unusually explicit. Upwind consistently describes how it
              discovers assets, maps relationships, validates what is truly exposed, and then drives remediation with
              context rather than static alert volume. That is the core product thesis. The main diligence question is
              not whether modules exist; it is whether buyers actually deploy enough of them in production, at scale, to
              make the unified-platform claim durable.
