      - number: '8.5'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The chapter's open work is straightforward. Before underwriting a buy, an investor needs the ARR bridge,
              cohort retention, concentration, gross margin, burn, partner economics, and the actual preference stack.
              Those items are not housekeeping details; they are the variables that determine whether current
              shareholders are paying a reasonable software multiple or walking into a future reset risk. This is also
              why the thesis-break triggers are explicit. If churn is materially worse than expected, if margin looks
              infrastructure-heavy, if channel leverage comes with real gross-to-net compression, or if the cap table
              has more overhang than the headline suggests, the current mark stops being defensible quickly. Conversely,
              if those metrics come in strong, the recommendation can improve fast because the product and category
              evidence are already good enough to support continued work.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV036
              - CV038
              - CV040
              - CV045
              - CV046
