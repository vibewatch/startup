      - number: '7.4'
        title: Partner and go-to-market dependency risks
        blocks:
          - type: paragraph
            body: >-
              Distribution leverage is visible—and so is dependency. The Series B release says Upwind added more than
              100 partners in the prior year, while CRN reports that most big accounts currently come from channel. The
              AWS relationship is particularly deep: customers can deploy through the EKS add-on, ingest CloudTrail for
              monitoring and compliance workflows, and now procure the platform through AWS Security Hub's Extended
              Plan. This cluster of dependencies can be a major growth accelerant, especially for AWS-heavy enterprises,
              but it also concentrates commercial leverage with one hyperscaler and with a partner ecosystem whose
              economics are not public. The source set does not disclose top-partner concentration, AWS-sourced revenue,
              or renewal concentration by channel. That means the partner narrative is easy to celebrate but hard to
              underwrite. If channel incentives weaken, if AWS favors other vendors, or if large logo wins remain
              disproportionately tied to a small number of partner paths, Upwind's go-to-market resilience could be
              weaker than the headline growth rate suggests.
            claimRefs:
              - CR019
