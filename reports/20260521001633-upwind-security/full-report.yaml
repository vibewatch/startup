      - number: '3.3'
        title: Pricing Transparency, Procurement Routes, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is weak across the category. Most major vendor pages route buyers to demos or
              contact forms rather than list prices, so public analysis says more about procurement pathways than
              realized economics. Upwind’s clearest public procurement advantage is AWS-led: its EKS add-on and AWS
              Security Hub Extended plan create a one-contract, one-bill path that can lower friction in AWS-heavy
              accounts, while CRN says the company also added more than 100 partners during the year before Series B. By
              contrast, established public vendors rely on scale and existing coverage rather than price disclosure.
              PeerSpot suggests Check Point has broader support and lower apparent pricing. Fortinet’s investor-facing
              materials highlight managed services. Prisma’s page emphasizes partners and managed services. In
              enterprise cloud security, distribution power can be as decisive as feature nuance once several vendors
              can credibly cover code, cloud, runtime, and AI themes. That is why partner-sourced pipeline and renewal
              leverage matter almost as much as raw product breadth.
