- id: scenario-and-sensitivity
  title: Scenario and sensitivity view
  body: 'Because the public record is incomplete, the valuation exercise must stay scenario-based rather than pretend to precision. The bull case is easy to describe conceptually: the undisclosed ARR base is already substantial, retention is excellent, gross margin is software-quality, and the company converts runtime-first relevance into durable pricing power. If those facts prove true, the current mark may eventually look conservative. The base case is more modest and more consistent with what is actually public today: Upwind is a strong company whose product-market fit is real, but whose economics are still not provable enough to warrant aggressive entry pricing. The bear case does not require operational failure; it only requires growth to normalize before the private KPI set clears the market''s expectations. In other words, the major sensitivity is not the market narrative. It is what diligence reveals about revenue quality.'
