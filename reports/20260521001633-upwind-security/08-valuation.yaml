- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - ARR and bookings
    - Current ARR, quarterly bookings bridge, pipeline quality
    - No public evidence anchors a usable revenue multiple.
    - CEO / CFO diligence session plus board KPI pack.
  - - Retention and concentration
    - NRR, gross retention, top-10 customer concentration
    - Determines whether headline logo growth is durable.
    - Revenue ops extract by cohort and customer band.
  - - Margin and burn
    - Gross margin, hosting cost, support load, cash burn, runway
    - Separates software-quality economics from capital-intensive growth.
    - Finance operating review.
  - - Cap table and terms
    - Preference stack, participation rights, anti-dilution, primary versus secondary split
    - Investor outcome math can diverge materially from the headline post-money.
    - Legal diligence on charter and term docs.
  - - Go-to-market quality
    - Partner-sourced ARR, win rates, CAC payback, services mix
    - Channel scale can help reach but also compress economics.
    - CRO / sales-finance session with channel waterfall.
  - - Exit readiness
    - Audit readiness, KPI hygiene, governance discipline, data room completeness
    - Without institutional-grade disclosure, the exit window may arrive before the company is ready.
    - Controller / legal / board process review.
  notes: This table is the practical bridge from public diligence to private underwriting. Each ask closes a gap that materially changes valuation confidence.
