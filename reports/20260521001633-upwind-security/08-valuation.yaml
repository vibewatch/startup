- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Indicative valuation / return logic
  - Probability signal
  - Key risks
  rows:
  - - Bull
    - ARR base proves large, NRR is strong, gross margin looks software-like, and category leaders keep commanding strategic scarcity premiums.
    - $2.2B-$3.0B+ next-mark potential if the private KPI set looks much stronger than the public record.
    - Requires diligence to confirm that the 900% growth claim is compounding from a meaningful revenue base.
    - Competitive convergence could still shorten the window even if fundamentals are strong.
  - - Base
    - Product proof is real, growth remains good but normalizes, and economics are decent rather than exceptional.
    - $1.2B-$1.8B hold-to-modest-upside range around the current mark.
    - 'Best fit for the current public evidence mix: strong company, incomplete price support.'
    - A fair-but-not-cheap outcome can still produce mediocre investor returns after dilution.
  - - Bear
    - Growth slows faster than expected, customers consolidate around bigger platforms, and diligence exposes weak retention or margins.
    - $0.5B-$1.0B reset / flat-to-down-round risk.
    - The public record already leaves room for this because no ARR or NRR floor is visible.
    - A reset could arrive before an exit window opens.
  notes: Scenario ranges are directional estimates anchored on the current private mark, the prior $900M round, category transaction signals, and the absence of public unit economics. They are not price targets.
