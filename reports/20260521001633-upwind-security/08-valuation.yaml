- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Supportable thesis
  - Supportable anti-thesis
  - What would change the view
  rows:
  - - Product
    - Runtime-first positioning plus broad platform expansion make Upwind relevant in a consolidating category.
    - Platform breadth is increasingly common, so differentiation may erode into a go-to-market contest.
    - Show materially better detection efficacy, adoption, and retention than portfolio rivals.
  - - Customers
    - Named enterprise logos and production case studies support real buyer pain and deployment value.
    - Public proof is stronger on adoption than on renewal durability, expansion quality, or concentration.
    - Provide cohort retention, expansion ARR, and top-customer concentration.
  - - Distribution
    - Channel growth and AWS routes can accelerate reach and create strategic relevance.
    - Channel dependence can compress economics and puts Upwind into platform-vendor buying paths earlier.
    - Show partner-sourced ARR, gross-to-net economics, and direct-versus-channel payback.
  - - Market / exits
    - CNAPP growth plus Wiz-scale strategic interest create upside if Upwind becomes a category winner.
    - Consolidation can also compress independent exit windows and punish vendors without provable economics.
    - Show Upwind can emerge as a top-tier independent rather than a feature inside a larger suite.
  - - Valuation
    - If private ARR, margin, and NRR are strong, the current mark may prove reasonable.
    - Without those metrics, the mark can easily be too rich for the actual revenue base.
    - Close the ARR, margin, retention, and preference-stack diligence gaps.
  notes: Thesis and anti-thesis are grounded in public evidence only. Missing economic data is deliberately treated as anti-thesis weight until diligence clears it.
