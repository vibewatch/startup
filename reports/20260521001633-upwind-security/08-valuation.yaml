  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Current ARR, net retention, renewal cohort data, and revenue concentration by top customers.
    whyItMatters: These are the core inputs needed to determine whether the $1.5 billion mark reflects durable recurring revenue or just a fast growth snapshot.
    diligencePath: Request the last 12 months of board KPI packs with ARR bridge, NRR by cohort, churn, expansion, and top-10 customer concentration.
    relatedQuestionRefs:
    - QV004
    - QV011
    - QV025
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, burn, sales efficiency, CAC payback, and support/services mix.
    whyItMatters: The chapter can argue product momentum, but without unit economics it cannot test whether the current price is fair or stretched on a software-quality basis.
    diligencePath: Request monthly finance operating reports covering gross margin, cloud cost, support headcount, CAC payback, and free-cash-flow trajectory.
    relatedQuestionRefs:
    - QV011
    - QV020
    - QV025
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Full cap table, liquidation preferences, secondary versus primary split, and any side-letter economics in the Series B.
    whyItMatters: Preference overhang and secondary extraction can materially change expected investor outcomes even when the headline valuation looks attractive.
    diligencePath: Request the cap table, latest charter, investor rights agreement, and the executed Series B term sheet before any underwriting decision.
    relatedQuestionRefs:
    - QV009
    - QV025
    - QV030
    relatedTableRefs:
    - TV006
  - type: conflicting-data
    severity: minor
    topic: customer-scale
    missingEvidence: A precise current customer-count denominator and the bridge between website customer claims and financing-announcement logo-growth claims.
    whyItMatters: Customer proof is strong, but the exact scale and retention quality of that base remain ambiguous enough to matter in valuation work.
    diligencePath: Request the current paying-customer count, ARR by cohort, and a reconciliation between public website customer counts and internal sales reporting.
    relatedQuestionRefs:
    - QV016
    - QV025
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: comparable-valuation-table
    missingEvidence: Direct public multiple references for private CNAPP peers and a cleaner disclosed transaction benchmark for comparable cloud-security exits.
    whyItMatters: The comparable valuation table can anchor directionally on rounds, M&A, and public disclosure benchmarks, but it still lacks a tidy set of directly comparable private multiples.
    diligencePath: Collect banker materials, secondary marks, or additional direct transaction disclosures before treating the comparable set as a precise pricing tool.
    relatedQuestionRefs:
    - QV012
    - QV013
    - QV014
    - QV015
    relatedTableRefs:
    - TV004
