company:
  name: Upwind Security
chapter:
  number: 8
  title: Valuation
  summary: 'Upwind has enough product, customer, and category evidence to remain investable in principle, but the public record still does not disclose the economic inputs needed to validate the current $1.5 billion private mark. The result is a research-more call with medium confidence: strong company quality and strategic relevance, but a stretched valuation stance until private diligence closes ARR, retention, margin, and cap-table gaps.'
sections:
- id: price-versus-proof
  title: Price versus proof today
  body: 'The headline valuation is easy to state and hard to underwrite. Upwind reached a $1.5 billion valuation in January 2026 on a $250 million Series B after having been valued at $900 million in December 2024. That step-up is meaningful because it happened quickly and alongside clear public signals of momentum: management claimed 900% year-over-year revenue growth, 200% year-over-year logo growth, and a workforce that expanded past 300 employees. Customer proof is also real rather than hypothetical. Upwind can point to named enterprises, public case studies, and runtime-first outcome language that is more concrete than a generic logo wall. Even so, the public record still stops at the headline. It does not disclose ARR, revenue run rate, gross margin, burn, NRR, renewal curves, or concentration. That means the current mark should be treated as a strong company meeting a weakly disclosed economic case, not as a self-proving bargain.'
  claimRefs:
