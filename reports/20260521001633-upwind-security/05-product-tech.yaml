- id: architecture-deployment-and-integration-workflow
  title: Architecture, deployment, and integration workflow
  body: 'The architecture story is specific enough to be credible. Upwind repeatedly distinguishes between runtime sensors and agentless scanners rather than pretending one collection method fits every workload. Official materials say scanners extend coverage to serverless containers, functions, older VMs, and other environments where full sensor deployment is difficult, while EKS materials describe a lightweight eBPF sensor for process-level visibility and granular response. That split is important because it shows a real operating model: connect cloud accounts, add sensors or scanners where appropriate, ingest cloud logs and CI/CD context, correlate identities and resources, then prioritize and remediate from one control plane. The integrations surface reinforces the same design. CloudTrail, GitHub Actions, Datadog, and broader ecosystem integrations all feed context into the model, while CI/CD auto-discovery reduces the need for one-off pipeline hookups. The architecture appears strongest
    in AWS- and Kubernetes-heavy environments, with meaningful support for OpenShift, ECS, Lambda, and identity workflows layered around that core.'
