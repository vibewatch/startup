  - - Identity and permission controls
    - Publicly visible
    - Human identities, machine identities, and cross-account roles
    - Need deeper proof on automation guardrails and privilege-change controls.
  - - Runtime prioritization quality
    - Publicly claimed
    - Find the 5% of alerts that matter / 7x to 10x faster investigations
    - No retained public benchmark pack or methodology.
  - - Documentation surface
    - Partially visible
    - Multiple feature posts refer to login-required documentation center
    - Independent technical verification is constrained without docs access.
  - - Public reliability transparency
    - Not retained
    - No public status page or public uptime history retained
    - Need status history, SLA, and incident-disclosure evidence.
  - - Certification / assurance depth
    - Limited public detail
    - Case studies mention customer compliance posture and AWS competency
    - Need SOC 2 / ISO scope detail and testing cadence by module.
  notes: This table distinguishes visible trust signals from missing operational-assurance proof. Missing fields are deliberate diligence gaps rather than omitted work.
