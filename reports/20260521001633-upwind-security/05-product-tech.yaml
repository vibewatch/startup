  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: implementation-docs
    missingEvidence: Public API reference, setup guides, docs-center content, and deeper implementation documentation.
    whyItMatters: The product surface is broad, but investors cannot independently verify many implementation details because multiple technical posts point to login-gated documentation.
    diligencePath: Request product documentation export, API reference, deployment runbooks, and architectural deep dives for sensors, scanners, and integrations.
    relatedQuestionRefs:
    - QE003
    - QE017
    - QE024
    relatedTableRefs:
    - TE003
    - TE005
  - type: missing-source
    severity: material
    topic: trust-reliability
    missingEvidence: Public status page, SLA commitments, uptime history, incident disclosures, and certification scope detail.
    whyItMatters: Operational maturity matters for a security platform that claims to be a control plane across runtime, AI, and remediation workflows.
    diligencePath: Request status-history export, SLA documents, SOC 2 / ISO scope letters, and major-incident postmortems.
    relatedQuestionRefs:
    - QE016
    - QE017
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: module-adoption
    missingEvidence: Module-level usage, attach rates, false-positive benchmarks, and measured time-to-value by product area.
    whyItMatters: Feature breadth alone does not prove that customers actually deploy and depend on each module in production.
    diligencePath: Request module adoption dashboard, attach-rate data, benchmark studies, and customer reference calls by module.
    relatedQuestionRefs:
    - QE014
    - QE019
    - QE024
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: minor
    topic: developer-surface
    missingEvidence: Open-source repos, package-registry telemetry, public changelog cadence, or other direct developer-surface metrics.
    whyItMatters: Required developer-signal exists only through practitioner proxies today, which is weaker than a direct public developer footprint.
    diligencePath: Request public repo inventory or community telemetry, or explain why the platform intentionally maintains no public developer surface.
    relatedQuestionRefs:
    - QE015
    - QE024
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: security-validation
    missingEvidence: Detailed public trust-center evidence for testing cadence, pentest scope, and data-handling controls across AI, API, and identity modules.
    whyItMatters: These controls materially affect whether the platform's broad claims are backed by repeatable engineering and assurance processes.
    diligencePath: Request pentest summaries, data-classification design docs, AI red-team reports, and certification mappings by module.
    relatedQuestionRefs:
    - QE016
    - QE024
    - QE025
    relatedTableRefs:
