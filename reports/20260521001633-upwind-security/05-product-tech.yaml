chapter:
  number: 5
  title: Product & Technology
  summary: Upwind's public product surface supports a runtime-centric cloud and AI security platform that combines sensors, agentless scanners, cloud-log ingestion, CI/CD context, identity analysis, and specialized AI agents in one control plane. The architecture and release cadence look strong—especially across Kubernetes, AWS, API, identity, and remediation workflows—but public trust, documentation depth, and direct developer-surface proof still lag the breadth of the product story.
sections:
- id: platform-definition-and-module-map
  title: Platform definition and module map
  body: 'Public materials describe Upwind less as a single feature and more as a unified runtime-security operating model. The company says the platform joins inventory, posture, network topology, applications, APIs, identities, and AI workflows into one runtime intelligence layer. That framing matters because it explains why Upwind keeps expanding into adjacent modules rather than staying inside a narrow CNAPP box. The current public module set is broad: CNAPP, CSPM, CDR, vulnerability management, API security, AI security, identity security, non-human identity analysis, and the Agentic Pack all sit on the same core platform narrative. The workflow orientation is also unusually explicit. Upwind consistently describes how it discovers assets, maps relationships, validates what is truly exposed, and then drives remediation with context rather than static alert volume. That is the core product thesis. The main diligence question is not whether modules exist; it is whether buyers actually deploy
    enough of them in production, at scale, to make the unified-platform claim durable.'
  claimRefs:
