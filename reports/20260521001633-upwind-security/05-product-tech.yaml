- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Upwind solution
  - Measurable benefit
  - Limitation
  rows:
  - - Find the 5% of misconfigurations that matter
    - Security team reviews large posture alert queue
    - Runtime-aware CSPM prioritization and relationship mapping
    - Official pages say teams focus on the small set of alerts that matter
    - No public benchmark on alert precision by customer segment.
  - - Investigate a cloud incident quickly
    - Analyst manually correlates logs, workload events, and identities
    - CDR timeline, topology, and cloud-context correlation
    - Official pages claim 10x faster investigations and 7x faster remediation
    - Needs independent benchmark and incident-history proof.
  - - Fix exploitable vulnerabilities
    - Teams chase raw CVE severity and waste cycles on dead ends
    - Reachability-based vulnerability prioritization and developer attribution
    - Official pages say Upwind prioritizes only exploitable risks and routes fixes to owners
    - No public proof of sustained false-positive reduction by module.
  - - Secure APIs in production
    - Security team lacks live inventory and schema truth
    - Runtime API discovery, schema mapping, data classification, and threat detection
    - Official API page says it discovers managed, unmanaged, and shadow APIs
    - No public API reference or independent protocol-depth validation.
  - - Protect hybrid or non-standard container estates
    - Operators struggle to monitor OpenShift, ECS, or gVisor workloads
    - OpenShift, ECS, EKS, Lambda, and custom gVisor support
    - Spacelift and support posts show broader-than-Kubernetes coverage
    - Coverage proof is still concentrated in company-authored sources.
  - - Pull security closer to developers
    - CI/CD context is fragmented across many tools
    - GitHub Actions integration plus CI/CD auto-discovery
    - Official docs say Upwind can connect or infer build-time context to speed root-cause analysis
    - Developer-surface proof remains proxy-based rather than open community evidence.
  notes: Benefit statements are limited to source-backed claims and customer / practitioner anecdotes. They are not normalized benchmarks across the installed base.
