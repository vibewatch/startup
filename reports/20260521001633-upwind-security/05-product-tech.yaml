- id: trust-quality-compliance-and-developer-signal
  title: Trust, quality, compliance, and developer signal
  body: 'Trust evidence is mixed. Upwind has meaningful validation signals—AWS ecosystem recognition, a visible Security Hub integration, and customer references that describe real security outcomes—but the public trust surface remains shallower than the product narrative. The company does not expose a retained public status page, API reference, open-source repository, or detailed public trust-center record that would let an outside reviewer independently test reliability and assurance processes. That creates a gap for a platform that wants to sit in the middle of runtime detection, AI, identity, and remediation workflows. The required developer signal therefore comes indirectly. There is no obvious public OSS footprint, so the best public proxy is practitioner evidence: TTMzero describing a transformed DevSecOps workflow, Spacelift describing custom gVisor support and faster investigations, and buyer-review commentary about deployment ease versus support depth. Those signals are useful
    because they come from operators, not just vendor copy, but they are still weaker than a direct public developer surface.'
  claimRefs:
  - CE024
  - CE025
  - CE031
  - CE032
  - CE033
  - CE034
