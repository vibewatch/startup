- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Unified CNAPP / runtime platform
    - Security operations and cloud security leaders
    - GA / core
    - Runtime-first intelligence layer rather than static posture alone
    - Need module-level adoption and attach-rate data.
  - - CSPM + topology mapping
    - Cloud security and governance teams
    - GA / mature
    - Maps assets, identities, and relationships across cloud boundaries with runtime prioritization
    - Need proof of scale and false-positive rate by environment.
  - - CDR / attack-path investigation
    - Detection and response teams
    - GA / maturing
    - Correlates logs, topology, CI/CD, and identities for faster investigations
    - Need benchmarked MTTR data beyond marketing examples.
  - - Vulnerability management + shift-left
    - Platform security and engineering
    - GA / mature
    - Reachability-driven prioritization from build to runtime with developer attribution
    - Need proof of developer workflow adoption and fix rates.
  - - API security
    - Application and platform security teams
    - GA / maturing
    - Runtime discovery, schema mapping, data classification, threat detection, and DAST in one workflow
    - Need public proof of production deployments and protocol coverage at scale.
  - - AI security + Agentic Pack
    - Security leaders, AI platform owners, SOC teams
    - Maturing / fast-moving
    - Combines AI inventory and testing with agentic investigation, validation, and remediation
    - Need private evidence on production usage, safety guardrails, and reliability.
  - - Identity + Non-Human Identity security
    - IAM, cloud security, and compliance teams
    - GA / maturing
    - Authorization graph, cross-account role context, and behavior-aware identity analysis
    - Need public trust evidence for data handling and automation boundaries.
  notes: Maturity ratings reflect the amount of public evidence retained, not an internal vendor roadmap. Rows distinguish core platform modules from newer or less independently validated features.
