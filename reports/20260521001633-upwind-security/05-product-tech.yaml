- id: roadmap-maturity-and-technical-verdict
  title: Roadmap, maturity, and technical verdict
  body: The release cadence from 2024 through 2026 suggests fast product execution. Public materials show a sequence of launches that extend the platform from core runtime security into agentless scanning, EKS marketplace deployment, richer developer and CI/CD context, identity controls, AI-specific security, and an Agentic Pack that moves the platform toward investigation and remediation orchestration. That is a coherent roadmap because every release deepens the same runtime-first control-plane thesis. The strongest maturity signals sit in runtime visibility, topology mapping, exploitability-driven prioritization, AWS and Kubernetes coverage, and the ability to translate findings into guided remediation. The weakest areas are not necessarily feature gaps; they are evidence gaps. Public proof remains thin on SLA, incident history, certification detail, and per-module adoption. The technical verdict is therefore positive on architecture and pace, but still conditional on deeper diligence
    into operational reliability and customer depth by module.
