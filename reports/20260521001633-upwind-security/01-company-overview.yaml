- id: leadership-board-and-governance-visibility
  title: Leadership, board, and governance visibility
  body: 'Leadership visibility is relatively strong, while governance transparency is only partial. Upwind''s official materials clearly identify Amiram Shachar as co-founder and CEO, with Tal Zur as CTO and Lavi Ferdman leading growth. The public leadership roster also shows a more developed executive bench than an early-stage startup might imply, including Tomer Hadassi, Rinki Sethi, Nadav Naor, Dan Yahav, Max Stevens, and several product and people leaders. That depth matters because it suggests the company has been staffing for scale rather than operating as a founder-only sales story. Public board disclosure is thinner. The About page surfaces key investor voices such as Gili Raanan from Cyberstarts, Saam Motamedi from Greylock, and Gideon Hayden from Leaders Fund, which is enough to establish investor quality and board-level involvement. However, retained sources do not provide a complete picture of independent directors, committees, or formal governance controls, and that gap matters
    more once a private company is valued at $1.5 billion. The result is a mixed governance picture: strong founder-market fit and investor alignment, but still limited public visibility into the formal oversight structure.'
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  tableRefs:
  - TO002
- id: funding-history-scale-and-customer-signals
  title: Funding history, scale, and customer signals
  body: 'Upwind''s capital formation is unusually fast for a company founded in 2022, and public sources now reconcile the path more clearly than the bare headline often suggests. Leaders Fund says the company started with a $30 million seed in September 2022. In September 2023, investor and company materials documented a $50 million financing that brought total disclosed funding to $80 million. In December 2024, the company announced a $100 million Series A led by Craft Ventures, and TechCrunch reported a $900 million post-money valuation. The January 2026 Series B then added $250 million at a $1.5 billion valuation and brought cumulative disclosed funding to $430 million. Those financing events line up with public scale markers: roughly 150 employees at the 2024 round, a plan to nearly double headcount during 2025, and more than 300 employees by the 2026 announcement. The 2026 release also tied the new valuation to 900% revenue growth, 200% logo growth, millions of protected workloads,
    and a visible enterprise customer roster. What remains notably absent is audited revenue, margin, NRR, or pricing disclosure, which makes the scale story directionally strong but still incomplete for underwriting purposes.'
