company:
  name: Upwind Security
chapter:
  number: 1
  title: Company Overview
  summary: Upwind Security is a San Francisco-headquartered, runtime-first cloud security company founded in 2022 by the Spot.io team. Public sources support a funding path from a $30 million 2022 seed to a $250 million Series B in January 2026 at a $1.5 billion valuation, with total disclosed funding of $430 million. The company has real customer traction and expanding product breadth, but public disclosure on audited financials, pricing, and governance remains thin relative to the valuation step-up.
sections:
- id: identity-runtime-thesis-and-footprint
  title: Identity, runtime thesis, and geographic footprint
  body: Upwind Security presents itself as a next-generation cloud and AI security platform built around runtime context rather than static posture snapshots. That identity is consistent across the company's homepage, product pages, investor commentary, and later funding coverage. The core narrative is that modern cloud security teams need to understand what is actually running, exposed, reachable, and connected in production before they can prioritize risk intelligently. The founding story matters because it explains why the company took that position. Upwind was founded in 2022 by Amiram Shachar, Lavi Ferdman, Liran Polak, and Tal Zur after the same team built Spot.io and sold it to NetApp for roughly $450 million in 2020. Public company materials anchor the corporate headquarters in San Francisco, while investor and fundraising sources also show an Israeli operating footprint from the start, including early team concentration in Tel Aviv alongside U.S. operations. That dual footprint
    is important later because it supports both engineering depth and global go-to-market reach, but current public sources are still stronger on headquarters identity than on a precise legal-entity and office-by-office map.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
