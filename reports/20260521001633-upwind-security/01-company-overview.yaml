  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited ARR, revenue by segment, gross margin, burn, and NRR.
    whyItMatters: These metrics are required to judge whether the $1.5B valuation is supported by operating quality rather than just growth narrative.
    diligencePath: Request management financials, board materials, and KPI dashboards for FY2024-FY2026.
    relatedQuestionRefs:
    - QO022
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board composition, committee structure, observer rights, and control terms.
    whyItMatters: A company valued at unicorn scale should be assessed on governance quality, not just founder pedigree and investor brand.
    diligencePath: Request board roster, committee charters, information-rights schedule, and financing docs.
    relatedQuestionRefs:
    - QO007
    - QO025
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: minor
    topic: pricing
    missingEvidence: Public pricing, packaging, or monetization detail beyond enterprise-sales positioning.
    whyItMatters: Without pricing transparency, later unit-economics and revenue-quality work depends on private diligence.
    diligencePath: Request pricing books, discount policies, and module attach-rate data.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: minor
    topic: capital-structure
    missingEvidence: Debt, secondary transactions, liquidation preferences, and current ownership concentration.
    whyItMatters: Public headlines support funding size but not the actual economic stack behind the preferred equity.
    diligencePath: Request cap table, financing documents, and any secondary-sale history.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO003
