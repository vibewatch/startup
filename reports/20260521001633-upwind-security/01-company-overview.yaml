  title: Founder-market fit is unusually strong
  body: Upwind is not a first-time team experimenting with a new category. The founders previously built Spot.io, operated at cloud scale, and recycled that cloud-operations expertise into a runtime-first security thesis that investors and customers appear to understand.
  claimRefs:
