companyProfile:
  summary: 'Upwind Security is a private, runtime-first cloud security company founded by the Spot.io team. The platform spans CNAPP, runtime detection and response, vulnerability prioritization, API security, AI security, and adjacent cloud-security workflows for enterprise cloud operators. Public evidence supports strong momentum: a $250 million Series B at a $1.5 billion valuation in January 2026, total disclosed funding of $430 million, more than 300 employees, named enterprise customers, and broadening product scope. What remains incomplete is the financial quality layer behind that narrative.'
