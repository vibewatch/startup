  topStrengths:
    - 以 runtime 为先的产品定位，并向 CNAPP、威胁检测、API、AI 和漏洞工作流扩展成更宽平台。
    - 企业客户证据可见，包括具名 logo、案例研究，以及生产部署中的公开结果声明。
