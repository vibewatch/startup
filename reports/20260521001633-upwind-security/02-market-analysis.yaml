- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Rising cyber threats and cloud attack surface
    - Driver
    - Current / structural
    - Supports ongoing demand for CNAPP and runtime prioritization
    - Ask which threat classes most consistently open budget
  - - Remote work and distributed development
    - Driver
    - Current / structural
    - Increases pressure on centralized cloud and app-security controls
    - Measure which buyer segments are most exposed
  - - Compliance and evidence automation
    - Driver
    - Current / recurring
    - Makes CNAPP valuable to audit and governance teams, not only SOC teams
    - Request win-rate data in regulated sectors
  - - Runtime noise reduction and faster MTTR
    - Driver
    - Current / operational
    - Customer proof shows prioritization gains can justify consolidation spend
    - Ask for pre/post alert and MTTR data
  - - Skill shortage and implementation complexity
    - Constraint
    - Current
    - Can slow rollout or push buyers toward easier but shallower offerings
    - Request time-to-value by deployment model
  - - Changing regulations
    - Constraint
    - Current / ongoing
    - Creates demand but also raises the cost of keeping controls current
    - Ask how often framework updates change product effort
  - - Deployment-model friction
    - Constraint
    - Current
    - Architecture choice can slow adoption if customers perceive sensors as burdensome
    - Request win-loss notes on agentless-first objections
  - - Low public pricing transparency
    - Constraint
    - Current
    - Hard to benchmark category economics from public data alone
    - Request realized pricing, discounts, and services attach
  notes: The table preserves both why the market is growing and why that growth does not automatically translate into frictionless adoption or clean public valuation inputs.
