- id: buyers
  title: Buyers, Payers, and Adoption Path
  body: Public customer evidence shows that this is rarely a one-person purchase. H2O.ai said security bought the product but DevOps became a major user. People.ai described security, engineering, audit, and compliance teams using the same runtime and reporting surface. CallRail shows governance teams can also be direct stakeholders. The adoption path is often easier when the platform can attach to an existing cloud workflow. CloudTrail integration supports agentless monitoring, compliance automation, and investigations as a lighter entry point. AWS Competency validation and the EKS add-on then reduce trust and deployment friction because buyers can discover and deploy through familiar AWS routes. In practice, adoption starts with one acute pain—alert fatigue, weak prioritization, compliance evidence, or lack of runtime visibility—and expands only if the platform helps security and platform teams work from one operating picture.
  claimRefs:
  - CM010
  - CM011
  - CM030
  - CM031
  - CM032
  - CM033
  - CM035
