company:
  name: Upwind Security
chapter:
  number: 2
  title: Market Analysis
  summary: Upwind sells into a converging cloud-security market rather than one narrow tool category. Public data supports a roughly $15.4B global CNAPP market in 2026 growing at about 19% CAGR, while customer proof suggests the most serviceable wedge is large-enterprise and regulated teams that need runtime context, compliance evidence, and tool consolidation across security and platform engineering. The opportunity is real, but public SAM, SOM, and pricing data remain too thin to underwrite one clean share story without management data.
sections:
- id: market-boundary
  title: Market Boundary and Included Spend
  body: 'Upwind belongs in CNAPP, but the practical buying boundary is wider than one acronym. Gartner, TBRC, and Dell’Oro all frame CNAPP as lifecycle security for cloud-native infrastructure and applications. Upwind’s own pages map directly into that logic: posture, runtime detection, vulnerability prioritization, API security, and now AI-specific controls. The integrations page widens the economic boundary further into CI/CD, IAM, SIEM, SOAR, and vulnerability-response workflows because those systems shape how budgets are actually spent. Included spend therefore means more than scanner subscriptions. It includes the workflows and adjacent controls buyers collapse into one platform when they want fewer tools and better prioritization. The excluded buckets are stand-alone tools that never connect visibility, prioritization, and action into one operating loop.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
  - CM013
  - CM023
  tableRefs:
