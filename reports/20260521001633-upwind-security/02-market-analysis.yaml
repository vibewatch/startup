- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Large cloud-native enterprise
    - CISO, head of cloud security
    - Cloud security engineers, SOC, response teams
    - Central security budget
    - Prioritize exploitable risk and reduce noise
    - CISO / security operations
    - Need runtime context to cut alert fatigue
  - - Platform engineering and DevSecOps
    - Platform VP, DevSecOps lead
    - SREs, platform engineers, developers
    - Shared platform and security budget
    - Connect CI/CD, runtime, and remediation
    - Platform engineering with security sponsor
    - Tool sprawl and need for one workflow
  - - Regulated SaaS or data-heavy companies
    - CISO, compliance leader
    - Security, audit, governance, engineering
    - Shared security and compliance budget
    - Continuous evidence and policy remediation
    - Compliance and security shared owner
    - SOC, HIPAA, PCI, or certification overhead
  - - AWS-centric infrastructure teams
    - Cloud platform lead, security architect
    - Cloud engineers, security operations
    - Cloud and security budget
    - Start with CloudTrail or marketplace deployment, then expand
    - Cloud platform plus security
    - Existing AWS route lowers trust and rollout friction
  - - Industrial and hybrid operators
    - Cyber leader, infra owner
    - Ops, DevOps, security teams
    - Security modernization budget
    - Secure AKS/EKS and hybrid services with identity and traffic context
    - Security leader with platform partner
    - Need runtime visibility without slowing operations
  - - Security plus engineering coalition
    - Security buys, engineering influences
    - Security, DevOps, engineering together
    - Security budget plus engineering time
    - Shared interface for prioritization, topology, compliance, and remediation
    - Cross-functional group
    - Fragmented tooling makes current workflows inefficient
  notes: The map centers on the buying coalition rather than seat count. Public case studies show Upwind is easiest to adopt when security, platform, and audit teams share the same problem.
