- id: drivers-and-constraints
  title: Growth Drivers, Constraints, and Gaps
  body: 'The retained evidence supports strong demand drivers, but it also preserves real friction. Market reports point to rising cyber threats, remote and cloud-heavy operating models, and compliance pressure. Upwind’s customer evidence translates those themes into concrete value: H2O.ai cited more than 90% noise reduction and 10x faster root-cause work, while Petrofac cited a 98% alert reduction in AKS. Those are the outcomes that justify consolidation budgets. The constraints are also visible. MarketsandMarkets flags skill shortages, regulatory change, and CNAPP complexity, while People.ai’s writeup shows how deployment-model decisions can create or remove friction. PeerSpot adds a second counterpoint by saying Check Point offers broader support and more competitive pricing while Upwind may require a higher initial investment. Another caution is that public success stories emphasize operational wins, not contract size, renewals, or payback periods. The result is favorable but not clean: growth is obvious, pricing is opaque, and segment-specific share data is still too limited for precise underwriting.'
