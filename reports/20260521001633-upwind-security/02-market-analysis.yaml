tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Core CNAPP platform
    - Posture, runtime detection, vulnerability prioritization, cloud asset graph, response workflows
    - Stand-alone scans or logs with no unified control plane
    - Cloud security leader, CISO budget
    - Core category where Upwind competes most directly
  - - Application and API security adjacency
    - API discovery, app-layer detection, data-flow visibility, schema drift
    - Traditional app testing or gateways without runtime context
    - AppSec leader, shared security/developer budget
    - Upwind explicitly extends CNAPP into app and API layers
  - - AI security adjacency
    - Model, agent, prompt, retrieval-path, and AI-runtime visibility and protection
    - Governance-only tooling with no cloud workload context
    - AI platform owner, security architecture
    - Important adjacency but not the same as core CNAPP
  - - Workflow and control-system integrations
    - CI/CD, IAM, SIEM, SOAR, monitoring, VM response
    - Generic tooling that never participates in cloud-risk remediation
    - Platform engineering, DevSecOps
    - These tools influence who pays and what gets displaced
  - - Regulated compliance operations
    - Continuous control monitoring, evidence generation, reporting, regulated data visibility
    - One-off consulting or audit projects
    - Compliance, risk, audit, security budgets
    - Customer stories show this is a real wedge
  - - Excluded substitute spend
    - N/A
    - Pure network tools, endpoint-only products, isolated logs, or point products with no consolidation motion
    - Existing silo budgets
    - Real substitutes, but not included Upwind TAM unless consolidation occurs
  notes: 'Boundary is convergence-based: include spend that connects cloud visibility, prioritization, and action; exclude adjacent silos when buyers do not consolidate.'
