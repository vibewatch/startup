  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: serviceable-market
    missingEvidence: Runtime-first segment revenue splits, ICP counts, or architecture-specific TAM bridges.
    whyItMatters: Without a serviceable-market bridge, the chapter cannot turn category TAM into an underwriting-quality share thesis.
    diligencePath: Request segmentation by ICP, cloud, module attach, and win rates.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: ai
    missingEvidence: A numeric split between AI-specific security spend and core CNAPP spend.
    whyItMatters: AI adjacency can inflate TAM if it is simply added to CNAPP without a separate frame.
    diligencePath: Ask management and analysts how AI-security bookings are separated from CNAPP contracts.
    relatedQuestionRefs:
    - QM022
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized price bands, discount schedules, and services attach for CNAPP deals.
    whyItMatters: Category pricing power cannot be calibrated from public demo pages and one review-site comparison.
    diligencePath: Request quote logs, average contract values, and module pricing by segment.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM004
