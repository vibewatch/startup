  evidenceGaps:
  - type: missing-source
    severity: material
    topic: regulatory legal risk register coverage
    missingEvidence: Public privacy policy, DPA, subprocessor list, breach-disclosure language, and a fuller vendor-side certification/control package.
    whyItMatters: These documents are necessary to distinguish marketing-grade compliance messaging from enterprise-grade legal and control readiness.
    diligencePath: Obtain privacy policy, DPA, subprocessor register, SOC 2 / ISO reports, and incident-disclosure commitments.
    relatedQuestionRefs:
    - QR006
    - QR007
    - QR025
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: channel concentration
    missingEvidence: Top-partner concentration, AWS-sourced revenue share, and large-account concentration by ARR.
    whyItMatters: Public sources make partner leverage visible but do not show how concentrated the commercial engine is in practice.
    diligencePath: Request top-10 partner ARR share, AWS marketplace / AWS-procured revenue, and top-10 customer ARR share.
    relatedQuestionRefs:
    - QR012
    - QR024
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: growth-quality-opacity
    missingEvidence: ARR, NRR, gross margin, burn, contract length, discounting policy, and support-cost visibility.
    whyItMatters: Without these metrics, the jump from rapid growth narrative to durable enterprise economics cannot be underwritten confidently.
    diligencePath: Request KPI dashboards, pricing books, cohort retention, gross-margin bridges, and support-capacity metrics.
    relatedQuestionRefs:
    - QR018
    - QR026
    - QR030
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: minor
    topic: independent-review-depth
    missingEvidence: A broader and more verified independent customer-review base plus a public incident / uptime history.
    whyItMatters: Sparse external proof can hide support or implementation issues until renewals mature, especially in enterprise security.
    diligencePath: Collect direct references outside marketing case studies and review any private support / uptime dashboards.
    relatedQuestionRefs:
    - QR009
    - QR010
    - QR027
    relatedTableRefs:
    - TR002
