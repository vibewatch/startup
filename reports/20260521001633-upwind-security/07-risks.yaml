  rows:
  - - AWS Security Competency annual validation
    - AWS ecosystem / global enterprise buyers
    - Active and public
    - Medium
    - High
    - Annual AWS review and competency requirements, including compliance/privacy categories
    - Loss of status or control deficiencies would hurt enterprise credibility and partner leverage
    - Verify current competency scope, audit cadence, and any remediation findings with AWS
  - - Public privacy / DPA / subprocessor disclosure gap
    - Global privacy and enterprise contracting
    - Unresolved in retained public corpus
    - High
    - High
    - Company markets compliance use cases and AWS validation
    - Enterprise diligence may stall if legal docs and processor details are unavailable or incomplete
    - Request privacy policy, DPA, subprocessor list, breach-notice terms, and data-residency controls
  - - Customer compliance story exceeds vendor-control evidence
    - Regulated customers globally
    - Active marketing risk
    - Medium
    - High
    - Case studies show HIPAA / PCI / SOC workflows for customers
    - Buyers may overread customer use-case evidence as proof of vendor-side certifications
    - Map every public compliance claim to actual vendor certifications and third-party audits
  - - AI security governance and data-handling obligations
    - US / EU / global
    - Emerging
    - Medium
    - Medium-High
    - AI-security platform positioning and runtime context controls
    - Future AI governance requirements may move faster than current control disclosures
    - Request model-handling, logging, retention, and red-team documentation for AI features
  - - AWS contractual wrapper dependence through Security Hub
    - AWS commercial environments
    - Active
    - Medium
    - Medium
    - One contract / one bill simplifies procurement
    - Pricing, support, and commercial leverage may concentrate with AWS over time
    - Quantify AWS-procured contracts, renewal terms, and any exclusivity or unfavorable change clauses
