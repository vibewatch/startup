- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Deployment friction / sensor coverage
    - POC-to-production conversion and time-to-full-coverage
    - If materially slower than management claims or if large accounts cannot reach broad coverage
    - Treat GTM efficiency assumptions as impaired and re-underwrite sales-cycle and expansion timing
  - - Support scaling
    - Enterprise escalation load, SLA misses, and implementation backlogs
    - Repeated customer-success failures in marquee accounts or rising adverse review themes
    - Assume weaker renewal quality and slower enterprise scaling
  - - AWS / channel dependency
    - AWS-sourced revenue share and top-partner concentration
    - If AWS or top partners represent a double-digit share each without strong contractual protection
    - Increase concentration discount and treat commercial leverage as structurally weaker
  - - Competitive platform pressure
    - Win/loss data versus Wiz, PANW, and CrowdStrike; pricing concessions
    - If win rates deteriorate or discounting rises materially
    - Lower confidence in standalone differentiation and gross-margin potential
  - - Legal / control disclosure gap
    - Availability of privacy policy, DPA, subprocessor list, certifications, and incident disclosures
    - If diligence cannot obtain current legal/control docs quickly
    - Delay investment or condition it on control-package delivery
  - - Growth quality opacity
    - NRR, GRR, contract length, and support-cost visibility
    - If retention and pricing data remain unavailable after deeper diligence
    - Treat valuation support as incomplete and move to a higher-risk diligence posture
  notes: These are the highest-signal public kill criteria because they translate abstract product and market risk into measurable diligence asks. None are publicly resolved as of the run date.
