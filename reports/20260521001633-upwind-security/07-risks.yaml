- id: platform-and-operational-risks
  title: Platform and operational risks
  body: 'The operating model is powerful, but it raises execution expectations. Upwind sells a combined agentless-plus-runtime approach that now stretches across CloudTrail, GitHub Actions, EKS add-ons, AI security, and vulnerability reachability. That breadth is central to the value proposition, but it also means product quality must remain high across a growing set of integrations and control points. TechCrunch makes the first operational risk explicit: early customers were hesitant about agents. The product pages then make a second risk explicit in the opposite direction: Upwind publicly promises to focus customers on the 5% of risks that matter, to enable 7x faster remediation, and to deliver fewer irrelevant CVEs. Those are strong claims that set a demanding baseline for precision, support, and rollout quality. Waste Management''s quote, plus customer case studies in prior chapters, show that enterprise users will expect those gains to hold up in production. If signal quality drifts,
    if sensors cannot be rolled out broadly, or if support capacity lags deployment complexity, trust can erode quickly in a market where buyers already compare multiple mature platforms.'
  claimRefs:
