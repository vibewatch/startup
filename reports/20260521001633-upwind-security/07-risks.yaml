    coverage: partial
    basis: The register was built from the retained AWS competency, AWS Security Hub procurement, integration, and official product materials plus market-regulation sources. It captures the clearest public legal and regulatory exposures, but cannot be exhaustive because the source corpus lacks full legal-policy disclosure.
  notes: This table emphasizes what can be verified publicly and treats missing legal-policy documentation itself as a risk. Ratings are qualitative and anchored to diligence relevance rather than to a disclosed incident history.
