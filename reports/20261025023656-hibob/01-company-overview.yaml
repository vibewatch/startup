      - [Salesforce, "Lead investor in 2026 financing", "Strategic capital and ecosystem relationship", "Confirm rights, commercial commitments and information access"]
      - [Farallon Capital Management, "Existing investor participating in 2026 round", "Continuing financial sponsor", "Confirm ownership, follow-on participation and governance rights"]
      - [General Atlantic, Earlier backer, "Historical institutional capital", "Confirm current ownership and board representation"]
      - [Bessemer Venture Partners, Earlier backer, "Historical institutional capital", "Confirm current ownership and board representation"]
      - [Mosaic, "Acquired FP&A platform", "Adds finance-planning capability and integration dependency", "Validate product integration, retention and customer transition"]
      - [Pento, "Acquired UK payroll automation platform", "Adds payroll capability and country-specific execution dependency", "Validate payroll reliability, regulatory coverage and migration outcomes"]
    notes: The map combines explicitly named investors with acquired operating stakeholders; it is not a cap table and does not infer control from participation alone.
    enumerationScope:
      coverage: partial
      basis: "Named investors and acquired businesses appearing in assigned financing, company-profile and acquisition reporting"
    claimRefs: [CO008, CO011, CO012]
