callouts:
  - calloutType: strength
    title: Strategic expansion
    body: The financing and acquisition sequence shows a deliberate expansion from core HR into payroll, organizational intelligence and finance-adjacent planning.
    claimRefs: [CO002, CO010, CO011, CO012]
  - calloutType: risk
    title: Metrics need reconciliation
    body: The evidence contains materially different revenue, ARR, headcount, customer and total-funding figures across periods; underwriting should not combine them without a management-provided bridge.
    claimRefs: [CO008, CO009, CO013, CO014]
  - calloutType: assumption
    title: Governance remains under-disclosed
    body: The assigned sources identify founders and investors but do not establish a current board roster, ownership table, succession plan or preference stack.
    claimRefs: [CO005, CO006, CO007]
