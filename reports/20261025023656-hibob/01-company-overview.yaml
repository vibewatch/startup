company:
  name: HiBob
chapter:
  number: 1
  title: Company Overview
  summary: HiBob is a privately held HR software company founded in 2015 that has expanded Bob from core HR into payroll, workforce planning, analytics, AI and finance-adjacent workflows. The September 2026 financing reports a $3.2 billion valuation and roughly $700 million of cumulative capital, but the evidence remains mixed on current headcount, customer count and revenue because different sources report different periods and definitions.
sections:
  - id: identity-and-platform
    title: Identity, product and operating footprint
    body: HiBob was founded in Tel Aviv in 2015 and is headquartered in London, while other sources describe New York as its US headquarters and a distributed footprint spanning Europe, Israel, Australia and North America. Bob is a cloud HCM/HRIS product for mid-market and multinational employers, combining employee records and self-service with talent, performance, compensation, workforce planning, payroll, benefits, analytics, integrations and AI-assisted workflows. The product strategy is moving beyond an HR system of record toward an organizational-intelligence layer that exposes workforce context to other business workflows. This positioning is commercially coherent for international, growing employers, but the chapter should preserve the distinction between company positioning and independently verified operating scale.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership and key-person exposure
    body: Ronni Zehavi is consistently identified as co-founder and CEO, and Israel David as co-founder and CTO. Globes also names Amit Knaani and Andy Bellass among the founders, while the Forbes profile excerpt identifies Zehavi and David, so the founding team should not be reduced to only two people without qualification. The available pool does not provide a current board roster, executive succession plan, ownership table or formal governance disclosures. Zehavi remains the public voice for the organizational-intelligence strategy, making founder continuity a relevant diligence item even though the evidence does not establish a current leadership event or departure.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: capital-and-milestones
    title: Financing, acquisitions and milestone path
    body: "HiBob’s reported financing history shows repeated private rounds and a sharp step-up in the September 2026 mark, followed by product-expansion acquisitions. The latest round was reported as $166 million led by Salesforce with Farallon participating, valuing the company at $3.2 billion versus $2.7 billion in the prior round; SiliconANGLE additionally reported annualized revenue above $400 million and more than 5,500 customers, while Forbes’ September 2025 snapshot reported $197 million of ARR and more than 1,300 employees. These figures are not interchangeable: annualized revenue, ARR, employee count and customer count have different dates and definitions. The Mosaic acquisition extends the platform into FP&A, while Pento expands payroll, creating a broader product surface but also integration and execution dependencies."
    claimRefs: [CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: evidence-gaps-and-investor-readthrough
    title: Scale confidence and unresolved diligence
    body: The evidence supports a well-funded, expanding private HR platform, but not a clean current operating model. A 2026 financing report says total capital is roughly $700 million and annualized revenue topped $400 million; Forbes’ dated snapshot says $197 million ARR in 2025; and earlier reporting summarized by Wikipedia says approximately $574 million had been raised by 2023. These may reflect different dates, definitions or post-round updates rather than a direct contradiction, so the appropriate investor response is reconciliation rather than selecting the largest number. User reviews support usability and breadth but also identify rigid workflows, coarse permissions and reporting constraints, and Software Finder displays a $16-$25 per employee per month starting range that is explicitly subject to customization. Current audited revenue, gross margin, retention, burn, cash, cap table, board valuation bridge and customer concentration remain evidence gaps.
    claimRefs: [CO013, CO014, CO015, CO016]
