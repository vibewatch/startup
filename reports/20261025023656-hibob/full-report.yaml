  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      HiBob's described commercial path runs from workforce data and HR modules through subscriptions and partner-linked
      payroll, while recognized revenue and gross profit remain undisclosed.
    data:
      nodes:
        - id: workforce-data
          label: Workforce data
          detail: People, roles, teams, compensation and organizational context are described as the platform foundation.
        - id: hr-modules
          label: Core HR and modules
          detail: Core HR, onboarding, performance, compensation, analytics and workforce planning.
        - id: payroll-integrations
          label: Payroll and partner integrations
          detail: Native payroll is limited by market; other markets rely on integrations according to independent reviews.
        - id: subscription-contract
          label: Per-employee subscription
          detail: Quote-based pricing varies with headcount and selected modules; realized price is unavailable.
        - id: recognized-revenue
          label: Recognized revenue
          detail: Not disclosed in the assigned evidence pool.
        - id: gross-profit
          label: Gross profit
          detail: Not disclosed; payroll, support and implementation costs require validation.
    claimRefs:
      - CI003
      - CI006
      - CI007
      - CI010
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence supports six connected capability layers, while internal service boundaries and universal package
      availability remain unverified.
    data:
      layers:
        - label: Employee and manager experience
          detail: Feed, self-service, recognition, mobile access, and manager entry points.
          items:
            - name: Daily interaction surfaces
              detail: Employee and manager experiences sit above the shared people record.
        - label: Lifecycle workflows
          detail: Onboarding, offboarding, approvals, time, performance, and compensation processes.
          items:
            - name: Configurable workflow
              detail: Rules and roles operationalize employee changes and recurring cycles.
        - label: Core people record
          detail: Employee, organization, document, permission, and reporting data.
          items:
            - name: HR system of record
              detail: The central record supplies context to downstream workflows.
        - label: Analytics and planning
          detail: Reporting, people analytics, headcount scenarios, and financial workforce planning.
          items:
            - name: Decision layer
              detail: Workforce data is reused for analysis and planning.
        - label: Payroll execution
          detail: Native and partner-connected payroll paths vary by geography.
          items:
            - name: Payroll and Payroll Hub
              detail: Delivery ownership depends on the country and provider arrangement.
        - label: Integration and identity
          detail: Payroll, ATS, ERP, collaboration, learning, and identity connections.
          items:
            - name: External-system connectors
              detail: Okta and Microsoft listings provide concrete interoperability signals.
    approximationNotes: >-
      The ordering groups publicly described capabilities for analysis; it does not claim internal service boundaries,
      data-flow direction, or common package inclusion.
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE007
      - CE011
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      The evidence supports a six-stage path from buyer fit and implementation through daily use, module expansion, and
      adjacent workflow reach.
    data:
      items:
        - label: 1. Select
          detail: A scaling or multinational employer selects Bob for modern core HR and global people operations.
          touchpoints:
            - HR and finance evaluation
            - Payroll and integration diligence
        - label: 2. Implement
          detail: Third-party indicators place implementation around two to four months, depending on scope.
          touchpoints:
            - Professional services
            - Data migration
            - Policy configuration
        - label: 3. Centralize
          detail: Employee records, onboarding, time off, reporting, and manager workflows move into Bob.
          touchpoints:
            - HR administration
            - Manager self-service
            - Employee portal
        - label: 4. Adopt
          detail: Ease of use and a large review footprint support employee and administrator engagement.
          touchpoints:
            - Daily navigation
            - Approvals
            - Reporting
        - label: 5. Expand
          detail: Per-employee pricing and add-on modules create headcount and cross-sell expansion surfaces.
          touchpoints:
            - Performance
            - Compensation
            - Planning
            - Payroll
        - label: 6. Extend
          detail: The stated platform direction brings workforce context into collaboration, CRM, finance, and operations.
          touchpoints:
            - Integrations
            - Agents
            - Cross-functional workflows
    approximationNotes: >-
      Stages synthesize the observed adoption mechanism; they do not represent measured conversion rates or a shared
      customer cohort.
    claimRefs:
      - CU014
      - CU015
      - CU016
