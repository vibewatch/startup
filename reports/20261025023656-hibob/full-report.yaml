              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.2'
        title: Founders, leadership and key-person exposure
        blocks:
          - type: paragraph
            body: >-
              Ronni Zehavi is consistently identified as co-founder and CEO, and Israel David as co-founder and CTO.
              Globes also names Amit Knaani and Andy Bellass among the founders, while the Forbes profile excerpt
              identifies Zehavi and David, so the founding team should not be reduced to only two people without
              qualification. The available pool does not provide a current board roster, executive succession plan,
              ownership table or formal governance disclosures. Zehavi remains the public voice for the
              organizational-intelligence strategy, making founder continuity a relevant diligence item even though the
              evidence does not establish a current leadership event or departure.
