  - id: TV003
    title: Bull / base / bear scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Revenue and ARR are reconciled above the reported $400M annualized level; growth, NRR, and margin remain
          strong; Salesforce distribution converts.
        - Premium valuation can be defended and upside comes from growth plus strategic platform expansion.
        - AI monetization, permissions, concentration, and integration execution.
        - 'Low-to-medium: requires several unverified conditions.'
      - - Base
        - The reported round and product traction are real, but audited operating metrics and terms remain unavailable.
        - Track and wait for a price or disclosure reset; do not model a precise return.
        - Opacity, dilution, preference overhang, and multiple compression.
        - 'Medium: best fit to current evidence.'
      - - Bear
        - Growth slows, retention or margins disappoint, or AI positioning does not create paid expansion.
        - A down-round or materially lower entry multiple becomes possible; capital preservation dominates.
        - Commercialization failure, strategic dependence, and liquidity constraints.
        - 'Material: downside is not underwritten away.'
      - - Diligence gate
        - >-
          Obtain audited financials, current cap table, preference terms, cash/runway, NRR, churn, and customer
          concentration.
        - Re-rate only after the missing denominators and rights are verified.
        - Data remains private or inconsistent across disclosures.
        - Required before investment.
    notes: >-
      Scenarios are qualitative because the retained evidence does not support a reliable point valuation,
      probability-weighted return, or target exit price.
    claimRefs:
      - CV003
      - CV005
      - CV012
