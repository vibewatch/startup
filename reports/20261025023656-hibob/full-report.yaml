        - label: 2033 remote workforce-management forecast
          value: 12.8
          unit: USD bn
          detail: QKS Group; 15.8% CAGR from the 2024 base
        - label: HiBob-specific SAM and SOM
          value: Not quantified
          unit: Public evidence gap
          detail: Requires employee-band, geography, module, ACV and penetration inputs
    approximationNotes: >-
