chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product and operating footprint
        blocks:
          - type: paragraph
            body: >-
              HiBob was founded in Tel Aviv in 2015 and is headquartered in London, while other sources describe New
              York as its US headquarters and a distributed footprint spanning Europe, Israel, Australia and North
              America. Bob is a cloud HCM/HRIS product for mid-market and multinational employers, combining employee
              records and self-service with talent, performance, compensation, workforce planning, payroll, benefits,
              analytics, integrations and AI-assisted workflows. The product strategy is moving beyond an HR system of
              record toward an organizational-intelligence layer that exposes workforce context to other business
              workflows. This positioning is commercially coherent for international, growing employers, but the chapter
              should preserve the distinction between company positioning and independently verified operating scale.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
