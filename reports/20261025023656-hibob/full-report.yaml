              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer choice
        blocks:
          - type: paragraph
            body: >
              HiBob sits between lightweight SMB HR tools and enterprise HCM suites. Independent buyer-oriented sources
              place its strongest fit around scaling and multinational organizations, especially employers with roughly
              100 to 5,000 employees, while smaller teams may find implementation and custom pricing burdensome. The
              closest modern-platform alternatives are Personio, BambooHR, and Rippling; Workday and Sage People
              represent broader or heavier enterprise options. The status quo remains spreadsheets, disconnected payroll
              providers, and point tools, while internal build is plausible only for narrow workflows rather than a
              complete HR system. HiBob's own product scope spans core HR, onboarding, performance, compensation,
              analytics, payroll connectivity, and integrations, but public evidence does not establish equal depth or
              availability in every geography or package. Forbes reported more than 4,500 customers and $197 million of
              ARR in 2025, providing a useful scale marker rather than a measure of competitive win rate.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP015
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP015
              - CP016
      - number: '3.2'
        title: Capability, distribution, and commercial trade-offs
        blocks:
          - type: paragraph
            body: >
              HiBob's strongest buyer-facing advantages are a consumer-style interface, employee engagement features,
              configurable workflows, and a broad people-operations surface. Third-party reviews consistently describe
              modern usability and strong onboarding, while also identifying limitations: quote-based pricing,
              implementation fees or effort, connector-based payroll in some markets, and less depth than specialist
              performance products. G2 customer reviews add useful friction signals, including country-specific time-off
              workarounds, manual compensation consolidation, and confusing permissions configuration. Distribution is
              helped by integrations with payroll, ATS, identity, and collaboration tools, but reliance on partners can
              increase implementation and switching complexity. Because public pricing is not transparent and competitor
              pricing evidence is not comparable, the commercial comparison should be treated as a diligence screen
              rather than a cost benchmark.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP014
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >
              HiBob's likely moat is workflow and employee adoption embedded in a shared workforce record, reinforced by
              integrations, payroll connectivity, and an expanding data-and-planning layer. The Salesforce-led September
              2026 financing was described by Globes as supporting a move from a modern HR platform toward an
              organizational-intelligence layer, which could increase strategic relevance if workforce context becomes
              useful across collaboration, CRM, finance, and operations. That direction is not yet proof of durable
              advantage: larger suites can bundle more capabilities, Rippling can combine HR with IT and spend
              administration, and specialist tools can outperform HiBob in areas such as performance management. Apps
              Run The World's 45.6% collective share for the top ten HCM vendors in 2024 underscores incumbent
              distribution pressure. The most credible displacement risks are commoditization of core HR, incumbent
              response, partner dependence, and the cost of migrating workforce data and payroll processes.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP011
              - CP013
      - number: '3.4'
        title: Evidence limits and diligence priorities
        blocks:
          - type: paragraph
            body: >
              Public competitor evidence is uneven. Product and review sources describe capabilities and buyer fit, but
              they do not provide a standardized, audited comparison of realized pricing, retention, implementation
              duration, payroll accuracy, or customer outcomes across vendors. Several matrix cells therefore remain
              unknown rather than inferred. A buyer should request a country-by-country payroll architecture, a complete
              module and implementation quote, reference calls from multinational customers, migration and
              data-portability terms, and evidence of reporting and permissions performance at the intended scale. These
              checks matter because HiBob's strongest positioning depends on adoption and global workflow reliability,
              while its clearest weaknesses are precisely the areas where public comparison evidence is least complete.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is clearest in adoption-oriented HR workflows
            body: >-
              Independent reviews consistently emphasize HiBob's modern interface, culture tools, onboarding, and
              configurable people operations; these are more defensible differentiators than an unsupported claim of
              lowest price or broadest payroll coverage.
            calloutType: strength
            claimRefs:
              - CP006
              - CP007
          - type: callout
            title: Partner dependence can weaken the global-platform claim
            body: >-
              Payroll coverage and integration depth vary by geography, and public sources disagree on how much
              processing is native versus connected. Buyers should treat country-level payroll architecture and total
              implementation cost as gating diligence items.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and revenue quality
        blocks:
          - type: paragraph
            body: >-
              HiBob sells Bob as a cloud HRIS/HCM platform covering core HR, onboarding, performance, compensation,
              analytics, and payroll-related workflows. The company describes Bob as connecting HR, payroll, and
              finance, while independent reviews characterize the product as a subscription platform with quote-based,
              employee-count and module-dependent pricing. That is a credible recurring-revenue mechanism, but the
              assigned evidence does not establish realized price, contract duration, discounting, deferred revenue,
              revenue recognition, ARR definition, or revenue mix. Third-party price points are benchmarks or estimates,
              not HiBob reported revenue. The practical revenue-quality question is whether the premium UX and analytics
              support durable expansion after customers add modules, while integration-led payroll creates
              implementation and support dependencies.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI009
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI005
              - CI007
              - CI009
      - number: '4.2'
        title: Unit economics and cost drivers
        blocks:
          - type: paragraph
            body: >-
              Public material describes the commercial cost stack more clearly than the operating cost stack.
              Subscription fees scale with headcount and selected modules; performance, compensation, time and
              attendance, implementation, and support can increase total cost of ownership. HiBob's native payroll
              coverage is geographically limited in the independent material, so customers in other markets may require
              third-party payroll integrations and the associated reconciliation, support, and failure-management
              burden. An independent review estimates a 60-to-120-day implementation window, which makes onboarding
              effort and partner execution relevant to sales efficiency and gross margin. No retained source supplies
              CAC, payback, gross margin, churn, NRR, support cost per account, or services contribution; those are
              underwriting blockers, not zeroes.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI010
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI010
              - CI012
              - CI015
              - CI016
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              HiBob announced a $166 million investment in September 2026, led by Salesforce, while the announcement
              also said the platform served more than 5,500 customers, but this remains a company-issued operating
              metric rather than audited financial disclosure. The round demonstrates access to fresh financing, yet
              funding raised is not cash on hand and does not reveal burn or runway. The assigned pool contains no
              current cash balance, debt schedule, covenant data, operating loss, or planned use of funds. As a result,
              the financial verdict is provisional: the model appears commercially scalable, but capital adequacy and
              margin path cannot be underwritten until management supplies an audited or board-level bridge from
              bookings and ARR to recognized revenue, gross profit, cash, and forward burn. SaaS market benchmarks
              reinforce why growth, retention, and profitability need to be measured directly rather than inferred from
              the financing headline.
            claimRefs:
              - CI002
              - CI011
              - CI013
              - CI014
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI006
              - CI007
              - CI010
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scalable commercial architecture
            body: >-
              The product is positioned as a recurring, per-employee platform with multiple attachable modules, creating
              a plausible expansion path if retention and implementation economics hold.
            calloutType: strength
            claimRefs:
              - CI003
              - CI004
              - CI007
          - type: callout
            title: Financing is not runway
            body: >-
              The $166 million financing announcement improves reported capital access, but without cash, burn, debt and
              use-of-funds data it cannot establish solvency horizon or remove financing dependency.
            calloutType: risk
            claimRefs:
              - CI002
              - CI013
              - CI015
          - type: callout
            title: Request the operating bridge
            body: >-
              Underwriting should condition any valuation view on a current ARR-to-revenue bridge, cohort retention,
              gross margin, customer concentration, cash, burn and runway schedule.
            calloutType: recommendation
            claimRefs:
              - CI010
              - CI012
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product in the customer workflow
        blocks:
          - type: paragraph
            body: >
              HiBob's Bob platform is positioned as more than a personnel database. Mercer describes a core HR product
              with a people directory, onboarding, automated workflows, analytics, and an employee-facing feed, while
              The CFO Platform places it above payroll and ERP as the HR system of record and planning layer. In
              practical workflow terms, HR administers records and lifecycle events; managers run reviews, compensation
              and approvals; employees use self-service, time, communication and engagement surfaces; and finance
              consumes headcount and planning data. The assigned sources also describe performance, compensation,
              workforce planning, time and payroll capabilities, but a feature mention does not establish inclusion in
              every contract or country. The investable product thesis is therefore connected workflow breadth, not
              universal native delivery.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE007
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE007
              - CE010
              - CE011
              - CE015
      - number: '5.2'
        title: Architecture, integrations, and deployment
        blocks:
          - type: paragraph
            body: >
              Public evidence supports a layered operating model: core people data anchors workflow and analytics
              modules, while external systems extend payroll, recruiting, collaboration, finance, and identity. Mercer
              and The CFO Platform both describe more than 100 integrations. Okta separately documents authentication
              and provisioning functions including SAML, OIDC, SCIM, create, update, and deactivation, and Microsoft's
              marketplace describes Bob actions inside Teams. G2 displays 119 integrations and a two-month average
              implementation time, but those values are marketplace aggregates rather than audited deployment
              commitments. Architecture risk concentrates at the seams: permissions, source-data quality, country
              mappings, API behavior, partner uptime, reconciliation, and customer configuration. A live proof of
              concept should therefore test lifecycle changes end to end rather than merely confirm that connector names
              appear in a marketplace.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
              - CE011
      - number: '5.3'
        title: Maturity, differentiation, and trust boundaries
        blocks:
          - type: paragraph
            body: >
              The strongest differentiation signal is the combination of a consumer-oriented interface, multinational
              configuration, and shared workforce data across HR, finance, and employee workflows. G2's feature data
              records reviewer-derived API, internationalization, access-management, performance, and scalability
              scores, while recent user testimony supports usability but identifies workarounds for local leave rules
              and gaps in compensation workflows. HR Software reports native UK payroll, partner dependence elsewhere,
              and no native global EOR, which makes the native-versus-integrated boundary a material product risk. The
              same review lists SOC 2 Type II, ISO 27001, GDPR, and HIPAA based on vendor security documentation, but
              the assigned pool does not contain the underlying assurance reports. Buyers should require current control
              reports, incident and uptime history, country-by-country delivery ownership, data-flow diagrams, support
              SLAs, and production references before treating breadth as proven technical maturity.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Connected workflow is the product thesis
            body: >-
              The evidence supports a broad HR operating layer that joins people records, lifecycle workflows,
              analytics, planning, and external systems rather than a standalone point solution.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE005
          - type: callout
            title: Product breadth exceeds public assurance depth
            body: >-
              Payroll geography, package inclusion, implementation outcomes, security-control effectiveness, uptime,
              incident history, and connector resilience require private diligence and production testing.
            calloutType: risk
            claimRefs:
              - CE011
              - CE013
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying roles
        blocks:
          - type: paragraph
            body: >-
              Public profiles consistently position Bob for growing, mid-sized, and multinational employers rather than
              a single narrow vertical. ERP Research divides the served base into Growth customers below 200 employees,
              Scale customers with 200–1,000 employees, and Enterprise customers above 1,000 employees; G2 describes a
              broader design range of 100 to 5,000+ employees. The economic buyer is generally the employer, with HR and
              people teams administering the system and managers, employees, finance, payroll, and IT participating in
              workflows. These descriptions establish target fit, not the actual distribution of customers or revenue by
              segment, geography, or vertical.
            claimRefs:
              - CU002
              - CU003
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU003
              - CU013
      - number: '6.2'
        title: Adoption scale and named customer proof
        blocks:
          - type: paragraph
            body: >-
              The strongest public scale disclosure is ERP Research's August 2026 report of 5,000+ customer companies
              and more than 1.23 million people managed on Bob. Forbes provides an earlier reference point of more than
              4,500 customers as of September 2025, but the two publisher snapshots should not be converted into a
              precise growth rate because neither source supplies reconciled definitions or a continuous series. G2's
              4.5 rating across 2,628 reviews adds a broad user-sentiment signal. Named examples are more specific about
              workflow use: retained sources describe Montu, VaynerMedia, Fiverr, and Monzo, although most outcomes
              remain vendor-derived or lack production-status and renewal evidence.
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU004
              - CU005
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.3'
        title: Durability and global rollout friction
        blocks:
          - type: paragraph
            body: >-
              Review evidence is favorable on usability, but it does not establish durable economics. G2's synthesis
              highlights intuitive navigation and simpler HR processes, while individual reviewers identify
              country-specific leave, payroll, compensation, and configuration gaps. One reviewer described the
              compensation module as incomplete and questioned renewal at its price point; that is a concrete adverse
              signal, not evidence of portfolio-wide churn. Public sources do not disclose NRR, GRR, logo churn, renewal
              rates, contract length, customer concentration, or revenue exposure by segment. These missing measures
              prevent a reliable judgment on whether broad adoption translates into durable, low-concentration recurring
              revenue.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU014
      - number: '6.4'
        title: Expansion paths and procurement implications
        blocks:
          - type: paragraph
            body: >-
              HiBob has a plausible land-and-expand mechanism because pricing is quote-based per employee and major
              capabilities are sold as modules. Headcount growth can increase the seat base, while payroll, performance,
              learning, hiring, workforce planning, compensation, analytics, and finance-related workflows create
              cross-sell surfaces. Globes reports the company's stated ambition to carry workforce context into
              collaboration, CRM, finance, and operations, extending Bob beyond a standalone HR application. Expansion
              is not frictionless: third-party implementation indicators range from a two-month G2 average to a 60–120
              day professional-services window, and buyers must validate total implementation fees, regional payroll
              dependencies, and module-level renewal behavior.
            claimRefs:
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption is visible across multiple signals
            body: >-
              Customer-company counts, people-managed scale, named deployments, and thousands of reviews collectively
              support real market adoption, even though the measures are not a reconciled operating series.
            calloutType: strength
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU009
              - CU010
              - CU011
              - CU012
          - type: callout
            title: Global fit still requires local workarounds
            body: >-
              Reviewers report country-specific policy and payroll limitations, while one compensation-module user
              questioned renewal relative to functionality.
            calloutType: risk
            claimRefs:
              - CU007
              - CU008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              HiBob operates in a category where payroll reporting, employment-tax calculation, and employee records
              create jurisdiction-specific obligations. The IRS states that employers must deposit and report withheld
              federal income tax, Social Security and Medicare taxes, and federal unemployment tax, while HMRC guidance
              requires payroll software to record pay, calculate deductions, produce payslips, and report pay and
              deductions in a Full Payment Submission. These are customer-facing compliance dependencies, not proof that
              HiBob itself performs every regulated step in every country. The UK ICO separately identifies worker
              health information, monitoring, recruitment profiling, and employment records as areas requiring
              data-protection guidance. HiBob's risk is therefore less a single disclosed enforcement event than the
              breadth of controls, data-processing terms, auditability, and local compliance responsibilities that must
              work across implementations. No assigned source establishes a current HiBob enforcement action or
              litigation outcome; that absence is a diligence gap, not evidence that none exists.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Independent product reviews describe a capable but integration-dependent system. HR Software says HiBob
              relies on third-party integrations for global payroll outside the UK and that enterprise deployments can
              require complex integrations with providers such as ADP. A separate review characterizes global payroll as
              partial and says buyers should verify country-specific delivery, while also noting that pricing and
              implementation fees require confirmation. User reviews provide adverse operating signals: complaints
              describe delayed support, unresolved bugs, disputed sales promises, and difficult transitions after the
              Pento acquisition, while other users report smooth implementations and responsive support. The risk is
              uneven execution: a customer may receive a good core-HRIS experience while payroll, reporting,
              configuration, or transition work creates material operational exposure. A pilot should test audit trails,
              error correction, payroll handoffs, access controls, support escalation, and recovery procedures rather
              than relying on interface quality or certifications asserted by vendors.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR010
              - CR014
              - CR015
      - number: '7.3'
        title: Dependency, financial, and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              HiBob's operating model has visible dependencies on payroll providers, implementation capacity, and
              customer-success execution. The assigned reviews describe quote-based modular pricing, country-by-country
              payroll boundaries, and integration work; Trustpilot complaints add customer-reported transition and
              cancellation friction. Forbes reports $197 million of ARR in 2025, and Globes reports a $166 million
              financing completed in September 2026. Those are different metrics: funding raised is not cash available,
              and neither source establishes current cash, burn, gross margin, or runway. The investable thesis should
              break or be re-underwritten if payroll errors or missed filings recur, material customer data incidents
              occur, transition-related complaints remain unresolved, implementation time or total cost materially
              exceeds the written quote, or current financial disclosures show insufficient liquidity for the product
              and support footprint. Monitoring must therefore combine customer-facing control tests with private
              financial diligence rather than treating new financing as proof of operating resilience.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority risk
            body: >-
              Payroll and employee-data controls deserve the highest diligence priority because a failure can create
              regulatory, customer, and reputational damage at the same time, while public evidence does not verify
              HiBob's control performance across all supported jurisdictions.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
          - type: callout
            title: Kill criteria
            body: >-
              Re-underwrite or pause the thesis if a pilot exposes unreconciled payroll changes, repeated missed support
              commitments, material transition failures, a reportable data incident, or a written quote whose
              implementation and recurring cost materially exceed the approved case.
            calloutType: recommendation
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports track rather than buy. HiBob completed a $166 million growth financing led by
              Salesforce on September 1, 2026, and multiple reports place the post-money valuation at about $3.2
              billion, up from approximately $2.7 billion in the prior round. The financing is a strong strategic
              signal: Salesforce is backing an HR platform positioned as an organizational-intelligence layer for AI
              workflows. It is not, by itself, proof that the new price is supported by audited revenue, durable net
              retention, gross margin, cash generation, or favorable investor preferences. The most decision-relevant
              public operating figure is management's more-than-$400 million annualized-revenue statement, while other
              sources describe that figure as ARR; the denominator and accounting basis are not independently
              reconciled. At the headline mark, the valuation is therefore stretched on disclosed evidence, with a
              potential path to fair value only if diligence confirms growth, retention, margin, customer concentration,
              and clean capitalization.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV007
              - CV009
              - CV014
      - number: '8.2'
        title: Thesis, anti-thesis, and scenario logic
        blocks:
          - type: paragraph
            body: >-
              The upside thesis is that HiBob can convert a modern mid-market HRIS into a broader workforce-context
              control plane, using its data, integrations, and Salesforce relationship to expand into AI-enabled
              workflows and adjacent planning. Independent market profiles describe a product used across HR, payroll,
              performance, workforce analytics, and financial planning, while current financing coverage links the round
              to an organizational-intelligence strategy. The anti-thesis is that strategic capital and category
              language may be ahead of realized economics: the financing terms, dilution, liquidation preferences,
              current cash position, and audited revenue bridge are not disclosed in the retained evidence. A
              customer-review source also records workflow rigidity and requests for more granular permissions, which
              are relevant when the product is marketed as trusted context for agents. The valuation should move only
              when the operating proof and governance terms catch up with the narrative.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenarios, comparables, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              A scenario range is more defensible than a point estimate because HiBob is private and the public evidence
              mixes company statements, reported financing terms, and secondary market commentary. SaaS Capital's public
              index framework says public ARR multiples are directional and that private multiples are lower, while its
              2025 discussion places the public median in a 6x–8x ARR regime and emphasizes that merely being a SaaS
              company does not earn a premium multiple. This is a benchmark, not a direct HiBob valuation: HiBob's
              reported $3.2 billion mark against management's more-than-$400 million annualized revenue implies roughly
              8x on that unverified denominator, but the calculation is not a substitute for audited ARR, NRR, margin,
              or cash-flow data. The base case is therefore a hold/track decision pending a clean metric bridge; the
              bull case requires sustained growth, retention, and strategic distribution; the bear case is multiple
              compression or a down-round if those metrics or the AI monetization thesis disappoint.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track at the reported mark
            body: >-
              Salesforce validation and product breadth are credible positives, but the evidence does not yet justify
              underwriting a premium private valuation without audited operating metrics and capitalization terms.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV014
          - type: callout
            title: Do not confuse funding with cash available
            body: >-
              The $166 million financing is a disclosed round size, not evidence of current cash balance, runway,
              dilution, or investor preference economics.
            calloutType: risk
            claimRefs:
              - CV002
              - CV009
