  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      HiBob's relative position is strongest where a buyer values modern employee experience and multinational people
      operations, while enterprise breadth and integrated IT scope favor other categories.
    data:
      xAxis: Employee-experience orientation (ordinal 1-5)
      yAxis: Breadth of adjacent enterprise operations (ordinal 1-5)
      points:
        - label: HiBob
          x: 4
          'y': 3
          note: Modern UX and broad people-operations scope; adjacent breadth is expanding
        - label: BambooHR
          x: 4
          'y': 2
          note: Simpler SMB-oriented alternative; broader enterprise scope not established
        - label: Personio
          x: 4
          'y': 3
          note: Modern European HR alternative; relative adjacent breadth not normalized
        - label: Rippling
          x: 3
          'y': 5
          note: HR plus IT and spend administration positioning
        - label: Workday HCM
          x: 2
          'y': 5
