      - number: '1.4'
        title: Scale confidence and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a well-funded, expanding private HR platform, but not a clean current operating
              model. A 2026 financing report says total capital is roughly $700 million and annualized revenue topped
              $400 million; Forbes’ dated snapshot says $197 million ARR in 2025; and earlier reporting summarized by
              Wikipedia says approximately $574 million had been raised by 2023. These may reflect different dates,
              definitions or post-round updates rather than a direct contradiction, so the appropriate investor response
              is reconciliation rather than selecting the largest number. User reviews support usability and breadth but
              also identify rigid workflows, coarse permissions and reporting constraints, and Software Finder displays
              a $16-$25 per employee per month starting range that is explicitly subject to customization. Current
              audited revenue, gross margin, retention, burn, cash, cap table, board valuation bridge and customer
              concentration remain evidence gaps.
