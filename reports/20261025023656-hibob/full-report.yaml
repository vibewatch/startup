      - number: '1.3'
        title: Financing, acquisitions and milestone path
        blocks:
          - type: paragraph
            body: >-
              HiBob’s reported financing history shows repeated private rounds and a sharp step-up in the September 2026
              mark, followed by product-expansion acquisitions. The latest round was reported as $166 million led by
              Salesforce with Farallon participating, valuing the company at $3.2 billion versus $2.7 billion in the
              prior round; SiliconANGLE additionally reported annualized revenue above $400 million and more than 5,500
              customers, while Forbes’ September 2025 snapshot reported $197 million of ARR and more than 1,300
              employees. These figures are not interchangeable: annualized revenue, ARR, employee count and customer
              count have different dates and definitions. The Mosaic acquisition extends the platform into FP&A, while
              Pento expands payroll, creating a broader product surface but also integration and execution dependencies.
            claimRefs:
