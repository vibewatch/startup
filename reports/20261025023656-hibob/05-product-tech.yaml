    rows:
      - [Core HR and people data, "HR and managers", "Documented current capability", "Employee records, organization structures, documents, and lifecycle workflows", "Confirm data model, effective dating, audit history, and edition"]
      - [Onboarding and offboarding, "HR, managers, and employees", "Documented current capability", "Multi-stakeholder task journeys connected to the people record", "Test exceptions, approvals, and country-specific steps"]
      - [Performance and engagement, "Managers and employees", "Documented current capability", "Goals, reviews, feedback, surveys, and employee-facing social surfaces", "Verify production adoption, scheduling, and review-cycle controls"]
      - [Compensation and workforce planning, "HR and finance", "Documented but package-dependent", "Pay workflows and headcount scenarios share workforce data", "Confirm add-on scope, permissions, model lineage, and equity-data handling"]
      - [Payroll and Payroll Hub, "Payroll, HR, and finance", "Native and partner-delivered by geography", "Connects HR changes with payroll execution", "Obtain a country matrix, reconciliation controls, partner SLAs, and support ownership"]
      - [Identity and collaboration integrations, "IT, HR, managers, and employees", "Partner listings verify concrete connectors", "Provisioning and in-flow employee actions extend Bob into work systems", "Test field mappings, deprovisioning, rate limits, logs, and failure recovery"]
    notes: "Scope is synthesized from assigned third-party and partner evidence; availability, package inclusion, and service ownership must be confirmed for each buyer and country."
    claimRefs: [CE001, CE002, CE004, CE006, CE007, CE011]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Prior friction, Bob workflow, Supported benefit, Limitation]
    rows:
      - ["Maintain employee records", "Fragmented files and manual updates", "Central people record, org structure, documents, and self-service", "One operating surface for people data", "No assigned source quantifies error reduction"]
      - ["Bring a new hire into the organization", "Cross-functional onboarding handoffs", "Task-based preboarding and onboarding workflows", "Repeatable ownership across HR, managers, employees, and IT", "Exception rates and implementation effort are unverified"]
      - ["Run talent and pay cycles", "Separate goal, review, and compensation processes", "Performance, calibration, compensation, and planning modules", "Connected manager and finance workflows", "User evidence identifies compensation and localization gaps"]
      - ["Operate across countries", "Different policies, currencies, languages, and payroll providers", "Multi-site configuration plus native and integrated payroll paths", "A shared HR layer across a distributed workforce", "Native payroll and EOR coverage are not universal"]
      - ["Move employee changes into work systems", "Duplicate entry and delayed access changes", "Identity provisioning and Teams-connected actions", "Lifecycle events can reach collaboration and access systems", "Connector presence does not verify mapping quality or resilience"]
    notes: "Benefits are mechanism-level interpretations of the cited workflows; the assigned evidence provides no customer-specific productivity, ROI, or error-rate measurement."
    claimRefs: [CE001, CE003, CE006, CE007, CE010, CE011, CE015]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer, Role, Public evidence, Dependency, Principal risk]
    rows:
      - ["Experience", "Employee and manager entry point", "Feed, self-service, recognition, mobile and manager surfaces", "Usable configuration and adoption", "Feature density or localization gaps can push work outside Bob"]
      - ["Workflow", "Lifecycle, review, compensation, and approval automation", "Onboarding, performance, time, compensation, and planning modules", "Rules, roles, and clean source data", "Complex exceptions may require manual workarounds"]
      - ["People record", "System-of-record foundation", "Employee, organization, document, permission, and reporting capabilities", "Governance, effective dating, and auditability", "Bad mappings can propagate into every connected process"]
      - ["Insight and planning", "Analytics and workforce decisions", "Reporting, people analytics, headcount and financial planning", "Consistent definitions and access controls", "Public evidence does not establish lineage or model validation"]
      - ["Integration and execution", "Payroll, identity, collaboration, ATS, ERP, and other connections", "More than 100 integrations plus concrete Okta and Teams listings", "Third-party APIs, partner uptime, and reconciliation", "Failures at system boundaries can interrupt access or payroll-adjacent workflows"]
    notes: "This is an analytical operating model derived from public capability evidence, not a representation of HiBob's internal software or infrastructure boundaries."
    claimRefs: [CE003, CE005, CE006, CE007, CE008, CE009]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public evidence supports six connected capability layers, while internal service boundaries and universal package availability remain unverified.
    data:
      layers:
        - label: Employee and manager experience
          detail: Feed, self-service, recognition, mobile access, and manager entry points.
          items:
            - name: Daily interaction surfaces
              detail: Employee and manager experiences sit above the shared people record.
        - label: Lifecycle workflows
          detail: Onboarding, offboarding, approvals, time, performance, and compensation processes.
          items:
            - name: Configurable workflow
              detail: Rules and roles operationalize employee changes and recurring cycles.
        - label: Core people record
          detail: Employee, organization, document, permission, and reporting data.
          items:
            - name: HR system of record
              detail: The central record supplies context to downstream workflows.
        - label: Analytics and planning
          detail: Reporting, people analytics, headcount scenarios, and financial workforce planning.
          items:
            - name: Decision layer
              detail: Workforce data is reused for analysis and planning.
        - label: Payroll execution
          detail: Native and partner-connected payroll paths vary by geography.
          items:
            - name: Payroll and Payroll Hub
              detail: Delivery ownership depends on the country and provider arrangement.
        - label: Integration and identity
          detail: Payroll, ATS, ERP, collaboration, learning, and identity connections.
          items:
            - name: External-system connectors
              detail: Okta and Microsoft listings provide concrete interoperability signals.
    approximationNotes: "The ordering groups publicly described capabilities for analysis; it does not claim internal service boundaries, data-flow direction, or common package inclusion."
    claimRefs: [CE003, CE005, CE006, CE007, CE011]
callouts:
  - calloutType: strength
    title: Connected workflow is the product thesis
    body: The evidence supports a broad HR operating layer that joins people records, lifecycle workflows, analytics, planning, and external systems rather than a standalone point solution.
    claimRefs: [CE001, CE003, CE005]
  - calloutType: risk
    title: Product breadth exceeds public assurance depth
    body: Payroll geography, package inclusion, implementation outcomes, security-control effectiveness, uptime, incident history, and connector resilience require private diligence and production testing.
    claimRefs: [CE011, CE013, CE015, CE016]
