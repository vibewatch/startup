chapter:
  number: 5
  title: Product & Technology
  summary: HiBob is a modular HR operating layer built around a core people system, employee and manager workflows, analytics, planning, payroll connections, and a broad integration surface. Independent and partner evidence supports meaningful breadth and usability, but country-level payroll delivery, control assurance, package boundaries, and implementation quality remain diligence-dependent rather than uniformly verified.
sections:
  - id: product-workflow
    title: Product in the customer workflow
    body: |
      HiBob's Bob platform is positioned as more than a personnel database. Mercer describes a core HR product with a people directory, onboarding, automated workflows, analytics, and an employee-facing feed, while The CFO Platform places it above payroll and ERP as the HR system of record and planning layer. In practical workflow terms, HR administers records and lifecycle events; managers run reviews, compensation and approvals; employees use self-service, time, communication and engagement surfaces; and finance consumes headcount and planning data. The assigned sources also describe performance, compensation, workforce planning, time and payroll capabilities, but a feature mention does not establish inclusion in every contract or country. The investable product thesis is therefore connected workflow breadth, not universal native delivery.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-deployment
    title: Architecture, integrations, and deployment
    body: |
      Public evidence supports a layered operating model: core people data anchors workflow and analytics modules, while external systems extend payroll, recruiting, collaboration, finance, and identity. Mercer and The CFO Platform both describe more than 100 integrations. Okta separately documents authentication and provisioning functions including SAML, OIDC, SCIM, create, update, and deactivation, and Microsoft's marketplace describes Bob actions inside Teams. G2 displays 119 integrations and a two-month average implementation time, but those values are marketplace aggregates rather than audited deployment commitments. Architecture risk concentrates at the seams: permissions, source-data quality, country mappings, API behavior, partner uptime, reconciliation, and customer configuration. A live proof of concept should therefore test lifecycle changes end to end rather than merely confirm that connector names appear in a marketplace.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-differentiation-and-trust
    title: Maturity, differentiation, and trust boundaries
    body: |
      The strongest differentiation signal is the combination of a consumer-oriented interface, multinational configuration, and shared workforce data across HR, finance, and employee workflows. G2's feature data records reviewer-derived API, internationalization, access-management, performance, and scalability scores, while recent user testimony supports usability but identifies workarounds for local leave rules and gaps in compensation workflows. HR Software reports native UK payroll, partner dependence elsewhere, and no native global EOR, which makes the native-versus-integrated boundary a material product risk. The same review lists SOC 2 Type II, ISO 27001, GDPR, and HIPAA based on vendor security documentation, but the assigned pool does not contain the underlying assurance reports. Buyers should require current control reports, incident and uptime history, country-by-country delivery ownership, data-flow diagrams, support SLAs, and production references before treating breadth as proven technical maturity.
    claimRefs: [CE010, CE011, CE012, CE013, CE014, CE015, CE016]
