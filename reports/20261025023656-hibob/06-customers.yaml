      - ["Customer companies", "5,000+", "Updated August 2026", "ERP Research", medium, "Later publisher snapshot indicates broad commercial reach", "No reconciled methodology or cohort bridge"]
      - ["People managed on Bob", "More than 1.23 million", "Updated August 2026", "ERP Research", medium, "Shows a large employee-record footprint", "No active-user, seat, or utilization denominator"]
      - ["G2 reviews and rating", "2,628 reviews; 4.5/5", "Archived October 4, 2026", "G2", medium, "Large review volume supports broad user exposure and favorable sentiment", "Reviewers are not a customer-retention cohort"]
    notes: "Publisher-reported snapshots preserve each source's metric name, period, and denominator limitations; they are not combined into a calculated growth rate."
    claimRefs: [CU001, CU004, CU005]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment, Deployment or use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [Montu, "Healthcare; Australia; enterprise", "People data, analytics, and distributed-workforce onboarding", "Published customer story; production status not independently confirmed", "Story reports scaling from 30 to 450 employees in 18 months", "HiBob's causal contribution is not isolated"]
      - [VaynerMedia, "Marketing and creative services", "Replaced a Google Docs-based performance-review process and consolidated people data", "Named customer use; production status not independently confirmed", "Reduced administrative burden is described qualitatively", "No quantified ROI, renewal, or contract evidence"]
      - [Fiverr, "Digital marketplace and technology", "Core HR across onboarding, performance, time off, and people analytics", "Named customer use; production status not independently confirmed", "Multiple independent profiles identify Fiverr as a customer", "No public outcome magnitude or renewal evidence"]
      - [Monzo, "Digital banking and technology", "HR operations for a scaling, technology-first workforce", "Named customer use; production status not independently confirmed", "Profile presents Bob as supporting workforce scale", "No quantified outcome or independent deployment detail"]
    notes: "This is a sample of named customers in retained third-party sources; customer-story outcomes may originate with HiBob or the customer and are not independently audited."
    enumerationScope:
      coverage: sample
      basis: "Named customers found in the assigned prefetched evidence through the 2026-10-25 access date, not a complete customer census."
    claimRefs: [CU009, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: The evidence supports a six-stage path from buyer fit and implementation through daily use, module expansion, and adjacent workflow reach.
    data:
      items:
        - label: "1. Select"
          detail: "A scaling or multinational employer selects Bob for modern core HR and global people operations."
          touchpoints: ["HR and finance evaluation", "Payroll and integration diligence"]
        - label: "2. Implement"
          detail: "Third-party indicators place implementation around two to four months, depending on scope."
          touchpoints: ["Professional services", "Data migration", "Policy configuration"]
        - label: "3. Centralize"
          detail: "Employee records, onboarding, time off, reporting, and manager workflows move into Bob."
          touchpoints: ["HR administration", "Manager self-service", "Employee portal"]
        - label: "4. Adopt"
          detail: "Ease of use and a large review footprint support employee and administrator engagement."
          touchpoints: ["Daily navigation", "Approvals", "Reporting"]
        - label: "5. Expand"
          detail: "Per-employee pricing and add-on modules create headcount and cross-sell expansion surfaces."
          touchpoints: ["Performance", "Compensation", "Planning", "Payroll"]
        - label: "6. Extend"
          detail: "The stated platform direction brings workforce context into collaboration, CRM, finance, and operations."
          touchpoints: ["Integrations", "Agents", "Cross-functional workflows"]
    approximationNotes: "Stages synthesize the observed adoption mechanism; they do not represent measured conversion rates or a shared customer cohort."
    claimRefs: [CU014, CU015, CU016]
