      - ["Enterprise or multi-site employer", "Central HR and finance sponsor; local teams administer", "Multi-site policies, reporting, payroll connections, and workforce planning", "1,000+ employees in ERP Research's taxonomy", "Potential platform standardization across locations", "No disclosed implementation success or renewal cohort"]
      - ["Multinational mid-market employer", "Employer pays; distributed HR, finance, payroll, and employees use", "Localized workflows, currencies, languages, and cross-border reporting", "G2 describes a 100 to 5,000+ employee design range", "Global footprint increases workflow breadth", "Country-specific support varies and customer mix is undisclosed"]
    notes: "Segment bands are third-party product-fit descriptions, not HiBob-disclosed revenue cohorts; gaps identify information absent from the retained public evidence."
    claimRefs: [CU002, CU003, CU013]
  - id: TU002
