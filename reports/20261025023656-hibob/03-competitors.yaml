    title: Feature and capability comparison
    columns: [Buying criterion, HiBob, Personio / BambooHR, Rippling, Enterprise suites, Evidence status]
    rows:
      - [Core HR and employee records, Supported, "Core HR reported", "HR platform reported", "Supported", "HiBob scope is documented; competitor cells are category-level, not audited"]
      - [Onboarding workflows, Supported, "Reported for alternatives", "Reported for alternatives", "Supported", "Independent reviews describe HiBob onboarding"]
      - [Performance management, Supported, "Reported", "Reported", "Supported", "HiBob is described as less deep than dedicated specialists"]
      - [Employee engagement and culture tools, Supported, "Unknown", "Unknown", "Unknown", "HiBob's culture-oriented features are repeatedly described"]
      - [Multi-country HR administration, Supported, "Reported for Personio", "Reported", "Supported", "Country-level legal and service coverage remains a diligence item"]
      - [Payroll delivery, "Native or partner-dependent by market", "Unknown", "Integrated / market-dependent", "Suite-dependent", "Assigned evidence does not establish a normalized country matrix"]
      - [IT device and application management, Unknown, Unknown, Reported, Unknown, "Rippling's broader HR-plus-IT positioning is documented by Viewpoint Analysis"]
      - [Integrations and API, Supported / marketplace and partner connections, Unknown, Reported, Supported, "Exact fields and synchronization behavior require buyer validation"]
      - [Reporting and analytics, Supported, Unknown, Reported, Supported, "G2 reviews identify manual work in some reporting and compensation workflows"]
      - [Security and compliance, "Certifications reported; verify documents", Unknown, Unknown, "Enterprise controls expected; not assessed here", "No cross-vendor evidence pack was assigned"]
    notes: "This is an evidence-status matrix, not a product-quality scorecard. Unknown means the assigned pool did not support a comparable cell."
    claimRefs: [CP006, CP007, CP008, CP009, CP010]
  - id: TP003
    title: Pricing, packaging, and switching implications
    columns: [Alternative or model, Public price evidence, Packaging / contract model, Switching or implementation implication, Diligence status]
    rows:
      - [HiBob, "Quote-based; third-party estimates vary", "Core and add-on modules; implementation may be charged", "Migration of workforce records, workflows, and payroll integrations can raise switching cost", "Obtain a full quote and country plan"]
      - [Personio, Unknown, Unknown, "Comparable workflow migration would still require data and process mapping", "No public assigned price evidence"]
      - [BambooHR, "Relative lower-complexity positioning only", "Unknown", "Potentially simpler for smaller teams; multi-country requirements may limit fit", "Validate total cost and localization"]
      - [Rippling, Unknown, "Broader HR, IT, and spend scope", "Bundling can increase distribution power and make replacement scope broader", "Validate module overlap and data portability"]
      - [Workday / Sage People, "Unknown", "Broader enterprise suites", "Longer implementation and deeper configuration can increase lock-in", "Compare implementation plan and services cost"]
      - [Status quo / internal build, "Internal labor and tools are not priced here", "Local processes and point integrations", "Low initial commitment but ongoing reconciliation and maintenance burden", "Quantify current fully loaded operating cost"]
    notes: "No assigned source provides a standardized, current, apples-to-apples competitor price sheet. Do not interpret quote-based or estimated figures as realized revenue or total cost of ownership."
    claimRefs: [CP008, CP009, CP010, CP014]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: HiBob's relative position is strongest where a buyer values modern employee experience and multinational people operations, while enterprise breadth and integrated IT scope favor other categories.
    data:
      xAxis: "Employee-experience orientation (ordinal 1-5)"
      yAxis: "Breadth of adjacent enterprise operations (ordinal 1-5)"
      points:
        - {label: "HiBob", x: 4, y: 3, note: "Modern UX and broad people-operations scope; adjacent breadth is expanding"}
        - {label: "BambooHR", x: 4, y: 2, note: "Simpler SMB-oriented alternative; broader enterprise scope not established"}
        - {label: "Personio", x: 4, y: 3, note: "Modern European HR alternative; relative adjacent breadth not normalized"}
        - {label: "Rippling", x: 3, y: 5, note: "HR plus IT and spend administration positioning"}
        - {label: "Workday HCM", x: 2, y: 5, note: "Enterprise breadth benchmark; employee-experience score is ordinal, not measured"}
        - {label: "Status quo / internal build", x: 2, y: 1, note: "Local control but limited standardized breadth"}
    notes: "Ordinal coordinates synthesize assigned-source positioning, not a benchmark or market share measurement. They should not be read as quantitative performance scores."
    approximationNotes: "Coordinates are analyst-authored ordinal placements from the cited capability and buyer-fit claims; no numeric competitor benchmark was available."
    claimRefs: [CP002, CP003, CP004, CP005, CP011, CP013]
callouts:
  - calloutType: strength
    title: Differentiation is clearest in adoption-oriented HR workflows
    body: "Independent reviews consistently emphasize HiBob's modern interface, culture tools, onboarding, and configurable people operations; these are more defensible differentiators than an unsupported claim of lowest price or broadest payroll coverage."
    claimRefs: [CP006, CP007]
  - calloutType: risk
    title: Partner dependence can weaken the global-platform claim
    body: "Payroll coverage and integration depth vary by geography, and public sources disagree on how much processing is native versus connected. Buyers should treat country-level payroll architecture and total implementation cost as gating diligence items."
    claimRefs: [CP008, CP009, CP014]
