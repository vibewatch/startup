      - [BambooHR, "SMB HR platform", Unknown, "Smaller and growing teams", "Simpler core HR alternative for buyers prioritizing ease and lower complexity", "Multi-country and advanced process depth versus HiBob not quantified"]
      - [Rippling, "Integrated HR / IT platform", Unknown, "Companies combining HR and IT administration", "Broader HR, IT device/app, and spend administration proposition", "Relative people-experience and global payroll trade-offs not quantified"]
      - [Workday HCM, "Enterprise HCM suite", "Apps Run The World ranks Workday first in the 2024 HCM market", "Large enterprises", "Breadth and scale benchmark for HR, talent, payroll, and planning", "Higher implementation effort and cost are directionally described, not priced"]
      - [Sage People, "Mid-market HCM", Unknown, "Mid-sized multinational businesses", "Deep configuration and global HR coverage on the Salesforce platform", "Heavier implementation than Bob is described but not measured"]
      - [Status quo, "Spreadsheets and disconnected point tools", "Not publicly standardized", "Teams below or before formal HRIS adoption", "Low switching cost at the start and familiar local processes", "Manual reconciliation, fragmented records, and weak cross-system reporting"]
      - [Internal build, "In-house workflows and integrations", "Private cost base", "Organizations with narrow bespoke requirements", "Tailored process control for a limited workflow", "Does not evidence a complete HRIS, payroll, compliance, or support capability"]
    notes: "Competitor roles and limitations are based on assigned independent review and buyer-selection sources; cells without direct comparative evidence are intentionally qualified rather than scored."
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP015, CP016]
