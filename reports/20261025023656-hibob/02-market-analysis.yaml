      - [Distributed or hybrid workforce, "People operations and functional leaders", "Managers and employees using self-service and engagement workflows", "HR transformation or operating budget", "Need for employee adoption, shared records and analytics"]
      - [Payroll-connected deployment, "Payroll/finance lead with HR", "HR administrators and payroll operators", "Finance or payroll budget", "Desire to reduce duplicate data entry while retaining local processors"]
      - [Enterprise expansion, "Global HRIS or transformation leader", "Regional HR and business managers", "Enterprise applications budget", "Need for configurable global policies, integrations and workforce planning"]
    notes: "Buyer roles are an evidence-constrained operating map, not a complete enumeration of HiBob customers; final budget ownership varies by deployment and geography."
