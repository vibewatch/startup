chapter:
  number: 2
  title: Market Analysis
  summary: >-
    HiBob operates in a large, expanding HCM software market, but the relevant opportunity
    is narrower than the headline category: multinational, growth-stage and mid-market
    employers that need configurable HR data, talent workflows, engagement and payroll
    connectivity without enterprise-suite implementation weight. Market estimates support
    structural growth, while buyer evidence points to price opacity, implementation cost and
    native global-payroll gaps as adoption constraints.
sections:
  - id: market-boundary
    title: Market boundary and category position
    body: >-
      The broad category is human-capital-management software spanning core HR, payroll,
      workforce management, recruiting, onboarding, performance, learning and talent
      management. APPS RUN THE WORLD explicitly uses that scope for its HCM market forecast,
      while QKS Group separates core HR and payroll, integrated HCM suites, talent
      management and workforce-management use cases. For HiBob, the investable market is
      not all HR technology spend: it is the subset of recurring software and implementation
      spend purchased by employers that need a shared employee record, configurable
      workflows, employee-facing adoption and multinational administration. The platform's
      own HRIS explanation says an HRIS centralizes payroll, benefits, time tracking and
      people data, but also notes that organizations with fewer than 100 workers may find
      acquisition and maintenance costs difficult to justify. HiBob's practical boundary is
      therefore above very small teams and below the most complex enterprise HCM and native
      global-payroll requirements.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and growth
    body: >-
      Two independent market lenses support a growing category but should not be treated as
      interchangeable TAM figures. APPS RUN THE WORLD reports $58.7 billion of global HCM
      software in 2024 and $81.1 billion in 2029, a 6.7% CAGR, with scope covering core HR,
      payroll, workforce management, recruiting, onboarding, performance, learning and talent
      management. QKS Group gives a comparable order of magnitude, describing about $58.7
      billion in 2024 and a possible $76 billion to $81 billion by 2029, while emphasizing
      digitalization, hybrid work, employee experience, analytics and AI as demand drivers.
      These are category-level estimates, not HiBob revenue or a serviceable market. A
      defensible SAM would require HiBob's target geographies, employee-size bands, modules,
      partner-led payroll coverage and win rates; those inputs are not publicly isolated in
      the assigned evidence.
    claimRefs: [CM005, CM006, CM007, CM008, CM015, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyer segmentation, drivers and constraints
    body: >-
      The most natural buyer is a people or HR operations leader at a growing, often
      multinational organization, with finance and IT/security involved when payroll,
      integrations and data governance are evaluated.       Independent reviews place HiBob's
      strongest fit in the mid-market and describe a broad operating range from roughly
      100 to 5,000 employees. Adoption is pulled by fragmented tools, distributed
      workforces, the need for a single employee record, employee self-service and analytics.
      It is constrained by quote-based pricing, implementation fees, higher total cost than
      lightweight HRIS products and reliance on external payroll integrations in many
      countries. Those constraints make ROI proof, migration scope, local compliance and
      payroll architecture central to the buying decision. The strongest diligence gap is a
      public, segment-specific bridge from global HCM spend to HiBob's serviceable accounts,
      contract values and penetration.
    claimRefs: [CM009, CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
