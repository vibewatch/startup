callouts:
  - calloutType: insight
    title: Category growth is not serviceable-market proof
    body: "The HCM category has credible growth estimates, but HiBob's underwriting still needs employee-band, geography, module, payroll-coverage and penetration data before a SAM or SOM can be quantified."
    claimRefs: [CM006, CM007, CM014, CM015, CM016]
  - calloutType: risk
    title: Payroll localization can slow expansion
    body: "Independent review evidence describes reliance on external payroll providers in many regions, making local coverage, implementation scope and integration quality material adoption constraints."
    claimRefs: [CM012, CM013]
