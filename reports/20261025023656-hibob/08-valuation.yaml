        - from: scale
          to: platform
        - from: platform
          to: gaps
        - from: gaps
          to: risk
        - from: risk
          to: gate
        - from: gate
          to: decision
    claimRefs: [CV001, CV007, CV009, CV014]
callouts:
  - calloutType: recommendation
    title: Track at the reported mark
    body: "Salesforce validation and product breadth are credible positives, but the evidence does not yet justify underwriting a premium private valuation without audited operating metrics and capitalization terms."
    claimRefs: [CV003, CV005, CV006, CV014]
  - calloutType: risk
    title: Do not confuse funding with cash available
    body: "The $166 million financing is a disclosed round size, not evidence of current cash balance, runway, dilution, or investor preference economics."
    claimRefs: [CV002, CV009]
