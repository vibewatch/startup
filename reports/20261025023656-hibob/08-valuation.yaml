schemaVersion: "report-v2"
artifact: valuation
slug: hibob
runDate: 2026-10-25
company:
  name: HiBob
chapter:
  number: 8
  title: Valuation
  summary: HiBob's September 2026 financing reset its reported valuation above $3.2 billion, but public evidence still does not establish audited revenue quality, retention, margin, or preference terms. The evidence supports a track posture and disciplined entry requirements rather than a buy at the headline mark.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: >-
      The evidence supports track rather than buy. HiBob completed a $166 million
      growth financing led by Salesforce on September 1, 2026, and multiple
      reports place the post-money valuation at about $3.2 billion, up from
      approximately $2.7 billion in the prior round. The financing is a strong
      strategic signal: Salesforce is backing an HR platform positioned as an
      organizational-intelligence layer for AI workflows. It is not, by itself,
      proof that the new price is supported by audited revenue, durable net
      retention, gross margin, cash generation, or favorable investor
      preferences. The most decision-relevant public operating figure is
      management's more-than-$400 million annualized-revenue statement, while
      other sources describe that figure as ARR; the denominator and accounting
      basis are not independently reconciled. At the headline mark, the
      valuation is therefore stretched on disclosed evidence, with a potential
      path to fair value only if diligence confirms growth, retention, margin,
      customer concentration, and clean capitalization.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and scenario logic
    body: >-
      The upside thesis is that HiBob can convert a modern mid-market HRIS into
      a broader workforce-context control plane, using its data, integrations,
      and Salesforce relationship to expand into AI-enabled workflows and
      adjacent planning. Independent market profiles describe a product used
      across HR, payroll, performance, workforce analytics, and financial
      planning, while current financing coverage links the round to an
      organizational-intelligence strategy. The anti-thesis is that strategic
      capital and category language may be ahead of realized economics: the
      financing terms, dilution, liquidation preferences, current cash
      position, and audited revenue bridge are not disclosed in the retained
      evidence. A customer-review source also records workflow rigidity and
      requests for more granular permissions, which are relevant when the
      product is marketed as trusted context for agents. The valuation should
      move only when the operating proof and governance terms catch up with the
      narrative.
    claimRefs: [CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, comparables, and diligence asks
    body: >-
      A scenario range is more defensible than a point estimate because HiBob is
      private and the public evidence mixes company statements, reported
      financing terms, and secondary market commentary. SaaS Capital's public
      index framework says public ARR multiples are directional and that private
      multiples are lower, while its 2025 discussion places the public median
      in a 6x–8x ARR regime and emphasizes that merely being a SaaS company does
      not earn a premium multiple. This is a benchmark, not a direct HiBob
      valuation: HiBob's reported $3.2 billion mark against management's
      more-than-$400 million annualized revenue implies roughly 8x on that
      unverified denominator, but the calculation is not a substitute for
      audited ARR, NRR, margin, or cash-flow data. The base case is therefore
      a hold/track decision pending a clean metric bridge; the bull case
      requires sustained growth, retention, and strategic distribution; the
      bear case is multiple compression or a down-round if those metrics or
      the AI monetization thesis disappoint.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, track, "Do not underwrite a buy from the financing headline alone."]
      - [Confidence, medium, "The round is well corroborated, but operating and cap-table disclosure is incomplete."]
      - [Risk rating, high, "Private-company opacity, valuation sensitivity, and execution risk remain material."]
      - [Valuation stance, stretched, "The reported mark is premium relative to the disclosed but unverified revenue basis."]
      - [Entry discipline, "Require diligence before commitment", "Obtain audited metrics, capitalization terms, and current liquidity evidence."]
    notes: "Assessment synthesizes September 2026 financing coverage and retained benchmark evidence; missing private-company metrics are not treated as zero."
    claimRefs: [CV001, CV003, CV005, CV006, CV014]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - ["Strategic distribution can expand the market", "Salesforce led the $166M round and HiBob frames workforce context for AI workflows.", "Evidence of paid expansion, attach rates, or measurable Salesforce/Slack distribution."]
      - ["Product breadth supports a larger platform", "Retained profiles describe HR, payroll, workforce analytics, and planning modules.", "Audited module-level revenue, gross margin, and retention by cohort."]
      - ["The price may outrun fundamentals", "The reported valuation rose to about $3.2B while key financing terms remain undisclosed.", "A reconciled ARR/revenue bridge, NRR, margins, cash burn, and preference stack."]
      - ["Data quality and permissions can limit AI value", "A customer-review source records rigid workflows and requests for more granular permissions.", "Independent security, permissions, implementation, and incident evidence at scale."]
    notes: "The evidence column separates reported facts from the analytical implication; the final column is a diligence trigger, not a forecast."
    claimRefs: [CV007, CV008, CV009, CV010, CV011]
  - id: TV003
    title: Bull / base / bear scenarios
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Revenue and ARR are reconciled above the reported $400M annualized level; growth, NRR, and margin remain strong; Salesforce distribution converts.", "Premium valuation can be defended and upside comes from growth plus strategic platform expansion.", "AI monetization, permissions, concentration, and integration execution.", "Low-to-medium: requires several unverified conditions."]
      - [Base, "The reported round and product traction are real, but audited operating metrics and terms remain unavailable.", "Track and wait for a price or disclosure reset; do not model a precise return.", "Opacity, dilution, preference overhang, and multiple compression.", "Medium: best fit to current evidence."]
      - [Bear, "Growth slows, retention or margins disappoint, or AI positioning does not create paid expansion.", "A down-round or materially lower entry multiple becomes possible; capital preservation dominates.", "Commercialization failure, strategic dependence, and liquidity constraints.", "Material: downside is not underwritten away."]
      - [Diligence gate, "Obtain audited financials, current cap table, preference terms, cash/runway, NRR, churn, and customer concentration.", "Re-rate only after the missing denominators and rights are verified.", "Data remains private or inconsistent across disclosures.", "Required before investment."]
    notes: "Scenarios are qualitative because the retained evidence does not support a reliable point valuation, probability-weighted return, or target exit price."
    claimRefs: [CV003, CV005, CV012, CV013, CV014, CV015, CV016]
