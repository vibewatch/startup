evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-TO002
    missingEvidence: Current board roster, ownership, voting rights, option pool and preference stack.
    whyItMatters: The reported valuation cannot be assessed without understanding control, dilution and liquidation economics.
    diligencePath: Request the latest cap table, board materials, investor-rights summary and 409A or board valuation bridge.
    relatedQuestionRefs:
      - QO002
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: A dated bridge among 2025 ARR, 2026 annualized revenue, customer count and headcount.
    whyItMatters: >-
      The metrics use different periods and definitions and could otherwise create a false growth or valuation
      comparison.
    diligencePath: Obtain audited financials, KPI definitions, cohort tables and management's current operating dashboard.
    relatedQuestionRefs:
      - QO004
      - QO008
      - QO010
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, retention, churn, CAC, payback, burn, cash and runway.
    whyItMatters: Private-company valuation support depends on durable economics, not financing headline values alone.
    diligencePath: >-
      Request monthly financial statements, ARR bridge, NRR and churn cohorts, sales-efficiency metrics and cash
      forecast.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: minor
    topic: customer-experience
    missingEvidence: Segmented customer concentration and independently verifiable renewal or support outcomes.
    whyItMatters: >-
      Acquisition breadth and positive reviews do not show whether large customers renew or whether payroll integrations
      create concentration risk.
    diligencePath: Review anonymized customer cohorts, reference calls, support metrics and payroll migration outcomes.
    relatedQuestionRefs:
      - QO007
      - QO010
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A current HiBob-specific SAM and SOM bridge by employee band, geography, module, payroll coverage, contract value
      and penetration.
    whyItMatters: >-
      Category growth cannot underwrite HiBob's attainable revenue or valuation without a constrained customer universe
      and conversion assumptions.
    diligencePath: >-
      Request management's current market model, customer-count denominator, win-rate history, ACV distribution,
      geographic mix and module attach rates, then reconcile to independent customer and industry data.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable, current price cards and implementation estimates for the same employee count, geography and module
      bundle.
    whyItMatters: >-
      Public pricing ranges and quote-based descriptions are not directly comparable and may materially change ROI and
      budget ownership.
    diligencePath: >-
      Obtain three anonymized quotes or a current price book covering core HR, payroll connectivity, implementation,
      integrations and add-ons.
    relatedQuestionRefs:
      - QM007
      - QM009
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      A complete current quote showing base modules, add-ons, implementation fees, discounts, and country-specific
      payroll costs.
    whyItMatters: >-
      Quote opacity prevents a defensible total-cost comparison and can change the buyer's choice versus simpler or
      broader platforms.
    diligencePath: >-
      Request itemized proposals from HiBob and two shortlisted alternatives for the same headcount, countries, modules,
      term, and implementation scope.
    relatedQuestionRefs:
      - QP004
  - type: missing-source
    severity: material
    topic: payroll
    missingEvidence: Country-by-country evidence separating native payroll, partner processing, integrations, and EOR coverage.
    whyItMatters: >-
      Payroll reliability and legal coverage are central to multinational switching costs and may determine whether
      HiBob can replace incumbent systems.
    diligencePath: >-
      Obtain a country matrix, architecture diagram, service-level commitments, and customer references for each
      intended deployment market.
    relatedQuestionRefs:
      - QP005
      - QP006
      - QP008
  - type: missing-source
    severity: material
    topic: competitor-benchmark
    missingEvidence: >-
      Comparable independent benchmarks for implementation duration, adoption, retention, reporting, permissions, and
      customer outcomes across alternatives.
    whyItMatters: The current comparison is directional and cannot validate moat durability or relative ROI.
    diligencePath: >-
      Run a structured RFP with identical requirements and request reference calls plus product demonstrations using
      buyer data and workflows.
    relatedQuestionRefs:
      - QP003
      - QP007
      - QP009
  - type: missing-source
    severity: blocking
    topic: disclosure-gap
    missingEvidence: >-
      A current ARR-to-recognized-revenue bridge with contract terms, discounting, deferred revenue and cohort
      retention.
    whyItMatters: Without this bridge, recurring-revenue quality and the correct valuation denominator cannot be tested.
    diligencePath: Request monthly ARR, GAAP revenue, bookings, churn, expansion and renewal cohorts for the last 24 months.
    relatedQuestionRefs:
      - QI003
      - QI006
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly operating burn, debt or credit facilities, covenants, planned use of the 2026 financing and
      runway scenarios.
    whyItMatters: Financing raised is not cash available, and the next financing need cannot be assessed from the funding headline.
    diligencePath: Obtain the latest board cash report, debt schedule and base/downside 18-month cash forecast.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
