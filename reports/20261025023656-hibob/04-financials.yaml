company:
  name: HiBob
chapter:
  number: 4
  title: Financials
  summary: HiBob has a subscription-oriented HRIS model with broad module coverage, but public evidence supports list-price and financing observations more strongly than realized revenue, margin, cash, or burn metrics. The underwriting case therefore depends on validating net retention, gross margin, customer concentration, and runway rather than extrapolating from the September 2026 funding round.
sections:
  - id: monetization-and-revenue-quality
    title: Monetization and revenue quality
    body: >-
      HiBob sells Bob as a cloud HRIS/HCM platform covering core HR, onboarding,
      performance, compensation, analytics, and payroll-related workflows. The
      company describes Bob as connecting HR, payroll, and finance, while independent
      reviews characterize the product as a subscription platform with quote-based,
      employee-count and module-dependent pricing. That is a credible recurring-revenue
      mechanism, but the assigned evidence does not establish realized price, contract
      duration, discounting, deferred revenue, revenue recognition, ARR definition, or
      revenue mix. Third-party price points are benchmarks or estimates, not HiBob
      reported revenue. The practical revenue-quality question is whether the premium
      UX and analytics support durable expansion after customers add modules, while
      integration-led payroll creates implementation and support dependencies.
    claimRefs: [CI001, CI003, CI004, CI005, CI006, CI007, CI009]
    tableRefs: [TI001, TI002]
  - id: unit-economics-and-cost-drivers
    title: Unit economics and cost drivers
    body: >-
      Public material describes the commercial cost stack more clearly than the
      operating cost stack. Subscription fees scale with headcount and selected
      modules; performance, compensation, time and attendance, implementation, and
      support can increase total cost of ownership. HiBob's native payroll coverage
      is geographically limited in the independent material, so customers in other
      markets may require third-party payroll integrations and the associated
      reconciliation, support, and failure-management burden. An independent review
      estimates a 60-to-120-day implementation window, which makes onboarding effort
      and partner execution relevant to sales efficiency and gross margin. No retained
      source supplies CAC, payback, gross margin, churn, NRR, support cost per account,
      or services contribution; those are underwriting blockers, not zeroes.
    claimRefs: [CI006, CI007, CI008, CI010, CI012]
    tableRefs: [TI003]
  - id: capital-adequacy-and-financial-verdict
    title: Capital adequacy and financial verdict
    body: >-
      HiBob announced a $166 million investment in September 2026, led by Salesforce,
      while the announcement also said the platform served more than 5,500 customers,
      but this remains a
      company-issued operating metric rather than audited financial disclosure. The
      round demonstrates access to fresh financing, yet funding raised is not cash on
      hand and does not reveal burn or runway. The assigned pool contains no current
      cash balance, debt schedule, covenant data, operating loss, or planned use of
      funds. As a result, the financial verdict is provisional: the model appears
      commercially scalable, but capital adequacy and margin path cannot be
      underwritten until management supplies an audited or board-level bridge from
      bookings and ARR to recognized revenue, gross profit, cash, and forward burn.
      SaaS market benchmarks reinforce why growth, retention, and profitability need
      to be measured directly rather than inferred from the financing headline.
    claimRefs: [CI002, CI011, CI013, CI014, CI015, CI016]
    figureRefs: [FI001]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Current value or status, Quality, Diligence ask]
    rows:
      - [Core HR and people data, "Recurring cloud subscription priced by headcount and modules", "Commercially described; realized revenue unavailable", "Recurring mechanism; company revenue not disclosed", "Obtain ARR-to-revenue bridge, contract term and renewal cohorts"]
      - [Performance and compensation, "Module add-ons to the core platform", "Third-party estimates indicate incremental per-employee pricing", "Estimated list-price benchmark", "Separate attach rate, realized price, discounting and gross margin"]
      - [Payroll and Payroll Hub, "Native coverage in selected markets plus partner integrations", "Coverage varies by country", "Operationally supportable; revenue mix unavailable", "Provide payroll revenue mix, partner fees and error/support cost"]
      - [Workforce planning and analytics, "Additional planning and reporting capabilities", "Functionality described; financial contribution unavailable", "Product evidence, not financial evidence", "Report module penetration, expansion ARR and implementation cost"]
      - [Implementation and support, "Professional services and customer-success activity around deployment", "60-120 day implementation estimate", "Third-party operational estimate", "Disclose services revenue, delivery margin and support cost per account"]
    notes: "Sources are a mix of company description and third-party reviews; price points are not recognized revenue, and unavailable values mean no retained public evidence."
    claimRefs: [CI003, CI004, CI006, CI007, CI008, CI009]
  - id: TI002
    title: Pricing and monetization reference points
    columns: [Reference, Price or model, List versus realized, Implication, Source basis]
    rows:
      - [Core platform, "$8-$10 per employee per month estimate", "Estimated list-price benchmark", "Establishes a diligence starting point only", "WorkTech Desk review"]
      - [Typical package, "$12-$17 per employee per month for a 300-person example", "Estimated list-price benchmark before negotiation", "Discounting and module mix can materially change ACV", "WorkTech Desk review"]
      - [Performance module, "$2-$4 per employee per month estimate", "Estimated add-on list price", "Attach rate and incremental gross margin are unknown", "WorkTech Desk review"]
      - [Compensation module, "$2-$3 per employee per month estimate", "Estimated add-on list price", "Expansion economics require cohort data", "WorkTech Desk review"]
      - [Time and attendance, "$2-$3 per employee per month estimate", "Estimated add-on list price", "Module packaging affects total contract value", "WorkTech Desk review"]
    notes: "These are quoted or estimated market-facing reference points, not HiBob's realized ASP, ARR, revenue, or margin; no public retained source provides discounting or contract terms."
    claimRefs: [CI004, CI005, CI007, CI009]
  - id: TI003
    title: Unit-economics underwriting status
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [ARR or recognized revenue, null, low, "Determines scale and the correct valuation denominator", "Provide monthly ARR definition, recognized revenue and reconciliation"]
      - [Revenue growth, null, low, "Separates durable expansion from financing-led growth narrative", "Provide trailing-period growth by cohort and segment"]
      - [Gross margin, null, low, "Tests software economics against payroll, support and implementation costs", "Provide GAAP and adjusted gross margin bridge"]
      - [Net revenue retention, null, low, "Tests module expansion, churn and pricing power", "Provide gross and net retention by starting cohort"]
      - [CAC payback, null, low, "Tests whether growth consumes disproportionate capital", "Provide fully loaded CAC, sales cycle and payback"]
      - [Burn and runway, null, low, "Determines dependence on the next financing event", "Provide cash, monthly burn, debt and runway under base/downside cases"]
      - [Customer concentration, null, low, "Affects renewal risk and valuation quality", "Provide revenue share by top 10 customers and sector"]
      - [Implementation duration, "60-120 days estimate", medium, "Affects services capacity, time to value and deployment cost", "Reconcile implementation duration with realized services margin"]
    notes: "Null values are explicit evidence gaps, not estimates or zeroes; the implementation duration is a third-party estimate and should be tested against internal delivery data."
    claimRefs: [CI008, CI010, CI012, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: HiBob's described commercial path runs from workforce data and HR modules through subscriptions and partner-linked payroll, while recognized revenue and gross profit remain undisclosed.
    data:
      nodes:
        - id: workforce-data
          label: Workforce data
          detail: "People, roles, teams, compensation and organizational context are described as the platform foundation."
        - id: hr-modules
          label: Core HR and modules
          detail: "Core HR, onboarding, performance, compensation, analytics and workforce planning."
        - id: payroll-integrations
          label: Payroll and partner integrations
          detail: "Native payroll is limited by market; other markets rely on integrations according to independent reviews."
        - id: subscription-contract
          label: Per-employee subscription
          detail: "Quote-based pricing varies with headcount and selected modules; realized price is unavailable."
        - id: recognized-revenue
          label: Recognized revenue
          detail: "Not disclosed in the assigned evidence pool."
        - id: gross-profit
          label: Gross profit
          detail: "Not disclosed; payroll, support and implementation costs require validation."
    claimRefs: [CI003, CI006, CI007, CI010]
callouts:
  - calloutType: strength
    title: Scalable commercial architecture
    body: The product is positioned as a recurring, per-employee platform with multiple attachable modules, creating a plausible expansion path if retention and implementation economics hold.
    claimRefs: [CI003, CI004, CI007]
  - calloutType: risk
    title: Financing is not runway
    body: The $166 million financing announcement improves reported capital access, but without cash, burn, debt and use-of-funds data it cannot establish solvency horizon or remove financing dependency.
    claimRefs: [CI002, CI013, CI015]
  - calloutType: recommendation
    title: Request the operating bridge
    body: Underwriting should condition any valuation view on a current ARR-to-revenue bridge, cohort retention, gross margin, customer concentration, cash, burn and runway schedule.
    claimRefs: [CI010, CI012, CI015, CI016]
