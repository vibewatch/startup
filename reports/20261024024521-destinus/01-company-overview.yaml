callouts:
  - calloutType: strength
    title: Industrial and programme momentum
    body: The assigned evidence shows financing, autonomy capability integration, product testing, and participation in a European defence evaluation rather than a company narrative limited to a concept-stage prototype.
    claimRefs: [CO008, CO013, CO014, CO015]
  - calloutType: risk
    title: Public metrics are not yet underwriting-grade
    body: Reported capital, headcount, revenue expectations, and valuation indicators vary by source, while audited financials, cap-table terms, and complete governance records are not available in the assigned evidence.
    claimRefs: [CO009, CO010, CO011, CO012]
