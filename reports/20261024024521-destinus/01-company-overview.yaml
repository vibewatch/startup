company:
  name: Destinus
chapter:
  number: 1
  title: Company Overview
  summary: Destinus is a private European defence manufacturer founded in 2021 and headquartered in the Netherlands, with a product strategy spanning autonomous aircraft, strike systems, and air defence. Public evidence shows substantial financing and expanding defence-program activity, but private-company scale, revenue, valuation, and governance metrics remain inconsistent or unavailable.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Destinus was founded in 2021 by Mikhail Kokorich and is headquartered in the Netherlands, although public profiles disagree on the precise founding and incorporation dates and on the current headcount. The company's stated and reported business has moved from an initial hydrogen-powered hypersonic-aircraft concept toward defence systems, including autonomous aircraft, cruise missiles, guided rockets, and interceptors. Dealroom describes a European defence manufacturer focused on scalable strike, air-defence, and interception systems, while International Finance reports that Destinus combines autonomy, systems integration, and industrial-scale production. This is a defence-prime-style model rather than a conventional software subscription business: procurement cycles, qualification, production capacity, export controls, and programme execution are central to conversion. The public record supports the identity and product categories, but it does not establish audited revenue, recurring revenue, backlog, or customer concentration.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person exposure
    body: >-
      Mikhail Kokorich is identified as founder and chief executive in multiple company-profile sources, and his prior aerospace ventures are part of the public narrative around Destinus. Tim Moser is identified as CTO in reporting on Ruta Block 2 and as a co-founder in the Daedalean acquisition coverage. The available evidence does not provide a complete board roster, ownership table, executive succession plan, or independent-governance assessment. A material diligence issue is therefore key-person and founder-history exposure: the SEC states that a 2024 consent judgment against Kokorich resolved claims related to alleged misleading statements at Momentus, imposed a $2 million civil penalty, and barred him from serving as an officer or director of a public company for five years. That historical regulatory record is not evidence of misconduct by Destinus, but it is relevant to governance, disclosure controls, and any future public-market process.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, scale, and milestone interpretation
    body: >-
      Public financing descriptions are directionally consistent about meaningful capital formation but differ in scope and timing. Defence Industry Europe reports a €50 million Commerzbank facility in December 2025, alongside €140 million of convertible instruments and shareholder loans and more than €200 million of previously raised equity, producing a stated total near €400 million; that is a company-reported financing summary in a trade publication, not audited cash available. A May 2026 report describes a possible €200 million financing at a valuation above €5 billion and an expected annual-revenue figure of roughly €500 million, while explicitly presenting these as reports and projections. Caplight lists financing events but does not disclose a latest valuation, and Dealroom displays a different set of totals and estimates. These differences make financing terms, debt, convertibles, cash balances, and revenue quality priority diligence items rather than settled cover metrics.
    claimRefs: [CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: operating-milestones-and-gaps
    title: Operating milestones and evidence gaps
    body: >-
      The current evidence shows a sequence from company formation and strategic repositioning to financing, acquisitions, product testing, and government-linked evaluation. Destinus announced or was reported to have acquired Daedalean for CHF 180 million, and later coverage described a Ruta Block 2 flight test, while Defence Industry Europe reported selection among the five highest-ranked applicants for the European Defence Agency's Sentinel Strike Challenge and a planned operational trial in Portugal. These are meaningful capability and ecosystem milestones, but they are not equivalent to booked revenue, accepted deliveries, or profitable production. The most important unresolved questions are product-by-product qualification and shipment status, the conversion of trials and partnerships into contracted orders, the reconciliation of headcount and capital figures, and the governance implications of any proposed IPO.
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
  - id: exhibits
    title: Evidence-led exhibits
    body: >-
      The exhibits separate reported metrics from unavailable private-company data and place the dated events in an explicit sequence. Null values are intentional where the assigned public sources do not support a reliable number. The KPI table preserves conflicting founding, location, financing, valuation, and headcount signals instead of collapsing them into a false point estimate. The leadership table is explicitly partial, and the stakeholder map distinguishes lenders, advisers, evaluators, and industrial partners from equity investors or contracted customers. The timeline likewise records reported tests and selections as milestones, not as proof of revenue recognition or production profitability.
    claimRefs: [CO008, CO010, CO011, CO015]
