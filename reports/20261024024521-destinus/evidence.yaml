evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: >-
      Audited revenue, backlog, bookings, customer concentration, cash balance, and reconciliation of reported capital
      figures.
    whyItMatters: The reported valuation and revenue expectations cannot be underwritten from press coverage or database estimates.
    diligencePath: >-
      Request audited financial statements, management accounts, backlog aging, bookings bridge, bank statements, and a
      financing schedule.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: identity-and-scale
    missingEvidence: Authoritative legal incorporation date, principal headquarters, and dated employee count.
    whyItMatters: Public profiles disagree on founding date, location, and headcount, affecting identity and scale assessment.
    diligencePath: >-
      Obtain Dutch registry extracts, group-structure chart, site list, and payroll-backed headcount by entity and
      geography.
    relatedQuestionRefs:
      - QO001
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete board, executive, ownership, and succession information.
    whyItMatters: Founder dependence and any future IPO require clear governance, controls, and public-company eligibility analysis.
    diligencePath: >-
      Request board minutes, cap table, beneficial-owner schedule, executive biographies, succession plan, and legal
      disclosure memo.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: Definitive agreements and economics for lenders, advisers, public-sector programmes, and industrial partners.
    whyItMatters: >-
      A reported stakeholder relationship may be exploratory, advisory, debt financing, or contracted demand; these have
      different economic value.
    diligencePath: >-
      Collect executed facility, advisory, joint-venture, evaluation, and procurement documents and map obligations to
      revenue recognition.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: Product-level SAM and SOM by geography, capability, buyer, funded programme and procurement stage.
    whyItMatters: >-
      Aggregate spending and category forecasts do not establish how much addressable spend Destinus can realistically
      win.
    diligencePath: >-
      Obtain the board-approved market model and opportunity register, then reconcile probability-weighted opportunities
      to signed awards and delivered revenue.
    relatedQuestionRefs:
