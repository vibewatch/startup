        title: Exhibits
        blocks:
          - type: callout
            title: Capital raised is not cash available
            body: >-
              Partner and analyst sources report different cumulative financing totals, and the cash portion of the
              Daedalean consideration is undisclosed. Without a capitalization table, debt schedule, current cash
              balance, and monthly net cash use, runway cannot be inferred.
            calloutType: risk
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
