              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI015
      - number: '4.2'
        title: Commercial conversion remains stage-based, not financial
        blocks:
          - type: paragraph
            body: >-
              The strongest current commercial signals are progression events rather than disclosed sales. The
              Aeon-Destinus proposal was one of ten xTech finalists; Defence Industry Europe reported Destinus among
              five applicants advancing to an EDA operational trial; and Aviation Week reported that flight testing of a
              2,000-km Ruta Block 3 was planned for 2027. These facts can support pipeline relevance and technical
              momentum, but they do not demonstrate a contract award, paid delivery, customer acceptance, or cash
              collection. The distinction matters because development, qualification, procurement, production, and
              revenue recognition can occur in different periods and under different risk-sharing terms. No retained
              source discloses list price, realized price, discounting, minimum order, milestone schedule, warranty
              exposure, or customer concentration.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI006
      - number: '4.3'
        title: Capital intensity is visible; unit economics are not
        blocks:
          - type: paragraph
            body: >-
              The evidence indicates material external-capital dependence but does not reconcile the capital stack.
              PRLab, a communications supplier to Destinus, described a €50 million commercial-bank facility and €400
              million of total capital raised. A separate compiled tear sheet reports $246 million-plus across five
              rounds, while Caplight exposes round dates and types but withholds public amounts. These are not
              interchangeable measures, and none establishes current cash availability. The reported CHF 180 million
              cash-and-stock Daedalean acquisition adds another capital-allocation question without disclosing the cash
              portion or post-close liquidity. Kratos is only a directional competitor comparator, not an independent
              Destinus benchmark: its 2025 disclosure shows that defense growth can coincide with working-capital use,
              elevated capital expenditure, thin unmanned-systems operating profit, and fixed-price cost pressure.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI007
              - CI008
              - CI009
              - CI010
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is not presently underwritable from public evidence. Secondary estimates are internally
              inconsistent: the compiled tear sheet attributes a roughly $70 million 2024 revenue estimate to Sacra
              while also listing $28 million of revenue from Prospeo without a period, and Wikipedia carries two
              different 2024 turnover estimates. These observations do not establish a reliable revenue range because
              currencies, periods, consolidation boundaries, and estimation methods differ or are missing. The positive
              case is a widening set of program and production signals; the limiting case is absent contract economics
              and liquidity disclosure. Diligence should prioritize audited consolidated financials, contract-level
              backlog and milestone terms, product gross margins, inventory and receivables aging, acquisition funding,
              debt covenants, current cash, monthly net cash use, and a management-approved financing plan.
            claimRefs:
              - CI003
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
