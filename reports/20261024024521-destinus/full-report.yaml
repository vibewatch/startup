  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Destinus presents a defense-aerospace portfolio rather than a single product. Sacra describes Hornet and
              LORD as small dual-use UAVs for intelligence, surveillance, and reconnaissance, while RUTA is a family of
              long-range strike systems and Destinus Energy sells industrial gas turbines. The product workflow is
              therefore mission-led: a defense customer selects an interceptor, strike, or ISR asset, integrates it with
              sensing and command systems, and operates it in a contested environment. The strongest public product
              evidence is for RUTA Block 2 testing and Hornet Block 2 specifications; claims about a broader autonomous
              stack and future hyperplanes remain company or analyst descriptions rather than independently verified
              deployment evidence.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE009
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE010
              - CE011
              - CE013
      - number: '5.2'
        title: Architecture, integration, and maturity
        blocks:
          - type: paragraph
            body: >-
              The architecture combines airframes, propulsion, guidance, autonomy, and industrial production.
              International Finance reproduces Destinus statements that the RUTA Block 2 test validated an in-line
              booster configuration and foldable wings and control surfaces, with in-flight wing deployment observed
              during launch and transition. The same company account describes sealed, containerised modules as a
              transport and deployment change. Breaking Defense reports that the Vorexon interceptor is still under
              development and is designed for external radar, midcourse correction, and operator-controlled engagement.
              Evertiq reproduces a company media release describing the Daedalean acquisition as adding certifiable AI
              avionics, environmental awareness, and navigation in GNSS-denied environments. These are useful
              architecture signals, but not a substitute for qualification reports, repeatability data, or production
              acceptance rates.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
