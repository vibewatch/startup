  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Export controls, qualification, security, programme coordination, and financing remain high-residual risks until
      external gates and private evidence are cleared.
    data:
      columns:
        - label: Likelihood
          detail: Analyst assessment from disclosed status, not a measured probability.
        - label: Impact
          detail: Potential effect on legal delivery, acceptance, operations, or financing.
        - label: Mitigation maturity
          detail: Maturity visible in retained public evidence.
        - label: Residual exposure
          detail: Exposure after currently disclosed mitigation.
      rows:
        - label: Export licensing and sanctions
          note: Product and destination licence register not public.
          values:
            - High
            - Critical
            - Unknown
            - High
        - label: Qualification and reliability
          note: Common-framework operational results remain pending.
          values:
            - Medium
            - Critical
            - Early
            - High
        - label: Multi-party programme integration
          note: Binding terms and interface controls were not disclosed.
          values:
            - Medium
            - Critical
            - Early
            - High
        - label: Production quality and scale
          note: Yield, defect, and acceptance data were unavailable.
          values:
            - Medium
            - High
            - Unknown
            - High
        - label: Physical and cyber security
          note: Reported targeting raises exposure but does not establish an incident.
          values:
            - Medium
            - Critical
            - Unknown
            - High
        - label: Financing and liquidity
          note: Cash availability, covenants, and working capital were not public.
          values:
            - Medium
            - High
            - Unknown
            - High
    approximationNotes: Qualitative positions are analyst assessments; no numeric probabilities or loss magnitudes are implied.
    claimRefs:
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Capability and market signals justify monitoring, while missing monetization and price evidence prevent an
      investable valuation conclusion.
    data:
      nodes:
        - id: capability
          label: Capability signals
          detail: Ruta test reporting, EDA evaluation, and planned missile trials
        - id: demand
          label: Demand context
          detail: Strong defense funding and procurement interest
        - id: monetization
          label: Monetization gap
          detail: No audited revenue, margins, backlog conversion, or customer split
        - id: capital
          label: Capital-structure gap
          detail: No current cap table, debt schedule, convertibles, or preferences
        - id: price
          label: Price conflict
          detail: Reported >EUR 5B target versus materially lower dated estimates
        - id: decision
          label: 'Recommendation: track'
          detail: Reassess after a priced round, audited economics, and funded contracts
      edges:
        - from: capability
          to: demand
        - from: demand
          to: monetization
        - from: monetization
          to: capital
        - from: capital
          to: price
        - from: price
          to: decision
    approximationNotes: The flow is a decision sequence, not a quantitative valuation model.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV016
