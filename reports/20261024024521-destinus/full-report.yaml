  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Destinus's public product architecture spans mission control, autonomy, flight systems, propulsion, launch
      logistics, and industrial integration.
    data:
      layers:
        - label: Mission and control
          detail: Threat detection, mission planning, and operator authorization.
          items:
            - name: Sensor and fire-control network
              detail: External radar detects and classifies threats; operator remains in command for Vorexon engagements.
            - name: Mission planning
              detail: EDA trial framework covers planning, launch, target detection, engagement, and post-strike assessment.
        - label: Autonomy and guidance
          detail: Onboard sensing, navigation, and decision-support software.
          items:
            - name: AI avionics
              detail: Daedalean material describes AI-assisted piloting, environmental awareness, and GNSS-denied navigation.
            - name: EO/IR and radar guidance
              detail: Official Hornet Block 2 material states autonomous engagement capability.
        - label: Airframes and effects
          detail: Interceptor, ISR, and long-range strike vehicle families.
          items:
            - name: Hornet and LORD
              detail: Small dual-use UAV and ISR product lines described by Sacra.
            - name: RUTA family
              detail: Block 1 serial production is reported; Block 2 is flight-tested and Block 3 remains planned.
        - label: Propulsion and launch
          detail: Boosters, turbojets, and containerised or mobile deployment.
          items:
            - name: Boosters and turbojet
              detail: RUTA Block 2 test covered an in-line booster; RUTA Block 3 is described with a future T220 turbojet.
            - name: Containerised deployment
              detail: RUTA Block 2 is described as transportable, storable, and launchable from sealed modules.
        - label: Industrial integration
          detail: Prime-partner manufacturing, testing, and European trial pathways.
          items:
            - name: Rheinmetall partnership
              detail: >-
                Planned 51%/49% venture combines Rheinmetall production capacity with Destinus technology and system
                design.
            - name: European trial pathway
              detail: EDA Sentinel Strike Challenge provides a common operational assessment framework.
        - label: Trust and qualification
          detail: Safety, resilience, reliability, operational suitability, and regulatory approval evidence.
          items:
            - name: EDA assessment criteria
              detail: >-
                Public trial framework includes performance, resilience, reliability, safety, and operational
                suitability.
