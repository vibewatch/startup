      - [Valuation stance, "Expensive / unproven", "The reported >EUR 5B target is not a verified completed valuation and cannot be reconciled with lower marks."]
    notes: "Assessment uses public evidence available on 2026-10-24; currencies and vintages differ, and no audited revenue, current cap table, or preference schedule was available."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence available, What would change the view]
    rows:
      - ["European defense demand can support scaled autonomous systems", "EDA evaluation progress and reported Ruta Block 2 testing", "Disclosed production contracts with value, quantity, and delivery milestones"]
      - ["Vertical integration may improve deployment flexibility", "Company-attributed reporting describes in-house subsystems and a containerized architecture", "Independent reliability, unit-cost, throughput, and acceptance-test evidence"]
      - ["Technical milestones have not yet proved recurring economics", "Planned trials and challenge selection are pre-revenue signals", "Audited revenue, backlog conversion, gross margin, and cash collection"]
      - ["Customer concentration may constrain the thesis", "DroneZ says one national customer drives most coverage and no customer revenue split is public", "Multi-country awards and customer-level concentration disclosure"]
    notes: "The table distinguishes technical or demand signals from monetization evidence; tests, selections, and plans are not treated as contracts or revenue."
    claimRefs: [CV007, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Trials convert into repeat production; customers diversify; audited revenue validates scale", "A financing or IPO mark may become supportable, but no public numeric fair-value range is presently defensible", "Low-to-medium because several milestones remain pre-contract", "Trials fail to convert into obligated procurement"]
      - [Base, "Technical progress continues, qualification remains slow, and additional capital is required", "Track until entry price, dilution, preferences, revenue, margins, and cash needs are disclosed", "Medium and most consistent with current evidence", "Financing closes with punitive dilution or preferences"]
      - [Bear, "Procurement slips, concentration persists, and defense-startup multiples compress", "Reported >EUR 5B pricing has substantial downside because it rests on projections rather than verified economics", "Medium given documented capital intensity and valuation debate", "Down-round, commercialization failure, or loss of a launch customer"]
      - ["Information case", "Destinus remains private and key financial terms remain unavailable", "No target return, hold period, or exit value can be responsibly calculated", "High because no listing or filing is confirmed", "No prospectus, audited accounts, signed round, or cap-table disclosure"]
    notes: "Scenarios are qualitative rather than a DCF or multiple-based valuation; comparator values use different models, maturities, currencies, and disclosure standards."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV011, CV012, CV013, CV014, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Capability and market signals justify monitoring, while missing monetization and price evidence prevent an investable valuation conclusion.
    data:
      nodes:
        - id: capability
          label: "Capability signals"
          detail: "Ruta test reporting, EDA evaluation, and planned missile trials"
        - id: demand
          label: "Demand context"
          detail: "Strong defense funding and procurement interest"
        - id: monetization
          label: "Monetization gap"
          detail: "No audited revenue, margins, backlog conversion, or customer split"
        - id: capital
          label: "Capital-structure gap"
          detail: "No current cap table, debt schedule, convertibles, or preferences"
        - id: price
          label: "Price conflict"
          detail: "Reported >EUR 5B target versus materially lower dated estimates"
        - id: decision
          label: "Recommendation: track"
          detail: "Reassess after a priced round, audited economics, and funded contracts"
      edges:
        - from: capability
          to: demand
        - from: demand
          to: monetization
        - from: monetization
          to: capital
        - from: capital
          to: price
        - from: price
          to: decision
    approximationNotes: "The flow is a decision sequence, not a quantitative valuation model."
    claimRefs: [CV003, CV004, CV007, CV008, CV009, CV010, CV016]
