company:
  name: Destinus
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports continued monitoring of Destinus but not underwriting an entry price. A reported financing target above EUR 5 billion conflicts with lower third-party marks, while audited economics, financing terms, and contract-backed revenue remain unavailable.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: >-
      The recommendation is track, with medium-low confidence and high risk, rather than buy at the price discussed in public reporting. Tech Funding News reported that Destinus was seeking about EUR 200 million at a valuation exceeding EUR 5 billion, tied to projected annual revenue of roughly EUR 500 million. That is a reported negotiation and forecast, not evidence of a closed priced round or audited revenue. QuantLogix instead labels a USD 1.5 billion 2025-Q2 mark as low confidence, while Forbes reported a USD 1.76 billion 2025 estimate. These figures have different dates, currencies, and evidentiary bases, so they do not define a defensible fair-value range. Entry should wait for a signed financing instrument, post-money capitalization, preference stack, audited financials, and customer-backed revenue evidence.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that Destinus can translate European demand for autonomous strike and interception systems into scaled production. Company-attributed coverage said a Ruta Block 2 test validated a more deployable launch architecture, and Defence Industry Europe reported that Destinus advanced from the first stage of an EDA evaluation into common operational trials. Aviation Week also reported a planned 2,000-kilometer missile test. The anti-thesis is that demonstrations, planned tests, and challenge selection are not obligated procurement or recurring revenue. DroneZ says the Dutch program dominates current coverage and that no public source breaks revenue out by customer. Public evidence therefore supports capability progress but not diversified monetization, margins, or conversion economics.
    claimRefs: [CV007, CV008, CV009, CV010]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenario framework and comparable context
    body: >-
      A qualitative scenario framework is more credible than a point estimate because the required financial denominators are missing. Defense-technology capital is available: CNBC reported Quantum Systems raised USD 1.2 billion at an approximately USD 8 billion post-money valuation, while an archived StockAnalysis page surfaced a USD 61 billion Anduril financing headline. Kratos, a listed defense-technology company with public-market disclosure obligations and a different business mix, had a USD 7.25 billion market capitalization in October 2026. These are context, not interchangeable valuation benchmarks. Forbes also warned that capital intensity and reliance on government contracts can delay monetization and quoted investors debating overvaluation. The bull case needs audited scale and repeat procurement; the base case assumes technical progress but unresolved financing and concentration; the bear case combines procurement delays, dilution, and multiple compression.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: exit-governance-and-diligence
    title: Exit readiness, governance, and final diligence
    body: >-
      Exit readiness remains unproven. DroneZ states that Destinus has no listed security and no confirmed listing venue or date, while QuantLogix stated that no public S-1 was on file as of the run date. A CourtListener docket records a 2021 SEC complaint against founder Mikhail Kokorich; the allocated text does not establish a present Destinus liability or provide a current resolution, so it is a founder-level governance diligence flag rather than a company finding. Before investment, obtain the full cap table, debt and convertible schedule, liquidation preferences, audited revenue and cash flow, contract values, customer concentration, and counsel's account of the historical proceeding. Thesis-break triggers are a down-round, punitive preferences, failed trial-to-contract conversion, persistent single-customer dependence, or a substantiated legal or regulatory impediment to contracting or exit.
    claimRefs: [CV005, CV006, CV016]
    figureRefs: [FV001]
callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: Public evidence does not support underwriting the reported valuation target without a closed round, audited economics, and financing terms.
    claimRefs: [CV001, CV002, CV003, CV004]
  - calloutType: risk
    title: Capability is not monetization
    body: Tests and evaluation milestones improve technical confidence, but they do not establish obligated revenue, margins, or customer diversification.
    claimRefs: [CV007, CV008, CV009, CV010]
