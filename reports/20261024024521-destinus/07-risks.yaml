      - [Reconnaissance-to-strike workflow, Quantum Systems, "ISR collection, Mosaic Uxs processing, and strike-system connection", Medium, "Data, command, or national-system integration fails", High, "Shared architecture and claimed NATO-system compatibility", Medium-high]
      - [Layered air-defence integration, Diehl Defence, "GARMR integration and possible IRIS-T pathway", Medium, "Validation or approval does not progress", High, "Phased validation and applicable approvals", Medium-high]
      - [Industrial joint venture, Rheinmetall, "Qualification, production, marketing, and delivery", High, "Partner control or schedule diverges from Destinus priorities", High, "Reported 49% Destinus economic participation", Medium-high]
      - [Pre-IPO and debt capital, New investors / lenders, "Qualification, production, and working-capital funding", Unknown, "Raise fails, dilutes heavily, or brings restrictive terms", High, "Reported prior convertibles, shareholder loans, and bank facility", High]
    notes: Roles come from public announcements and reporting; concentration, severity, and residual exposure are analyst assessments because executed control, substitution, covenant, and fallback terms were not disclosed.
    claimRefs: [CR004, CR010, CR011, CR012, CR013, CR014]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: Export controls, qualification, security, programme coordination, and financing remain high-residual risks until external gates and private evidence are cleared.
    data:
      columns:
        - label: Likelihood
          detail: Analyst assessment from disclosed status, not a measured probability.
        - label: Impact
          detail: Potential effect on legal delivery, acceptance, operations, or financing.
        - label: Mitigation maturity
          detail: Maturity visible in retained public evidence.
        - label: Residual exposure
          detail: Exposure after currently disclosed mitigation.
      rows:
        - label: Export licensing and sanctions
          note: Product and destination licence register not public.
          values: [High, Critical, Unknown, High]
        - label: Qualification and reliability
          note: Common-framework operational results remain pending.
          values: [Medium, Critical, Early, High]
        - label: Multi-party programme integration
          note: Binding terms and interface controls were not disclosed.
          values: [Medium, Critical, Early, High]
        - label: Production quality and scale
          note: Yield, defect, and acceptance data were unavailable.
          values: [Medium, High, Unknown, High]
        - label: Physical and cyber security
          note: Reported targeting raises exposure but does not establish an incident.
          values: [Medium, Critical, Unknown, High]
        - label: Financing and liquidity
          note: Cash availability, covenants, and working capital were not public.
          values: [Medium, High, Unknown, High]
    approximationNotes: Qualitative positions are analyst assessments; no numeric probabilities or loss magnitudes are implied.
    claimRefs: [CR015, CR016]
callouts:
  - calloutType: risk
    title: External gates dominate
    body: Product performance alone cannot eliminate exposure when licences, approvals, partner interfaces, and financing determine whether systems can be delivered at scale.
    claimRefs: [CR001, CR004, CR005, CR011, CR012]
  - calloutType: recommendation
    title: Thesis-break discipline
    body: Re-underwrite immediately after a legal delivery block, material operating disruption, repeated qualification delay, critical-partner loss, or financing failure.
    claimRefs: [CR009, CR013, CR015]
