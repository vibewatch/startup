    title: Workflow / use-case table
    columns: [User job, Current workflow, Destinus solution, Measurable benefit or stated capability, Limitation]
    rows:
      - [Detect and defeat aerial threats, "Sensors classify incoming threats and cue an interceptor", "Vorexon within an integrated sensor and fire-control network", "Designed for speed above Mach 2 and engagement beyond 20 km", "Still under development; no launch customer announced"]
      - [Protect critical sites from rockets and glide bombs, "Defend command posts, radars, batteries, logistics hubs, and ammunition stores", "Vorexon point-defense concept", "Operator remains in command of engagement decisions", "Operational testing is planned, not evidenced as complete"]
      - [Conduct long-range precision strike, "Deploy a missile from a fixed, mobile, or maritime platform", "RUTA Block 2 containerised launch architecture", "Broader launcher compatibility and reduced logistics footprint are reported", "Public source does not quantify reliability or cost exchange"]
      - [Operate in GNSS-denied conditions, "Use onboard sensing and guidance when satellite navigation is disrupted", "Hornet Block 2 EO/IR and radar guidance", "Autonomous engagement is stated on the official product page", "Independent verification and certification evidence are absent"]
      - [Run contested loitering-munition missions, "Plan, launch, detect, engage, and assess a mission", "Complete system submitted to EDA Sentinel Strike Challenge", "Trial framework includes degraded and contested conditions", "Public outcome is scheduled for early 2027"]
      - [Scale European missile manufacturing, "Combine specialist subsystem design with a prime's production system", "Rheinmetall Destinus Strike Systems", "Rheinmetall majority stake and intended scalable operational missiles", "Regulatory approval and final agreement remain conditions"]
    notes: "The benefit column preserves stated or reported capabilities; it does not convert marketing or planned trials into independently measured outcomes."
    claimRefs: [CE005, CE006, CE009, CE010, CE011, CE013]
  - id: TE003
    title: Technology / operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [Mission and fire control, "Prioritize threats and authorize engagements", "External radar and operator command", "Rules of engagement, latency, and false positives"]
      - [Guidance and sensing, "Detect, classify, and guide toward targets", "Radar plus EO/IR and onboard processing", "GNSS denial, sensor quality, and validation"]
      - [Autonomy software, "Environmental awareness, navigation, and swarm coordination", "Daedalean AI and Destinus flight software", "Certification, explainability, and edge-case behavior"]
      - [Airframe and control surfaces, "Provide flight and terminal maneuverability", "Foldable wings and control surfaces for RUTA Block 2", "Deployment failure and aerodynamic qualification"]
      - [Propulsion, "Generate flight and interception performance", "Turbojet and booster subsystems", "Engine maturity, supply chain, and thermal performance"]
      - [Launch and logistics, "Store, transport, and deploy systems", "Sealed containerised modules or mobile platforms", "Launcher compatibility, handling, and export controls"]
      - [Industrial integration, "Assemble, test, and scale production", "Rheinmetall facilities and program capacity", "Regulatory approval, acceptance testing, and throughput"]
    notes: "This is an evidence-led operating model assembled from reported architecture elements; it is not a disclosed reference design or verified system block diagram."
    claimRefs: [CE005, CE007, CE008, CE011, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Destinus's public product architecture spans mission control, autonomy, flight systems, propulsion, launch logistics, and industrial integration.
    data:
      layers:
        - label: Mission and control
          detail: Threat detection, mission planning, and operator authorization.
          items:
            - name: Sensor and fire-control network
              detail: External radar detects and classifies threats; operator remains in command for Vorexon engagements.
            - name: Mission planning
              detail: EDA trial framework covers planning, launch, target detection, engagement, and post-strike assessment.
        - label: Autonomy and guidance
          detail: Onboard sensing, navigation, and decision-support software.
          items:
            - name: AI avionics
              detail: Daedalean material describes AI-assisted piloting, environmental awareness, and GNSS-denied navigation.
            - name: EO/IR and radar guidance
              detail: Official Hornet Block 2 material states autonomous engagement capability.
        - label: Airframes and effects
          detail: Interceptor, ISR, and long-range strike vehicle families.
          items:
            - name: Hornet and LORD
              detail: Small dual-use UAV and ISR product lines described by Sacra.
            - name: RUTA family
              detail: Block 1 serial production is reported; Block 2 is flight-tested and Block 3 remains planned.
        - label: Propulsion and launch
          detail: Boosters, turbojets, and containerised or mobile deployment.
          items:
            - name: Boosters and turbojet
              detail: RUTA Block 2 test covered an in-line booster; RUTA Block 3 is described with a future T220 turbojet.
            - name: Containerised deployment
              detail: RUTA Block 2 is described as transportable, storable, and launchable from sealed modules.
        - label: Industrial integration
          detail: Prime-partner manufacturing, testing, and European trial pathways.
          items:
            - name: Rheinmetall partnership
              detail: Planned 51%/49% venture combines Rheinmetall production capacity with Destinus technology and system design.
            - name: European trial pathway
              detail: EDA Sentinel Strike Challenge provides a common operational assessment framework.
        - label: Trust and qualification
          detail: Safety, resilience, reliability, operational suitability, and regulatory approval evidence.
          items:
            - name: EDA assessment criteria
              detail: Public trial framework includes performance, resilience, reliability, safety, and operational suitability.
    claimRefs: [CE005, CE007, CE009, CE010, CE011, CE014]
