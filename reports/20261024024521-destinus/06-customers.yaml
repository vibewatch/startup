company:
  name: Destinus
chapter:
  number: 6
  title: Customers
  summary: Destinus has credible evidence of military evaluation, partner-enabled production pathways, and field demonstrations, but public evidence still separates trials and selections from paid production deployments, repeat purchasing, and retention.
sections:
  - id: buyer-segments
    title: Buyer segments and adoption surfaces
    body: >-
      Destinus sells into sovereign defense procurement rather than a transparent
      self-serve market. The visible buyer and user set includes European armed
      forces, national procurement agencies, and industrial primes that can qualify,
      integrate, and manufacture systems. Defence Industry Europe reported that Destinus
      was among the five highest-ranked applicants in the first stage of the European
      Defence Agency Sentinel Strike Challenge and would demonstrate its loitering
      munition system in an operational trial hosted by the Portuguese Army. The
      source describes a common assessment framework covering planning, launch, target
      detection, engagement, post-strike assessment, resilience, reliability, safety,
      and operational suitability; this is meaningful customer-validation activity,
      but it is not evidence of a contract or completed acquisition. The Spanish Navy
      test likewise shows a user-facing integration surface: a single Hornet Block 1
      interceptor was launched from a containerized system installed on the Santa
      María frigate, while the Navy did not release threat-scenario, engagement, or
      firing-outcome details. The customer map therefore supports military evaluation
      and integration readiness, not a verified active-account count.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption trajectory and reference quality
    body: >-
      Public adoption evidence is strongest where a named military organization
      conducted or hosted a live evaluation. The Spanish Army's TEC 3 exercise is
      described as a working laboratory intended to validate emerging autonomous
      technologies before potential acquisition; Destinus demonstrated a live
      container-launched Hornet B1 interception and displayed Ruta. The Spanish Navy
      trial provides a second named-user surface, and the Portuguese Army/EDA
      challenge provides a third pathway with a scheduled second-stage operational
      assessment and results expected in early 2027. These references improve
      confidence that the products are being evaluated in realistic settings, while
      leaving conversion, acceptance, and purchasing outcomes unresolved. UAV Show
      presents the company's own broader claim of “Thousands of successful real-world
      missions,” but that statement is not accompanied by a denominator, customer
      list, contract value, or independent validation in the fetched text.
      International Finance separately relays Destinus' claim that Ruta Block 1
      reached serial production at a “meaningful scale,” again without a unit count
      or buyer denominator. Aviation Week's May 2026 item describes a 2,000-km
      missile as still planned for flight testing the following year. Customer
      count, utilization, renewal, and revenue attribution remain undisclosed.
    claimRefs: [CU005, CU006, CU007, CU008, CU013, CU014]
    tableRefs: [TU002]
  - id: expansion-concentration
    title: Expansion paths and concentration risks
    body: >-
      Destinus' clearest expansion mechanism is industrial and systems-level rather
      than software-style land-and-expand. Thales said its cooperation agreement
      combines Destinus' interceptor and long-range-effector portfolio with Thales'
      air-defense, radar, critical-systems, and production expertise, including joint
      production of the Hornet interceptor and interoperability with Thales systems.
      Breaking Defense separately reported a planned Rheinmetall Destinus Strike
      Systems joint venture with Rheinmetall holding 51% and Destinus 49%, subject to
      regulatory approval, focused on cruise missiles and ballistic rocket artillery.
      These relationships could widen qualification, integration, and procurement
      access, but the sources describe plans and structures rather than recognized
      recurring revenue or delivered unit volumes. Concentration risk is consequently
      high: a small number of state programs, prime partners, and evaluation
      campaigns may determine conversion. BattlePolicy's public page identifies a
      customers-and-contracts section but reserves the underlying detail for paid
      subscribers, so it cannot close the public evidence gap. Strategic partner
      momentum must therefore remain separate from verified customer economics.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
