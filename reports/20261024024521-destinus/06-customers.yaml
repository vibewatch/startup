      - [Portuguese Army, "Host for loitering-munition operational trial", "Pilot/evaluation", "Common mission-cycle assessment planned", "No award or purchase disclosed"]
      - [Spanish Navy, "Hornet Block 1 launch from F-81 Santa María", "Live demonstration", "Containerized naval integration evaluated", "Firing outcome and follow-on order not disclosed"]
      - [Spanish Army, "TEC 3 live container-launched interception", "Live demonstration", "System tested in field experimentation context", "Exercise is described as before potential acquisition"]
