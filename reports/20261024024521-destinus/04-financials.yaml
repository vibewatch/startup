      - ["Autonomy and UAV capabilities", "Integrated product sales, software-enabled systems, or licensing", "Daedalean acquisition was reported as a CHF 180 million cash-and-stock transaction", "Revenue contribution, recurring share, and integration costs are not disclosed", "Purchase accounting, cash consideration, acquired revenue, retention costs and integration plan"]
      - ["Grants and financing", "Non-revenue capital support", "Public sources report grants, debt, convertibles and equity financing", "Funding raised is not revenue or cash available", "Reconcile proceeds, restrictions, debt service, convertibles, grants and remaining liquidity"]
    notes: "Public-source snapshot as of 2026-10-24; reported financing is separated from revenue, and undisclosed fields are not estimated."
    claimRefs: [CI001, CI003, CI007, CI009, CI010, CI014]
  - id: TI002
    title: Pricing, traction, and monetization checkpoints
    columns:
      - Evidence point
      - Stage reached
      - Disclosed financial value
      - What it supports
      - What remains unknown
    rows:
      - ["Aeon-Destinus xTech proposal", "One of 10 Topic 1 finalists", null, "Buyer problem relevance and competitive participation", "Award, proposal price, unit cost, delivery volume and revenue"]
      - ["EDA Sentinel Strike Challenge", "One of five highest-ranked Stage 1 applicants advancing to operational trial", null, "Qualification progress under a common assessment framework", "Procurement decision, contract value, order volume and payment terms"]
      - ["Ruta Block 1", "Company-described serial production at a meaningful scale", null, "Claimed manufacturing progression", "Units, customers, contract status, delivery acceptance and recognized revenue"]
      - ["Ruta Block 3", "Flight testing of a 2,000-km missile reported as planned for 2027", null, "Forward development milestone", "Development spend, test funding, qualification path, order timing and revenue"]
    notes: "Null means the retained assigned source disclosed no financial value; stage labels preserve the source wording and do not imply conversion."
    claimRefs: [CI001, CI002, CI003, CI005, CI006]
  - id: TI003
    title: Unit economics and capital-adequacy ledger
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Realized selling price", null, "Unavailable", "Required to distinguish affordability positioning from realized economics", "Invoices and contracts by product, customer and delivery cohort"]
      - ["Gross margin by product", null, "Unavailable", "Hardware mix, warranty, yield and subsystem sourcing determine contribution", "Audited gross-margin bridge by product and program"]
      - ["CAC, bid cost and sales cycle", null, "Unavailable", "Government competitions and prime partnerships can require long pre-award investment", "Pipeline aging, bid-and-proposal spend, win rate and payback by channel"]
      - ["Cash, monthly net cash use and runway", null, "Unavailable", "Funding announcements do not establish available liquidity", "Bank statements, 24-month cash forecast, covenants and downside runway"]
      - ["Daedalean consideration", "CHF 180 million combined cash and stock", "Medium; company-originated report", "The undisclosed cash component affects liquidity and dilution", "Closing statement, cash paid, shares issued, earn-outs and assumed liabilities"]
      - ["Directional unmanned-systems comparator", "$292.0 million 2025 revenue; $18.1 million adjusted EBITDA at Kratos KUS", "Medium; competitor-reported and not a Destinus benchmark", "Shows that scaled unmanned-systems revenue can still carry modest adjusted EBITDA and cost pressure", "Build a Destinus-specific product contribution bridge rather than importing competitor margins"]
    notes: "Values are source-reported, not normalized across currencies or accounting bases; Kratos is a directional competitor comparator only."
    claimRefs: [CI002, CI007, CI008, CI009, CI010, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Evidence-to-cash conversion path
    type: flow
    summary: >-
      Public evidence reaches testing, competition, and production claims, while award, delivery,
      revenue, and gross-profit conversion remain undisclosed.
    data:
      nodes:
        - id: development
          label: Product development
          detail: Ruta Block 2 testing and Ruta Block 3 planning provide technical-stage evidence.
          status: evidenced
        - id: qualification
          label: Qualification and trials
          detail: EDA operational trials and U.S. Army finalist status show evaluation-stage participation.
          status: evidenced
        - id: award
          label: Contract award
          detail: No retained source discloses a resulting award value or funded order.
          status: unverified
        - id: production
          label: Production
          detail: Ruta Block 1 is company-described as serial production at meaningful scale, without units.
          status: company-claimed
        - id: delivery
          label: Delivery and acceptance
          detail: Delivered quantities, acceptance milestones, warranties and payment timing are undisclosed.
          status: unverified
        - id: revenue
          label: Recognized revenue
          detail: Public estimates conflict and are not reconciled to contracts or audited accounts.
          status: unverified
        - id: gross-profit
          label: Gross profit and cash conversion
          detail: Product margins, working capital, capex and cash conversion are not disclosed.
          status: unverified
    approximationNotes: "The ordered flow is a diligence framework, not a measured funnel; it implies no conversion rate, timing, or value."
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI015]
callouts:
  - calloutType: risk
    title: Capital raised is not cash available
    body: >-
      Partner and analyst sources report different cumulative financing totals, and the cash portion
      of the Daedalean consideration is undisclosed. Without a capitalization table, debt schedule,
      current cash balance, and monthly net cash use, runway cannot be inferred.
    claimRefs: [CI007, CI008, CI009, CI010, CI014]
  - calloutType: recommendation
    title: Underwrite contracts and cash conversion, not publicity milestones
    body: >-
      Trials, finalist status, and production claims should enter a contract-level bridge from funded
      award through delivery, acceptance, revenue, gross profit, working capital, and cash collection.
    claimRefs: [CI001, CI002, CI003, CI005, CI006, CI015, CI016]
