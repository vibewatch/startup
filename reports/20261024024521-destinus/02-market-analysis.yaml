      - [Research and Markets, "2025-2030", Global, "Defense drones: USD 12.75B in 2025; USD 13.73B in 2026; USD 17.74B in 2030", "7.7% historic step to 2026; 6.6% forecast CAGR", "Factory-gate sales of defence drones and related services", medium, "Different scope and value definition; not additive to Grand View Research"]
      - [European Commission, "2021-2027 and 2026", European Union, "EDF: nearly EUR 7.3B total; EUR 1B 2026 work programme", null, "Collaborative defence research and capability-development grants", high, "Funding envelope requires eligibility and consortium participation; it is not product revenue"]
    notes: "Values retain source currencies, periods, metric names and denominators. Different scopes and methodologies preclude a derived Destinus TAM, SAM or SOM."
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM016]
  - id: TM003
    title: Segment, buyer and adoption path
    columns: [Segment, Economic buyer, User, Payer or budget, Adoption workflow, Trigger, Unresolved underwriting item]
    rows:
      - [Loitering munitions, "Defence ministry or army procurement office", "Operational strike unit", "National defence budget; challenge activity may fund evaluation", "Proposal, common trial, qualification, award, delivery and acceptance", "Performance under realistic, degraded and contested conditions", "Trial result, purchase vehicle, funded value and production quantity"]
      - [Long-range strike, "National missile or long-range-fires programme", "Strike command", "National procurement budget or partner-led programme", "Requirement, flight test, qualification, production and sustainment", "Range, payload, launcher flexibility and scalable deployment", "Awarded customer, unit price, delivery schedule and margin"]
      - [Upper-layer missile defence, "Participating European governments", "Integrated air and missile-defence operators", "Multinational programme budgets and possible collaborative funding", "Letter of intent, binding consortium, engineering, test and procurement", "Sovereign upper-layer gap and NATO interoperability", "Destinus work share, consortium economics and funded programme status"]
      - [Autonomous UAV and counter-UAS, "Defence and security procurement bodies", "Mission operators and intelligence units", "National capability and innovation budgets", "Pilot, integration, operational assessment and fleet follow-on", "Autonomy, resilience and rapid deployment", "Customer diversification beyond Ukraine and repeat-order evidence"]
      - [Collaborative defence R&D, "European Commission and Member States", "Cross-border industrial consortium", "EDF grant plus national contributions", "Eligible consortium, call, award, development and acceptance", "Alignment with named capability priorities", "Grant attribution, co-funding need and route from R&D to procurement"]
    notes: "Buyer roles are an evidence-constrained mapping. Public sources identify programmes and pathways but do not disclose Destinus pricing, contract value or conversion probability."
    claimRefs: [CM007, CM008, CM009, CM010, CM012, CM014, CM015]

