companyProfile:
  summary: >-
    Destinus is a private European defense manufacturer focused on scalable strike, air-defense, interception,
    propulsion, and autonomous aircraft systems. Its public profile shows movement from aerospace research toward
    defense production and industrial partnerships, but the available evidence does not establish audited revenue,
    backlog, customer concentration, or a complete ownership and governance picture.
