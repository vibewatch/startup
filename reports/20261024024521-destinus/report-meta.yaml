  topStrengths:
    - Product scope spans autonomous strike, interception, propulsion, and air-defense systems.
    - Reported evaluations, testing, and industrial partnerships indicate meaningful defense-program momentum.
    - The company has attracted substantial reported financing and strategic ecosystem attention.
  topRisks:
    - Audited revenue, backlog, bookings, margins, cash, and runway are not publicly established.
    - The reported valuation target rests on projections and a potential financing rather than a verified closed round.
    - >-
      Export controls, qualification, procurement conversion, customer concentration, and founder-governance risks could
      delay scale.
  unresolvedGaps:
    - Audited revenue quality, backlog, bookings, and customer concentration needed to test the reported revenue story.
    - Cap table, debt, convertibles, preference stack, and current liquidity needed for return math.
    - Product-by-product export, qualification, shipment, and contract status needed to underwrite conversion and scale.
