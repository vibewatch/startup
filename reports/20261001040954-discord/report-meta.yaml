companyProfile:
  summary: >-
    Discord is a late-stage private communications platform founded in 2015 that built a large, cross-platform community
    product around servers, voice, video, text, bots, and premium Nitro features. It remains best known for gaming
    communities, but its usage has broadened into creator, developer, and general social groups. The business is now led
    by CEO Humam Sakhnini after Jason Citron stepped to the board in 2025, and it is preparing for a potential
    public-market debut with only partial financial disclosure available.
  foundedDate: '2015-01-01'
