callouts:
  - calloutType: "insight"
    title: "Executive Transition Signals Strategic Shift Toward Public-Market Profitability"
    body: "The transition from founder-CEO Jason Citron to former Activision Blizzard executive Humam Sakhnini in April 2025 marks a structural turning point for Discord. Sakhnini previously expanded King Digital's operating profit from $600M to $1.3B, bringing seasoned operational discipline to a platform whose annual ARPU (~$3.50) lags traditional consumer networks. His recruitment directly preceded the confidential IPO filing in January 2026."
    claimRefs:
      - "CO002"
      - "CO011"
      - "CO013"
  - calloutType: "risk"
    title: "Secondary Valuation Compression and Underage Safety Liabilities Compound IPO Execution"
    body: "Secondary equity transactions on Forge Global indicate an $8.53B valuation as of July 2026, representing an approximately 44% reset from the $15.2B Series I pricing established in 2021. In parallel with valuation multiple compression, Discord faces material legal scrutiny, including a state lawsuit filed by the New Jersey Attorney General over child safety safeguards and potential compliance friction under emerging federal youth protection frameworks."
    claimRefs:
      - "CO009"
      - "CO013"
      - "CO016"
