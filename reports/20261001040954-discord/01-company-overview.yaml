company:
  name: "Discord"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Discord is a San Francisco-based voice, video, and text communication platform serving over 200 million monthly active users, originally created for gamers and expanding into broader developer and creative communities. Led by CEO Humam Sakhnini following co-founder Jason Citron's transition to the board in April 2025, the company has raised over $1 billion in primary capital and confidentially filed for a U.S. IPO in January 2026 amid secondary valuations resetting from its $15.2 billion 2021 peak to approximately $8.53 billion in mid-2026."
sections:
  - id: "corporate-identity-and-leadership"
    title: "Corporate Identity, Operating Governance, and Leadership Structure"
    body: "Discord Inc. operates as a late-stage private communications platform founded in 2015 by Jason Citron and Stanislav Vishnevskiy, originating from gaming development efforts initiated at Phoenix Guild and Hammer & Chisel in 2012. Headquartered at 444 De Haro Street in San Francisco, California, the company provides structured voice channels, low-latency text chat, video calling, and interactive social infrastructure. Operating governance underwent a decisive transition on April 28, 2025, when Citron stepped down from the chief executive role after 13 years to become an advisor and board member, passing executive leadership to Humam Sakhnini, the former Vice Chairman of Activision Blizzard and past President of King Digital Entertainment. Vishnevskiy continues to direct core platform architecture and engineering as Chief Technology Officer, preserving technical continuity while executive management aligns for public market scrutiny. Governance is overseen by an active 14-member board of directors featuring venture partners from benchmark financing rounds alongside independent directors, without any disclosed dual-class voting control structure."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-valuation"
    title: "Capitalization History, Secondary Repricing, and Ownership Profile"
    body: "Discord has secured just over $1 billion across 10 primary venture and strategic equity funding rounds since 2012. Early capitalization was anchored by YouWeb incubation, Benchmark Capital, and Tencent in 2015, followed by institutional growth financings led by Greylock Partners, Greenoaks Capital, and Index Ventures between 2016 and 2018. During the 2020 pandemic communications surge, Discord completed two separate $100 million financings at valuations of $3.5 billion and $7.0 billion, ultimately turning down an acquisition bid from Microsoft reported at $10 billion to $12 billion in early 2021. The company's definitive primary pricing benchmark closed in September 2021, when Dragoneer Investment Group led a $500 million Series I round at a post-money valuation of $15.2 billion with participation from Baillie Gifford, Coatue Management, Fidelity Investments, and Franklin Templeton. Following the broader market multiple contraction, secondary transactions priced Discord stock at $31.31 on July 8, 2026, implying an $8.53 billion Forge Price valuation, roughly 44% below its primary peak. Although Bloomberg reported a confidential U.S. initial public offering submission on January 6, 2026, backed by lead underwriters Goldman Sachs and J.P. Morgan, Discord has not confirmed an explicit listing date, price range, or exchange venue."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
  - id: "platform-scale-and-operating-milestones"
    title: "Platform Scale, Operational Metrics, and Milestone Evolution"
    body: "Discord's operating scale has expanded from a niche gamer chat utility to an extensive engagement hub logging over 200 million monthly active users, 656 million registered accounts, and over 90 million daily active users. More than 90% of active users play video games, and approximately 40% launch a game within an hour of opening Discord, sustaining deep daily immersion such as the 117-minute daily average reported among U.S. college student cohorts. Monetization remains primarily centered on Nitro and Nitro Basic premium subscriptions, delivering approximately $575 million to $600 million in annual revenue for 2023, while trailing 2024 annualized estimates range from $700 million to $900 million. However, annual average revenue per user remains modest at approximately $3.50, constrained by a free-tier user base where paid subscription conversion hovers near 3% to 5%. To diversify away from purely consumer subscription revenue, Discord has introduced rewarded video Quests, developer Social SDKs, and in-game commerce integrations like Marvel Rivals. At the same time, platform expansion faces headwinds including a 17% workforce reduction in early 2024, stringent child-safety litigation initiated by the New Jersey Attorney General, and heightened federal regulatory scrutiny under pending youth online safety legislation."
    claimRefs:
      - "CO006"
      - "CO012"
      - "CO013"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
