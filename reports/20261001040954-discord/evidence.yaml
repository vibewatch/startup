evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-statements
    missingEvidence: >-
      Audited financial statements for FY2024 and FY2025 detailing GAAP revenue, gross margin, operating expenses, and
      net cash burn.
    whyItMatters: >-
      Without formal audited filings, pre-IPO revenue estimates cannot verify whether Discord has reached GAAP
      profitability or sustainable unit economics.
    diligencePath: >-
      Review the public Form S-1 registration statement once SEC confidential review concludes and public filings are
      released.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Comprehensive fully diluted capitalization table, preferred share liquidation preferences, and founder voting
      rights agreements.
    whyItMatters: >-
      The distribution of economic rights and liquidation preferences between early venture backers and late-stage
      $15.2B Series I investors determines common share dilution upon IPO.
    diligencePath: >-
      Inspect Exhibit 3 (Articles of Incorporation) and Exhibit 4 (Investor Rights Agreements) in Discord's forthcoming
      public S-1 filing.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: Audited active-user cohorts, payer conversion, ARPU, retention, and revenue by geography and use case.
    whyItMatters: >-
      Without compatible denominators, the broad category forecast cannot be converted into a defensible SAM or
      attainable SOM.
    diligencePath: >-
      Request monthly cohort exports and audited revenue by geography, product, payer type, and community segment;
      reconcile them to billing records.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: monthly-active-users
    missingEvidence: A company-defined current MAU and DAU series with consistent activity thresholds and reporting periods.
    whyItMatters: >-
      The retained 200M-plus, 231M, and roughly 260M figures cannot be compared cleanly and materially affect conversion
      estimates.
    diligencePath: >-
      Obtain Discord's metric dictionary and monthly MAU, DAU, and registered-account series, then reproduce every
      published conversion denominator.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-budget
    missingEvidence: >-
      Independent procurement evidence and representative willingness-to-pay data for creators, brands, developers, and
      community operators.
    whyItMatters: The buyer map identifies roles but cannot quantify budget ownership, sales cycle, or addressable spend by segment.
    diligencePath: >-
      Interview a stratified sample of server owners and payers, review enterprise and advertising contracts, and test
      pricing by geography.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Independent cohort evidence on server migration completion, user churn, multi-homing, export success, and
      post-migration engagement.
    whyItMatters: >-
      Without measured outcomes, switching cost and lock-in can only be inferred from product control, vendor claims,
      and feature differences.
    diligencePath: >-
      Request Discord retention and server-overlap cohorts, interview administrators who completed migrations, and test
      account and server export paths.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited GAAP income statements, cash flow statements, and balance sheets confirming gross margin, net income, cash
      on hand, and debt obligations.
    whyItMatters: >-
      Without audited financial statements, reported positive adjusted EBITDA cannot be reconciled against stock-based
      compensation, capitalized engineering costs, or net cash burn.
    diligencePath: >-
      Review the public Form S-1 registration statement upon SEC unsealing or request pre-IPO confidential financial
      disclosure under NDA.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-and-churn
    missingEvidence: >-
      Subscriber cohort retention, monthly churn rates, customer lifetime value (LTV), and subscriber acquisition costs
      (CAC) across Nitro tiers.
    whyItMatters: >-
      High voluntary churn could require constant top-of-funnel replacement to maintain current subscription run-rates,
      capping long-term operating leverage.
    diligencePath: Obtain cohort-level subscriber retention dashboards and marketing acquisition spend from company management.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: infrastructure-costs
    missingEvidence: Detailed telemetry and financial disclosure on per-user voice and video bandwidth infrastructure unit costs.
    whyItMatters: >-
      Real-time media streaming and high-frequency WebRTC routing represent Discord's largest variable server
      infrastructure cost, directly influencing gross margin trajectories.
    diligencePath: >-
      Review management disclosure during pre-IPO technical diligence regarding cloud infrastructure contracts, egress
      bandwidth rates, and CDN peering agreements.
  - type: missing-source
    severity: minor
    topic: bot-ecosystem-retention
    missingEvidence: >-
      Comprehensive metrics on third-party bot developer churn, lifecycle retention, and runtime hosting stability
      across major platforms.
    whyItMatters: >-
      Ecosystem stickiness depends heavily on volunteer community developers whose operational costs are currently
      absorbed by external hosting providers.
    diligencePath: >-
      Request telemetry from Discord Developer Portal tracking monthly active bot tokens, API invocation volumes, and
      developer registration churn.
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Subscriber cohorts, gross retention, net revenue retention, voluntary churn, renewal rates, and contract or
      subscription tenure.
    whyItMatters: >-
      Scale and usage do not establish whether paid adoption is durable or whether retention supports attractive
      lifetime value.
    diligencePath: >-
      Request monthly Nitro and server-boost cohorts by plan, geography, acquisition channel, tenure, gross retention,
      and net revenue retention.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named-community-proof
    missingEvidence: >-
      A verified roster separating paid customers, partners, public communities, pilots, and unsupported logo or
      member-count references.
    whyItMatters: >-
      Public server membership demonstrates reach but cannot establish commercial status, active use, outcomes, or
      renewal.
    diligencePath: >-
      Request the top 25 communities by active users and revenue, then verify deployment status and outcomes with named
      references.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue concentration by payer, geography, Nitro plan, server boosts, platform channel, and top community.
    whyItMatters: >-
      A large user base can coexist with material payer or geographic concentration, and public audience shares do not
      reveal revenue exposure.
    diligencePath: >-
      Obtain revenue and gross-profit concentration schedules for the top payers, countries, plans, app stores, and
      community categories.
  - type: private-evidence-only
    severity: material
    topic: regulatory-enforcement-exhaustiveness
    missingEvidence: >-
      Comprehensive non-public regulatory inquiry log covering FTC, state attorneys general, and international data
      protection authorities.
    whyItMatters: >-
      State AG litigation in Texas may foreshadow coordinated multi-state actions or FTC consent decree proceedings that
      impose broader compliance costs.
    diligencePath: >-
      Review litigation disclosures in S-1 registration statement and submit formal FOIA requests to relevant state
      consumer protection bureaus.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: Audited GAAP income statement, gross margins, cash burn rate, and balance sheet cash reserves.
    whyItMatters: Prevents independent determination of operating leverage, unit economics, and cash runway.
    diligencePath: Review public S-1 registration statement once made accessible to public investors.
    relatedQuestionRefs:
      - QV008
