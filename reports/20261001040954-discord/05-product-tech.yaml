    title: "Product architecture map"
    type: "stack"
    summary: "Six-layer architectural stack of Discord real-time communications infrastructure from client applications down to persistent storage and developer platforms."
    approximationNotes: "Represents Discord core production architecture synthesized from engineering disclosures, database migration reports, and developer documentation."
    claimRefs:
