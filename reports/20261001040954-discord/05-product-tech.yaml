      - "CE012"
      - "CE013"
    data:
      layers:
        - label: "Client & Presentation Layer"
          detail: "Cross-platform client applications across Windows, macOS, Linux, iOS, Android, and web browsers providing voice, video, text, and rich game presence detection."
        - label: "Gateway & Connection Management Layer"
          detail: "Distributed Elixir BEAM cluster terminating persistent WebSocket connections, managing user presence, and providing custom session resumption buffers."
        - label: "Community & Guild State Layer"
          detail: "In-memory Elixir Guild Process actor model isolating each community so failures and traffic spikes in one server never degrade neighboring servers."
        - label: "Data Services Routing & Coalescing Layer"
          detail: "Rust-based intermediate microservices with Tokio async I/O, gRPC endpoints, and consistent hash routing to coalesce concurrent reads into single queries."
        - label: "Persistent Message Storage Tier"
          detail: "ScyllaDB C++ distributed NoSQL cluster utilizing local NVMe SSDs, RAID persistence, and shard-per-core topology storing trillions of messages."
        - label: "Developer Platform & Interaction Layer"
          detail: "REST API, WebSocket Gateway, and HTTP Interactions Webhooks supporting OAuth2 authentication, bot tokens, and developer automation frameworks."
callouts:
  - calloutType: "strength"
    title: "Architectural Decoupling and Request Coalescing Protect Platform Availability"
    body: "Discord's deployment of intermediary Rust-based data services with request coalescing effectively shields ScyllaDB from hot-partition traffic spikes during viral community announcements, resolving the severe JVM garbage collection pauses and compaction backlogs that previously plagued its Cassandra clusters."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE007"
  - calloutType: "risk"
    title: "Unindexed Ephemeral Records and Feed Deficits Limit Enterprise Workflow Durability"
    body: "While major enterprise teams like Google DV360 have established developer support presence on Discord, the platform's ephemeral discussion model lacks search-engine indexing and native RSS syndication, forcing developer tooling teams to implement custom bot relays and accepting substantial long-term knowledge-preservation trade-offs."
    claimRefs:
      - "CE014"
      - "CE015"
