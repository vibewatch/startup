      - Included spend or activity
      - Excluded spend or substitute
      - Buyer or payer
      - Relevance to Discord
    rows:
      - [Consumer group communication, "Free server, text, voice, and video use; optional premium features", "Carrier messaging and one-to-one communications", "Individual member", "Core audience acquisition and engagement layer"]
      - [Gaming coordination, "Persistent game communities, voice channels, bots, and sponsored game actions", "In-game voice alone and game-specific forums", "Player, community member, or game publisher", "Origin market and continuing engagement anchor"]
      - [Creator and interest communities, "Member subscriptions, boosts, gated roles, and community tools", "Public-feed followers and standalone membership sites", "Member, creator, or server owner", "Extends usage beyond gaming"]
      - [Developer application ecosystem, "Premium bots, apps, and integrations used inside servers", "Standalone SaaS tools and self-hosted bots", "Developer, administrator, or end user", "Adds functionality and marketplace take-rate potential"]
      - [Enterprise workplace collaboration, "Community support and informal professional groups only", "Seat-based workplace messaging and productivity suites", "Enterprise IT or department budget owner", "Adjacent but excluded from the core market boundary"]
      - [Broadcast social media, "Sponsored Quests or discovery that leads into communities", "Algorithmic public feeds and creator reach sold primarily through impressions", "Advertiser or brand", "Adjacent monetization pool, not the core communication category"]
    notes: "Boundary synthesis from Discord's terms, TrendX's category definition, and independent business-model analysis; rows describe market logic, not measured spend."
    claimRefs: [CM001, CM002, CM004, CM011, CM012]
  - id: TM002
    title: Public sizing lenses and their limits
    columns:
      - Publisher or lens
      - Period and geography
      - Reported value
      - Growth or methodology
      - Confidence
      - Limitation
    rows:
      - [TrendX Discord Market, "2025 base; global", "USD 850.16 million", "Secondary research and proprietary data models", "Low-medium", "Vendor-defined category; underlying model and spend sample are not disclosed"]
      - [TrendX Discord Market forecast, "2034; global", "USD 3,917.09 million", "18.50% CAGR for 2026-2034", "Low", "Forecast is not Discord revenue and is not an independently triangulated TAM"]
      - [Official MAU floor summarized by Axis and ShaneTheGamer, "2025; global", "More than 200 million monthly active users", "Company-published audience threshold", "Medium", "Audience is not spend; the company does not update the figure on a fixed schedule"]
      - [Third-party MAU range, "Q2 2025 through 2026 summaries; global", "231 million to about 260 million monthly active users", "Aggregated tracker and survey estimates", "Low-medium", "Definitions and vintages differ; upper values are not company disclosures"]
      - [Nitro payer estimate, "Mid-2025; global", "About 7.3 million subscribers", "Secondary estimate; roughly 3.0%-3.6% of a 200M+ MAU base", "Low-medium", "Subscriber estimate is unaudited and does not measure all payers or revenue"]
    notes: "Values are separate lenses with different units, periods, and denominators; revenue, audience, registered accounts, and subscribers are not interchangeable."
    claimRefs: [CM003, CM005, CM006, CM007, CM016]
  - id: TM003
    title: Segment, buyer, user, and payer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow and budget owner
      - Adoption trigger
    rows:
      - [Friend and hobby groups, "Server creator or informal administrator", "Community members", "Usually none; individual Nitro purchaser", "Consumer discretionary spend; no formal procurement", "Need for persistent text and real-time voice"]
      - [Gaming communities, "Server owner, moderator, or game-community lead", "Players and fans", "Members buying Nitro or boosts; publisher for Quests", "Consumer spend or game marketing budget", "Game coordination, launch community, or rewarded action"]
      - [Creators and paid communities, "Creator or community operator", "Fans and members", "Member subscription purchaser or booster", "Creator-business revenue and community tooling", "Exclusive roles, channels, and direct community access"]
      - [Developer and open-source communities, "Maintainer or administrator", "Contributors and users", "App buyer, developer, or sponsor where applicable", "Developer tooling or community-support budget", "Support, collaboration, moderation, and bot automation"]
      - [Brand and product communities, "Community or marketing manager", "Customers, prospects, and advocates", "Brand for sponsored activity; individuals for premium features", "Marketing, support, or community budget", "Owned-community engagement and product feedback"]
      - [Third-party app ecosystem, "Server administrator or end user", "Community members", "Premium-app buyer", "Administrator or consumer app spend", "Need for moderation, roles, games, or workflow extensions"]
    notes: "Buyer and budget-owner assignments are analytical mappings from documented platform roles and monetization paths; public procurement and cohort-spend data remain unavailable."
    claimRefs: [CM010, CM011, CM012, CM015]
