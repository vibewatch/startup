    title: Audience and payer evidence layers
    type: pyramid
    summary: >-
      Public metrics narrow from cumulative accounts to active and paying users, but differing
      vintages and definitions prevent treating these layers as a conversion funnel.
    data:
      items:
        - label: Registered accounts estimate
          value: 690
          unit: million
          detail: "Approximate 2026 third-party total; includes inactive historical sign-ups."
        - label: Third-party MAU upper estimate
          value: 260
          unit: million
          detail: "Approximate 2026 upper estimate; not company-disclosed."
        - label: Q2 2025 MAU estimate
          value: 231
          unit: million
          detail: "SQ Magazine figure repeated by multiple assigned sources."
        - label: Official MAU floor
          value: 200
          unit: "million+"
          detail: "Company-published 2025 threshold as summarized by independent sources."
        - label: Estimated DAU upper bound
          value: 31.5
          unit: million
          detail: "2025 third-party estimate using a standard active-session lens."
        - label: Estimated DAU lower bound
          value: 29
          unit: million
          detail: "2024 third-party estimate; included to show the reported range."
        - label: Estimated Nitro subscribers
          value: 7.3
          unit: million
          detail: "Mid-2025 secondary estimate, not an audited payer count."
    approximationNotes: >-
      Values are reproduced as reported and rounded only where the source already uses an
      approximation. They have different dates and definitions, are not additive, and do not
      establish stage-to-stage conversion rates.
    claimRefs: [CM005, CM006, CM007, CM013]
callouts:
  - calloutType: risk
    title: Do not underwrite the generic market forecast as TAM
    body: >-
      The available category forecast is centered on Discord itself and lacks enough disclosed
      methodology to isolate serviceable spend. Underwriting should use payer cohorts and
      geography-specific willingness to pay once company data is available.
    claimRefs: [CM003, CM016]
