chapter:
  number: 6
  title: "Customers"
  summary: "Discord has consumer-scale adoption, with an April 2025 company disclosure of more than 200 million monthly active users and an August 2026 third-party estimate of 260 million, but those vintages and methodologies are not directly comparable. Public evidence supports strong community usage and a Nitro expansion surface, while subscriber retention, revenue concentration, and named-customer commercial terms remain undisclosed."
sections:
  - id: "segments-and-community-owners"
    title: "Segments, users, and community owners"
    body: "Discord is primarily a user-created communications network rather than a conventional enterprise account base. Its official terms describe text, voice, video, direct messages, and servers, while server owners and administrators control membership, roles, discovery, and bots. That structure creates several economically distinct constituencies: small friend groups, gaming guilds organized by raid leaders, large creator or game communities, and users who pay for Nitro or shared server upgrades. Third-party evidence suggests small groups remain structurally important, with 90% of servers reportedly below 15 members. Geography is also concentrated enough to matter: SQ Magazine estimates the United States represents 28.4% of users, but no revenue-by-country denominator is public."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU009"
      - "CU012"
      - "CU016"
    tableRefs:
      - "TU001"
  - id: "adoption-and-engagement"
    title: "Adoption scale and engagement"
    body: "The strongest adoption proof is broad rather than cohort-specific. Tech Insider quotes Discord's April 2025 disclosure of more than 200 million monthly active users and roughly two billion hours spent playing games each month. SQ Magazine later estimates 260 million monthly active users and 7.3 million Nitro subscribers as of its August 2026 update; these are third-party figures and should not be treated as a company-reported cohort series. Engagement estimates also depend heavily on the measured population: Blank Spaces contrasts 94 minutes per day for engaged users with 17 minutes for all users aged 16 and older. The evidence establishes scale and intensity, but not DAU/MAU, repeat-purchase, renewal, or cohort retention."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU008"
      - "CU013"
      - "CU014"
    tableRefs:
      - "TU002"
  - id: "named-proof-and-durability"
    title: "Named community proof and durability"
    body: "Named proof is strongest for large communities, not contracted customers. SQ Magazine lists Midjourney, Marvel Rivals, and Blox Fruits among major Discord servers, while Growthcurve separately describes Midjourney as a breakout use case enabled by Discord's bot and server primitives. These examples demonstrate production-scale community presence, but public member counts do not establish a paid Discord contract, active-member rate, outcome attribution, or renewal. Discord has invested in community research: the CMJ Group reports a five-month engagement using a multilingual survey of more than 11,000 respondents, followed by UX improvements designed around retention and monthly-active-user goals. Actual GRR, NRR, churn, subscriber cohorts, and contract lengths remain private."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU015"
    tableRefs:
      - "TU003"
  - id: "expansion-and-friction"
    title: "Expansion loops and customer friction"
    body: "Discord's expansion loop is community-led. Growthcurve reports that early acquisition targeted raid leaders who could move whole groups, while invite-link onboarding reduced adoption friction. Monetization then layers individual Nitro benefits and community-funded server boosts onto a free basic service. This model can deepen participation without a centralized procurement event, but it also obscures payer concentration and renewal quality. Trust and compliance can interrupt the loop: Discord acknowledged that its proposed global age-assurance rollout created significant user concern, said more than 90% of users should need no verification action, and delayed the broader rollout to the second half of 2026. That response limits near-term disruption but leaves implementation and regional conversion effects unquantified."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU007"
      - "CU012"
    figureRefs:
      - "FU001"
