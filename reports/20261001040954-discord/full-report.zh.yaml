      - number: '2.3'
        title: 买方群体、终端用户与采纳路径
        blocks:
          - type: paragraph
            body: >-
              Discord 在结构上呈现多边属性。社群成员可能是终端用户而非付款人；重度爱好者可以购买 Nitro
              或出资助力服务器；服务器所有者能够配置访问权限并接入第三方应用；开发者可以销售付费机器人高级功能；游戏发行商或品牌方则能为赞助互动买单。用户先加入或创建免费服务器，管理员再制定群规、配置集成功能，等社群互动形成后才逐步变现。约
              46% 至 54% 的用户自认非核心玩家，佐证了使用场景已超越纯游戏边界；亚太区占用户总数 34%、北美占 28% 的估算数据，表明本地化策略和区域支付习惯将深刻左右转化率。公开的人口统计估算在 18-24
              岁还是 25-34 岁是最大用户群体上存在分歧，难以据此进行精准的买方客群定位。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM015
      - number: '2.4'
        title: 采纳驱动因素、制约条件与估值关联
        blocks:
          - type: paragraph
            body: >-
              核心采纳驱动力来自用户主动加入的高黏性社群内部的高频沟通。测算显示常规会话的 DAU/MAU 比例在 12% 至 15%
              附近，语音用户的单次在线时长表现更为强劲；这是不同维度的参与度视角，不能简单合并为单一转化率。变现历来依赖订阅和服务器助力，2024 至 2026
              年的跟踪证据表明激励式任务（Quests）正发展为新兴广告业务线。这一拓展有助于拉升单用户平均收入，但也带来了信任层面的权衡，因为社群对话比起公开信息流更加偏向私密与强人际关系。其他制约因素包括报告中偏低的
              Nitro
              渗透率、内容审核与年龄核验义务、管理员掌握的分发权限、第三方应用潜在风险、向常见替代群聊工具的迁移可能，以及经审计留存分群财务数据的缺失。因此在投资判断中，只有充分验证付费转化、留存率、广告容忍度以及安全与基础设施成本后，庞大的受众规模才能真正获得估值溢价。
            claimRefs:
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 专题图表
        blocks:
          - type: callout
            title: 勿将宽泛的行业预测直接当作 TAM
            body: 现有的品类市场预测以 Discord 自身为中心，缺乏足够透明的方法论来拆解有效可服务支出。在公司详尽数据披露前，应基于真实付费分群和各区域的实际付费意愿进行测算。
            calloutType: risk
            claimRefs:
              - CM003
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争阵营随核心工作任务而变化
        blocks:
          - type: paragraph
            body: >-
              Discord 并非置身于单一均质的即时通讯赛道。其官方使用条款描述的服务器由文字频道以及实时语音或视频频道构成；Forge 报告显示 Discord 自称服务超过 200M+ 月活跃用户，并在 2024
              年将战略重心重新聚焦于游戏。竞品发布的对比材料将替代方案划分为四类实际工作任务：客户或创作者社群、职场协同办公、游戏语音连麦以及隐私优先通讯。在这种业务框架下，Guilded 和 TeamSpeak
              最贴近核心游戏场景；Slack 与 Microsoft Teams 面向企业协同；Circle、Bettermode 与 Discourse 主打结构化社群或知识工作流；Signal、Telegram 及
              Element 则聚焦注重隐私的通讯需求。在自主掌控力诉求压倒网络覆盖广度的场景中，自研内部系统与维持现状仍是常见选择。
            claimRefs:
              - CP001
