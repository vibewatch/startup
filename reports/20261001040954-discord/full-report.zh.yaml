    rows:
      - - C 端群组通信
        - 免费服务器、文字、语音和视频使用；可选增值付费功能
        - 运营商短信/彩信及一对一通信
        - 个人成员
        - 核心受众获取与活跃度支撑层
      - - 游戏协同与开黑
        - 常驻游戏社区、语音频道、机器人及赞助游戏任务
        - 仅限游戏内的内置语音及专属游戏论坛
        - 玩家、社区成员或游戏发行商
        - 起家市场与持续用户活跃度的基石
      - - 创作者与兴趣社区
        - 成员订阅、服务器提升（Boosts）、门槛身份组及社区工具
        - 公开信息流关注者及独立会员网站
        - 成员、创作者或服务器所有者
        - 将使用场景延伸至游戏之外
      - - 开发者应用生态
        - 服务器内使用的付费机器人、应用及集成组件
        - 独立 SaaS 工具及自建自托管机器人
        - 开发者、管理员或最终用户
        - 扩充产品功能并带来应用市场佣金变现潜力
      - - 企业职场协同办公
        - 仅限社区支持与非正式专业交流群
        - 按人头付费的办公即时通讯及生产力套件
        - 企业 IT 部门或业务部门预算负责人
        - 属于邻近市场，但排除在核心市场边界之外
      - - 广播式社交媒体
        - 赞助任务（Quests）或引流至社区的发现功能
        - 算法驱动的公开信息流，以及主要按曝光售卖的创作者触达
        - 广告主或品牌方
        - 属于邻近变现资金池，而非核心通信赛道
    notes: 边界划分综合自 Discord 服务条款、TrendX 的品类定义及独立的商业模式分析；各行表述旨在阐释市场逻辑，而非衡量实际支出规模。
