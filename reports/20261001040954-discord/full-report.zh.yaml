  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与客户端体验
        blocks:
          - type: paragraph
            body: >-
              Discord 是一个多平台实时通讯套件，核心由被称为“服务器”的持久化社群空间以及点对点私信和群聊功能构成。客户端原生覆盖 Windows、Linux、macOS、iOS、Android 及主流 Web
              浏览器，提供同步语音、视频、屏幕共享与文字交流能力。服务器内部细分为按特定主题划分的文字频道与常开型语音频道，方便用户在开黑组队语音与异步文字讨论之间无缝切换。核心变现与个性化装扮依托 Discord Nitro
              和服务器助力（Server Boosts）等分档会员体系，解锁更高画质串流、更大文件上传上限以及跨群自定义表情。底层采用基于时间序的 Snowflake 唯一标识符，实现跨频道与时间窗口的清晰消息流切分。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE006
