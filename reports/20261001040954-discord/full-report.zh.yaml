        - 收入增速从 2022 年的 44% 放缓至 2024 年的约 21%
        - 经审计 S-1 招股说明书证明自由现金流可持续为正
      - - 治理反向逻辑
        - 非对称非公开信息权以及老股交易中的清算优先权压制
        - 普通股在缺乏投票控制权的情况下大幅折价交易
        - 上市时确立清晰的单一类别投票权架构
      - - 监管反向逻辑
        - 儿童安全与引诱诱导诉讼引发舆论负面报道及合规阻力
        - TorHoerman Law 发起诉讼，指控平台安全防范机制缺失
        - 获得全面监管批准以及第三方独立安全审计认证
