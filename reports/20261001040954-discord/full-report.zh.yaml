        - 单件微交易；辅以 Orbs 虚拟货币奖励
        - 2% 至 5%（2025 年约 $19M-$48M）
        - 边际成本近乎为零的外观道具，毛利率极高
        - 高度依赖季节性新品上架，面临长期用户付费疲劳
