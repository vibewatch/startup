              - CU016
      - number: '6.2'
        title: 采纳规模与用户参与度
        blocks:
          - type: paragraph
            body: >-
              最强有力的业务采纳证据体现在宏观大盘而非特定留存分群上。Tech Insider 援引 Discord 2025 年 4 月披露的数据，指出其月活跃用户数突破 200M+，用户每月游戏时长约 20 亿小时。SQ
              Magazine 在 2026 年 8 月的更新中进一步估计月活跃用户数达 260M，Nitro 付费订阅用户达
              7.3M；这些属于第三方推算数据，不能等同于公司官方公布的分群序列。参与度测算也高度依赖具体的统计样本：Blank Spaces 对比发现重度活跃用户的日均在线时长达 94 分钟，而 16
              岁及以上全体用户的平均时长仅为 17 分钟。现有数据确立了平台的规模体量与互动深度，但未能提供关于 DAU/MAU、复购率、续订率或分群留存率的详尽证据。
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU013
              - CU014
      - number: '6.3'
        title: 标杆社群实证与业务持久性
        blocks:
          - type: paragraph
            body: >-
              标杆实证主要体现在大型社群而非签署采购合同的企业客户上。SQ Magazine 将 Midjourney、《Marvel Rivals》和《Blox Fruits》列为 Discord
              的代表性大型服务器；Growthcurve 亦单独指出 Midjourney 是依托 Discord
              机器人与服务器底层功能爆发式成长的典型案例。这些案例印证了平台支撑生产级社群运营的能力，但公开的成员总数并不能证明其存在付费合同关系、有效活跃成员比例、业务收益归因或后续续约表现。Discord
              本身在社群调研上有所投入：CMJ Group 报告记录了一项历时五个月、涵盖超过 11,000
              名多语种受访者的调研项目，并据此针对留存率与月活目标优化了用户体验交互。然而真实的毛金额留存率（GRR）、净金额留存率（NRR）、流失率、付费订阅分群及合约周期仍属非公开商业秘密。
            claimRefs:
              - CU010
              - CU011
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU012
              - CU015
      - number: '6.4'
        title: 扩张飞轮与客户转化摩擦
        blocks:
          - type: paragraph
            body: >-
              Discord 的扩张飞轮由社群自然裂变驱动。Growthcurve 报告显示，早期获客瞄准了能够带动整个团队迁移的游戏团战指挥官，邀请链接入群机制大幅降低了使用门槛。商业化随后在免费基础服务之上叠加个人
              Nitro 会员特权与社群出资的服务器助力。这种模式无需经过集中式的企业采购流程即可深化用户参与，但也掩盖了付款人集中度与真实的续订质量。信任与合规摩擦可能会打断该飞轮：Discord
              坦承其拟在全球推行的年龄核验方案引发了用户的强烈担忧，声称超过 90% 的用户应无需执行任何验证操作，并将全面推行时间推迟至 2026
              年下半年。这一妥协虽然缓解了短期用户反弹，但其实际落地执行与对各区域付费转化率的影响仍有待量化评估。
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU012
