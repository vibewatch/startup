  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Discord
              的目标市场是围绕用户自建服务器构建的持久化群组通讯，涵盖文字、语音、视频、身份组、机器人及付费扩展功能。其商业边界比广义即时通讯或社交媒体更为聚焦：囊括消费者社群交流、游戏战术协同、创作者与品牌社群、服务器变现以及开发者应用生态，但不把按席位收费的企业协同办公和公开广播式信息流作为主要品类。现状分布于游戏内置语音、群聊应用、社交信息流、论坛和自建社群工具等碎片化场景。明确这一边界至关重要，因为业内被冠以“Discord
              市场”的预测只是厂商定义的品类推算，而非直接计量的全部可替代支出池。Discord 官方条款确认其核心功能免费、增值产品按需付费的模式，独立行业分析也将其采购场景定义为社群组织，而非企业工作组。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
