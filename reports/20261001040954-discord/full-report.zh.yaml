      - number: '3.4'
        title: 护城河在于高互动深度与网络密度，而非通用工作流绑定
        blocks:
          - type: paragraph
            body: >-
              Discord
              坐拥逾两亿用户规模、专注游戏基因以及私密群组通讯形态，确立了直接竞争对手难以企及的分发优势与认知习惯。即便如此，其护城河仍需分场景审视。游戏和社交服务器受益于成员高密度、通用行为规范、对高品质语音的预期、丰富的机器人以及高频实时互动。然而，专业与创作者社群很容易在多个平台同时驻留，或将业务功能层迁移至具备
              CRM、可搜索论坛、在线课程、支付闭环、更强品牌定制或支持自托管的产品中。竞品主张受众群体受限于 Discord
              平台且服务器历史记录难以导出，带来用户切换摩擦；但现有留存证据无法量化跨平台迁移率、流失率或多平台常驻的具体比例。最可信的反向下行在于边缘场景渐进式平庸化：捆绑销售的企业巨头吃掉商业工作流，垂直专精平台分流变现与知识沉淀，Discord
              则退守纯即时沟通核心盘。
