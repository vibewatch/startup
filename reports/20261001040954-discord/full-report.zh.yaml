      - number: '1.2'
        title: 融资历程、老股重定价与股权结构
        blocks:
          - type: paragraph
            body: >-
              自 2012 年以来，Discord 经由 10 轮新股风险投资与战略股权融资，累计筹集资金略超 $1B。早期资本包括 2015 年由 YouWeb 孵化、Benchmark Capital 及 Tencent
              注入的资金，随后在 2016 至 2018 年间完成了由 Greylock Partners、Greenoaks Capital 和 Index Ventures 领投的多轮机构成长期融资。2020
              年疫情期间线上通讯需求激增，Discord 连续完成两轮规模均为 $100M 的融资，对应估值分别为 $3.5B 与 $7.0B，并在 2021 年初拒绝了报道称作价 $10B 至 $12B 的
              Microsoft 收购要约。公司最高一轮新股定价于 2021 年 9 月敲定，由 Dragoneer Investment Group 领投 $500M Series I 轮融资，投后估值达
              $15.2B，Baillie Gifford、Coatue Management、Fidelity Investments 与 Franklin Templeton
              共同参投。伴随二级市场估值倍数整体收缩，2026 年 7 月 8 日老股交易对 Discord 股票的定价为每股 $31.31，对应 Forge Price 隐含估值 $8.53B，较新股最高点回落约
              44%。尽管彭博社报道称公司已在 Goldman Sachs 与 J.P. Morgan 等主承销商协助下于 2026 年 1 月 6 日秘密递交美国首次公开发行申请，但 Discord
              尚未确认具体的上市日期、定价区间或挂牌交易所。
