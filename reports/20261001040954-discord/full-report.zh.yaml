      - number: '2.2'
        title: 基于客观证据的体量测算
        blocks:
          - type: paragraph
            body: >-
              公开资料中未见单一可靠的 TAM、SAM 或 SOM 数据。TrendX 测算全球 Discord 专属品类规模在 2025 年为 USD 850.16 million，到 2034 年将以 18.50%
              的复合年增长率增至 USD 3,917.09 million，但其披露的方法论仅注明二手调研与专有模型。用户大盘的公开数据范围更广但彼此矛盾：独立行业报告援引官方披露的月活跃用户数底线为
              200M+，第三方估算则介于 231M 至约 260M 之间。注册账户总数虽然更高，但由于包含大量非活跃账户，并不能代表可触达的活跃人群。报道提及的 7.3M Nitro
              付费订阅者属于付费用户视角，既非整体收入也非 SAM。在获得分群地理分布、付费资格、付费意愿及经过验证的转化率之前，应将这些指标作为独立的敏感性测算锚点。
