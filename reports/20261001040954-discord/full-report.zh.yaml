chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、经营治理与领导层架构
        blocks:
          - type: paragraph
            body: >-
              Discord Inc. 是一家成立于 2015 年的后期非上市通讯平台，由 Jason Citron 与 Stanislav Vishnevskiy 创办，前身为 2012 年在 Phoenix Guild 和
              Hammer & Chisel 启动的游戏开发项目。公司总部设在加利福尼亚州旧金山市 De Haro 街 444 号，主要提供结构化语音频道、低延迟文字聊天、视频通话与互动社交基础设施。经营治理在 2025 年
              4 月 28 日出现关键转折，掌舵 13 年的创始人 Citron 辞任首席执行官并转任顾问与董事会成员，将日常管理交接给曾任 Activision Blizzard 副董事长及 King Digital
              Entertainment 总裁的 Humam Sakhnini。Vishnevskiy 则继续担任首席技术官主导核心平台架构与工程研发，在管理层筹备公开市场审查之际确保技术研发连续性。公司治理目前由 14
              名董事组成的董事会负责监督，席位涵盖领投基准轮融资的风投合伙人与独立董事，公开资料中未见双重股权投票权控制结构。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
