  - id: TP001
    title: 按买方需求场景划分的竞争格局
    columns:
      - 竞品或替代方案
      - 品类属性
      - 规模或融资证据
      - 目标客群
      - 差异化优势
      - 相比 Discord 的局限性
    rows:
      - - Discord
        - 参照基准平台
        - 公司称拥有 200M+ 月活跃用户；Forge 报告
        - 游戏与社交社区
        - 基于服务器整合文字、语音、视频、身份组、发现与机器人功能
        - 现有留存证据显示，其对结构化业务协同、课程交付、CRM 或公开知识沉淀工作流的支持相对有限
      - - Guilded
        - 直接竞品
        - 现有留存证据未予确立
        - 游戏公会战队与电竞赛事
        - 产品结构上与服务器/频道形态最接近的直接替代品；竞品官网显示核心功能均可免费使用
        - 竞品页面直陈自身欠缺 Discord 的网络效应
      - - Slack / Microsoft Teams
        - 传统办公协同套件
        - 现有留存证据未予确立
        - 专业团队与企业组织
        - 深度的业务系统集成、身份管理、合规审计及紧邻的生产力套件分发渠道
        - 并非针对公开游戏社区打造
      - - Circle / Bettermode
        - 邻近社区套件与潜在进入者
        - 现有留存证据未予确立
        - 创作者、教育者与客户社区
        - 支付结算、在线课程、活动管理、CRM 打通、品牌定制与结构化空间
        - 信息源于厂商官方对比材料；欠缺游戏网络密度的充分证据
      - - Discourse
        - 论坛型替代品
        - 现有留存证据未予确立
        - 公开技术支持与知识社区
        - 盖楼式讨论、支持全文搜索、利于 SEO 的长效内容及私有化自托管选项
        - 重心不在实时语音与游戏互动
      - - TeamSpeak / Mumble
        - 专属语音替代方案
        - 现有留存证据未予确立
        - 竞技游戏与电竞赛事
        - 竞品对比重点强调极低延迟语音与完全的服务器控制权
        - 社区氛围、内容发现及业务工作流沉淀相对薄弱
      - - Signal / Telegram / Element
        - 隐私通信与即时通讯邻近产品
        - 现有留存证据未予确立
        - 私密群组、大型频道广播或自主可控部署
        - 端到端加密、超大群组通讯、联合网络协议（Federation）或私有化部署
        - 服务器社区形态与游戏生态完整度不及 Discord
      - - 自建系统 / 维持现状
        - 替代方案
        - 因具体组织而异；无公开基准留存
        - 强调最高控制权的企业与组织
        - 对数据模型、业务工作流与品牌形象拥有最高控制权
        - 分析师推断：将放弃 Discord 现有的用户基数，且需自行承担产品研发、内容审核及日常运营投入
    notes: 品类划分综合自 Discord 官方说明、Forge 报告及竞品官方对比；非 Discord 竞品的规模与融资均标记为未知，因为所分配的研究证据未确立可比数据。
