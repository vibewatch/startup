            title: 估值倍数回落与维持独立发展的财务代价
            body: >-
              Discord 曾在 2021 年年收入为 $310M 时拒绝了 Microsoft 报道称 $10B 至 $12B 的收购要约。尽管如今收入规模已提升至 $750M 至 $950M 并实现经调整 EBITDA
              盈利，但当前老股市场交易对其估值仅在 $6.8B 至 $8.53B 之间。公开市场投资者将要求看到具备可持续 GAAP 盈利能力的审计证据，才会给予超越 2021 年定价的高估值。
