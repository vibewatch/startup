  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与价格体系
        blocks:
          - type: paragraph
            body: >-
              Discord 建立起数亿美元规模的消费级业务，主要依靠用户自愿付费而非广泛的程序化展示广告。核心变现引擎是可选的分档订阅 Discord Nitro，其中入门版 Nitro Basic 定价为每月
              $2.99（每年 $29.99），完整版 Nitro 定价为每月 $9.99（每年 $99.99）。Nitro 解锁装扮表达与实用功能体验，包括跨服务器自定义表情、500MB
              上传上限、高清视频串流以及附带的服务器助力。直接购买 Nitro 订阅在 2023 年产生估算约 $207M 收入，2025 年在约 7.3M 付费订阅者推动下增至约 $280M。Nitro 订阅者综合 ARPU
              每年约 $38.36（每月约 $3.20），显示付费用户大幅偏向按年计费周期和较低价的 Nitro Basic 档位，而非全价的 $9.99 月费档。除个人订阅外，社群维度的服务器助力（Server
              Boosting）构成另一大支柱，在 2025 年贡献总收入估算约 45% 至 55%（$430M 至 $520M）。非订阅用户购买单次服务器助力每月需付 $4.99，Nitro 会员每月享优惠价
              $3.49（本身已包含 2 次赠送助力）；这形成了一种社群身份认同机制，用户共同出资解锁更高的音频码率、个性化域名和更多表情槽位等共享特权。新兴商业层包括售卖头像特效与虚拟道具的 Discord
              Shop（$19M 至 $48M）、按 10% 平台抽成提供类似 Patreon 付费频道服务的 Server Subscriptions（$10M 至 $29M），以及按 15% 至 30% 分成的优质开发者
              App Directory 订阅（$5M 至 $19M）。最新的增长引擎是赞助式任务（Sponsored Quests），这是一种自愿参与的激励型广告形态，品牌方与游戏发行商向 Discord
              付费以激励玩家完成游戏任务并参与赞助直播互动。
