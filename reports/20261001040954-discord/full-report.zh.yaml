              发展史上的结构性拐点。Sakhnini 此前曾推动 King Digital 营业利润由 $600M 提升至 $1.3B，为这家长年年均 ARPU（约
              $3.50）落后于传统社交网络的平台注入了成熟的经营约束。这次交接直接为 2026 年 1 月的秘密递交 IPO 申请奠定了管理基础。
