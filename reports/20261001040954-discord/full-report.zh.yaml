  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律合规风险
        blocks:
          - type: paragraph
            body: >-
              Discord 在多个司法管辖区面临日益严峻的监管审查，核心聚焦未成年人安全、默认隐私设置以及涉嫌欺诈性陈述。2026 年 5 月，德克萨斯州总检察长依据《欺诈性贸易行为法》与《SCOPE
              法案》发起执法行动，取得临时限制令（TRO），强制要求其对运营实施实质性调整，包括对德克萨斯州账户默认启用内容拦截并禁用私信功能 [CR002, CR003]。这项法律挑战直接冲击了 Discord
              的核心产品架构——其历史上一直采用宽松的默认通讯设置以加速用户网络效应。监管合规风险已蔓延至全球青少年保护法规，英国、澳大利亚和巴西的主管机关均要求引入可验证的年龄确认机制，而非依赖内部非身份识别式的启发式算法模型
              [CR005]。用户对隐私泄露的强烈抵触迫使 Discord 推迟了强制面部生物识别与政府身份证件核验的推行计划，凸显出严格的青少年安全监管与用户匿名诉求之间的尖锐对立
              [CR004]。合同风险主要依托包含约束性仲裁条款与集体诉讼豁免的标准化用户条款进行隔离，但各州消费者权益保护执法可直接绕过双边仲裁的屏障 [CR007, CR008]。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
