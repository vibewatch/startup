      - CR013
      - CR015
  - id: FV001
    title: 估值逻辑与投资建议推导链
    type: flow
    summary: 串联用户规模、市场估值与 research-more 建议的推导逻辑链。
    data:
      nodes:
        - id: scale
          label: 规模验证：200M+ 月活跃用户
        - id: primary
          label: 2021 年新股峰值估值：$15.0B
        - id: secondary
          label: 老股市场估值重置：$8.53B (-43%)
        - id: multiples
          label: 远期倍数回落：12x-13x 对比 >20x
        - id: gaps
          label: 核心缺口：未经审计的利润率与法律阻力
        - id: decision
          label: 投资建议：research-more / 评估立场：stretched
      edges:
        - from: scale
          to: primary
        - from: primary
          to: secondary
        - from: secondary
          to: multiples
        - from: multiples
          to: gaps
        - from: gaps
          to: decision
    approximationNotes: 展示从运营指标推导至最终投资立场的分析逻辑过程。
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV010
