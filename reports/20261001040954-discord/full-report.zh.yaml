figures:
  - id: FO001
    title: Discord 公司发展里程碑时间线
    type: timeline
    summary: 梳理 Discord 从 2012 年创立至 2026 年保密递交 IPO 申请期间，涵盖公司、融资、产品、管理层与监管等关键里程碑。
    data:
      items:
        - date: '2012-04-01'
          label: 工作室创立
          detail: Jason Citron 创立 Phoenix Guild（后更名为 Hammer & Chisel）开发移动端 MOBA 游戏，并研发早期语音与文字工具。
        - date: '2013-04-01'
          label: 技术联合创始人加入
          detail: Stanislav Vishnevskiy 以联合创始人兼 CTO 身份加入 Hammer & Chisel，合力攻关手游网络层与后端聊天架构。
        - date: '2015-05-13'
          label: Discord 应用上线
          detail: Discord 首次公开发布，定位为面向线上玩家的专用桌面及移动端语音和文字通信平台。
        - date: '2017-01-15'
          label: 推出 Nitro 订阅服务
          detail: Discord 推出 Nitro 高级订阅（$9.99/月），奠定平台核心的直接面向消费者（D2C）变现模式。
        - date: '2021-04-20'
          label: 拒绝微软收购邀约
          detail: Discord 终止与微软估值 $10B-$12B 的收购谈判，坚持独立增长战略并筹备未来 IPO。
        - date: '2021-09-09'
          label: Series I 轮融资，估值 $15.2B
          detail: 完成由 Dragoneer Investment Group 领投的 $500M Series I 轮融资，新股投后估值触及 $15.2B 顶峰。
        - date: '2024-01-11'
          label: 团队裁撤与重归游戏聚焦
          detail: 实施 17% 裁员以精简运营，将核心产品资源重新聚焦于游戏与社区互动。
        - date: '2025-04-28'
          label: CEO 管理层过渡
          detail: 任命 Humam Sakhnini 为 CEO 带领业务走向公开资本市场，联合创始人 Jason Citron 转任董事会成员兼顾问。
        - date: '2026-01-06'
          label: 秘密递交美国 IPO 申请
          detail: 向美国 SEC 保密递交拟首次公开募股（IPO）的注册声明草案，聘请高盛与摩根大通担任主承销商。
        - date: '2026-07-08'
          label: 老股交易估值重新定价
          detail: Forge Global 老股市场交易价格将 Discord 每股估值定为 $31.31，对应隐含股权市值 $8.53B。
    approximationNotes: 日期反映主要公告月份与具体报道的公司申报节点。SEC 保密草案提交的确切日期经财经媒体报道确认。
    claimRefs:
      - CO001
      - CO002
      - CO005
      - CO008
      - CO009
      - CO010
      - CO011
      - CO013
      - CO014
      - CO016
