      - number: '5.4'
        title: 平台可靠性、反滥用机制与治理控制
        blocks:
          - type: paragraph
            body: >-
              伴随 Google Display and Video 360 等企业技术团队将开发者社群互动迁移至 Discord，其在企业级工具链与信息治理上的技术局限日益成为投资尽调的重要考量。Discord
              的交流内容本质上呈现半即时性且封闭在平台登录门槛之内，不支持公网搜索引擎索引，官方公告也缺乏机器可读的泛用 RSS
              订阅源。这种架构设计迫使工程团队不得不部署脆弱的第三方消息转发机器人或自建网页爬虫，将产品通知同步到外部工作流中。从合规与治理维度看，Discord
              在服务条款中设置了具有法律约束力的仲裁条款与年龄核验要求；然而技术尽调必须审慎权衡内容安全扫描、机器人 Token 凭证防护以及持续支撑数亿未付费实时语音连接所带来的长期刚性运维成本。
            claimRefs:
              - CE010
              - CE014
              - CE015
      - number: '5.5'
        title: 专题图表
        blocks:
          - type: callout
            title: 架构解耦与请求合并机制保障平台可用性
            body: >-
              Discord 引入基于 Rust 的中间数据服务层并实现请求合并机制，有力避免了 ScyllaDB 在大群发布重磅公告时遭遇热点分区突发流量冲击，从根源上解决了过往困扰其 Cassandra 集群的严重 JVM
              垃圾回收停顿与数据压缩积压问题。
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
              - CE007
          - type: callout
            title: 无法被索引的即时记录与订阅源缺失制约企业级工作流沉淀
            body: >-
              尽管 Google DV360 等主要企业团队已在 Discord 建立开发者支持阵地，但平台半即时性的讨论模式缺乏搜索引擎收录与原生 RSS
              订阅，迫使开发者工具团队自建机器人中继转发，在长期知识沉淀上承受了显著的妥协。
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客群细分、终端用户与社群所有者
        blocks:
          - type: paragraph
            body: >-
              Discord
              本质上是一个由用户自主创建的通讯网络，而非传统的企业级客户底座。其官方条款界定了文字、语音、视频、私信和服务器等功能，而服务器所有者与管理员则掌控着成员准入、身份组分配、发现设置及机器人接入。这种组织架构衍生出几个商业诉求截然不同的群体：好友私密小群、由团本指挥官组织的游戏公会、大型创作者或游戏社群，以及购买
              Nitro 或出资进行服务器升级的付费个体。第三方调研显示小型群组在底层结构上占据绝对主流，据报道 90% 的服务器成员数在 15 人以下。地理分布集中度同样不容忽视：SQ Magazine
              估计美国用户占其大盘的 28.4%，但分国别的收入分母数据并未对外公开。
            claimRefs:
              - CU001
              - CU002
              - CU009
              - CU012
              - CU016
