companyProfile:
  summary: >-
    Discord 是一家成立于 2015 年的后期非上市通讯平台，依托服务器、语音、视频、文字、机器人及付费订阅
    Nitro，搭建了庞大的跨平台社群产品。平台最知名的场景仍是游戏社群，但使用场景已延伸至创作者、开发者与日常社交群组。2025 年 Jason Citron 转任董事会成员后，现由 CEO Humam Sakhnini
    执掌管理层；公司目前在仅有部分财务披露的情况下筹备潜在的公开市场上市。
