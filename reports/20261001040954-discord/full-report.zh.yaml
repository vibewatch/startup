      - number: '7.2'
        title: 运营基础设施与平台安全
        blocks:
          - type: paragraph
            body: >-
              鉴于其实时语音、视频和文字架构支撑着超过 200M+ 月活跃用户，平台稳定性与数据安全构成了 Discord 关键的日常运营薄弱点。大规模服务宕机会直接冲击用户社群，2025 年 9 月的全美服务中断即波及逾
              100,000 名并发用户，历经数小时才完全恢复
              [CR001]。与此同时，企业级监控体系显示，运营遥测必须将底层基础设施劣化与社群审核失序清晰区分开来，尤其是在发生支付故障或服务中断期间，社群服务器内的舆情往往会迅速恶化为欺诈与垃圾广告泛滥
              [CR010]。第三方供应商依赖进一步加剧了安全风险，典型案例是 2025 年 10 月一家客户支持外包商遭遇入侵，导致约 70,000 名用户的政府身份证件扫描件泄露，显著加剧了社群对外部身份验证的不信任感
              [CR006]。周边开发者工具链的供应链安全漏洞也暴露了攻击路径：攻击者在托管子域名植入恶意代码，理论上可威胁到会话 Token 和 API 集成 Webhook，需要持续实施漏洞修补
              [CR015]。此外，Clyde AI 等面向消费者的大规模 AI 部署表明，必须建立严格的确定性安全评测红线，防止对抗性越狱（Jailbreak）并引发实际现实危害 [CR014]。
            claimRefs:
              - CR001
              - CR006
              - CR010
              - CR014
              - CR015
