      - number: '3.3'
        title: 免费核心功能奠定价格保护伞
        blocks:
          - type: paragraph
            body: >-
              Discord 条款明确其基础功能免费，用户可选择为增值特性付费。竞品在 2026 年公布的横向对比中列出 Nitro Basic 每月 $2.99，完整版 Nitro 每月
              $9.99；各竞品收费模式差异显著：固定月费制社群平台、按席位收费的协同办公工具、免费或自托管开源软件，以及按容量收费的语音托管服务。例如 Circle 对比页面显示 Circle 起步价每月 $89，Slack
              每人每月 $8.75 起，Microsoft Teams 每人每月 $4 起，Discourse 每月 $20
              起。这些只是厂商公开刊例价的一览，并非实际成交价格或独立验证的综合拥有成本。此类对比反映的是定价包装面临的行业竞争压力，而非 Discord 现有用户可靠的付费意愿基准。
