  - id: FE001
    title: 产品架构全景图
    type: stack
    summary: Discord 实时通信基础设施的六层架构栈，自顶层客户端应用向下延伸至持久化存储与开发者平台。
    approximationNotes: 展现基于工程技术披露、数据库迁移报告及开发者文档综合梳理的 Discord 核心生产环境架构。
    claimRefs:
      - CE004
      - CE011
      - CE012
      - CE013
    data:
      layers:
        - label: 客户端与展示层
          detail: 覆盖 Windows、macOS、Linux、iOS、Android 及 Web 浏览器的跨平台客户端，提供语音、视频、文字及富游戏状态感知功能。
        - label: 网关与连接管理层
          detail: 分布式 Elixir BEAM 集群，用于终结持久 WebSocket 连接、管理用户在线状态并提供定制化会话恢复缓冲区。
        - label: 社区与服务器（Guild）状态层
          detail: 基于内存的 Elixir Guild Process Actor 模型，物理隔离各社区，确保单个服务器的故障或流量激增绝不波及相邻服务器。
        - label: 数据服务路由与合并层
          detail: 基于 Rust 构建的中间微服务，采用 Tokio 异步 I/O、gRPC 端点及一致性哈希路由，将并发读请求合并为单一查询。
        - label: 持久化消息存储层
          detail: ScyllaDB C++ 分布式 NoSQL 集群，利用本地 NVMe SSD、RAID 持久化存储与每核一分片（shard-per-core）拓扑，存储数万亿条消息。
        - label: 开发者平台与交互层
          detail: REST API、WebSocket Gateway 与 HTTP Interactions Webhook，支持 OAuth2 认证、Bot Token 与开发者自动化框架。
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 社群组织者拉动获客，用户参与沉淀使用习惯，付费功能在信任或合规阻碍打断闭环前放大商业价值。
    data:
      items:
        - label: 发现
          detail: 好友、公会、创作者或游戏社群将用户带入 Discord。
          touchpoints:
            - 邀请链接
            - 社群推荐
        - label: 加入
          detail: 用户进入服务器并接受其成员规则。
          touchpoints:
            - 账号
            - 服务器成员资格
        - label: 参与
          detail: 文字、语音、视频和直播持续创造使用价值。
          touchpoints:
            - 文字频道
            - 语音与视频
        - label: 组织
          detail: 服主与管理员配置身份组、权限、发现入口与 Bot。
          touchpoints:
            - 身份组
            - Bot 与应用
        - label: 扩展
          detail: 个人购买 Nitro，社群为服务器 Boost 集资，以获取增值权益。
          touchpoints:
            - Nitro
            - 服务器 Boost
        - label: 留存或遭遇阻力
          detail: 社群价值维系用户留存，安全合规与年龄确认要求则可能增加操作门槛。
          touchpoints:
            - 社群关系网络
            - 年龄确认
    approximationNotes: 该概念流程基于官方服务机制与既定增长证据梳理，不代表各环节实际测得的转化率。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU007
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 从影响严重程度与应对成熟度两项维度，评估监管合规、安全、运营及商业模式等核心风险。
    data:
      columns:
        - 低影响
        - 中度影响
        - 严重影响
      rows:
        - label: 监管与合规
          values:
            - label: 轻微服务条款争议
              tone: positive
            - label: 国际年龄门槛规则
              tone: warning
            - label: 州总检察长禁令与处罚
              tone: critical
        - label: 安全与供应商供应链
          values:
            - label: 局部 Bot 垃圾信息
              tone: positive
            - label: 子域名注入攻击路径
              tone: warning
            - label: 第三方 PII 数据泄露
              tone: negative
        - label: 平台运营
          values:
            - label: 临时 API 性能降级
              tone: neutral
            - label: LLM 对抗性评测
              tone: warning
            - label: 美国区重大服务中断
              tone: risk
        - label: 商业模式与估值
          values:
            - label: 服务器 Boost 波动
              tone: positive
            - label: 可选消费 ARPU 偏低
              tone: warning
            - label: 老股估值承压
              tone: risk
        - label: 用户隐私与信任
          values:
            - label: 设置偏好偏离
              tone: positive
            - label: 生物识别数据疑虑
              tone: warning
            - label: 年龄门槛引发的反弹与抵制
              tone: negative
        - label: 开发者与 Bot 生态
          values:
            - label: 轻微 API 频控限制
              tone: neutral
            - label: OAuth 权限蔓延
              tone: warning
            - label: 供应链恶意 Bot 更新
              tone: risk
    approximationNotes: 各风险维度基于定性影响评估与监管申报文件梳理绘制。
