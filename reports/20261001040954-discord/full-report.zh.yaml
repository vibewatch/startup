  - id: TP002
    title: 功能能力与分发渠道矩阵
    columns:
      - 采购决策维度
      - Discord
      - 办公协同套件
      - 社区协同套件
      - 垂直语音 / 隐私通信工具
      - 自建自研或私有化自托管
    rows:
      - - 实时服务器通信
        - 核心优势：文字、语音、视频、私信（DM）与身份组
        - 适合团队频道交流与在线会议
        - 具备该能力，但非唯一核心设计重心
        - 在特定语音或即时通讯垂直场景中表现强劲
        - 技术上可行，但需承担研发与长期运营成本
      - - 游戏场景适配性
        - 2024 年以来的核心战略重点
        - 在现有留存对比中表现偏弱
        - 偏低至中等；重心偏向创作者与客户服务
        - TeamSpeak/Mumble 表现突出；隐私即时通讯工具较低
        - 取决于具体落地实现
      - - 业务系统集成
        - 竞品直指其在 CRM 与业务运营集成上的不足
        - 紧邻办公套件的分发能力极强
        - CRM、支付、课程与活动管理均为重点宣传的差异化卖点
        - 在现有留存证据中显示有限或未知
        - 支持高度定制，但完全依赖自行开发
      - - 可搜索的长效结构化知识
        - 竞品直指其 SEO 表现较弱，且以聊天为主的组织形式不利于沉淀
        - 支持检索职场历史消息；公开 SEO 优势未见确立
        - Discourse 与各类社区套件重点强调内容结构化与可发现性
        - 在现有留存证据中显示有限或未知
        - 经过针对性设计即可控
      - - 原生变现与付费功能
        - 存在付费增值项目；创作者对比称 Server Subscriptions 功能受限
        - 并非留存的核心用例
        - 主打付费分档、课程和活动等核心能力
        - 留存证据中显示受限或未知
        - 可行，但伴随支付与合规负担
      - - 受众与数据控制权
        - 服务器治理较灵活，但平台用户关系仍归 Discord 所有
        - 由厂商控制
        - 因厂商而异；部分声称支持品牌定制与数据导出
        - 部分产品支持自托管
        - 控制权最高，但自带分发流量最少
    notes: 矩阵条目属于定性评估并保留未知项；竞品声称并非独立性能测试，且留存证据池中未包含通用基准。
