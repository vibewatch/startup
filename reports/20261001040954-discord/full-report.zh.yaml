      - number: '8.2'
        title: 融资背景、老股定价与估值倍数回落
        blocks:
          - type: paragraph
            body: >-
              Discord 在 2021 年 9 月由 Dragoneer Investment Group 领投的 Series I 轮融资中达到 $15.0B 的一级市场投后估值顶峰。该轮新股定价对应超过 20
              倍过去十二个月收入的高昂估值倍数，完全计入了持续超高速增长与顺畅变现扩张的乐观预期。相比之下，2026 年中私募二级市场表现出剧烈的估值倍数回调。私募市场交易数据表明老股定价徘徊在 $8.50B 至 $8.53B
              之间，折合每股约 $31.31 至 $33.46。这相当于较最高轮新股融资估值承受了 39% 至 43%
              的大幅折价。老股折价既反映出高利率环境下投资者对估值倍数的审慎态度，也暴露出清算优先权与潜在股息类别权益差异带来的结构性悬顶。参与老股交易的投资者直接面临流动性匮乏、转让受限以及公开财务披露缺失等多重制约。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV010
      - number: '8.3'
        title: 情景分析、退出准备度与尽调要点
        blocks:
          - type: paragraph
            body: >-
              Discord 的上市退出准备度取决于其在 Goldman Sachs 与 JPMorgan 主承销协助下于 2026 年 1 月向 SEC 秘密递交的 S-1
              文件进展。顶尖主承销商背书虽然意味着成熟的机构认可度，但彭博社报道证实，宏观市场条件仍可能推迟或打乱正式挂牌进程。在我们的基准情景下，Discord 对应公开市场市值约为 $9.0B 至 $10.0B，对应
              12x 至 13x 预期市销率。在乐观情景下，若新的变现抓手奏效且利润率实现打平，公司估值可重估至 $13.5B 至 $15.0B。相反，在悲观情景下，若经审计财务报表暴露持续的 GAAP
              经营亏损，且未成年人安全诉讼引发更严峻的监管阻力，估值倍数可能遭大幅挤压至 $6.0B 至 $7.0B。拟在上市前投资的机构在配置资金前，必须要求核查经审计毛利率、各用户分群的贡献毛益以及诉讼风险准备金计提情况。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV008
              - CV011
              - CV012
      - number: '8.4'
        title: 专题图表
        blocks:
          - type: callout
            title: 机构尽调要求
            body: 考虑参与私募老股交易的合格投资者必须认清，以老股价格认购普通股伴随着严重的信息不对称、转让锁定期限制以及受制于清算优先权劣后的劣势。在 SEC 注册声明公开之前，此类投资决策应保持审慎观望。
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV010
          - type: callout
            title: 老股折价的风险信号
            body: 二级老股交易平台上 39% 至 43% 的折价幅度，不仅是对流动性缺失的贴现，更表明市场在对 2021 年高估值倍数环境进行根本性重估，同时也凸显了公司缺乏经审计盈利指标的结构性隐忧。
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
