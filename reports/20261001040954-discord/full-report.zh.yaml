      - number: '5.3'
        title: 分布式系统架构、网关层与数据层
        blocks:
          - type: paragraph
            body: >-
              在 Discord 低延迟交互界面背后，是一套专为极高并发和高写入负载打造的分布式底层架构。客户端的持久化长连接接入基于 Elixir 搭建的 Gateway 网关层，Erlang BEAM 虚拟机基于
              Actor 模型将每个服务器社群隔离为独立的内存 Guild Process（公会进程），避免单点局部故障波及邻近社群。为彻底解决早期数据库热点分区瓶颈并消除 JVM 垃圾回收（GC）停顿，Discord
              将底层存储由 Apache Cassandra 迁移至 ScyllaDB，并在其上层自研部署了 Rust 数据服务层。这些 Rust 服务利用 Tokio 异步 I/O
              与一致性哈希路由实现请求合并（Request Coalescing），将重复的并发查询折叠为单次数据库检索，把消息抓取的长尾延迟压制在高度可控的范围内。
            claimRefs:
              - CE004
              - CE011
              - CE012
              - CE013
