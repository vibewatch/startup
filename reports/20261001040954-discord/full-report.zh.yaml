      - number: '1.3'
        title: 平台规模、运营指标与关键发展节点
        blocks:
          - type: paragraph
            body: >-
              Discord 的运营体量已从垂类游戏语音聊天工具发展为大型高互动社群平台，月活跃用户数突破 200M+，注册账户达 656M，日活跃用户数超过 90M+。活跃用户中逾 90% 玩电子游戏，约 40% 在打开
              Discord 一小时内启动游戏，展现出极高的日常黏性（例如美国大学生群体中日均使用时长据报达 117 分钟）。商业化主要依靠 Nitro 与 Nitro Basic 高级订阅，2023 年贡献年化收入约
              $575M 至 $600M，2024 年过去十二个月年化收入估算在 $700M 至 $900M 之间。受制于免费用群体量庞大且付费转化率仅约 3% 至 5%，每年每用户平均收入（ARPU）仍然偏低，仅约
              $3.50。为摆脱单一依赖消费者订阅的收入结构，Discord 陆续上线激励式视频任务（Quests）、开发者社交 SDK 以及嵌入《Marvel
              Rivals》等游戏内的电商交易场景。扩张过程中公司也面临多重阻力，包括 2024 年初裁员 17%、新泽西州总检察长发起的未成年人安全诉讼，以及待审议的联邦青少年网络安全立法带来的更严格监管审查。
