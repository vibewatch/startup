      - number: '3.2'
        title: Discord's engagement strength is narrower than full workflow ownership
        blocks:
          - type: paragraph
            body: >-
              Discord's defensible product surface is the combination of persistent servers, synchronous voice, direct
              messages, community roles, discovery controls, and a bot ecosystem. Server owners and administrators
              control membership rules, roles, discovery, public invites, and app additions, which supports flexible
              community governance without requiring an organization to build communications infrastructure. The
              weakness is what sits outside that loop. Competitor pages consistently attack absent or limited CRM,
              course, payment, white-label, search-engine discoverability, and structured knowledge workflows. Those are
              not independent benchmarks, but they identify credible displacement wedges: enterprise suites own adjacent
              workflow and identity distribution, while community suites can bundle content, events, payments, and
              branding. Discord remains strongest where low-friction real-time interaction matters more than
              business-system integration or public knowledge persistence.
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP010
              - CP011
              - CP012
              - CP016
      - number: '3.3'
        title: Free core access anchors the price umbrella
        blocks:
          - type: paragraph
            body: >-
              Discord's terms state that basic functionality is free and that users may pay for additional features.
              Competitor-published 2026 comparisons list Nitro Basic at $2.99 per month and Nitro at $9.99 per month,
              while alternatives use materially different units: flat monthly community-platform fees, per-user
              workplace pricing, free or self-hosted software, and paid hosted voice capacity. Circle's comparison, for
              example, lists Circle from $89 per month, Slack from $8.75 per user per month, Microsoft Teams from $4 per
              user per month, and Discourse from $20 per month. These are list-price snapshots from vendors, not
              realized pricing or independently verified total cost. The comparison therefore shows packaging pressure
              rather than a reliable willingness-to-pay benchmark for Discord's users.
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP011
      - number: '3.4'
        title: The moat is engagement and network density, not universal workflow lock-in
        blocks:
          - type: paragraph
            body: >-
              Discord's more-than-200-million-user scale, gaming focus, and private-group communication model give it
              distribution and familiarity that smaller direct peers must overcome. Its moat should nevertheless be
              segmented. Gaming and social servers benefit from member density, shared norms, voice quality
              expectations, bots, and repeated real-time use. Professional and creator communities can multi-home or
              move functional layers to products that offer CRM, searchable forums, courses, payments, stronger
              branding, or self-hosting. Competitor claims that audiences are mediated by Discord and that server
              histories are hard to export point to switching friction, but the retained evidence does not measure
              migration completion, churn, or multi-homing. The most credible adverse case is gradual commoditization at
              the edges: bundled incumbents win business workflows and specialist platforms extract monetization or
              knowledge use cases while Discord retains the conversational core.
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP010
              - CP011
              - CP012
              - CP016
