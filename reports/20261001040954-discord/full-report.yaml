      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Discord is structurally multi-sided. A community member may be the user but not the payer; an enthusiast
              can buy Nitro or fund a server boost; a server owner can configure access and add third-party apps; a
              developer can sell premium bot functionality; and a game publisher or brand can fund sponsored engagement.
              This creates a product-led adoption path in which users first join or create a free server, administrators
              shape rules and integrations, and monetization follows only after engagement develops. Evidence that 46%
              to 54% of users identify as non-gamers broadens the use-case base beyond gaming, while estimates placing
              Asia-Pacific at 34% of users and North America at 28% indicate that localization and regional payment
              behavior will influence conversion. Public demographic estimates conflict on whether ages 18-24 or 25-34
              are the largest cohort, limiting precise buyer targeting.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM015
      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The principal adoption driver is high-intensity communication inside communities users already chose to
              join. Estimates place the standard-session DAU-to-MAU ratio near 12% to 15%, while session-duration
              measures are stronger for voice users; those are different engagement lenses, not a contradiction that can
              be collapsed into one conversion rate. Monetization has historically relied on subscriptions and boosts,
              while 2024-2026 evidence describes rewarded Quests as an emerging advertising line. That expansion can
              improve revenue per user, but it also creates a trust tradeoff because community conversations are more
              private and relational than public feeds. Additional constraints include low reported Nitro penetration,
              moderation and age-assurance obligations, administrator-controlled distribution, third-party app risk,
              switching to familiar group-chat substitutes, and the absence of audited cohort economics. Valuation
              should therefore reward audience scale only after verifying payer conversion, retention, ad load
              tolerance, and the cost of safety and infrastructure.
            claimRefs:
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite the generic market forecast as TAM
            body: >-
              The available category forecast is centered on Discord itself and lacks enough disclosed methodology to
              isolate serviceable spend. Underwriting should use payer cohorts and geography-specific willingness to pay
              once company data is available.
            calloutType: risk
            claimRefs:
              - CM003
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set changes with the job to be done
        blocks:
          - type: paragraph
            body: >-
              Discord is not competing in one homogeneous messaging category. Its official terms describe servers built
              from text channels and real-time voice or video channels, while Forge reports that Discord says it serves
              more than 200 million monthly active users and returned its strategic focus toward gaming in 2024.
              Competitor-published comparisons divide alternatives into four practical jobs: customer or creator
              communities, workplace collaboration, gaming voice, and privacy-first messaging. That framing puts Guilded
              and TeamSpeak closest to the core gaming use case; Slack and Microsoft Teams against business
              collaboration; Circle, Bettermode, and Discourse against structured community or knowledge workflows; and
              Signal, Telegram, and Element against privacy-oriented communication. Internal build and the status quo
              remain alternatives where ownership outweighs network reach.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP007
              - CP015
