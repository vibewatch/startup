chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Governance, and Leadership Structure
        blocks:
          - type: paragraph
            body: >-
              Discord Inc. operates as a late-stage private communications platform founded in 2015 by Jason Citron and
              Stanislav Vishnevskiy, originating from gaming development efforts initiated at Phoenix Guild and Hammer &
              Chisel in 2012. Headquartered at 444 De Haro Street in San Francisco, California, the company provides
              structured voice channels, low-latency text chat, video calling, and interactive social infrastructure.
              Operating governance underwent a decisive transition on April 28, 2025, when Citron stepped down from the
              chief executive role after 13 years to become an advisor and board member, passing executive leadership to
              Humam Sakhnini, the former Vice Chairman of Activision Blizzard and past President of King Digital
              Entertainment. Vishnevskiy continues to direct core platform architecture and engineering as Chief
              Technology Officer, preserving technical continuity while executive management aligns for public market
              scrutiny. Governance is overseen by an active 14-member board of directors featuring venture partners from
              benchmark financing rounds alongside independent directors, without any disclosed dual-class voting
              control structure.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
