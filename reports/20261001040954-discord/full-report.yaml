      - number: '1.2'
        title: Capitalization History, Secondary Repricing, and Ownership Profile
        blocks:
          - type: paragraph
            body: >-
              Discord has secured just over $1 billion across 10 primary venture and strategic equity funding rounds
              since 2012. Early capitalization was anchored by YouWeb incubation, Benchmark Capital, and Tencent in
              2015, followed by institutional growth financings led by Greylock Partners, Greenoaks Capital, and Index
              Ventures between 2016 and 2018. During the 2020 pandemic communications surge, Discord completed two
              separate $100 million financings at valuations of $3.5 billion and $7.0 billion, ultimately turning down
              an acquisition bid from Microsoft reported at $10 billion to $12 billion in early 2021. The company's
              definitive primary pricing benchmark closed in September 2021, when Dragoneer Investment Group led a $500
              million Series I round at a post-money valuation of $15.2 billion with participation from Baillie Gifford,
              Coatue Management, Fidelity Investments, and Franklin Templeton. Following the broader market multiple
              contraction, secondary transactions priced Discord stock at $31.31 on July 8, 2026, implying an $8.53
              billion Forge Price valuation, roughly 44% below its primary peak. Although Bloomberg reported a
              confidential U.S. initial public offering submission on January 6, 2026, backed by lead underwriters
              Goldman Sachs and J.P. Morgan, Discord has not confirmed an explicit listing date, price range, or
              exchange venue.
            claimRefs:
