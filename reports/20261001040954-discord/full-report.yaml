  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Discord has built a multi-hundred-million-dollar consumer business primarily on voluntary user
              contributions rather than pervasive programmatic display advertising. The core monetization engine remains
              Discord Nitro, an optional tiered subscription priced at $2.99 per month ($29.99 per year) for Nitro Basic
              and $9.99 per month ($99.99 per year) for full Nitro. Nitro unlocks cosmetic expression and functional
              quality-of-life enhancements, including custom emoji across servers, 500MB upload ceilings, HD video
              streaming, and bundled server boosts. Direct Nitro subscription sales generated an estimated $207M in 2023
              and expanded to roughly $280M in 2025 across an estimated 7.3 million paying subscribers. Blended Nitro
              subscriber ARPU sits at approximately $38.36 annually ($3.20 monthly), illustrating that paying users skew
              heavily toward annual billing cycles and the lower-priced Nitro Basic tier rather than the full-price
              $9.99 monthly tier. Beyond individual subscriptions, community-level Server Boosting serves as a critical
              revenue pillar, contributing an estimated 45% to 55% of total revenue ($430M to $520M in 2025). Server
              Boosts cost $4.99 per month for non-subscribers and $3.49 per month for Nitro members (who receive two
              included boosts), creating a communal status mechanic where users pool financial resources to unlock
              shared server perks such as higher audio bitrates, custom vanity URLs, and expanded emoji slots. Emerging
              commercial layers include the Discord Shop selling cosmetic avatar effects and digital goods ($19M to
              $48M), Server Subscriptions offering Patreon-style paid creator channels with a 10% platform take rate
              ($10M to $29M), and premium developer App Directory subscriptions with a 15% to 30% revenue share ($5M to
              $19M). The newest growth vector is Sponsored Quests, an opt-in rewarded advertising format where brands
              and game publishers pay Discord to incentivize gameplay achievements and sponsored stream engagement.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI007
          - type: table
            tableRef: TI001
