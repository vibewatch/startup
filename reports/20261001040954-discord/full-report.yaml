figures:
  - id: FO001
    title: Discord Company Milestone Timeline
    type: timeline
    summary: >-
      Key corporate, financing, product, leadership, and regulatory milestones spanning Discord's founding in 2012
      through its 2026 confidential IPO filing.
    data:
      items:
        - date: '2012-04-01'
          label: Studio Founding
          detail: >-
            Jason Citron establishes Phoenix Guild (subsequently Hammer & Chisel) to build mobile MOBA games, developing
            early voice and text tools.
        - date: '2013-04-01'
          label: Technical Co-Founder Joins
          detail: >-
            Stanislav Vishnevskiy joins Hammer & Chisel as co-founder and CTO, collaborating on mobile game networking
            and backend chat architecture.
        - date: '2015-05-13'
          label: Discord App Launch
          detail: >-
            First public release of Discord as a dedicated desktop and mobile voice and text communications platform for
            online gamers.
        - date: '2017-01-15'
          label: Nitro Subscription Introduction
          detail: >-
            Discord launches Nitro premium subscription tier ($9.99/mo), establishing the platform's core
            direct-to-consumer monetization model.
        - date: '2021-04-20'
          label: Microsoft Bid Rejection
          detail: >-
            Discord terminates acquisition discussions with Microsoft valued at $10B-$12B to pursue an independent
            growth strategy and future IPO.
        - date: '2021-09-09'
          label: Series I at $15.2B Valuation
          detail: >-
            Secures $500M Series I financing led by Dragoneer Investment Group at a peak primary post-money valuation of
            $15.2 billion.
        - date: '2024-01-11'
          label: Workforce Reduction & Gaming Focus
          detail: >-
            Implements a 17% workforce cut to streamline operations, refocusing core product investments directly on
            gaming and community engagement.
        - date: '2025-04-28'
          label: Executive CEO Leadership Transition
          detail: >-
            Humam Sakhnini named CEO to prepare the business for public markets, while co-founder Jason Citron
            transitions to board member and advisor.
        - date: '2026-01-06'
          label: Confidential U.S. IPO Filing
          detail: >-
            Submits draft registration statement to the SEC for a proposed initial public offering, engaging Goldman
            Sachs and J.P. Morgan.
        - date: '2026-07-08'
          label: Secondary Valuation Re-Pricing
          detail: >-
            Forge Global secondary market price sets Discord share valuation at $31.31, representing an implied market
            equity valuation of $8.53 billion.
    approximationNotes: >-
      Dates reflect primary announcement months and specific reported corporate filing milestones. Exact confidential
      SEC draft submission date confirmed via financial press reporting.
    claimRefs:
      - CO001
      - CO002
      - CO005
      - CO008
      - CO009
      - CO010
      - CO011
      - CO013
      - CO014
      - CO016
