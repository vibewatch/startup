  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Discord's relevant market is persistent group communication organized around user-created servers, with
              text, voice, video, roles, bots, and paid enhancements. The economic boundary is narrower than all
              messaging or social media: it includes consumer community communication, gaming coordination, creator and
              brand communities, server monetization, and a developer-app layer, but excludes enterprise collaboration
              sold by seat and public broadcast feeds as primary categories. The status quo is fragmented across
              game-native voice chat, group messaging, social feeds, forums, and self-hosted community tools. This
              boundary matters because a forecast branded as the "Discord Market" is a vendor-defined category estimate,
              not a directly measured pool of all substitutable spend. Discord's own terms confirm a free core with
              optional paid products, while independent analysis describes the buyer context as communities rather than
              enterprise workgroups.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM011
              - CM012
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              No single public number is a reliable TAM, SAM, or SOM. TrendX estimates a global Discord-specific
              category of USD 850.16 million in 2025, rising to USD 3,917.09 million in 2034 at an 18.50% CAGR, but
              describes its method only as secondary research and proprietary models. Audience evidence is broader but
              also inconsistent: independent summaries cite an official floor of more than 200 million monthly active
              users, while third-party estimates range from 231 million to roughly 260 million. Registered-account
              totals are larger but include inactive sign-ups and therefore are not an addressable active population. A
              reported 7.3 million Nitro subscribers is a payer lens, not revenue or SAM. These measures should be used
              as separate sensitivity anchors until cohort-level geography, eligibility, willingness to pay, and
              verified conversion data are available.
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM016
