  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Six-layer architectural stack of Discord real-time communications infrastructure from client applications down to
      persistent storage and developer platforms.
    approximationNotes: >-
      Represents Discord core production architecture synthesized from engineering disclosures, database migration
      reports, and developer documentation.
    claimRefs:
      - CE004
      - CE011
      - CE012
      - CE013
    data:
      layers:
        - label: Client & Presentation Layer
          detail: >-
            Cross-platform client applications across Windows, macOS, Linux, iOS, Android, and web browsers providing
            voice, video, text, and rich game presence detection.
        - label: Gateway & Connection Management Layer
          detail: >-
            Distributed Elixir BEAM cluster terminating persistent WebSocket connections, managing user presence, and
            providing custom session resumption buffers.
        - label: Community & Guild State Layer
          detail: >-
            In-memory Elixir Guild Process actor model isolating each community so failures and traffic spikes in one
            server never degrade neighboring servers.
        - label: Data Services Routing & Coalescing Layer
          detail: >-
            Rust-based intermediate microservices with Tokio async I/O, gRPC endpoints, and consistent hash routing to
            coalesce concurrent reads into single queries.
        - label: Persistent Message Storage Tier
          detail: >-
            ScyllaDB C++ distributed NoSQL cluster utilizing local NVMe SSDs, RAID persistence, and shard-per-core
            topology storing trillions of messages.
        - label: Developer Platform & Interaction Layer
          detail: >-
            REST API, WebSocket Gateway, and HTTP Interactions Webhooks supporting OAuth2 authentication, bot tokens,
            and developer automation frameworks.
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Community organizers drive acquisition, participation creates habit, and paid features expand value before trust
      or compliance friction can interrupt the loop.
    data:
      items:
        - label: Discover
          detail: A friend, guild, creator, or game community introduces Discord.
          touchpoints:
            - Invite link
            - Community recommendation
        - label: Join
          detail: The user enters a server and adopts its membership rules.
          touchpoints:
            - Account
            - Server membership
        - label: Participate
          detail: Text, voice, video, and streaming create recurring utility.
          touchpoints:
            - Text channels
            - Voice and video
        - label: Organize
          detail: Owners and administrators add roles, permissions, discovery, and bots.
          touchpoints:
            - Roles
            - Bots and apps
        - label: Expand
          detail: Individuals buy Nitro or communities fund server boosts for added benefits.
          touchpoints:
            - Nitro
            - Server boosts
        - label: Retain or encounter friction
          detail: Community value supports continuity, while safety and age-assurance requirements can add steps.
          touchpoints:
            - Community relationships
            - Age assurance
    approximationNotes: >-
      Conceptual sequence based on official service mechanics and assigned growth evidence; it does not imply measured
      stage conversion rates.
