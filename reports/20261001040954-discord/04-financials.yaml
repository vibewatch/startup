callouts:
  - calloutType: "insight"
    title: "The Voluntary Monetization Moat and ARPU Discount"
    body: "Discord's decision to monetize via opt-in subscriptions and community boosting rather than algorithmic feed advertising protects user trust and community cohesion. However, generating only $3.63 to $3.80 in annual revenue per MAU leaves significant money on the table compared to peers like Meta ($42+) or Snap ($10). Closing even a fraction of this gap via Sponsored Quests is the core equity story for the impending IPO."
    claimRefs:
      - "CI006"
      - "CI008"
      - "CI009"
  - calloutType: "risk"
    title: "Valuation Compression and the Cost of Independence"
    body: "Discord rejected a reported $10B to $12B buyout offer from Microsoft in 2021 when its revenue was $310M. Despite expanding revenue to between $750M and $950M and achieving positive adjusted EBITDA, secondary market transactions currently value the company at $6.8B to $8.53B. Public market investors will demand audited proof of durable GAAP profitability to justify an IPO valuation above its 2021 marks."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI016"
