companyProfile:
  summary: >-
    Cart.com is a Houston-based private unified commerce and logistics company
    founded in 2020 and led by co-founder and CEO Omair Tariq. The company
    combines omnichannel fulfillment infrastructure with order, warehouse, and
    transportation management software, storefront and B2B commerce tooling,
    merchant-of-record capabilities, and marketplace services expanded through
    acquisitions such as OceanX and Amify. Public customer proof spans
    enterprise apparel and footwear brands, brand portfolios, beauty brands,
    marketplace sellers, and federal agencies. Cart.com has reached meaningful
    scale, but public disclosures remain uneven: customer counts and GMV are
    more visible than audited revenue, margins, debt terms, or retention
    metrics.
  foundedDate: '2020-09-01'
  founders:
    - name: Omair Tariq
      role: Co-Founder & CEO
      background: Former Home Depot executive and former COO of Blinds.com; public face of Cart.com's fundraising and expansion strategy.
      claimRefs: [CO005, CO010]
    - name: Jim Jacobsen
      role: Co-Founder & Executive Chairman
      background: Former RTIC Outdoors CEO and alliantgroup co-founder who remains a senior governance figure at Cart.com.
      claimRefs: [CO005, CO011]
  foundingLocation: Houston, TX
  headquarters: Houston, TX
  productSummary: >-
    Hybrid platform spanning fulfillment and logistics, OMS/WMS/TMS software,
    storefront and B2B commerce tools, merchant-of-record services, warehouse
    automation, and marketplace management for multichannel brands.
  customerFocus: >-
    Mid-market and enterprise brands, marketplace-first sellers, B2B
    wholesalers, and selected public-sector agencies needing outsourced
    commerce operations plus software control.
  businessModel: >-
    Mix of fulfillment and logistics fees, commerce-software fees,
    merchant-of-record/payment-related fees, and managed-commerce or
    marketplace-service revenue.
  stage: growth
