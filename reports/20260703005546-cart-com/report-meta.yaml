  topStrengths:
    - Integrated software-plus-fulfillment stack spanning OMS, WMS/TMS, storefront, merchant-of-record, automation, and marketplace services rather than a single-point tool.
    - Real operational proof from named enterprise customers and scaled logistics activity, including 6,000-plus customers, 70-million-plus annual orders, and disclosed billion-dollar GMV throughput.
    - Repeat access to institutional capital and strategic board-level support signal market confidence despite operating complexity.
  topRisks:
    - Audited revenue, gross margin, debt covenants, and full capital-stack terms remain opaque, leaving the valuation extremely sensitive to assumptions.
    - The business is labor- and facility-intensive and has been assembled through many acquisitions, creating integration, service-quality, and culture-execution risk.
    - Customer concentration, retention, and platform dependence are not disclosed, so apparent growth could mask a narrow large-account base or uneven expansion economics.
  unresolvedGaps:
    - Audited trailing revenue, gross margin, EBITDA, and cash-flow disclosure remain unavailable.
    - BlackRock debt terms and the March 2026 round's liquidation preferences, seniority, and dilution effects are not public.
    - Customer concentration, contract duration, NRR/GRR, and churn data are undisclosed despite the enterprise-heavy logo set.
    - Security/compliance attestations and quantified uptime or incident-history evidence are not publicly documented at diligence-grade depth.
