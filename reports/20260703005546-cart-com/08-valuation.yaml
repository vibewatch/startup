- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable / signal
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Cart.com May 2025 round
    - Primary financing anchor
    - $50M at $1.6B post-money
    - Best clean company-stated price anchor for entry discipline.
    - Headline round size did not reconcile neatly with the later Form D/A.
  - - Prime Unicorn 2024 secondary mark
    - Secondary downside signal
    - $902M adjusted valuation; share price down 36.9% vs. Series C reference
    - Shows the market has already tolerated a sub-unicorn trading signal.
    - Secondary activity was limited and not a full primary-price substitute.
  - - Shopify
    - Public premium software benchmark
    - 12.29x EV/Sales on $12.37B revenue
    - Upper bound for what a scaled commerce software winner can command.
    - Much purer software and much more profitable than Cart.com.
  - - Commerce.com
    - Public hybrid commerce software comp
    - 0.78x EV/Sales on $346.82M revenue
    - Useful low-end anchor with similar commerce-software adjacency and public-company disclosure.
    - Weaker profitability and different product mix can overstate downside.
  - - VTEX
    - Public ecommerce platform comp
    - 2.08x EV/Sales on $247.05M revenue
    - Reasonable mid-lower public reference for a commerce platform with real software gross margins.
    - Less fulfillment-heavy and more geographically distinct than Cart.com.
  - - Stord
    - Private software-enabled fulfillment comp
    - $250M raised at $3B valuation in 2026 after a $1.5B 2025 round
    - Shows investors still reward fulfillment platforms with modern software narratives.
    - Revenue, margin, and structure disclosure are limited.
  - - ShipBob
    - Private fulfillment platform comp
    - Tracked around $1.4B valuation with $651.7M raised
    - Useful directional private benchmark near Cart.com's 2025 headline mark.
    - Aggregator-based and not accompanied by current public financials.
  - - Flexport / private-data caveat
    - Direction-only private benchmark
    - Aggregator title says $8.0B in 2026 while extracted body says $997.5M as of Aug. 2025
    - Demonstrates how noisy private-company valuation aggregators can be.
    - Too internally inconsistent for precision underwriting.
  enumerationScope:
    coverage: partial
    basis: Rows cover the main public and private valuation references usable for Cart.com today, but the set is intentionally
      partial because there is no perfect public hybrid commerce-and-fulfillment analog with fully disclosed segment economics.
  notes: This table mixes primary financing anchors, secondary signals, public comps, and private comparables because using
    only one of those buckets would overstate precision. The right takeaway is banding, not a single-point fair value.
