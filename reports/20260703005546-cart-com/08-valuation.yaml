- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Financing reset
    - Verified new round below about $1.2B
    - Would validate the bearish view that the current headline mark was not durable.
    - Move from track to avoid for new money and reassess hold posture.
  - - Preferred-stack overhang
    - Verified participating or stacked greater-than-1x preferences
    - Can destroy common-equity returns even without a big top-line miss.
    - Reprice any common-equity entry off downside waterfalls, not off headline post-money.
  - - Revenue miss
    - Audited revenue materially below roughly $250M
    - Would make the 2025 $1.6B anchor look much closer to a 6x-9x story than to a 3x-4x story.
    - Collapse bull case and anchor to lower public comp bands.
  - - Economic-quality miss
    - Evidence that fulfillment contribution margins dominate while software economics are weak
    - Would push Cart.com toward hybrid logistics multiples instead of premium software multiples.
    - Use VTEX / Commerce.com-style bands rather than software leaders.
  - - Liquidity miss
    - Secondary liquidity remains thin while exit markets stay shut
    - Would limit holder optionality and increase dependence on structured insider rounds.
    - Treat the name as longer-duration and more structure-sensitive than the headline mark implies.
  notes: Every trigger is designed to be falsifiable. The point is to define what would actually break the valuation thesis
    before a new round or secondary purchase is approved.
  claimRefs:
  - CV033
  - CV035
  - CV036
  - CV037
  - CV042
  - CV047
  - CV048
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited revenue bridge
    - 2025 and year-to-date 2026 revenue by segment, plus ARR or software-revenue bridge
    - This is the single biggest input deciding whether $1.6B is 3x-ish or 9x-ish revenue.
    - Finance diligence; audited statements and management model review.
  - - Gross margin and contribution economics
    - Gross margin by software, fulfillment, and services; facility contribution margin
    - Needed to decide whether Cart.com belongs nearer software or logistics comp bands.
    - CFO / FP&A review with facility-level cohort economics.
  - - Current cap table and share count
    - Fully diluted share count, classes, option pool, warrants, and SAFEs if any
    - Secondary indications and post-money marks are not actionable without the denominator.
    - Legal and finance data room request.
  - - Preferred-stock rights
    - Liquidation preferences, dividends, participation, ratchets, and conversion mechanics by round
    - Headline valuations can overstate common-equity outcomes if the stack is protective.
    - Charter, term sheet, and financing counsel review.
  - - Debt and covenant package
    - BlackRock facility size, maturity, covenants, amortization, and any refinancing waterfalls
    - Debt terms affect both downside resilience and exit proceeds.
    - Treasury / lender diligence and credit agreement review.
  - - Customer concentration and retention
    - Top-customer share, NRR, churn, and post-acquisition retention
    - Needed to know whether public brand names translate into durable pricing power.
    - Revenue operations and cohort-analysis review.
  notes: These asks are intentionally mechanical. They target the missing facts that decide entry price, dilution, and exit
    value rather than generic diligence hygiene.
