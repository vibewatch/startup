company:
  name: Cart.com
chapter:
  number: 8
  title: Valuation
  summary: 'Cart.com''s latest primary valuation anchor is the company''s own May 2025 $1.6 billion post-money round, but
    every underwriting input that would determine whether that price is attractive rather than merely credible remains either
    undisclosed, internally inconsistent, or tracker-dependent. The public record supports a real scaled commerce-and-logistics
    platform with repeat institutional backers, yet it also supports a wide current value range from roughly the 2024 $902
    million secondary signal toward the 2025-2026 private marks. Recommendation: research-more / track; treat $1.6 billion
    as stretched unless audited revenue, margin, and capital-stack evidence move the company closer to premium-software economics
    than to asset-heavy fulfillment.'
sections:
- id: recommendation-thesis-and-price-sensitivity
  title: Recommendation, thesis, anti-thesis, and price sensitivity
  body: 'Cart.com''s investment case is easier to believe than to price. The strongest public valuation fact is still the
    company''s own May 2025 announcement of a $50 million round at a $1.6 billion post-money valuation, followed by a March
    2026 announcement of $180 million of fresh growth equity without a new post-money number. That combination supports a
    live financing market, but not a clean answer on whether today''s buyer is paying into a proven bargain, a fair growth
    mark, or a structure-heavy bridge. The bull thesis is real: Cart.com still presents as a blended software-plus-logistics
    platform, names enterprise customers such as TOMS Shoes, PacSun, Janie and Jack, and keeps attracting repeat institutional
    capital while layering in AI and workflow automation. The anti-thesis is also real: the company''s own scale disclosures
    are internally stale, lifetime funding totals vary wildly across trackers, and the market has already shown one meaningful
    adverse mark when Prime Unicorn said 2024 secondary trades implied only $902 million of adjusted value. Those facts point
    to a price-sensitive conclusion rather than a company-quality conclusion. For new money, the public record supports research-more
    / track with medium confidence, high risk, and a stretched stance at $1.6 billion. For existing holders, hold is more
    supportable than exit only if later diligence shows clean preferred terms and if audited economics prove the business
    deserves to trade closer to premium software than to lower-multiple commerce infrastructure.'
