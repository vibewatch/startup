- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current view
  - Why
  - Confidence
  - Decision implication
  rows:
  - - Recommendation
    - Research-more / Track
    - The company looks real, but the public file still underwrites quality better than price.
    - Medium
    - Do more diligence before new money invests.
  - - Risk rating
    - High
    - Funding totals, debt, and preferred-stack terms remain partially opaque.
    - Medium
    - Treat current marks as fragile under bad structure or weak economics.
  - - Valuation stance
    - Stretched at $1.6B
    - The mark can be defended only under a materially higher revenue or margin profile than the public file proves.
    - Medium
    - Do not treat the headline round as self-validating.
  - - Hold / exit posture
    - Hold for insiders; wait for new entrants
    - Repeat backers and fresh capital argue against panic, but not for adding blindly.
    - Medium
    - Existing holders can monitor; new buyers should demand better evidence or better price.
  - - Best support for the thesis
    - Unified software + logistics model with named enterprise brands
    - Cart.com still shows real scale, customer proof, and product breadth.
    - High
    - Keeps the name investable in principle.
  - - What changes the call
    - Audited revenue, gross margin, and verified preferred terms
    - Those three items decide whether the business belongs nearer premium software or hybrid fulfillment comps.
    - High
    - Upgrade only after evidence closes the core pricing gaps.
