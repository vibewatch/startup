- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Bull thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Market
    - Unified commerce infrastructure remains strategically important and still attracts institutional capital.
    - A large market does not guarantee that a hybrid model deserves premium pricing in a weak exit window.
    - Proof that Cart.com can keep gaining share without sacrificing economics.
  - - Product
    - Cart.com combines software, fulfillment, marketplaces, and customer engagement into one operating layer.
    - The same blend can dilute margins and make the company trade like logistics rather than like software.
    - Segment-level margin disclosure and software attach-rate data.
  - - Customers
    - Named brands and thousands of customers support real commercial relevance.
    - Customer quality is hard to price without concentration, retention, and cohort profitability.
    - Customer concentration, NRR, and cohort contribution margins.
  - - Financials
    - The business may already be much larger than low-end third-party revenue estimates imply.
    - If the real revenue base is close to $175M, the 2025 mark already bakes in a premium multiple.
    - Audited revenue bridge and gross-margin disclosure.
  - - Competition
    - The best public comp outcome points toward a premium software multiple.
    - Recent peer distress and low-multiple public names argue that fulfillment-heavy models can rerate quickly.
    - Win-loss data and proof that software economics dominate the model.
  - - Capital stack
    - Fresh capital and repeat investors suggest the company has not lost financing access.
    - Conflicting funding totals and unverified preference terms could mean the common-equity story is weaker than the headline
      valuation.
    - Current charter, cap table, and verified liquidation terms.
  notes: The anti-thesis is about price formation, capital structure, and model mix more than about an outright business collapse.
