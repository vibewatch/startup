  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-revenue-and-margin
    missingEvidence: Audited 2025 and year-to-date 2026 revenue by segment, plus gross margin and contribution margin by software,
      fulfillment, and services.
    whyItMatters: Those facts decide whether the current mark is closer to about 3x revenue or about 9x revenue and whether
      public software comps are even the right benchmark.
    diligencePath: Request audited financials, management model bridge, and segment-margin pack from the CFO or data room.
    relatedQuestionRefs:
    - QV006
    - QV026
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: capital-stack-terms
    missingEvidence: Current fully diluted share count, preferred classes, liquidation preferences, dividends, participation
      rights, ratchets, and conversion mechanics.
    whyItMatters: Headline post-money valuations can materially overstate common-equity value when recent rounds are structured
      or stack on top of earlier preferences.
    diligencePath: Review current charter, financing docs, cap table, and legal summary of every preferred class.
    relatedQuestionRefs:
    - QV011
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: conflicting-data
    severity: material
    topic: funding-total-reconciliation
    missingEvidence: A reconciled financing ledger that maps every Form D, company announcement, debt facility, and tracker
      entry to actual dollars closed and securities issued.
    whyItMatters: Total capital raised is a direct proxy for dilution depth, stack complexity, and how much value must be
      created before common holders see strong returns.
    diligencePath: Tie the company financing history to SEC filings, board approvals, and secondary-market data vendor records.
    relatedQuestionRefs:
    - QV005
    - QV010
  - type: access-blocked
    severity: material
    topic: secondary-liquidity-depth
    missingEvidence: Verified live bid-ask depth, matched trade history, and methodology detail for current private-market
      quotes and NAV marks.
    whyItMatters: The difference between an indicative screen price and real transactable liquidity is central to exit timing
      and common-equity downside.
    diligencePath: Obtain broker screenshots, transfer-agent data, or subscription access to PM Insights or equivalent secondary
      datasets.
    relatedQuestionRefs:
    - QV009
    - QV025
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table coverage gap
    missingEvidence: A cleaner public peer set of hybrid commerce-and-fulfillment companies with disclosed segment economics
      and a more reliable private-comp data pack.
    whyItMatters: TV004 is directionally useful, but it still mixes primary rounds, secondary marks, public software comps,
      and noisy private aggregators because no perfect direct analog is fully disclosed.
    diligencePath: Build a bespoke comp sheet from segment-disclosing filers and recent M&A once better hybrid peers or segment
      disclosures are available.
    relatedQuestionRefs:
    - QV016
    - QV021
    - QV022
    - QV023
    relatedTableRefs:
    - TV004
