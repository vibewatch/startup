  layout: standard
  summary: Cart.com's late-2025/2026 KPIs show a confirmed $1.6B valuation, 6,000+ customers, and strong independently-ranked revenue growth, but cumulative funding, headcount, and absolute revenue all carry disputed figures across sources.
  data:
    items:
    - label: Latest valuation
      value: $1.6B
      detail: Confirmed May 2025; no new valuation disclosed with the March 2026 round
      claimRefs:
      - CO026
    - label: Cumulative funding
      value: "$413M-$735M (disputed)"
      detail: Ranges across company, Tracxn, and Getlatka disclosures
      claimRefs:
      - CO029
    - label: 2025 revenue estimate
      value: "~$175.2M"
      detail: Third-party estimate only; not officially confirmed
      claimRefs:
      - CO039
    - label: Customers
      value: 6,000+
      detail: Stable across company and independent sources since 2023-2024
      claimRefs:
      - CO035
      - CO036
    - label: Headcount
      value: "878-1,600+ (disputed)"
      detail: Tracxn (2026) vs. company OceanX-era disclosure (Dec 2024)
      claimRefs:
      - CO034
    - label: Fulfillment footprint
      value: "14-18 facilities / 8.5M-10M+ sq ft"
      detail: Grew via OceanX and other 2024-2025 acquisitions
      claimRefs:
      - CO037
      - CO038
    - label: 2021-2024 revenue growth
      value: 1,053.5%
      detail: Deloitte Technology Fast 500 No. 92 ranking
      claimRefs:
      - CO040
    - label: 3-year revenue growth (to 2025)
      value: "~1,100%"
      detail: Inc. 5000 No. 385 ranking
      claimRefs:
      - CO041
  approximationNotes: KPI figures are drawn directly from the cited sources without smoothing; ranges shown for cumulative funding and headcount reflect genuine cross-source disputes rather than an author estimate.
