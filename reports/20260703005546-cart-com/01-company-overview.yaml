- id: leadership-governance-and-key-person-risk
  title: Leadership, governance, and key-person dependence
  body: Cart.com's public leadership has been unusually active in 2025-2026, with three C-suite appointments announced through the company's own newsroom in a five-month span -- Sam Bowman as Chief Marketing Officer (August 2025), Gregg Zegras as Chief Revenue Officer (September 2025), and Arjun Sainath, previously Corporate Vice President of Platform Engineering at Blue Yonder, as Chief Technology Officer (October 2025). Guthy-Renker co-founder Bill Guthy joined the board in April 2025 following Cart.com's acquisition of Guthy-Renker's OceanX fulfillment arm, and Springcoast Partners operating partner Russell Klein joined the board with the March 2026 financing. Founder-CEO Omair Tariq is the sole public figure quoted across every funding, acquisition, and leadership announcement reviewed for this chapter, indicating concentrated key-person dependence; Executive Chairman Jim Jacobsen has a lower public profile despite his board role. Beyond the two founders and recent executive hires, the only board roster identified is a third-party aggregation from Tracxn listing 15 active members, several of which appear to be duplicate name variants (for example, two separate "Jim Jacobsen" and "Jim Jacobson" entries), so this chapter treats full board composition as only partially confirmed pending an official, company-issued roster.
