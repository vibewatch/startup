- id: milestones-scale-and-adverse-checks
  title: Milestones, scale metrics, and adverse checks
  body: Cart.com's scale story has been built substantially through acquisitions -- AmeriCommerce, Cheap Cheap Moving Boxes, The DuMont Project, Sauceda Industries, FB Flurry, SellerActive, OceanX, and Amify -- layered on top of organic fulfillment-network growth. Reported customer and facility counts have stayed directionally consistent since 2024, with roughly 6,000 customers processing 70-75 million orders per year across a network that grew from 13-14 facilities in mid-2024 to 17-18 omnichannel facilities and more than 10 million square feet by mid-2025, aided by the roughly 200-employee OceanX acquisition in December 2024. Headcount figures are harder to reconcile, since Cart.com's own December 2024 release described more than 1,600 team members, while Tracxn's tracked employee count shows only 878 as of 2026, a gap this chapter cannot resolve from public sources. Independent recognitions -- a No. 92 ranking on the 2025 Deloitte Technology Fast 500 (1,053.5% revenue growth, 2021-2024) and a No. 385 debut on the 2025 Inc. 5000 (nearly 1,100% three-year growth) -- corroborate rapid growth even though no audited revenue or ARR figure was found; the only 2025 revenue estimate identified, $175.2 million, comes from a low-reliability third-party estimator. On the adverse side, TechCrunch and a Houston Business Journal report (via Owler) both describe undisclosed layoffs in early 2023 following the Austin expansion; no public lawsuit, FTC action, OSHA enforcement, or data-breach disclosure naming Cart.com was identified in the sources reviewed, which this chapter treats as an evidence gap rather than a clean record.
