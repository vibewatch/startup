company:
  name: Cart.com
chapter:
  number: 1
  title: Company Overview
  summary: Cart.com is a Houston-headquartered unified commerce and logistics platform founded in September/October 2020 by CEO Omair Tariq and Executive Chairman Jim Jacobsen; no source reviewed supports a 2018 founding, and the likely origin of that date is FB Flurry, a fulfillment company Cart.com acquired in 2022 that was itself founded in 2018. The company has raised capital across at least seven named rounds plus BlackRock venture debt, reaching a $1.6 billion valuation in May 2025 and a $180 million Springcoast-led round in March 2026, though cumulative lifetime funding, current headcount, and 2025 revenue all carry materially conflicting figures across company, aggregator, and trade-press sources. Public adverse evidence is limited to undisclosed 2023 layoffs reported by TechCrunch and Houston Business Journal; no lawsuit, regulatory action, or data breach was identified in the sources reviewed.
sections:
- id: identity-founding-and-business-model
  title: Identity, founding timeline, and business model
  body: Cart.com describes itself as a unified commerce and logistics solutions provider that lets B2C and B2B brands sell across digital channels while it manages fulfillment, marketing, marketplace operations, and customer engagement from one platform. Independent sources are consistent that the company was founded in Houston, Texas in 2020 -- Wikipedia cites October 2020, a contemporaneous SiliconHills article and a 2021 TechCrunch article both cite September 2020, and Tracxn's aggregated corporate-registry data shows the U.S. legal entity CART.COM, INC. incorporated on September 2, 2020. No source reviewed for this chapter supports a 2018 founding date for Cart.com itself. The most plausible source of that confusion is FB Flurry, a Dallas-based fulfillment company Cart.com acquired in January 2022, which FreightWaves reported was "founded in 2018." Co-founders Omair Tariq, previously an executive at The Home Depot and COO of Blinds.com, and Jim Jacobsen, former CEO of direct-to-consumer brand RTIC Outdoors and co-founder of alliantgroup, remain the company's founder-CEO and founder-Executive Chairman respectively as of the March 2026 financing. The company has moved its global headquarters twice in three years, going from Houston to Austin in December 2021, and back to Houston in November 2023, citing infrastructure and talent-pool advantages.
