  researchQuestions:
    - id: QP001
      type: enumeration
      question: Which companies make up Cart.com's realistic competitive set across software and fulfillment layers?
      status: answered
      targets: ["contentRequirements/0"]
      answerSummary: >-
        Four layers identified: software-first SaaS (Shopify, BigCommerce, VTEX), fulfillment-first
        3PLs (Stord, ShipBob, Radial, Deposco, Cin7), the marketplace-embedded status quo (Amazon
        MCF/FBA), and EDI/marketplace-operations incumbents (SPS Commerce, Rithum).
    - id: QP002
      type: enumeration
      question: Which fulfillment-first 3PLs most directly overlap with Cart.com's owned-warehouse model?
      status: answered
      targets: ["plannedTables/competitor-profile-table"]
      answerSummary: Stord, ShipBob, and Radial were identified as the closest fulfillment-first overlaps.
    - id: QP003
      type: enumeration
      question: Which software-first commerce platforms compete for the same enterprise storefront budget?
      status: answered
      targets: ["contentRequirements/0"]
      answerSummary: Shopify (Plus), BigCommerce, and VTEX were identified as the primary software-first overlaps.
    - id: QP004
      type: enumeration
      question: What alternative do brands have besides buying a platform like Cart.com or a named competitor?
      status: answered
      targets: ["contentRequirements/0"]
      answerSummary: >-
        Brands can build commerce/fulfillment capability in-house; Shopify's own abandoned
        fulfillment build illustrates the capital intensity of that path.
    - id: QP005
      type: quantification
      question: How much capital has Cart.com raised and at what valuation, as of its most recent disclosed round?
      status: answered
      targets: ["plannedTables/competitor-profile-table"]
      answerSummary: >-
        $380M cumulative by Feb 2022; $50M more in May 2025 at $1.6B post-money valuation; $180M
        further growth-equity round in March 2026 led by Springcoast Partners.
    - id: QP006
      type: quantification
      question: What is Stord's most recent funding round size and valuation?
      status: answered
      targets: ["plannedTables/competitor-profile-table"]
      answerSummary: "$250M Series F in 2026 at a $3B valuation, roughly double the prior year."
    - id: QP007
      type: quantification
      question: What is ShipBob's total funding raised and how does its valuation compare across sources?
      status: answered
      targets: ["plannedTables/competitor-profile-table"]
      answerSummary: >-
        ~$330.5M total funding; analyst valuation estimates (~$1.0-1.4B) diverge from a reported
        $4B IPO target, flagged as an unresolved conflict.
    - id: QP008
      type: quantification
      question: What scale metrics does VTEX disclose for its most recent fiscal quarter?
      status: answered
      targets: ["plannedFigures/feature-breadth-capability-map"]
      answerSummary: >-
        Q1 2026 revenue $60.7M (+12.1% YoY), GMV $5.1B (+17.1% YoY), 98.8% subscription revenue.
    - id: QP009
      type: quantification
      question: What are BigCommerce's and SPS Commerce's most recent full-year revenue figures?
      status: answered
      targets: ["plannedTables/competitor-profile-table"]
      answerSummary: >-
        BigCommerce FY2025 revenue $342.3M; SPS Commerce FY2025 revenue $751.5M (+18% YoY).
    - id: QP010
      type: quantification
      question: How many fulfillment facilities does Cart.com operate and how has that changed over time?
      status: answered
      targets: ["plannedFigures/moat-readiness-kpis"]
      answerSummary: "18 fulfillment facilities totaling over 10 million square feet as of May 2025, up from 13 previously."
    - id: QP011
      type: verification
      question: Did Shopify actually shut down its owned fulfillment network, and if so when and to whom was it sold?
      status: answered
      targets: ["contentRequirements/1"]
      answerSummary: >-
        Confirmed: Shopify sold its logistics business (including 6 River Systems and Deliverr
        assets) to Flexport in May 2023, alongside a 20% workforce reduction.
    - id: QP012
      type: verification
      question: Has BigCommerce's parent company been renamed, and does it still trade under the same ticker?
      status: answered
      targets: ["plannedTables/competitor-profile-table"]
      answerSummary: >-
        Confirmed via Cart.com's own March 2026 press release bio: parent renamed Commerce.com
        while retaining Nasdaq ticker CMRC.
    - id: QP013
      type: verification
      question: Did CommerceHub actually rebrand to Rithum, and under what ownership?
      status: answered
      targets: ["contentRequirements/0"]
      answerSummary: >-
        Confirmed: CommerceHub rebranded to Rithum in December 2023 alongside ChannelAdvisor,
        Dsco, and Cadeera, under Insight Partners' majority ownership since 2020.
    - id: QP014
      type: verification
      question: Is Pattern Inc. now a public company, and when did it IPO?
      status: answered
      targets: ["contentRequirements/0"]
      answerSummary: "Confirmed: Pattern Inc. IPO'd on Nasdaq (PTRN) on September 19, 2025, raising $300M."
    - id: QP015
      type: verification
      question: Who currently owns Radial, and what is its corporate lineage?
      status: answered
      targets: ["plannedTables/competitor-profile-table"]
      answerSummary: >-
        Confirmed: Radial descends from eBay Enterprise/Innotrac and has been owned by Belgian
        postal group bpost since a 2017 acquisition.
    - id: QP016
      type: comparison
      question: How does BigCommerce's published pricing compare structurally to Shopify Plus's enterprise pricing?
      status: answered
      targets: ["plannedTables/pricing-packaging-comparison"]
      answerSummary: >-
        BigCommerce publishes GMV-tiered self-serve pricing from $39/month; Shopify Plus instead
        sells a custom enterprise contract with a base fee plus revenue share above GMV thresholds.
    - id: QP017
      type: comparison
      question: How does Amazon MCF's cost structure compare to standard Amazon FBA?
      status: answered
      targets: ["plannedTables/pricing-packaging-comparison"]
      answerSummary: >-
        MCF charges 30-50% higher per-unit fulfillment fees than FBA but skips Amazon's 8-15%
        referral fee for non-Amazon-channel orders.
    - id: QP018
      type: comparison
      question: How does Cart.com's bundled model compare structurally to fulfillment-only 3PL contracts?
      status: answered
      targets: ["contentRequirements/2", "contentRequirements/3"]
      answerSummary: >-
        Cart.com bundles software, channel management, and fulfillment in one contract; pure-play
        3PLs like Stord/ShipBob primarily sell warehousing/fulfillment with a thinner software layer.
    - id: QP019
      type: comparison
      question: How does Cart.com's disclosed financial transparency compare to VTEX's and SPS Commerce's public filings?
      status: partial
      targets: ["contentRequirements/2"]
      answerSummary: >-
        VTEX and SPS Commerce publish audited quarterly/annual results; Cart.com's revenue,
        margins, and customer counts remain undisclosed, preventing a direct comparison.
    - id: QP020
      type: mechanism
      question: How does Amazon MCF technically route non-Amazon-channel orders through Amazon's fulfillment network?
      status: answered
      targets: ["contentRequirements/1"]
      answerSummary: >-
        MCF draws from a seller's existing FBA inventory pool to fulfill orders placed on
        non-Amazon sales channels, without requiring separate inventory or a Prime badge.
    - id: QP021
      type: mechanism
      question: How does BigCommerce's GMV-based overage pricing mechanism work at the Scale tier?
      status: answered
      targets: ["plannedTables/pricing-packaging-comparison"]
      answerSummary: >-
        The Scale tier caps included GMV at $33,333/month, charging 0.9% overage on GMV above that
        cap before auto-upgrading to the custom Performance tier near $2M trailing GMV.
    - id: QP022
      type: mechanism
      question: How has Cart.com's roll-up acquisition strategy mechanically built its current platform?
      status: answered
      targets: ["contentRequirements/0"]
      answerSummary: >-
        Cart.com acquired AmeriCommerce, Cheap Cheap Moving Boxes, The DuMont Project, Sauceda
        Industries, FB Flurry, SellerActive (2021-2022), then OceanX and Amify (through May 2025),
        stitching software and fulfillment assets into one platform.
    - id: QP023
      type: adverse
      question: Did any software-first competitor's owned-fulfillment ambition fail or get reversed, and what does that imply for Cart.com?
      status: answered
      targets: ["plannedTables/moat-durability-competitive-risk-register", "contentRequirements/4"]
      answerSummary: >-
        Yes: Shopify's Fulfillment Network was built (2019-2022) then fully divested to Flexport
        in 2023 with a 20% workforce cut, a direct cautionary precedent for capital-intensive
        owned-fulfillment bets.
    - id: QP024
      type: adverse
      question: Are there documented customer complaints, reliability incidents, or churn signals for Cart.com or its closest competitors?
      status: partial
      targets: ["plannedTables/moat-durability-competitive-risk-register"]
      answerSummary: >-
        No Cart.com-specific complaints were found (G2/Trustpilot were inaccessible), but a
        documented December 2025 Shopify platform outage and VTEX's internally inconsistent
        customer-count disclosures provide adjacent reliability/trust signals.
    - id: QP025
      type: adverse
      question: Does any adjacent competitor show a material channel-concentration or dependency risk?
      status: answered
      targets: ["plannedTables/moat-durability-competitive-risk-register"]
      answerSummary: "Yes: Pattern Inc. derives roughly 94% of its revenue from Amazon marketplaces alone."
    - id: QP026
      type: freshness
      question: What Amazon MCF/FBA fee changes take effect in 2026, and how do they affect the cost comparison?
      status: answered
      targets: ["plannedTables/pricing-packaging-comparison"]
      answerSummary: >-
        Effective January 15, 2026, Amazon raised single-unit-order fulfillment fees by
        $0.35-$0.41 per unit versus only $0.08 for standard multi-unit FBA orders.
    - id: QP027
      type: freshness
      question: What capital-raising or valuation events occurred among Cart.com's fulfillment-first peers in 2026?
      status: answered
      targets: ["plannedTables/competitor-profile-table"]
      answerSummary: >-
        Cart.com raised $180M in March 2026 at continued private valuation; Stord raised a $250M
        Series F in 2026 at a $3B valuation, roughly double the prior year.

