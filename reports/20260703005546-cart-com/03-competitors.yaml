schemaVersion: "report-v2"
artifact: competitors
slug: cart-com
runDate: "2026-07-03"
company:
  name: Cart.com
chapter:
  number: 3
  letter: P
  key: competitors
  title: Competitors
  summary: >-
    Cart.com competes across a fragmented commerce-and-fulfillment stack rather than against a
    single rival. This chapter maps four distinct competitive layers -- software-first SaaS
    incumbents (Shopify, BigCommerce, VTEX), fulfillment-first 3PLs (Stord, ShipBob, Radial),
    the marketplace-embedded status quo (Amazon MCF/FBA), and EDI/marketplace-operations
    incumbents (SPS Commerce, Rithum/CommerceHub) -- and stress-tests Cart.com's bundled
    software-plus-fulfillment thesis against each layer's pricing, scale, and durability signals,
    including two documented public-data conflicts and Shopify's own 2019-2023 retreat from
    owned fulfillment as a cautionary precedent.

sections:
  - id: landscape-and-substitution-map
    title: Competitive Landscape and Substitution Map
    body: >-
      Cart.com does not have a single direct competitor; it occupies a middle position between
      software-only commerce platforms and fulfillment-only 3PLs, while also facing indirect
      substitution from marketplace-embedded logistics such as Amazon's Multi-Channel Fulfillment
      (MCF) and FBA. Four realistic competitive layers emerge from the evidence: software-first
      SaaS incumbents (Shopify, BigCommerce, VTEX) that sell storefront and order-management
      software but generally do not own warehouses; fulfillment-first third-party logistics
      providers (Stord, ShipBob, Radial, Deposco, Cin7) that own or orchestrate physical
      fulfillment but have thinner native commerce-software layers; the marketplace-embedded
      status quo, where a brand simply uses Amazon MCF/FBA instead of buying any independent
      platform; and EDI/marketplace-operations incumbents (SPS Commerce, Rithum) that connect
      brands to retailers' supply chains without operating storefronts or warehouses themselves.
      Cart.com's stated bet is that bundling software, marketplace management, and owned
      fulfillment into one contract is more valuable than assembling the same capability from
      several vendors, a thesis this chapter tests against each layer in turn.
    claimRefs: [CP001, CP046, CP047]
    tableRefs: [TP001]
    figureRefs: [FP001]

  - id: software-first-incumbents
    title: "Software-First Incumbents: Shopify, BigCommerce, VTEX"
    body: >-
      Shopify, BigCommerce, and VTEX each sell commerce software at enterprise scale but differ
      sharply in how far they reach into physical fulfillment. Shopify built and then abandoned
      an owned-fulfillment ambition: it launched the Shopify Fulfillment Network in June 2019,
      acquired warehouse-robotics firm 6 River Systems for roughly $450 million later that year
      and fulfillment-tech firm Deliverr for $2.1 billion in 2022, then sold the entire logistics
      business to Flexport in May 2023 alongside a 20% workforce reduction, publicly framing owned
      fulfillment as a "side quest" rather than core strategy. BigCommerce (recently operating
      under the parent name Commerce.com while retaining ticker CMRC) and VTEX instead stay
      software-only and lean on third-party fulfillment partners, publishing transparent
      GMV-tiered pricing (BigCommerce) or enterprise subscription contracts (VTEX) rather than
      bundling warehousing. This makes Shopify's 2019-2023 arc the clearest cautionary precedent
      for how capital-intensive and reversible an owned-fulfillment bet can be, even for a
      well-funded software incumbent, and underscores why Cart.com's bundled model carries
      execution risk that pure-software peers have chosen to avoid.
    claimRefs: [CP009, CP011, CP012, CP013, CP014, CP018, CP032, CP033]
    tableRefs: [TP002]

  - id: fulfillment-first-peers
    title: "Fulfillment-First Peers: Stord, ShipBob, Radial, Deposco, Cin7"
    body: >-
      A second competitive layer approaches the same problem from the opposite direction: these
      firms started as (or remain primarily) physical fulfillment or warehouse-software operators
      and have added commerce-adjacent software over time. Stord, founded in 2015, raised a $250
      million Series F in 2026 at a $3 billion valuation (roughly double the prior year) and has
      made eight acquisitions in six years, including UPS's Ware2Go unit, to build a
      cloud-orchestrated warehouse network serving more than 1,000 brands. ShipBob has raised
      roughly $330.5 million since founding, operates around 50 fulfillment centers (up from four
      in 2017), and has fulfilled more than one billion units to date, though independent analyst
      estimates of its valuation (roughly $1.0-1.4 billion per Sacra) diverge sharply from a
      reported $4 billion IPO target, a discrepancy this chapter flags rather than resolves.
      Radial, descended from eBay Enterprise/Innotrac and owned by Belgian postal group bpost
      since 2017, serves large apparel and beauty brands with historically 7,000-plus employees.
      Deposco and Cin7 sell warehouse/inventory-management software without owning physical
      fulfillment networks themselves. None of these peers combines owned fulfillment with a
      native storefront/marketplace-management software layer as tightly as Cart.com claims to,
      but each is scaling fast enough in its own lane to erode the assumption that bundling is
      structurally necessary.
    claimRefs: [CP019, CP020, CP021, CP022, CP023, CP024, CP025, CP026, CP040, CP041, CP042, CP043, CP048]
    figureRefs: [FP002]

  - id: capability-pricing-comparison
    title: Capability and Pricing Comparison
    body: >-
      Where pricing is publicly disclosed, the comparison shows a wide spread in packaging
      philosophy. BigCommerce publishes GMV-tiered plans from Core ($39/month) through Growth
      ($105/month) to Scale ($399/month, capped at $33,333/month in GMV with 0.9% overage) and an
      auto-upgrading custom Performance tier above roughly $2 million in trailing GMV. Amazon's
      Multi-Channel Fulfillment (MCF) charges no subscription and only per-unit fulfillment fees
      that are 30-50% higher than standard FBA rates but skip Amazon's 8-15% marketplace referral
      fee, with a further fee increase for single-unit orders effective January 15, 2026. Shopify
      Plus, VTEX, and SPS Commerce sell custom enterprise contracts rather than public list
      prices, and Cart.com itself does not publish a price list or contract-tier structure
      equivalent to BigCommerce's or Amazon's, leaving its total cost of ownership only inferable
      from customer-reported deal sizes rather than benchmarkable against transparent competitors.
      This asymmetry -- Cart.com asking enterprise buyers to evaluate a bundle against partly
      transparent, partly opaque alternatives -- is itself a due-diligence gap rather than a
      resolved comparison.
    claimRefs: [CP011, CP018, CP021, CP027, CP028, CP034]
    tableRefs: [TP003]
    figureRefs: [FP003]

  - id: lock-in-distribution-and-partner-access
    title: Lock-In, Distribution Reach, and Partner Access
    body: >-
      Distribution reach differs by design across this landscape. Pattern Inc., which IPO'd on
      Nasdaq in September 2025 pricing shares at $14 to raise $300 million, operates an
      inventory-buying ecommerce-accelerator model across marketplaces including Amazon, Alibaba,
      TikTok Shop, Walmart, Coupang, and Mercado Libre, but roughly 94% of its 2024 revenue came
      from Amazon alone, concentrating its distribution reach on a single retail channel it does
      not control. SPS Commerce, by contrast, connects more than 50,000 subscribing customers to
      retailer EDI networks processing over $650 billion in GMV annually, and Rithum (formerly
      CommerceHub and ChannelAdvisor, taken private for $1.1 billion in 2018 and rebranded in
      2023) operates a partner network spanning brands, retailers, and marketplaces for listing,
      inventory, and drop-ship integrations. VTEX's own disclosures
      show an internal inconsistency worth flagging: its investor-relations page states
      approximately 2,200 customers and 3,100 stores across 44 countries for FY2025, while its
      public marketing homepage claims "3,500+ Enterprise customers" and 43 countries -- two
      official VTEX sources that do not agree on the same headline metric. Cart.com's own
      customer roster (TOMS Shoes, PacSun, Janie and Jack) demonstrates real enterprise traction,
      but the company has not disclosed subscriber counts or GMV processed at the scale SPS
      Commerce or VTEX publish, making direct scale comparison difficult.
    claimRefs: [CP029, CP030, CP031, CP032, CP035, CP036, CP037, CP038, CP039]

  - id: moat-durability-and-adverse-risk
    title: Moat Durability and Adverse-Risk Register
    body: >-
      Cart.com's core competitive claim -- bundling storefront software, marketplace/channel
      management, and owned fulfillment infrastructure into a single contract -- is a moat that
      each adjacent layer erodes only partially: fulfillment-only 3PLs like Stord and ShipBob are
      scaling their own software layers, software-only platforms like Shopify and BigCommerce
      lean on wide app-partner ecosystems to approximate integration, and Amazon MCF offers a
      no-commitment substitute for brands unwilling to sign a multi-year platform contract.
      Adverse and durability signals worth tracking include Shopify's Flexport divestiture as
      evidence that owned fulfillment is reversible even for a cash-rich incumbent, a December 1,
      2025 Shopify platform outage that disrupted point-of-sale and admin logins and moved its
      stock down 5.9% (illustrating platform-reliability risk industry-wide), and Pattern's
      94%-Amazon revenue concentration as a cautionary case of channel dependency. Public
      enterprise peers VTEX and SPS Commerce disclose audited, growing revenue (VTEX Q1 2026 GMV
      up 17.1% year over year; SPS Commerce FY2025 revenue up 18% year over year, its 100th
      consecutive quarter of growth) that gives investors a transparency benchmark Cart.com's
      undisclosed private financials cannot yet match. No material Cart.com-specific adverse
      events (lawsuits, mass layoffs, security incidents) surfaced during this research pass, but
      independent customer-review data (G2, Trustpilot) was inaccessible, leaving a gap in
      Cart.com-specific customer-sentiment evidence that this chapter discloses rather than
      papers over.
    claimRefs: [CP002, CP013, CP014, CP017, CP019, CP024, CP033, CP044, CP045]
    tableRefs: [TP004]

tables:
  - id: TP001
    title: Competitor Profile Comparison
    kind: comparison
    enumerationScope:
      coverage: sample
      basis: >-
        Represents a curated sample of the most-cited software-first, fulfillment-first, and
        marketplace-operations peers surfacing in web and press research on Cart.com's
        competitive set, not an exhaustive list of all commerce or logistics vendors.
    columns: [Company, Primary Model, Founded / Ownership, Funding or Public Status, Scale Signal, "Fulfillment Owned?"]
    rows:
      - ["Cart.com", "Bundled commerce software + owned fulfillment", "2020, Houston TX; private", "$380M by Feb 2022; $50M more May 2025 at $1.6B valuation; $180M March 2026 round led by Springcoast Partners", "18 fulfillment facilities, >10M sq ft (May 2025)", "Yes"]
      - ["Shopify", "Commerce software (SaaS)", "2006, Canada; public (NYSE: SHOP)", "Public company", "Sold owned-fulfillment business (SFN) to Flexport, May 2023", "No (divested 2023)"]
      - ["BigCommerce / Commerce.com", "Commerce software (SaaS)", "2009, Texas; public (Nasdaq: CMRC)", "Public company", "$342.3M FY2025 revenue; 1,079 employees", "No"]
      - ["VTEX", "Enterprise commerce platform (SaaS)", "1999, Brazil; public (NYSE: VTEX)", "Public company", "$60.7M Q1 2026 revenue (+12.1% YoY); $5.1B GMV (+17.1% YoY)", "No"]
      - ["Stord", "Cloud-orchestrated 3PL / warehousing", "2015, Atlanta; private", "$250M Series F, 2026, at $3B valuation", ">$775M lifetime funding; >1,000 customers", "Yes (network model)"]
      - ["ShipBob", "3PL fulfillment network", "2014, Chicago; private", "~$330.5M total funding", "~50 fulfillment centers; >1B units fulfilled to date", "Yes"]
      - ["Radial", "3PL fulfillment (enterprise apparel/beauty)", "eBay Enterprise/Innotrac lineage; bpost subsidiary since 2017", "Owned by bpost (public, Euronext)", "Historically 7,000+ employees", "Yes"]
      - ["Deposco", "Cloud WMS/OMS software", "2007, Georgia; private", "$35M first institutional round, March 2021 (NewSpring Capital)", "Serves retailers, distributors, brands", "No"]
      - ["Cin7", "Inventory/order-management software", "2012, New Zealand; Rubicon Technology Partners-owned since 2019", "Acquired for $133.3M (2019)", "Expanded via DEAR Systems, Orderhive acquisitions", "No"]
      - ["Amazon MCF/FBA", "Marketplace-embedded fulfillment", "Amazon subsidiary service; public parent (Nasdaq: AMZN)", "N/A (internal Amazon service)", "Per-unit fee increases effective Jan 15, 2026", "Yes (Amazon-owned)"]
      - ["SPS Commerce", "EDI / retail-network integration (SaaS)", "1987, Minneapolis; public (Nasdaq: SPSC)", "Public company", "$751.5M FY2025 revenue (+18% YoY); >50,000 customers; >$650B GMV/year", "No"]
      - ["Rithum (formerly CommerceHub)", "Marketplace-integration middleware", "1997 lineage; Insight Partners majority owner since 2020", "Taken private for $1.1B (2018); ~$1.9B majority stake (2020)", "Partner network connecting brands to marketplaces/retail sites", "No"]
      - ["Pattern Inc.", "Ecommerce accelerator (inventory-buying)", "2013, Utah; public since Sept 2025 (Nasdaq: PTRN)", "IPO raised $300M at $14/share", "~94% of 2024 revenue from Amazon marketplace", "No"]
    notes: >-
      Funding and revenue figures are as publicly disclosed by each company or in independent
      press coverage as of mid-2026; private companies without disclosed audited financials
      (Cart.com, Stord, ShipBob, Radial, Deposco, Cin7) are marked accordingly in the chapter
      text and evidence gaps rather than assigned unverified revenue estimates.

  - id: TP002
    title: Feature and Capability Matrix
    kind: comparison
    columns: [Company, Storefront/Commerce Software, Owned Fulfillment Network, Marketplace/Channel Management, EDI / Retailer Integration, "Public Pricing Disclosed?"]
    rows:
      - ["Cart.com", "Yes", "Yes (18 facilities)", "Yes", "Partial", "No"]
      - ["Shopify", "Yes", "No (divested 2023)", "Via app ecosystem", "Via apps", "Yes (Basic/Shopify/Advanced/Plus tiers)"]
      - ["BigCommerce / Commerce.com", "Yes", "No", "Via partners", "Via partners", "Yes (Core/Growth/Scale/Performance)"]
      - ["VTEX", "Yes (enterprise-grade)", "No", "Yes (marketplace module)", "Partial", "No (custom enterprise contracts)"]
      - ["Stord", "Limited (WMS/OMS layer)", "Yes (network model)", "Limited", "No", "No"]
      - ["ShipBob", "Limited (merchant dashboard)", "Yes (~50 centers)", "Limited", "No", "No (quote-based)"]
      - ["Amazon MCF/FBA", "No", "Yes (Amazon-owned)", "Amazon-only by design", "No", "Yes (published per-unit rate card)"]
      - ["SPS Commerce", "No", "No", "Limited", "Yes (core business)", "No (custom contracts)"]
    notes: >-
      "Partial" indicates the capability exists but is secondary to the company's core offering
      per company disclosures reviewed; blank capability claims are treated as absent rather than
      inferred, consistent with the evidence-gap disclosures in this chapter.

  - id: TP003
    title: Pricing and Packaging Comparison
    kind: comparison
    columns: [Company, Pricing Model, Entry Price / Threshold, Enterprise / Top Tier, Notes]
    rows:
      - ["Cart.com", "Custom enterprise contract", "Not publicly disclosed", "Not publicly disclosed", "No published price list found; TCO only inferable from customer deal reports"]
      - ["BigCommerce / Commerce.com", "GMV-tiered SaaS subscription", "Core: $39/month", "Performance: custom, auto-upgrade at ~$2M trailing GMV", "Scale tier caps at $33,333/month GMV with 0.9% overage"]
      - ["Shopify Plus", "Flat enterprise subscription + revenue share above threshold", "~$2,300/month base (per public reporting)", "Custom above GMV thresholds", "Distinct from standard Basic/Shopify/Advanced self-serve tiers"]
      - ["Amazon MCF", "Per-unit fulfillment fee, no subscription", "Per-unit fee, no referral fee for non-Amazon-channel orders", "Same per-unit model at scale", "30-50% higher per-unit cost than standard FBA; single-unit-order fee rose $0.35-$0.41 effective Jan 15, 2026 vs. $0.08 for standard FBA"]
      - ["Amazon FBA", "Per-unit fulfillment fee + referral fee", "8-15% referral fee plus fulfillment fee", "Same model at scale", "Baseline marketplace-embedded alternative to any independent platform"]
      - ["VTEX", "Custom enterprise contract", "Not publicly disclosed", "Not publicly disclosed", "Subscription revenue is 98.8% of Q1 2026 revenue per company disclosure"]
      - ["SPS Commerce", "Custom subscription contract", "Not publicly disclosed", "Not publicly disclosed", ">50,000 subscribing customers at undisclosed per-customer pricing"]
    notes: >-
      Rows without a public entry or enterprise price reflect a genuine disclosure gap rather than
      an estimate; this chapter deliberately avoids inventing pricing figures for Cart.com, VTEX,
      or SPS Commerce where no public source was found.

  - id: TP004
    title: Moat Durability and Risk Register
    kind: risk-register
    columns: [Risk / Moat Factor, Description, Evidence, Severity]
    rows:
      - ["Bundling moat is partially replicable", "Fulfillment-only 3PLs adding software, and software-only platforms leaning on app ecosystems, both approximate Cart.com's bundle without a single-vendor contract", "Stord/ShipBob software layers; Shopify/BigCommerce app partner ecosystems", "Medium"]
      - ["Owned-fulfillment reversal precedent", "Shopify built (2019-2022) then fully divested (May 2023) an owned-fulfillment network, showing the capital intensity and reversibility risk of the same bet Cart.com is making", "Shopify Fulfillment Network launch, 6 River Systems and Deliverr acquisitions, Flexport divestiture with 20% workforce cut", "High"]
      - ["No-commitment substitute exists", "Amazon MCF lets brands access fulfillment without any platform contract, at a per-unit cost premium but zero switching lock-in", "Published MCF/FBA rate card and Jan 2026 fee change", "Medium"]
      - ["Undisclosed financials vs. transparent public peers", "VTEX and SPS Commerce publish audited, growing revenue while Cart.com's financials remain private, limiting investor benchmarking", "VTEX Q1 2026 filing; SPS Commerce FY2025 press release", "Medium"]
      - ["Platform-reliability risk is industry-wide, not Cart.com-specific", "A December 1, 2025 Shopify outage disrupted POS/admin logins and moved Shopify's stock down 5.9%, showing reliability risk is a live sector-wide concern investors should ask Cart.com about directly", "Shopify outage press coverage, Dec 2025", "Medium"]
      - ["Channel-concentration risk (peer cautionary case)", "Pattern Inc. derives ~94% of revenue from Amazon marketplaces alone, illustrating the risk of over-reliance on a single channel that a diversified bundle like Cart.com's aims to avoid", "Pattern Inc. IPO/investor disclosures", "Medium"]
      - ["Cart.com-specific adverse/customer-sentiment data gap", "Independent review sources (G2, Trustpilot) were inaccessible during this research pass, leaving no independent read on Cart.com customer satisfaction or churn", "Fetch attempts returned 403/404 on G2 and Trustpilot", "Low-Medium"]
    notes: >-
      Severity reflects likely impact on Cart.com's competitive durability as assessed from public
      evidence only; it is not a formal risk-scoring methodology and should be read alongside the
      evidenceGaps entries in localEvidence.

