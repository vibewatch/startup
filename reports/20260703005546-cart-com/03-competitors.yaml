  evidenceGaps:
    - topic: cart-com-financial-disclosure
      type: private-evidence-only
      severity: material
      missingEvidence: >-
        Cart.com's audited revenue, customer count, and margin figures, which remain undisclosed
        versus VTEX and SPS Commerce's public financials.
      whyItMatters: >-
        Without disclosed financials, it is impossible to benchmark Cart.com's growth or
        profitability against publicly reported peers, undermining any direct comparison of
        competitive standing.
      diligencePath: >-
        Request Cart.com's most recent audited P&L, ARR, and customer-count disclosures directly
        from the company or through investor data rooms.
      relatedQuestionRefs: [QP019]
      relatedTableRefs: [TP001]
    - topic: cart-com-customer-sentiment
      type: access-blocked
      severity: minor
      missingEvidence: >-
        Independent customer review data for Cart.com (G2, Trustpilot) was blocked by CAPTCHA/JS
        restrictions during this research pass, limiting adverse-signal discovery specific to
        Cart.com itself.
      whyItMatters: >-
        Reliability and satisfaction complaints are a leading indicator of switching risk; without
        this data the adverse-evidence picture leans on competitor examples (Shopify, VTEX) rather
        than Cart.com directly.
      diligencePath: >-
        Access G2/Trustpilot/Capterra review data via an authenticated account or licensed
        review-aggregator API, and directly survey 3-5 reference customers.
      relatedQuestionRefs: [QP024]
    - topic: pricing-comparability
      type: missing-source
      severity: material
      missingEvidence: >-
        Cart.com's own price list or contract-tier structure, equivalent to BigCommerce's
        published tiers or Amazon's MCF rate card.
      whyItMatters: >-
        Buyers cannot benchmark Cart.com's total cost of ownership against transparent
        competitors without a live sales quote, which weakens direct pricing comparison in the
        pricing/packaging table.
      diligencePath: >-
        Request Cart.com's standard contract term sheet and 2-3 anonymized customer contract
        examples across different GMV tiers.
      relatedTableRefs: [TP003]
    - topic: stord-shipbob-financials
      type: private-evidence-only
      severity: material
      missingEvidence: >-
        Stord's and ShipBob's audited revenue and margin figures; only funding and valuation data
        are publicly available for either company.
      whyItMatters: >-
        Valuation multiples without profitability context make it hard to judge whether Stord's
        $3 billion or ShipBob's rumored $4 billion valuation reflect durable unit economics
        comparable to Cart.com's bundled model.
      diligencePath: >-
        Request each company's most recent revenue and gross-margin disclosures via
        investor-relations contacts or trailing-twelve-month disclosures if an IPO process begins.
      relatedQuestionRefs: [QP006, QP007]
