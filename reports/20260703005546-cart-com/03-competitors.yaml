callouts:
  - type: risk
    title: Bundling is a moat only until incumbents unbundle it cheaply
    body: >-
      Amazon MCF offers fulfillment with zero platform lock-in, and Shopify/BigCommerce's
      app-partner ecosystems let brands assemble a comparable bundle without signing one
      multi-year enterprise contract, meaning Cart.com's core pitch competes against
      "do-it-yourself bundling" as much as against any single rival.
    claimRefs: [CP027, CP044, CP018]

  - type: insight
    title: Shopify's 2019-2023 retreat is the clearest cautionary precedent
    body: >-
      Shopify spent an estimated $2.5B+ combined building owned fulfillment (6 River Systems,
      Deliverr, Shopify Fulfillment Network) before fully divesting it to Flexport in 2023 with a
      20% workforce cut -- direct evidence that owning fulfillment infrastructure is capital-
      intensive and reversible even for a cash-rich software incumbent, a risk Cart.com is taking
      on directly rather than avoiding.
    claimRefs: [CP013, CP014, CP045]

  - type: strength
    title: Cart.com sits in a structural gap between software-only and fulfillment-only rivals
    body: >-
      No peer in this research combines a native storefront/marketplace-management software
      layer with an owned multi-facility fulfillment network as tightly as Cart.com claims to;
      the closest analogues (Stord, ShipBob) are fulfillment-first companies adding software,
      while VTEX/BigCommerce/Shopify are software-first companies without owned fulfillment.
    claimRefs: [CP046, CP036, CP019]

