  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Who buys, uses, and pays: customer segmentation'
        blocks:
          - type: paragraph
            body: >-
              Cart.com's disclosed customer base spans at least five distinct buyer/user/payer segments, each surfaced
              through named relationships rather than a company-published segmentation schema [CU036]. Enterprise
              omnichannel apparel and footwear brands -- PacSun, TOMS, and Janie and Jack -- are still referenced
              together on Cart.com's 2026 omnichannel fulfillment page, with the brand itself acting as both buyer and
              user [CU011]. A second segment, brand-licensing portfolios such as Authentic Brands Group, introduces a
              distinct buyer/payer split: Authentic is the contracting buyer, its underlying licensed brands are the
              operational users, and Cart.com explicitly markets merchant-of-record services for portions of that
              portfolio, meaning Cart.com itself sits in the payment flow for at least some transactions [CU021][CU037].
              A third segment, beauty and wellness brands inherited through the OceanX/Guthy-Renker acquisition, adds
              25-plus celebrity and beauty brands under one fulfillment stack [CU018]. A fourth and fast-growing segment
              is Amazon marketplace sellers, served first through the 2024 Amify acquisition (50-plus brands) and, as of
              March 2026, through a fresh Foundry Brands mandate covering four named portfolio brands [CU012][CU015]. A
              fifth segment, federal and public-sector agencies, is acknowledged only in aggregate ("multiple federal
              agencies") with no names, counts, or contract values disclosed [CU001]. Cart.com's own About page uses
              broad language -- "the world's most beloved brands and most demanding organizations" -- consistent with
              this multi-segment span but without a quantified breakdown [CU042]. No source reviewed discloses how the
              6,000-plus total customer count divides across these five segments, which is this chapter's first explicit
              evidence gap.
