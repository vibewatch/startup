chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding timeline, and business model
        blocks:
          - type: paragraph
            body: >-
              Cart.com describes itself as a unified commerce and logistics solutions provider that lets B2C and B2B
              brands sell across digital channels while it manages fulfillment, marketing, marketplace operations, and
              customer engagement from one platform. Independent sources are consistent that the company was founded in
              Houston, Texas in 2020 -- Wikipedia cites October 2020, a contemporaneous SiliconHills article and a 2021
              TechCrunch article both cite September 2020, and Tracxn's aggregated corporate-registry data shows the
              U.S. legal entity CART.COM, INC. incorporated on September 2, 2020. No source reviewed for this chapter
              supports a 2018 founding date for Cart.com itself. The most plausible source of that confusion is FB
              Flurry, a Dallas-based fulfillment company Cart.com acquired in January 2022, which FreightWaves reported
              was "founded in 2018." Co-founders Omair Tariq, previously an executive at The Home Depot and COO of
              Blinds.com, and Jim Jacobsen, former CEO of direct-to-consumer brand RTIC Outdoors and co-founder of
              alliantgroup, remain the company's founder-CEO and founder-Executive Chairman respectively as of the March
              2026 financing. The company has moved its global headquarters twice in three years, going from Houston to
              Austin in December 2021, and back to Houston in November 2023, citing infrastructure and talent-pool
              advantages.
