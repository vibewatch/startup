  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      How this chapter's four risk categories flow into revenue, margin, customer retention, operations continuity, and
      financing/valuation outcomes.
    data:
      nodes:
        - id: regulatory-legal-risk
          label: Regulatory / legal risk
          detail: Lubic lawsuit, AB 701, tariffs, CCPA/CPRA
          tone: warning
        - id: operational-risk
          label: Operational / quality / security risk
          detail: Cloud outage, carrier costs, data security
          tone: warning
        - id: partner-dependency-risk
          label: Partner / dependency risk
          detail: Amazon, Shopify, BlackRock, carriers
          tone: warning
        - id: people-execution-risk
          label: People / execution risk
          detail: Key-person dependence, headcount opacity, new C-suite
          tone: warning
        - id: operations
          label: Operations continuity
          detail: Fulfillment and platform uptime
          tone: neutral
        - id: customers
          label: Customer retention
          detail: Merchant/client trust and renewal
          tone: neutral
        - id: revenue
          label: Revenue
          detail: Managed-service and fulfillment fees
          tone: neutral
        - id: margin
          label: Margin
          detail: Carrier cost pass-through, compliance cost
          tone: neutral
        - id: financing
          label: Financing / valuation
          detail: Debt covenants, future equity rounds
          tone: negative
