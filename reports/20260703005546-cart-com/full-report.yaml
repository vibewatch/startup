      - number: '2.3'
        title: 'Buyer map: enterprise brands, mid-market DTC, divesting retailers, and marketplace sellers'
        blocks:
          - type: paragraph
            body: >-
              Cart.com's disclosed customer base — TOMS, PacSun, and Janie and Jack, among a claimed 6,000-plus
              customers worldwide — points to four distinct buyer archetypes rather than one generic "ecommerce brand"
              segment. Enterprise omnichannel brands are the clearest fit: TOMS selected Cart.com as its U.S.
              fulfillment partner for software-driven inventory management, while PacSun went further and transferred
              ownership of its 2-million-square-foot automated Groveport, Ohio warehouse to Cart.com outright — a buyer
              signal that goes beyond a services contract into physical capital divestment. Mid-market DTC and consumer
              brands are a second segment, drawn to Cart.com by rising customer acquisition costs and the need to bundle
              fulfillment, marketing, and support without in-house headcount; this segment overlaps with a global DTC
              market Ringly.io sizes at $319.57 billion in 2026 (7.8% CAGR), with U.S. DTC ecommerce at $212.9 billion
              and 19.2% of U.S. retail ecommerce. A third segment — retailers actively divesting owned logistics
              infrastructure — is evidenced directly by the PacSun deal and is a workflow distinct from a brand that
              never owned a warehouse. The fourth segment is multichannel marketplace sellers: Marketplace Pulse data
              shows Amazon holding roughly $300 billion in U.S. third-party sales versus eBay's $39 billion, while
              Walmart and TikTok Shop have each reached roughly $15 billion in U.S. GMV (Walmart up from $10 billion
              while crossing 200,000 sellers; TikTok Shop up 68% year over year), and Shopify's global GMV has risen to
              66% of Amazon's marketplace GMV in 2025 (from 40% in 2020). Brands selling across three or more of these
              channels are the buyers most likely to need Cart.com's unified inventory and fulfillment layer rather than
              a single-channel tool.
