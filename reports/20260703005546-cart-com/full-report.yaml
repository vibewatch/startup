      - number: '3.4'
        title: Capability and Pricing Comparison
        blocks:
          - type: paragraph
            body: >-
              Where pricing is publicly disclosed, the comparison shows a wide spread in packaging philosophy.
              BigCommerce publishes GMV-tiered plans from Core ($39/month) through Growth ($105/month) to Scale
              ($399/month, capped at $33,333/month in GMV with 0.9% overage) and an auto-upgrading custom Performance
              tier above roughly $2 million in trailing GMV. Amazon's Multi-Channel Fulfillment (MCF) charges no
              subscription and only per-unit fulfillment fees that are 30-50% higher than standard FBA rates but skip
              Amazon's 8-15% marketplace referral fee, with a further fee increase for single-unit orders effective
              January 15, 2026. Shopify Plus, VTEX, and SPS Commerce sell custom enterprise contracts rather than public
              list prices, and Cart.com itself does not publish a price list or contract-tier structure equivalent to
              BigCommerce's or Amazon's, leaving its total cost of ownership only inferable from customer-reported deal
              sizes rather than benchmarkable against transparent competitors. This asymmetry -- Cart.com asking
              enterprise buyers to evaluate a bundle against partly transparent, partly opaque alternatives -- is itself
              a due-diligence gap rather than a resolved comparison.
