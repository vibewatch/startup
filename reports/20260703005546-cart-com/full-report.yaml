          - type: callout
            title: Cart.com sits in a structural gap between software-only and fulfillment-only rivals
            body: >-
              No peer in this research combines a native storefront/marketplace-management software layer with an owned
              multi-facility fulfillment network as tightly as Cart.com claims to; the closest analogues (Stord,
              ShipBob) are fulfillment-first companies adding software, while VTEX/BigCommerce/Shopify are
              software-first companies without owned fulfillment.
