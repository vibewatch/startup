      - number: '6.3'
        title: Evidence quality, satisfaction, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Independent evidence on customer satisfaction is thin and skews toward smaller review aggregators.
              TrustRadius, Tekpon, Slashdot, and SourceForge listings for Cart.com were all fetchable during this
              research pass, but G2 and Trustpilot -- typically the highest-traffic B2B software review platforms --
              returned blocked or unavailable responses on both live and archived-copy fetch attempts, leaving a real
              independent-evidence gap [CU044]. Where content was accessible, it was mixed: a TrustRadius reviewer
              reported that Cart.com's tech support is "fairly slow" and can take "several days to a week" to resolve a
              simple question, and separately that reporting capability "hasn't changed in the last 4 years" -- the
              strongest adverse, customer-sourced evidence found for this chapter [CU025][CU026]. SourceForge shows zero
              aggregated ratings, another signal of limited independent review density rather than a positive or
              negative verdict [CU028]. Separately, competitor-authored content from Speed Commerce frames its own "100%
              owned operations" and "guaranteed SLAs" against Cart.com's multi-owner, acquisition-assembled fulfillment
              model, an adverse framing that should be discounted for competitive bias but is included because it names
              a specific structural concern (post-M&A operational consistency) worth validating directly with Cart.com
              or its customers [CU029]. None of the named customer relationships in this chapter's proof table include a
              quantified outcome metric, meaning evidence quality is strongest on relationship existence and operational
              scope, and weakest on demonstrated business impact.
