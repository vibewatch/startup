            title: Revenue estimates disagree by roughly 3x with no public reconciliation
            body: >-
              Growjo's algorithmic 2026 estimate of $175.2 million in annual revenue sits far below founder Omair
              Tariq's own 2024 interview claim that revenue was approaching roughly $500 million around Cart.com's
              four-year mark. No audited figure exists to resolve the gap, and any revenue multiple applied to this
              company should be treated as a range, not a point estimate, until management discloses trailing revenue
              directly.
            calloutType: risk
            claimRefs:
