companyProfile:
  summary: >-
    Cart.com is a Houston-based private unified commerce and logistics company founded in 2020 and led by co-founder and
    CEO Omair Tariq. The company combines omnichannel fulfillment infrastructure with order, warehouse, and
    transportation management software, storefront and B2B commerce tooling, merchant-of-record capabilities, and
    marketplace services expanded through acquisitions such as OceanX and Amify. Public customer proof spans enterprise
    apparel and footwear brands, brand portfolios, beauty brands, marketplace sellers, and federal agencies. Cart.com
    has reached meaningful scale, but public disclosures remain uneven: customer counts and GMV are more visible than
    audited revenue, margins, debt terms, or retention metrics.
