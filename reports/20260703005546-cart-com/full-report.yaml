      - number: '2.2'
        title: 'Sizing lenses: five separate market shells, each medium-confidence and none Cart.com-specific'
        blocks:
          - type: paragraph
            body: >-
              No retained public source isolates a Cart.com-specific SAM or SOM, so this chapter uses five independent
              sizing lenses instead of one inflated TAM. Ecommerce enablement software alone is sized at $10.69 billion
              in 2026 by 360iResearch (B2B platform software, 13.74% CAGR to $23.31 billion by 2032) and at a broader
              $13.10 billion by Fortune Business Insights (16.46% CAGR to $44.32 billion by 2034) — a reminder that even
              "software market size" varies by scope. The physical-fulfillment layer is far larger: The Business
              Research Company sizes global 3PL at $1,461.13 billion in 2026, growing at a 10.6% CAGR to $2,141.68
              billion by 2030, though this figure spans all industries, not ecommerce alone. Warehouse management
              software shows a genuine methodology conflict: Mordor Intelligence puts 2026 WMS at $4.77 billion while
              Precedence Research — using a broader software-plus-services scope — puts the same year at $6.78 billion,
              a 42% gap that should not be smoothed over. The managed-commerce layer closest to Cart.com's "360" bundle
              is sized by Research and Markets at $88.95 billion in 2026 (13% CAGR to $146.22 billion by 2030), and the
              adjacent warehouse-automation/AI infrastructure layer at $34.17 billion in 2026 per ClickPost (13.98% CAGR
              to $65.74 billion by 2031). Macro context from the U.S. Census Bureau anchors these shells: Q1 2026 U.S.
              retail ecommerce reached $326.7 billion (seasonally adjusted), 16.9% of total retail, growing 9.8% year
              over year versus 3.9% for total retail — corroborated independently by FRED's ECOMPCTSA series. None of
              these numbers can be summed into a defensible Cart.com TAM; they instead bound the size of the adjacent
              pools Cart.com's bundle draws from.
