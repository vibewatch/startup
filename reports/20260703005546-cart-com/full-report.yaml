      - number: '4.2'
        title: Traction proxies, GMV-to-revenue gap, and unit-economics signal quality
        blocks:
          - type: paragraph
            body: >-
              The strongest scale proxies Cart.com discloses are gross merchandise value, customer count, and order
              volume, not audited revenue. The company's own June 2023 Series C release states that 2022 revenue grew
              more than 500% year over year and that GMV doubled to more than $5 billion, alongside 140 million product
              listings and 11 billion marketplace repricing events. By mid-2024, FT Partners and WWD both cite more than
              $8 billion in annual GMV, over 6,000 customers, and 75 million orders processed annually across 14
              omnichannel facilities -- directionally consistent with continued growth, though the underlying revenue
              that GMV converts into is never stated.


              That gap between GMV and revenue is the central unit-economics problem in this chapter. Growjo's
              algorithmic model estimates 2026 annual revenue at $175.2 million, implying a revenue-per-employee figure
              of roughly $210,294 and a headcount near 833. But founder Omair Tariq stated in a 2024 podcast interview
              that revenue grew from $30 million to $180 million in Cart.com's second year and was "approaching half a
              billion dollars" around the company's four-year mark -- a claim that, if still roughly accurate, would be
              nearly three times Growjo's 2026 estimate. Neither figure is audited, and the chapter treats both as
              labeled, competing claims rather than resolving them, since resolving them would require private financial
              data this chapter does not have.


              Cart.com's own homepage, as accessed in June 2026, still cites 14 omnichannel warehouses and 8.5 million
              square feet of fulfillment space and 70 million+ orders per year -- figures that look stale next to the
              company's own May 2025 press release describing an 18-facility, 10-million-square-foot network. That
              internal inconsistency is a caution against treating any single Cart.com-published scale figure as current
              without a fetch-date check.
