  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key assumptions
      - Valuation / return logic
      - Key risks / downside triggers
      - Probability signal
    rows:
      - - Bear
        - >-
          Revenue is closer to the low third-party estimate, fulfillment economics dominate, and any new round resets
          below prior private marks.
        - >-
          $0.9B-$1.2B; secondary-style downside or lower public-comp treatment would leave little room for attractive
          new-money returns from a $1.6B entry.
        - Verified participating preferences, revenue below about $250M, customer concentration, or a down-round.
        - Material and cannot be dismissed because the 2024 secondary signal already touched this zone.
      - - Base
        - >-
          Revenue is meaningfully above the low estimate, software mix is real but not dominant, and the market grants a
          blended 4x-6x revenue multiple.
        - >-
          $1.2B-$1.8B; current price is only fair if economics are better than low-end public bears assume, but not
          elite enough for a Shopify-style premium.
        - Weak margins, heavy debt drag, or evidence that scale came mostly from lower-quality logistics volume.
        - Most supportable zone on current public evidence.
      - - Bull
        - >-
          Revenue is nearer $500M, software and AI tools carry strong attach and retention, and new capital is clean
          rather than structure-heavy.
        - >-
          $2.0B-$3.0B; $1.6B becomes an attractive entry only if Cart.com is materially more software-like than the
          public file currently proves.
        - Failure to convert AI and workflow claims into audited segment economics.
        - Plausible but under-evidenced until audited numbers arrive.
      - - Entry discipline today
        - No new primary or secondary position unless price or disclosure improves.
        - At $1.6B, the return case depends on facts the company has not yet made public.
        - Chase risk is high because the upside case needs both revenue scale and clean structure.
        - Best viewed as a monitoring discipline rather than a valuation scenario.
    notes: >-
      Ranges are analytical estimates in USD billions, not management guidance. They are deliberately broad because the
      public record does not disclose audited revenue, margin, or capital-stack mechanics.
