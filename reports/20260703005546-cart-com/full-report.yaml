        title: Funding history, valuation, and capital structure
        blocks:
          - type: paragraph
            body: >-
              Cart.com's disclosed financing history runs from an approximately $20 million seed round from Bearing
              Ventures through at least seven subsequent named rounds and one major debt facility. Mercury Fund and
              Arsenal Growth co-led a $25 million Series A in April 2021 (total funding to $45 million); Oak HC/FT led a
              $98 million Series B that August (total to $143 million); Legacy Knight Capital Partners led a $240
              million equity-and-debt round in February 2022 (total to $380 million) alongside 400%-plus reported
              revenue growth; and a $60 million Series C in June 2023 made Cart.com a unicorn at a $1.2 billion
              valuation. A further $25 million Series C extension and a $105 million BlackRock term loan followed in
              2024, then a $73.7 million Series C add-on and a separate $50 million raise in April-May 2025 pushed the
              valuation to $1.6 billion, with the company's own release citing $475 million raised since founding. A
              $180 million growth-equity round led by Springcoast Partners closed in March 2026, which Houston
              InnovationMap reported pushed cumulative funding past $1 billion -- a figure that conflicts with both the
              company's own $475 million disclosure and Tracxn's separately aggregated $735 million total, and with a
              lower $413 million estimate from third-party estimator Getlatka. No updated valuation was disclosed
              alongside the March 2026 round, so $1.6 billion (May 2025) remains the latest confirmed figure.
