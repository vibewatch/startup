  - id: FU004
    title: Named-customer and headline-count persistence proxy
    type: cohort
    layout: standard
    summary: >-
      A two-point persistence proxy -- not a true churn-adjusted retention curve -- comparing each item's original
      disclosure against its most recent 2026 re-confirmation.
    data:
      columns:
