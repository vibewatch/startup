  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Substitution Map
        blocks:
          - type: paragraph
            body: >-
              Cart.com does not have a single direct competitor; it occupies a middle position between software-only
              commerce platforms and fulfillment-only 3PLs, while also facing indirect substitution from
              marketplace-embedded logistics such as Amazon's Multi-Channel Fulfillment (MCF) and FBA. Four realistic
              competitive layers emerge from the evidence: software-first SaaS incumbents (Shopify, BigCommerce, VTEX)
              that sell storefront and order-management software but generally do not own warehouses; fulfillment-first
              third-party logistics providers (Stord, ShipBob, Radial, Deposco, Cin7) that own or orchestrate physical
              fulfillment but have thinner native commerce-software layers; the marketplace-embedded status quo, where a
              brand simply uses Amazon MCF/FBA instead of buying any independent platform; and
              EDI/marketplace-operations incumbents (SPS Commerce, Rithum) that connect brands to retailers' supply
              chains without operating storefronts or warehouses themselves. Cart.com's stated bet is that bundling
              software, marketplace management, and owned fulfillment into one contract is more valuable than assembling
              the same capability from several vendors, a thesis this chapter tests against each layer in turn.
            claimRefs:
              - CP001
              - CP046
              - CP047
          - type: table
            tableRef: TP001
            claimRefs: []
          - type: figure
            figureRef: FP001
            claimRefs:
