              - CV017
              - CV045
      - number: '8.3'
        title: Scenario analysis and comparable set
        blocks:
          - type: paragraph
            body: >-
              Cart.com's current mark only looks conservative under a specific revenue-and-quality view. If the low
              third-party estimate from GetLatka is even directionally right at roughly $175 million of revenue, the
              2025 $1.6 billion mark implies about 9.1x revenue before any adjustment for debt, cash, or structure. If
              the business is already closer to $500 million of annual revenue, the same mark compresses to about 3.2x
              and starts to look far more defensible. The public comp set is wide enough to keep both stories alive.
              Shopify remains a premium software benchmark at about 12.29x EV/Sales, VTEX sits much lower at about
              2.08x, and Commerce.com trades near 0.78x with weaker profitability and leverage. Private references do
              not close the gap cleanly, but they help frame the lane: Stord reached $3 billion in 2026, ShipBob is
              tracked around $1.4 billion, and Flexport's own aggregator page is so internally inconsistent that it is
              best treated as a warning on data quality rather than as a precise benchmark. The downside analogs also
              matter. Quiet Logistics was shut down and partially transferred to Stord, while bpost's North American
              e-fulfillment business absorbed contract terminations and one-off charges. Those cases argue against
              granting Cart.com an unconditional pure-software multiple while the revenue mix, margins, and retention
              profile remain undisclosed. That is why the scenario ranges stay deliberately broad and why the burden of
              proof sits with the company rather than with the comp sheet.
            claimRefs:
