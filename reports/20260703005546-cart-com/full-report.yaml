  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Decision flow from real company proof through missing economic proof to a research-more / track conclusion.
    data:
      nodes:
        - id: mark
          label: Credible private mark
          detail: $1.6B in May 2025; $180M more in Mar 2026
        - id: proof
          label: Operational proof
          detail: Software + logistics model with named enterprise customers
        - id: opacity
          label: Economic opacity
          detail: Revenue, margin, dilution, and preferences remain under-disclosed
        - id: comp
          label: Wide comp band
          detail: 0.8x to 12.3x public EV/Sales references
        - id: track
          label: Research-more / Track
          detail: Worth following, not yet cheap enough for conviction
        - id: hold
          label: Conditional hold
          detail: Existing holders can wait only if structure proves clean
      edges:
        - from: mark
          to: proof
          label: is supported by
        - from: proof
          to: opacity
          label: but offset by
        - from: opacity
          to: comp
          label: forcing
        - from: comp
          to: track
          label: for new money
        - from: comp
          to: hold
          label: for current holders
    approximationNotes: >-
      This flow compresses the chapter into the gating questions that matter most: whether Cart.com is software-like
      enough and whether the capital stack is clean enough to make the current price attractive.
    claimRefs:
      - CV001
      - CV002
      - CV021
      - CV040
      - CV041
      - CV045
      - CV046
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Implied revenue multiple at the $1.6B headline mark under different annual-revenue assumptions.
    data:
      items:
        - label: $175.2M revenue
          value: 9.1
          detail: Low third-party estimate from GetLatka implies a premium multiple.
        - label: $250M revenue
          value: 6.4
          detail: Still rich unless economics are software-like.
        - label: $350M revenue
          value: 4.6
          detail: Begins to look fair for a blended commerce infrastructure model.
        - label: $500M revenue
          value: 3.2
          detail: Supportable if Cart.com is already far larger than low-end public estimates.
        - label: $700M revenue
          value: 2.3
          detail: Would make the current mark look conservative, but no public evidence proves this scale today.
      yAxis:
        label: Implied revenue multiple at $1.6B
    approximationNotes: >-
      Values are simple price-to-revenue sensitivities, not management guidance. They use the May 2025 $1.6B post-money
      anchor and illustrative revenue cases.
    claimRefs:
      - CV016
      - CV017
      - CV045
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Supportable valuation bands on current public evidence.
    data:
      items:
        - label: Bear
          low: 900
          mid: 1050
          high: 1200
          detail: Secondary-like downside or lower public-comp treatment.
        - label: Base
          low: 1200
          mid: 1500
          high: 1800
          detail: Blended hybrid multiple with better-than-bear but still opaque economics.
        - label: Bull
          low: 2000
          mid: 2400
          high: 3000
          detail: Requires much higher revenue and cleaner software-like economics than the public file proves.
        - label: Current headline
          low: 1600
          mid: 1600
          high: 1600
          detail: May 2025 post-money anchor to test against the scenario bands.
    approximationNotes: >-
      Values are USD millions. The bands are scenario-based and intentionally broad because the public record does not
      disclose audited revenue, segment margin, or verified dilution terms.
    claimRefs:
      - CV042
      - CV043
      - CV044
      - CV045
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style snapshot of the facts that most directly affect the price debate.
    data:
      items:
        - label: Latest disclosed post-money
          value: '1600'
          unit: USD M
          detail: May 2025 company-stated valuation.
        - label: Adverse secondary mark
          value: '902'
          unit: USD M
          detail: 2024 Prime Unicorn adjusted valuation signal.
        - label: Low public revenue estimate
          value: '175.2'
          unit: USD M
          detail: GetLatka 2025 revenue figure.
        - label: Current customer claim
          value: 6000+
          detail: Homepage states over 6,000 customers worldwide.
        - label: Public comp band
          value: 0.8x-12.3x
          detail: Commerce.com to Shopify EV/Sales range.
        - label: Capital-stack transparency
          value: Low
          detail: Preference terms are not verified in public primary docs.
        - label: Exit-window quality
          value: Low
          detail: Secondaries are active, but broad venture exits are still weak.
    approximationNotes: >-
      This scorecard mixes disclosed facts with analytical quality labels. It is meant to frame the IC debate, not to
      replace detailed underwriting.
    claimRefs:
      - CV001
      - CV012
      - CV016
      - CV021
      - CV023
      - CV033
      - CV045
