        title: Expansion drivers and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Cart.com's expansion since 2024 has been substantially acquisition-led: the Amify deal added 50-plus
              Amazon marketplace-seller brands in April 2024, and the OceanX deal added 25-plus celebrity and beauty
              brands in December 2024, both inheriting existing customer rosters rather than winning them through
              Cart.com's own new-logo sales motion [CU012][CU018][CU035]. This inheritance pattern introduces a distinct
              concentration and retention risk: acquired customers may carry pre-existing loyalty to the acquired
              operating company rather than to Cart.com itself, and no source discloses post-acquisition retention rates
              for either cohort. A second concentration vector is channel dependence -- both the Amify and Foundry
              Brands marketplace-seller mandates route customer value through Amazon specifically, meaning policy or fee
              changes at the platform level sit outside Cart.com's control [CU015][CU017]. A third vector is portfolio
              concentration: the Authentic Brands Group relationship represents one contracting counterparty spanning an
              unspecified number of underlying licensed brands, so a single renewal decision could disproportionately
              affect Cart.com's reported brand-count metrics [CU021][CU034]. Finally, the flat 6,000-plus headline
              customer count alongside GMV growth from roughly $8 billion to over $10 billion between mid-2024 and 2026
              is consistent with either upsell-driven expansion within existing accounts or an unrefreshed
              customer-count disclosure -- Cart.com does not disclose which, and no source reviewed provides a
              top-customer concentration percentage to size this risk directly [CU032][CU033][CU034].
