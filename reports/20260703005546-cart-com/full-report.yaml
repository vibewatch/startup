  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: unified commerce is a bundle of adjacent spend pools, not one category'
        blocks:
          - type: paragraph
            body: >-
              Cart.com describes itself as a unified commerce and logistics provider that lets B2C and B2B brands
              synchronize listings, pricing, inventory, and orders across storefronts, marketplaces, and social channels
              while a nationwide U.S. fulfillment network handles physical execution. That self-description spans at
              least four distinct spend pools that analysts size separately: ecommerce enablement software
              (OMS/PIM/storefront sync), outsourced 3PL/fulfillment services, marketplace management and growth
              marketing, and customer engagement/support. Cart.com's own homepage frames these as modular — brands can
              buy fulfillment alone, software alone, or the full "360 Managed Commerce" bundle — which matters because
              it means Cart.com competes against pure-play software vendors, pure-play 3PLs, and full-service agencies
              simultaneously rather than against a single competitor set. The boundary explicitly excludes categories
              Cart.com does not monetize: long-haul freight/trucking carriage, card-network payment economics, and
              generic ERP/finance software unrelated to commerce operations. A notable 2026-specific addition to the
              boundary is trade-policy-driven reshoring: Cart.com's own marketing now highlights helping "nine-figure
              brands reshore millions of units within days amid evolving trade policy," which ties its U.S. warehousing
              model directly to the de minimis and tariff shifts described in Section 4. The practical takeaway is that
              Cart.com's addressable market should be evaluated as a bundle of adjacent, separately-sized categories
              rather than as one broad "ecommerce market" number, because a single blended TAM would overstate the
              software opportunity and understate the capital-intensive logistics opportunity.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
              - CM048
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
