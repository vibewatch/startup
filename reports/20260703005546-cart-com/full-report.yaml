      - number: '5.2'
        title: Architecture, integration surface, and the operating model behind the stack
        blocks:
          - type: paragraph
            body: >-
              The architecture Cart.com publishes is layered rather than monolithic. OMS is the orchestration layer that
              synchronizes orders and inventory and applies routing logic across channels and destinations. WMS and TMS
              then execute inside the network through receiving, put-away, picking, packing, shipping, returns, labor,
              and carrier-rate decisions. On top of that sits a storefront and B2B buying layer, while underneath it
              sits physical automation such as ASRS systems, conveyors, shuttles, and goods-to-person robotics. That
              makes the product architecture credible as a hybrid software-plus-operations platform, not merely a
              marketing diagram stapled onto a 3PL.


              The integration surface appears real but only partially transparent. Cart.com repeatedly calls the stack
              API-first, and API Tracker lists public docs, webhooks, OAuth tools, playgrounds, and machine-readable
              specs. But the fetched official developer pages were sparse in readable text, and API Tracker's endpoint
              directory did not enumerate actual APIs at access time. In practice, that means public evidence supports
              an integration posture and developer surface, yet still stops short of giving an external diligence team a
              clean endpoint-level map. The architecture is therefore more verified at the business-process layer than
              at the external developer-experience layer.
