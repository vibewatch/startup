      - number: '8.2'
        title: Financing context, capital stack, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The main valuation problem is not lack of market activity; it is lack of reconciled economics and terms.
              SEC Form D filings prove that Cart.com has repeatedly raised capital, but they also highlight how headline
              round narratives can obscure actual proceeds. The 2025 Form D/A showed $73.68 million sold against an
              $81.25 million offering shortly after the company publicly described a $50 million round, and the December
              2024 Form D sits immediately before that May 2025 press release. Public funding totals are even noisier:
              the company said $475 million raised by May 2025, InnovationMap later cited CB Insights for $872 million
              before the 2026 round, Tracxn says $735 million, Premier Alternatives says $936 million, GetLatka says
              $413 million, and Forge shows $608.57 million. That spread matters because dilution, stack depth, and
              preference overhang all depend on how much money has actually been raised and on what terms. Forge is
              directionally useful because it surfaces round-by-round preference fields and warns users that its marks
              may rely on limited inputs and may not represent market price. Vaquill's 2026 preference math is the right
              lens for interpreting that uncertainty: if participating or greater-than-1x preferences exist in the
              stack, middling exit values can destroy common-equity returns even when the headline valuation still looks
              respectable. Entry discipline therefore has to be harsher than the financing headlines suggest.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV035
              - CV036
              - CV037
              - CV049
          - type: figure
