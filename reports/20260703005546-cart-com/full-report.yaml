  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk severity overview
        blocks:
          - type: paragraph
            body: >-
              Cart.com's risk profile is best read across four structural categories -- regulatory/legal,
              operational/quality/security, partner/dependency, and people/execution -- each made harder to size than at
              a comparable public company because Cart.com is privately held and largely self-discloses its own metrics.
              The single highest-severity, least-mitigated risk in this chapter sits at the intersection of two facts
              that cannot be reconciled from public sources: an active federal breach-of-contract lawsuit (Lubic v.
              Cart.com, Inc., No. 4:25-cv-04809, still in active discovery as of a March 2026 Rule 26(f) report) and a
              complete absence of disclosed cash runway or burn rate. Without a known liquidity cushion, no other risk
              in this register -- litigation exposure, carrier-cost inflation, platform-concentration, or debt-covenant
              risk -- can be weighed against the company's actual capacity to absorb a shock. Growth has been built
              substantially through at least eight acquisitions since the company's 2020 founding (AmeriCommerce, Cheap
              Cheap Moving Boxes, The DuMont Project, Sauceda Industries, FB Flurry, SellerActive, OceanX, and Amify),
              which concentrates execution risk in integration quality across a growing set of acquired teams and
              systems rather than in a single product or technology dependency. The risk heatmap below (Figure FR001)
              summarizes likelihood, severity, mitigation maturity, and residual severity across the eight risks this
              chapter treats as highest-priority.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR035
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR009
              - CR011
              - CR015
              - CR017
              - CR025
              - CR032
              - CR035
      - number: '7.2'
        title: Regulatory / legal risk
        blocks:
          - type: paragraph
            body: >-
              Cart.com, Inc. is an active defendant in a breach-of-contract lawsuit (Lubic v. Cart.com, Inc., No.
              4:25-cv-04809, U.S. District Court, S.D. Texas, Houston Division), filed October 8, 2025 and still
              proceeding through discovery as of a Second Amended Complaint (March 30, 2026) and a Rule 26(f) planning
              report (March 2, 2026); no docket entry discloses a damages figure, reserve, or settlement status.
              Separately, California's Warehouse Quotas law (AB 701) requires warehouse employers to give workers
              written notice of any productivity quota and bars quotas that prevent compliance with meal, rest,
              bathroom, or safety requirements -- and the statute has real enforcement teeth: California's Labor
              Commissioner cited Amazon.com Services, LLC nearly $5.9 million in 2024 for 59,017 violations across two
              Southern California warehouses. No source reviewed confirms whether any of Cart.com's 17-18 disclosed
              fulfillment facilities sit in California, leaving this precedent unconverted into a company-specific
              exposure estimate. Trade-policy risk is dual-sided and current: the U.S. suspended the de minimis customs
              exemption for commercial shipments globally effective August 29, 2025, while the EU will apply a temporary
              flat handling fee (EUR 2-3 per parcel) on low-value imports through at least 2026, with neither Cart.com's
              cross-border shipment mix nor its cost-pass-through policy disclosed. California's CCPA/CPRA, as amended
              effective January 1, 2026, adds data-broker and automated-decision-making-technology disclosure
              obligations that Cart.com's Terms of Service does not specifically address.
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR009
              - CR011
              - CR012
              - CR014
      - number: '7.3'
        title: Operational / quality / security risk
        blocks:
          - type: paragraph
            body: >-
              Cart.com does not disclose which cloud-hosting provider powers its commerce and fulfillment technology
              stack, or what multi-region or multi-cloud resiliency architecture it maintains -- a material gap given
              that a major AWS outage on October 20, 2025 knocked out access to numerous high-traffic sites and apps for
              hours, illustrating the systemic fragility a single-cloud dependency can create. On data security,
              Cart.com's own Terms of Service commits only to 'commercially reasonable' safeguards -- language that
              falls short of a warranty -- with a 30-day cure period before a failure becomes a breach of contract, and
              no source identifies a current SOC 2 Type II or PCI DSS attestation despite the company processing payment
              and commerce data for enterprise clients. The same Terms of Service excludes liability for 'any acts,
              omissions, or failures of a courier' and caps aggregate liability at the greater of $100 or six months of
              fees, shifting most courier-failure risk contractually onto the customer rather than eliminating it
              operationally. On cost, UPS and FedEx implemented 2026 general rate increases averaging just under 5.9%,
              with disproportionately larger surcharge increases on oversized, additional-handling, and residential
              deliveries. TrustRadius reviews of Cart.com's platform in 2026 include recurring complaints about
              implementation timelines and integration issues alongside positive account-support feedback, and a broader
              wave of logistics- and manufacturing-sector layoffs and bankruptcies (including Quiet Logistics' shutdown
              of American Eagle's dedicated fulfillment operations) hit the U.S. in early 2026, evidencing sector-wide
              operational stress among 3PL-adjacent operators.
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
          - type: table
            tableRef: TR002
            claimRefs:
              - CR015
              - CR017
              - CR019
              - CR020
      - number: '7.4'
        title: Partner / dependency risk
        blocks:
          - type: paragraph
            body: >-
              Amazon is the dominant marketplace channel underlying Cart.com's Amify subsidiary, which the company
              acquired in April 2024 specifically to strengthen Amazon-marketplace-management capabilities; Marketplace
              Pulse estimates Amazon's U.S. third-party marketplace sales at roughly $300 billion, more than seven times
              eBay's. Amazon's 2026 seller-enforcement approach relies more heavily on AI-driven detection, with sellers
              reporting shorter appeal windows and higher rejection rates than in prior years -- a policy-enforcement
              risk that could disrupt revenue for any Amazon-dependent client Amify manages, though no source discloses
              what share of Cart.com's revenue or client base this concentration actually represents. Shopify is a
              second major platform dependency: its global GMV reached roughly 66% of Amazon's marketplace GMV in 2025
              (up from about 40% in 2020), it suffered an hours-long Cyber Monday outage on December 1, 2025, and its
              own 2019-2023 history of building then fully divesting an owned-fulfillment network (to Flexport, with a
              roughly 20% workforce cut) is a direct precedent for the capital intensity and reversibility risk inherent
              in the owned-fulfillment model Cart.com itself operates. On the capital side, Cart.com secured a $105
              million BlackRock-managed term loan in July 2024 and closed a $180 million Springcoast Partners-led
              growth-equity round in March 2026, showing continued institutional access but concentrating refinancing
              risk in a small number of counterparties whose covenant and rate terms are not public. National parcel
              carriers UPS, FedEx, and USPS remain the last-mile subcontractors whose 2026 rate increases compress
              margin for both Cart.com and its clients.
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
          - type: table
            tableRef: TR003
            claimRefs:
              - CR025
              - CR026
              - CR029
              - CR030
              - CR032
          - type: figure
            figureRef: FR003
            claimRefs:
              - CR016
              - CR025
              - CR026
              - CR030
              - CR032
      - number: '7.5'
        title: People / execution risk
        blocks:
          - type: paragraph
            body: >-
              Founder-CEO Omair Tariq is the sole public figure quoted across nearly every funding, acquisition, and
              leadership announcement reviewed across this report, indicating concentrated key-person dependence
              relative to Executive Chairman Jim Jacobsen's lower public profile and with no disclosed succession plan.
              Cart.com made three senior external executive hires within a five-month span in 2025 -- a Chief Marketing
              Officer (August), a Chief Revenue Officer (September), and a Chief Technology Officer (October, Arjun
              Sainath, previously Corporate Vice President of Platform Engineering at Blue Yonder) -- concentrating
              near-term execution risk in a newly assembled leadership team with no disclosed tenure track record at the
              company, even though the new CTO's enterprise platform-engineering background is a credible mitigant.
              Headcount itself cannot be reconciled: the company's own December 2024 acquisition release stated Cart.com
              had grown to more than 1,600 team members, while Tracxn's independently tracked employee count shows only
              878 as of 2026 -- roughly half the company-disclosed figure. A 2023 round of layoffs was reported
              following the company's Austin office expansion, but no 2025-2026 layoffs or WARN Act notice were
              identified in the sources searched, leaving the current workforce trend impossible to corroborate against
              the headcount gap. Springcoast Partners operating partner Russell Klein joined the board with the March
              2026 financing, bringing prior experience scaling Commerce.com/BigCommerce toward an IPO, which partially
              mitigates governance and execution-oversight risk.
            claimRefs:
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
              - CR040
              - CR041
              - CR042
          - type: table
            tableRef: TR004
            claimRefs:
              - CR035
              - CR036
              - CR038
              - CR039
      - number: '7.6'
        title: Financial / model risk and risk transmission
        blocks:
          - type: paragraph
            body: >-
              Third-party revenue estimator Growjo projects Cart.com's 2026 annual revenue at $175.2 million, an
              estimate not corroborated by any audited or company-disclosed figure, which materially limits the
              precision with which any risk in this register can be expressed as a percentage of revenue. Cart.com's
              continued capital access is nonetheless independently corroborated by both a primary-tier SEC Form D/A
              filing (May 27, 2025, reporting $73,681,890 sold against an $81,249,925 authorized offering across 13
              investors) and a named financial-advisory deal credit (FT Partners on Cart.com's Series C financing),
              though neither source discloses the BlackRock term loan's rate, maturity, or covenant terms. Risk
              transmits into Cart.com's model through three primary channels, mapped in the risk transmission figure
              (FR002): regulatory/legal risk transmits mainly through compliance cost and potential legal judgment
              charged against undisclosed cash reserves; partner/dependency risk transmits through both client-side
              revenue (marketplace-tied managed-service fees) and Cart.com's own cost structure (carrier-rate
              pass-through), so a single adverse platform or carrier event can compress margin and revenue
              simultaneously; and people/execution risk transmits indirectly into financing risk, because unresolved
              workforce- and governance-disclosure gaps reduce the confidence any future lender or equity investor can
              place in Cart.com's reported operating metrics during diligence.
            claimRefs:
              - CR043
              - CR044
              - CR045
              - CR046
              - CR047
              - CR048
          - type: figure
            figureRef: FR002
            claimRefs:
              - CR046
              - CR047
              - CR048
      - number: '7.7'
        title: Mitigation, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The Lubic v. Cart.com litigation is the clearest near-term monitorable trigger in this register: an
              adverse judgment, a settlement exceeding a material threshold, or an expansion to a class or
              multi-plaintiff action would each represent a step-change in disclosed legal exposure and should prompt an
              immediate reassessment of counterparty risk. Because no source discloses Cart.com's cash runway or burn
              rate, any additional financing round, recapitalization, or down-round announcement should be treated as
              the clearest available proxy signal for liquidity stress until the company discloses audited financials --
              and this chapter treats that liquidity-disclosure gap as its single most consequential unresolved
              question. A confirmed California DIR citation, CPPA enforcement action, or consent order naming Cart.com
              would convert this chapter's regulatory risks from precedent-based (via the Amazon AB 701 case) to
              company-specific, materially raising both severity and monitoring priority. A Cart.com-specific
              customer-facing outage exceeding several hours, or one confirmed to affect a material share of fulfillment
              volume, would distinguish an isolated incident from a systemic cloud- or platform-dependency failure of
              the kind already seen industry-wide in the 2025 AWS and Shopify outages. Any future disclosure tying a
              specific share of managed-service revenue to Amazon or Shopify would convert this chapter's
              platform-concentration risk from a qualitative flag into a quantified financing or diligence condition,
              and a confirmed workforce reduction exceeding roughly 15% of headcount in a single quarter, or a WARN Act
              filing, would resolve the current headcount ambiguity in the adverse direction and should be treated as an
              execution-risk red flag.
            claimRefs:
              - CR001
              - CR049
              - CR050
              - CR051
              - CR052
              - CR053
