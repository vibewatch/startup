          - type: callout
            title: Shopify's 2019-2023 retreat is the clearest cautionary precedent
            body: >-
              Shopify spent an estimated $2.5B+ combined building owned fulfillment (6 River Systems, Deliverr, Shopify
              Fulfillment Network) before fully divesting it to Flexport in 2023 with a 20% workforce cut -- direct
              evidence that owning fulfillment infrastructure is capital- intensive and reversible even for a cash-rich
              software incumbent, a risk Cart.com is taking on directly rather than avoiding.
            calloutType: insight
            claimRefs:
