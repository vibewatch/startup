          - type: callout
            title: Cart.com briefly lost 'unicorn' status on secondary-market data in 2024
            body: >-
              Independent secondary-market tracking (Prime Unicorn Index) shows Cart.com shares traded down 36.9% from
              the Series C reference price in early 2024, implying a valuation near $902 million versus the $1.2 billion
              Series C headline -- a real, market-priced valuation decline that predates the company's subsequent
              recovery to $1.6 billion by May 2025.
            calloutType: risk
            claimRefs:
              - CI036
              - CI037
          - type: callout
            title: Every profitability reference in company disclosures is forward-looking, not a present-tense claim
            body: >-
              Across both the July 2024 BlackRock term-loan announcement and the March 2026 Springcoast-led round, CEO
              Omair Tariq's quotes describe profitability as something the company is 'pursuing' or 'driving toward,'
              not something already achieved. Absent an audited income statement, this chapter assumes Cart.com is not
              yet consistently profitable company-wide, pending direct disclosure.
            calloutType: assumption
