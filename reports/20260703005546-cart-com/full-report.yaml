        title: Milestones, scale metrics, and adverse checks
        blocks:
          - type: paragraph
            body: >-
              Cart.com's scale story has been built substantially through acquisitions -- AmeriCommerce, Cheap Cheap
              Moving Boxes, The DuMont Project, Sauceda Industries, FB Flurry, SellerActive, OceanX, and Amify --
              layered on top of organic fulfillment-network growth. Reported customer and facility counts have stayed
