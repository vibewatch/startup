      - number: '3.2'
        title: 'Software-First Incumbents: Shopify, BigCommerce, VTEX'
        blocks:
          - type: paragraph
            body: >-
              Shopify, BigCommerce, and VTEX each sell commerce software at enterprise scale but differ sharply in how
              far they reach into physical fulfillment. Shopify built and then abandoned an owned-fulfillment ambition:
              it launched the Shopify Fulfillment Network in June 2019, acquired warehouse-robotics firm 6 River Systems
              for roughly $450 million later that year and fulfillment-tech firm Deliverr for $2.1 billion in 2022, then
              sold the entire logistics business to Flexport in May 2023 alongside a 20% workforce reduction, publicly
              framing owned fulfillment as a "side quest" rather than core strategy. BigCommerce (recently operating
              under the parent name Commerce.com while retaining ticker CMRC) and VTEX instead stay software-only and
              lean on third-party fulfillment partners, publishing transparent GMV-tiered pricing (BigCommerce) or
              enterprise subscription contracts (VTEX) rather than bundling warehousing. This makes Shopify's 2019-2023
              arc the clearest cautionary precedent for how capital-intensive and reversible an owned-fulfillment bet
              can be, even for a well-funded software incumbent, and underscores why Cart.com's bundled model carries
              execution risk that pure-software peers have chosen to avoid.
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
              - CP018
              - CP032
              - CP033
          - type: table
            tableRef: TP002
            claimRefs: []
      - number: '3.3'
        title: 'Fulfillment-First Peers: Stord, ShipBob, Radial, Deposco, Cin7'
        blocks:
          - type: paragraph
            body: >-
              A second competitive layer approaches the same problem from the opposite direction: these firms started as
              (or remain primarily) physical fulfillment or warehouse-software operators and have added
              commerce-adjacent software over time. Stord, founded in 2015, raised a $250 million Series F in 2026 at a
              $3 billion valuation (roughly double the prior year) and has made eight acquisitions in six years,
              including UPS's Ware2Go unit, to build a cloud-orchestrated warehouse network serving more than 1,000
              brands. ShipBob has raised roughly $330.5 million since founding, operates around 50 fulfillment centers
              (up from four in 2017), and has fulfilled more than one billion units to date, though independent analyst
              estimates of its valuation (roughly $1.0-1.4 billion per Sacra) diverge sharply from a reported $4 billion
              IPO target, a discrepancy this chapter flags rather than resolves. Radial, descended from eBay
              Enterprise/Innotrac and owned by Belgian postal group bpost since 2017, serves large apparel and beauty
              brands with historically 7,000-plus employees. Deposco and Cin7 sell warehouse/inventory-management
              software without owning physical fulfillment networks themselves. None of these peers combines owned
              fulfillment with a native storefront/marketplace-management software layer as tightly as Cart.com claims
              to, but each is scaling fast enough in its own lane to erode the assumption that bundling is structurally
              necessary.
