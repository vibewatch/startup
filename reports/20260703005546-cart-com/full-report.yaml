      - number: '3.6'
        title: Moat Durability and Adverse-Risk Register
        blocks:
          - type: paragraph
            body: >-
              Cart.com's core competitive claim -- bundling storefront software, marketplace/channel management, and
              owned fulfillment infrastructure into a single contract -- is a moat that each adjacent layer erodes only
              partially: fulfillment-only 3PLs like Stord and ShipBob are scaling their own software layers,
              software-only platforms like Shopify and BigCommerce lean on wide app-partner ecosystems to approximate
              integration, and Amazon MCF offers a no-commitment substitute for brands unwilling to sign a multi-year
              platform contract. Adverse and durability signals worth tracking include Shopify's Flexport divestiture as
              evidence that owned fulfillment is reversible even for a cash-rich incumbent, a December 1, 2025 Shopify
              platform outage that disrupted point-of-sale and admin logins and moved its stock down 5.9% (illustrating
              platform-reliability risk industry-wide), and Pattern's 94%-Amazon revenue concentration as a cautionary
              case of channel dependency. Public enterprise peers VTEX and SPS Commerce disclose audited, growing
              revenue (VTEX Q1 2026 GMV up 17.1% year over year; SPS Commerce FY2025 revenue up 18% year over year, its
              100th consecutive quarter of growth) that gives investors a transparency benchmark Cart.com's undisclosed
              private financials cannot yet match. No material Cart.com-specific adverse events (lawsuits, mass layoffs,
              security incidents) surfaced during this research pass, but independent customer-review data (G2,
              Trustpilot) was inaccessible, leaving a gap in Cart.com-specific customer-sentiment evidence that this
              chapter discloses rather than papers over.
