      - number: '3.5'
        title: Lock-In, Distribution Reach, and Partner Access
        blocks:
          - type: paragraph
            body: >-
              Distribution reach differs by design across this landscape. Pattern Inc., which IPO'd on Nasdaq in
              September 2025 pricing shares at $14 to raise $300 million, operates an inventory-buying
              ecommerce-accelerator model across marketplaces including Amazon, Alibaba, TikTok Shop, Walmart, Coupang,
              and Mercado Libre, but roughly 94% of its 2024 revenue came from Amazon alone, concentrating its
              distribution reach on a single retail channel it does not control. SPS Commerce, by contrast, connects
              more than 50,000 subscribing customers to retailer EDI networks processing over $650 billion in GMV
              annually, and Rithum (formerly CommerceHub and ChannelAdvisor, taken private for $1.1 billion in 2018 and
              rebranded in 2023) operates a partner network spanning brands, retailers, and marketplaces for listing,
              inventory, and drop-ship integrations. VTEX's own disclosures show an internal inconsistency worth
              flagging: its investor-relations page states approximately 2,200 customers and 3,100 stores across 44
              countries for FY2025, while its public marketing homepage claims "3,500+ Enterprise customers" and 43
              countries -- two official VTEX sources that do not agree on the same headline metric. Cart.com's own
              customer roster (TOMS Shoes, PacSun, Janie and Jack) demonstrates real enterprise traction, but the
              company has not disclosed subscriber counts or GMV processed at the scale SPS Commerce or VTEX publish,
              making direct scale comparison difficult.
            claimRefs:
              - CP029
