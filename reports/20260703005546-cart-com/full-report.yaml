      - number: '8.4'
        title: Liquidity, exit readiness, thesis-breaks, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The exit question is less about whether Cart.com could eventually be public-company-ready and more about
              how holders get paid before then. CB Insights says global exits hit an almost two-year low in Q1 2026
              while private-company secondaries kept filling the gap, which fits Cart.com's current situation better
              than an IPO-forward narrative does. Cart.com's March 2026 board addition of Russell Klein signals ambition
              and some go-public pattern recognition, but the same release described the round as balance-sheet
              strengthening and support for sustainable profitability, which is not the language of a company already
              harvesting fully proven economics. The thesis therefore breaks on concrete events, not on vibes: a
              financing below roughly $1.2 billion, verified participating or stacked preferred terms, revenue below
              about $250 million, or evidence that fulfillment economics dominate software-style margin generation would
              all push the company out of the premium bucket. The final diligence asks are correspondingly mechanical:
              audited 2025-2026 revenue and gross margin by segment, debt and covenant detail, current share count,
              preferred-stock rights, customer concentration, and live secondary-market depth. Until those are
              available, the chapter can support continued tracking and disciplined holding for insiders, but not a
              fresh high-conviction buy at the current headline mark.
            claimRefs:
