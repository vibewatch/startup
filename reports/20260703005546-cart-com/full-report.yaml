      - number: '2.4'
        title: Growth drivers, constraints, and the sizing questions that remain open
        blocks:
          - type: paragraph
            body: >-
              Three forces favor Cart.com's model in 2026. Platform consolidation is real and measurable: a Q1 2026
              crawl of one million domains found Shopify (including Plus) now powers 42.6% of identified ecommerce
              stores (up 10.8 percentage points since 2022) while Magento/Adobe Commerce fell to 8.4% (down 10.2 points)
              — churn that creates a recurring pool of brands re-platforming and needing new operational partners.
              Marketplace proliferation adds channel complexity that favors unification tools. And the collapse of the
              $800 de minimis exemption — suspended for China on May 2, 2025, and for all countries on August 29, 2025 —
              directly favors bulk-import, U.S.-warehoused fulfillment models over direct-from-factory dropshipping;
              brands that adjusted pricing within 90 days preserved about 85% of pre-tariff margin, while slower movers
              saw 8-15 points of permanent erosion. But two constraints cut the other way. The 3PL sector is in real
              distress — American Eagle is discontinuing its Quiet Logistics business entirely, with Stord absorbing the
              Dallas facility, and 2025-2026 has seen a wave of logistics bankruptcies attributed to pandemic-era
              overcapacity and tariff-driven cost surges — meaning Cart.com competes in a sector where financial
              fragility, not just growth, is a live risk to counterparties and acquisition targets alike. Separately,
              AI/agentic automation is a genuine differentiator only if executed: Stord's own 2026 survey found 88% of
              organizations report some AI use but only 7% are "fully scaled," and agentic adoption in fulfillment
              remains under 1% of stores today. Several questions stay open rather than resolved: no source isolates
              Cart.com's own SAM/SOM, revenue, or GMV in audited form; no source directly compares Cart.com's
              capacity-absorption from failed 3PL peers; and no adverse public evidence (layoffs, disputes, customer
              losses) was found for Cart.com itself, which likely reflects the absence of public disclosure obligations
              for a private company rather than confirmed clean execution.
