      - number: '4.4'
        title: Public financial gaps, GTM signals, and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Every core underwriting input in this chapter is either undisclosed, self-reported, or contested across
              sources. No reviewed source -- SEC filing, press release, interview, or third-party tracker -- discloses
              Cart.com's cash on hand, monthly burn, runway, gross margin, EBITDA, net income, take rate by revenue
              line, customer concentration, or the terms of its BlackRock credit facility. Lifetime funding totals range
              from a company-stated $475 million (May 2025) to a CB Insights-sourced $872 million cited by local press
              just before the March 2026 round, to $735-$771 million from Tracxn and Growjo -- a spread of several
              hundred million dollars with no shared methodology to reconcile it.


              The financial verdict is therefore constrained less by the quality of Cart.com's underlying business than
              by the quality of its public disclosure. The company shows real, independently corroborated scale (GMV
              growth from roughly $5 billion in 2022 to more than $8 billion by 2024, a widening logistics footprint,
              named enterprise customers such as Authentic Brands Group, TOMS Shoes, PacSun, and Janie and Jack) and
              real access to institutional capital (BlackRock, Neuberger Berman, PayPal Ventures, and now Springcoast
              Partners across multiple rounds). Board additions such as Russell Klein, who helped scale
              Commerce.com/BigCommerce from $30 million to more than $350 million in ARR before its IPO, signal an
              intent to professionalize toward public-company-grade financial discipline. But until Cart.com discloses
              audited revenue, margin, cash, and debt-covenant detail, any valuation or credit view rests on reconciling
              conflicting public estimates rather than on verified financial statements, and the repeated pattern of
              "pursuing sustainable profitability" language across two separate 2024-2026 financing announcements should
              be read as the company's own signal that profitability is a forward goal, not a disclosed present fact.
