    layout: standard
    summary: >-
      Public maturity evidence is strongest where modules have both current product pages and concrete release or
      deployment proof.
    data:
      columns:
        - Commercial maturity
        - Public deployment proof
        - Roadmap transparency
        - Implementation friction
      rows:
        - label: OMS
          values:
            - label: 'High: current product page plus 2024 standalone launch'
            - label: 'Moderate: launch evidence and product claims, but few named external software references'
            - label: 'Low-to-moderate: launches are visible, ongoing changelog is not'
            - label: 'Unknown-to-moderate: official quick-deploy claim but no public duration benchmark'
        - label: WMS / TMS
          values:
            - label: 'High: current product pages plus 2024 standalone coverage'
            - label: 'Moderate: Pacsun and Cart-run network proof operations depth'
            - label: 'Low: no public ongoing release log reviewed'
            - label: 'Moderate: deployment likely heavier because software is tied to facilities'
        - label: AmeriCommerce / B2B storefront
          values:
            - label: 'Moderate-to-high: live product pages and reviews show long-lived capability set'
            - label: 'Moderate: review and product proof exist, but recent named deployments are sparse'
            - label: 'High for storefront changes: 2026.2 release details are concrete'
            - label: 'Moderate: setup complexity and integration gaps appear in reviews'
        - label: Marketplace and managed services
          values:
            - label: 'Moderate: customer proof and acquisitions show live capability, but lineage is acquisition-led'
            - label: 'Moderate: Authentic and Amify proof, limited public KPI depth'
            - label: 'Low: no public feature changelog reviewed for these services'
            - label: 'Moderate-to-high: depends on people, process, and post-acquisition integration'
    approximationNotes: null
    claimRefs:
      - CE006
      - CE016
      - CE036
      - CE038
      - CE039
      - CE043
      - CE049
      - CE050
  - id: FU001
    title: 'Customer journey map: discovery to expansion loop'
    type: journey-map
    layout: wide
    summary: >-
      Named customer relationships progress from segment-fit discovery through operational transition, production use,
      public reference, and back into a new-logo expansion loop.
    data:
      nodes:
        - id: discovery
          label: Discovery & fit assessment
          description: >-
            Buyer segment identified (enterprise omnichannel brand, brand-licensing portfolio, beauty/wellness brand,
            Amazon marketplace seller, or public-sector agency) via inbound inquiry or an acquired company's existing
            roster.
        - id: transition
          label: Facility / channel transition
          description: >-
            Operational handoff begins, e.g. PacSun's Groveport, Ohio facility management transitions to Cart.com, or a
            marketplace-seller brand's Amazon advertising and operations are handed to Cart.com/Amify or
            Cart.com/Foundry Brands.
        - id: production
          label: Production operation
          description: >-
            Relationship is live and operating at scale: automated sortation/conveyance in named distribution centers,
            ongoing Amazon channel management, or merchant-of-record services for a licensed brand portfolio.
        - id: proof
          label: Public reference / case study
          description: >-
            Relationship becomes citable customer proof via a press release, newsroom post, or customer-side
            confirmation, such as Authentic Brands Group's own corporate press page.
        - id: expansion
          label: Expansion loop
          description: >-
            Published case studies and named references, such as the 2024 Amify roster, appear to support new
            marketplace-seller wins like Foundry Brands' March 2026 mandate, feeding the next discovery stage.
    claimRefs:
      - CU009
      - CU012
      - CU015
      - CU018
      - CU021
      - CU037
  - id: FU002
    title: Adoption / deployment evidence funnel
    type: funnel
    layout: standard
    summary: >-
      Counts named customer relationships by evidentiary depth reached during this research pass -- an evidence-strength
      funnel, not a disclosed sales-conversion funnel.
    data:
      items:
        - label: Named public customer relationships identified (2023-2026)
          value: 8
          unit: relationships
        - label: Relationships with independent (non-Cart.com) corroboration
          value: 4
          unit: relationships
        - label: Relationships with a direct customer-side or named-executive quote
