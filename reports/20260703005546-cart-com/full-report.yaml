    approximationNotes: >-
      These are NOT churn-adjusted retention percentages. Each row is a binary persistence proxy: 100 means the named
      customer or headline count was still referenced/disclosed as of the later date, 0 would mean it had dropped out of
      subsequent materials. Cart.com discloses no cohort-level, NRR, or GRR retention curve; see the related
      evidenceGap.
