      - number: '5.4'
        title: Differentiation, trust controls, and the main product-technology gaps
        blocks:
          - type: paragraph
            body: >-
              Cart.com's differentiation is clearest against two comparison sets. Against a pure 3PL, the advantage is
              proprietary software wrapped around the network: OMS, WMS, TMS, inventory logic, dynamic rate shopping,
              and automation are presented as part of the same system rather than bolt-ons. Against a pure storefront
              SaaS platform, the advantage is the opposite direction of extension: Cart.com adds marketplace services,
              merchant of record, customer support, payments administration, and fulfillment operations around the
              software. That breadth is a real strategic asset because it lets Cart.com own more of the merchant
              workflow and more of the failure points that hurt conversion or delivery.


              The trust and control picture is more mixed. Official pages make meaningful claims about ISO/NIST/Zero
              Trust alignment, accessibility work, and managed-commerce controls such as tax collection, fraud
              prevention, and chargeback handling. But the reviewed public corpus did not provide an equally strong
              third-party attestation trail, status-page trail, or uptime/incident record. Review and employee-feedback
              sources also indicate service quality and people execution are still material risks. So the chapter's
              bottom line is that product breadth and operational integration are verified, while security, reliability,
              and implementation maturity are only partially evidenced in public.
