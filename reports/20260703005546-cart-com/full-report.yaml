        title: Exhibits
        blocks:
          - type: callout
            title: Bundling is a moat only until incumbents unbundle it cheaply
            body: >-
              Amazon MCF offers fulfillment with zero platform lock-in, and Shopify/BigCommerce's app-partner ecosystems
              let brands assemble a comparable bundle without signing one multi-year enterprise contract, meaning
              Cart.com's core pitch competes against "do-it-yourself bundling" as much as against any single rival.
            calloutType: insight
            claimRefs:
              - CP027
              - CP044
