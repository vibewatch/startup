  evidenceGaps:
    - type: missing-source
      severity: material
      topic: Cart.com-specific SAM/SOM
      missingEvidence: >-
        No retained public source isolates a Cart.com-specific SAM, SOM, revenue, or GMV figure across its software,
        fulfillment, and managed-commerce lines.
      whyItMatters: Valuation depends on the monetizable slice of these adjacent markets, not on the size of the broad public shells.
      diligencePath: Request internal revenue/GMV by service line (software, fulfillment, marketplace management, customer engagement) and audited customer counts.
      relatedQuestionRefs:
        - QM027
      relatedTableRefs:
        - TM002
    - type: conflicting-data
      severity: material
      topic: WMS market size divergence
      missingEvidence: >-
        Mordor Intelligence ($4.77B, 2026) and Precedence Research ($6.78B, 2026) diverge by roughly 42% on WMS market
        size for the same nominal category, with no reconciliation of scope in either source.
      whyItMatters: A 42% swing in the WMS shell materially changes how large Cart.com's software-differentiation opportunity looks.
      diligencePath: Commission a scope-normalized WMS market estimate (software-only vs. software-plus-services) before using either figure in valuation work.
      relatedQuestionRefs:
        - QM005
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: Cart.com capacity absorption from failed 3PL peers
      missingEvidence: >-
        No public source compares Cart.com's fulfillment-network utilization or new-customer wins against the stranded
        volume being redistributed from failed or exiting 3PLs (e.g., Quiet Logistics).
      whyItMatters: If Cart.com is not capturing displaced 3PL volume, the "opportunity" side of the 3PL shakeout may not accrue to Cart.com specifically.
      diligencePath: Request Cart.com's new-logo pipeline and win-rate data tied to competitor exits or bankruptcies since 2025.
      relatedQuestionRefs:
        - QM021
      relatedTableRefs:
        - TM004
    - type: missing-source
      severity: minor
      topic: Cart.com adverse events
      missingEvidence: >-
        No public reporting of layoffs, restructuring, lawsuits, or customer losses at Cart.com itself was found as of
        the July 2026 access date.
      whyItMatters: Absence of adverse public evidence for a private company likely reflects limited disclosure obligations rather than confirmed clean execution, and should not be read as a clean bill of health.
      diligencePath: Request management's own account of any 2024-2026 workforce actions, customer terminations, or legal matters, and cross-check with employee-review platforms and state WARN Act filings.
      relatedQuestionRefs:
        - QM028
      relatedTableRefs:
        - TM004
