slug: cart-com
runDate: '2026-07-03'
company:
  name: Cart.com
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Cart.com sits across three overlapping market shells — ecommerce enablement software, outsourced 3PL/fulfillment
    services, and managed-commerce operations — that are each large and growing, but none of which the public record
    lets us collapse into one clean, Cart.com-specific TAM. The category benefits from platform consolidation,
    marketplace proliferation, and 2025-2026 tariff shocks that favor U.S.-based bulk-import fulfillment, while a
    parallel 3PL-sector shakeout and unresolved AI-automation payback create real execution risk.
sections:
  - id: section-1
    title: 'Market boundary: unified commerce is a bundle of adjacent spend pools, not one category'
    body: >-
      Cart.com describes itself as a unified commerce and logistics provider that lets B2C and B2B brands synchronize
      listings, pricing, inventory, and orders across storefronts, marketplaces, and social channels while a nationwide
      U.S. fulfillment network handles physical execution. That self-description spans at least four distinct spend
      pools that analysts size separately: ecommerce enablement software (OMS/PIM/storefront sync), outsourced
      3PL/fulfillment services, marketplace management and growth marketing, and customer engagement/support. Cart.com's
      own homepage frames these as modular — brands can buy fulfillment alone, software alone, or the full "360 Managed
      Commerce" bundle — which matters because it means Cart.com competes against pure-play software vendors, pure-play
      3PLs, and full-service agencies simultaneously rather than against a single competitor set. The boundary explicitly
      excludes categories Cart.com does not monetize: long-haul freight/trucking carriage, card-network payment
      economics, and generic ERP/finance software unrelated to commerce operations. A notable 2026-specific addition to
      the boundary is trade-policy-driven reshoring: Cart.com's own marketing now highlights helping "nine-figure brands
      reshore millions of units within days amid evolving trade policy," which ties its U.S. warehousing model directly
      to the de minimis and tariff shifts described in Section 4. The practical takeaway is that Cart.com's addressable
      market should be evaluated as a bundle of adjacent, separately-sized categories rather than as one broad
      "ecommerce market" number, because a single blended TAM would overstate the software opportunity and understate
      the capital-intensive logistics opportunity.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM011
      - CM048
    tableRefs:
      - TM001
    figureRefs:
      - FM001
  - id: section-2
    title: 'Sizing lenses: five separate market shells, each medium-confidence and none Cart.com-specific'
    body: >-
      No retained public source isolates a Cart.com-specific SAM or SOM, so this chapter uses five independent sizing
      lenses instead of one inflated TAM. Ecommerce enablement software alone is sized at $10.69 billion in 2026 by
      360iResearch (B2B platform software, 13.74% CAGR to $23.31 billion by 2032) and at a broader $13.10 billion by
      Fortune Business Insights (16.46% CAGR to $44.32 billion by 2034) — a reminder that even "software market size"
      varies by scope. The physical-fulfillment layer is far larger: The Business Research Company sizes global 3PL at
      $1,461.13 billion in 2026, growing at a 10.6% CAGR to $2,141.68 billion by 2030, though this figure spans all
      industries, not ecommerce alone. Warehouse management software shows a genuine methodology conflict: Mordor
      Intelligence puts 2026 WMS at $4.77 billion while Precedence Research — using a broader software-plus-services
      scope — puts the same year at $6.78 billion, a 42% gap that should not be smoothed over. The managed-commerce
      layer closest to Cart.com's "360" bundle is sized by Research and Markets at $88.95 billion in 2026 (13% CAGR to
      $146.22 billion by 2030), and the adjacent warehouse-automation/AI infrastructure layer at $34.17 billion in 2026
      per ClickPost (13.98% CAGR to $65.74 billion by 2031). Macro context from the U.S. Census Bureau anchors these
      shells: Q1 2026 U.S. retail ecommerce reached $326.7 billion (seasonally adjusted), 16.9% of total retail, growing
      9.8% year over year versus 3.9% for total retail — corroborated independently by FRED's ECOMPCTSA series. None of
      these numbers can be summed into a defensible Cart.com TAM; they instead bound the size of the adjacent pools
      Cart.com's bundle draws from.
    claimRefs:
      - CM012
      - CM013
      - CM014
      - CM015
      - CM016
      - CM017
      - CM018
      - CM019
      - CM020
      - CM021
      - CM022
    tableRefs:
      - TM002
    figureRefs:
      - FM002
  - id: section-3
    title: 'Buyer map: enterprise brands, mid-market DTC, divesting retailers, and marketplace sellers'
    body: >-
      Cart.com's disclosed customer base — TOMS, PacSun, and Janie and Jack, among a claimed 6,000-plus customers
      worldwide — points to four distinct buyer archetypes rather than one generic "ecommerce brand" segment. Enterprise
      omnichannel brands are the clearest fit: TOMS selected Cart.com as its U.S. fulfillment partner for software-driven
      inventory management, while PacSun went further and transferred ownership of its 2-million-square-foot automated
      Groveport, Ohio warehouse to Cart.com outright — a buyer signal that goes beyond a services contract into physical
      capital divestment. Mid-market DTC and consumer brands are a second segment, drawn to Cart.com by rising customer
      acquisition costs and the need to bundle fulfillment, marketing, and support without in-house headcount; this
      segment overlaps with a global DTC market Ringly.io sizes at $319.57 billion in 2026 (7.8% CAGR), with U.S. DTC
      ecommerce at $212.9 billion and 19.2% of U.S. retail ecommerce. A third segment — retailers actively divesting
      owned logistics infrastructure — is evidenced directly by the PacSun deal and is a workflow distinct from a brand
      that never owned a warehouse. The fourth segment is multichannel marketplace sellers: Marketplace Pulse data shows
      Amazon holding roughly $300 billion in U.S. third-party sales versus eBay's $39 billion, while Walmart and TikTok
      Shop have each reached roughly $15 billion in U.S. GMV (Walmart up from $10 billion while crossing 200,000
      sellers; TikTok Shop up 68% year over year), and Shopify's global GMV has risen to 66% of Amazon's marketplace GMV
      in 2025 (from 40% in 2020). Brands selling across three or more of these channels are the buyers most likely to
      need Cart.com's unified inventory and fulfillment layer rather than a single-channel tool.
    claimRefs:
      - CM008
      - CM009
      - CM010
      - CM023
      - CM024
      - CM026
      - CM027
      - CM028
      - CM029
      - CM030
      - CM031
      - CM032
