  topStrengths:
    - 软件加履约一体化堆栈覆盖 OMS、WMS/TMS、店面、名义商户、自动化和 marketplace 服务，不只是单点工具。
    - 具名企业客户和有规模物流活动给出真实运营证据，包括 6,000+ 客户、70M+ 年订单量，以及披露的十亿美元级 GMV 吞吐。
    - 能反复获得机构资本和战略性董事会支持，显示市场信心仍在，尽管运营复杂度很高。
  topRisks:
    - 经审计收入、毛利率、债务契约和完整资本结构条款仍不透明，估值对假设极敏感。
    - 业务重劳动力、重场地，又靠多次收购拼起来，集成、服务质量和文化执行都有风险。
    - 未披露客户集中度、留存和平台依赖，表面增长可能掩盖大客户基础过窄或扩张经济性不均衡。
  unresolvedGaps:
    - 经审计的最近十二个月收入、毛利率、EBITDA 和现金流披露仍不可得。
    - BlackRock 债务条款，以及 2026 年 3 月轮次的清算优先权、优先顺位和稀释影响未公开。
    - 客户集中度、合同期限、NRR/GRR 和流失数据未披露，尽管 logo 组合偏企业客户。
    - 安全 / 合规认证，以及量化可用性或事故历史证据尚未达到尽调级公开记录深度。
