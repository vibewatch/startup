  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 跨软件、履约、支付和服务的收入流与变现
        blocks:
          - type: paragraph
            body: >-
              Cart.com 自己的产品分类指向四个不同商业类别，而不是一个单一变现引擎：Fulfillment & Logistics、Commerce Software（订单、仓库和运输管理，加上以
              Constellation OMS 品牌呈现的平台/feed 营销工具）、B2B Commerce Platform，以及 Commerce
              Services（增长营销、平台服务、客户互动、店铺优化）。Merchant-of-record 功能——支付处理、拒付管理、销售税计算和汇缴——也置于这些业务线旁边，并在关于 Cart.com 与
              Authentic Brands Group 合作的独立报道中有明确记录，不只是 Cart.com 自己营销文案中的说法。


              公司还通过非有机方式扩展了至少一条业务线：2024 年收购 Amify 后，Commerce Services 线增加了 Amazon 平台优化和广告能力；更早前，公司收购了 Guthy-Renker 的履约运营
              OceanX。这种非有机增长模式会影响收入质量判断，因为它意味着部分当前收入来自收购，而不是有机搭建；也因为创始人 Omair Tariq 曾公开承认，Cart.com
              “最大的错误”是把尚不成熟的能力（Amazon
              平台服务）交叉销售给既有履约客户，而该能力当时还没准备好，之后需要数月“道歉巡回”来修复关系。这是公开记录中少见的、公司自行披露的变现跑在交付能力前面的案例，也是最清晰的收入质量警示。


              定价方面，Cart.com 自己的博客内容和第三方列表（TrustRadius）在一点上保持一致：没有公开价格表。履约、软件、merchant-of-record
              和服务定价都通过咨询式、依赖数量和复杂度的报价销售。这在企业级 3PL 和商务赋能市场很常见，但也意味着外部分析师可获得的每个定价数字，要么是通用行业基准，要么是客户特定谈判价格——从来不是 Cart.com
              自己的标价。
