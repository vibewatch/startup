  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - SaaS 平台整合（Shopify / Plus 增长、Magento 下滑）
        - 正向
        - 当前
        - 品牌换平台时更需要外部履约 / 运营伙伴，需求池扩大
        - 索取 Cart.com 的平台集成路线图，以及按店面平台拆分的客户占比
      - - 市场平台 GMV 增长和多渠道复杂度上升
        - 正向
        - 当前
        - 推高跨渠道统一库存和履约需求
        - 索取 Cart.com 按渠道组合拆分的收入
      - - 小额免税取消和新增关税附加费
        - 混合
        - 当前
        - 有利于 Cart.com 这类批量进口、美国仓储模式；也抬高 DTC 直发品牌的到岸成本
        - 索取 Cart.com 回流美国 / 批量进口客户胜单，以及已实现的利润率影响
      - - 3PL 行业出清（“Great Freight Recession”）
        - 混合
        - 当前
        - 有机会承接退出 3PL 留下的货量，但也提示全行业财务脆弱
        - 索取 Cart.com 的客户集中度和财务稳定性披露
      - - 履约中的 AI / 智能体自动化采用
        - 正向
        - 当前至中期
        - 若执行到位，可支撑利润率扩张和差异化；智能体采用率仍低于店铺的 1%
        - 索取 Cart.com 的 AI / 自动化路线图和已实现 ROI 指标
      - - 电商外包 / 托管商务需求增长
        - 正向
        - 当前
        - 直接支撑 Cart.com 的「360 Managed Commerce」打包方案
        - 索取打包客户与点解决方案客户的附加率数据
      - - 货运 / 卡车运输量下滑和行业过剩运力修正
        - 负面
        - 当前
