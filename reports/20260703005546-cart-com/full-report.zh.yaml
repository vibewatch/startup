      - number: '3.6'
        title: 护城河耐久性与负面风险清单
        blocks:
          - type: paragraph
            body: >-
              Cart.com 的核心竞争主张——把店铺前台软件、平台/渠道管理和自有履约基础设施打包进一份合同——是一条会被各相邻层部分侵蚀的护城河：Stord、ShipBob 等纯履约 3PL
              正在扩展自己的软件层；Shopify、BigCommerce 等纯软件平台依托宽广的应用伙伴生态来近似完成集成；Amazon MCF
              则为不愿签多年平台合同的品牌提供零承诺替代。值得跟踪的负面和耐久性信号包括：Shopify 剥离 Flexport 业务，证明即便现金充裕的既有厂商，自有履约也可逆；2025 年 12 月 1 日 Shopify
              平台故障扰乱 POS 和后台登录，并拖累股价下跌 5.9%（说明全行业存在平台可靠性风险）；以及 Pattern 94% 收入集中于 Amazon，作为渠道依赖的警示案例。公开企业级同行 VTEX 和 SPS
              Commerce 披露了经审计且增长的收入（VTEX 2026 年 Q1 GMV 同比增长 17.1%；SPS Commerce FY2025 收入同比增长 18%，连续第 100
              个季度增长），为投资者提供了一个透明度基准，Cart.com 未披露的私营财务暂时无法匹配。本轮研究未浮现 Cart.com
              特定的重大负面事件（诉讼、大规模裁员、安全事件），但独立客户评价数据（G2、Trustpilot）无法访问，留下 Cart.com 特定客户情绪证据缺口，本章选择披露，而不是粉饰。
