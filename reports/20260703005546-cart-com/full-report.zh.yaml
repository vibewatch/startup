      - number: '7.6'
        title: 财务 / 模型风险与风险传导
        blocks:
          - type: paragraph
            body: >-
              第三方收入估算机构 Growjo 预计 Cart.com 2026 年年收入为 $175.2
              million；该估算没有经审计数据或公司披露数字印证，实质限制了本登记表中任何风险按收入百分比表达的精度。Cart.com 持续获得资本的能力仍由两类独立证据印证：一手 SEC Form D/A 备案（2025
              年 5 月 27 日，报告在 $81,249,925 授权发行额中已向 13 名投资人售出 $73,681,890）以及具名财务顾问项目背书（FT Partners 参与 Cart.com Series C
              融资）；不过两者都没有披露 BlackRock 定期贷款的利率、期限或契约条款。风险通过三条主通道传导到 Cart.com 的模型中，风险传导图（FR002）已有映射：监管 /
              法律风险主要通过合规成本和潜在法律判决传导，并作用于未披露的现金储备；合作伙伴 / 依赖风险同时通过客户侧收入（与市场平台挂钩的托管服务费）和 Cart.com
              自身成本结构（承运商费率转嫁）传导，因此单一不利平台或承运商事件可能同时压缩利润率和收入；人员 / 执行风险则间接传导到融资风险，因为劳动力和治理披露缺口悬而未决，会削弱未来贷款人或股权投资人在尽调时对
              Cart.com 报告运营指标的信心。
