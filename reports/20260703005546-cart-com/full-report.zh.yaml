  - id: FU001
    title: 客户旅程图：从发现到扩张循环
    type: journey-map
    layout: wide
    summary: 点名客户关系从细分匹配发现，推进到运营交接、生产使用、公开背书，再回到新客户扩张循环。
    data:
      nodes:
        - id: discovery
          label: 发现与匹配评估
          description: 买方细分通过入站询盘或被收购公司既有名单被识别出来，例如企业级全渠道品牌、品牌授权组合、美容 / 健康品牌、Amazon 市场卖家或公共部门机构。
        - id: transition
          label: 设施 / 渠道交接
          description: >-
            运营交接启动，例如 PacSun 位于俄亥俄州 Groveport 的设施管理转给 Cart.com，或某个市场卖家品牌的 Amazon 广告和运营交给 Cart.com/Amify 或
            Cart.com/Foundry Brands。
        - id: production
          label: 生产运营
          description: 关系已经上线并规模化运转：点名配送中心里的自动分拣 / 输送、持续的 Amazon 渠道管理，或为授权品牌组合提供登记商户服务。
        - id: proof
          label: 公开背书 / 案例研究
          description: 关系通过新闻稿、新闻中心文章或客户侧确认，变成可引用的客户证明，例如 Authentic Brands Group 自己的公司新闻页面。
        - id: expansion
          label: 扩张循环
          description: 已发布案例研究和点名背书（如 2024 年 Amify 客户名单）似乎支撑了新的市场卖家赢单，比如 Foundry Brands 在 2026 年 3 月的委托，并把线索送回下一轮发现阶段。
