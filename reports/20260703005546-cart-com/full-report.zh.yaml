  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、正向论点、反向论点与价格敏感性
        blocks:
          - type: paragraph
            body: >-
              Cart.com 的投资故事更容易相信，难在定价。最强的公开估值事实仍是公司自己在 2025 年 5 月宣布以 $1.6 billion 投后估值融资 $50 million，随后又在 2026 年 3
              月宣布新增 $180 million
              成长股权，但没有披露新的投后估值。这个组合支持公司仍有活跃融资市场，但不能清楚回答今日买方到底是在买入一个已证明便宜的机会、一个公平的增长估值，还是一座条款结构很重的桥。正向论点真实存在：Cart.com
              仍呈现为软件 + 物流混合平台，点名 TOMS Shoes、PacSun、Janie and Jack 等企业客户，并在叠加 AI
              和工作流自动化的同时持续吸引机构资本反复投入。反向论点也同样真实：公司自己的规模披露内部陈旧，各追踪库给出的累计融资额差异极大；Prime Unicorn 称 2024 年二级交易只隐含 $902 million
              调整后价值，市场已经给过一次有意义的负面定价信号。这些事实指向一个对价格敏感的结论，而不是公司质量结论。对新资金而言，公开记录支持继续研究 / 跟踪：中等信心、高风险，且 $1.6 billion
              估值偏紧。对现有持有人而言，只有后续尽调显示优先股条款干净，并且经审计经济数据证明业务值得交易得更接近高溢价软件、而不是低倍数商务基础设施，持有才比退出更站得住。
