      - number: '8.2'
        title: 融资背景、资本结构与入场纪律
        blocks:
          - type: paragraph
            body: >-
              估值上的主要问题不是缺少市场活动，而是缺少可对账的经济数据和条款。SEC Form D 备案证明 Cart.com 多次融资，但也凸显公开轮次叙事可能遮住实际到账。2025 年 Form D/A
              显示，在公司公开描述 $50 million 融资后不久，$81.25 million 发行额中已售出 $73.68 million；2024 年 12 月 Form D 则紧贴在 2025 年 5
              月新闻稿之前。公开累计融资额更嘈杂：公司称截至 2025 年 5 月已融资 $475 million；InnovationMap 后来引用 CB Insights 称 2026 年融资前为 $872
              million；Tracxn 为 $735 million；Premier Alternatives 为 $936 million；GetLatka 为 $413 million；Forge 显示 $608.57
              million。这个区间很关键，因为稀释、资本结构深度和优先权悬顶都取决于公司实际融了多少钱、条款是什么。Forge
              有方向性价值，因为它呈现逐轮优先权字段，并提醒用户其标记估值可能依赖有限输入，未必代表市场价格。解读这种不确定性，Vaquill 2026 年的优先权测算是正确镜头：如果资本结构中存在参与型优先权或超过 1x
              的优先权，中等退出价值也可能摧毁普通股回报，即便披露口径估值看起来仍体面。因此，入场纪律必须比融资新闻标题暗示的更严。
