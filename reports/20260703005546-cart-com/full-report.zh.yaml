  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险严重度概览
        blocks:
          - type: paragraph
            body: >-
              Cart.com 的风险画像最好按四个结构性类别来读：监管 / 法律、运营 / 质量 / 安全、合作伙伴 / 依赖、人员 / 执行。Cart.com
              是私有公司，指标大多由自己披露，因此这些风险比可比上市公司更难量化。本章中严重度最高、缓释最弱的单一风险，卡在两个公开来源无法调和的事实之间：一起活跃的联邦违约诉讼（Lubic v. Cart.com,
              Inc., No. 4:25-cv-04809，截至 2026 年 3 月 Rule 26(f)
              报告仍处于证据开示），以及完全没有披露现金跑道或烧钱速度。没有已知流动性缓冲时，本登记表里的任何其他风险——诉讼敞口、承运商成本上行、平台集中、债务契约风险——都无法和公司真实的抗冲击能力放在一起衡量。公司自
              2020 年成立以来已完成至少八起收购（AmeriCommerce、Cheap Cheap Moving Boxes、The DuMont Project、Sauceda Industries、FB
              Flurry、SellerActive、OceanX 和
              Amify），增长在很大程度上由这些收购构建，因此执行风险集中在不断扩大的被收购团队和系统的整合质量上，而不是单一产品或技术依赖上。下方风险热力图（Figure
              FR001）总结了本章列为最高优先级的八项风险在发生可能性、严重度、缓释成熟度和剩余严重度上的情况。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR035
