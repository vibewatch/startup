      - number: '1.4'
        title: 里程碑、规模指标与负面核查
        blocks:
          - type: paragraph
            body: >-
              Cart.com 的规模故事很大程度靠收购搭起来——AmeriCommerce、Cheap Cheap Moving Boxes、The DuMont Project、Sauceda Industries、FB
              Flurry、SellerActive、OceanX 和 Amify——再叠加自身履约网络的有机扩张。自 2024 年以来，报道中的客户数和设施数方向上保持一致：约 6,000 名客户每年处理 70–75
              million 订单；网络从 2024 年中期的 13–14 处设施，扩至 2025 年中期的 17–18 处全渠道设施和超过 10 million 平方英尺，其中 2024 年 12 月收购约 200 名员工的
              OceanX 起到助推作用。员工数更难对齐：Cart.com 自己在 2024 年 12 月的公告称团队成员超过 1,600 人，而 Tracxn 跟踪的员工数截至 2026 年只有 878
              人，本章无法靠公开来源解释这一差距。独立认可——2025 Deloitte Technology Fast 500 排名第 92（2021–2024 年收入增长 1,053.5%）以及 2025 Inc.
              5000 首次上榜第 385（近 1,100% 三年增长）——印证了高速增长，尽管没有找到经审计收入或 ARR；唯一识别到的 2025 年收入估计为 $175.2
              million，来自可靠性较低的第三方估算方。负面方面，TechCrunch 和 Houston Business Journal 报道（经 Owler 转述）都描述了 Austin 扩张后 2023
              年初未披露规模的裁员；审阅来源中未发现点名 Cart.com 的公开诉讼、FTC 行动、OSHA 执法或数据泄露披露，本章将其视为证据缺口，而不是干净记录。
