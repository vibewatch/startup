      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >-
              Cart.com 披露的融资历史，从 Bearing Ventures 参与的约 $20 million 种子轮开始，随后至少经历七个具名轮次和一项大型债务融资。Mercury Fund 与 Arsenal
              Growth 在 2021 年 4 月共同领投 $25 million Series A（累计融资至 $45 million）；Oak HC/FT 当年 8 月领投 $98 million Series
              B（累计至 $143 million）；Legacy Knight Capital Partners 于 2022 年 2 月领投 $240 million 股债融资（累计至 $380
              million），同期报道收入增长超过 400%；2023 年 6 月的 $60 million Series C 让 Cart.com 以 $1.2 billion 估值成为独角兽。2024 年又跟进 $25
              million Series C 扩展轮和 $105 million BlackRock 定期贷款；随后 2025 年 4–5 月的 $73.7 million Series C 追加轮以及另一笔 $50
              million 融资，把估值推至 $1.6 billion，公司自己的公告称创立以来已融资 $475 million。Springcoast Partners 领投的 $180 million 成长股权轮于
              2026 年 3 月完成，Houston InnovationMap 报道称累计融资超过 $1 billion——这一数字与公司自己的 $475 million 披露、Tracxn 单独汇总的 $735
              million 总额，以及第三方估算方 Getlatka 更低的 $413 million 估计均冲突。2026 年 3 月轮次没有披露更新估值，因此 $1.6 billion（2025 年 5
              月）仍是最新已确认数字。
