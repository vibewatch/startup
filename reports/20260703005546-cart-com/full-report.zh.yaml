  - id: TP004
    title: 护城河持久性与风险清单
    kind: risk-register
    columns:
      - 风险 / 护城河因素
      - 描述
      - 证据
      - 严重性
    rows:
      - - 捆绑护城河可被部分复制
        - 纯履约 3PL 增加软件，纯软件平台借助应用生态，两者都能在没有单一供应商合同的情况下近似 Cart.com 的捆绑方案
        - Stord/ShipBob 软件层；Shopify/BigCommerce 应用合作伙伴生态
        - 中
      - - 自有履约有反转先例
        - Shopify 先建设（2019-2022 年）、后在 2023 年 5 月完全剥离自有履约网络，说明 Cart.com 正在押注的同类业务资本强度高，也存在反转风险
        - Shopify Fulfillment Network 发布，收购 6 River Systems 和 Deliverr，剥离给 Flexport 并裁员 20%
        - 高
      - - 存在无需承诺的替代方案
        - Amazon MCF 让品牌无需平台合同即可使用履约服务，代价是单件成本溢价，但切换锁定为零
        - 公开的 MCF/FBA 费率表和 2026 年 1 月费用调整
        - 中
      - - 财务未披露，而上市同行更透明
        - VTEX 和 SPS Commerce 发布经审计且增长的收入，Cart.com 财务仍为私有，限制投资者基准比较
        - VTEX 2026 年 Q1 备案；SPS Commerce FY2025 新闻稿
        - 中
      - - 平台可靠性风险是行业问题，并非 Cart.com 独有
        - 2025 年 12 月 1 日 Shopify 故障影响 POS/admin 登录，并使 Shopify 股价下跌 5.9%，说明可靠性风险是投资者应直接向 Cart.com 追问的实时行业议题
        - 2025 年 12 月 Shopify 故障媒体报道
        - 中
      - - 渠道集中风险（同行警示案例）
        - Pattern Inc. 约 94% 收入仅来自 Amazon 市场平台，说明过度依赖单一渠道的风险；Cart.com 这类多元化捆绑方案正是要规避这一点
        - Pattern Inc. IPO/投资者披露
        - 中
      - - Cart.com 专属负面 / 客户情绪数据缺口
        - 本轮研究无法访问独立评论来源（G2、Trustpilot），因此没有 Cart.com 客户满意度或流失的独立读数
        - 对 G2 和 Trustpilot 的抓取尝试返回 403/404
        - 低-中
    notes: 严重性仅反映基于公开证据评估的、对 Cart.com 竞争耐久度可能产生的影响；这不是正式风险评分方法，应与 localEvidence 中的 evidenceGaps 条目一并阅读。
  - id: TI001
    title: 收入来源表
    columns:
      - 收入来源
      - 机制
      - 公开锚点
      - 当前状态
      - 收入质量判断
      - 尽调要求
    rows:
      - - 履约与物流
        - 覆盖自有全渠道仓库的仓储、拣货打包、入库 / 出库处理和运输
        - Cart.com 首页和博客将履约与物流列为核心产品线；多个来源引用 8.5M+ sq ft 和 14-18 个设施
        - 活跃，已披露占地最大
        - 可能是最大收入基础，但也是劳动和资本开支最重的业务；抽成率未披露
        - 要求提供履约收入占总收入百分比，以及按设施拆分的毛利率
      - - 电商软件（OMS/WMS/TMS、市场平台管理、商品 feed 营销）
        - 订单、仓库和运输管理的软件费用，加上市场平台 / 商品 feed 营销工具（'Constellation OMS'）
        - Cart.com 网站导航将电商软件列为独立产品类别；BlackRock 媒体报道明确点名 'Constellation OMS'
        - 活跃，官方列示
        - 若能独立销售，毛利潜力最高，但公司未披露纯软件收入或附加销售率
        - 要求将纯软件 ARR/ARR 等价口径与捆绑履约合同分开披露
      - - 登记商户 / 支付
        - 代表客户品牌管理支付处理、拒付、退款，以及销售税计算 / 缴纳
        - WWD 关于 Authentic Brands Group 合作的报道明确描述了 Cart.com 的登记商户服务
        - 活跃，至少有一个具名企业客户（Authentic Brands Group）
        - 支付 / 税务服务可产生抽成经济性，但未披露基点或百分比费率
        - 要求提供登记商户抽成率和处理支付量
      - - 电商服务（增长营销、市场平台服务、客户互动、店铺优化）
        - 面向付费媒体、SEO、Amazon / 市场平台优化和客户支持，按固定月费或项目收费
        - Cart.com 网站导航将电商服务列为类别；Amify 收购（2024 年）增加了 Amazon 市场平台优化 / 广告
        - 活跃；通过 M&A 扩张，而不完全靠内生建设
        - 创始人曾公开承认，在一项服务能力（Amazon 市场平台优化）完全成熟前就对外销售，这对该条线是质量警示
        - 要求披露服务条线收入结构，以及 Amify 收购后的整合状态
      - - B2B 电商平台
        - 面向 B2B 订购、库存和渠道管理的平台，与偏 B2C 的工具不同
        - Cart.com 网站导航列出专门的 B2B 电商平台产品
        - 活跃，官方列示
        - 与偏 B2C 的条线相比，范围和收入贡献未披露
        - 要求提供 B2B 平台客户数和收入贡献
      - - 通过收购获得的履约 / 服务产能（OceanX、Amify 及其他 2024-2025 年收购）
        - 通过收购而非内生销售增加的非内生收入和产能
        - Cart.com 2025 年 5 月新闻稿称，OceanX（Guthy-Renker 履约）和 Amify 收购已在此前十二个月内完成
        - 活跃，已整合进更广平台
