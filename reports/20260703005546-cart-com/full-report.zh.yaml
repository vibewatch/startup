  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立时间线和商业模式
        blocks:
          - type: paragraph
            body: >-
              Cart.com 自称是一家统一商务和物流解决方案提供商，让 B2C 和 B2B 品牌跨数字渠道销售，并由同一平台管理履约、营销、平台运营和客户互动。独立来源一致显示，公司 2020 年创立于 Texas 州
              Houston——Wikipedia 写作 2020 年 10 月，同期 SiliconHills 文章和 2021 年 TechCrunch 文章都写作 2020 年 9 月，Tracxn
              汇总的公司注册数据则显示，美国法律实体 CART.COM, INC. 于 2020 年 9 月 2 日注册。本章审阅的来源没有一个支持 Cart.com 本身创立于 2018 年。最可能的混淆来源是 FB
              Flurry：这家位于 Dallas 的履约公司在 2022 年 1 月被 Cart.com 收购，FreightWaves 报道称其“创立于 2018 年”。截至 2026 年 3 月融资，联合创始人
              Omair Tariq（此前任 The Home Depot 高管、Blinds.com COO）和 Jim Jacobsen（前 DTC 品牌 RTIC Outdoors CEO、alliantgroup
              联合创始人）仍分别担任公司创始人兼 CEO、创始人兼执行董事长。公司三年内两次迁移全球总部：2021 年 12 月从 Houston 迁至 Austin，2023 年 11 月又迁回
              Houston，理由是基础设施和人才池优势。
