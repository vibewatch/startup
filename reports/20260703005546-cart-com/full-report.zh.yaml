  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Cart.com 按工作流交付什么，以及模块地图如何拼在一起
        blocks:
          - type: paragraph
            body: >-
              Cart.com 卖的不是单个 SKU，而更像一套面向品牌的运营栈：这些品牌既需要商务软件，也需要执行。本章审阅的公开材料显示，其供给至少拆成六个实用模块：用于订单和库存编排的 OMS，用于执行和货运决策的
              WMS/TMS，用于高吞吐站点的仓库自动化，用于数字采购的 AmeriCommerce/B2B 店铺前台软件，通过 SellerActive 和 Amify 搭建的平台服务，以及客户支持和
              merchant-of-record 等托管商务服务。这个框架重要，因为买方选择的不只是软件界面；他们是在决定 Cart.com 在从商品发现到支付、订单路由、履约、售后支持和平台增长的工作流中坐在哪个位置。


              模块地图也显示，产品价值很大一部分是运营性的，而非纯数字化。Pacsun 用 Cart.com 接管一处大型自动化设施，Authentic 则用它做支持和 merchant-of-record
              运营。AmeriCommerce 和 B2B 批发层说明 Cart.com
              仍重视店铺前台和买方工作流，但最强的共同主线是跨渠道控制：共享库存、多店管理、路由、拣货、发货、定价和支持。最终呈现出的宽度，更像统一商务运营商，而不是狭窄 SaaS 供应商。
