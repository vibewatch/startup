      - number: '4.3'
        title: 资本充足性、债务与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Cart.com 的融资历史混合了一级股权、至少一项大型整合型风险债务融资，以及收购活动；SEC Form D 文件为公司自身融资公告提供了少见的、可独立验证的交叉核查。2023 年 3 月提交的一份 Form
              D 显示，经配售代理 FTP Securities LLC 向 9 名投资者售出总额 $44.5 million 的发行——这与 Cart.com 自己新闻稿中的 $60 million，以及独立追踪方
              Prime Unicorn Index 对看似同一 Series C 轮使用的 $68.56 million 都不同。类似模式在 2025 年再次出现：Cart.com 2025 年 5 月 12 日新闻稿称融资
              $50 million、估值 $1.6 billion，但两周后提交的 Form D 修订（2025-05-27）显示，在授权发行 $81.25 million 中已经售出 $73.68
              million——比公告头部数字多约 $23.7 million，且没有公开调和。


              债务讲的是相似故事。行业媒体（Pulse2、ABF Journal、FT Partners）都描述了 2024 年 7 月由 BlackRock 管理的 $105 million
              定期贷款，结构上明确用于以“有竞争力条款”“整合”此前风险债务。Houston InnovationMap 2025 年 5 月文章却把看似同一 2024 年事件描述为“$130 million
              债务融资”——多出 $25 million，本章无法从公开来源解释。另一边，Prime Unicorn Index 的二级市场数据显示，Cart.com 隐含估值在 2024 年初跌至约 $902
              million（较 Series C 参考价二级股价下跌 36.9%），公司一度失去“独角兽”分类，之后到 2025 年 5 月才恢复至公司所称 $1.6 billion。


              截至 2026 年 3 月 Springcoast 领投的 $180 million 轮，没有审阅来源披露新的投后估值；Cart.com 的 SEC EDGAR 历史中也尚未出现对应 Form
              D（最近列示文件仍是 2025 年 5 月修订）。CEO Omair Tariq
              自己把该轮描述为强化“资产负债表”并提供灵活性以在增长中“追求可持续盈利”，这本身就是证据：公司层面盈利当时尚未实现，或至少尚未公开声称已经实现。
