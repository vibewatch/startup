      - number: '3.3'
        title: 履约优先同行：Stord、ShipBob、Radial、Deposco、Cin7
        blocks:
          - type: paragraph
            body: >-
              第二个竞争层从相反方向切入同一问题：这些公司起家于（或主要仍是）实物履约或仓库软件运营商，后来逐步叠加商务相邻软件。Stord 成立于 2015 年，2026 年以 $3 billion 估值完成 $250
              million Series F（约为前一年的两倍），六年内完成八次收购，包括 UPS 的 Ware2Go 部门，用来搭建服务超过 1,000 个品牌的云编排仓库网络。ShipBob 创立以来已融资约
              $330.5 million，运营约 50 个履约中心（2017 年只有四个），至今履约超过 1 billion 件商品；不过独立分析师对其估值的估计（Sacra 约 $1.0–1.4 billion）与报道中的
              $4 billion IPO 目标差异很大，本章标出这一差异而不强行解决。Radial 源自 eBay Enterprise/Innotrac，自 2017 年起归比利时邮政集团 bpost
              所有，服务大型服饰和美妆品牌，历史员工数超过 7,000 人。Deposco 和 Cin7 销售仓库/库存管理软件，但自身不拥有实物履约网络。这些同行没有任何一家像 Cart.com
              所声称的那样，把自有履约和原生店铺前台/平台管理软件层结合得如此紧密；但它们各自在自己的赛道增长够快，足以侵蚀“打包在结构上必不可少”这一假设。
