  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从真实公司证明，到缺失的经济证明，再到继续研究 / 跟踪结论的决策流。
    data:
      nodes:
        - id: mark
          label: 可信的私募估值
          detail: 2025 年 5 月 $1.6B；2026 年 3 月又融资 $180M
        - id: proof
          label: 运营证明
          detail: 软件 + 物流模式，拥有点名企业客户
        - id: opacity
          label: 经济不透明
          detail: 收入、利润率、稀释和优先权披露仍不足
        - id: comp
          label: 可比区间很宽
          detail: 公开 EV/Sales 参考从 0.8x 到 12.3x
        - id: track
          label: 继续研究 / 跟踪
          detail: 值得跟踪，但还没便宜到足以形成确信
        - id: hold
          label: 有条件持有
          detail: 现有持有人只有在结构证明干净时才适合等待
      edges:
        - from: mark
          to: proof
          label: 得到支持
        - from: proof
          to: opacity
          label: 但被抵消
        - from: opacity
          to: comp
          label: 迫使
        - from: comp
          to: track
          label: 面向新资金
        - from: comp
          to: hold
          label: 面向当前持有人
    approximationNotes: 该流程把本章压缩成最关键的门槛问题：Cart.com 是否足够像软件公司，以及资本结构是否足够干净，足以让当前价格有吸引力。
    claimRefs:
      - CV001
      - CV002
      - CV021
      - CV040
      - CV041
      - CV045
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在不同年收入假设下，$1.6B 标称估值对应的隐含收入倍数。
    data:
      items:
        - label: $175.2M 收入
          value: 9.1
          detail: GetLatka 的低位第三方估计意味着高溢价倍数。
        - label: $250M 收入
          value: 6.4
          detail: 除非经济性像软件，否则仍偏贵。
        - label: $350M 收入
          value: 4.6
          detail: 对混合型商务基础设施模式而言，开始显得合理。
        - label: $500M 收入
          value: 3.2
          detail: 如果 Cart.com 规模已经远大于低端公开估计，就能支撑。
        - label: $700M 收入
          value: 2.3
          detail: 会让当前估值显得保守，但今天没有公开证据证明这一规模。
      yAxis:
        label: $1.6B 估值下的隐含收入倍数
    approximationNotes: 数值是简单的价格 / 收入敏感性，不是管理层指引。它们使用 2025 年 5 月 $1.6B 投后估值锚点和示例收入情景。
    claimRefs:
      - CV016
      - CV017
      - CV045
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于当前公开证据可支撑的估值区间。
    data:
      items:
        - label: 熊市
          low: 900
          mid: 1050
          high: 1200
          detail: 类似二级市场的下行，或按更低公开可比公司处理。
        - label: 基准
          low: 1200
          mid: 1500
          high: 1800
          detail: 混合型业务的综合倍数；好于熊市，但经济性仍不透明。
        - label: 牛市
          low: 2000
          mid: 2400
          high: 3000
          detail: 需要比公开档案证明的水平更高的收入，以及更干净、类似软件的经济性。
        - label: 当前标称估值
          low: 1600
          mid: 1600
          high: 1600
          detail: 2025 年 5 月投后估值锚点，用来对照情景区间。
    approximationNotes: 数值单位为百万美元。区间基于情景，且刻意保持较宽，因为公开记录未披露经审计收入、分部利润率或已核实的稀释条款。
    claimRefs:
      - CV042
      - CV043
      - CV044
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以 IC 风格快照呈现最直接影响价格争论的事实。
    data:
      items:
        - label: 最新披露投后估值
          value: '1600'
          unit: USD M
          detail: 2025 年 5 月公司声明的估值。
        - label: 不利二级市场估值
          value: '902'
          unit: USD M
          detail: 2024 年 Prime Unicorn 调整后估值信号。
        - label: 低位公开收入估计
          value: '175.2'
          unit: USD M
          detail: GetLatka 2025 年收入数字。
        - label: 当前客户主张
          value: 6000+
          detail: 首页称全球客户超过 6,000 家。
        - label: 公开可比公司区间
          value: 0.8x-12.3x
          detail: Commerce.com 到 Shopify 的 EV/Sales 区间。
        - label: 资本结构透明度
          value: Low
          detail: 优先权条款未在公开主要文件中核实。
        - label: 退出窗口质量
          value: Low
          detail: 二级交易活跃，但整体风投退出仍弱。
    approximationNotes: 这张记分卡混合了披露事实和分析性质量标签，用来框定 IC 讨论，而不是替代详细承销。
    claimRefs:
