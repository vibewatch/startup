      - number: '7.7'
        title: 缓释、监测与终止条件
        blocks:
          - type: paragraph
            body: >-
              Lubic v. Cart.com 诉讼是本登记表中最清楚的近期可监测触发点：不利判决、超过重大阈值的和解，或扩大为集体诉讼 /
              多原告诉讼，都会让已披露法律敞口出现阶跃式扩大，并应立即触发交易对手风险重评。没有来源披露 Cart.com
              的现金跑道或烧钱速度，因此在公司披露经审计财务前，任何新增融资轮、资本重组或降估值融资公告，都应被视为当前最清晰的流动性压力代理信号；本章也把这一流动性披露缺口视为最关键的未解问题。一旦出现点名 Cart.com
              的 California DIR 处罚、CPPA 执法行动或同意令，本章监管风险就会从基于先例（通过 Amazon AB 701 案例）转换为公司特定风险，严重度和监测优先级都会明显上升。若出现 Cart.com
              特定、面向客户的宕机且持续数小时以上，或确认影响重大履约量，就能把孤立事件和 2025 年 AWS 与 Shopify 宕机中已见到的行业级系统性云 /
              平台依赖失效区分开来。未来若有披露把托管服务收入的具体比例绑定到 Amazon 或 Shopify，本章的平台集中风险就会从定性警示变成量化融资或尽调条件；若单季确认裁员超过员工数约 15%，或出现 WARN
              Act 备案，则会把当前员工数不确定性往负面方向解决，应视为执行风险红旗。
