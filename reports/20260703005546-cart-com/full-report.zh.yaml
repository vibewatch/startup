    rows:
      - - Cart.com 2025 年 5 月融资轮
        - 一级融资锚点
        - $50M，投后估值 $1.6B
        - 公司披露中最干净的价格锚点，可用于入场纪律。
        - 公告轮规模与后续 Form D/A 无法顺畅核对。
      - - Prime Unicorn 2024 年二级市场标记
        - 二级市场下行信号
        - 调整后估值 $902M；股价较 Series C 参考价下跌 36.9%
        - 显示市场已经接受过低于独角兽估值的交易信号。
        - 二级交易活动有限，不能完全替代一级价格。
      - - Shopify
        - 公开高溢价软件基准
        - 基于 $12.37B 收入的 12.29x EV/Sales
        - 成熟商业软件赢家可拿到的上限参照。
        - 软件属性和盈利能力都比 Cart.com 纯得多。
      - - Commerce.com
        - 公开混合型商业软件可比公司
        - 基于 $346.82M 收入的 0.78x EV/Sales
        - 低端锚点有用：同样邻近商业软件赛道，且有上市公司披露。
        - 盈利能力较弱、产品组合不同，可能夸大下行。
      - - VTEX
        - 公开电商平台可比公司
        - 基于 $247.05M 收入的 2.08x EV/Sales
        - 对具备真实软件毛利率的商业平台而言，是合理的中低端公开参照。
        - 履约占比低于 Cart.com，地域差异也更大。
      - - Stord
        - 私有软件赋能履约可比公司
        - 2025 年以 $1.5B 估值融资后，2026 年以 $3B 估值融资 $250M
        - 说明投资人仍会奖励带有现代软件叙事的履约平台。
        - 收入、利润率和结构披露有限。
      - - ShipBob
        - 私有履约平台可比公司
        - 跟踪估值约 $1.4B，累计融资 $651.7M
        - 接近 Cart.com 2025 年公告估值的私有市场方向性基准。
        - 基于聚合器数据，且缺少当前公开财务。
      - - Flexport / 私有数据警示
        - 仅供方向参考的私有基准
        - 聚合器标题称 2026 年为 $8.0B，但抽取正文称截至 2025 年 8 月为 $997.5M
        - 说明私有公司估值聚合器噪音很大。
        - 内部不一致太强，无法用于精确定价承销。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the main public and private valuation references usable for Cart.com today, but the set is
        intentionally partial because there is no perfect public hybrid commerce-and-fulfillment analog with fully
        disclosed segment economics.
    notes: 本表混合一级融资锚点、二级市场信号、公开可比公司和私有可比对象；只用其中一个桶会夸大精度。正确结论是划区间，而不是给单点公允价值。
    claimRefs:
