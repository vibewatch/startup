  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 视角
      - 多头论点
      - 反论点
      - 什么会改变观点
    rows:
      - - 市场
        - 统一商业基础设施仍有战略重要性，也仍能吸引机构资本。
        - 市场大并不保证混合模式在退出窗口疲弱时仍配得上溢价定价。
        - 证明 Cart.com 能在不牺牲经济性的前提下持续拿份额。
      - - 产品
        - Cart.com 把软件、履约、市场和客户触达合并成一层运营系统。
        - 同样的组合也可能稀释利润率，让公司按物流而非软件交易定价。
        - 分部层面利润率披露和软件附着率数据。
      - - 客户
        - 具名品牌和数千名客户支撑真实商业分量。
        - 缺少集中度、留存和队列盈利能力，就很难给客户质量定价。
        - 客户集中度、NRR 和队列贡献利润率。
      - - 财务
        - 业务规模可能已明显大于第三方低端收入估计所暗示的水平。
        - 如果真实收入基数接近 $175M，2025 年估值已经嵌入溢价倍数。
        - 经审计收入桥接和毛利率披露。
      - - 竞争
        - 最好的公开可比结果指向高溢价软件倍数。
        - 近期同业承压和低倍数上市公司说明，履约占比高的模式可能很快重估。
        - 赢单 / 输单数据，以及软件经济性主导模型的证据。
      - - 资本结构
        - 新资金和重复投资人表明公司尚未失去融资渠道。
        - 融资总额互相冲突、优先权条款未经验证，可能意味着普通股故事弱于公告估值。
        - 现行章程、股权结构表和已验证清算条款。
    notes: 反论点更多针对价格形成、资本结构和模式组合，而不是公司业务会彻底崩塌。
