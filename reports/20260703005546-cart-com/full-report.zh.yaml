      - number: '7.3'
        title: 运营 / 质量 / 安全风险
        blocks:
          - type: paragraph
            body: >-
              Cart.com 没有披露其商务和履约技术栈由哪家云托管商支撑，也没有披露维护怎样的多区域或多云韧性架构；鉴于 2025 年 10 月 20 日 AWS
              大规模宕机曾让大量高流量网站和应用数小时无法访问，并展示单云依赖可能造成的系统性脆弱，这一缺口很重要。数据安全方面，Cart.com
              自己的服务条款只承诺“商业上合理”的保护措施——该表述达不到保证——且失败成为违约前有 30 天补救期；尽管公司为企业客户处理支付和商务数据，没有来源识别出当前 SOC 2 Type II 或 PCI DSS
              认证。同一服务条款排除“承运商的任何作为、不作为或失败”责任，并把总责任上限设为 $100 或六个月费用中较高者；合同上把大部分承运商失败风险转移给客户，而不是在运营上消除。成本方面，UPS 和 FedEx 实施
              2026 年综合费率上调，平均略低于 5.9%，其中超大件、附加处理和住宅配送附加费涨幅不成比例地更高。2026 年 TrustRadius 对 Cart.com
              平台的评价里，反复出现实施周期和集成问题投诉，同时也有正面的账户支持反馈；2026 年初，美国物流和制造业还出现一波裁员与破产（包括 Quiet Logistics 关闭 American Eagle
              专用履约运营），证明 3PL 邻近运营商承受行业级运营压力。
