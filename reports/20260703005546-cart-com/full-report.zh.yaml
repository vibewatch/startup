  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 谁购买、谁使用、谁付款：客户分层
        blocks:
          - type: paragraph
            body: >-
              Cart.com 已披露的客户基础至少横跨五类买方 / 用户 / 付款方分层；这些分层来自具名关系，而不是公司发布的分层框架 [CU036]。企业级全渠道服装和鞋履品牌——PacSun、TOMS、Janie
              and Jack——仍一起出现在 Cart.com 2026 年全渠道履约页面，品牌本身同时是买方和用户 [CU011]。第二类是 Authentic Brands Group 这类品牌授权组合，买方 /
              付款方分离：Authentic 是签约买方，底层授权品牌是运营用户；Cart.com 明确面向该组合的一部分营销商户记录方服务，意味着至少部分交易中 Cart.com 自身进入支付流
              [CU021][CU037]。第三类是通过 OceanX/Guthy-Renker 收购继承来的美妆与健康品牌，一个履约栈承接 25+ 个名人和美妆品牌 [CU018]。第四类且增长很快的是 Amazon
              市场平台卖家，先由 2024 年收购 Amify 后服务 50+ 个品牌；到 2026 年 3 月，又通过 Foundry Brands 的新委托覆盖四个具名组合品牌
              [CU012][CU015]。第五类是联邦和公共部门机构，公开材料只以汇总口径承认“多家联邦机构”，没有披露名称、数量或合同金额 [CU001]。Cart.com
              自己的关于页面使用宽泛表述——“全球最受喜爱的品牌和要求最高的组织”——与这种多分层跨度一致，但没有给出量化拆分 [CU042]。没有已审阅来源披露 6,000+
              总客户数如何分布在这五类里，这是本章第一个明确证据缺口。
