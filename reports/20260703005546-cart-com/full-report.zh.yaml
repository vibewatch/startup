      - number: '4.4'
        title: 公开财务缺口、GTM 信号与财务结论
        blocks:
          - type: paragraph
            body: >-
              本章每一个核心承销输入，要么未披露，要么由公司自报，要么在来源之间互相冲突。审阅过的来源——SEC 文件、新闻稿、访谈或第三方追踪方——没有一个披露 Cart.com
              的现金余额、月度烧钱、现金续航期、毛利率、EBITDA、净利润、各收入线抽成率、客户集中度，或 BlackRock 信贷额度的限制性条款。终身融资总额从公司 2025 年 5 月所称 $475 million，到
              2026 年 3 月轮次前地方媒体引用 CB Insights 来源的 $872 million，再到 Tracxn 和 Growjo 的 $735–$771
              million，跨度数亿美元，且没有共同方法论可调和。


              因此，财务结论受限的不是 Cart.com 底层业务质量，而是其公开披露质量。公司展现了真实、经独立印证的规模（GMV 从 2022 年约 $5 billion 增至 2024 年超过 $8
              billion，物流足迹扩大，拥有 Authentic Brands Group、TOMS Shoes、PacSun、Janie and Jack
              等具名企业客户），也展现了获得机构资本的真实能力（BlackRock、Neuberger Berman、PayPal Ventures，以及如今的 Springcoast Partners
              跨多轮入局）。Russell Klein 等董事会新增成员曾帮助 Commerce.com/BigCommerce 在 IPO 前从 $30 million ARR 扩至超过 $350 million
              ARR，释放出向上市公司级财务纪律专业化的意图。但在 Cart.com
              披露经审计收入、利润率、现金和债务限制性条款细节前，任何估值或信用判断都只能调和互相冲突的公开估计，而不是基于已验证财务报表；2024–2026
              年两次融资公告中反复出现的“追求可持续盈利”表述，也应解读为公司自己的信号：盈利是前方目标，不是已披露的当前事实。
