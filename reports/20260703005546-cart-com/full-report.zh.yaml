      - number: '7.5'
        title: 人员 / 执行风险
        blocks:
          - type: paragraph
            body: >-
              在本报告审阅的几乎所有融资、收购和领导层公告中，创始人兼 CEO Omair Tariq 都是唯一被引用的公众人物；相较公开能见度较低的执行董事长 Jim
              Jacobsen，且没有披露继任计划，这显示出集中的关键人依赖。Cart.com 在 2025 年五个月内从外部任命三名高级管理人员——首席营销官（8 月）、首席营收官（9 月）和首席技术官（10 月，Arjun
              Sainath，前 Blue Yonder 平台工程企业副总裁）——短期执行风险集中在一支新拼成的领导团队上；公司没有披露这些人在 Cart.com 的任期记录，尽管新 CTO
              的企业级平台工程背景是可信的缓释因素。员工数本身也对不上：公司自己的 2024 年 12 月收购公告称 Cart.com 已增长到 1,600 多名团队成员，而 Tracxn 独立追踪的 2026 年员工数只有
              878，约为公司披露数字的一半。公司 2023 年 Austin 办公室扩张后曾被报道裁员，但已搜索来源没有识别出 2025–2026 年裁员或 WARN Act
              通知，导致当前劳动力趋势无法用员工数缺口交叉验证。Springcoast Partners 运营合伙人 Russell Klein 随 2026 年 3 月融资加入董事会，曾有将
              Commerce.com/BigCommerce 推向 IPO 的规模化经验，部分缓释治理和执行监督风险。
