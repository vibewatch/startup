      - number: '8.3'
        title: 情景分析与可比组
        blocks:
          - type: paragraph
            body: >-
              只有在特定收入规模和质量假设下，Cart.com 当前估值才显得保守。如果 GetLatka 的低第三方估算大致方向正确，收入约 $175 million，那么 2025 年 $1.6 billion
              估值意味着收入倍数约 9.1x，且尚未调整债务、现金或结构。如果业务年收入已经更接近 $500 million，同一估值会压到约
              3.2x，看起来就更站得住。公开可比公司组足够宽，足以让两套故事同时成立。Shopify 仍是高溢价软件基准，EV/Sales 约 12.29x；VTEX 低得多，约 2.08x；Commerce.com 约
              0.78x，盈利能力和杠杆更弱。私人市场参照不能干净补上缺口，但能界定赛道区间：Stord 2026 年达到 $3 billion，ShipBob 被追踪在约 $1.4 billion；Flexport
              自己的聚合页内部矛盾太多，更适合作为数据质量警告，而不是精准基准。下行类比案例也重要。Quiet Logistics 已被关闭并部分转移给 Stord，bpost
              的北美电商履约业务则承受合同终止和一次性费用。这些案例反对在收入结构、利润率和留存画像仍未披露时，无条件给 Cart.com 纯软件倍数。因此，情景区间刻意保持很宽；举证责任在公司，而不是可比公司表。
