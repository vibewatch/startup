  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代地图
        blocks:
          - type: paragraph
            body: >-
              Cart.com 没有单一直接竞争对手；它处在纯软件商务平台和纯履约 3PL 之间，同时也面临来自 Amazon Multi-Channel Fulfillment（MCF）和 FBA
              等平台内置物流的间接替代。证据显示四个现实竞争层：软件优先 SaaS
              既有厂商（Shopify、BigCommerce、VTEX），销售店铺前台和订单管理软件，但通常不自有仓库；履约优先的第三方物流提供商（Stord、ShipBob、Radial、Deposco、Cin7），拥有或编排实物履约，但原生商务软件层更薄；平台内置现状，即品牌直接使用
              Amazon MCF/FBA，而不是购买任何独立平台；以及 EDI/平台运营既有厂商（SPS Commerce、Rithum），连接品牌与零售商供应链，但自身不运营店铺前台或仓库。Cart.com
              的公开赌注是，把软件、平台管理和自有履约打包进一份合同，比从多家供应商拼出同样能力更有价值；本章将逐层检验这一论点。
