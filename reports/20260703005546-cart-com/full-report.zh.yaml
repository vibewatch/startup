      - number: '2.4'
        title: 增长驱动、约束与仍未解决的规模问题
        blocks:
          - type: paragraph
            body: >-
              2026 年有三股力量利好 Cart.com 的模式。平台整合是真实且可量化的：2026 年 Q1 对 100 万个域名的抓取显示，Shopify（含 Plus）如今支撑 42.6% 已识别电商店铺（较 2022
              年上升 10.8 个百分点），而 Magento/Adobe Commerce 降至 8.4%（下降 10.2
              个百分点）——这类流失创造了一个持续存在的品牌重构平台池，也带来寻找新运营伙伴的需求。平台数量扩张增加了渠道复杂度，利好统一工具。$800 小额免税门槛的取消——2025 年 5 月 2 日对中国暂停，2025
              年 8 月 29 日对所有国家暂停——则直接让批量进口、美国仓储履约模式，相比工厂直发模式更占优；在 90 天内调整定价的品牌保住了关税前约 85% 的利润率，而动作较慢者遭遇了 8–15
              个百分点的永久侵蚀。但两项约束反向拉扯。3PL 行业正处在真实困境中——American Eagle 正在彻底停掉 Quiet Logistics 业务，由 Stord 接收 Dallas
              设施；2025–2026 年也出现一波物流破产潮，原因被归结为疫情时期过剩产能和关税驱动的成本上升——这意味着 Cart.com
              所处行业中，财务脆弱性不仅是增长之外的背景噪音，而是交易对手和收购标的的现实风险。另一个约束是，AI/agentic 自动化只有落地才算真正差异化：Stord 自己的 2026 年调研发现，88%
              的组织称使用某种 AI，但只有 7% 达到“全面规模化”；履约场景中的 agentic 采用率目前仍低于 1% 店铺。若干问题仍保持开放，并未解决：没有来源隔离出 Cart.com 自身
              SAM/SOM、收入或经审计 GMV；没有来源直接比较 Cart.com 吸收失败 3PL 同行产能的能力；也没有发现 Cart.com
              自身的公开负面证据（裁员、纠纷、客户流失），这更可能反映私营公司缺少公开披露义务，而不是确认执行干净。
