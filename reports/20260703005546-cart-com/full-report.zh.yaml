      - number: '4.2'
        title: 业务牵引代理指标、GMV 到收入缺口与单位经济信号质量
        blocks:
          - type: paragraph
            body: >-
              Cart.com 披露的最强规模代理指标是 GMV、客户数和订单量，而不是经审计收入。公司自己 2023 年 6 月 Series C 公告称，2022 年收入同比增长超过 500%，GMV 翻倍至超过 $5
              billion，同时有 140 million 个商品刊登和 11 billion 次平台重新定价事件。到 2024 年中，FT Partners 和 WWD 都引用了超过 $8 billion 年度
              GMV、超过 6,000 名客户、以及 14 处全渠道设施每年处理 75 million 订单的数据——方向上与持续增长一致，尽管 GMV 转化出的底层收入从未披露。


              GMV 与收入之间的缺口，是本章的核心单位经济问题。Growjo 的算法模型估计 2026 年年收入为 $175.2 million，意味着每员工收入约 $210,294，员工数接近 833。但创始人 Omair
              Tariq 在 2024 年一次播客采访中称，Cart.com 第二年收入从 $30 million 增至 $180 million，并在公司四年左右时“接近五亿美元”——如果该说法今天仍大致准确，将接近
              Growjo 2026 年估计的三倍。两项数字都未经审计，本章把二者作为有标签、相互竞争的说法处理，而不强行调和；真正调和需要本章没有的私营财务数据。


              截至 2026 年 6 月访问时，Cart.com 自己首页仍写着 14 处全渠道仓库、8.5 million 平方英尺履约空间和每年 70 million+ 订单——这些数字相较公司自己 2025 年 5
              月新闻稿所述的 18 处设施、10 million 平方英尺网络显得陈旧。内部不一致提醒投资者，不应在没有抓取日期核查的情况下，把任何单个 Cart.com 发布的规模数字当作当前数据。
