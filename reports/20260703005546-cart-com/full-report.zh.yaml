      - number: '6.4'
        title: 留存、重复使用与未披露的 NRR 缺口
        blocks:
          - type: paragraph
            body: >-
              Cart.com 没有披露客户基础的净收入留存、毛收入留存或流失率，本章已审阅来源也没有填补该缺口 [CU030]。没有真正留存数据时，唯一可用的耐久性信号只是持续存在的代理指标：PacSun、TOMS 和
              Janie and Jack 仍一起列在 Cart.com 2026 年全渠道履约页面；“6,000+ 客户”的汇总数字也从 Cart.com 2024 年 7 月融资材料延续到 2026 年 3 月融资报道
              [CU011][CU033]。这个代理指标明确不是经流失调整的留存曲线——它只说明具体名称或披露口径数字尚未从公开材料里消失，力度远弱于确认仍在当前合同期内的有效合同。所有已审阅来源同样没有披露标准合同期限、续约条款和终止条款
              [CU031]。可作为参考的满意度证据仅限上一节已讨论的 TrustRadius 评价；该评价在最近更新时指出支持响应慢、报表能力停滞 [CU025][CU026]。在 Cart.com 或数据室直接披露
              NRR/GRR、Logo 和金额流失、合同期限数据之前，该客户基础的留存耐久性应视为待解问题，不能只凭具名 Logo 持续出现就默认成立。
