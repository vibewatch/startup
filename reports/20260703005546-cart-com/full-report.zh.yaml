        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              在定价公开的地方，对比显示各家包装哲学差异很大。BigCommerce 发布 GMV 分层计划，从 Core（$39/month）、Growth（$105/month）到 Scale（$399/month，GMV
              上限 $33,333/month，超额收 0.9%），以及过去十二个月 GMV 约 $2 million 以上自动升级的定制 Performance 层。Amazon Multi-Channel
              Fulfillment（MCF）不收订阅费，只收逐件履约费；这些费用比标准 FBA 费率高 30–50%，但跳过 Amazon 8–15% 的平台佣金，并且自 2026 年 1 月 15
              日起对单件订单进一步涨价。Shopify Plus、VTEX 和 SPS Commerce 销售定制企业合同，而不是公开标价；Cart.com 自身也不发布价格表或类似 BigCommerce、Amazon
              的合同分层结构，使其总拥有成本只能从客户披露的交易规模推断，无法与透明竞争对手做基准对比。这种不对称——Cart.com
              要求企业买方在部分透明、部分不透明的替代方案之间评估一组套餐——本身就是尽调缺口，而非已经解决的比较。
