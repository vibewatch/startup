      - number: '5.3'
        title: 部署模式、支持信号，以及哪些成熟、哪些只是承诺
        blocks:
          - type: paragraph
            body: >-
              Cart.com 的公开成熟度证据，在已经独立发布模块或披露发布细节的地方最强。OMS 于 2024 年初作为独立产品推出；独立行业报道称，WMS 和 TMS 在当年晚些时候也作为独立产品跟进。店铺前台/B2B
              表面拥有最清晰的持续发布轨迹：2026.2 更新日志显示，报价、客户分群控制、SSO
              恢复支持、商品陈列更新，以及无障碍/性能工作都已经进入生产环境。这比含糊的路线图语言更有实质意义，因为它描述的是已经上线的具体功能。


              成熟度较弱的一面，是实施和支持透明度。Cart.com 宣传现代 SaaS 部署和 24/7/365 支持，但公开评价证据混杂：一位 TrustRadius
              评论者称赞规则引擎和多店设置，同时也反馈支持缓慢、报表陈旧。官方文档同样证明开发者接口面存在，却不足以让外界仅靠公开页面轻松审视实施故事。综合看，软件栈已经商业化并越来越产品化，但公开文档还不够丰富，投资者不能把实施风险视为已经解决。
