      - number: '5.2'
        title: 架构、集成表面与支撑这套栈的运营模式
        blocks:
          - type: paragraph
            body: >-
              Cart.com 公开的架构是分层的，而不是单体的。OMS 是编排层，同步订单和库存，并把路由逻辑应用到不同渠道和目的地。WMS 和 TMS
              随后在网络内部执行收货、上架、拣货、打包、发货、退货、劳动力和承运商费率决策。其上是店铺前台和 B2B 采购层，其下则是 ASRS
              系统、输送线、穿梭车、货到人机器人等实物自动化。这让产品架构作为混合软件加运营平台具备可信度，而不只是贴在 3PL 上的营销图。


              集成接口面看起来真实，但透明度不完整。Cart.com 反复称这套栈 API-first，API Tracker 也列出公开文档、webhook、OAuth 工具、playground
              和机器可读规范。但抓取到的官方开发者页面可读文本稀疏，API Tracker 的接口目录在访问时没有枚举实际
              API。实际含义是，公开证据支持其集成姿态和开发者接口面，但仍不足以给外部尽调团队一张干净的接口级地图。因此，架构在业务流程层面的验证强于外部开发者体验层面。
