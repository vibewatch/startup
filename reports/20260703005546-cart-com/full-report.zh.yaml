      - number: '2.2'
        title: 规模测算视角：五个独立市场壳，均为中等置信度，且没有一个专属 Cart.com
        blocks:
          - type: paragraph
            body: >-
              留存的公开来源没有隔离出 Cart.com 专属 SAM 或 SOM，因此本章不用一个膨胀的 TAM，而采用五个独立规模测算视角。仅电商赋能软件，360iResearch 对 2026 年的测算为 $10.69
              billion（B2B 平台软件，13.74% CAGR，至 2032 年 $23.31 billion），Fortune Business Insights 则给出更宽口径的 $13.10
              billion（16.46% CAGR，至 2034 年 $44.32 billion）——这提醒我们，即便是“软件市场规模”也会因口径不同而变化。实物履约层大得多：The Business Research
              Company 测算 2026 年全球 3PL 为 $1,461.13 billion，并以 10.6% CAGR 增至 2030 年 $2,141.68
              billion，尽管这个数字覆盖所有行业，并非只含电商。仓库管理软件存在真实的方法论冲突：Mordor Intelligence 估计 2026 年 WMS 为 $4.77 billion，而
              Precedence Research 采用更宽的软件加服务口径，把同一年估为 $6.78 billion，差距 42%，不能被抹平。最接近 Cart.com “360” 套餐的托管商务层，Research
              and Markets 对 2026 年的测算为 $88.95 billion（13% CAGR，至 2030 年 $146.22 billion）；相邻的仓库自动化/AI 基础设施层，ClickPost 给出的
              2026 年数字为 $34.17 billion（13.98% CAGR，至 2031 年 $65.74 billion）。U.S. Census Bureau 的宏观背景为这些市场壳提供锚点：2026 年 Q1
              美国零售电商达到 $326.7 billion（季调后），占总零售 16.9%，同比增长 9.8%，而总零售增长 3.9%——FRED 的 ECOMPCTSA
              序列也独立印证这一点。这些数字不能相加得出一个站得住脚的 Cart.com TAM；它们只是框定 Cart.com 套餐抽取收入的相邻池子规模。
