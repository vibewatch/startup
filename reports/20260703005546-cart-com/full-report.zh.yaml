  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险 / 下行触发项
      - 概率信号
    rows:
      - - 悲观
        - 收入更接近第三方低端估计，履约经济性主导模型，任何新融资都把估值重置到此前私募标记以下。
        - $0.9B-$1.2B；若按二级市场式下行或较低公开可比公司估值处理，从 $1.6B 入场的新资金几乎没有吸引力回报空间。
        - 已验证的参与型优先权、收入低于约 $250M、客户集中，或降价融资。
        - 风险重大且不能忽视，因为 2024 年二级市场信号已经触及这一区间。
      - - 基准
        - 收入明显高于低端估计，软件占比真实但不占主导，市场给予混合 4x-6x 收入倍数。
        - $1.2B-$1.8B；只有经济性好于公开空头低端假设，当前价格才算合理，但还不到 Shopify 式溢价的顶级水平。
        - 利润率偏弱、债务拖累沉重，或证据显示规模主要来自质量较低的物流量。
        - 以当前公开证据看，这是最能支撑的区间。
      - - 乐观
        - 收入接近 $500M，软件和 AI 工具带来强附着和留存，新资本干净、而非结构负担重。
        - $2.0B-$3.0B；只有 Cart.com 明显比当前公开材料证明的更像软件公司，$1.6B 才会成为有吸引力的入场价。
        - AI 和工作流主张未能转化为经审计的分部经济性。
        - 说得通，但在审计数字出来前证据不足。
      - - 当下入场纪律
        - 除非价格或披露改善，否则不新增一级或二级仓位。
        - 按 $1.6B 入场，回报故事依赖公司尚未公开的事实。
        - 追高风险高，因为上行情景同时需要收入规模和干净结构。
        - 最好把它视为跟踪纪律，而不是估值情景。
    notes: 区间是以 USD 十亿美元计的分析估计，不是管理层指引。范围刻意拉宽，因为公开记录未披露审计收入、利润率或资本结构机制。
