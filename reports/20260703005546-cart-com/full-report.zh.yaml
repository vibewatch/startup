  - id: TV005
    title: 投资论点失效与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 融资重置
        - 经验证的新一轮估值低于约 $1.2B
        - 将验证悲观观点：当前公告估值并不牢固。
        - 对新资金从跟踪调为回避，并重估持有姿态。
      - - 优先股堆栈悬顶
        - 经验证的参与型优先权，或叠加后超过 1x 的优先权
        - 即使收入没有大幅不及预期，也可能摧毁普通股回报。
        - 普通股入场价应按下行情形瀑布分配重定价，而不是按公告投后估值定价。
      - - 收入不及预期
        - 经审计收入明显低于约 $250M
        - 会让 2025 年 $1.6B 锚点更像 6x-9x 故事，而不是 3x-4x 故事。
        - 压缩乐观情景，并锚定较低公开可比区间。
      - - 经济质量不及预期
        - 证据显示履约贡献利润率占主导，而软件经济性偏弱
        - 会把 Cart.com 推向混合物流倍数，而不是高溢价软件倍数。
        - 使用 VTEX / Commerce.com 式区间，而不是软件龙头区间。
      - - 流动性不及预期
        - 退出市场仍关闭时，二级流动性继续稀薄
        - 会限制持有人选择权，并提高对结构化内部人融资轮的依赖。
        - 将该标的视为久期更长、对结构更敏感，而非公告估值所暗示的状态。
    notes: 每个触发项都设计成可证伪。重点是在批准新一轮融资或二级购买前，先定义什么会真正打破估值论点。
    claimRefs:
      - CV033
      - CV035
      - CV036
      - CV037
      - CV042
      - CV047
      - CV048
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入桥接
        - 按分部拆分的 2025 年和 2026 年截至目前收入，以及 ARR 或软件收入桥接
        - 这是判断 $1.6B 估值究竟接近收入 3x 左右还是 9x 左右的最大变量。
        - 财务尽调；审计报表和管理层模型审查。
      - - 毛利率和贡献经济性
        - 按软件、履约和服务拆分的毛利率；设施贡献利润率
        - 需要用它判断 Cart.com 更接近软件还是物流可比区间。
        - CFO / FP&A 审查，附设施级队列经济性。
      - - 当前股权结构表和股数
        - 完全摊薄股数、股权类别、期权池、认股权证，以及如有的 SAFE
        - 没有分母，二级市场报价和投后估值标记都无法落到可执行价格。
        - 向法务和财务数据室索取。
      - - 优先股权利
        - 各轮清算优先权、股息、参与权、棘轮条款和转换机制
        - 如果股权结构保护性强，表面估值会高估普通股回报。
        - 章程、投资条款书和融资律师审阅。
      - - 债务及契约条款包
        - BlackRock 融资额度、期限、契约、摊还和任何再融资瀑布
        - 债务条款会影响下行情景韧性和退出收益。
        - 资金管理 / 贷款方尽调及信贷协议审阅。
      - - 客户集中度与留存
        - 头部客户占比、NRR、流失率和收购后留存
        - 需要判断公开品牌名单能否变成持久定价权。
        - 收入运营和队列分析审阅。
    notes: 这些索取项刻意设为机械清单。它们盯住决定入场价格、稀释和退出价值的缺失事实，而不是泛泛的尽调卫生项。
    claimRefs:
      - CV014
      - CV035
      - CV036
      - CV037
      - CV045
      - CV046
      - CV049
