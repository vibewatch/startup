  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：统一商务是一组相邻支出池，不是单一品类
        blocks:
          - type: paragraph
            body: >-
              Cart.com 自称是一家统一商务和物流提供商，让 B2C 和 B2B
              品牌跨店铺前台、平台和社交渠道同步商品、定价、库存与订单，并由美国全国履约网络完成实物执行。这个自我描述至少横跨四个分析师分开测算的支出池：电商赋能软件（OMS/PIM/店铺同步）、外包
              3PL/履约服务、平台管理和增长营销，以及客户互动/支持。Cart.com 自己的首页把这些能力包装成模块化产品——品牌可以只买履约、只买软件，或购买完整的 “360 Managed Commerce”
              套餐——这一点很重要，因为它意味着 Cart.com 同时和纯软件厂商、纯 3PL、全服务代理商竞争，而不是面对一组单一竞争对手。边界明确排除 Cart.com
              不变现的品类：长途货运/卡车承运、卡组织支付经济，以及与商务运营无关的通用 ERP/财务软件。2026 年边界中一个值得注意的新增项，是贸易政策驱动的回流：Cart.com
              自己的营销现在强调帮助“九位数品牌在贸易政策变化中数日内把数百万件商品回流美国”，这把其美国仓储模式直接连到第 4 章所述的小额免税和关税变化。实际结论是，Cart.com
              的可服务市场应当按一组相邻、单独测算的品类评估，而不是用一个宽泛的“电商市场”数字概括；单一混合 TAM 会夸大软件机会，也低估资本密集型物流机会。
