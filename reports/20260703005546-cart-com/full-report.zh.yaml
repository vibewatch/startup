      - number: '2.3'
        title: 买方地图：企业品牌、中端 DTC、剥离物流的零售商与平台卖家
        blocks:
          - type: paragraph
            body: >-
              Cart.com 披露的客户基础——TOMS、PacSun、Janie and Jack，以及其声称全球 6,000
              多名客户——指向四类不同买方，而不是一个笼统的“电商品牌”细分。企业级全渠道品牌是最清晰的适配对象：TOMS 选择 Cart.com 作为美国履约伙伴，以获得软件驱动的库存管理；PacSun 走得更远，直接把
              Ohio 州 Groveport 占地 2 million 平方英尺的自动化仓库所有权转给 Cart.com——这一买方信号已经超出服务合同，进入实物资本剥离。中端 DTC
              和消费品牌是第二类，它们被客户获取成本上升，以及在不增加内部团队的情况下打包履约、营销和支持的需求吸引；该细分与 Ringly.io 测算的全球 DTC 市场重叠，2026 年规模为 $319.57
              billion（7.8% CAGR），其中美国 DTC 电商为 $212.9 billion，占美国零售电商 19.2%。第三类是主动剥离自有物流基础设施的零售商——PacSun
              交易直接证明了这一点；这是一种不同于从未拥有仓库品牌的工作流。第四类是多渠道平台卖家：Marketplace Pulse 数据显示，Amazon 在美国第三方销售额约 $300 billion，eBay 为
              $39 billion；Walmart 和 TikTok Shop 的美国 GMV 各自已达约 $15 billion（Walmart 从 $10 billion 增长并突破 200,000 名卖家；TikTok
              Shop 同比增长 68%）；Shopify 全球 GMV 在 2025 年已升至 Amazon 平台 GMV 的 66%（2020 年为 40%）。同时在其中三个或更多渠道销售的品牌，最可能需要
              Cart.com 的统一库存和履约层，而不是单渠道工具。
