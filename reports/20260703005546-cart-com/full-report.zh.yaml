        title: 锁定、分发触达与伙伴准入
        blocks:
          - type: paragraph
            body: >-
              这个竞争图谱中，分发触达因设计而不同。Pattern Inc. 于 2025 年 9 月在 Nasdaq IPO，发行价 $14，募资 $300 million；它在 Amazon、Alibaba、TikTok
              Shop、Walmart、Coupang 和 Mercado Libre 等平台运营库存买断型电商加速器模式，但 2024 年约 94% 收入仅来自
              Amazon，把分发触达集中在一个自己无法控制的零售渠道。相比之下，SPS Commerce 连接超过 50,000 名订阅客户与零售商 EDI 网络，每年处理超过 $650 billion
              GMV；Rithum（前身为 CommerceHub 和 ChannelAdvisor，2018 年以 $1.1 billion 私有化，2023
              年更名）运营一个覆盖品牌、零售商和平台的伙伴网络，支持刊登、库存和代发货集成。VTEX 自身披露存在值得标出的内部不一致：其投资者关系页面称 FY2025 约 2,200 名客户、44 个国家的 3,100
              家门店，而公开营销首页声称“3,500+ 企业客户”和 43 个国家——两个官方 VTEX 来源对同一个头部指标并不一致。Cart.com 自己的客户名单（TOMS Shoes、PacSun、Janie and
              Jack）证明了真实的企业级牵引力，但公司没有披露达到 SPS Commerce 或 VTEX 公开规模的订阅客户数或已处理 GMV，直接规模对比因此困难。
