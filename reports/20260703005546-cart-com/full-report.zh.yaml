        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Cart.com 的公开领导层在 2025–2026 年异常活跃，公司自己的新闻室在五个月内宣布了三位 C-suite 任命：Sam Bowman 出任 Chief Marketing Officer（2025
              年 8 月），Gregg Zegras 出任 Chief Revenue Officer（2025 年 9 月），此前任 Blue Yonder Platform Engineering Corporate
              Vice President 的 Arjun Sainath 出任 Chief Technology Officer（2025 年 10 月）。Cart.com 收购 Guthy-Renker 的 OceanX
              履约部门后，Guthy-Renker 联合创始人 Bill Guthy 于 2025 年 4 月加入董事会；Springcoast Partners 运营合伙人 Russell Klein 随 2026 年 3
              月融资加入董事会。本章审阅的每一则融资、收购和领导层公告中，被引用的公开人物只有创始人兼 CEO Omair Tariq，说明关键人物依赖高度集中；执行董事长 Jim Jacobsen
              虽有董事会角色，公开能见度更低。除两位创始人和近期高管任命外，唯一找到的董事会名单来自 Tracxn 的第三方汇总，列出 15 名活跃成员，其中多项似乎是姓名变体重复（例如分别出现“Jim
              Jacobsen”和“Jim Jacobson”）。因此，本章仅把完整董事会构成视为部分确认，等待公司正式发布名单。
