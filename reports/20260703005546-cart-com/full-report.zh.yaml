    title: 扩张和集中度风险表
    columns:
      - 扩张驱动因素
      - 集中度风险
      - 影响
      - 尽调路径
    rows:
      - - 靠收购扩张客户名单（Amify 50+ 个品牌、OceanX 25+ 个品牌、Foundry Brands 4 个品牌）
        - 承接来的客户可能已有流失风险，或对 Cart.com 的忠诚度较低
        - 客户数和 GMV 快速增加，但过渡后留存记录尚未验证
        - 索取每个被收购客户客群的收购后留存率
      - - Amazon 渠道平台卖家依赖（Amify 和 Foundry Brands 授权）
        - 集中在单一第三方渠道（Amazon），受 Amazon 政策或费用变化影响
        - 渠道层面的平台风险不在 Cart.com 直接控制之内
        - 评估托管 GMV 中专门依赖 Amazon 平台的占比
      - - 品牌授权组合集中（Authentic Brands Group）
        - 如果覆盖 Authentic 全部品牌名单，一个组合客户关系可能在品牌数或收入中占比过高
        - 一个组合客户的续约决定或服务范围缩减，可能对披露指标造成不成比例影响
        - 索取 GMV 或收入中来自第一大和前 10 大客户的占比
      - - GMV 增至 $10B+，但对外客户数仍为 6,000+
        - 暗示增长来自存量账户扩张（upsell），而非新增 logo；单账户集中度随之上升
        - 如果少数账户占据更大 GMV 份额，流失一个大客户的影响会更大
        - 索取 logo 数历史和单客户 GMV 分布
      - - 公共部门 / 联邦机构扩张
        - 政府合同带有采购、预算周期和政治风险，商业客户没有这类风险
        - 摆脱零售集中，但引入新的风险类别
        - 索取联邦合作的合同载体类型、期限和续约历史
      - - 合同最低承诺或终止条款未公开披露
        - 各细分市场客户退出难度未知
        - 无法独立评估切换成本或客户锁定
        - 索取标准 MSA 的终止通知期和自动续约退出条款
