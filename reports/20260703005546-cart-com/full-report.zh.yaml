      - number: '6.2'
        title: 采用轨迹与具名客户证明
        blocks:
          - type: paragraph
            body: >-
              Cart.com 的增长轨迹只能从少数时点披露里看到，而不是一条公开时间序列。2024 年 7 月 Series C 融资时，Cart.com 报告 6,000+ 客户、14 个全渠道设施、年 GMV 超过 $8
              billion [CU006][CU007]；到 2026 年 3 月，GMV 已超过 $10 billion，披露的客户总数仍是“6,000+”，设施数量则增至 18 个 [CU005][CU013
              context]。合在一起看，GMV 和设施版图上升、披露口径 Logo 数持平，本章据此推断：2024 年以来的增长更依赖既有账户扩张和收购带来的客户名单扩容，而不是已确认的新 Logo 增长
              [CU033][CU034][CU035]。具名客户证明直接支持收购驱动的扩张通道：生产规模部署包括 PacSun 位于 Ohio 州 Groveport 的 200 万平方英尺设施交接
              [CU009][CU010]、Authentic Brands Group 的商户记录方与客服合作且由四家独立出版方交叉印证 [CU021][CU022][CU023][CU024]、OceanX
              继承来的美妆品牌名单 [CU018][CU019][CU020]，以及由 Amify 和 Foundry Brands 管理的 Amazon 市场平台卖家名单；后者在 2026 年 3 月刚发布，并包含 CEO
              具名背书 [CU012][CU015][CU016][CU017]。这些关系无一例外都体现生产运营迁移——设施交接、Amazon 渠道接管或商户记录方搭建——而不是试点，但没有任何一项披露量化成本或服务级别结果
              [CU043]。
