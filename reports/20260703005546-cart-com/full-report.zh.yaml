companyProfile:
  summary: >-
    Cart.com 是一家总部位于 Houston 的私营统一商务和物流公司，成立于 2020 年，由联合创始人兼 CEO Omair Tariq 领导。公司把全渠道履约基础设施，与订单、仓库和运输管理软件、店铺前台和 B2B
    商务工具、merchant-of-record 能力，以及通过 OceanX、Amify 等收购扩展的平台服务组合在一起。公开客户证据覆盖企业级服饰和鞋履品牌、品牌组合、美妆品牌、平台卖家和联邦机构。Cart.com
    已经跑出可观规模，但公开披露仍不均衡：客户数和 GMV 比经审计收入、利润率、债务条款或留存指标更清晰。
