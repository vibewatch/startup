      - number: '7.4'
        title: 合作伙伴 / 依赖风险
        blocks:
          - type: paragraph
            body: >-
              Amazon 是 Cart.com 子公司 Amify 背后的主导市场平台渠道；Cart.com 2024 年 4 月收购 Amify，目的正是强化 Amazon 市场平台管理能力。Marketplace
              Pulse 估算 Amazon 美国第三方市场平台销售额约 $300 billion，是 eBay 的七倍多。Amazon 2026 年卖家执法更多依赖 AI
              驱动检测，卖家反馈申诉窗口比以往更短、驳回率更高；这类政策执法风险可能扰乱 Amify 管理的任何 Amazon 依赖客户收入，尽管没有来源披露该集中度实际占 Cart.com
              收入或客户基础的比例。Shopify 是第二个主要平台依赖：其全球 GMV 在 2025 年达到 Amazon 市场平台 GMV 的约 66%（2020 年约 40%），2025 年 12 月 1 日 Cyber
              Monday 曾发生数小时宕机；而 Shopify 自己 2019–2023 年先建设、后完全剥离自有履约网络（出售给 Flexport，并裁员约 20%）的历史，是 Cart.com
              现正运营的自有履约模式所内含资本强度和可逆性风险的直接先例。资本侧，Cart.com 于 2024 年 7 月获得 BlackRock 管理的 $105 million 定期贷款，并于 2026 年 3 月完成
              Springcoast Partners 领投的 $180 million 成长股权融资，显示公司仍能接触机构资本，但再融资风险集中在少数交易对手上，其契约和利率条款并不公开。全国包裹承运商 UPS、FedEx
              和 USPS 仍是最后一公里分包商；它们 2026 年费率上调会压缩 Cart.com 及其客户的利润率。
