      - number: '6.3'
        title: 证据质量、满意度与负面信号
        blocks:
          - type: paragraph
            body: >-
              关于客户满意度，独立证据很薄，且偏向较小的评价聚合平台。本次研究能够访问 TrustRadius、Tekpon、Slashdot 和 SourceForge 上的 Cart.com 条目，但 G2 和
              Trustpilot——通常是流量最高的 B2B 软件评价平台——在实时页面和归档副本抓取中都返回阻断或不可用，留下真实的独立证据缺口 [CU044]。可访问内容呈现混合信号：一位 TrustRadius
              评价者称 Cart.com 技术支持“相当慢”，解决一个简单问题可能需要“几天到一周”，并另外指出报表能力“过去 4 年没有变化”；这是本章找到的最强客户来源负面证据
              [CU025][CU026]。SourceForge 显示聚合评分为零，这更像是独立评价密度有限的信号，而不是正面或负面结论 [CU028]。另一个负面框架来自竞争对手 Speed Commerce
              的内容，它把自家“100% 自有运营”和“有保证的 SLA”拿来对比 Cart.com 多主体、靠收购拼装的履约模式；该表述应因竞争偏见而打折，但它点名了一个值得直接向 Cart.com
              或其客户验证的具体结构性问题：并购后运营一致性 [CU029]。本章证明表里的具名客户关系都没有量化结果指标，因此证据质量最强的是关系存在和运营范围，最弱的是已展示的业务影响。
            claimRefs:
