      - number: '6.5'
        title: 扩张驱动与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Cart.com 自 2024 年以来的扩张在很大程度上由收购驱动：2024 年 4 月 Amify 交易增加 50+ 个 Amazon 市场平台卖家品牌，2024 年 12 月 OceanX 交易增加 25+
              个名人和美妆品牌；两者都是继承既有客户名单，而不是靠 Cart.com 自己的新 Logo 销售动作赢来
              [CU012][CU018][CU035]。这种继承模式引入了独立的集中度和留存风险：被收购客户可能原本忠于被收购运营公司，而不是 Cart.com
              本身；没有来源披露任一客户群的收购后留存率。第二条集中度向量是渠道依赖——Amify 和 Foundry Brands 的市场平台卖家委托都把客户价值具体导向 Amazon，因此平台层面的政策或费用变化不在
              Cart.com 控制之内 [CU015][CU017]。第三条向量是组合集中：Authentic Brands Group
              关系代表一个签约交易对手，覆盖数量未披露的底层授权品牌，因此一次续约决定可能不成比例地影响 Cart.com 报告的品牌数量指标 [CU021][CU034]。最后，披露口径客户总数稳定在 6,000+，而
              GMV 在 2024 年中至 2026 年从约 $8 billion 增至超过 $10 billion；这既可能是既有账户内追加销售驱动的扩张，也可能只是客户数披露未更新。Cart.com
              没有说明是哪一种，已审阅来源也没有给出头部客户集中度百分比来直接量化风险 [CU032][CU033][CU034]。
            claimRefs:
