      - number: '3.2'
        title: 软件优先既有厂商：Shopify、BigCommerce、VTEX
        blocks:
          - type: paragraph
            body: >-
              Shopify、BigCommerce 和 VTEX 都在企业级规模销售商务软件，但它们进入实物履约的深度差异很大。Shopify 曾建立、随后放弃自有履约野心：2019 年 6 月推出 Shopify
              Fulfillment Network，同年晚些时候以约 $450 million 收购仓库机器人公司 6 River Systems，2022 年又以 $2.1 billion 收购履约技术公司
              Deliverr；随后在 2023 年 5 月把整个物流业务卖给 Flexport，并裁员 20%，公开把自有履约称为“支线任务”，而不是核心战略。BigCommerce（近期以母公司名称
              Commerce.com 运营，同时保留股票代码 CMRC）和 VTEX 则保持纯软件路线，依赖第三方履约伙伴，并发布透明的 GMV
              分层定价（BigCommerce）或企业订阅合同（VTEX），而不是打包仓储。Shopify 2019–2023
              年这段轨迹，清楚提醒了自有履约押注多么资本密集且可逆，即便是资金充足的软件既有厂商也不例外；这也凸显 Cart.com 的打包模式带有纯软件同行选择回避的执行风险。
