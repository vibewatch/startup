      - number: '7.2'
        title: 监管 / 法律风险
        blocks:
          - type: paragraph
            body: >-
              Cart.com, Inc. 现为一起违约诉讼的活跃被告（Lubic v. Cart.com, Inc., No. 4:25-cv-04809, U.S. District Court, S.D. Texas,
              Houston Division）；案件于 2025 年 10 月 8 日提交，截至第二次修订起诉状（2026 年 3 月 30 日）和 Rule 26(f) 计划报告（2026 年 3 月 2
              日）仍在证据开示阶段，案卷中没有条目披露损害赔偿金额、准备金或和解状态。另一个风险来自 California Warehouse Quotas law（AB
              701）：该法要求仓库雇主向工人书面告知任何生产率配额，并禁止阻碍用餐、休息、如厕或安全要求合规的配额；法规有真实执法力度，California Labor Commissioner 2024 年就
              Amazon.com Services, LLC 在南 California 两个仓库的 59,017 项违规开出近 $5.9 million 罚单。没有已审阅来源确认 Cart.com 披露的 17–18
              个履约设施是否位于 California，因此该先例仍不能转换成公司特定敞口估算。贸易政策风险是双向且当前发生的：美国自 2025 年 8 月 29 日起在全球范围暂停商业货件 de minimis
              关税豁免；欧盟则将至少到 2026 年对低价值进口包裹收取临时统一处理费（每件 EUR 2–3）。Cart.com 未披露跨境货件占比，也未披露成本转嫁政策。California 的 CCPA/CPRA
              经修订后自 2026 年 1 月 1 日生效，新增数据经纪人和自动化决策技术披露义务，而 Cart.com 的服务条款没有具体回应这些义务。
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
