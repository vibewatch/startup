      - number: '8.4'
        title: 流动性、退出准备度、论点破裂点与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出问题与其问 Cart.com 最终能否达到上市公司准备状态，不如问持有人在那之前如何拿到钱。CB Insights 称 2026 年一季度全球退出降至近两年低点，而私营公司二级交易继续填补缺口；这比 IPO
              优先的叙事更贴近 Cart.com 当前处境。Cart.com 2026 年 3 月让 Russell Klein
              加入董事会，释放出雄心，也体现一定上市路径经验；但同一新闻稿把本轮融资描述为强化资产负债表并支持可持续盈利，这不是一家经济模型已经完全验证的公司会使用的语言。因此，论点应被具体事件打破，而不是被情绪打破：低于约
              $1.2 billion 的融资、已验证的参与型或叠层优先股条款、低于约 $250 million 的收入，或证据显示履约经济性主导软件式利润率生成，都会把公司推出溢价档。最终尽调要求也相应机械：经审计的
              2025–2026
              年分业务收入和毛利率、债务和契约细节、当前股本数量、优先股权利、客户集中度，以及实时二级市场深度。在这些信息可用前，本章能支持继续跟踪和内部人有纪律地持有，但不能支持在当前披露口径估值下高信心新买入。
