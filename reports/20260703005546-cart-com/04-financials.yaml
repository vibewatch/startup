- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Annual GMV processed (most recent disclosed)
    - $8B+ (as of mid-2024)
    - medium
    - GMV is the closest disclosed scale proxy to revenue for a platform that also monetizes on take rate/fees
    - Request the trailing-twelve-month GMV figure and the take rate applied to it
  - - GMV per customer (derived proxy)
    - ~$1.3M+ per customer per year (derived from $8B+ GMV / 6,000+ customers)
    - low
    - Indicates a mid-market/enterprise customer base rather than a long-tail SMB base, shaping expected contract size and churn risk
    - Request the actual customer-size distribution rather than an averaged proxy
  - - Annual revenue (as distinct from GMV)
    - null (range $175.2M-$500M across conflicting sources)
    - low
    - Revenue, not GMV, is what determines valuation multiples and cash generation; the two are conflated across public sources
    - Request audited or management-reported trailing revenue
  - - Revenue per employee (derived proxy)
    - ~$210,294 (Growjo-derived, implying ~833 employees)
    - low
    - A services/logistics-blended revenue-per-employee figure well below pure-software SaaS benchmarks signals a labor-intensive cost structure
    - Request actual headcount and a revenue-per-FTE figure segmented by revenue line
  - - Gross margin
    - 'null'
    - low
    - Gross margin determines how much of GMV/revenue growth converts into cash the company can reinvest or use to service debt
    - Request segment gross margin for fulfillment vs. software vs. services vs. merchant-of-record
  - - Customer acquisition cost / payback period
    - 'null'
    - low
    - No CAC or payback data is available; the $5M domain-name investment and 6-12 month cross-sell cadence are qualitative GTM signals only
    - Request blended and channel-level CAC and payback period
  - - Customer concentration (top 10 accounts as % of revenue)
    - 'null'
    - low
    - Concentration risk is invisible in aggregate customer-count and GMV figures; named enterprise logos (Authentic Brands Group, TOMS, PacSun, Janie and Jack) suggest some large-account dependence
    - Request customer concentration and contract-renewal schedule
  notes: Every null in this table reflects a metric Cart.com does not publicly disclose; derived proxies are explicitly labeled and should not be read as audited figures.
