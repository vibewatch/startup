- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it's missing
  - Impact on underwriting
  - Diligence path
  rows:
  - - Audited revenue, gross margin, EBITDA, net income
    - Cart.com is a private company under no obligation to disclose GAAP financials; only SEC Form D notices (which report offering size, not operating results) are public
    - Cannot compute a reliable revenue multiple, margin trend, or profitability trajectory; existing figures range from $175.2M to ~$500M
    - Request audited or reviewed financial statements as part of a data room
  - - Cash on hand, burn rate, runway
    - Not disclosed in any press release, filing, or interview reviewed
    - Cannot assess whether the March 2026 raise is discretionary or defensive
    - Request a cash-flow statement and 12-month forecast
  - - Post-money valuation of the March 2026 $180M round
    - Press coverage of the round did not include a new valuation figure; only the pre-round CB Insights estimate (~$1.6B) is public
    - Cannot benchmark the newest round's pricing against the May 2025 mark or assess dilution
    - Request cap table and valuation memo for the March 2026 round
  - - Customer concentration and segment profitability
    - Not disclosed; only aggregate customer count (6,000+) and named enterprise logos are public
    - Cannot assess dependency risk on any single large account or M&A-acquired customer relationship
    - Request customer concentration schedule and segment P&L
  - - BlackRock term loan terms (rate, maturity, covenants, draw)
    - Debt agreements are private commercial contracts, not required to be publicly filed
    - Cannot assess default risk, covenant headroom, or true net-of-debt capital position
    - Request the credit agreement or a covenant-compliance summary
  - - Reconciled lifetime funding total
    - Company, CB Insights (via press), Growjo, and Tracxn report different cumulative totals ($475M-$1B+) without a shared methodology
    - Cannot compute capital efficiency (revenue or GMV per dollar raised) with confidence
    - Request a capitalization table or investor-relations funding summary
  notes: This table lists private metrics no reviewed public source discloses, distinct from the metrics that are disclosed but conflict across sources (see the capital adequacy and unit economics tables).
