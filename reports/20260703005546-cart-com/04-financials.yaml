tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Public anchor
  - Current status
  - Revenue-quality view
  - Diligence ask
  rows:
  - - Fulfillment & logistics
    - Storage, pick-pack, inbound/outbound handling, and shipping across owned omnichannel warehouses
    - Cart.com homepage and blog list Fulfillment & Logistics as a core product line; 8.5M+ sq ft and 14-18 facilities cited across sources
    - Active, largest disclosed footprint
    - Likely the largest revenue base but is also the most labor- and capex-intensive; take rate undisclosed
    - Request fulfillment revenue as a % of total revenue and gross margin by facility
  - - Commerce software (OMS/WMS/TMS, marketplace management, feed marketing)
    - Software fees for order, warehouse, and transportation management plus marketplace/feed-marketing tooling ('Constellation OMS')
    - Cart.com site navigation lists Commerce Software as a distinct product category; BlackRock press coverage names 'Constellation OMS' explicitly
    - Active, officially listed
    - Highest-margin potential line if sold standalone, but company does not disclose software-only revenue or attach rates
    - Request software-only ARR/ARR-equivalent separate from bundled fulfillment contracts
  - - Merchant of record / payments
    - Manages payment processing, chargebacks, refunds, and sales-tax calculation/remittance on behalf of client brands
    - WWD reporting on the Authentic Brands Group partnership explicitly describes Cart.com's merchant-of-record services
    - Active, at least one named enterprise client (Authentic Brands Group)
    - Payments/tax services can carry take-rate economics, but no disclosed basis-point or percentage fee exists
    - Request merchant-of-record take rate and payment volume processed
  - - Commerce services (growth marketing, marketplace services, customer engagement, store optimization)
    - Retainer- or project-based services for paid media, SEO, Amazon/marketplace optimization, and customer support
    - Cart.com site navigation lists Commerce Services as a category; Amify acquisition (2024) added Amazon marketplace optimization/advertising
    - Active; expanded via M&A rather than solely organic build
    - Founder has publicly acknowledged selling a services capability (Amazon marketplace optimization) before it was fully mature, a quality flag on this line specifically
    - Request services-line revenue mix and post-acquisition integration status for Amify
  - - B2B commerce platform
    - Platform for B2B ordering, inventory, and channel management distinct from B2C-oriented tooling
    - Cart.com site navigation lists a dedicated B2B Commerce Platform product
    - Active, officially listed
    - Scope and revenue contribution versus the B2C-oriented lines is not disclosed
    - Request B2B-platform customer count and revenue contribution
  - - Acquired fulfillment/services capacity (OceanX, Amify, and other 2024-2025 acquisitions)
    - Inorganic revenue and capacity added through acquisition rather than organic sales
    - Cart.com's May 2025 press release cites the OceanX (Guthy-Renker fulfillment) and Amify acquisitions as completed in the prior twelve months
    - Active, integrated into the broader platform
    - M&A-driven revenue can carry integration and customer-retention risk not visible in aggregate GMV/customer-count figures
    - Request post-acquisition customer retention and revenue contribution for each disclosed acquisition
  notes: Rows separate the revenue lines Cart.com discloses through its own site navigation and press releases from the realized economics (take rates, margins, standalone revenue) that remain undisclosed for every line. No figure in this table is an audited revenue split.
