company:
  name: Cart.com
chapter:
  number: 4
  title: Financials
  summary: |-
    Cart.com discloses real commercial scale -- GMV growing from roughly $5 billion in 2022 to more than $8 billion by 2024, over 6,000 customers, and access to institutional debt and equity capital including a March 2026 $180 million Springcoast-led round -- but discloses almost nothing about revenue, margin, cash, or debt terms, and its own press releases, SEC Form D filings, and third-party trackers disagree with each other on funding totals, debt size, and implied revenue by wide margins.
sections:
- id: revenue-streams-and-monetization
  title: Revenue streams and monetization across software, fulfillment, payments, and services
  body: |-
    Cart.com's own product taxonomy points to four distinct commercial categories rather than a single monetization engine: Fulfillment & Logistics, Commerce Software (order, warehouse, and transportation management plus marketplace/feed-marketing tools branded Constellation OMS), a B2B Commerce Platform, and Commerce Services (growth marketing, marketplace services, customer engagement, store optimization). Merchant-of-record functionality -- payment processing, chargeback management, and sales-tax calculation and remittance -- sits alongside these lines and is explicitly documented in independent coverage of Cart.com's partnership with Authentic Brands Group, not merely in Cart.com's own marketing copy.

    The company has also grown at least one of these lines inorganically: the 2024 acquisition of Amify added Amazon marketplace-optimization and advertising capability to the Commerce Services line, following an earlier acquisition of OceanX, the fulfillment operation of Guthy-Renker. That inorganic growth pattern matters for revenue-quality assessment because it means some current revenue is acquired rather than organically built, and because founder Omair Tariq has publicly acknowledged that Cart.com's "biggest mistake" was cross-selling an immature capability (Amazon marketplace services) to existing fulfillment customers before that capability was ready, requiring months of relationship-repair "apology tours." That is a rare, self-disclosed instance of monetization outrunning delivery capability, and it is the clearest revenue-quality caveat available in the public record.

    On pricing, Cart.com's own blog content and third-party listings (TrustRadius) agree on one point: there is no public price list. Fulfillment, software, merchant-of-record, and services pricing are all sold through consultative, volume- and complexity-dependent quotes. That is common in enterprise 3PL and commerce-enablement markets, but it also means every pricing figure available to outside analysts is either a generic industry benchmark or a customer-specific negotiated number -- never Cart.com's own list price.
