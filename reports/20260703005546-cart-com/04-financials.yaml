- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy, debt, and financing dependency
  body: |-
    Cart.com's financing history combines primary equity, at least one large consolidated venture-debt facility, and acquisition activity, and SEC Form D filings provide a rare independently verifiable cross-check on the company's own funding announcements. A Form D filed in March 2023 reported a $44.5 million total offering sold to 9 investors through placement agent FTP Securities LLC -- a different number from both the $60 million figure in Cart.com's own press release and the $68.56 million figure an independent tracker (Prime Unicorn Index) used for what appears to be the same Series C round. A similar pattern recurs in 2025: Cart.com's own May 12, 2025 press release cites a $50 million raise and a $1.6 billion valuation, but the Form D amendment filed two weeks later (2025-05-27) reports $73.68 million already sold against an $81.25 million authorized offering -- about $23.7 million more than the announced headline number, with no public reconciliation.

    Debt tells a similar story. Trade press (Pulse2, ABF Journal, FT Partners) all describe a $105 million BlackRock-managed term loan in July 2024 explicitly structured to "consolidate" prior venture debt "at competitive terms." Houston InnovationMap's May 2025 article instead describes "$130 million in debt funding" for what appears to be the same 2024 event -- a $25 million discrepancy this chapter cannot resolve from public sources. Independently, Prime Unicorn Index's secondary-market data shows Cart.com's implied valuation fell to roughly $902 million in early 2024 (a 36.9% drop in secondary share price from the Series C reference price), temporarily costing the company its "unicorn" classification before it recovered to a company-stated $1.6 billion by May 2025.

    As of the March 2026 $180 million Springcoast-led round, no reviewed source discloses a new post-money valuation, and no corresponding Form D yet appears in Cart.com's SEC EDGAR history (whose most recent listed filing is the May 2025 amendment). CEO Omair Tariq's own quote framing the round as strengthening "our balance sheet" and providing flexibility to "pursue sustainable profitability as we grow" is itself evidence that company-wide profitability had not yet been reached or at least not been publicly claimed as achieved.
