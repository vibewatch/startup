callouts:
- calloutType: risk
  title: Revenue estimates disagree by roughly 3x with no public reconciliation
  body: Growjo's algorithmic 2026 estimate of $175.2 million in annual revenue sits far below founder Omair Tariq's own 2024 interview claim that revenue was approaching roughly $500 million around Cart.com's four-year mark. No audited figure exists to resolve the gap, and any revenue multiple applied to this company should be treated as a range, not a point estimate, until management discloses trailing revenue directly.
  claimRefs:
  - CI014
  - CI015
  - CI016
- calloutType: risk
  title: Cart.com briefly lost 'unicorn' status on secondary-market data in 2024
  body: Independent secondary-market tracking (Prime Unicorn Index) shows Cart.com shares traded down 36.9% from the Series C reference price in early 2024, implying a valuation near $902 million versus the $1.2 billion Series C headline -- a real, market-priced valuation decline that predates the company's subsequent recovery to $1.6 billion by May 2025.
  claimRefs:
  - CI036
  - CI037
- calloutType: assumption
  title: Every profitability reference in company disclosures is forward-looking, not a present-tense claim
  body: Across both the July 2024 BlackRock term-loan announcement and the March 2026 Springcoast-led round, CEO Omair Tariq's quotes describe profitability as something the company is 'pursuing' or 'driving toward,' not something already achieved. Absent an audited income statement, this chapter assumes Cart.com is not yet consistently profitable company-wide, pending direct disclosure.
  claimRefs:
  - CI039
  - CI040
- calloutType: recommendation
  title: Prioritize a reconciled financial data room over additional press-release corroboration
  body: Because press releases, SEC Form D filings, and third-party trackers already conflict on round sizes, debt-facility size, and lifetime funding total, further open-source search is unlikely to resolve these gaps. The highest-value next diligence step is a management-provided data room covering audited financials, the BlackRock credit agreement, and a customer-concentration schedule.
  claimRefs:
  - CI021
  - CI024
  - CI030
  - CI035
