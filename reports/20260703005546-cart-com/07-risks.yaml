callouts:
- calloutType: risk
  title: Active federal lawsuit with undisclosed exposure
  body: Cart.com, Inc. is an active defendant in Lubic v. Cart.com (No. 4:25-cv-04809), still in discovery
    as of March 2026, with no public damages figure, reserve, or settlement status.
  claimRefs:
  - CR005
  - CR006
- calloutType: risk
  title: Dual US/EU cross-border tariff exposure, unquantified
  body: The 2025 U.S. de minimis suspension and the EU's 2026 flat-fee regime both raise cross-border
    shipping costs, but no source discloses what share of Cart.com's business depends on cross-border
    DTC shipping.
  claimRefs:
  - CR011
  - CR012
  - CR013
- calloutType: assumption
  title: Headcount and liquidity disclosure gaps treated conservatively
  body: This chapter treats the unreconciled 878-versus-1,600+ headcount figures and the total absence
    of cash-runway disclosure as material risk factors in their own right, not merely as reporting noise.
  claimRefs:
  - CR003
  - CR038
  - CR039
- calloutType: recommendation
  title: Prioritize a liquidity and compliance-attestation data room
  body: Before further commitment, request audited financials and cash-runway disclosure, a SOC 2/PCI
    attestation, and reconciled current headcount -- the three gaps that most limit this chapter's ability
    to size overall risk.
  claimRefs:
  - CR003
  - CR018
  - CR040
- calloutType: strength
  title: Institutional-grade capital partners despite disclosure gaps
  body: Independent SEC filings and named financial-advisory credits corroborate continued access to institutional
    capital (BlackRock, Springcoast Partners), a positive counterweight to this chapter's disclosure-opacity
    concerns.
  claimRefs:
  - CR032
  - CR044
- calloutType: insight
  title: Shopify's fulfillment retreat is a live precedent for Cart.com
  body: Shopify built and then fully divested an owned-fulfillment network within four years, illustrating
    the capital intensity and reversibility risk inherent in the same owned-fulfillment bet Cart.com is
    making at scale.
  claimRefs:
  - CR031
