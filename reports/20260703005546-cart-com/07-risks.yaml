- id: financial-model-and-risk-transmission
  title: Financial / model risk and risk transmission
  body: 'Third-party revenue estimator Growjo projects Cart.com''s 2026 annual revenue at $175.2 million,
    an estimate not corroborated by any audited or company-disclosed figure, which materially limits the
    precision with which any risk in this register can be expressed as a percentage of revenue. Cart.com''s
    continued capital access is nonetheless independently corroborated by both a primary-tier SEC Form
    D/A filing (May 27, 2025, reporting $73,681,890 sold against an $81,249,925 authorized offering across
    13 investors) and a named financial-advisory deal credit (FT Partners on Cart.com''s Series C financing),
    though neither source discloses the BlackRock term loan''s rate, maturity, or covenant terms. Risk
    transmits into Cart.com''s model through three primary channels, mapped in the risk transmission figure
    (FR002): regulatory/legal risk transmits mainly through compliance cost and potential legal judgment
    charged against undisclosed cash reserves; partner/dependency risk transmits through both client-side
    revenue (marketplace-tied managed-service fees) and Cart.com''s own cost structure (carrier-rate pass-through),
    so a single adverse platform or carrier event can compress margin and revenue simultaneously; and
    people/execution risk transmits indirectly into financing risk, because unresolved workforce- and
    governance-disclosure gaps reduce the confidence any future lender or equity investor can place in
    Cart.com''s reported operating metrics during diligence.'
  claimRefs:
  - CR043
  - CR044
  - CR045
  - CR046
  - CR047
  - CR048
