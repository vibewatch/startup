  - FR002
- id: mitigation-monitoring-and-kill-criteria
  title: Mitigation, monitoring, and kill criteria
  body: 'The Lubic v. Cart.com litigation is the clearest near-term monitorable trigger in this register:
    an adverse judgment, a settlement exceeding a material threshold, or an expansion to a class or multi-plaintiff
    action would each represent a step-change in disclosed legal exposure and should prompt an immediate
    reassessment of counterparty risk. Because no source discloses Cart.com''s cash runway or burn rate,
    any additional financing round, recapitalization, or down-round announcement should be treated as
    the clearest available proxy signal for liquidity stress until the company discloses audited financials
    -- and this chapter treats that liquidity-disclosure gap as its single most consequential unresolved
    question. A confirmed California DIR citation, CPPA enforcement action, or consent order naming Cart.com
    would convert this chapter''s regulatory risks from precedent-based (via the Amazon AB 701 case) to
    company-specific, materially raising both severity and monitoring priority. A Cart.com-specific customer-facing
    outage exceeding several hours, or one confirmed to affect a material share of fulfillment volume,
    would distinguish an isolated incident from a systemic cloud- or platform-dependency failure of the
    kind already seen industry-wide in the 2025 AWS and Shopify outages. Any future disclosure tying a
    specific share of managed-service revenue to Amazon or Shopify would convert this chapter''s platform-concentration
    risk from a qualitative flag into a quantified financing or diligence condition, and a confirmed workforce
    reduction exceeding roughly 15% of headcount in a single quarter, or a WARN Act filing, would resolve
    the current headcount ambiguity in the adverse direction and should be treated as an execution-risk
    red flag.'
  claimRefs:
  - CR001
