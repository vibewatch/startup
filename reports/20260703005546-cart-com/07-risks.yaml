company:
  name: Cart.com
chapter:
  number: 7
  title: Risks
  summary: Cart.com's risk profile is dominated by an active federal breach-of-contract lawsuit and concentrated
    regulatory, platform, and financing dependencies (Amazon, Shopify, BlackRock, national parcel carriers),
    compounded throughout by the disclosure opacity typical of a private, acquisition-built company that
    has not published cash runway, security attestations, or reconciled headcount figures.
sections:
- id: risk-severity-overview
  title: Risk severity overview
  body: 'Cart.com''s risk profile is best read across four structural categories -- regulatory/legal,
    operational/quality/security, partner/dependency, and people/execution -- each made harder to size
    than at a comparable public company because Cart.com is privately held and largely self-discloses
    its own metrics. The single highest-severity, least-mitigated risk in this chapter sits at the intersection
    of two facts that cannot be reconciled from public sources: an active federal breach-of-contract lawsuit
    (Lubic v. Cart.com, Inc., No. 4:25-cv-04809, still in active discovery as of a March 2026 Rule 26(f)
    report) and a complete absence of disclosed cash runway or burn rate. Without a known liquidity cushion,
    no other risk in this register -- litigation exposure, carrier-cost inflation, platform-concentration,
    or debt-covenant risk -- can be weighed against the company''s actual capacity to absorb a shock.
    Growth has been built substantially through at least eight acquisitions since the company''s 2020
    founding (AmeriCommerce, Cheap Cheap Moving Boxes, The DuMont Project, Sauceda Industries, FB Flurry,
    SellerActive, OceanX, and Amify), which concentrates execution risk in integration quality across
    a growing set of acquired teams and systems rather than in a single product or technology dependency.
    The risk heatmap below (Figure FR001) summarizes likelihood, severity, mitigation maturity, and residual
    severity across the eight risks this chapter treats as highest-priority.'
  claimRefs:
  - CR001
  - CR002
  - CR004
  - CR035
  figureRefs:
  - FR001
- id: regulatory-legal-risk
  title: Regulatory / legal risk
  body: 'Cart.com, Inc. is an active defendant in a breach-of-contract lawsuit (Lubic v. Cart.com, Inc.,
    No. 4:25-cv-04809, U.S. District Court, S.D. Texas, Houston Division), filed October 8, 2025 and still
    proceeding through discovery as of a Second Amended Complaint (March 30, 2026) and a Rule 26(f) planning
    report (March 2, 2026); no docket entry discloses a damages figure, reserve, or settlement status.
    Separately, California''s Warehouse Quotas law (AB 701) requires warehouse employers to give workers
    written notice of any productivity quota and bars quotas that prevent compliance with meal, rest,
    bathroom, or safety requirements -- and the statute has real enforcement teeth: California''s Labor
    Commissioner cited Amazon.com Services, LLC nearly $5.9 million in 2024 for 59,017 violations across
    two Southern California warehouses. No source reviewed confirms whether any of Cart.com''s 17-18 disclosed
    fulfillment facilities sit in California, leaving this precedent unconverted into a company-specific
    exposure estimate. Trade-policy risk is dual-sided and current: the U.S. suspended the de minimis
    customs exemption for commercial shipments globally effective August 29, 2025, while the EU will apply
    a temporary flat handling fee (EUR 2-3 per parcel) on low-value imports through at least 2026, with
    neither Cart.com''s cross-border shipment mix nor its cost-pass-through policy disclosed. California''s
    CCPA/CPRA, as amended effective January 1, 2026, adds data-broker and automated-decision-making-technology
    disclosure obligations that Cart.com''s Terms of Service does not specifically address.'
  claimRefs:
  - CR005
  - CR006
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  tableRefs:
  - TR001
- id: operational-quality-security-risk
  title: Operational / quality / security risk
  body: Cart.com does not disclose which cloud-hosting provider powers its commerce and fulfillment technology
    stack, or what multi-region or multi-cloud resiliency architecture it maintains -- a material gap
    given that a major AWS outage on October 20, 2025 knocked out access to numerous high-traffic sites
    and apps for hours, illustrating the systemic fragility a single-cloud dependency can create. On data
    security, Cart.com's own Terms of Service commits only to 'commercially reasonable' safeguards --
    language that falls short of a warranty -- with a 30-day cure period before a failure becomes a breach
    of contract, and no source identifies a current SOC 2 Type II or PCI DSS attestation despite the company
    processing payment and commerce data for enterprise clients. The same Terms of Service excludes liability
    for 'any acts, omissions, or failures of a courier' and caps aggregate liability at the greater of
    $100 or six months of fees, shifting most courier-failure risk contractually onto the customer rather
    than eliminating it operationally. On cost, UPS and FedEx implemented 2026 general rate increases
    averaging just under 5.9%, with disproportionately larger surcharge increases on oversized, additional-handling,
    and residential deliveries. TrustRadius reviews of Cart.com's platform in 2026 include recurring complaints
    about implementation timelines and integration issues alongside positive account-support feedback,
    and a broader wave of logistics- and manufacturing-sector layoffs and bankruptcies (including Quiet
    Logistics' shutdown of American Eagle's dedicated fulfillment operations) hit the U.S. in early 2026,
    evidencing sector-wide operational stress among 3PL-adjacent operators.
  claimRefs:
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
