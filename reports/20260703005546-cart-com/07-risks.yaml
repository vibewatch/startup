  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: cloud-dependency-gap
    missingEvidence: Cart.com's specific cloud-hosting provider(s) and its multi-region or multi-cloud
      resiliency/BCDR posture.
    whyItMatters: The October 2025 AWS outage shows a single-cloud dependency can take down major e-commerce
      infrastructure for hours; without knowing Cart.com's own architecture, this chapter cannot size
      the company's exposure to a comparable event.
    diligencePath: Request architecture and business-continuity/disaster-recovery documentation directly
      from Cart.com's engineering or infosec team under NDA.
    relatedQuestionRefs:
    - QR014
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: california-footprint-gap
    missingEvidence: A confirmed count and address list of any Cart.com facilities located in California,
      where AB 701's warehouse-quota notice requirements would directly apply.
    whyItMatters: Amazon's $5.9M AB 701 penalty shows the statute carries real enforcement teeth; without
      knowing whether Cart.com operates in California, this chapter cannot convert that precedent into
      a company-specific exposure estimate.
    diligencePath: Request a facility address list from Cart.com management, or cross-reference county-level
      permitting/zoning records for its known metro markets.
    relatedQuestionRefs:
    - QR013
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: cross-border-exposure-gap
    missingEvidence: The share of Cart.com's GMV or customer base dependent on cross-border direct-to-consumer
      shipping now subject to the 2025 U.S. de minimis suspension and the EU's 2026 flat-fee regime.
    whyItMatters: Without a quantified cross-border share, the tariff/trade-policy risk in this chapter
      can only be flagged qualitatively, not sized against revenue or margin.
    diligencePath: Request customer geographic mix and cross-border shipment-volume data from Cart.com
      management.
    relatedQuestionRefs:
    - QR009
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: compliance-certification-gap
    missingEvidence: A current SOC 2 Type II report or PCI DSS Attestation of Compliance for Cart.com.
    whyItMatters: Cart.com's Terms of Service commits only to 'commercially reasonable' safeguards rather
      than a warranted security standard; an independent attestation would materially change the assessed
      maturity of its data-security risk mitigation.
    diligencePath: Request compliance documentation directly from Cart.com's security/compliance team
      under NDA as part of a data-room review.
    relatedQuestionRefs:
    - QR016
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: amazon-concentration-gap
    missingEvidence: The share of Cart.com's Commerce Services revenue or client base concentrated in
      Amazon-marketplace management delivered through its Amify subsidiary.
    whyItMatters: Amazon's 2026 AI-driven seller-suspension enforcement is a documented adverse trend;
      without a revenue-concentration figure, this chapter cannot size how much of Cart.com's business
      a single Amazon policy change could disrupt.
    diligencePath: Request a revenue-by-service-line breakdown, specifically isolating Amify/Amazon-management
      fees, from Cart.com management.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-disclosure-gap
    missingEvidence: Cart.com's cash on hand, monthly burn rate, or months-to-breakeven / runway figure.
    whyItMatters: Without a known liquidity cushion, none of this chapter's individual risk severities
      (litigation, regulatory, operational, or partner) can be weighed against the company's actual capacity
      to absorb a shock, which is the single most consequential unresolved question in this register.
    diligencePath: Request a data room with audited or reviewed financial statements and a 12-month cash-flow
      forecast from Cart.com management.
    relatedQuestionRefs:
    - QR031
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: minor
    topic: litigation-scope-gap
    missingEvidence: A direct USPTO/TTAB trademark and patent docket search, and a broader multi-jurisdiction
      court-record search beyond the Lubic matter, naming Cart.com, Inc. as a party.
    whyItMatters: This chapter's litigation coverage relies on a single docket-aggregator search; a narrower
      search radius could mean other disputes exist but were not surfaced.
    diligencePath: Commission a paid, comprehensive litigation and IP-docket search (e.g., PACER, USPTO
      TESS/TTAB) covering all Cart.com corporate affiliates.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TR001
  - type: conflicting-data
    severity: material
    topic: headcount-reconciliation-gap
    missingEvidence: A reconciled, current employee headcount for Cart.com, by function and location.
    whyItMatters: The nearly 2x gap between the company's own 1,600+-employee disclosure (Dec 2024) and
      Tracxn's 878-employee tracked count (2026) makes it impossible to size workforce-stability or execution
      risk with confidence.
    diligencePath: Request current headcount by function, location, and employment type directly from
      Cart.com's people/HR team.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TR004
