- id: partner-dependency-risk
  title: Partner / dependency risk
  body: 'Amazon is the dominant marketplace channel underlying Cart.com''s Amify subsidiary, which the
    company acquired in April 2024 specifically to strengthen Amazon-marketplace-management capabilities;
    Marketplace Pulse estimates Amazon''s U.S. third-party marketplace sales at roughly $300 billion,
    more than seven times eBay''s. Amazon''s 2026 seller-enforcement approach relies more heavily on AI-driven
    detection, with sellers reporting shorter appeal windows and higher rejection rates than in prior
    years -- a policy-enforcement risk that could disrupt revenue for any Amazon-dependent client Amify
    manages, though no source discloses what share of Cart.com''s revenue or client base this concentration
    actually represents. Shopify is a second major platform dependency: its global GMV reached roughly
    66% of Amazon''s marketplace GMV in 2025 (up from about 40% in 2020), it suffered an hours-long Cyber
    Monday outage on December 1, 2025, and its own 2019-2023 history of building then fully divesting
    an owned-fulfillment network (to Flexport, with a roughly 20% workforce cut) is a direct precedent
    for the capital intensity and reversibility risk inherent in the owned-fulfillment model Cart.com
    itself operates. On the capital side, Cart.com secured a $105 million BlackRock-managed term loan
    in July 2024 and closed a $180 million Springcoast Partners-led growth-equity round in March 2026,
    showing continued institutional access but concentrating refinancing risk in a small number of counterparties
    whose covenant and rate terms are not public. National parcel carriers UPS, FedEx, and USPS remain
    the last-mile subcontractors whose 2026 rate increases compress margin for both Cart.com and its clients.'
  claimRefs:
  - CR025
