tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary buyer or user
  - What it delivers
  - Public maturity signal
  - Differentiation
  - Diligence gap
  rows:
  - - Constellation OMS
    - Commerce operations, inventory, and customer-service teams
    - Cross-channel order and inventory visibility, routing, allocation, BOPIS/BOSFS, merchandising adjacencies
    - Standalone launch in Feb-2024 plus current product page
    - Pairs orchestration with listing, pricing, and forecasting claims
    - Request production references, uptime, and implementation duration for standalone buyers
  - - Constellation WMS / TMS
    - Warehouse operators, logistics managers, and fulfillment leaders
    - Receiving through shipping, labor, returns, carrier shopping, tracking, and transportation cost control
    - Standalone availability reported in Jul-2024 plus current WMS page
    - Same stack can run in Cart.com facilities or customer facilities
    - Request proof of live third-party installs outside Cart.com-run sites
  - - Warehouse automation
    - Operations engineering and network-design teams
    - Goods-to-person, ASRS, conveyors, shuttles, sortation, bagging tied to WMS/OMS
    - Current automation page with named equipment classes
    - Automation is integrated into the software and network story, not sold as isolated machinery
    - Request site-level deployment list, throughput gains, and failure modes
  - - AmeriCommerce / B2B storefront
    - Digital commerce admins, wholesalers, distributors, and multistore operators
    - Storefronts, multistore admin, quoting, customer types, PO workflows, and wholesale pricing
    - Current AmeriCommerce homepage plus 2026.2 storefront changelog
    - Supports complex B2B workflows that many D2C-first carts treat as add-ons
    - Request current active-customer count and migration roadmap versus newer Cart.com branding
  - - Marketplace services (SellerActive + Amify)
    - Marketplace managers and growth teams
    - Listings, repricing, Amazon management, advertising, creative, analytics, and multichannel operations
    - Capabilities expanded via 2022 and 2024 acquisitions
    - Lets Cart.com sell marketplace execution as software-plus-services
    - Request post-acquisition integration map, shared data model, and common reporting layer
  - - Managed commerce services
    - Customer-support, finance, and digital-ops leaders
    - Omnichannel support, merchant of record, payments administration, tax, chargebacks, and fraud controls
    - Named enterprise partner proof with Authentic
    - Extends beyond software into regulated and operational workflows
    - Request compliance evidence, margins, and service-level reporting by function
  notes: Rows separate what is clearly commercialized from what is still thinly evidenced in public; maturity signals are based on launches, live product pages, and partner proof, not private customer win-rates.
