- id: deployment-support-and-roadmap-maturity
  title: Deployment model, support signals, and what is mature versus merely promised
  body: |-
    Public maturity evidence is strongest where Cart.com has either launched standalone modules or published release detail. OMS was launched as a standalone offering in early 2024, and independent trade coverage says WMS and TMS followed as standalone products later that year. The storefront/B2B surface has the clearest ongoing release trail: the 2026.2 changelog shows quoting, customer segmentation controls, SSO recovery support, merchandising updates, and accessibility/performance work moving through production. That is materially better evidence than vague roadmap language because it describes concrete shipped features.

    The weaker side of maturity is implementation and support transparency. Cart.com advertises modern SaaS deployment and 24/7/365 support, but public review evidence is mixed: one TrustRadius reviewer praises the rule engine and multistore setup while also reporting slow support and stale reporting. The official docs likewise prove a developer surface exists but do not make the implementation story easy to inspect from public pages alone. Netting those together, the software stack looks commercialized and increasingly productized, but not yet public-documentation rich enough for investors to treat implementation risk as solved.
  claimRefs:
