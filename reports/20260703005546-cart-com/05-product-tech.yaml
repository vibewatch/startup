  evidenceGaps:
  - type: missing-source
    severity: material
    topic: api-documentation-completeness
    missingEvidence: A public endpoint-level API catalog with example payloads, auth scopes, webhook schemas, and versioning notes for Cart.com's external developer surface.
    whyItMatters: Without endpoint-level public evidence, an investor cannot judge integration effort, external extensibility, or partner lock-in risk from public materials alone.
    diligencePath: Request current developer docs, OpenAPI files, webhook schemas, sandbox credentials, and one recent customer implementation package from Cart.com.
    relatedQuestionRefs:
    - QE010
  - type: missing-source
    severity: material
    topic: trust-attestation-transparency
    missingEvidence: Third-party security and reliability artifacts such as a current SOC 2 report, public status page, incident history, privacy documentation index, and named uptime commitments.
    whyItMatters: Cart.com makes meaningful security and compliance claims, but without third-party attestation or operational transparency the trust profile remains partially unverified.
    diligencePath: Request trust-center materials, latest audit reports, uptime SLAs, historical incident log, and customer-facing security questionnaires.
    relatedQuestionRefs:
    - QE022
  - type: missing-source
    severity: material
    topic: implementation-benchmarks
    missingEvidence: Public or private reference evidence on implementation duration, resource requirements, data-migration burden, and time-to-value for standalone OMS/WMS/TMS buyers.
    whyItMatters: Cart.com's breadth is attractive, but implementation complexity is a core underwriting variable for adoption pace, services load, and retention risk.
    diligencePath: Request three implementation case studies with timelines, staffing models, scope boundaries, and post-go-live support escalation data.
    relatedQuestionRefs:
    - QE026
  - type: missing-source
    severity: minor
    topic: release-transparency-outside-storefront
    missingEvidence: A public changelog or release cadence for OMS, WMS, TMS, and managed-services modules comparable to the storefront 2026.2 notes.
    whyItMatters: Roadmap transparency is materially better for storefront/B2B surfaces than for the rest of the stack, which makes maturity comparisons across modules noisy.
    diligencePath: Ask for internal release logs or customer-facing release notes for OMS, WMS, TMS, and marketplace-services tooling over the last four quarters.
    relatedQuestionRefs:
    - QE017
