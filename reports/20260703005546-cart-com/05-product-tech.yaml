- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or signal
  - Status in reviewed evidence
  - Scope
  - What is actually supported
  - Gap
  rows:
  - - Security standards alignment
    - Claimed
    - OMS and WMS product pages
    - Cart.com says it can align with ISO, NIST, NSM-10, and DoD Zero Trust standards because of work with government customers
    - No public third-party attestation artifact was found in this chapter corpus
  - - Payments / merchant-of-record controls
    - Partner-confirmed
    - Authentic deployment
    - Authentic says Cart.com handles payment and sales-tax collection, data-regulation compliance, chargebacks, and fraud prevention
    - No public control framework, audit scope, or incident history disclosed
  - - Accessibility and performance maintenance
    - Released
    - Storefront 2026.2 changelog
    - Cart.com published accessibility, performance, and image-processing improvements plus Avalara refund support
    - Equivalent public maintenance trail for OMS/WMS/TMS was not found
  - - Support coverage
    - Claimed but disputed
    - Commerce software support motion
    - Official pages advertise 24/7/365 support
    - Review evidence cites slow support responsiveness and stale reporting
  - - People / execution signal
    - Adverse
    - Labor-intensive services and fulfillment org
    - Glassdoor snapshot shows weak recommendation and CEO approval metrics
    - Employee-review data is noisy and not a substitute for retention or operational KPI data
  notes: The table distinguishes controls that are actually evidenced from controls that are merely asserted; absence of third-party attestation in this chapter corpus is treated as a diligence gap, not a proof of absence.
