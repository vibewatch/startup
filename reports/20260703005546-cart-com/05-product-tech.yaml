- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: The operating flow starts with channel and buyer setup, then moves through orchestration, execution, transport, and post-purchase operations.
  data:
    nodes:
    - id: n1
      label: Configure channels and buyers
      detail: Merchants set up storefronts, B2B customer types, marketplaces, pricing, and inventory views.
    - id: n2
      label: Capture demand
      detail: Orders originate from web stores, wholesale quotes, marketplaces, or service-assisted ordering.
    - id: n3
      label: Orchestrate inventory and orders
      detail: OMS synchronizes inventory, routes demand, and updates allocation and order status across nodes.
    - id: n4
      label: Execute inside warehouse
      detail: WMS runs receiving, pick/pack/ship, returns, and labor planning with automation where deployed.
    - id: n5
      label: Select transport path
      detail: TMS compares carriers and service levels and tracks shipment economics and status.
    - id: n6
      label: Support post-purchase operations
      detail: Customer-service teams, payments controls, tax handling, chargebacks, and fraud workflows sit after order placement and fulfillment.
    - id: n7
      label: Feed learnings back into merchandising and demand planning
      detail: Reporting, forecasting, pricing logic, and marketplace services use order and inventory data to adjust the next cycle.
