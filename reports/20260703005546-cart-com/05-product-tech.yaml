- id: FE001
  title: Product architecture map
  type: stack
  layout: standard
  summary: Cart.com's public architecture is layered from storefront and channels down into orchestration, execution, automation, and managed services.
  data:
    layers:
    - label: Storefront and channel surfaces
      detail: AmeriCommerce storefronts, B2B buying flows, marketplace listings, and customer-service touchpoints where orders originate or are modified.
    - label: Order orchestration
      detail: OMS synchronizes orders and inventory, applies routing and allocation logic, and exposes service controls such as BOPIS/BOSFS and order changes.
    - label: Warehouse and transport execution
      detail: WMS and TMS handle receiving, put-away, picking, packing, labor, shipping, returns, and rate-shopping decisions.
    - label: Physical automation
      detail: ASRS, goods-to-person robotics, shuttles, conveyors, sortation, and bagging systems are described as tied into the warehouse stack.
    - label: Integration and developer surface
      detail: API-first integrations, public developer docs, auth aids, webhooks, and partner-system connections link Cart.com to ERP, marketing, and marketplace tools.
    - label: Managed-services overlay
      detail: Marketplace operations, merchant of record, payments administration, and omnichannel support wrap human services around the software core.
