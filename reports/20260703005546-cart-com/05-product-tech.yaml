  rows:
  - - Storefront / B2B layer
    - Customer-facing catalog, quote, and account workflows
    - AmeriCommerce and Cart.com storefront admin surfaces
    - Multistore, wholesale, quote, and customer-type capabilities are publicly described
    - Current product branding and migration path are not fully explained
  - - OMS orchestration layer
    - Unifies orders, inventory, routing, and channel control
    - API integrations into ERP, WMS, marketing, and marketplaces
