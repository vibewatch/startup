  - - WMS execution layer
    - Runs receiving through shipping, returns, and labor
    - Physical sites plus OMS/TMS adjacency
    - Standalone WMS availability and broad process coverage are documented
    - Limited public evidence on live third-party deployments outside Cart.com-run sites
  - - TMS carrier layer
    - Carrier-rate shopping, tracking, and savings reporting
    - Carrier contracts and service-level data
    - Trade coverage and OMS pages confirm dynamic-rate positioning
    - No public carrier benchmark or SLA disclosure
  - - Automation layer
    - ASRS, robotics, conveyors, sortation, and bagging
    - Facility design, robot vendors, and WMS data
    - Current automation page names the main equipment classes
    - No public map of which facilities use which automation stack
  - - Developer / integration layer
    - Docs, auth, webhooks, specs, and ecosystem signals
    - Public developer portal and API-discovery tools
    - Developer portal exists and third-party trackers list a broad integration surface
    - Readable public docs are shallow in this corpus and endpoint inventory is incomplete
  - - Managed-services overlay
    - Marketplace execution, merchant of record, and support operations wrapped around software
    - Acquired teams plus partner-specific workflows
    - Authentic, Amify, and SellerActive sources show the overlay is real
    - Integration consistency across acquired and native modules remains a diligence item
  notes: This is an operating-model table, not a systems-architecture diagram from internal engineering documents; every row is bounded by what public sources explicitly reveal.
