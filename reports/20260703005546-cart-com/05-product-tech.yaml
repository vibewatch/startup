- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Cart.com solution
  - Measurable or claimed benefit
  - Limitation / risk
  rows:
  - - Omnichannel order orchestration
    - Merge orders and inventory from stores, DCs, marketplaces, and web stores
    - OMS synchronizes inventory, applies routing logic, and supports BOPIS/BOSFS
    - Single control layer across channels and locations
    - No public uptime or implementation-duration evidence
  - - Warehouse execution
    - Receive, store, pick, pack, ship, return, and labor-plan inside one facility
    - WMS runs day-to-day execution with reporting and labor controls
    - One dashboard for D2C, marketplace, store-replenishment, and wholesale flows
    - Independent proof is stronger for capability breadth than for customer outcomes
  - - Freight selection and shipment economics
    - Compare carriers and service levels while meeting delivery promises
    - TMS performs dynamic rate shopping, tracking, and savings visibility
    - Cost optimization and centralized transport visibility
    - No public SLA or carrier-performance benchmark disclosed
  - - B2B ordering and quoting
    - Segment buyers, approve quotes, take PO payment, and manage cross-store inventory
    - Wholesale / storefront stack supports customer types, quotes, PO checkout, and multistore inventory
    - Fits dealer, distributor, and wholesale workflows without separate stores
    - Public roadmap is storefront-heavy; external deployment references are limited
  - - Marketplace growth
    - Manage listings, repricing, Amazon content/ads, and multichannel inventory
    - SellerActive and Amify add marketplace software plus managed services
    - Broader channel reach and marketplace-specific expertise
    - Capability cohesion depends on post-acquisition integration quality
  - - Managed commerce and payments
    - Run support, merchant-of-record, tax, chargebacks, and fraud controls for enterprise brands
    - Authentic proof shows Cart.com can operate post-purchase and payment-adjacent workflows
    - Broader workflow ownership beyond software screens
    - Compliance controls are described publicly but third-party attestations were not found in this corpus
  notes: Benefits are stated only where sources make explicit claims; missing uptime, cost, or time-to-value metrics are recorded as limitations rather than inferred positively.
