- id: retention-and-durability-gap
  title: Retention, repeat usage, and the undisclosed NRR gap
  body: |-
    Cart.com discloses no net revenue retention, gross revenue retention, or churn rate for its customer base, and no source reviewed for this chapter fills that gap [CU030]. In the absence of true retention data, the only durability signal available is a persistence proxy: PacSun, TOMS, and Janie and Jack are still named together on Cart.com's 2026 omnichannel fulfillment page, and the aggregate "6,000-plus customers" figure recurs from Cart.com's July 2024 financing materials through its March 2026 funding coverage [CU011][CU033]. This proxy is explicitly not a churn-adjusted retention curve -- it only shows that specific names or headline figures have not yet disappeared from public materials, which is a much weaker claim than confirmed active, current-term contracts. Standard contract length, renewal terms, and termination provisions are likewise undisclosed across every source reviewed [CU031]. Reference-quality satisfaction evidence is limited to the TrustRadius review already discussed in the prior section, which flagged slow support response times and stagnant reporting capability as of its most recent update [CU025][CU026]. Until Cart.com or a data room discloses NRR/GRR, logo and dollar churn, and contract-term data directly, retention durability for this customer base should be treated as an open question rather than assumed from named-logo persistence alone.
  claimRefs:
  - CU011
  - CU025
  - CU026
  - CU030
  - CU031
