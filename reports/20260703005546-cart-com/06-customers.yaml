- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Acquisition-led roster expansion (Amify 50+ brands, OceanX 25+ brands, Foundry Brands 4 brands)
    - Inherited customers may carry pre-existing churn risk or lower Cart.com-specific loyalty
    - Adds customer count and GMV quickly but with an unproven post-transition retention record
    - Request post-acquisition retention rates for each acquired customer cohort
  - - Amazon-channel marketplace-seller dependence (Amify and Foundry Brands mandates)
    - Concentration in a single third-party channel (Amazon) subject to Amazon policy or fee changes
    - Channel-level platform risk sits outside Cart.com's direct control
    - Assess the share of managed GMV dependent specifically on the Amazon marketplace
  - - Brand-licensing portfolio consolidation (Authentic Brands Group)
    - A single portfolio relationship may represent an outsized share of brand count or revenue if it scales across Authentic's full roster
    - Renewal or scope reduction by one portfolio customer could disproportionately affect reported metrics
    - Request the percentage of GMV or revenue attributable to the top-1 and top-10 customers
  - - Flat headline customer count (6,000+) despite GMV growth to $10B+
    - Suggests expansion within existing accounts (upsell) rather than new-logo growth, raising per-account concentration
    - Loss of one large account could be more impactful if a small number of accounts represent a larger GMV share
    - Request logo-count history and the distribution of GMV per customer
  - - Public-sector / federal-agency expansion
    - Government contracts carry procurement, budget-cycle, and political risk not present in commercial accounts
    - Diversifies away from retail but introduces a new risk class
    - Request contract-vehicle type, term, and renewal history for federal engagements
  - - No public disclosure of contract minimums or termination terms
    - Unknown ease of customer exit across segments
    - Cannot independently assess switching costs or customer lock-in
    - Request standard MSA termination-notice and auto-renewal opt-out terms
  notes: Concentration risk rows are this chapter's inference from disclosed growth patterns; Cart.com does not publish a customer-concentration schedule.
