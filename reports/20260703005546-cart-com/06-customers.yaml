- calloutType: risk
  title: NRR, GRR, churn, and customer concentration are entirely undisclosed
  body: No source reviewed for this chapter -- company, press, or review-platform -- discloses Cart.com's net or gross revenue retention, churn rate, contract terms, or top-customer concentration. The only durability signal available is a two-point persistence proxy showing named customers and the 6,000+ headline count have not yet disappeared from public materials, which is materially weaker than confirmed retention data.
  claimRefs:
  - CU030
  - CU031
  - CU032
  - CU011
- calloutType: risk
  title: Flat headline customer count alongside rising GMV is an unresolved concentration signal
  body: Cart.com's disclosed customer count has stayed at "6,000-plus" from its July 2024 Series C financing through its March 2026 funding disclosure, even as GMV grew from roughly $8 billion to over $10 billion and facility count grew from 14 to 18. This pattern is consistent with either upsell-driven expansion within existing accounts or a stale customer-count disclosure; Cart.com does not disclose which, and no top-customer concentration percentage is available to size the risk.
  claimRefs:
  - CU033
  - CU034
  - CU005
  - CU006
- calloutType: assumption
  title: Growth since 2024 is treated as substantially acquisition-led pending a data-room breakdown
  body: This chapter assumes that a material share of Cart.com's post-2024 customer-base growth reflects inherited rosters from the Amify (50+ brands) and OceanX (25+ brands) acquisitions rather than confirmed organic new-logo sales, because no source discloses a logo-growth breakdown by channel. This assumption should be validated or refuted with a management-provided new-logo vs. acquired-logo reconciliation.
  claimRefs:
  - CU012
  - CU018
  - CU035
- calloutType: recommendation
  title: Prioritize direct reference calls and a retention data room over further open-source review search
  body: G2 and Trustpilot access is blocked for open-source research, and the smaller aggregators that are accessible (TrustRadius, Tekpon, Slashdot, SourceForge) show thin, mixed, or near-zero review volume. The highest-value next diligence step is a management-provided retention/NRR data room plus direct reference calls to PacSun, Authentic Brands Group, and Foundry Brands to validate active-contract status and outcome quality beyond relationship existence.
  claimRefs:
  - CU044
  - CU028
  - CU030
