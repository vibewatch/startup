figures:
- id: FU001
  title: 'Customer journey map: discovery to expansion loop'
  type: journey-map
  layout: wide
  summary: Named customer relationships progress from segment-fit discovery through operational transition, production use, public reference, and back into a new-logo expansion loop.
  data:
    nodes:
    - id: discovery
      label: Discovery & fit assessment
      description: Buyer segment identified (enterprise omnichannel brand, brand-licensing portfolio, beauty/wellness brand, Amazon marketplace seller, or public-sector agency) via inbound inquiry or an acquired company's existing roster.
    - id: transition
      label: Facility / channel transition
      description: Operational handoff begins, e.g. PacSun's Groveport, Ohio facility management transitions to Cart.com, or a marketplace-seller brand's Amazon advertising and operations are handed to Cart.com/Amify or Cart.com/Foundry Brands.
    - id: production
      label: Production operation
      description: 'Relationship is live and operating at scale: automated sortation/conveyance in named distribution centers, ongoing Amazon channel management, or merchant-of-record services for a licensed brand portfolio.'
    - id: proof
      label: Public reference / case study
      description: Relationship becomes citable customer proof via a press release, newsroom post, or customer-side confirmation, such as Authentic Brands Group's own corporate press page.
    - id: expansion
      label: Expansion loop
      description: Published case studies and named references, such as the 2024 Amify roster, appear to support new marketplace-seller wins like Foundry Brands' March 2026 mandate, feeding the next discovery stage.
  claimRefs:
  - CU009
  - CU012
  - CU015
  - CU018
  - CU021
  - CU037
