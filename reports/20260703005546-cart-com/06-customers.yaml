  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: retention-metrics
    missingEvidence: Disclosed net revenue retention (NRR), gross revenue retention (GRR), and logo/dollar churn rate, ideally by segment or cohort.
    whyItMatters: Retention is the single most important durability signal for a commerce/logistics platform with acquisition-heavy growth; without it, growth in GMV and facility count cannot be distinguished from account churn offset by new acquisitions.
    diligencePath: Request NRR/GRR and churn definitions and trailing 12/24-month figures directly from Cart.com management or a data room.
    relatedQuestionRefs:
    - QU013
    - QU014
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 and top-1 customer share of revenue or GMV.
    whyItMatters: A flat headline customer count alongside rising GMV is consistent with rising per-account concentration; without a concentration schedule, this risk cannot be sized or ruled out.
    diligencePath: Request a customer-concentration schedule (top-10/top-1 share of revenue and GMV) directly from Cart.com or a data room.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: contract-terms
    missingEvidence: Standard contract length, renewal cadence, and termination-notice terms across enterprise, brand-portfolio, and marketplace-seller segments.
    whyItMatters: Contract terms determine switching costs and the practical ease of customer exit, which affects how much weight to place on named-logo persistence as a durability signal.
    diligencePath: Request representative MSA/SOW terms or a summary of standard contract length and renewal/termination provisions.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: customer-segmentation-breakdown (named-customer-proof-table)
    missingEvidence: Segment-level customer counts (enterprise vs. mid-market vs. marketplace-seller vs. public-sector) underlying the aggregate 6,000+ figure.
    whyItMatters: Without a segment breakdown, it is not possible to assess which segments are growing, shrinking, or driving GMV, or how concentrated the base is by segment.
    diligencePath: Request a segment-level customer count and revenue/GMV breakdown from Cart.com or a data room.
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU001
    - TU003
  - type: access-blocked
    severity: minor
    topic: review-platform-access
    missingEvidence: G2 and Trustpilot review content for Cart.com, both of which returned blocked or unavailable responses on live and archived-copy fetch attempts during this research pass.
    whyItMatters: G2 and Trustpilot are typically the highest-traffic independent B2B software review platforms; their absence leaves customer-satisfaction evidence weighted toward lower-traffic aggregators and a single detailed TrustRadius review.
    diligencePath: Obtain a licensed G2/Trustpilot data export, or request Cart.com provide its own aggregated review-platform metrics and reviewer counts.
    relatedQuestionRefs:
    - QU015
    relatedTableRefs:
    - TU004
  - type: conflicting-data
    severity: minor
    topic: customer-count-vs-gmv-growth
    missingEvidence: Segment-level or logo-count growth data that would confirm whether the stable 6,000+ figure reflects a genuine retention plateau, an unrefreshed disclosure convention, or rounding.
    whyItMatters: The same headline customer count is repeated across at least three disclosures spanning July 2024 to March 2026 while GMV and facility count both grew, which is an ambiguous signal that could mean either healthy upsell or reporting inertia.
    diligencePath: Request a logo-count history alongside the GMV time series to determine whether customer-count growth has genuinely stalled.
    relatedTableRefs:
    - TU002
