- id: growth-trajectory-and-named-proof
  title: Adoption trajectory and named customer proof
  body: |-
    Cart.com's growth trajectory is visible only through a handful of point-in-time disclosures rather than a published time series. At its July 2024 Series C financing, Cart.com reported 6,000-plus customers and $8 billion-plus in annual GMV across 14 omnichannel facilities [CU006][CU007]; by March 2026, GMV had grown past $10 billion while the headline customer count was still reported as "6,000-plus" and facility count had grown to 18 [CU005][CU013 context]. Read together, this pattern -- rising GMV and facility footprint alongside a flat headline logo count -- is this chapter's inference that growth since 2024 has leaned on expansion within existing accounts and acquisition-led roster additions rather than confirmed new-logo growth [CU033][CU034][CU035]. Named customer proof corroborates the acquisition-led expansion channel directly: production-scale deployments include PacSun's 2-million-square-foot Groveport, Ohio facility transition [CU009][CU010], Authentic Brands Group's merchant-of-record and customer-support engagement corroborated by four independent publishers [CU021][CU022][CU023][CU024], the OceanX-inherited beauty-brand roster [CU018][CU019][CU020], and the Amify- and Foundry Brands-managed Amazon marketplace-seller rosters, the latter announced fresh in March 2026 with an on-record CEO endorsement [CU012][CU015][CU016][CU017]. Every one of these relationships reflects a production operational transition -- a facility handoff, an Amazon channel takeover, or a merchant-of-record setup -- rather than a pilot, though none discloses a quantified cost or service-level outcome [CU043].
