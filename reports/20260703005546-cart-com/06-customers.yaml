  - - Amazon marketplace-seller brands
    - Brand owner is buyer; Cart.com/Amify or Cart.com/Foundry Brands manages the Amazon channel as agent
    - Amazon advertising and operations management
    - 50+ brands via Amify (2024) plus 4 named via Foundry Brands (March 2026) [CU012][CU015]
    - Medium-high -- fastest-growing named-customer flow observed in 2026
