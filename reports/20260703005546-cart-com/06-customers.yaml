    - Government agency is buyer, user, and payer
    - Secure logistics and fulfillment services
    - '"Multiple federal agencies" cited; count and identities undisclosed [CU001]'
    - Medium -- diversification signal with low disclosure
    - Exact number and identity of agencies not disclosed
