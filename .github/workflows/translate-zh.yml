# Scheduled/manual Chinese translation run.
#
# Every two hours, selects up to 5 finalized report folders under reports/
# that do not yet have both Chinese overlays, asks Copilot to translate them
# with the translate-zh skill, validates the result, and commits the overlays.
#
# Required secrets:
# - COPILOT_PAT — PAT for a Copilot-licensed account; consumed by the Copilot CLI.
# - STARTUP_PAT — PAT with repo write access for checkout/push.

name: Translate reports to Chinese

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      reportCount:
        description: "Max reports to translate (capped at 5)."
        required: false
        default: "5"
        type: string
      model:
        description: "Model."
        required: false
        default: "gemini-3.8-flash"
        type: choice
        options:
          - gemini-3.8-flash
          - gpt-5.4-mini
          - gpt-5.6-luna
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: startup-translate-zh
  cancel-in-progress: false

jobs:
  translate:
    name: Translate untranslated reports to Chinese
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.STARTUP_PAT }}

      - name: Sync to latest branch head
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          # Queued workflow_dispatch runs are created from the dispatch SHA;
          # refresh before target selection so prior translation batches count.
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout --force -B "$BRANCH" "origin/$BRANCH"

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Normalize translation inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          RAW_COUNT: ${{ github.event.inputs.reportCount }}
          RAW_MODEL: ${{ github.event.inputs.model }}
        run: |
          set -euo pipefail
          trim() { printf '%s' "${1//$'\n'/ }" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
          COUNT="$(trim "$RAW_COUNT")"
          MODEL="$(trim "$RAW_MODEL")"
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]] || [ "$COUNT" -lt 1 ]; then
            if [ "$EVENT_NAME" = "schedule" ]; then
              COUNT=1
            else
              COUNT=5
            fi
          fi
          if [ "$COUNT" -gt 5 ]; then
            COUNT=5
          fi
          case "$MODEL" in
            gemini-3.8-flash|gpt-5.4-mini|gpt-5.6-luna) ;;
            claude-sonnet-4.6|claude-opus-4.6|gpt-5.5|gpt-5.4)
              echo "::warning::Legacy model $MODEL was replaced with the measured bulk-translation route gemini-3.8-flash."
              MODEL="gemini-3.8-flash"
              ;;
            "") MODEL="gemini-3.8-flash" ;;
            *)
              echo "Unsupported model: $MODEL (allowed: gemini-3.8-flash, gpt-5.4-mini, gpt-5.6-luna)" >&2
              exit 1
              ;;
          esac
          case "$MODEL" in
            gemini-3.8-flash|gpt-5.6-luna) EFFORT="" ;;
            gpt-5.4-mini) EFFORT="medium" ;;
          esac
          {
            echo "count=$COUNT"
            echo "model=$MODEL"
            echo "effort=$EFFORT"
          } >> "$GITHUB_OUTPUT"

      - name: Select untranslated reports
        id: targets
        env:
          LIMIT: ${{ steps.inputs.outputs.count }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readdirSync, statSync } from 'node:fs';
          import { join, resolve } from 'node:path';

          const reportsDir = resolve('reports');
          const limit = Number.isInteger(Number(process.env.LIMIT)) && Number(process.env.LIMIT) > 0
            ? Number(process.env.LIMIT)
            : 5;

          function hasFile(folder, file) {
            return existsSync(join(reportsDir, folder, file));
          }

          const untranslated = existsSync(reportsDir)
            ? readdirSync(reportsDir)
                .filter((name) => !name.startsWith('.'))
                .filter((name) => statSync(join(reportsDir, name)).isDirectory())
                .sort()
                .filter((name) => hasFile(name, 'summary-card.yaml') && hasFile(name, 'full-report.yaml'))
                .filter((name) => !hasFile(name, 'summary-card.zh.yaml') || !hasFile(name, 'full-report.zh.yaml'))
            : [];

          const selected = untranslated.slice(0, limit);
          appendFileSync(process.env.GITHUB_OUTPUT, `count=${selected.length}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `total=${untranslated.length}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, 'reportIds<<EOF\n');
          appendFileSync(process.env.GITHUB_OUTPUT, `${selected.join('\n')}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, 'EOF\n');

          console.log(`Selected ${selected.length}/${untranslated.length} untranslated report(s).`);
          for (const reportId of selected) console.log(`- ${reportId}`);
          NODE

      - name: Write selection summary
        run: |
          {
            echo "## Chinese translation batch"
            echo
            echo "Model: ${{ steps.inputs.outputs.model }}"
            echo "Effort: ${{ steps.inputs.outputs.effort }}"
            echo
            echo "Selected ${{ steps.targets.outputs.count }} of ${{ steps.targets.outputs.total }} untranslated report(s)."
            echo
            if [ "${{ steps.targets.outputs.count }}" = "0" ]; then
              echo "No untranslated reports found; exiting successfully."
            else
              echo "### Reports"
              while IFS= read -r report; do
                [ -z "$report" ] && continue
                echo "- $report"
              done <<'REPORTS'
          ${{ steps.targets.outputs.reportIds }}
          REPORTS
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies and Copilot CLI
        if: steps.targets.outputs.count != '0'
        run: |
          npm ci || npm install --no-audit --no-fund
          npm --prefix website ci || npm --prefix website install --no-audit --no-fund
          npm install -g @github/copilot

      - name: Translate selected reports
        if: steps.targets.outputs.count != '0'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          MODEL: ${{ steps.inputs.outputs.model }}
          EFFORT: ${{ steps.inputs.outputs.effort }}
          REPORT_IDS: ${{ steps.targets.outputs.reportIds }}
        run: |
          set -euo pipefail
          PROMPT=$(cat <<EOF
          Translate the selected finalized startup diligence reports into Simplified Chinese overlays.

          Selected report folders under reports/:
          $REPORT_IDS

          Requirements:
          - Translate exactly these selected folders. If fewer than the requested batch size were selected, translate only the selected folders. If a selected folder already has both Chinese overlays by the time you inspect it, skip rewriting it.
          - Follow the translate-zh skill's orchestration runner. Initialize each selected report, enumerate the actual cached part files after init, and translate only paths that exist; never predict part numbers.
          - Finalize and verify both summary-card.zh.yaml and full-report.zh.yaml for every selected report before returning. A translated cache without both final overlays is a failure, not partial success.
          - Do not run any git command (git add, git commit, git push, git stash, git checkout, etc.) at any point; leave generated Chinese overlays unstaged. The workflow itself owns commit/push decisions.
          EOF
          )
          mkdir -p "$RUNNER_TEMP/copilot-logs"
          COPILOT_LOG="$RUNNER_TEMP/copilot-logs/translate-zh.log"
          copilot_args=(--yolo --autopilot --model "$MODEL")
          if [ -n "$EFFORT" ]; then
            copilot_args+=(--effort "$EFFORT")
          fi
          copilot "${copilot_args[@]}" -p "$PROMPT" 2>&1 | tee "$COPILOT_LOG"
          {
            echo
            echo "### Copilot run stats"
            if [ -s "$COPILOT_LOG" ]; then
              tail -n 20 "$COPILOT_LOG" | grep -iE '^(changes?|requests?|tokens?)\b' | sed 's/^/- /' || echo "- (no stats line emitted)"
            else
              echo "- (no Copilot output captured)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare source-anchored editorial pass
        id: editorial_targets
        if: steps.targets.outputs.count != '0'
        env:
          REPORT_IDS: ${{ steps.targets.outputs.reportIds }}
        run: |
          set -euo pipefail
          editorial_reports=()
          while IFS= read -r report; do
            [ -z "$report" ] && continue
            if [ ! -f "reports/$report/summary-card.zh.yaml" ] || [ ! -f "reports/$report/full-report.zh.yaml" ]; then
              echo "::warning::Skipping editorial pass for incomplete draft $report."
              continue
            fi
            if npm run translate:zh -- editor-init "$report" --force; then
              editorial_reports+=("$report")
            else
              echo "::warning::Skipping editorial pass because the validated checkpoint could not be prepared for $report."
              npm run translate:zh -- cleanup "$report" || true
            fi
          done <<< "$REPORT_IDS"
          {
            echo "count=${#editorial_reports[@]}"
            echo "reportIds<<REPORTS"
            printf '%s\n' "${editorial_reports[@]}"
            echo "REPORTS"
          } >> "$GITHUB_OUTPUT"

      - name: Edit validated Chinese drafts
        id: editor
        if: steps.editorial_targets.outputs.count != '0'
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          REPORT_IDS: ${{ steps.editorial_targets.outputs.reportIds }}
        run: |
          set -euo pipefail
          PROMPT=$(cat <<EOF
          Perform the mandatory source-anchored Chinese editorial pass for these reports:
          $REPORT_IDS

          For each report:
          - Follow the translate-zh skill's Mandatory editorial pass and translation philosophy.
          - Read the complete English summary-card.yaml and full-report.yaml plus the complete validated Chinese cache created by editor-init.
          - Enumerate the actual cached part files. Edit only .translate-cache/<runId>/summary-card.translate.yaml and its existing parts/part.NNN.yaml files.
          - Compare every reader-facing Chinese leaf with its corresponding English source. Rewrite awkward or generic Chinese from the factual proposition, not English clause order.
          - Preserve exact schema, numbers, metric identity, dates, proper nouns, hedges, attribution, conditions, polarity, causal direction, and boundaries.
          - Do not run translation scripts and do not edit final files under reports/. The workflow will lint, finalize, strictly validate, and either accept or roll back your edits.
          - Do not run any git command.
          EOF
          )
          mkdir -p "$RUNNER_TEMP/copilot-logs"
          COPILOT_LOG="$RUNNER_TEMP/copilot-logs/translate-zh-editor.log"
          copilot --yolo --autopilot --model gpt-6-luna -p "$PROMPT" 2>&1 | tee "$COPILOT_LOG"

      - name: Validate or roll back editorial pass
        if: always() && steps.editorial_targets.outputs.count != '0'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          REPORT_IDS: ${{ steps.editorial_targets.outputs.reportIds }}
        run: |
          set -euo pipefail
          accepted=0
          repaired=0
          restored=0
          validate_editor() {
            local report="$1"
            npm run translate:zh -- lint-parts "$report" \
              && npm run translate:zh -- finalize-summary "$report" --skip-quality \
              && npm run translate:zh -- finalize-full "$report" --keep-cache --skip-quality \
              && npm run translate:zh -- editor-accept "$report"
          }
          while IFS= read -r report; do
            [ -z "$report" ] && continue
            if validate_editor "$report"; then
              accepted=$((accepted + 1))
            else
              echo "::warning::Editorial pass failed strict validation for $report; attempting one targeted repair."
              REPAIR_PROMPT=$(cat <<EOF
              Strict editorial validation failed for report $report.

              Perform one bounded source-anchored repair:
              - Read .translate-cache/$report/editor-findings.json first. It contains every strict finding across both summary and full report; repair every error in that file, not only the first visible console failure.
              - Read each failing English source leaf, its current Chinese final leaf, and the corresponding cached leaf under .translate-cache/$report.
              - Edit only .translate-cache/$report/summary-card.translate.yaml and existing .translate-cache/$report/parts/part.NNN.yaml files.
              - Repair every reported semantic or strict-style failure. Preserve exact numbers, metric identity, dates, proper nouns, uncertainty, attribution, conditions, polarity, and causal direction.
              - If you run check-translation-quality.mjs for confirmation, use --strict-editor --format json and inspect the complete JSON issue list.
              - Do not edit reports/$report/*.zh.yaml directly. Do not run editor-accept, editor-restore, cleanup, or any git command. The workflow will finalize and validate once more.
          EOF
              )
              REPAIR_LOG="$RUNNER_TEMP/copilot-logs/translate-zh-editor-repair-$report.log"
              if copilot --yolo --autopilot --model gpt-6-luna -p "$REPAIR_PROMPT" 2>&1 | tee "$REPAIR_LOG" \
                && validate_editor "$report"; then
                accepted=$((accepted + 1))
                repaired=$((repaired + 1))
              else
                echo "::warning::Editorial repair failed strict validation for $report; restoring the validated draft."
                npm run translate:zh -- editor-restore "$report"
                restored=$((restored + 1))
              fi
            fi
          done <<< "$REPORT_IDS"
          {
            echo
            echo "### Source-anchored editorial pass"
            echo "- Editor model: gpt-6-luna"
            echo "- Accepted: $accepted"
            echo "- Accepted after targeted repair: $repaired"
            echo "- Rolled back safely: $restored"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage new translated files artifact
        if: always() && steps.targets.outputs.count != '0'
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/translated-zh-artifact"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1 || [ ! -d reports ]; then
            echo "No reports directory was available to package."
            exit 0
          fi

          copied=0
          while IFS= read -r -d '' entry; do
            status="${entry:0:2}"
            path="${entry:3}"
            case "$status" in
              '??'|A*) ;;
              *) continue ;;
            esac
            case "$path" in
              reports/*/summary-card.zh.yaml|reports/*/full-report.zh.yaml) ;;
              *) continue ;;
            esac
            [ -f "$path" ] || continue
            mkdir -p "$ARTIFACT_DIR/$(dirname "$path")"
            cp "$path" "$ARTIFACT_DIR/$path"
            copied=$((copied + 1))
          done < <(git status --porcelain=v1 -z --untracked-files=all -- reports/)

          if [ "$copied" -eq 0 ]; then
            echo "No newly-created translated zh overlay files were found."
          fi
          {
            echo
            echo "### Preserved translated files artifact"
            echo "- Artifact: translated-zh-${{ github.run_id }}"
            echo "- New translated files copied: $copied"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload translated files artifact
        if: always() && steps.targets.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: translated-zh-${{ github.run_id }}
          path: ${{ runner.temp }}/translated-zh-artifact/
          retention-days: 14
          if-no-files-found: ignore

      - name: Verify selected translations
        if: steps.targets.outputs.count != '0'
        env:
          REPORT_IDS: ${{ steps.targets.outputs.reportIds }}
        run: |
          set -euo pipefail
          while IFS= read -r report; do
            [ -z "$report" ] && continue
            node .agents/skills/translate-zh/scripts/check-translation.mjs "reports/$report" --strict --require-final
          done <<< "$REPORT_IDS"

      - name: Validate reports and website build
        if: steps.targets.outputs.count != '0'
        run: npm run validate

      - name: Commit and publish Chinese translations
        if: steps.targets.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.STARTUP_PAT }}
          REPORT_IDS: ${{ steps.targets.outputs.reportIds }}
        run: |
          set -euo pipefail
          git config user.name "startup-research-bot"
          git config user.email "startup-research-bot@users.noreply.github.com"
          BRANCH="${{ github.ref_name }}"
          STAMP="$(date -u +%F)"
          COUNT="${{ steps.targets.outputs.count }}"
          MESSAGE="chore(reports): translate zh batch $STAMP"

          while IFS= read -r report; do
            [ -z "$report" ] && continue
            git add "reports/$report/summary-card.zh.yaml" "reports/$report/full-report.zh.yaml"
          done <<< "$REPORT_IDS"

          if git diff --cached --quiet; then
            echo "No new or updated Chinese translations."
            exit 0
          fi
          git commit -m "$MESSAGE"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3 to $BRANCH"
            git fetch origin "$BRANCH"
            if ! git rebase --autostash "origin/$BRANCH"; then
              echo "Rebase failed; aborting and retrying." >&2
              git rebase --abort || true
              sleep $((attempt * 5))
              continue
            fi
            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed to $BRANCH on attempt $attempt."
              exit 0
            fi
            sleep $((attempt * 5))
          done

          PR_BRANCH="auto/translate-zh-${STAMP}-$(date -u +%H%M%S)"
          echo "Direct push to $BRANCH failed; pushing to $PR_BRANCH and opening PR." >&2
          git push origin "HEAD:$PR_BRANCH"
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh pr create --base "$BRANCH" --head "$PR_BRANCH" \
            --title "$MESSAGE" \
            --body "Automated Chinese translation batch for $COUNT report(s). Direct push to \`$BRANCH\` failed after 3 attempts; merging via PR instead."