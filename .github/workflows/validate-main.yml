name: Validate main

on:
  push:
    branches:
      - main
    paths:
      - "reports/**"
      - "website/**"
      - ".agents/skills/**"
      - ".github/workflows/validate-main.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: validate-and-deploy-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate reports and build website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install dependencies
        run: |
          npm ci || npm install --no-audit --no-fund
          npm --prefix website ci || npm --prefix website install --no-audit --no-fund

      - name: Run full validation
        run: npm run validate

      - name: Configure GitHub Pages publishing
        uses: actions/configure-pages@v6

      - name: Upload validated site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Publish validated site to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site artifact
        id: deployment
        uses: actions/deploy-pages@v5
