name: Validate main

on:
  push:
    branches:
      - main
    paths:
      - "reports/**"
      - "website/**"
      - ".agents/skills/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate reports and build website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install dependencies
        run: |
          npm ci || npm install --no-audit --no-fund
          npm --prefix website ci || npm --prefix website install --no-audit --no-fund

      - name: Run full validation
        run: npm run validate
